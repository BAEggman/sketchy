<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc"><title id="title">음양의 네 관계 — 의지·제약·증감·전환</title><desc id="desc">호근·서로 기대기 / 대립제약·서로 제한 / 소장·양이 변함 / 전화·성질이 바뀜</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><style>text{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#253b39}.small{fill:#65766d}.han{font-family:"Apple SD Gothic Neo","Noto Serif CJK KR",serif}</style><rect width="1280" height="850" fill="#faf7ef"/>
<text x="44" y="44" font-size="18" text-anchor="start" font-weight="400" style="fill:#64776d">음양오행  /  연결 도해</text>
<text x="44" y="91" font-size="34" text-anchor="start" font-weight="700">음양의 네 관계</text>
<line x1="44" y1="116" x2="1236" y2="116" stroke="#d8dfd7" stroke-width="2"/>
<rect x="55" y="160" width="570" height="270" rx="18" fill="#fffdf8" stroke="#d8dfd7" stroke-width="2"/>
<text x="79" y="202" font-size="27" text-anchor="start" font-weight="700">호근·서로 기대기</text>
<rect x="185" y="255" width="54" height="100" rx="18" fill="#dce8df" stroke="#d8dfd7" stroke-width="2"/>
<rect x="405" y="255" width="54" height="100" rx="18" fill="#7b9285" stroke="#d8dfd7" stroke-width="2"/>
<line x1="212" y1="362" x2="432" y2="362" stroke="#426f60" stroke-width="8"/>
<line x1="239" y1="300" x2="403" y2="300" stroke="#426f60" stroke-width="4" marker-end="url(#arrow)"/>
<line x1="405" y1="335" x2="243" y2="335" stroke="#426f60" stroke-width="4" marker-end="url(#arrow)"/>
<text x="340" y="404" font-size="23" text-anchor="middle" font-weight="400">서로 의지하고 서로 쓰인다</text>
<rect x="665" y="160" width="570" height="270" rx="18" fill="#fffdf8" stroke="#d8dfd7" stroke-width="2"/>
<text x="689" y="202" font-size="27" text-anchor="start" font-weight="700">대립제약·서로 제한</text>
<line x1="740" y1="315" x2="923" y2="315" stroke="#b75b4c" stroke-width="7" marker-end="url(#arrow)"/>
<line x1="1160" y1="315" x2="977" y2="315" stroke="#476d91" stroke-width="7" marker-end="url(#arrow)"/>
<line x1="950" y1="260" x2="950" y2="365" stroke="#426f60" stroke-width="8"/>
<text x="950" y="404" font-size="23" text-anchor="middle" font-weight="400">반대 작용으로 서로 제한한다</text>
<rect x="55" y="462" width="570" height="270" rx="18" fill="#fffdf8" stroke="#d8dfd7" stroke-width="2"/>
<text x="79" y="504" font-size="27" text-anchor="start" font-weight="700">소장·양이 변함</text>
<rect x="185" y="627" width="44" height="45" rx="18" fill="#637f70" stroke="#d8dfd7" stroke-width="2"/>
<rect x="255" y="562" width="44" height="110" rx="18" fill="#637f70" stroke="#d8dfd7" stroke-width="2"/>
<rect x="385" y="562" width="44" height="110" rx="18" fill="#637f70" stroke="#d8dfd7" stroke-width="2"/>
<rect x="455" y="627" width="44" height="45" rx="18" fill="#637f70" stroke="#d8dfd7" stroke-width="2"/>
<text x="340" y="706" font-size="23" text-anchor="middle" font-weight="400">같은 성질의 양이 늘거나 준다</text>
<rect x="665" y="462" width="570" height="270" rx="18" fill="#fffdf8" stroke="#d8dfd7" stroke-width="2"/>
<text x="689" y="504" font-size="27" text-anchor="start" font-weight="700">전화·성질이 바뀜</text>
<circle cx="815" cy="612" r="48" fill="#344a41" stroke="#4d6558" stroke-width="2" />
<circle cx="1085" cy="612" r="48" fill="#fffdf8" stroke="#4d6558" stroke-width="2" />
<line x1="875" y1="612" x2="1020" y2="612" stroke="#426f60" stroke-width="4" marker-end="url(#arrow)"/>
<text x="945" y="587" font-size="22" text-anchor="middle" font-weight="400">조건·극점</text>
<text x="950" y="706" font-size="23" text-anchor="middle" font-weight="400">조건을 갖추면 성질이 전환된다</text>
<text x="44" y="820" font-size="20" text-anchor="start" font-weight="400" style="fill:#6d7b73">연결을 읽은 뒤 아래 문항에서 답을 가리고 복원하세요.</text>
</svg>