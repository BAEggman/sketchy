<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc"><title id="title">전변 예방과 모자 보사 — 먼저 방향, 다음 강약</title><desc id="desc">간병·먼저 비를 돌봄 / 허·어미를 보함 / 실·자식을 사함 / 강한 쪽 억제 / 약한 쪽 지지</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><style>text{font-family:"Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;fill:#253b39}.small{fill:#65766d}.han{font-family:"Apple SD Gothic Neo","Noto Serif CJK KR",serif}</style><rect width="1280" height="850" fill="#faf7ef"/>
<text x="44" y="44" font-size="18" text-anchor="start" font-weight="400" style="fill:#64776d">음양오행  /  연결 도해</text>
<text x="44" y="91" font-size="34" text-anchor="start" font-weight="700">전변 예방과 모자 보사</text>
<line x1="44" y1="116" x2="1236" y2="116" stroke="#d8dfd7" stroke-width="2"/>
<rect x="55.0" y="165" width="382.6666666666667" height="270" rx="18" fill="#fffdf8" stroke="#d8dfd7" stroke-width="2"/>
<text x="80.0" y="210" font-size="25" text-anchor="start" font-weight="400">간병·먼저 비를 돌봄</text>
<text x="80.0" y="325" font-size="23" text-anchor="start" font-weight="400">간목 → 비토</text>
<text x="80.0" y="370" font-size="23" text-anchor="start" font-weight="400">전변 전에 비를 받침</text>
<rect x="453.6666666666667" y="165" width="382.6666666666667" height="270" rx="18" fill="#fffdf8" stroke="#d8dfd7" stroke-width="2"/>
<text x="478.6666666666667" y="210" font-size="25" text-anchor="start" font-weight="400">허·어미를 보함</text>
<text x="478.6666666666667" y="325" font-size="23" text-anchor="start" font-weight="400">폐금의 어미 = 비토</text>
<text x="478.6666666666667" y="370" font-size="23" text-anchor="start" font-weight="400">허즉보기모</text>
<rect x="852.3333333333334" y="165" width="382.6666666666667" height="270" rx="18" fill="#fffdf8" stroke="#d8dfd7" stroke-width="2"/>
<text x="877.3333333333334" y="210" font-size="25" text-anchor="start" font-weight="400">실·자식을 사함</text>
<text x="877.3333333333334" y="325" font-size="23" text-anchor="start" font-weight="400">간목의 자식 = 심화</text>
<text x="877.3333333333334" y="370" font-size="23" text-anchor="start" font-weight="400">실즉사기자</text>
<rect x="55.0" y="467" width="382.6666666666667" height="270" rx="18" fill="#fffdf8" stroke="#d8dfd7" stroke-width="2"/>
<text x="80.0" y="512" font-size="25" text-anchor="start" font-weight="400">강한 쪽 억제</text>
<text x="80.0" y="627" font-size="23" text-anchor="start" font-weight="400">태과가 주원인</text>
<text x="80.0" y="672" font-size="23" text-anchor="start" font-weight="400">억강 중심</text>
<rect x="453.6666666666667" y="467" width="382.6666666666667" height="270" rx="18" fill="#fffdf8" stroke="#d8dfd7" stroke-width="2"/>
<text x="478.6666666666667" y="512" font-size="25" text-anchor="start" font-weight="400">약한 쪽 지지</text>
<text x="478.6666666666667" y="627" font-size="23" text-anchor="start" font-weight="400">불급이 주원인</text>
<text x="478.6666666666667" y="672" font-size="23" text-anchor="start" font-weight="400">부약 중심</text>
<text x="44" y="820" font-size="20" text-anchor="start" font-weight="400" style="fill:#6d7b73">연결을 읽은 뒤 아래 문항에서 답을 가리고 복원하세요.</text>
</svg>