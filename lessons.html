다. 무쇠 펌프에서 물이 쏟아진다 — 쇠가 물을 낳고 물이 쇠를 적신다, 金水相生. 肺陰과 腎陰은 서로 기른다. 腎陰이 허해 肺와 腎의 陰이 함께 마를 때, 둘을 함께 자양한다.","box":[1748,430,229,280],"src":["OH-12-04","JS-REL-06-03"],"tts":"넷째 밭에는 사람이 없다. 무쇠 펌프에서 물이 쏟아진다, 쇠가 물을 낳고 물이 쇠를 적신다, 금수상생. 폐음과 신음은 서로 기른다. 신음이 허해 폐와 신의 음이 함께 마를 때, 둘을 함께 자양한다."},{"n":8,"obj":"흙둑을 깨며 기운 나무를 두 손으로 미는 일꾼 · 줄기를 말뚝에 맨 밧줄 · 금 간 흙둑","fact":"抑木扶土 — 肝木을 누르고 脾土를 붙든다: 肝旺脾虛","hook":"나무를 누르고(抑木) 흙을 붙듦(扶土)","say":"아랫줄 첫 밭. 나무가 기울어 흙둑을 깨뜨린다. 일꾼이 줄기를 두 손으로 밀어 누르고 밧줄로 말뚝에 매어, 흙둑이 더 무너지지 않게 붙든다 — 누를 억(抑), 도울 부(扶), 抑木扶土. 肝이 드세고 脾가 허할 때, 肝을 풀고 脾를 튼튼히 한다.","box":[55,754,445,373],"src":["OH-13-01"],"tts":"아랫줄 첫 밭. 나무가 기울어 흙둑을 깨뜨린다. 일꾼이 줄기를 두 손으로 밀어 누르고 밧줄로 말뚝에 매어, 흙둑이 더 무너지지 않게 붙든다, 누를 억, 도울 부, 억목부토. 간이 드세고 비가 허할 때, 간을 풀고 비를 튼튼히 한다."},{"n":9,"obj":"삽으로 흙을 퍼 올려 둑을 쌓는 일꾼 · 둑에 막힌 푸른 물","fact":"培土制水 — 脾土를 북돋아 水를 다스린다: 土虛水侮 · 水腫","hook":"흙을 북돋아(培土) 물을 막음(制水) · 넘치는 물 = 水腫","say":"둘째 밭. 일꾼이 삽으로 흙을 퍼 올려 둑을 높이고, 둑이 푸른 물을 막는다 — 培土制水. 土가 허해 물이 거꾸로 업신여기고 넘쳐 온몸이 붓는 水腫에, 脾를 補해 물을 다스린다. 가운뎃줄의 培土生金과 앞 두 글자가 같다 — 금을 낳으면 相生 치법, 물을 막으면 相剋 치법이다. 滋水涵木은 腎水가 허해 肝陽이 치솟을 때였다.","box":[610,790,438,353],"src":["OH-13-02","OHG-032"],"tts":"둘째 밭. 일꾼이 삽으로 흙을 퍼 올려 둑을 높이고, 둑이 푸른 물을 막는다, 배토제수. 토가 허해 물이 거꾸로 업신여기고 넘쳐 온몸이 붓는 수종에, 비를 보해 물을 다스린다. 가운뎃줄의 배토생금과 앞 두 글자가 같다, 금을 낳으면 상생 치법, 물을 막으면 상극 치법이다. 자수함목은 신수가 허해 간양이 치솟을 때였다."},{"n":10,"obj":"큰 쇠 가위로 무성한 나무를 치는 일꾼","fact":"佐金平木 = 淸金制木 — 肺金을 도와 肝木을 고른다: 木火刑金","hook":"쇠 가위를 써서(佐金) 나무를 고르게 침(平木)","say":"셋째 밭. 일꾼이 큰 쇠 가위로 무성한 나무를 고르게 친다 — 도울 좌(佐), 평평할 평(平), 佐金平木. 淸金制木이라고도 한다. 肝의 불이 肺를 상하게 하는 木火刑金, 肝火犯肺에 쓴다. 肺의 맑게 내리는 힘을 도와 肝을 누른다.","box":[1056,754,417,352],"src":["OH-13-03","OHG-010"],"tts":"셋째 밭. 일꾼이 큰 쇠 가위로 무성한 나무를 고르게 친다, 도울 좌, 평평할 평, 좌금평목. 청금제목이라고도 한다. 간의 불이 폐를 상하게 하는 목화형금, 간화범폐에 쓴다. 폐의 맑게 내리는 힘을 도와 간을 누른다."},{"n":11,"obj":"밭 아래쪽 모닥불에서 장작을 갈퀴로 긁어내는 일꾼 · 밭 위쪽에서 대통 물로 채워지는 못","fact":"瀉南補北 — 心火를 덜고 腎水를 채운다: 腎陰虛 · 心火旺","hook":"아래 = 南 = 불을 덜어 냄(瀉) · 위 = 北 = 물을 채움(補)","say":"넷째 밭. 아래쪽 남쪽에는 모닥불, 위쪽 북쪽에는 못이 있다. 일꾼은 불에서 장작을 긁어내고, 못에는 대통으로 물이 채워진다 — 남쪽을 덜고 북쪽을 채운다, 瀉南補北. 南은 心火, 北은 腎水. 腎陰이 허하고 心火가 드세어 心과 腎이 사귀지 못할 때 — 心腎不交, 水火未濟 — 心火를 瀉하고 腎水를 補한다.","box":[1583,739,438,404],"src":["OH-13-04","OHG2-015"],"tts":"넷째 밭. 아래쪽 남쪽에는 모닥불, 위쪽 북쪽에는 못이 있다. 일꾼은 불에서 장작을 긁어내고, 못에는 대통으로 물이 채워진다, 남쪽을 덜고 북쪽을 채운다, 사남보북. 남은 심화, 북은 신수. 신음이 허하고 심화가 드세어 심과 신이 사귀지 못할 때, 심신불교, 수화미제, 심화를 사하고 신수를 보한다."},{"n":12,"kind":"review","obj":"텃밭 세 줄 — 윗줄 셋 · 가운뎃줄 넷 · 아랫줄 넷","fact":"相生: 滋水涵木·益火生土·培土生金·金水相生 / 相剋: 抑木扶土·培土制水·佐金平木·瀉南補北","hook":"물 대기 · 아궁이 · 금 돋는 흙 · 펌프 / 나무 묶기 · 둑 · 가위 · 불 덜고 못 채우기","say":"다시 본다. 윗줄 — 병든 나무 곁 흙부터 다지기 當先實脾, 나무에 거름 補其母, 열매 따기 瀉其子. 가운뎃줄 相生 — 물 대기 滋水涵木, 아궁이 불 益火生土, 흙에서 금 培土生金, 쇠 펌프 金水相生. 아랫줄 相剋 — 나무 누르고 흙 붙들기 抑木扶土, 둑 쌓기 培土制水, 쇠 가위 佐金平木, 불 덜고 못 채우기 瀉南補北.","box":[[295,0,1574,385],[75,307,1903,409],[55,739,1966,404]],"src":[],"tts":"다시 본다. 윗줄, 병든 나무 곁 흙부터 다지기 당선실비, 나무에 거름 보기모, 열매 따기 사기자. 가운뎃줄 상생, 물 대기 자수함목, 아궁이 불 익화생토, 흙에서 금 배토생금, 쇠 펌프 금수상생. 아랫줄 상극, 나무 누르고 흙 붙들기 억목부토, 둑 쌓기 배토제수, 쇠 가위 좌금평목, 불 덜고 못 채우기 사남보북."}],"has_image":true},{"id":"yyox-11","title":"八卦 ① 여덟 괘의 象 — 自然·家族·身體(近取諸身)","place":"등 뒤에 그림 가리개를 세운 대가족 잔칫상","image":"images/lessons/yyox-11.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"한 줄로 앉은 대가족 여덟 사람 — 저마다 등 뒤에 그림 한 폭짜리 가리개","fact":"八卦의 象 — 自然(등 뒤 가리개 그림) · 家族(앉은 사람) · 身體(크게 그린 몸)","hook":"제 등 뒤 그림 = 自然 · 식구 여덟 = 家族 · 유난히 큰 몸 한 곳 = 近取諸身","say":"대가족 여덟이 한 줄로 앉아 잔칫상을 받았다. 식구 여덟이 八卦다. 사람마다 등 뒤에 그림 한 폭짜리 가리개를 세웠다. 등 뒤 그림은 그 괘의 自然, 앉은 사람은 家族, 유난히 크게 그려진 몸 한 곳은 가까이 제 몸에서 취한 象 — 近取諸身이다. 가운데 부모부터 보고, 아들은 왼쪽으로, 딸은 오른쪽으로 간다.","box":null,"src":[],"tts":"대가족 여덟이 한 줄로 앉아 잔칫상을 받았다. 식구 여덟이 팔괘다. 사람마다 등 뒤에 그림 한 폭짜리 가리개를 세웠다. 등 뒤 그림은 그 괘의 자연, 앉은 사람은 가족, 유난히 크게 그려진 몸 한 곳은 가까이 제 몸에서 취한 상, 근취제신이다. 가운데 부모부터 보고, 아들은 왼쪽으로, 딸은 오른쪽으로 간다."},{"n":1,"obj":"가운데 흰 수염 아버지 — 풍선처럼 큰 머리 · 등 뒤 가리개는 해 뜬 하늘","fact":"乾 = 天 · 父 · 首","hook":"하늘에 닿은 큰 머리의 아버지 = 天·父·首","say":"가운데 흰 수염 아버지. 머리가 풍선처럼 커서 등 뒤의 하늘 그림을 가렸고, 그 위로 해가 떴다. 乾괘는 하늘이고 아버지이고 머리다 — 하늘 천(天), 아비 부(父), 머리 수(首). 하늘처럼 맨 위에서 다스리는 것이 머리다.","box":[[797,455,251,467],[822,372,210,334]],"src":["PG-02-01","PG-05-01"],"tts":"가운데 흰 수염 아버지. 머리가 풍선처럼 커서 등 뒤의 하늘 그림을 가렸고, 그 위로 해가 떴다. 건괘는 하늘이고 아버지이고 머리다, 하늘 천, 아비 부, 머리 수. 하늘처럼 맨 위에서 다스리는 것이 머리다."},{"n":2,"obj":"아버지 오른쪽의 어머니 — 공처럼 불룩한 배 · 등 뒤 가리개는 갈아 놓은 밭","fact":"坤 = 地 · 母 · 腹","hook":"밭 그림 앞, 배가 불룩한 어머니 = 地·母·腹","say":"아버지 옆의 어머니. 붉은 치마 앞으로 배가 공처럼 불룩하고, 등 뒤에는 갈아 놓은 밭 그림이 있다. 坤괘는 땅이고 어머니이고 배다 — 땅 지(地), 어미 모(母), 배 복(腹). 땅처럼 만물을 담아 기르는 것이 배다.","box":[[1049,540,258,382],[1071,372,206,334]],"src":["PG-02-02","PG-05-02"],"tts":"아버지 옆의 어머니. 붉은 치마 앞으로 배가 공처럼 불룩하고, 등 뒤에는 갈아 놓은 밭 그림이 있다. 곤괘는 땅이고 어머니이고 배다, 땅 지, 어미 모, 배 복. 땅처럼 만물을 담아 기르는 것이 배다."},{"n":3,"obj":"아버지 왼쪽의 맏아들 — 앞으로 내민 커다란 맨발바닥 둘 · 등 뒤 가리개는 번개 치는 먹구름","fact":"震 = 雷 · 長男 · 足","hook":"번개 앞, 발이 큰 맏아들 = 雷·長男·足","say":"아버지 왼쪽의 맏아들. 앞으로 내민 맨발바닥이 엄청나게 크고, 등 뒤에는 번개 치는 먹구름 그림이 있다. 震괘는 우레이고 長男이고 발이다 — 우레 뇌(雷), 발 족(足). 우레처럼 떨쳐 움직이는 것이 발이다.","box":[[545,530,251,392],[577,372,210,334]],"src":["PG-02-03","PG-05-03"],"tts":"아버지 왼쪽의 맏아들. 앞으로 내민 맨발바닥이 엄청나게 크고, 등 뒤에는 번개 치는 먹구름 그림이 있다. 진괘는 우레이고 장남이고 발이다, 우레 뇌, 발 족. 우레처럼 떨쳐 움직이는 것이 발이다."},{"n":4,"obj":"그 왼쪽의 둘째 아들 — 부채만 한 두 귀 · 등 뒤 가리개는 굽이쳐 흐르는 물","fact":"坎 = 水 · 中男 · 耳","hook":"물 그림 앞, 귀가 큰 둘째 아들 = 水·中男·耳","say":"그 왼쪽 둘째 아들은 두 귀가 부채만 하고, 등 뒤에는 굽이쳐 흐르는 물 그림이 있다. 坎괘는 물이고 中男이고 귀다 — 물 수(水), 귀 이(耳). 물이 구덩이로 흘러들듯 소리가 귀로 흘러든다.","box":[[324,552,221,330],[324,372,213,334]],"src":["PG-02-05","PG-05-05"],"tts":"그 왼쪽 둘째 아들은 두 귀가 부채만 하고, 등 뒤에는 굽이쳐 흐르는 물 그림이 있다. 감괘는 물이고 중남이고 귀다, 물 수, 귀 이. 물이 구덩이로 흘러들듯 소리가 귀로 흘러든다."},{"n":5,"obj":"맨 왼쪽의 막내아들 — 제 머리보다 큰 두 손 · 등 뒤 가리개는 높은 산","fact":"艮 = 山 · 少男 · 手","hook":"산 그림 앞, 손이 큰 막내아들 = 山·少男·手","say":"맨 왼쪽 막내아들은 양옆으로 벌린 두 손이 제 머리보다 크고, 등 뒤에는 높은 산 그림이 있다. 艮괘는 산이고 少男이고 손이다 — 메 산(山), 손 수(手). 산처럼 막아서 멈추게 하는 것이 손이다.","box":[[40,651,291,271],[84,372,212,334]],"src":["PG-02-07","PG-05-07"],"tts":"맨 왼쪽 막내아들은 양옆으로 벌린 두 손이 제 머리보다 크고, 등 뒤에는 높은 산 그림이 있다. 간괘는 산이고 소남이고 손이다, 메 산, 손 수. 산처럼 막아서 멈추게 하는 것이 손이다."},{"n":6,"obj":"어머니 오른쪽의 맏딸 — 책상다리한 굵은 맨 넓적다리 · 등 뒤 가리개는 바람에 휘는 나무","fact":"巽 = 風 · 長女 · 股","hook":"바람 그림 곁, 넓적다리가 굵은 맏딸 = 風·長女·股","say":"어머니 오른쪽의 맏딸. 책상다리한 맨 넓적다리가 몸통보다 굵고, 등 뒤에는 바람에 휘는 나무 그림이 있다. 巽괘는 바람이고 長女이고 넓적다리다 — 바람 풍(風), 넓적다리 고(股). 발을 따라 움직이는 것이 넓적다리다. 맏아들의 발과 맏딸의 넓적다리가 짝이다.","box":[[1280,548,329,375],[1312,372,210,334]],"src":["PG-02-04","PG-05-04"],"tts":"어머니 오른쪽의 맏딸. 책상다리한 맨 넓적다리가 몸통보다 굵고, 등 뒤에는 바람에 휘는 나무 그림이 있다. 손괘는 바람이고 장녀이고 넓적다리다, 바람 풍, 넓적다리 고. 발을 따라 움직이는 것이 넓적다리다. 맏아들의 발과 맏딸의 넓적다리가 짝이다."},{"n":7,"obj":"그 오른쪽의 둘째 딸 — 동그랗게 부릅뜬 큰 두 눈 · 등 뒤 가리개는 타오르는 불","fact":"離 = 火 · 中女 · 目","hook":"불 그림 곁, 눈이 큰 둘째 딸 = 火·中女·目","say":"그 오른쪽 둘째 딸은 두 눈을 동그랗게 크게 부릅떴고, 등 뒤에는 타오르는 불 그림이 있다. 離괘는 불이고 中女이고 눈이다 — 불 화(火), 눈 목(目). 불처럼 밝게 비추어 보는 것이 눈이다. 둘째 아들의 귀와 둘째 딸의 눈이 짝이다.","box":[[1561,581,241,342],[1557,372,210,334]],"src":["PG-02-06","PG-05-06"],"tts":"그 오른쪽 둘째 딸은 두 눈을 동그랗게 크게 부릅떴고, 등 뒤에는 타오르는 불 그림이 있다. 이괘는 불이고 중녀이고 눈이다, 불 화, 눈 목. 불처럼 밝게 비추어 보는 것이 눈이다. 둘째 아들의 귀와 둘째 딸의 눈이 짝이다."},{"n":8,"obj":"맨 오른쪽의 막내딸 — 크게 벌리고 웃는 입 · 등 뒤 가리개는 갈대 난 못","fact":"兌 = 澤 · 少女 · 口","hook":"못 그림 곁, 입 벌려 웃는 막내딸 = 澤·少女·口","say":"맨 오른쪽 막내딸은 입을 크게 벌리고 웃고, 등 뒤에는 갈대 난 못 그림이 있다. 兌괘는 못이고 少女이고 입이다 — 못 택(澤), 입 구(口). 兌는 기쁨이라 입이 웃는다. 막내아들의 손과 막내딸의 입이 짝이다.","box":[[1792,651,226,271],[1799,372,210,334]],"src":["PG-02-08","PG-05-08"],"tts":"맨 오른쪽 막내딸은 입을 크게 벌리고 웃고, 등 뒤에는 갈대 난 못 그림이 있다. 태괘는 못이고 소녀이고 입이다, 못 택, 입 구. 태는 기쁨이라 입이 웃는다. 막내아들의 손과 막내딸의 입이 짝이다."},{"n":9,"kind":"review","obj":"가리개 여덟과 식구 여덟 — 왼쪽부터 막내아들 · 둘째 아들 · 맏아들 · 아버지 · 어머니 · 맏딸 · 둘째 딸 · 막내딸","fact":"乾首·坤腹·震足·巽股·坎耳·離目·艮手·兌口 / 天地雷風水火山澤","hook":"머리·배 / 발·귀·손(아들) / 넓적다리·눈·입(딸)","say":"다시 본다. 가운데 큰 머리 아버지 乾괘 — 하늘과 머리. 불룩한 배 어머니 坤괘 — 땅과 배. 왼쪽으로 큰 발 맏아들 震괘 — 우레, 큰 귀 둘째 坎괘 — 물, 큰 손 막내 艮괘 — 산. 오른쪽으로 넓적다리 맏딸 巽괘 — 바람, 큰 눈 둘째 離괘 — 불, 웃는 입 막내 兌괘 — 못.","box":[[84,372,1926,334],[40,455,1977,467]],"src":[],"tts":"다시 본다. 가운데 큰 머리 아버지 건괘, 하늘과 머리. 불룩한 배 어머니 곤괘, 땅과 배. 왼쪽으로 큰 발 맏아들 진괘, 우레, 큰 귀 둘째 감괘, 물, 큰 손 막내 간괘, 산. 오른쪽으로 넓적다리 맏딸 손괘, 바람, 큰 눈 둘째 이괘, 불, 웃는 입 막내 태괘, 못."}],"has_image":true},{"id":"yyox-12","title":"八卦 ② 先天(伏羲) — 一乾天…八坤地 번호와 마주 보는 네 쌍(對待)","place":"伏羲의 팔각정 바닥","image":"images/lessons/yyox-12.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"위에서 내려다본 여덟 모 정자 바닥 — 여덟 쪽 그림과 한가운데 뱀 몸의 伏羲","fact":"先天八卦(伏羲) — 번호 一乾…八坤 · 마주 보는 네 쌍(對待) · 위가 南","hook":"해 뜬 위쪽 = 南 · 흰 타일 = 번호 · 현판 = 괘의 획 · 마주 보는 쪽 = 짝","say":"伏羲의 팔각정 바닥을 위에서 내려다본다. 한가운데 뱀의 몸을 한 伏羲가 서 있고, 바닥은 여덟 쪽 그림으로 나뉘었다. 太極이 陰陽을 낳고, 陰陽이 四象을, 四象이 八卦를 낳는다. 그 여덟 괘를 伏羲가 벌여 놓은 것이 先天八卦다. 옛 그림은 남쪽을 위에 둔다 — 해가 뜬 위쪽이 남, 아래가 북, 왼쪽이 동, 오른쪽이 서다. 쪽마다 현판에는 괘의 세 줄 획이, 흰 타일에는 번호가 있다.","box":null,"src":[],"tts":"복희의 팔각정 바닥을 위에서 내려다본다. 한가운데 뱀의 몸을 한 복희가 서 있고, 바닥은 여덟 쪽 그림으로 나뉘었다. 태극이 음양을 낳고, 음양이 사상을, 사상이 팔괘를 낳는다. 그 여덟 괘를 복희가 벌여 놓은 것이 선천팔괘다. 옛 그림은 남쪽을 위에 둔다, 해가 뜬 위쪽이 남, 아래가 북, 왼쪽이 동, 오른쪽이 서다. 쪽마다 현판에는 괘의 세 줄 획이, 흰 타일에는 번호가 있다."},{"n":1,"obj":"쪽마다 놓인 흰 점 타일 여덟 — 맨 위 점 하나, 왼쪽으로 내려가며 둘·셋·넷, 오른쪽 위에서 내려가며 다섯·여섯·일곱, 맨 아래 여덟","fact":"一乾天 二兌澤 三離火 四震雷 五巽風 六坎水 七艮山 八坤地","hook":"위 하나 → 왼쪽을 내려가며 둘 셋 넷 → 오른쪽 위로 건너가 다섯 여섯 일곱 → 아래 여덟","say":"흰 타일의 점을 센다. 맨 위 하늘이 하나. 왼쪽으로 내려가며 못이 둘, 불이 셋, 우레가 넷. 다시 오른쪽 위로 건너가 바람이 다섯, 내려가며 물이 여섯, 산이 일곱, 맨 아래 땅이 여덟이다. 一乾天, 二兌澤, 三離火, 四震雷, 五巽風, 六坎水, 七艮山, 八坤地. 왼쪽 넷도 오른쪽 넷도 위에서 아래로 센다.","box":[[1096,20,112,112],[355,160,112,112],[238,396,112,112],[342,891,112,112],[1583,160,112,112],[1699,396,112,112],[1594,892,112,112],[1096,1013,112,112]],"src":["PG-01"],"tts":"흰 타일의 점을 센다. 맨 위 하늘이 하나. 왼쪽으로 내려가며 못이 둘, 불이 셋, 우레가 넷. 다시 오른쪽 위로 건너가 바람이 다섯, 내려가며 물이 여섯, 산이 일곱, 맨 아래 땅이 여덟이다. 일건천, 이태택, 삼리화, 사진뢰, 오손풍, 육감수, 칠간산, 팔곤지. 왼쪽 넷도 오른쪽 넷도 위에서 아래로 센다."},{"n":2,"obj":"가운데 伏羲 곁에 앉은 꼬리 많은 흰 여우(구미호) · 마주 보는 맨 위 타일(점 하나)과 맨 아래 타일(점 여덟)","fact":"마주 보는 짝의 합은 언제나 9 — 乾1·坤8 / 兌2·艮7 / 離3·坎6 / 震4·巽5","hook":"구미호의 구(九) = 아홉 · 맞은편 번호 = 9에서 빼기","say":"伏羲 곁에 꼬리가 여럿 달린 흰 여우, 구미호가 앉았다 — 아홉 구(九). 마주 보는 두 타일의 점을 더하면 언제나 아홉이다. 맨 위 하나와 맨 아래 여덟, 못의 둘과 산의 일곱, 불의 셋과 물의 여섯, 우레의 넷과 바람의 다섯. 한쪽 번호를 알면 맞은편은 아홉에서 빼면 된다.","box":[[1045,612,120,100],[1096,20,112,112],[1096,1013,112,112]],"src":[],"tts":"복희 곁에 꼬리가 여럿 달린 흰 여우, 구미호가 앉았다, 아홉 구. 마주 보는 두 타일의 점을 더하면 언제나 아홉이다. 맨 위 하나와 맨 아래 여덟, 못의 둘과 산의 일곱, 불의 셋과 물의 여섯, 우레의 넷과 바람의 다섯. 한쪽 번호를 알면 맞은편은 아홉에서 빼면 된다."},{"n":3,"obj":"뱀 몸의 伏羲 — 한 손은 위쪽을 가리키고 다른 손은 아래로 내림 · 맨 위 쪽 그림은 해 뜬 하늘 · 맨 아래 쪽 그림은 갈아 놓은 흙","fact":"天地定位 — 乾(南, 위) ↔ 坤(北, 아래)","hook":"한 손은 위 하늘로, 한 손은 아래 땅으로 = 하늘과 땅이 제자리를 잡음","say":"伏羲가 한 손으로 위의 하늘을 가리키고, 다른 손은 아래의 땅 쪽으로 내렸다. 하늘과 땅이 제자리를 잡았다 — 天地定位. 乾괘가 위쪽 남, 坤괘가 아래쪽 북에서 마주 본다. 先天의 네 원리 가운데 첫째다. 나머지 셋은 山澤通氣, 雷風相薄, 水火不相射다.","box":[[862,372,327,366],[764,0,533,418],[764,721,526,422]],"src":["PG-03"],"tts":"복희가 한 손으로 위의 하늘을 가리키고, 다른 손은 아래의 땅 쪽으로 내렸다. 하늘과 땅이 제자리를 잡았다, 천지정위. 건괘가 위쪽 남, 곤괘가 아래쪽 북에서 마주 본다. 선천의 네 원리 가운데 첫째다. 나머지 셋은 산택통기, 뇌풍상박, 수화불상사다."},{"n":4,"obj":"왼쪽 위 쪽 그림 — 흰 김이 피어오르는 못 · 오른쪽 아래 쪽 그림 — 봉우리에 흰 김이 걸린 산","fact":"山澤通氣 — 兌(東南) ↔ 艮(西北)","hook":"못의 김이 맞은편 산봉우리에 걸림 = 기운이 통함","say":"왼쪽 위 못에서 흰 김이 피어오르고, 맞은편 오른쪽 아래 산봉우리에 같은 흰 김이 걸렸다. 산과 못이 기운을 통한다 — 山澤通氣. 兌괘가 동남, 艮괘가 서북에서 마주 본다.","box":[[368,137,584,360],[1110,641,562,497]],"src":[],"tts":"왼쪽 위 못에서 흰 김이 피어오르고, 맞은편 오른쪽 아래 산봉우리에 같은 흰 김이 걸렸다. 산과 못이 기운을 통한다, 산택통기. 태괘가 동남, 간괘가 서북에서 마주 본다."},{"n":5,"obj":"왼쪽 아래 쪽 그림 — 번개 치는 먹구름 · 오른쪽 위 쪽 그림 — 바람에 휘는 나무","fact":"雷風相薄 — 震(東北) ↔ 巽(西南)","hook":"번개와 바람이 마주 보고 다가붙음 = 相薄","say":"왼쪽 아래 먹구름에서 번개가 치고, 맞은편 오른쪽 위에서는 바람이 나무를 휜다. 우레와 바람이 서로 다가붙어 부딪친다 — 닥칠 박(薄), 雷風相薄. 震괘가 동북, 巽괘가 서남에서 마주 본다.","box":[[382,634,569,504],[1110,130,569,368]],"src":[],"tts":"왼쪽 아래 먹구름에서 번개가 치고, 맞은편 오른쪽 위에서는 바람이 나무를 휜다. 우레와 바람이 서로 다가붙어 부딪친다, 닥칠 박, 뇌풍상박. 진괘가 동북, 손괘가 서남에서 마주 본다."},{"n":6,"obj":"왼쪽 쪽 그림 — 불과 그 곁에 내려놓은 활·화살통 · 오른쪽 쪽 그림 — 물과 그 곁에 내려놓은 활·화살통","fact":"水火不相射 — 離(東, 왼쪽) ↔ 坎(西, 오른쪽)","hook":"불 곁에도 물 곁에도 내려놓은 활 = 서로 쏘지 않음","say":"왼쪽의 불 곁에도, 오른쪽의 물 곁에도 활과 화살통이 그냥 놓여 있다. 물과 불이 서로 쏘지 않는다 — 쏠 사(射), 水火不相射. 서로 해치지 않고 돕는다는 뜻이다. 離괘가 동, 坎괘가 서에서 마주 본다.","box":[[368,339,512,461],[1175,346,504,454]],"src":[],"tts":"왼쪽의 불 곁에도, 오른쪽의 물 곁에도 활과 화살통이 그냥 놓여 있다. 물과 불이 서로 쏘지 않는다, 쏠 사, 수화불상사. 서로 해치지 않고 돕는다는 뜻이다. 이괘가 동, 감괘가 서에서 마주 본다."},{"n":7,"obj":"현판 여덟의 세 줄 획 — 맨 위는 세 줄 다 이어짐 · 맨 아래는 세 줄 다 끊김 · 왼쪽은 가운데만 끊김 · 오른쪽은 가운데만 이어짐 · 왼쪽 위는 맨 윗줄만 끊김 · 오른쪽 아래는 맨 윗줄만 이어짐 · 오른쪽 위는 맨 아랫줄만 끊김 · 왼쪽 아래는 맨 아랫줄만 이어짐","fact":"三連乾·三絶坤·虛中離·中連坎·上絶兌·上連艮·下絶巽·下連震","hook":"이어진 줄 = 陽 · 끊긴 줄 = 陰 · 마주 보는 짝은 획이 정반대","say":"현판의 세 줄을 본다. 이어진 줄이 陽, 끊긴 줄이 陰이다. 맨 위 乾괘는 세 줄 다 이어져 三連, 맨 아래 坤괘는 세 줄 다 끊겨 三絶. 왼쪽 離괘는 가운데만 비어 虛中, 오른쪽 坎괘는 가운데만 이어져 中連. 왼쪽 위 兌괘는 윗줄만 끊겨 上絶, 맞은편 艮괘는 윗줄만 이어져 上連. 오른쪽 위 巽괘는 아랫줄만 끊겨 下絶, 맞은편 震괘는 아랫줄만 이어져 下連. 마주 보는 짝은 획이 정반대다. 왼쪽을 아래에서 위로 오르면 陽이 자란다 — 震괘 한 줄, 離괘와 兌괘 두 줄, 乾괘 세 줄. 陽息陰消다.","box":[[955,10,138,135],[430,44,166,166],[232,512,126,128],[423,961,154,154],[1461,44,166,166],[1693,512,126,128],[1474,961,154,154],[960,1008,130,128]],"src":[],"tts":"현판의 세 줄을 본다. 이어진 줄이 양, 끊긴 줄이 음이다. 맨 위 건괘는 세 줄 다 이어져 삼련, 맨 아래 곤괘는 세 줄 다 끊겨 삼절. 왼쪽 이괘는 가운데만 비어 허중, 오른쪽 감괘는 가운데만 이어져 중련. 왼쪽 위 태괘는 윗줄만 끊겨 상절, 맞은편 간괘는 윗줄만 이어져 상련. 오른쪽 위 손괘는 아랫줄만 끊겨 하절, 맞은편 진괘는 아랫줄만 이어져 하련. 마주 보는 짝은 획이 정반대다. 왼쪽을 아래에서 위로 오르면 양이 자란다, 진괘 한 줄, 이괘와 태괘 두 줄, 건괘 세 줄. 양식음소다."},{"n":8,"kind":"review","obj":"정자 바닥 한 바퀴 — 타일 여덟 · 현판 여덟 · 마주 보는 네 쌍 · 가운데 伏羲와 흰 여우","fact":"一乾天…八坤地(짝 합 9) · 天地定位·山澤通氣·雷風相薄·水火不相射","hook":"점 타일 · 구미호 · 두 손 · 흰 김 · 번개와 바람 · 내려놓은 활","say":"다시 본다. 타일은 위에서 하나, 왼쪽으로 둘 셋 넷, 오른쪽으로 다섯 여섯 일곱, 아래 여덟 — 마주 보면 아홉. 伏羲의 두 손은 天地定位, 못과 산의 흰 김은 山澤通氣, 번개와 바람은 雷風相薄, 내려놓은 활은 水火不相射.","box":[[137,0,1780,1143]],"src":[],"tts":"다시 본다. 타일은 위에서 하나, 왼쪽으로 둘 셋 넷, 오른쪽으로 다섯 여섯 일곱, 아래 여덟, 마주 보면 아홉. 복희의 두 손은 천지정위, 못과 산의 흰 김은 산택통기, 번개와 바람은 뇌풍상박, 내려놓은 활은 수화불상사."}],"has_image":true},{"id":"yyox-13","title":"八卦 ③ 後天(文王) — 帝出乎震, 한 해를 도는 여덟 동작과 방위","place":"물 위의 여덟 모 물레바퀴","image":"images/lessons/yyox-13.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"물 위에 누워 도는 여덟 모 물레바퀴 — 여덟 칸마다 자줏빛 옷에 금관을 쓴 임금","fact":"後天八卦(文王) — 帝出乎震, 東에서 시계 방향으로 한 해를 돈다 · 위가 南","hook":"자줏빛 임금 = 帝 · 한낮 해 뜬 위쪽 = 南 · 해 뜨는 왼쪽 = 東 · 현판 = 괘","say":"물 위에 여덟 모 물레바퀴가 누워 돈다. 칸마다 자줏빛 옷에 금관을 쓴 임금이 한 번씩 나온다 — 임금 제(帝). 왼쪽 해 뜨는 칸에서 시작해 시계 방향으로 한 바퀴, 하루가 지나고 한 해가 지난다. 文王의 後天八卦다. 옛 그림은 남쪽을 위에 둔다 — 한낮의 해가 뜬 위쪽이 남, 해 뜨는 왼쪽이 동, 해 지는 오른쪽이 서, 달 뜬 아래쪽이 북이다. 칸 끝 현판의 세 줄이 그 칸의 괘다.","box":null,"src":[],"tts":"물 위에 여덟 모 물레바퀴가 누워 돈다. 칸마다 자줏빛 옷에 금관을 쓴 임금이 한 번씩 나온다, 임금 제. 왼쪽 해 뜨는 칸에서 시작해 시계 방향으로 한 바퀴, 하루가 지나고 한 해가 지난다. 문왕의 후천팔괘다. 옛 그림은 남쪽을 위에 둔다, 한낮의 해가 뜬 위쪽이 남, 해 뜨는 왼쪽이 동, 해 지는 오른쪽이 서, 달 뜬 아래쪽이 북이다. 칸 끝 현판의 세 줄이 그 칸의 괘다."},{"n":1,"obj":"왼쪽 칸 — 해 뜰 때 열린 대문으로 걸어 나오는 임금 · 발치에 돋는 새싹 · 현판은 맨 아랫줄만 이어진 세 줄","fact":"帝出乎震 — 震 = 東(春), 만물이 나온다","hook":"해 뜨는 대문을 나서는 임금 = 出 · 새싹 = 봄","say":"왼쪽 칸. 해가 뜨고, 임금이 대문을 열고 나온다. 발치에는 새싹이 돋는다. 임금이 震괘에서 나온다 — 帝出乎震. 震괘는 동쪽이고 봄이다. 만물이 여기서 나온다. 여기서부터 震, 巽, 離, 坤, 兌, 乾, 坎, 艮의 차례로 돈다.","box":[[350,360,543,425],[249,503,142,141]],"src":["PG-06-04","PG-04"],"tts":"왼쪽 칸. 해가 뜨고, 임금이 대문을 열고 나온다. 발치에는 새싹이 돋는다. 임금이 진괘에서 나온다, 제출호진. 진괘는 동쪽이고 봄이다. 만물이 여기서 나온다. 여기서부터 진, 손, 이, 곤, 태, 건, 감, 간의 차례로 돈다."},{"n":2,"obj":"왼쪽 위 칸 — 긴 자를 대고 모종을 한 줄로 맞추는 임금 · 현판은 맨 아랫줄만 끊긴 세 줄","fact":"齊乎巽 — 巽 = 東南, 만물이 깨끗이 가지런해진다(潔齊)","hook":"자를 대고 줄 맞춘 모종 = 가지런할 齊","say":"왼쪽 위 칸. 임금이 긴 자를 대고 모종을 한 줄로 가지런히 맞춘다 — 가지런할 제(齊), 齊乎巽. 巽괘는 동남쪽이다. 만물이 깨끗하고 가지런해진다.","box":[[353,86,598,389],[460,118,146,142]],"src":["PG-06-05"],"tts":"왼쪽 위 칸. 임금이 긴 자를 대고 모종을 한 줄로 가지런히 맞춘다, 가지런할 제, 제호손. 손괘는 동남쪽이다. 만물이 깨끗하고 가지런해진다."},{"n":3,"obj":"맨 위 칸 — 한낮의 해 아래 꼬리 긴 꿩과 얼굴을 맞대고 서로 눈을 들여다보는 임금 · 현판은 가운데 줄만 끊긴 세 줄","fact":"相見乎離 — 離 = 南, 밝아서 만물이 서로 본다","hook":"한낮의 해 + 꿩과 눈을 맞춤 = 相見 · 꿩 = 離의 짐승","say":"맨 위 칸. 한낮의 해 아래 임금이 꼬리 긴 꿩과 얼굴을 맞대고 서로 눈을 들여다본다 — 相見乎離. 離괘는 남쪽이고 밝음이다. 밝아서 만물이 서로 본다. 꿩은 離괘의 짐승이고, 옆 칸에서 밭을 가는 소는 坤괘의 짐승이다.","box":[[786,65,504,382],[953,18,145,142]],"src":["PG-06-03"],"tts":"맨 위 칸. 한낮의 해 아래 임금이 꼬리 긴 꿩과 얼굴을 맞대고 서로 눈을 들여다본다, 상견호리. 이괘는 남쪽이고 밝음이다. 밝아서 만물이 서로 본다. 꿩은 이괘의 짐승이고, 옆 칸에서 밭을 가는 소는 곤괘의 짐승이다."},{"n":4,"obj":"오른쪽 위 칸 — 소에 쟁기를 메워 밭을 가는 임금 · 현판은 세 줄 다 끊김","fact":"致役乎坤 — 坤 = 西南, 땅이 만물을 기른다(致養)","hook":"소를 부려 밭을 갊 = 땅에 일을 맡김(役)","say":"오른쪽 위 칸. 임금이 소를 부려 밭을 간다. 땅에 일을 맡긴다 — 부릴 역(役), 致役乎坤. 坤괘는 서남쪽이다. 땅이 만물을 기른다.","box":[[1095,79,634,396],[1488,119,145,141]],"src":["PG-06-08"],"tts":"오른쪽 위 칸. 임금이 소를 부려 밭을 간다. 땅에 일을 맡긴다, 부릴 역, 치역호곤. 곤괘는 서남쪽이다. 땅이 만물을 기른다."},{"n":5,"obj":"오른쪽 칸 — 단풍잎 날리는 노을 속에 과일 바구니를 안고 입 벌려 웃는 임금 · 현판은 맨 윗줄만 끊긴 세 줄","fact":"說言乎兌 — 兌 = 西(正秋), 만물이 기뻐한다","hook":"가을 열매를 안고 웃음 = 기뻐할 說(열)","say":"오른쪽 칸. 단풍잎이 날리는 가을 저녁, 임금이 과일 바구니를 안고 입을 벌려 웃는다. 기뻐할 열 자를 써서 說言乎兌. 兌괘는 서쪽이고 한가을, 正秋다. 만물이 기뻐한다.","box":[[1160,353,562,432],[1672,504,141,140]],"src":["PG-06-02"],"tts":"오른쪽 칸. 단풍잎이 날리는 가을 저녁, 임금이 과일 바구니를 안고 입을 벌려 웃는다. 기뻐할 열 자를 써서 열언호태. 태괘는 서쪽이고 한가을, 정추다. 만물이 기뻐한다."},{"n":6,"obj":"오른쪽 아래 칸 — 칼을 들고 검은 그림자 무사와 싸우는 임금 · 현판은 세 줄 다 이어짐","fact":"戰乎乾 — 乾 = 西北, 陰과 陽이 서로 부딪친다(相薄)","hook":"검은 그림자와 칼싸움 = 戰 · 어둠(陰)과 밝음(陽)의 다툼","say":"오른쪽 아래 칸. 해 질 녘, 임금이 칼을 들고 검은 그림자 무사와 싸운다 — 싸울 전(戰), 戰乎乾. 乾괘는 서북쪽이다. 陰과 陽이 서로 부딪친다.","box":[[1110,634,605,418],[1488,904,133,128]],"src":["PG-06-01"],"tts":"오른쪽 아래 칸. 해 질 녘, 임금이 칼을 들고 검은 그림자 무사와 싸운다, 싸울 전, 전호건. 건괘는 서북쪽이다. 음과 양이 서로 부딪친다."},{"n":7,"obj":"맨 아래 칸 — 초승달 뜬 밤 물가에 주저앉아 이마를 짚은 지친 임금 · 곁에 내려놓은 연장 · 현판은 가운데 줄만 이어진 세 줄","fact":"勞乎坎 — 坎 = 北(水), 수고한 만물이 돌아가 쉰다(所歸)","hook":"한밤 물가에 지쳐 주저앉음 = 수고로울 勞","say":"맨 아래 칸. 한밤, 초승달 아래 물가에서 임금이 연장을 내려놓고 지쳐 주저앉아 이마를 짚는다 — 수고로울 노(勞), 勞乎坎. 坎괘는 정북쪽이고 물이다. 수고한 만물이 돌아가 쉰다.","box":[[771,706,512,360],[964,1013,131,124]],"src":["PG-06-06"],"tts":"맨 아래 칸. 한밤, 초승달 아래 물가에서 임금이 연장을 내려놓고 지쳐 주저앉아 이마를 짚는다, 수고로울 노, 노호감. 감괘는 정북쪽이고 물이다. 수고한 만물이 돌아가 쉰다."},{"n":8,"obj":"왼쪽 아래 칸 — 산 위 돌탑(망루) 꼭대기에 마지막 돌을 올리는 임금 · 현판은 맨 윗줄만 이어진 세 줄","fact":"成言乎艮 — 艮 = 東北, 끝을 이루고 다시 시작한다","hook":"돌탑의 마지막 돌 = 이룰 成 · 바로 옆이 다시 해 뜨는 칸","say":"왼쪽 아래 칸. 동트기 전 산 위에서 임금이 돌탑에 마지막 돌을 올린다 — 이룰 성(成), 成言乎艮. 艮괘는 동북쪽이고 산이다. 만물이 끝을 이루고 다시 시작한다. 바로 옆이 해 뜨는 震괘다.","box":[[353,634,584,418],[440,904,134,128]],"src":["PG-06-07"],"tts":"왼쪽 아래 칸. 동트기 전 산 위에서 임금이 돌탑에 마지막 돌을 올린다, 이룰 성, 성언호간. 간괘는 동북쪽이고 산이다. 만물이 끝을 이루고 다시 시작한다. 바로 옆이 해 뜨는 진괘다."},{"n":9,"obj":"여덟 모 물레바퀴 전체 — 왼쪽 칸부터 시계 방향으로 대문 · 모종 · 꿩 · 소 · 과일 바구니 · 칼싸움 · 주저앉기 · 돌탑","fact":"後天 차례 — 震→巽→離→坤→兌→乾→坎→艮 (東에서 시계 방향)","hook":"나오고 · 가지런 · 서로 보고 · 길러지고 · 기뻐하고 · 싸우고 · 쉬고 · 이룸","say":"바퀴를 한 바퀴 돌린다. 왼쪽에서 시작해 시계 방향으로 — 震, 巽, 離, 坤, 兌, 乾, 坎, 艮. 나오고, 가지런해지고, 서로 보고, 길러지고, 기뻐하고, 싸우고, 쉬고, 이룬다. 震괘가 봄, 離괘가 여름, 兌괘가 가을, 坎괘가 겨울이다.","box":[238,12,1581,1131],"src":[],"tts":"바퀴를 한 바퀴 돌린다. 왼쪽에서 시작해 시계 방향으로, 진, 손, 이, 곤, 태, 건, 감, 간. 나오고, 가지런해지고, 서로 보고, 길러지고, 기뻐하고, 싸우고, 쉬고, 이룬다. 진괘가 봄, 이괘가 여름, 태괘가 가을, 감괘가 겨울이다."},{"n":10,"obj":"바퀴 한가운데 굴대에 박힌 놋쇠 나침반","fact":"기본서 「방위」 = 後天 자리 · 先天은 乾南·坤北·離東·坎西","hook":"나침반 = 방위를 물으면 이 바퀴(後天)로 답한다","say":"굴대에는 놋쇠 나침반이 박혀 있다. 방위를 물으면 이 바퀴, 後天으로 답한다. 乾괘는 서북, 坎괘는 북, 艮괘는 동북, 震괘는 동, 巽괘는 동남, 離괘는 남, 坤괘는 서남, 兌괘는 서. 伏羲의 先天은 자리가 다르다 — 乾괘가 남, 坤괘가 북, 離괘가 동, 坎괘가 서. 先天은 마주 보는 짝이고, 後天은 돌아가는 차례다.","box":[894,440,267,267],"src":[],"tts":"굴대에는 놋쇠 나침반이 박혀 있다. 방위를 물으면 이 바퀴, 후천으로 답한다. 건괘는 서북, 감괘는 북, 간괘는 동북, 진괘는 동, 손괘는 동남, 이괘는 남, 곤괘는 서남, 태괘는 서. 복희의 선천은 자리가 다르다, 건괘가 남, 곤괘가 북, 이괘가 동, 감괘가 서. 선천은 마주 보는 짝이고, 후천은 돌아가는 차례다."},{"n":11,"kind":"review","obj":"물레바퀴 한 바퀴 — 여덟 칸의 임금과 현판 여덟 · 가운데 나침반","fact":"帝出乎震·齊乎巽·相見乎離·致役乎坤·說言乎兌·戰乎乾·勞乎坎·成言乎艮","hook":"東 震 → 東南 巽 → 南 離 → 西南 坤 → 西 兌 → 西北 乾 → 北 坎 → 東北 艮","say":"다시 돈다. 왼쪽 동, 대문을 나서는 震괘. 동남, 모종을 맞추는 巽괘. 위쪽 남, 꿩과 마주 본 離괘. 서남, 밭 가는 坤괘. 오른쪽 서, 웃는 兌괘. 서북, 싸우는 乾괘. 아래쪽 북, 주저앉은 坎괘. 동북, 돌탑의 艮괘. 가운데 나침반 — 방위는 後天으로 답한다.","box":[[238,12,1581,1131]],"src":[],"tts":"다시 돈다. 왼쪽 동, 대문을 나서는 진괘. 동남, 모종을 맞추는 손괘. 위쪽 남, 꿩과 마주 본 이괘. 서남, 밭 가는 곤괘. 오른쪽 서, 웃는 태괘. 서북, 싸우는 건괘. 아래쪽 북, 주저앉은 감괘. 동북, 돌탑의 간괘. 가운데 나침반, 방위는 후천으로 답한다."}],"has_image":true},{"id":"yyox-14","title":"五運六氣 ① 干支 五行과 同化年 — 天符·歲會·太一天符·同天符·同歲會","place":"六十甲子 관청 마당","image":"images/lessons/yyox-14.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"옛 관청 마당 — 지붕 끝의 깃발 열 · 대청의 판관 · 마당의 색 방석 다섯과 열두 짐승 · 샘가의 두 사람","fact":"干支 五行과 同化年 — 天符·歲會·太一天符·同天符·同歲會","hook":"깃발 = 天干 · 짐승 = 地支 · 옷 색 = 그해의 運 · 머리 위 = 司天 · 방석 = 年支 · 샘 = 在泉","say":"六十甲子를 다스리는 관청 마당이다. 지붕 끝의 깃발 열 개는 天干, 마당의 열두 짐승은 地支다. 사람의 옷 색은 그해의 運이고, 머리 위를 덮은 것은 하늘의 기운 司天, 깔고 앉은 방석은 그해 地支의 자리, 마당 구석의 샘은 땅속의 기운 在泉이다. 運이 이 가운데 어느 것과 같은 五行이 되는 해가 同化年이다. 같은 기운이 겹쳐 치우침이 커지는 해다.","box":null,"src":[],"tts":"육십갑자를 다스리는 관청 마당이다. 지붕 끝의 깃발 열 개는 천간, 마당의 열두 짐승은 지지다. 사람의 옷 색은 그해의 운이고, 머리 위를 덮은 것은 하늘의 기운 사천, 깔고 앉은 방석은 그해 지지의 자리, 마당 구석의 샘은 땅속의 기운 재천이다. 운이 이 가운데 어느 것과 같은 오행이 되는 해가 동화년이다. 같은 기운이 겹쳐 치우침이 커지는 해다."},{"n":1,"obj":"지붕 끝에 한 줄로 걸린 깃발 열 — 큰 것과 작은 것이 짝을 이룬 다섯 쌍: 왼쪽부터 초록 · 빨강 · 노랑 · 하양 · 검정","fact":"天干 형제배속 — 甲乙木·丙丁火·戊己土·庚辛金·壬癸水 (고정, 主運에 씀)","hook":"큰 깃발 = 형(陽干) · 작은 깃발 = 아우(陰干) · 색 = 五行","say":"지붕 끝에 깃발 열 개가 큰 것 작은 것 짝지어 걸렸다. 초록 한 쌍이 甲과 乙, 木. 빨강 한 쌍이 丙과 丁, 火. 노랑 한 쌍이 戊와 己, 土. 하양 한 쌍이 庚과 辛, 金. 검정 한 쌍이 壬과 癸, 水. 큰 깃발이 형, 작은 깃발이 아우라 형제배속이라 한다. 방위처럼 고정되어 변하지 않고, 해마다 똑같이 도는 主運에 쓴다. 甲과 己가 합해 土가 되는 化五運과는 다른 축이다.","box":[101,40,1881,179],"src":["OGI-GJ-01"],"tts":"지붕 끝에 깃발 열 개가 큰 것 작은 것 짝지어 걸렸다. 초록 한 쌍이 갑과 을, 목. 빨강 한 쌍이 병과 정, 화. 노랑 한 쌍이 무와 기, 토. 하양 한 쌍이 경과 신, 금. 검정 한 쌍이 임과 계, 수. 큰 깃발이 형, 작은 깃발이 아우라 형제배속이라 한다. 방위처럼 고정되어 변하지 않고, 해마다 똑같이 도는 주운에 쓴다. 갑과 기가 합해 토가 되는 화오운과는 다른 축이다."},{"n":2,"obj":"마당의 색 방석 다섯과 열두 짐승 — 오른쪽 초록 방석에 호랑이·토끼 · 앞쪽 빨강 방석에 뱀·말 · 왼쪽 하양 방석에 원숭이·닭 · 뒤쪽 검정 방석에 돼지·쥐 · 가운데 노랑 방석에 용·개·소·양","fact":"地支 五行 — 寅卯木·巳午火·申酉金·亥子水·辰戌丑未土","hook":"방석 색 = 五行 · 가운데 노랑에 넷(辰戌丑未) · 오른쪽이 東","say":"마당에 색 방석 다섯이 깔렸다. 오른쪽 동쪽 초록 방석에 호랑이와 토끼 — 寅과 卯, 木. 앞쪽 남쪽 빨강 방석에 뱀과 말 — 巳와 午, 火. 왼쪽 서쪽 하양 방석에 원숭이와 닭 — 申과 酉, 金. 뒤쪽 북쪽 검정 방석에 돼지와 쥐 — 亥와 子, 水. 가운데 노랑 방석에는 넷이 모였다. 용, 개, 소, 양 — 辰, 戌, 丑, 未, 土다.","box":[[1369,555,569,288],[774,850,804,267],[307,588,414,190],[862,483,370,101],[660,562,702,288]],"src":["GAP1-001"],"tts":"마당에 색 방석 다섯이 깔렸다. 오른쪽 동쪽 초록 방석에 호랑이와 토끼, 인과 묘, 목. 앞쪽 남쪽 빨강 방석에 뱀과 말, 사와 오, 화. 왼쪽 서쪽 하양 방석에 원숭이와 닭, 신과 유, 금. 뒤쪽 북쪽 검정 방석에 돼지와 쥐, 해와 자, 수. 가운데 노랑 방석에는 넷이 모였다. 용, 개, 소, 양, 진, 술, 축, 미, 토다."},{"n":3,"obj":"대청 한가운데 노란 휘장 아래 앉은 노란 옷의 판관 — 나무 방망이를 치켜듦","fact":"天符 = 中運과 司天之氣의 五行이 같은 해 (예: 己未年) — 執法","hook":"옷(運)과 머리 위 휘장(司天)이 같은 색 = 하늘과 맞음(天符)","say":"대청 한가운데 판관이 앉았다. 옷도 노랑, 머리 위 휘장도 노랑이다. 그해의 運과 하늘의 기운 司天이 같은 五行인 해 — 天符다. 己未년을 보면 甲과 己가 합한 土運에, 丑未의 太陰濕土가 司天이다. 『六微旨大論』은 하늘과 만난다 하여 天符라 했고, 법을 쥔 벼슬 執法에 견주었다. 모두 열두 해다.","box":[829,123,447,310],"src":["OGI-SANG-02"],"tts":"대청 한가운데 판관이 앉았다. 옷도 노랑, 머리 위 휘장도 노랑이다. 그해의 운과 하늘의 기운 사천이 같은 오행인 해, 천부다. 기미년을 보면 갑과 기가 합한 토운에, 축미의 태음습토가 사천이다. 육미지대론은 하늘과 만난다 하여 천부라 했고, 법을 쥔 벼슬 집법에 견주었다. 모두 열두 해다."},{"n":4,"obj":"오른쪽 초록 방석에 토끼와 함께 앉은 초록 옷의 관리 — 놋쇠 나팔을 붊 · 곁에 수평을 이룬 저울","fact":"歲會 = 中運과 年支 방위 五行이 같은 해 (當位 · 氣之平) — 行令","hook":"옷(運)과 깔고 앉은 방석(年支)이 같은 색 = 제자리(當位) · 수평 저울 = 氣之平","say":"오른쪽 초록 방석에는 초록 옷의 관리가 토끼 곁에 앉아 명을 알리는 나팔을 분다. 옷과 방석이 같은 색이다. 그해의 運과 年支의 五行이 같은 해 — 歲會다. 丁卯년은 木運이 卯에 임했고, 甲辰년은 土運이 辰에 임했다. 木運이 卯에, 火運이 午에, 土運이 辰戌丑未에, 金運이 酉에, 水運이 子에 임하는 여덟 해다. 제자리에 앉았다 하여 當位, 곁의 저울처럼 기운이 고르다 하여 氣之平이라 한다. 명을 행하는 벼슬 行令이다. 天符는 運과 司天, 歲會는 運과 年支 — 섞지 않는다.","box":[[1593,507,209,242],[1640,703,157,121],[1460,675,179,128]],"src":["OGI-SANG-03"],"tts":"오른쪽 초록 방석에는 초록 옷의 관리가 토끼 곁에 앉아 명을 알리는 나팔을 분다. 옷과 방석이 같은 색이다. 그해의 운과 연지의 오행이 같은 해, 세회다. 정묘년은 목운이 묘에 임했고, 갑진년은 토운이 진에 임했다. 목운이 묘에, 화운이 오에, 토운이 진술축미에, 금운이 유에, 수운이 자에 임하는 여덟 해다. 제자리에 앉았다 하여 당위, 곁의 저울처럼 기운이 고르다 하여 기지평이라 한다. 명을 행하는 벼슬 행령이다. 천부는 운과 사천, 세회는 운과 연지, 섞지 않는다."},{"n":5,"obj":"앞쪽 빨강 방석에 말과 함께 앉은 빨간 옷의 귀인 — 빨간 일산을 씀 · 금방울을 단 네 짐승: 말 · 소 · 양 · 닭","fact":"太一天符 = 天符이면서 歲會 — 戊午·己丑·己未·乙酉 넷 — 貴人","hook":"일산(司天)·옷(運)·방석(年支) 셋이 다 빨강 · 금방울 넷 = 말·소·양·닭","say":"앞쪽 빨강 방석에는 빨간 옷의 귀인이 빨간 일산을 쓰고 말 곁에 앉았다. 머리 위도, 옷도, 방석도 한 색이다. 天符이면서 歲會인 해 — 太一天符, 가장 귀한 貴人이다. 금방울을 단 짐승이 넷이다. 말, 소, 양, 닭 — 戊午, 己丑, 己未, 乙酉. 이 네 해뿐이다. 원문 글자는 클 태에 한 일, 太一이다.","box":[[1283,757,233,310],[1028,847,251,251],[1059,559,219,150],[1143,667,186,160],[502,584,150,176]],"src":["OGI-SANG-04"],"tts":"앞쪽 빨강 방석에는 빨간 옷의 귀인이 빨간 일산을 쓰고 말 곁에 앉았다. 머리 위도, 옷도, 방석도 한 색이다. 천부이면서 세회인 해, 태일천부, 가장 귀한 귀인이다. 금방울을 단 짐승이 넷이다. 말, 소, 양, 닭, 무오, 기축, 기미, 을유. 이 네 해뿐이다. 원문 글자는 클 태에 한 일, 태일이다."},{"n":6,"obj":"작은 놋쇠 나팔을 든 토끼와 쥐 · 가운데 노랑 방석의 용과 개","fact":"순수 歲會는 丁卯·丙子 둘 — 甲辰·甲戌은 歲會이면서 同天符","hook":"나팔만 든 토끼·쥐 = 歲會만 · 금방울 넷은 太一天符 · 용·개는 同天符를 겸함","say":"歲會 여덟 해의 짐승을 본다. 토끼, 말, 닭, 쥐, 그리고 노랑 방석의 용, 개, 소, 양이다. 금방울을 단 말, 소, 양, 닭은 太一天符로 올라갔다. 용과 개, 곧 甲辰과 甲戌은 歲會이면서 샘가의 同天符에도 든다. 그래서 관리의 나팔만 든 토끼와 쥐, 丁卯와 丙子 둘만이 어디에도 겹치지 않는 歲會다.","box":[[1460,675,179,128],[1067,464,140,101],[749,598,277,205],[912,677,160,150]],"src":[],"tts":"세회 여덟 해의 짐승을 본다. 토끼, 말, 닭, 쥐, 그리고 노랑 방석의 용, 개, 소, 양이다. 금방울을 단 말, 소, 양, 닭은 태일천부로 올라갔다. 용과 개, 곧 갑진과 갑술은 세회이면서 샘가의 동천부에도 든다. 그래서 관리의 나팔만 든 토끼와 쥐, 정묘와 병자 둘만이 어디에도 겹치지 않는 세회다."},{"n":7,"obj":"왼쪽 앞 돌샘가에 무릎 꿇은 파란 옷의 큰 어른 — 나무 방망이를 듦 · 샘물에 비친 제 모습을 봄","fact":"同天符 = 太過한 中運과 在泉之氣가 같은 해 — 甲辰 甲戌 壬寅 壬申 庚子 庚午","hook":"큰 어른 = 太過(陽干) · 샘 = 在泉 · 판관의 방망이 = 天符와 같은 급","say":"왼쪽 앞 돌샘은 땅속의 기운 在泉이다. 파란 옷의 큰 어른이 샘물에 제 모습을 비추어 본다. 옷과 샘물이 같은 색이다. 큰 어른은 太過한 運, 陽干의 해다. 太過한 運이 在泉과 같은 五行인 해 — 同天符. 그래서 판관과 같은 방망이를 들었다. 庚子년은 乙과 庚이 합한 金運에 在泉이 陽明燥金이다. 甲辰, 甲戌, 壬寅, 壬申, 庚子, 庚午 여섯 해다.","box":[[123,631,248,265],[65,865,519,262]],"src":["OGI-SANG-05"],"tts":"왼쪽 앞 돌샘은 땅속의 기운 재천이다. 파란 옷의 큰 어른이 샘물에 제 모습을 비추어 본다. 옷과 샘물이 같은 색이다. 큰 어른은 태과한 운, 양간의 해다. 태과한 운이 재천과 같은 오행인 해, 동천부. 그래서 판관과 같은 방망이를 들었다. 경자년은 을과 경이 합한 금운에 재천이 양명조금이다. 갑진, 갑술, 임인, 임신, 경자, 경오 여섯 해다."},{"n":8,"obj":"큰 어른 곁에서 같은 샘물을 들여다보는 파란 옷의 작은 아이 — 작은 놋쇠 나팔을 듦","fact":"同歲會 = 不及한 中運과 在泉之氣가 같은 해 — 癸巳 癸亥 辛丑 辛未 癸卯 癸酉","hook":"작은 아이 = 不及(陰干) · 관리의 나팔 = 歲會와 같은 급","say":"큰 어른 곁의 작은 아이도 파란 옷으로 같은 샘을 들여다본다. 작은 아이는 不及한 運, 陰干의 해다. 不及한 運이 在泉과 같은 五行인 해 — 同歲會. 그래서 관리와 같은 나팔을 들었다. 辛未년은 丙과 辛이 합한 水運에 在泉이 太陽寒水다. 癸巳, 癸亥, 辛丑, 辛未, 癸卯, 癸酉 여섯 해다. 이 둘은 『六元正紀大論』에 나온다. 太過하면서 더하면 同天符, 不及하면서 더하면 同歲會다.","box":[[375,749,176,154],[65,865,519,262]],"src":["OGI-SANG-06"],"tts":"큰 어른 곁의 작은 아이도 파란 옷으로 같은 샘을 들여다본다. 작은 아이는 불급한 운, 음간의 해다. 불급한 운이 재천과 같은 오행인 해, 동세회. 그래서 관리와 같은 나팔을 들었다. 신미년은 병과 신이 합한 수운에 재천이 태양한수다. 계사, 계해, 신축, 신미, 계묘, 계유 여섯 해다. 이 둘은 육원정기대론에 나온다. 태과하면서 더하면 동천부, 불급하면서 더하면 동세회다."},{"n":9,"obj":"초 셋 — 판관 책상의 짧은 초는 불꽃이 크게 치솟음 · 초록 관리 곁의 굵고 긴 초는 작은 불꽃이 잔잔함 · 귀인 곁의 초는 막 꺼져 연기만 오름","fact":"執法 病速而危 · 行令 病徐而持 · 貴人 病暴而死","hook":"치솟는 불 = 빠르고 위태 · 잔잔한 긴 초 = 더디게 버팀 · 꺼진 초 = 갑자기 죽음","say":"초 셋을 본다. 판관의 짧은 초는 불꽃이 사납게 치솟는다. 執法에 맞으면 병이 빠르고 위태롭다 — 速而危. 관리 곁의 굵고 긴 초는 작은 불꽃이 잔잔하다. 行令에 맞으면 병이 더디게 오래 버틴다 — 徐而持. 귀인 곁의 초는 방금 꺼져 연기만 오른다. 貴人에 맞으면 병이 갑자기 나서 죽는다 — 暴而死. 가장 귀한 자리가 가장 험하다. 기후의 변화가 사납기로도 太一天符가 으뜸이고, 다음이 天符와 同天符, 그다음이 歲會와 同歲會다.","box":[[1098,238,86,169],[1806,646,78,179],[1482,876,85,231]],"src":["OGI-SANG-07"],"tts":"초 셋을 본다. 판관의 짧은 초는 불꽃이 사납게 치솟는다. 집법에 맞으면 병이 빠르고 위태롭다, 속이위. 관리 곁의 굵고 긴 초는 작은 불꽃이 잔잔하다. 행령에 맞으면 병이 더디게 오래 버틴다, 서이지. 귀인 곁의 초는 방금 꺼져 연기만 오른다. 귀인에 맞으면 병이 갑자기 나서 죽는다, 폭이사. 가장 귀한 자리가 가장 험하다. 기후의 변화가 사납기로도 태일천부가 으뜸이고, 다음이 천부와 동천부, 그다음이 세회와 동세회다."},{"n":10,"kind":"review","obj":"관청 마당 한 바퀴 — 깃발 열 · 방석 다섯과 열두 짐승 · 판관 · 초록 관리 · 빨간 귀인 · 샘가의 큰 어른과 작은 아이","fact":"天符 運=司天 · 歲會 運=年支 · 太一天符 둘 다 · 同天符/同歲會 運=在泉(太過/不及)","hook":"휘장 · 방석 · 일산 · 샘 / 초 셋","say":"다시 본다. 깃발 열은 天干, 방석 다섯의 열두 짐승은 地支. 노란 휘장 아래 판관은 運과 司天이 같은 天符. 초록 방석의 관리는 運과 年支가 같은 歲會. 일산 아래 빨간 귀인은 둘 다인 太一天符 — 말, 소, 양, 닭의 금방울. 샘가의 큰 어른은 同天符, 작은 아이는 同歲會. 치솟는 초, 잔잔한 초, 꺼진 초.","box":[[0,0,2048,1143]],"src":[],"tts":"다시 본다. 깃발 열은 천간, 방석 다섯의 열두 짐승은 지지. 노란 휘장 아래 판관은 운과 사천이 같은 천부. 초록 방석의 관리는 운과 연지가 같은 세회. 일산 아래 빨간 귀인은 둘 다인 태일천부, 말, 소, 양, 닭의 금방울. 샘가의 큰 어른은 동천부, 작은 아이는 동세회. 치솟는 초, 잔잔한 초, 꺼진 초."}],"has_image":true},{"id":"zds-01","title":"肝 — 華爪·充筋·竅目 · 惡風·液淚·久行傷筋","place":"바람 부는 시골 간이역 승강장","image":"images/lessons/zds-01.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"바람 부는 시골 간이역 승강장 — 벤치에 홀로 앉은 초록 갑옷 장군","fact":"肝 — 華 손톱 · 充 힘줄 · 竅 눈 / 惡 바람 · 液 눈물 · 勞 오래 걷기","hook":"간이역의 「간」 = 肝 · 초록 갑옷 장군 = 肝(五臟 인물)","say":"바람 부는 날, 시골 간이역 승강장. 간이역의 간 — 肝이다. 초록 갑옷을 입은 장군이 홀로 벤치에 앉았다. 五臟 인물의 肝이다. 오늘은 이 한 사람의 몸에서 肝이 꽃피우는 곳, 채우는 것, 열리는 구멍을 찾고, 『宣明五氣』의 싫어하는 것, 진액, 오래 하면 상하는 것을 찾는다.","box":null,"src":[],"tts":"바람 부는 날, 시골 간이역 승강장. 간이역의 간, 간이다. 초록 갑옷을 입은 장군이 홀로 벤치에 앉았다. 오장 인물의 간이다. 오늘은 이 한 사람의 몸에서 간이 꽃피우는 곳, 채우는 것, 열리는 구멍을 찾고, 선명오기의 싫어하는 것, 진액, 오래 하면 상하는 것을 찾는다."},{"n":1,"obj":"무릎에 얹은 왼손 — 길게 자란 손톱마다 핀 작은 분홍 꽃","fact":"其華在爪 — 肝의 榮華는 손톱에 핀다","hook":"손톱(爪)에 핀 꽃(華)","say":"장군이 무릎에 얹은 왼손을 본다. 길게 자란 손톱마다 작은 분홍 꽃이 피었다. 肝의 영화는 손톱에 핀다 — 빛날 화(華), 손톱 조(爪), 其華在爪. 肝의 血이 넉넉하면 손톱이 붉고 윤이 난다. 다섯 장부의 華는 心 얼굴, 肺 털, 脾 입술, 肝 손톱, 腎 머리카락이다.","box":[1333,663,278,209],"src":["JS-GAN-04","JS-CORE-06"],"tts":"장군이 무릎에 얹은 왼손을 본다. 길게 자란 손톱마다 작은 분홍 꽃이 피었다. 간의 영화는 손톱에 핀다, 빛날 화, 손톱 조, 기화재조. 간의 혈이 넉넉하면 손톱이 붉고 윤이 난다. 다섯 장부의 화는 심 얼굴, 폐 털, 비 입술, 간 손톱, 신 머리카락이다."},{"n":2,"obj":"오른 어깨 위로 솟아 몸에 비스듬히 걸친 큰 활 — 팽팽하게 당긴 시위","fact":"其充在筋(在體合筋) — 肝이 채우는 것은 힘줄","hook":"팽팽한 활시위 = 힘줄(筋) — 희고 질긴 줄 · 활 = 筋(yyox-06과 같은 뜻)","say":"장군의 오른 어깨 위로 큰 활이 솟았고 시위가 팽팽하다. 활시위가 곧 힘줄이다. 肝이 채우는 것은 힘줄 — 힘줄 근(筋), 其充在筋, 在體合筋. 힘줄은 희고 질긴 줄이라 붉은 관이 갈라지는 핏줄과 다르다. 다섯 장부가 채우는 것은 心 핏줄, 肺 살갗, 脾 살, 肝 힘줄, 腎 뼈다.","box":[1384,58,277,418],"src":["JS-CORE-05"],"tts":"장군의 오른 어깨 위로 큰 활이 솟았고 시위가 팽팽하다. 활시위가 곧 힘줄이다. 간이 채우는 것은 힘줄, 힘줄 근, 기충재근, 재체합근. 힘줄은 희고 질긴 줄이라 붉은 관이 갈라지는 핏줄과 다르다. 다섯 장부가 채우는 것은 심 핏줄, 폐 살갗, 비 살, 간 힘줄, 신 뼈다."},{"n":3,"obj":"목에 끈으로 건 쌍안경","fact":"開竅於目 — 肝은 눈으로 열린다 · 將軍之官 · 罷極之本 · 血海","hook":"쌍안경 = 눈(目) · 장군 = 將軍之官","say":"목에는 쌍안경이 걸렸다. 肝은 눈으로 열린다 — 눈 목(目), 開竅於目. 『金匱眞言論』도 東方의 푸른 기운이 肝으로 들어가 눈으로 열린다고 했다. 그 數는 八, 音은 角, 냄새는 누린내 조(臊)다. 이 사람이 장군인 것도 肝이 將軍之官이기 때문이다. 피로를 견디는 罷極之本이고, 피를 갈무리하는 血海이며, 體는 陰이고 쓰임은 陽이다.","box":[1185,574,153,144],"src":["JS-CORE-07-03","JSG-016","CI-07"],"tts":"목에는 쌍안경이 걸렸다. 간은 눈으로 열린다, 눈 목, 개규어목. 금궤진언론도 동방의 푸른 기운이 간으로 들어가 눈으로 열린다고 했다. 그 수는 팔, 음은 각, 냄새는 누린내 조다. 이 사람이 장군인 것도 간이 장군지관이기 때문이다. 피로를 견디는 파극지본이고, 피를 갈무리하는 혈해이며, 체는 음이고 쓰임은 양이다."},{"n":4,"obj":"왼쪽에서 몰아치는 바람과 날리는 잎 · 바람 쪽에 장군보다 높이 선 판자 바람막이 — 그 뒤에 앉은 장군","fact":"肝惡風 — 五臟所惡: 肝 風 · 心 熱 · 脾 濕 · 肺 寒 · 腎 燥","hook":"바람 쪽에 세운 판자 울 = 바람을 싫어함(惡風)","say":"왼쪽에서 거센 바람이 몰아친다. 그런데 장군은 바람 쪽에 높은 판자 바람막이를 세우고 그 뒤에 앉았다. 肝은 바람을 싫어한다 — 미워할 오(惡), 肝惡風. 『宣明五氣』의 五臟所惡는 肝 바람, 心 열, 脾 습기, 肺 추위, 腎 마름이다.","box":[[404,65,507,1013],[0,50,807,829]],"src":["JSG-026"],"tts":"왼쪽에서 거센 바람이 몰아친다. 그런데 장군은 바람 쪽에 높은 판자 바람막이를 세우고 그 뒤에 앉았다. 간은 바람을 싫어한다, 미워할 오, 간오풍. 선명오기의 오장소오는 간 바람, 심 열, 비 습기, 폐 추위, 신 마름이다."},{"n":5,"obj":"두 뺨으로 줄줄 흐르는 눈물 · 기차 쪽으로 흔드는 흰 손수건","fact":"肝爲淚 — 五臟化液: 心 汗 · 肺 涕 · 脾 涎 · 肝 淚 · 腎 唾","hook":"기차를 보며 흘리는 눈물 = 淚","say":"장군은 멀리 기차 쪽으로 흰 손수건을 흔들며 눈물을 줄줄 흘린다. 肝의 진액은 눈물이다 — 눈물 누(淚), 肝爲淚. 肝은 눈으로 열리니 눈에서 나오는 물이 肝의 液이다. 다섯 장부의 液은 心 땀, 肺 콧물, 脾 군침, 肝 눈물, 腎 침이다.","box":[[1117,130,317,353],[771,79,231,252],[242,458,179,150]],"src":["JS-CORE-09","OHG-035"],"tts":"장군은 멀리 기차 쪽으로 흰 손수건을 흔들며 눈물을 줄줄 흘린다. 간의 진액은 눈물이다, 눈물 누, 간위루. 간은 눈으로 열리니 눈에서 나오는 물이 간의 액이다. 다섯 장부의 액은 심 땀, 폐 콧물, 비 군침, 간 눈물, 신 침이다."},{"n":6,"obj":"붕대 감은 오른 발목 · 발 앞의 짚신 셋 — 왼쪽부터 새것 · 해진 것 · 찢어진 것","fact":"久行傷筋 — 五勞所傷: 久視 血 · 久臥 氣 · 久坐 肉 · 久立 骨 · 久行 筋","hook":"점점 닳아 가는 짚신 셋 = 오래 걸음(久行) · 붕대 = 힘줄이 상함","say":"장군의 오른 발목에는 붕대가 감겼고, 발 앞의 짚신 셋은 왼쪽부터 새것, 해진 것, 찢어진 것이다. 신을 갈아 신으며 기찻길을 따라 오래 걸어왔다. 오래 걸으면 힘줄이 상한다 — 久行傷筋. 등의 활시위와 같은 힘줄이다. 『宣明五氣』의 五勞所傷은 오래 보면 血, 오래 누우면 氣, 오래 앉으면 살, 오래 서면 뼈, 오래 걸으면 힘줄이 상한다.","box":[[966,862,180,208],[747,977,1087,140]],"src":["BIN-EUM-03"],"tts":"장군의 오른 발목에는 붕대가 감겼고, 발 앞의 짚신 셋은 왼쪽부터 새것, 해진 것, 찢어진 것이다. 신을 갈아 신으며 기찻길을 따라 오래 걸어왔다. 오래 걸으면 힘줄이 상한다, 구행상근. 등의 활시위와 같은 힘줄이다. 선명오기의 오로소상은 오래 보면 혈, 오래 누우면 기, 오래 앉으면 살, 오래 서면 뼈, 오래 걸으면 힘줄이 상한다."},{"n":7,"kind":"review","obj":"간이역 벤치의 장군 한 바퀴 — 손톱 · 활 · 쌍안경 · 바람막이 · 눈물 · 짚신","fact":"其華在爪 · 其充在筋 · 開竅於目 / 肝惡風 · 肝爲淚 · 久行傷筋","hook":"꽃 핀 손톱 · 활시위 · 쌍안경 / 바람막이 · 손수건 · 닳은 짚신","say":"다시 본다. 손톱에 핀 꽃 — 其華在爪. 등의 활시위 — 其充在筋. 목의 쌍안경 — 開竅於目. 바람막이 뒤 — 肝惡風. 눈물과 손수건 — 肝爲淚. 붕대와 닳아 가는 짚신 — 久行傷筋.","box":[[778,55,843,1019],[404,65,507,1013]],"src":[],"tts":"다시 본다. 손톱에 핀 꽃, 기화재조. 등의 활시위, 기충재근. 목의 쌍안경, 개규어목. 바람막이 뒤, 간오풍. 눈물과 손수건, 간위루. 붕대와 닳아 가는 짚신, 구행상근."}],"has_image":true},{"id":"zds-02","title":"心 — 華面·充血脈·竅舌 · 惡熱·液汗·久視傷血","place":"새벽이 밝아 오는 심야 만화방","image":"images/lessons/zds-02.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"새벽이 밝아 오는 심야 만화방 — 안락의자에 앉은 붉은 용포의 임금","fact":"心 — 華 얼굴 · 充 핏줄 · 竅 혀 / 惡 열 · 液 땀 · 勞 오래 보기","hook":"심야 만화방의 「심」 = 心 · 붉은 용포 임금 = 心(君主之官)","say":"밤새 불이 켜진 심야 만화방. 심야의 심 — 心이다. 안락의자에 붉은 용포를 입은 임금이 앉았다. 五臟 인물의 心, 君主之官이다. 이 한 사람에게서 心이 꽃피우는 곳, 채우는 것, 열리는 구멍을 찾고, 『宣明五氣』의 싫어하는 것, 진액, 오래 하면 상하는 것을 찾는다. 창밖으로 새벽이 밝아 온다.","box":null,"src":[],"tts":"밤새 불이 켜진 심야 만화방. 심야의 심, 심이다. 안락의자에 붉은 용포를 입은 임금이 앉았다. 오장 인물의 심, 군주지관이다. 이 한 사람에게서 심이 꽃피우는 곳, 채우는 것, 열리는 구멍을 찾고, 선명오기의 싫어하는 것, 진액, 오래 하면 상하는 것을 찾는다. 창밖으로 새벽이 밝아 온다."},{"n":1,"obj":"윤이 반짝반짝 나는 임금의 얼굴 — 얼굴빛은 보통 살색, 둘레에 반짝이 별","fact":"其華在面 — 心의 榮華는 얼굴에 핀다 · 색이 아니라 윤","hook":"얼굴(面)에 핀 윤기와 반짝이 = 華 · 붉게 칠하지 않음(赤色主病과 구별)","say":"임금의 얼굴에 윤이 반짝반짝 나고 둘레에 별이 튄다. 心의 영화는 얼굴에 핀다 — 낯 면(面), 其華在面. 얼굴빛은 붉지 않고 보통 살색이다. 心의 華는 색이 아니라 윤이다. 얼굴이 붉은 것은 望診의 赤色으로 熱을 뜻한다. 『六節藏象論』은 心을 生之本, 神之變이라 하고, 그 華는 얼굴, 채우는 것은 血脈이라 했다. 心은 君主之官, 五臟六腑之大主다.","box":[1078,202,507,411],"src":["JS-SIM-04","JS-CORE-06","JSG-015","JSG3-001"],"tts":"임금의 얼굴에 윤이 반짝반짝 나고 둘레에 별이 튄다. 심의 영화는 얼굴에 핀다, 낯 면, 기화재면. 얼굴빛은 붉지 않고 보통 살색이다. 심의 화는 색이 아니라 윤이다. 얼굴이 붉은 것은 망진의 적색으로 열을 뜻한다. 육절장상론은 심을 생지본, 신지변이라 하고, 그 화는 얼굴, 채우는 것은 혈맥이라 했다. 심은 군주지관, 오장육부지대주다."},{"n":2,"obj":"임금 왼쪽 벽을 타고 나무처럼 갈라지는 붉은 관 — 굵은 관 하나에서 가는 관 여럿으로","fact":"其充在血脈(在體合脈) — 心이 채우는 것은 핏줄","hook":"붉은 피가 든 관이 갈래갈래 = 血脈","say":"임금 왼쪽 벽에 붉은 피가 든 관이 굵은 한 줄기에서 가는 여러 줄기로 나무처럼 갈라진다. 心이 채우는 것은 핏줄이다 — 피 혈(血), 줄기 맥(脈), 其充在血脈, 在體合脈. 손목 한 자리의 맥도, 팔다리를 세로로 타는 경맥 한 줄도 아니라 온몸으로 갈라지는 핏줄이다. 다섯 장부가 채우는 것은 心 핏줄, 肺 살갗, 脾 살, 肝 힘줄, 腎 뼈다.","box":[310,0,764,685],"src":["JS-CORE-05"],"tts":"임금 왼쪽 벽에 붉은 피가 든 관이 굵은 한 줄기에서 가는 여러 줄기로 나무처럼 갈라진다. 심이 채우는 것은 핏줄이다, 피 혈, 줄기 맥, 기충재혈맥, 재체합맥. 손목 한 자리의 맥도, 팔다리를 세로로 타는 경맥 한 줄도 아니라 온몸으로 갈라지는 핏줄이다. 다섯 장부가 채우는 것은 심 핏줄, 폐 살갗, 비 살, 간 힘줄, 신 뼈다."},{"n":3,"obj":"막대사탕을 핥으며 쑥 내민 분홍 혀","fact":"開竅於舌 — 心은 혀로 열린다 · 心和則舌能知五味","hook":"혀를 내밀어 사탕 맛을 봄 = 心이 고르면 혀가 맛을 안다","say":"임금은 막대사탕을 핥느라 분홍 혀를 쑥 내밀었다. 心은 혀로 열린다 — 혀 설(舌), 開竅於舌. 혀는 心의 싹이다. 心의 氣는 혀로 통하니, 心이 고르면 혀가 다섯 맛을 안다 — 心和則舌能知五味. 心火가 위로 타오르면 입과 혀가 헐어 문드러진다 — 口舌糜爛. 心과 小腸은 표리라 心을 맑히고 小腸의 火를 덜어 고친다.","box":[1127,483,221,202],"src":["JS-CORE-07-02","JSG2-012","JSG3-003"],"tts":"임금은 막대사탕을 핥느라 분홍 혀를 쑥 내밀었다. 심은 혀로 열린다, 혀 설, 개규어설. 혀는 심의 싹이다. 심의 기는 혀로 통하니, 심이 고르면 혀가 다섯 맛을 안다, 심화즉설능지오미. 심화가 위로 타오르면 입과 혀가 헐어 문드러진다, 구설미란. 심과 소장은 표리라 심을 맑히고 소장의 화를 덜어 고친다."},{"n":4,"obj":"작은 탁자 위에서 임금 쪽으로 바람을 보내는 선풍기","fact":"心惡熱 — 五臟所惡: 肝 風 · 心 熱 · 脾 濕 · 肺 寒 · 腎 燥","hook":"더위를 쫓는 선풍기 = 열을 싫어함(惡熱)","say":"작은 탁자 위 선풍기가 임금 쪽으로 바람을 보낸다. 心은 열을 싫어한다 — 미워할 오(惡), 心惡熱. 心은 火의 장부라 열이 더해지면 견디지 못한다. 『宣明五氣』의 五臟所惡는 肝 바람, 心 열, 脾 습기, 肺 추위, 腎 마름이다.","box":[65,432,749,677],"src":["JSG-026"],"tts":"작은 탁자 위 선풍기가 임금 쪽으로 바람을 보낸다. 심은 열을 싫어한다, 미워할 오, 심오열. 심은 화의 장부라 열이 더해지면 견디지 못한다. 선명오기의 오장소오는 간 바람, 심 열, 비 습기, 폐 추위, 신 마름이다."},{"n":5,"obj":"이마와 목에서 사방으로 튀는 굵은 땀방울","fact":"心爲汗 — 五臟化液: 心 汗 · 肺 涕 · 脾 涎 · 肝 淚 · 腎 唾","hook":"뚝뚝 흐르는 땀 = 心의 液","say":"임금의 이마와 목에서 굵은 땀방울이 사방으로 튄다. 心의 진액은 땀이다 — 땀 한(汗), 心爲汗. 心은 血을 주관하고 血은 營에 속하니, 땀은 心의 液이다. 다섯 장부의 液은 心 땀, 肺 콧물, 脾 군침, 肝 눈물, 腎 침이다.","box":[1139,252,461,504],"src":["JS-CORE-09","OHG-035"],"tts":"임금의 이마와 목에서 굵은 땀방울이 사방으로 튄다. 심의 진액은 땀이다, 땀 한, 심위한. 심은 혈을 주관하고 혈은 영에 속하니, 땀은 심의 액이다. 다섯 장부의 액은 심 땀, 폐 콧물, 비 군침, 간 눈물, 신 침이다."},{"n":6,"obj":"안락의자 옆에 의자만큼 쌓인 다 읽은 책 탑 · 핏발 서고 지친 두 눈 · 새벽빛이 비치는 창","fact":"久視傷血 — 五勞所傷: 久視 血 · 久臥 氣 · 久坐 肉 · 久立 骨 · 久行 筋","hook":"밤새 읽어 쌓인 책 탑 = 오래 봄(久視) · 핏발 선 눈 = 血이 상함","say":"의자 옆에 다 읽은 책이 의자만큼 높이 쌓였고, 창밖으로 새벽이 밝아 온다. 밤새 들여다본 임금의 눈에는 핏발이 섰다. 오래 보면 血이 상한다 — 久視傷血. 心이 血을 주관하고, 肝은 血을 받아야 볼 수 있다. 『宣明五氣』의 五勞所傷은 오래 보면 血, 오래 누우면 氣, 오래 앉으면 살, 오래 서면 뼈, 오래 걸으면 힘줄이 상한다.","box":[[1640,577,308,566],[1237,360,255,108],[1780,0,268,555]],"src":["BIN-EUM-03"],"tts":"의자 옆에 다 읽은 책이 의자만큼 높이 쌓였고, 창밖으로 새벽이 밝아 온다. 밤새 들여다본 임금의 눈에는 핏발이 섰다. 오래 보면 혈이 상한다, 구시상혈. 심이 혈을 주관하고, 간은 혈을 받아야 볼 수 있다. 선명오기의 오로소상은 오래 보면 혈, 오래 누우면 기, 오래 앉으면 살, 오래 서면 뼈, 오래 걸으면 힘줄이 상한다."},{"n":7,"kind":"review","obj":"만화방의 임금 한 바퀴 — 윤 나는 얼굴 · 붉은 관 · 혀와 사탕 · 선풍기 · 땀 · 책 탑","fact":"其華在面 · 其充在血脈 · 開竅於舌 / 心惡熱 · 心爲汗 · 久視傷血","hook":"반짝이는 얼굴 · 갈라지는 붉은 관 · 내민 혀 / 선풍기 · 땀방울 · 책 탑","say":"다시 본다. 윤 나는 얼굴 — 其華在面. 벽의 붉은 관 — 其充在血脈. 사탕 핥는 혀 — 開竅於舌. 선풍기 — 心惡熱. 땀방울 — 心爲汗. 책 탑과 핏발 선 눈 — 久視傷血.","box":[[807,123,930,1020],[310,0,764,685],[65,432,749,677],[1640,577,308,566]],"src":[],"tts":"다시 본다. 윤 나는 얼굴, 기화재면. 벽의 붉은 관, 기충재혈맥. 사탕 핥는 혀, 개규어설. 선풍기, 심오열. 땀방울, 심위한. 책 탑과 핏발 선 눈, 구시상혈."}],"has_image":true},{"id":"zds-03","title":"脾 — 華脣四白·充肌·竅口 · 惡濕·液涎·久坐傷肉","place":"습기 찬 딸기 비닐하우스","image":"images/lessons/zds-03.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"습기 찬 딸기 비닐하우스 — 낮은 걸상에 앉은 노란 옷 농부","fact":"脾 — 華 입술 둘레 · 充 살 · 竅 입 / 惡 습기 · 液 군침 · 勞 오래 앉기","hook":"비닐하우스의 「비」 = 脾 · 노란 옷 농부 = 脾(五臟 인물) · 흙 = 土","say":"김이 서린 딸기 비닐하우스. 비닐의 비 — 脾다. 흙 밭 한가운데 노란 옷을 입은 농부가 낮은 걸상에 앉았다. 五臟 인물의 脾, 土의 장부다. 이 한 사람에게서 脾가 꽃피우는 곳, 채우는 것, 열리는 구멍을 찾고, 『宣明五氣』의 싫어하는 것, 진액, 오래 하면 상하는 것을 찾는다.","box":null,"src":[],"tts":"김이 서린 딸기 비닐하우스. 비닐의 비, 비다. 흙 밭 한가운데 노란 옷을 입은 농부가 낮은 걸상에 앉았다. 오장 인물의 비, 토의 장부다. 이 한 사람에게서 비가 꽃피우는 곳, 채우는 것, 열리는 구멍을 찾고, 선명오기의 싫어하는 것, 진액, 오래 하면 상하는 것을 찾는다."},{"n":1,"obj":"농부의 입술 둘레를 빙 두른 굵은 흰 테","fact":"其華在脣四白 — 脾의 榮華는 입술 둘레의 흰 테에 핀다","hook":"입술(脣) 사방(四)의 흰(白) 테 = 華","say":"농부의 입술 둘레를 굵은 흰 테가 빙 둘렀다. 脾의 영화는 입술과 그 사방의 흰 살에 핀다 — 입술 순(脣), 넉 사(四), 흰 백(白), 其華在脣四白. 脾가 튼튼하면 입술이 붉고 윤이 난다. 다섯 장부의 華는 心 얼굴, 肺 털, 脾 입술, 肝 손톱, 腎 머리카락이다.","box":[1268,512,202,130],"src":["JS-BI-05","JS-CORE-06"],"tts":"농부의 입술 둘레를 굵은 흰 테가 빙 둘렀다. 비의 영화는 입술과 그 사방의 흰 살에 핀다, 입술 순, 넉 사, 흰 백, 기화재순사백. 비가 튼튼하면 입술이 붉고 윤이 난다. 다섯 장부의 화는 심 얼굴, 폐 털, 비 입술, 간 손톱, 신 머리카락이다."},{"n":2,"obj":"농부 왼쪽 위, 통로 위 갈고리에 매달린 큰 날고깃덩이","fact":"其充在肌(在體合肉) — 脾가 채우는 것은 살 · 主肌肉四末","hook":"매달린 고깃덩이 = 살(肌肉) · 고깃덩이 = 肉(yyox-06과 같은 뜻)","say":"농부 왼쪽 위, 통로 위 갈고리에 큰 날고깃덩이가 매달렸다. 脾가 채우는 것은 살이다 — 살 기(肌), 其充在肌, 在體合肉. 脾는 氣血이 생겨나는 근원이라 그 精微가 살과 팔다리를 채운다 — 主肌肉四末. 脾가 허하면 팔다리가 늘어지고 살이 빠진다. 脾는 倉廩之官, 後天之本이다. 다섯 장부가 채우는 것은 心 핏줄, 肺 살갗, 脾 살, 肝 힘줄, 腎 뼈다.","box":[922,0,195,425],"src":["JS-CORE-05","JSG-017","JSG2-025"],"tts":"농부 왼쪽 위, 통로 위 갈고리에 큰 날고깃덩이가 매달렸다. 비가 채우는 것은 살이다, 살 기, 기충재기, 재체합육. 비는 기혈이 생겨나는 근원이라 그 정미가 살과 팔다리를 채운다, 주기육사말. 비가 허하면 팔다리가 늘어지고 살이 빠진다. 비는 창름지관, 후천지본이다. 다섯 장부가 채우는 것은 심 핏줄, 폐 살갗, 비 살, 간 힘줄, 신 뼈다."},{"n":3,"obj":"흰 테 안쪽으로 크게 벌린 농부의 입 — 검고 둥근 구멍","fact":"開竅於口 — 脾는 입으로 열린다 · 흰 테(華)와 검은 구멍(竅)이 한 자리","hook":"크게 벌린 입 구멍 = 竅 · 그 둘레 흰 테 = 華","say":"흰 테 안쪽으로 농부가 입을 크게 벌렸다. 검고 둥근 구멍이다. 脾는 입으로 열린다 — 입 구(口), 開竅於口. 밝은 테는 華, 어두운 구멍은 竅 — 한 자리에서 갈린다. 『金匱眞言論』도 中央의 누런 기운이 脾로 들어가 입으로 열린다고 했다. 그 數는 五, 音은 宮, 냄새는 향기로운 향(香)이다.","box":[1268,512,202,130],"src":["JS-CORE-07-04","CI-09"],"tts":"흰 테 안쪽으로 농부가 입을 크게 벌렸다. 검고 둥근 구멍이다. 비는 입으로 열린다, 입 구, 개규어구. 밝은 테는 화, 어두운 구멍은 규, 한 자리에서 갈린다. 금궤진언론도 중앙의 누런 기운이 비로 들어가 입으로 열린다고 했다. 그 수는 오, 음은 궁, 냄새는 향기로운 향이다."},{"n":4,"obj":"비닐 지붕에서 뚝뚝 떨어지는 물방울과 웅덩이 · 농부가 받쳐 든 노란 우산","fact":"脾惡濕 — 脾는 喜燥惡濕 · 胃는 喜潤惡燥 (바꾸면 오답)","hook":"습기를 막아 든 우산 = 습기를 싫어함(惡濕)","say":"비닐 지붕에 김이 서려 물방울이 뚝뚝 떨어지고, 바닥엔 웅덩이가 고였다. 농부는 노란 우산을 받쳐 들어 물을 피했다. 脾는 습기를 싫어한다 — 미워할 오(惡), 脾惡濕. 脾는 마른 것을 좋아하고 축축한 것을 싫어하며, 짝인 胃는 거꾸로 촉촉한 것을 좋아하고 마른 것을 싫어한다 — 喜燥惡濕은 脾, 喜潤惡燥는 胃. 『宣明五氣』의 五臟所惡는 肝 바람, 心 열, 脾 습기, 肺 추위, 腎 마름이다.","box":[[1160,123,749,454],[0,0,2048,476],[0,807,2048,336]],"src":["JSG-026","JSG2-002"],"tts":"비닐 지붕에 김이 서려 물방울이 뚝뚝 떨어지고, 바닥엔 웅덩이가 고였다. 농부는 노란 우산을 받쳐 들어 물을 피했다. 비는 습기를 싫어한다, 미워할 오, 비오습. 비는 마른 것을 좋아하고 축축한 것을 싫어하며, 짝인 위는 거꾸로 촉촉한 것을 좋아하고 마른 것을 싫어한다, 희조오습은 비, 희윤오조는 위. 선명오기의 오장소오는 간 바람, 심 열, 비 습기, 폐 추위, 신 마름이다."},{"n":5,"obj":"손에 든 큰 딸기를 바라보며 아랫입술에서 흘러내리는 군침","fact":"脾爲涎 — 흘러내리는 군침(涎) · 뱉는 침(唾)은 腎","hook":"딸기를 보고 흘리는 군침 = 涎","say":"농부는 손에 든 큰 딸기를 바라보며 아랫입술로 군침을 주르륵 흘린다. 脾의 진액은 군침이다 — 침 연(涎), 脾爲涎. 입은 脾의 구멍이니 입에서 저절로 흘러내리는 묽은 침이 涎이다. 뱉는 걸쭉한 침 唾는 腎의 液이다. 다섯 장부의 液은 心 땀, 肺 콧물, 脾 군침, 肝 눈물, 腎 침이다.","box":[1124,555,303,159],"src":["JS-CORE-09","OHG-035"],"tts":"농부는 손에 든 큰 딸기를 바라보며 아랫입술로 군침을 주르륵 흘린다. 비의 진액은 군침이다, 침 연, 비위연. 입은 비의 구멍이니 입에서 저절로 흘러내리는 묽은 침이 연이다. 뱉는 걸쭉한 침 타는 신의 액이다. 다섯 장부의 액은 심 땀, 폐 콧물, 비 군침, 간 눈물, 신 침이다."},{"n":6,"obj":"농부 왼쪽 통로를 따라 한 줄로 늘어선 뽑은 풀 더미 여섯 · 농부가 앉은 낮은 걸상","fact":"久坐傷肉 — 五勞所傷: 久視 血 · 久臥 氣 · 久坐 肉 · 久立 骨 · 久行 筋","hook":"줄줄이 쌓인 풀 더미 = 오래 앉아 김맴(久坐)","say":"농부 곁 통로를 따라 뽑은 풀 더미가 여섯이나 한 줄로 늘어섰다. 낮은 걸상에 앉은 채 하루 종일 김을 맸다. 오래 앉으면 살이 상한다 — 久坐傷肉. 매달린 고깃덩이와 같은 살이다. 『宣明五氣』의 五勞所傷은 오래 보면 血, 오래 누우면 氣, 오래 앉으면 살, 오래 서면 뼈, 오래 걸으면 힘줄이 상한다.","box":[[620,476,519,634],[1196,908,382,166]],"src":["BIN-EUM-03"],"tts":"농부 곁 통로를 따라 뽑은 풀 더미가 여섯이나 한 줄로 늘어섰다. 낮은 걸상에 앉은 채 하루 종일 김을 맸다. 오래 앉으면 살이 상한다, 구좌상육. 매달린 고깃덩이와 같은 살이다. 선명오기의 오로소상은 오래 보면 혈, 오래 누우면 기, 오래 앉으면 살, 오래 서면 뼈, 오래 걸으면 힘줄이 상한다."},{"n":7,"kind":"review","obj":"비닐하우스의 농부 한 바퀴 — 입술의 흰 테 · 고깃덩이 · 벌린 입 · 우산 · 군침 · 풀 더미","fact":"其華在脣四白 · 其充在肌 · 開竅於口 / 脾惡濕 · 脾爲涎 · 久坐傷肉","hook":"흰 테 · 고깃덩이 · 입 구멍 / 우산 · 군침 · 풀 더미 여섯","say":"다시 본다. 입술 둘레 흰 테 — 其華在脣四白. 매달린 고깃덩이 — 其充在肌. 벌린 입 — 開竅於口. 우산 — 脾惡濕. 딸기 앞 군침 — 脾爲涎. 줄지은 풀 더미 — 久坐傷肉.","box":[[1124,339,490,735],[922,0,195,425],[620,476,519,634]],"src":[],"tts":"다시 본다. 입술 둘레 흰 테, 기화재순사백. 매달린 고깃덩이, 기충재기. 벌린 입, 개규어구. 우산, 비오습. 딸기 앞 군침, 비위연. 줄지은 풀 더미, 구좌상육."}],"has_image":true},{"id":"zds-04","title":"肺 — 華毛·充皮·竅鼻 · 惡寒·液涕·久臥傷氣","place":"눈바람이 드는 폐교 교실","image":"images/lessons/zds-04.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"깨진 창으로 눈바람이 드는 폐교의 빈 교실 — 바닥에 누운 흰 도포 흰 수염 노인","fact":"肺 — 華 털 · 充 살갗 · 竅 코 / 惡 추위 · 液 콧물 · 勞 오래 눕기","hook":"폐교의 「폐」 = 肺 · 흰 도포 흰 수염 노인 = 肺(相傅之官)","say":"겨울, 문 닫은 시골 학교의 빈 교실. 폐교의 폐 — 肺다. 흰 도포에 흰 수염을 기른 노인이 교실 바닥에 누웠다. 五臟 인물의 肺, 재상인 相傅之官이다. 이 한 사람에게서 肺가 꽃피우는 곳, 채우는 것, 열리는 구멍을 찾고, 『宣明五氣』의 싫어하는 것, 진액, 오래 하면 상하는 것을 찾는다.","box":null,"src":[],"tts":"겨울, 문 닫은 시골 학교의 빈 교실. 폐교의 폐, 폐다. 흰 도포에 흰 수염을 기른 노인이 교실 바닥에 누웠다. 오장 인물의 폐, 재상인 상부지관이다. 이 한 사람에게서 폐가 꽃피우는 곳, 채우는 것, 열리는 구멍을 찾고, 선명오기의 싫어하는 것, 진액, 오래 하면 상하는 것을 찾는다."},{"n":1,"obj":"이불 밖으로 나온 팔뚝과 손등 — 살갗에 빽빽이 난 반짝이는 고운 흰 털","fact":"其華在毛 — 肺의 榮華는 털(솜털)에 핀다","hook":"팔에 반짝이는 흰 털 = 毛에 핀 華","say":"이불 밖으로 나온 노인의 팔뚝과 손등에 고운 흰 털이 빽빽이 나서 반짝반짝 윤이 난다. 肺의 영화는 털에 핀다 — 털 모(毛), 其華在毛. 肺가 살갗을 덮어 지키니 그 위의 솜털이 윤이 난다. 다섯 장부의 華는 心 얼굴, 肺 털, 脾 입술, 肝 손톱, 腎 머리카락이다.","box":[807,807,396,144],"src":["JS-PYE-06","JS-CORE-06"],"tts":"이불 밖으로 나온 노인의 팔뚝과 손등에 고운 흰 털이 빽빽이 나서 반짝반짝 윤이 난다. 폐의 영화는 털에 핀다, 털 모, 기화재모. 폐가 살갗을 덮어 지키니 그 위의 솜털이 윤이 난다. 다섯 장부의 화는 심 얼굴, 폐 털, 비 입술, 간 손톱, 신 머리카락이다."},{"n":2,"obj":"노인 발치 쪽 교탁에 기대 선 큰 북 — 팽팽하게 메운 둥근 가죽","fact":"其充在皮(在體合皮) — 肺가 채우는 것은 살갗","hook":"북에 메운 가죽 = 살갗(皮)","say":"노인 발치 쪽 교탁에 큰 북이 기대 섰다. 팽팽하게 메운 둥근 가죽을 본다. 肺가 채우는 것은 살갗이다 — 가죽 피(皮), 其充在皮, 在體合皮. 북 가죽처럼 몸을 겉에서 한 겹으로 감싸 지키는 것이 皮毛다. 다섯 장부가 채우는 것은 心 핏줄, 肺 살갗, 脾 살, 肝 힘줄, 腎 뼈다.","box":[1280,450,366,311],"src":["JS-CORE-05"],"tts":"노인 발치 쪽 교탁에 큰 북이 기대 섰다. 팽팽하게 메운 둥근 가죽을 본다. 폐가 채우는 것은 살갗이다, 가죽 피, 기충재피, 재체합피. 북 가죽처럼 몸을 겉에서 한 겹으로 감싸 지키는 것이 피모다. 다섯 장부가 채우는 것은 심 핏줄, 폐 살갗, 비 살, 간 힘줄, 신 뼈다."},{"n":3,"obj":"노인의 크고 붉은 코 — 콧구멍 곁에서 위로 피어오르는 숨 김","fact":"開竅於鼻 — 肺는 코로 열린다 · 西方 白 · 數 九 · 音 商 · 臭 腥","hook":"큰 코로 드나드는 숨 = 竅","say":"노인의 크고 붉은 코 곁에서 숨 김이 위로 피어오른다. 肺는 코로 열린다 — 코 비(鼻), 開竅於鼻. 숨이 드나드는 문이 코다. 『金匱眞言論』도 西方의 흰 기운이 肺로 들어가 코로 열린다고 했다. 그 數는 九, 音은 商, 냄새는 비린내 성(腥)이다.","box":[[666,512,148,140],[764,396,209,180]],"src":["JS-CORE-07-01","CI-10"],"tts":"노인의 크고 붉은 코 곁에서 숨 김이 위로 피어오른다. 폐는 코로 열린다, 코 비, 개규어비. 숨이 드나드는 문이 코다. 금궤진언론도 서방의 흰 기운이 폐로 들어가 코로 열린다고 했다. 그 수는 구, 음은 상, 냄새는 비린내 성이다."},{"n":4,"obj":"깨진 창으로 들이치는 눈바람 · 가슴부터 발끝까지 덮은 두툼한 누비이불","fact":"肺惡寒 — 五臟所惡: 肝 風 · 心 熱 · 脾 濕 · 肺 寒 · 腎 燥","hook":"눈바람에 맞서 덮은 두꺼운 이불 = 추위를 싫어함(惡寒)","say":"깨진 창으로 눈발 섞인 찬바람이 들이친다. 노인은 두툼한 누비이불을 가슴부터 발끝까지 덮었다. 肺는 추위를 싫어한다 — 미워할 오(惡), 肺惡寒. 肺는 살갗과 털로 바깥과 맞닿아 찬 기운을 먼저 받는다. 『宣明五氣』의 五臟所惡는 肝 바람, 心 열, 脾 습기, 肺 추위, 腎 마름이다. 燥邪를 말할 때 肺가 마름을 싫어한다는 것과 헷갈리지 않는다.","box":[[0,0,1103,411],[843,545,749,385]],"src":["JSG-026"],"tts":"깨진 창으로 눈발 섞인 찬바람이 들이친다. 노인은 두툼한 누비이불을 가슴부터 발끝까지 덮었다. 폐는 추위를 싫어한다, 미워할 오, 폐오한. 폐는 살갗과 털로 바깥과 맞닿아 찬 기운을 먼저 받는다. 선명오기의 오장소오는 간 바람, 심 열, 비 습기, 폐 추위, 신 마름이다. 조사를 말할 때 폐가 마름을 싫어한다는 것과 헷갈리지 않는다."},{"n":5,"obj":"노인의 콧구멍에서 길게 늘어진 콧물 한 줄기","fact":"肺爲涕 — 五臟化液: 心 汗 · 肺 涕 · 脾 涎 · 肝 淚 · 腎 唾","hook":"코에서 흐르는 콧물 = 涕","say":"노인의 콧구멍에서 콧물이 길게 늘어졌다. 肺의 진액은 콧물이다 — 콧물 체(涕), 肺爲涕. 肺는 코로 열리니 코에서 나오는 물이 肺의 液이다. 肺의 감정은 근심과 슬픔이다. 다섯 장부의 液은 心 땀, 肺 콧물, 脾 군침, 肝 눈물, 腎 침이다.","box":[666,512,148,140],"src":["JS-CORE-09","OHG-035"],"tts":"노인의 콧구멍에서 콧물이 길게 늘어졌다. 폐의 진액은 콧물이다, 콧물 체, 폐위체. 폐는 코로 열리니 코에서 나오는 물이 폐의 액이다. 폐의 감정은 근심과 슬픔이다. 다섯 장부의 액은 심 땀, 폐 콧물, 비 군침, 간 눈물, 신 침이다."},{"n":6,"obj":"책상다리와 매트리스 모서리에 친 거미줄 · 매트리스 모서리 틈으로 새어 나오는 바람","fact":"久臥傷氣 — 五勞所傷: 久視 血 · 久臥 氣 · 久坐 肉 · 久立 骨 · 久行 筋","hook":"거미줄 = 오래 누움(久臥) · 새어 나가는 바람 = 氣가 상함","say":"노인 곁 책상다리와 매트리스 모서리에 거미줄이 쳐졌다. 그만큼 오래 누워 있었다. 깔고 누운 매트리스 모서리 틈으로는 바람이 새어 나간다. 오래 누우면 氣가 상한다 — 久臥傷氣. 肺는 氣를 주관한다. 『宣明五氣』의 五勞所傷은 오래 보면 血, 오래 누우면 氣, 오래 앉으면 살, 오래 서면 뼈, 오래 걸으면 힘줄이 상한다.","box":[[288,476,216,360],[1593,512,231,303],[1549,958,140,101],[295,742,1470,336]],"src":["BIN-EUM-03"],"tts":"노인 곁 책상다리와 매트리스 모서리에 거미줄이 쳐졌다. 그만큼 오래 누워 있었다. 깔고 누운 매트리스 모서리 틈으로는 바람이 새어 나간다. 오래 누우면 기가 상한다, 구와상기. 폐는 기를 주관한다. 선명오기의 오로소상은 오래 보면 혈, 오래 누우면 기, 오래 앉으면 살, 오래 서면 뼈, 오래 걸으면 힘줄이 상한다."},{"n":7,"kind":"review","obj":"폐교 교실의 노인 한 바퀴 — 흰 털 · 북 · 코 · 이불과 눈바람 · 콧물 · 거미줄과 새는 바람","fact":"其華在毛 · 其充在皮 · 開竅於鼻 / 肺惡寒 · 肺爲涕 · 久臥傷氣","hook":"반짝이는 흰 털 · 북 가죽 · 코 / 이불 · 콧물 · 거미줄","say":"다시 본다. 팔의 흰 털 — 其華在毛. 북 가죽 — 其充在皮. 큰 코 — 開竅於鼻. 눈바람과 두꺼운 이불 — 肺惡寒. 콧물 — 肺爲涕. 거미줄과 새는 바람 — 久臥傷氣.","box":[[454,450,1153,614],[1280,450,366,311],[0,0,1103,411]],"src":[],"tts":"다시 본다. 팔의 흰 털, 기화재모. 북 가죽, 기충재피. 큰 코, 개규어비. 눈바람과 두꺼운 이불, 폐오한. 콧물, 폐위체. 거미줄과 새는 바람, 구와상기."}],"has_image":true},{"id":"zds-05","title":"腎 — 華髮·充骨·竅耳 · 惡燥·液唾·久立傷骨","place":"가죽 신이 빼곡한 낡은 신발 가게","image":"images/lessons/zds-05.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"낡은 신발 가게 — 계산대 뒤에 선 검은 옷 대머리 장사","fact":"腎 — 華 머리카락 · 充 뼈 · 竅 귀 / 惡 마름 · 液 침 · 勞 오래 서기","hook":"신발 가게의 「신」 = 腎 · 검은 옷 대머리 장사 = 腎(五臟 인물) · 검정 = 水","say":"가죽 신이 빼곡한 낡은 신발 가게. 신발의 신 — 腎이다. 계산대 뒤에 검은 옷을 입은 대머리 장사가 섰다. 五臟 인물의 腎, 水의 장부이고 힘을 쓰는 作强之官이다. 이 한 사람에게서 腎이 꽃피우는 곳, 채우는 것, 열리는 구멍을 찾고, 『宣明五氣』의 싫어하는 것, 진액, 오래 하면 상하는 것을 찾는다.","box":null,"src":[],"tts":"가죽 신이 빼곡한 낡은 신발 가게. 신발의 신, 신이다. 계산대 뒤에 검은 옷을 입은 대머리 장사가 섰다. 오장 인물의 신, 수의 장부이고 힘을 쓰는 작강지관이다. 이 한 사람에게서 신이 꽃피우는 곳, 채우는 것, 열리는 구멍을 찾고, 선명오기의 싫어하는 것, 진액, 오래 하면 상하는 것을 찾는다."},{"n":1,"obj":"계산대 위 벨벳 방석에 귀하게 올려 둔 윤기 흐르는 긴 검은 머리채 — 반짝이","fact":"其華在髮 — 腎의 榮華는 머리카락에 핀다 · 先天之本 · 封藏之本","hook":"반짝이는 검은 머리채 = 髮에 핀 華 · 대머리 장사가 아끼는 보물","say":"계산대 위 벨벳 방석에 윤기 흐르는 긴 검은 머리채가 보물처럼 놓였다. 대머리 장사가 가장 아끼는 물건이다. 腎의 영화는 머리카락에 핀다 — 터럭 발(髮), 其華在髮. 腎精이 넉넉하면 머리카락이 검고 윤이 나고, 모자라면 희고 빠진다. 腎은 先天之本, 封藏之本이고, 물과 불이 함께 사는 水火之宅이다. 다섯 장부의 華는 心 얼굴, 肺 털, 脾 입술, 肝 손톱, 腎 머리카락이다.","box":[1251,786,784,241],"src":["JS-SIN-04","JS-CORE-06","JSG-018"],"tts":"계산대 위 벨벳 방석에 윤기 흐르는 긴 검은 머리채가 보물처럼 놓였다. 대머리 장사가 가장 아끼는 물건이다. 신의 영화는 머리카락에 핀다, 터럭 발, 기화재발. 신정이 넉넉하면 머리카락이 검고 윤이 나고, 모자라면 희고 빠진다. 신은 선천지본, 봉장지본이고, 물과 불이 함께 사는 수화지택이다. 다섯 장부의 화는 심 얼굴, 폐 털, 비 입술, 간 손톱, 신 머리카락이다."},{"n":2,"obj":"엉덩이 높이 띠에 꽂아 몸 옆에 늘어뜨린 큰 흰 뼈 — 양 끝이 둥근 뼈","fact":"其充在骨(在體合骨) — 腎이 채우는 것은 뼈 · 主骨生髓","hook":"몸에 지닌 뼈 = 骨 · 뼈 = 骨(yyox-06과 같은 뜻)","say":"장사의 몸 옆에 양 끝이 둥근 큰 흰 뼈가 띠에 꽂혀 늘어졌다. 腎이 채우는 것은 뼈다 — 뼈 골(骨), 其充在骨, 在體合骨. 腎은 뼈를 주관하고 골수를 낳으며, 뇌는 골수가 모인 바다다 — 主骨生髓, 腦爲髓之海. 다섯 장부가 채우는 것은 心 핏줄, 肺 살갗, 脾 살, 肝 힘줄, 腎 뼈다.","box":[1228,493,167,346],"src":["JS-CORE-05"],"tts":"장사의 몸 옆에 양 끝이 둥근 큰 흰 뼈가 띠에 꽂혀 늘어졌다. 신이 채우는 것은 뼈다, 뼈 골, 기충재골, 재체합골. 신은 뼈를 주관하고 골수를 낳으며, 뇌는 골수가 모인 바다다, 주골생수, 뇌위수지해. 다섯 장부가 채우는 것은 심 핏줄, 폐 살갗, 비 살, 간 힘줄, 신 뼈다."},{"n":3,"obj":"귀에 대고 듣는 놋쇠 나팔 보청기","fact":"開竅於耳(및 二陰) — 腎은 귀로 열린다","hook":"귀에 댄 나팔 보청기 = 귀(耳)","say":"장사가 한 손으로 놋쇠 나팔 보청기를 귀에 대고 듣는다. 腎은 귀로 열린다 — 귀 이(耳), 開竅於耳. 腎精이 모자라면 귀가 울리고 잘 안 들린다. 腎은 아래의 두 구멍, 二陰으로도 열린다. 『金匱眞言論』이 腎의 구멍을 二陰이라 한 이야기는 다음 과에서 본다.","box":[[1127,40,432,259],[1124,195,50,58]],"src":["JS-CORE-07-05"],"tts":"장사가 한 손으로 놋쇠 나팔 보청기를 귀에 대고 듣는다. 신은 귀로 열린다, 귀 이, 개규어이. 신정이 모자라면 귀가 울리고 잘 안 들린다. 신은 아래의 두 구멍, 이음으로도 열린다. 금궤진언론이 신의 구멍을 이음이라 한 이야기는 다음 과에서 본다."},{"n":4,"obj":"낮은 선반의 바싹 말라 갈라진 가죽 장화들 · 그 곁에서 흰 김을 뿜는 가습기","fact":"腎惡燥 — 五臟所惡: 肝 風 · 心 熱 · 脾 濕 · 肺 寒 · 腎 燥","hook":"마른 가죽에 김을 뿜는 가습기 = 마름을 싫어함(惡燥)","say":"낮은 선반의 가죽 장화들이 바싹 말라 쩍쩍 갈라졌다. 그 곁에서 가습기가 흰 김을 뭉게뭉게 뿜는다. 腎은 마름을 싫어한다 — 미워할 오(惡), 腎惡燥. 腎은 물의 장부라 진액이 마르면 견디지 못한다. 『宣明五氣』의 五臟所惡는 肝 바람, 心 열, 脾 습기, 肺 추위, 腎 마름이다.","box":[[65,487,548,381],[450,202,274,430]],"src":["JSG-026"],"tts":"낮은 선반의 가죽 장화들이 바싹 말라 쩍쩍 갈라졌다. 그 곁에서 가습기가 흰 김을 뭉게뭉게 뿜는다. 신은 마름을 싫어한다, 미워할 오, 신오조. 신은 물의 장부라 진액이 마르면 견디지 못한다. 선명오기의 오장소오는 간 바람, 심 열, 비 습기, 폐 추위, 신 마름이다."},{"n":5,"obj":"오므린 입에서 퉤 날아가는 침 덩이 · 계산대 위 검은 구두에 튄 침","fact":"腎爲唾 — 뱉는 침(唾) · 흘리는 군침(涎)은 脾","hook":"구두에 퉤 뱉는 침 = 唾","say":"장사는 입을 오므려 침을 퉤 뱉는다. 계산대 위 검은 구두에도 침이 튀었다. 침을 발라 헝겊으로 문질러 광을 낸다. 腎의 진액은 뱉는 침이다 — 침 타(唾), 腎爲唾. 혀 밑에서 솟아 뱉는 걸쭉한 침이 唾다. 입가로 저절로 흘러내리는 묽은 군침 涎은 脾의 液이다. 다섯 장부의 液은 心 땀, 肺 콧물, 脾 군침, 肝 눈물, 腎 침이다.","box":[[915,271,197,187],[775,713,303,270]],"src":["JS-CORE-09","OHG-035"],"tts":"장사는 입을 오므려 침을 퉤 뱉는다. 계산대 위 검은 구두에도 침이 튀었다. 침을 발라 헝겊으로 문질러 광을 낸다. 신의 진액은 뱉는 침이다, 침 타, 신위타. 혀 밑에서 솟아 뱉는 걸쭉한 침이 타다. 입가로 저절로 흘러내리는 묽은 군침 연은 비의 액이다. 다섯 장부의 액은 심 땀, 폐 콧물, 비 군침, 간 눈물, 신 침이다."},{"n":6,"obj":"장사 뒤에 먼지와 거미줄을 뒤집어쓴 빈 나무 의자","fact":"久立傷骨 — 五勞所傷: 久視 血 · 久臥 氣 · 久坐 肉 · 久立 骨 · 久行 筋","hook":"한 번도 안 앉은 의자의 거미줄 = 종일 서 있음(久立)","say":"장사 뒤의 나무 의자는 먼지와 거미줄을 뒤집어썼다. 한 번도 앉지 않고 종일 서서 일했다. 오래 서면 뼈가 상한다 — 久立傷骨. 몸에 지닌 것과 같은 뼈다. 『宣明五氣』의 五勞所傷은 오래 보면 血, 오래 누우면 氣, 오래 앉으면 살, 오래 서면 뼈, 오래 걸으면 힘줄이 상한다.","box":[1401,300,355,486],"src":["BIN-EUM-03"],"tts":"장사 뒤의 나무 의자는 먼지와 거미줄을 뒤집어썼다. 한 번도 앉지 않고 종일 서서 일했다. 오래 서면 뼈가 상한다, 구립상골. 몸에 지닌 것과 같은 뼈다. 선명오기의 오로소상은 오래 보면 혈, 오래 누우면 기, 오래 앉으면 살, 오래 서면 뼈, 오래 걸으면 힘줄이 상한다."},{"n":7,"kind":"review","obj":"신발 가게의 장사 한 바퀴 — 머리채 · 뼈 구둣주걱 · 나팔 보청기 · 가습기 · 침 · 거미줄 의자","fact":"其華在髮 · 其充在骨 · 開竅於耳 / 腎惡燥 · 腎爲唾 · 久立傷骨","hook":"검은 머리채 · 뼈 · 나팔 보청기 / 가습기 · 퉤 뱉은 침 · 거미줄 의자","say":"다시 본다. 반짝이는 머리채 — 其華在髮. 허리의 뼈 — 其充在骨. 나팔 보청기 — 開竅於耳. 마른 장화와 가습기 — 腎惡燥. 구두에 뱉은 침 — 腎爲唾. 거미줄 앉은 빈 의자 — 久立傷骨.","box":[[747,84,741,807],[1251,786,784,241],[65,487,548,381],[1401,300,355,486]],"src":[],"tts":"다시 본다. 반짝이는 머리채, 기화재발. 허리의 뼈, 기충재골. 나팔 보청기, 개규어이. 마른 장화와 가습기, 신오조. 구두에 뱉은 침, 신위타. 거미줄 앉은 빈 의자, 구립상골."}],"has_image":true},{"id":"zds-06","title":"藏象 원문 대조 — 五臟 陰陽 배속 · 新校正 · 편마다 갈리는 開竅 · 倉廩之本 · 所藏","place":"출판사 교정실의 단면","image":"images/lessons/zds-06.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"출판사 교정실의 단면 — 햇빛 드는 다락 · 그늘진 아래층 · 맨 아래 곳간","fact":"藏象 원문 대조 — 五臟 陰陽 배속 · 판본 교정 · 편마다 갈리는 開竅 · 倉廩之本 · 所藏","hook":"교정실 = 판본을 바로잡는 곳 · 위층 햇빛 = 陽分 · 아래층 그늘 = 陰分 · 곳간 = 倉廩","say":"출판사 교정실을 칼로 자른 듯 단면으로 본다. 위층 다락은 천창으로 햇빛이 쏟아지고, 아래층은 그늘이 짙으며, 맨 아래에는 곳간이 열려 있다. 五臟 인물들이 층마다 자리를 잡았다. 이 과는 같은 藏象이 편과 판본마다 어떻게 갈리는지 바로잡는 자리다.","box":null,"src":[],"tts":"출판사 교정실을 칼로 자른 듯 단면으로 본다. 위층 다락은 천창으로 햇빛이 쏟아지고, 아래층은 그늘이 짙으며, 맨 아래에는 곳간이 열려 있다. 오장 인물들이 층마다 자리를 잡았다. 이 과는 같은 장상이 편과 판본마다 어떻게 갈리는지 바로잡는 자리다."},{"n":1,"obj":"위층 햇빛 속 — 횃불 든 임금 · 양산 그늘 아래 노인 / 아래층 그늘 속 — 등불 든 장군 · 검은 우산 아래 대머리 / 맨 아래 곳간의 농부","fact":"心 陽中之陽 · 肺 陽中之陰 · 肝 陰中之陽 · 腎 陰中之陰 · 脾 至陰","hook":"층 = 陽中/陰中 · 손에 든 불 = 之陽 · 받쳐 든 그늘 = 之陰 · 맨 아래 곳간 = 至陰","say":"위층 햇빛 속은 陽, 아래층 그늘 속은 陰이다. 위층의 임금은 햇빛 속에서 횃불까지 들었다 — 陽 속의 陽, 心은 陽中之陽. 노인은 햇빛 속에서 양산 그늘에 들었다 — 陽 속의 陰, 肺는 陽中之陰. 아래층 장군은 그늘 속에서 등불을 들었다 — 陰 속의 陽, 肝은 陰中之陽. 대머리는 그늘 속에서 검은 우산까지 썼다 — 陰 속의 陰, 腎은 陰中之陰. 맨 아래 곳간의 농부, 脾는 至陰이다. 하루로는 해 뜰 녘부터 한낮이 陽中之陽, 한낮부터 해 질 녘이 陽中之陰, 밤부터 닭 울 녘이 陰中之陰, 닭 울 녘부터 해 뜰 녘이 陰中之陽이다. 王冰本 『六節藏象論』 한 종만은 肝을 陽中之少陽, 肺를 陽中之太陰, 腎을 陰中之少陰이라 거꾸로 적었다.","box":[[421,84,274,461],[1387,112,274,432],[233,602,282,366],[1568,602,317,352],[963,992,150,151]],"src":["YY-16-01","YY-16-02","YY-16-03","YY-16-04","YY-16-05","OHG-012","OHG-013"],"tts":"위층 햇빛 속은 양, 아래층 그늘 속은 음이다. 위층의 임금은 햇빛 속에서 횃불까지 들었다, 양 속의 양, 심은 양중지양. 노인은 햇빛 속에서 양산 그늘에 들었다, 양 속의 음, 폐는 양중지음. 아래층 장군은 그늘 속에서 등불을 들었다, 음 속의 양, 간은 음중지양. 대머리는 그늘 속에서 검은 우산까지 썼다, 음 속의 음, 신은 음중지음. 맨 아래 곳간의 농부, 비는 지음이다. 하루로는 해 뜰 녘부터 한낮이 양중지양, 한낮부터 해 질 녘이 양중지음, 밤부터 닭 울 녘이 음중지음, 닭 울 녘부터 해 뜰 녘이 음중지양이다. 왕빙본 육절장상론 한 종만은 간을 양중지소양, 폐를 양중지태음, 신을 음중지소음이라 거꾸로 적었다."},{"n":2,"obj":"아래층 가운데 책상 — 동그란 안경의 교정자가 붉은 펜으로 낡은 책을 고침","fact":"新校正 — 肺는 陽分 안이라 少陰 · 腎은 陰分 안이라 太陰(王冰本을 바로잡음)","hook":"붉은 펜 = 바로잡을 교(校)·바를 정(正) · 낡은 책 = 王冰本","say":"아래층 가운데에서 교정자가 붉은 펜으로 낡은 책을 고친다. 宋나라의 新校正이 王冰本을 바로잡는 모습이다. 肺는 十二經으로는 太陰이지만, 몸의 陽分인 위쪽 안에서는 陰이 적으니 少陰이 되어야 한다. 腎도 十二經으로는 少陰이지만, 陰分인 아래쪽 안에서는 陰이 큰 太陰이다. 그래서 新校正과 全元起本, 『甲乙經』, 『太素』, 『靈樞』 九針十二原이 모두 王冰本과 반대다. 心과 脾는 이견이 없다.","box":[804,617,453,323],"src":[],"tts":"아래층 가운데에서 교정자가 붉은 펜으로 낡은 책을 고친다. 송나라의 신교정이 왕빙본을 바로잡는 모습이다. 폐는 십이경으로는 태음이지만, 몸의 양분인 위쪽 안에서는 음이 적으니 소음이 되어야 한다. 신도 십이경으로는 소음이지만, 음분인 아래쪽 안에서는 음이 큰 태음이다. 그래서 신교정과 전원기본, 갑을경, 태소, 영추 구침십이원이 모두 왕빙본과 반대다. 심과 비는 이견이 없다."},{"n":3,"obj":"위층 임금 곁의 금테 두른 궤짝 — 뚜껑에 그린 큰 귀","fact":"心의 竅 — 陰陽應象大論 舌 ↔ 金匱眞言論 耳 (心寄竅於耳는 新校正 주)","hook":"금 궤짝(金匱) 뚜껑의 귀 = 金匱眞言論은 心이 귀로 열린다 · 금 궤짝은 yyox-05와 같은 뜻","say":"위층 임금 곁에 금테 두른 궤짝이 있고, 뚜껑에 큰 귀가 그려졌다. 금 궤짝은 『金匱眞言論』이다. 이 편은 南方의 붉은 기운이 心으로 들어가 귀로 열린다고 했다 — 開竅於耳. 그 數는 七, 音은 소리 徵, 냄새는 탄내 초(焦)다. 그런데 『陰陽應象大論』은 心의 구멍을 혀라 했다 — 在竅爲舌. 두 편이 다섯 장부를 각각 다 든다. 心이 귀에도 구멍을 맡긴다는 心寄竅於耳는 新校正의 주다. 흔히 외우는 五官은 눈 肝, 혀 心, 입 脾, 코 肺, 귀 腎이다.","box":[[228,401,179,144],[421,84,274,461]],"src":["CI-08","OHG-034"],"tts":"위층 임금 곁에 금테 두른 궤짝이 있고, 뚜껑에 큰 귀가 그려졌다. 금 궤짝은 금궤진언론이다. 이 편은 남방의 붉은 기운이 심으로 들어가 귀로 열린다고 했다, 개규어이. 그 수는 칠, 음은 소리 치, 냄새는 탄내 초다. 그런데 음양응상대론은 심의 구멍을 혀라 했다, 재규위설. 두 편이 다섯 장부를 각각 다 든다. 심이 귀에도 구멍을 맡긴다는 심기규어이는 신교정의 주다. 흔히 외우는 오관은 눈 간, 혀 심, 입 비, 코 폐, 귀 신이다."},{"n":4,"obj":"아래층 대머리 곁의 금테 두른 궤짝 — 뚜껑에 뚫린 둥근 구멍 둘","fact":"腎의 竅 — 陰陽應象大論 耳 ↔ 金匱眞言論 二陰(앞뒤 두 구멍)","hook":"금 궤짝 뚜껑의 구멍 둘 = 二陰","say":"아래층 대머리 곁의 금테 궤짝 뚜껑에는 둥근 구멍이 둘 뚫렸다. 『金匱眞言論』은 北方의 검은 기운이 腎으로 들어가 二陰, 앞뒤 두 구멍으로 열린다고 했다. 그 數는 六, 音은 羽, 냄새는 썩은 내 부(腐)다. 『陰陽應象大論』은 腎의 구멍을 귀라 했다. 그래서 腎은 귀와 二陰으로 열린다고 함께 적는다. 腎의 氣는 귀로 통한다.","box":[[1770,833,173,159],[1568,602,317,352]],"src":["CI-11","JS-CORE-07-05"],"tts":"아래층 대머리 곁의 금테 궤짝 뚜껑에는 둥근 구멍이 둘 뚫렸다. 금궤진언론은 북방의 검은 기운이 신으로 들어가 이음, 앞뒤 두 구멍으로 열린다고 했다. 그 수는 육, 음은 우, 냄새는 썩은 내 부다. 음양응상대론은 신의 구멍을 귀라 했다. 그래서 신은 귀와 이음으로 열린다고 함께 적는다. 신의 기는 귀로 통한다."},{"n":5,"obj":"맨 아래 열린 곳간 — 사다리로 올라오는 노란 옷 농부와 큰 항아리 · 똬리 튼 굵은 호스 · 층층 바구니 · 묶은 자루 · 병 같은 그릇들","fact":"倉廩之本 = 脾·胃·大腸·小腸·三焦·膀胱 — 營之居 · 名曰器","hook":"곳간(倉廩)에 함께 든 농부와 그릇들 = 脾 하나가 아니라 여섯 기관","say":"맨 아래 곳간이 열렸다. 노란 옷 농부가 사다리로 올라오고, 곳간에는 큰 항아리, 똬리 튼 호스, 층층이 쌓은 바구니, 묶은 자루와 병 같은 그릇이 그득하다. 『六節藏象論』은 「脾胃大腸小腸三焦膀胱者 倉廩之本」이라 하여, 脾, 胃, 大腸, 小腸, 三焦, 膀胱 여섯을 함께 곳간의 근본으로 들었다. 營이 머무는 곳이고 그릇이라 부른다 — 名曰器. 「脾者 倉廩之本」으로 脾만 떼어 외우는 것은 후대의 정리다.","box":[588,944,908,199],"src":["JQ-SHIN-15-03"],"tts":"맨 아래 곳간이 열렸다. 노란 옷 농부가 사다리로 올라오고, 곳간에는 큰 항아리, 똬리 튼 호스, 층층이 쌓은 바구니, 묶은 자루와 병 같은 그릇이 그득하다. 육절장상론은 비위대장소장삼초방광자 창름지본이라 하여, 비, 위, 대장, 소장, 삼초, 방광 여섯을 함께 곳간의 근본으로 들었다. 영이 머무는 곳이고 그릇이라 부른다, 명왈기. 비자 창름지본으로 비만 떼어 외우는 것은 후대의 정리다."},{"n":6,"obj":"다섯 인물 — 횃불 든 임금 · 양산 쓴 노인 · 등불 든 장군 · 검은 우산 아래 대머리 · 곳간의 농부","fact":"六節藏象論 五本 — 心 生 · 肺 氣 · 肝 罷極 · 腎 封藏 / 所藏 神·魄·魂·精·營","hook":"횃불 = 生 · 우산으로 덮어 가림 = 封藏 · 意·志는 이 편에 없다","say":"『六節藏象論』이 다섯 장부를 무엇의 근본이라 했는지 본다. 횃불 든 임금, 心은 生之本이고 神이 머문다. 노인, 肺는 氣之本이고 魄이 머문다. 장군, 肝은 罷極之本이고 魂이 머문다 — 肝者 罷極之本 魂之居也. 우산으로 덮어 가린 대머리, 腎은 蟄封藏之本이고 精이 머문다. 곳간은 倉廩之本이고 營이 머문다. 이 편에는 意도 志도 없다. 흔히 외우는 五神 魂, 神, 意, 魄, 志는 『靈樞』 本神篇이다 — 肝은 血을 갈무리하고 血에 魂이 깃들며, 心은 脈에 神, 脾는 營에 意, 肺는 氣에 魄, 腎은 精에 志가 깃든다. 두 편을 섞지 않는다.","box":[[421,84,274,461],[1387,112,274,432],[233,602,282,366],[1568,602,317,352],[963,992,150,151]],"src":["HUBJQ-0174","JQ-SHIN-14","JQ-SHIN-06","JQ-SHIN-15-01","JQ-SHIN-15-02","JQ-SHIN-15-04","JQ-SHIN-15-05"],"tts":"육절장상론이 다섯 장부를 무엇의 근본이라 했는지 본다. 횃불 든 임금, 심은 생지본이고 신이 머문다. 노인, 폐는 기지본이고 백이 머문다. 장군, 간은 파극지본이고 혼이 머문다, 간자 파극지본 혼지거야. 우산으로 덮어 가린 대머리, 신은 칩봉장지본이고 정이 머문다. 곳간은 창름지본이고 영이 머문다. 이 편에는 의도 지도 없다. 흔히 외우는 오신 혼, 신, 의, 백, 지는 영추 본신편이다, 간은 혈을 갈무리하고 혈에 혼이 깃들며, 심은 맥에 신, 비는 영에 의, 폐는 기에 백, 신은 정에 지가 깃든다. 두 편을 섞지 않는다."},{"n":7,"kind":"review","obj":"교정실 한 바퀴 — 위층 둘 · 아래층 둘과 교정자 · 금 궤짝 둘 · 곳간","fact":"陽中之陽 心 · 陽中之陰 肺 · 陰中之陽 肝 · 陰中之陰 腎 · 至陰 脾 / 金匱 心耳·腎二陰","hook":"횃불 · 양산 · 등불 · 검은 우산 · 곳간 / 붉은 펜 / 귀 궤짝 · 구멍 둘 궤짝","say":"다시 본다. 햇빛 속 횃불 — 心 陽中之陽. 햇빛 속 양산 — 肺 陽中之陰. 그늘 속 등불 — 肝 陰中之陽. 그늘 속 검은 우산 — 腎 陰中之陰. 곳간 — 脾 至陰이자 여섯 기관의 倉廩之本. 붉은 펜 — 新校正이 王冰本을 바로잡음. 귀 그린 금 궤짝 — 心 開竅於耳, 구멍 둘 금 궤짝 — 腎 開竅於二陰.","box":[[58,0,1939,577],[58,584,1939,425],[588,944,908,199]],"src":[],"tts":"다시 본다. 햇빛 속 횃불, 심 양중지양. 햇빛 속 양산, 폐 양중지음. 그늘 속 등불, 간 음중지양. 그늘 속 검은 우산, 신 음중지음. 곳간, 비 지음이자 여섯 기관의 창름지본. 붉은 펜, 신교정이 왕빙본을 바로잡음. 귀 그린 금 궤짝, 심 개규어이, 구멍 둘 금 궤짝, 신 개규어이음."}],"has_image":true},{"id":"zds-07","title":"장부병리 감별 ① — 心火↔肝火 · 腎陽虛↔腎陰虛 · 心腎相交(水火)","place":"밤의 대중목욕탕 단면","image":"images/lessons/zds-07.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"밤의 대중목욕탕 단면 — 가운데 온탕과 그 밑 아궁이 · 왼쪽 냉탕 · 오른쪽 한증막 · 앞 휴게 마루","fact":"장부병리 감별 ① — 心火↔肝火 · 腎陽虛↔腎陰虛 · 心腎相交(水火)","hook":"온탕 물(腎水) 밑의 불(心火) = 水火旣濟 · 냉탕 = 陽虛 · 한증막 = 陰虛","say":"밤늦은 대중목욕탕을 단면으로 본다. 가운데 온탕 밑에서는 아궁이 불이 탄다. 왼쪽은 얼음 뜬 냉탕, 오른쪽은 한증막, 앞은 휴게 마루다. 이 과는 헷갈리는 짝을 가른다 — 心火와 肝火, 腎陽虛와 腎陰虛, 그리고 心과 腎이 물과 불로 사귀는 것.","box":null,"src":[],"tts":"밤늦은 대중목욕탕을 단면으로 본다. 가운데 온탕 밑에서는 아궁이 불이 탄다. 왼쪽은 얼음 뜬 냉탕, 오른쪽은 한증막, 앞은 휴게 마루다. 이 과는 헷갈리는 짝을 가른다, 심화와 간화, 신양허와 신음허, 그리고 심과 신이 물과 불로 사귀는 것."},{"n":1,"obj":"마루에 누운 붉은 용포 임금 — 혀끝이 새빨간 내민 혀 · 입가의 붉은 헌데","fact":"心火에만 — 口舌生瘡·糜爛 · 舌尖紅 · 小便短赤(心移熱於小腸) · 脈數","hook":"임금(心)의 새빨간 혀끝과 입가 헌데 = 心火는 혀로","say":"휴게 마루에 누운 임금이 혀를 내밀었다. 혀끝이 새빨갛고 입가에 붉은 헌데가 났다. 心火다. 心은 혀로 열리니 心火가 위로 타면 입과 혀가 헐어 문드러진다 — 口舌生瘡, 口舌糜爛. 혀끝이 붉다 — 舌尖紅. 心의 열이 짝인 小腸으로 옮겨 가면 소변이 적고 붉으며 요도가 화끈거린다 — 小便短赤. 가슴이 답답하고 잠을 못 이루며 꿈이 많고, 맥은 빠르다. 心火를 맑히고 小腸의 火를 덜어 고친다.","box":[[310,790,97,92],[147,689,764,389]],"src":["JSG2-011","JSG2-012"],"tts":"휴게 마루에 누운 임금이 혀를 내밀었다. 혀끝이 새빨갛고 입가에 붉은 헌데가 났다. 심화다. 심은 혀로 열리니 심화가 위로 타면 입과 혀가 헐어 문드러진다, 구설생창, 구설미란. 혀끝이 붉다, 설첨홍. 심의 열이 짝인 소장으로 옮겨 가면 소변이 적고 붉으며 요도가 화끈거린다, 소변단적. 가슴이 답답하고 잠을 못 이루며 꿈이 많고, 맥은 빠르다. 심화를 맑히고 소장의 화를 덜어 고친다."},{"n":2,"obj":"오른쪽 앞에 선 초록 갑옷 장군 — 벌겋게 부은 두 눈 · 버럭 소리치는 입 · 갈비 아래를 짚은 손","fact":"肝火에만 — 目赤腫痛 · 急躁易怒 · 脇肋灼痛 · 暴發 耳鳴耳聾 · 脈弦","hook":"장군(肝)의 새빨간 눈과 버럭 = 肝火는 눈으로","say":"장군은 두 눈이 벌겋게 붓고, 버럭버럭 소리친다. 손은 갈비 아래를 짚었다. 肝火다. 肝은 눈으로 열리니 肝火가 위로 타면 눈이 붉게 붓고 아프다 — 目赤腫痛. 얼굴이 붉고 성급하며 화를 잘 낸다 — 急躁易怒. 옆구리가 타는 듯 아프고, 귀가 갑자기 울리거나 먹먹해지며, 맥은 팽팽한 弦이다. 같은 火라도 혀는 心, 눈은 肝이다. 肝氣는 정상의 疏泄, 肝陽上亢은 위로 솟은 陽이라 머리가 아프고 어지러우며, 肝火上炎은 實熱이다.","box":[[1722,584,144,86],[1626,516,395,627]],"src":["JSG2-009","JSG-039"],"tts":"장군은 두 눈이 벌겋게 붓고, 버럭버럭 소리친다. 손은 갈비 아래를 짚었다. 간화다. 간은 눈으로 열리니 간화가 위로 타면 눈이 붉게 붓고 아프다, 목적종통. 얼굴이 붉고 성급하며 화를 잘 낸다, 급조역로. 옆구리가 타는 듯 아프고, 귀가 갑자기 울리거나 먹먹해지며, 맥은 팽팽한 현이다. 같은 화라도 혀는 심, 눈은 간이다. 간기는 정상의 소설, 간양상항은 위로 솟은 양이라 머리가 아프고 어지러우며, 간화상염은 실열이다."},{"n":3,"obj":"냉탕 대머리의 허옇게 두툼한 혀 · 한증막 대머리의 붉고 가는 혀","fact":"腎陽虛 舌淡胖 苔白 ↔ 腎陰虛 舌紅少津 少苔","hook":"찬 쪽 혀는 허옇고 두툼 · 뜨거운 쪽 혀는 붉고 마름","say":"검은 반바지를 입은 대머리 둘이 혀를 내밀었다. 둘 다 腎이다. 왼쪽 냉탕의 대머리 혀는 허옇고 두툼하며 흰 이끼가 끼었다 — 舌淡胖 苔白, 腎陽虛. 오른쪽 한증막의 대머리 혀는 붉고 가늘며 마르고 이끼가 없다 — 舌紅少津 少苔, 腎陰虛. 陽虛는 虛寒, 陰虛는 虛熱이다.","box":[[324,231,111,79],[1683,199,101,107]],"src":["JSG-041"],"tts":"검은 반바지를 입은 대머리 둘이 혀를 내밀었다. 둘 다 신이다. 왼쪽 냉탕의 대머리 혀는 허옇고 두툼하며 흰 이끼가 끼었다, 설담반 태백, 신양허. 오른쪽 한증막의 대머리 혀는 붉고 가늘며 마르고 이끼가 없다, 설홍소진 소태, 신음허. 양허는 허한, 음허는 허열이다."},{"n":4,"obj":"얼음 뜬 냉탕에서 제 몸을 끌어안고 덜덜 떠는 대머리 — 퍼렇게 질린 얼굴과 다리 · 불룩한 발목","fact":"腎陽虛에만 — 畏寒肢冷 · 浮腫 · 小便淸長 · 陽痿 · 五更泄瀉","hook":"냉탕에서 떨기 = 추위를 탐 · 부은 발목 = 水腫","say":"냉탕의 대머리는 얼굴과 다리가 퍼렇게 질려 제 몸을 끌어안고 덜덜 떤다. 발목이 불룩하게 부었다. 腎陽虛다. 命門의 불이 꺼져 온몸이 춥고 손발이 차다 — 畏寒肢冷. 물을 데우지 못해 붓고, 소변은 맑고 많다 — 小便淸長. 성 기능이 떨어지고 — 陽痿, 허리와 무릎이 차고 아프다. 새벽 닭 울 녘마다 설사한다 — 五更泄瀉. 혀는 허옇고 맥은 가라앉아 힘이 없다.","box":[[242,156,262,366],[353,425,151,97]],"src":["JSG2-019","JD-MOON-07-01"],"tts":"냉탕의 대머리는 얼굴과 다리가 퍼렇게 질려 제 몸을 끌어안고 덜덜 떤다. 발목이 불룩하게 부었다. 신양허다. 명문의 불이 꺼져 온몸이 춥고 손발이 차다, 외한지랭. 물을 데우지 못해 붓고, 소변은 맑고 많다, 소변청장. 성 기능이 떨어지고, 양위, 허리와 무릎이 차고 아프다. 새벽 닭 울 녘마다 설사한다, 오경설사. 혀는 허옇고 맥은 가라앉아 힘이 없다."},{"n":5,"obj":"달 뜬 창의 한증막에서 땀이 맺힌 대머리 — 새빨간 광대뼈 · 벌겋게 달아오른 손바닥과 발","fact":"腎陰虛에만 — 五心煩熱 · 潮熱盜汗 · 顴紅 · 溲黃便乾 · 足跟痛","hook":"손바닥·발바닥·가슴이 달아오름 = 五心煩熱 · 밤(달)의 땀 = 盜汗 · 붉은 광대 = 顴紅","say":"한증막 창으로 달이 보인다. 대머리는 밤인데도 땀이 송골송골 맺혔고, 광대뼈가 새빨갛다. 손바닥과 발이 벌겋게 달아올랐다. 腎陰虛다. 두 손바닥, 두 발바닥, 가슴 다섯 곳이 화끈거린다 — 五心煩熱. 오후와 밤에 열이 오르고 잠들면 땀이 난다 — 潮熱盜汗. 광대뼈가 붉다 — 顴紅. 소변은 누렇고 변은 마르며, 발뒤꿈치가 아프다. 오히려 성욕이 쉽게 솟는다. 허리와 무릎이 시큰거리고 어지럽고 귀가 울리며 정액이 새는 것은 陰虛와 陽虛에 다 있다.","box":[[1559,141,317,481],[1554,396,298,226],[1848,55,124,231]],"src":["JSG2-018","SW-M6-13-02"],"tts":"한증막 창으로 달이 보인다. 대머리는 밤인데도 땀이 송골송골 맺혔고, 광대뼈가 새빨갛다. 손바닥과 발이 벌겋게 달아올랐다. 신음허다. 두 손바닥, 두 발바닥, 가슴 다섯 곳이 화끈거린다, 오심번열. 오후와 밤에 열이 오르고 잠들면 땀이 난다, 조열도한. 광대뼈가 붉다, 관홍. 소변은 누렇고 변은 마르며, 발뒤꿈치가 아프다. 오히려 성욕이 쉽게 솟는다. 허리와 무릎이 시큰거리고 어지럽고 귀가 울리며 정액이 새는 것은 음허와 양허에 다 있다."},{"n":6,"obj":"가운데 온탕 — 위의 검푸른 물과 그 바로 밑에서 타는 아궁이 불 · 피어오르는 김","fact":"心腎相交 = 水火旣濟 — 心火는 내려가 腎水를 데우고 腎水는 올라 心火를 누름","hook":"물 아래 불 = 旣濟 · 불이 물을 데우고 물이 불을 누름","say":"가운데 온탕을 본다. 위에는 검푸른 물, 그 바로 밑에서 아궁이 불이 탄다. 불은 물을 데우고, 물은 불이 지나치게 타지 않게 누른다. 몸에서는 위에 있는 心火가 아래로 내려가 腎水를 따뜻하게 하고, 아래에 있는 腎水가 위로 올라가 心火를 기르고 누른다 — 心과 腎이 사귄다, 心腎相交. 물이 위, 불이 아래인 『周易』의 旣濟괘라 水火旣濟라 한다. 이것은 병이 아니라 건강한 모습이다. 心腎을 사귀게 하는 것은 心과 腎의 관계이지 脾의 기능이 아니다.","box":[[651,303,749,213],[872,574,274,143]],"src":["JS-REL-03","JSG-034","JSG2-001"],"tts":"가운데 온탕을 본다. 위에는 검푸른 물, 그 바로 밑에서 아궁이 불이 탄다. 불은 물을 데우고, 물은 불이 지나치게 타지 않게 누른다. 몸에서는 위에 있는 심화가 아래로 내려가 신수를 따뜻하게 하고, 아래에 있는 신수가 위로 올라가 심화를 기르고 누른다, 심과 신이 사귄다, 심신상교. 물이 위, 불이 아래인 주역의 기제괘라 수화기제라 한다. 이것은 병이 아니라 건강한 모습이다. 심신을 사귀게 하는 것은 심과 신의 관계이지 비의 기능이 아니다."},{"n":7,"obj":"밤에 눈을 말똥말똥 뜬 채 팔베개하고 누운 임금 · 곁의 사발 — 닭발 같은 노란 뿌리 조각과 갈색 아교 덩이","fact":"心腎不交 — 心煩 不得臥 · 黃連阿膠湯(傷寒論 少陰病)","hook":"잠 못 드는 임금 = 不得臥 · 닭발 같은 노란 뿌리 = 黃連(雞爪連) · 갈색 덩이 = 阿膠","say":"임금은 밤이 깊었는데도 팔베개를 하고 눈을 말똥말똥 뜬 채 잠들지 못한다. 心과 腎이 사귀지 못했다 — 心腎不交, 水火未濟. 心陰이 내려가 腎과 사귀지 못하고, 腎水가 올라 心을 적시지 못해 心火가 홀로 들뜬다. 가슴이 답답하여 눕지 못한다 — 心煩 不得臥. 『傷寒論』 少陰病의 이 증상에 黃連阿膠湯을 쓴다. 곁의 사발에서 닭발처럼 생긴 노란 뿌리 조각이 黃連, 갈색 덩이가 阿膠다.","box":[[147,689,764,389],[288,992,195,130]],"src":["JSG3-006"],"tts":"임금은 밤이 깊었는데도 팔베개를 하고 눈을 말똥말똥 뜬 채 잠들지 못한다. 심과 신이 사귀지 못했다, 심신불교, 수화미제. 심음이 내려가 신과 사귀지 못하고, 신수가 올라 심을 적시지 못해 심화가 홀로 들뜬다. 가슴이 답답하여 눕지 못한다, 심번 부득와. 상한론 소음병의 이 증상에 황련아교탕을 쓴다. 곁의 사발에서 닭발처럼 생긴 노란 뿌리 조각이 황련, 갈색 덩이가 아교다."},{"n":8,"kind":"review","obj":"목욕탕 한 바퀴 — 임금의 혀 · 장군의 눈 · 냉탕과 한증막의 두 대머리 · 온탕과 아궁이 · 잠 못 드는 임금","fact":"心火 혀·小便赤 ↔ 肝火 눈·易怒·弦 / 陽虛 畏寒·淸長 ↔ 陰虛 五心煩熱·盜汗 / 水火旣濟","hook":"혀끝 · 붉은 눈 / 냉탕 · 한증막 / 물 아래 불 · 잠 못 드는 임금","say":"다시 본다. 임금의 붉은 혀끝과 입 헌데 — 心火. 장군의 붉은 눈과 버럭 — 肝火. 냉탕에서 떠는 대머리, 허연 혀, 부은 발목 — 腎陽虛. 한증막의 붉은 광대와 달아오른 손발, 붉은 혀 — 腎陰虛. 물 아래 불 — 心腎相交, 水火旣濟. 잠 못 드는 임금과 노란 뿌리 — 心腎不交, 黃連阿膠湯.","box":[[79,156,638,399],[574,84,914,633],[1405,69,610,626],[147,689,764,389],[1626,516,395,627]],"src":[],"tts":"다시 본다. 임금의 붉은 혀끝과 입 헌데, 심화. 장군의 붉은 눈과 버럭, 간화. 냉탕에서 떠는 대머리, 허연 혀, 부은 발목, 신양허. 한증막의 붉은 광대와 달아오른 손발, 붉은 혀, 신음허. 물 아래 불, 심신상교, 수화기제. 잠 못 드는 임금과 노란 뿌리, 심신불교, 황련아교탕."}],"has_image":true},{"id":"zds-08","title":"장부병리 감별 ② — 肝血不足 ↔ 肝陽上亢(↔肝火), 갈림축 頭重脚輕","place":"해 질 녘 마른 들판의 급수탑","image":"images/lessons/zds-08.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"해 질 녘 마른 들판의 급수탑 — 무거운 물탱크와 가늘게 휜 네 다리 · 물 한 방울만 떨어지는 꼭지","fact":"장부병리 감별 ② — 肝血不足 ↔ 肝陽上亢 (↔ 肝火) · 갈림축 頭重脚輕","hook":"물(血)이 모자라면 아래가 마름 · 위가 무겁고 다리가 가늘면 頭重脚輕","say":"해 질 녘, 땅이 쩍쩍 갈라진 들판에 급수탑이 섰다. 위의 물탱크는 크고 무거운데 네 다리는 가늘게 휘었다. 탱크에서 내려온 꼭지에서는 물이 한 방울밖에 안 떨어진다. 물은 肝이 갈무리한 血이다. 이 과는 초록 갑옷 장군 둘로 肝의 두 병을 가른다 — 血이 모자란 肝血不足, 陽이 위로 치솟은 肝陽上亢. 멀리 굴뚝의 불은 肝火다.","box":null,"src":[],"tts":"해 질 녘, 땅이 쩍쩍 갈라진 들판에 급수탑이 섰다. 위의 물탱크는 크고 무거운데 네 다리는 가늘게 휘었다. 탱크에서 내려온 꼭지에서는 물이 한 방울밖에 안 떨어진다. 물은 간이 갈무리한 혈이다. 이 과는 초록 갑옷 장군 둘로 간의 두 병을 가른다, 혈이 모자란 간혈부족, 양이 위로 치솟은 간양상항. 멀리 굴뚝의 불은 간화다."},{"n":1,"obj":"창백한 장군이 앞으로 더듬어 뻗은 손 — 허옇게 마르고 갈라진 긴 손톱","fact":"肝血不足 — 爪甲不榮(其華在爪): 血이 못 채워 손톱이 마르고 갈라짐","hook":"윤기 잃고 갈라진 손톱 = 손톱의 꽃이 시듦","say":"왼쪽의 창백한 장군이 앞으로 손을 뻗었다. 긴 손톱이 허옇게 마르고 갈라졌다. 肝의 華는 손톱이다 — 其華在爪. 肝血이 모자라 손톱을 채우지 못하니 손톱이 윤기를 잃는다 — 爪甲不榮, 손톱이 허옇다 — 爪甲淡白. 肝血虛의 대표 증상은 힘줄이 당기고, 팔다리가 저리고, 손톱이 허옇고, 두 눈이 마르고 침침하고, 밤눈이 어둡고, 월경이 줄어드는 것이다.","box":[631,728,154,144],"src":["JSG-040"],"tts":"왼쪽의 창백한 장군이 앞으로 손을 뻗었다. 긴 손톱이 허옇게 마르고 갈라졌다. 간의 화는 손톱이다, 기화재조. 간혈이 모자라 손톱을 채우지 못하니 손톱이 윤기를 잃는다, 조갑불영, 손톱이 허옇다, 조갑담백. 간혈허의 대표 증상은 힘줄이 당기고, 팔다리가 저리고, 손톱이 허옇고, 두 눈이 마르고 침침하고, 밤눈이 어둡고, 월경이 줄어드는 것이다."},{"n":2,"obj":"창백한 장군의 굽힌 다리 — 둘레에 감도는 찌릿한 지그재그 선","fact":"肝血不足 — 筋脈失養: 筋脈拘急 · 肢體麻木 · 關節屈伸不利","hook":"찌릿찌릿한 다리 = 힘줄이 굶음 · 저림(麻木)과 쥐(拘急)","say":"창백한 장군의 굽힌 다리 둘레로 찌릿찌릿한 선이 감돈다. 다리가 저리고 쥐가 난다. 肝은 힘줄을 주관한다 — 肝主筋, 其充在筋. 血이 힘줄을 먹이지 못하니 힘줄이 굶는다 — 筋脈失養. 힘줄이 당기고 오그라들며 — 筋脈拘急, 팔다리가 저리고 — 肢體麻木, 관절을 굽혔다 폈다 하기 어렵다.","box":[598,843,231,221],"src":["JSG2-021"],"tts":"창백한 장군의 굽힌 다리 둘레로 찌릿찌릿한 선이 감돈다. 다리가 저리고 쥐가 난다. 간은 힘줄을 주관한다, 간주근, 기충재근. 혈이 힘줄을 먹이지 못하니 힘줄이 굶는다, 근맥실양. 힘줄이 당기고 오그라들며, 근맥구급, 팔다리가 저리고, 지체마목, 관절을 굽혔다 폈다 하기 어렵다."},{"n":3,"obj":"창백한 장군이 눈 위로 치켜든 안약병 — 다크서클 진 핼쑥한 눈","fact":"肝血不足 — 兩目乾澁 · 肝受血而能視 · 足受血而能步 · 掌受血而能握","hook":"마른 눈에 넣는 안약 = 血을 받아야 본다","say":"장군은 안약병을 눈 위로 치켜들었다. 눈가가 거뭇하고 핼쑥하다. 두 눈이 마르고 뻑뻑하다 — 兩目乾澁. 肝은 눈으로 열리고, 肝이 血을 받아야 볼 수 있다 — 肝受血而能視. 『五藏生成論』은 이어서 발은 血을 받아야 걷고, 손바닥은 血을 받아야 쥐고, 손가락은 血을 받아야 집는다고 했다 — 足受血而能步, 掌受血而能握, 指受血而能攝. 肝은 血을 갈무리하여, 사람이 누우면 血이 肝으로 돌아가고, 혈량을 고르며, 피가 새지 않게 막는다.","box":[[526,526,86,76],[430,565,140,148]],"src":["JQ-HYUL-05","JS-GAN-03"],"tts":"장군은 안약병을 눈 위로 치켜들었다. 눈가가 거뭇하고 핼쑥하다. 두 눈이 마르고 뻑뻑하다, 양목건삽. 간은 눈으로 열리고, 간이 혈을 받아야 볼 수 있다, 간수혈이능시. 오장생성론은 이어서 발은 혈을 받아야 걷고, 손바닥은 혈을 받아야 쥐고, 손가락은 혈을 받아야 집는다고 했다, 족수혈이능보, 장수혈이능악, 지수혈이능섭. 간은 혈을 갈무리하여, 사람이 누우면 혈이 간으로 돌아가고, 혈량을 고르며, 피가 새지 않게 막는다."},{"n":4,"obj":"오른쪽 장군의 크게 부풀어 벌겋게 달아오른 머리 — 관자놀이를 누르는 두 손 · 지끈거리는 선과 열기","fact":"肝陽上亢 — 上盛: 頭痛脹感 · 頭重 · 眩暈 (陽이 위로 치솟음)","hook":"부풀어 무거운 머리 = 위가 넘침(上盛)","say":"오른쪽 장군은 머리가 크게 부풀어 벌겋게 달아올랐다. 두 손으로 관자놀이를 누르고, 머리 둘레로 열기가 피어오른다. 肝陽上亢이다. 肝의 陽이 위로 치솟아 머리가 터질 듯 아프고 무겁고 어지럽다 — 頭痛脹感, 頭重, 眩暈. 위가 넘친다 — 上盛. 肝氣는 정상의 疏泄, 肝陽上亢은 위로 솟은 陽, 肝火上炎은 實熱이다.","box":[1333,238,310,342],"src":["JSG-039"],"tts":"오른쪽 장군은 머리가 크게 부풀어 벌겋게 달아올랐다. 두 손으로 관자놀이를 누르고, 머리 둘레로 열기가 피어오른다. 간양상항이다. 간의 양이 위로 치솟아 머리가 터질 듯 아프고 무겁고 어지럽다, 두통창감, 두중, 현훈. 위가 넘친다, 상성. 간기는 정상의 소설, 간양상항은 위로 솟은 양, 간화상염은 실열이다."},{"n":5,"obj":"오른쪽 장군의 후들거리는 안짱다리 · 곁에 선 급수탑의 가늘게 휜 다리","fact":"肝陽上亢 — 下虛: 腰膝痠軟 · 兩足軟弱無力 → 頭重脚輕","hook":"무거운 머리 + 후들거리는 다리 = 給水塔 = 頭重脚輕","say":"그런데 장군의 두 다리는 안으로 휘어 후들거리며 무릎이 꺾인다. 곁의 급수탑과 꼭 같다 — 위는 무겁고 다리는 가볍다, 頭重脚輕. 아래가 허하다 — 下虛. 허리와 무릎이 시큰하고 두 발에 힘이 없다 — 腰膝痠軟. 肝陽上亢은 腎陰이 아래에서 받쳐 주지 못해 생기므로 위는 넘치고 아래는 빈다 — 下虛上盛. 기본서 본문은 下虛로 腰痠을 드는데, 같은 책의 문제는 「肝陽上亢에서 볼 수 없는 것 = 腰膝痠軟」으로 낸다. 두 답이 어긋나니 문제에서는 지문을 보고 고른다.","box":[[1362,858,274,197],[833,216,533,847]],"src":["JSG2-036"],"tts":"그런데 장군의 두 다리는 안으로 휘어 후들거리며 무릎이 꺾인다. 곁의 급수탑과 꼭 같다, 위는 무겁고 다리는 가볍다, 두중각경. 아래가 허하다, 하허. 허리와 무릎이 시큰하고 두 발에 힘이 없다, 요슬산연. 간양상항은 신음이 아래에서 받쳐 주지 못해 생기므로 위는 넘치고 아래는 빈다, 하허상성. 기본서 본문은 하허로 요산을 드는데, 같은 책의 문제는 간양상항에서 볼 수 없는 것 = 요슬산연으로 낸다. 두 답이 어긋나니 문제에서는 지문을 보고 고른다."},{"n":6,"obj":"왼쪽 장군 — 허옇게 질린 얼굴 · 초승달 뜬 어둑한 왼쪽 하늘","fact":"血虛에만 — 夜盲(雀目) · 肢體麻木 · 面色淡白少華 · 舌淡 · 脈細","hook":"해 지자 더듬음 = 밤눈 어두움 · 허연 얼굴 = 血이 모자람","say":"왼쪽 하늘은 벌써 어두워 초승달이 떴다. 창백한 장군은 앞을 못 보고 손을 더듬는다. 밤눈이 어둡다 — 夜盲, 雀目. 얼굴이 허옇고 윤기가 없다 — 面色淡白少華. 혀는 허옇고 맥은 가늘다 — 舌淡, 脈細. 저림과 쥐도 血虛 쪽이다. 이것들은 肝陽上亢에는 없다.","box":[[430,565,140,148],[245,123,123,130]],"src":[],"tts":"왼쪽 하늘은 벌써 어두워 초승달이 떴다. 창백한 장군은 앞을 못 보고 손을 더듬는다. 밤눈이 어둡다, 야맹, 작목. 얼굴이 허옇고 윤기가 없다, 면색담백소화. 혀는 허옇고 맥은 가늘다, 설담, 맥세. 저림과 쥐도 혈허 쪽이다. 이것들은 간양상항에는 없다."},{"n":7,"obj":"오른쪽 장군 — 벌건 머리에서 피어오르는 열기 · 무거운 머리와 후들거리는 다리","fact":"肝陽에만 — 面赤烘熱 · 頭重脚輕 · 腰膝痠軟 · 舌紅 · 脈弦細數","hook":"벌건 얼굴의 열기 = 烘熱 · 머리는 무겁고 다리는 가벼움","say":"오른쪽 장군은 머리가 벌겋고 열기가 확확 오른다 — 얼굴이 붉고 화끈거린다, 面赤烘熱. 머리는 무겁고 다리는 가볍다 — 頭重脚輕. 혀는 붉고 맥은 팽팽하면서 가늘고 빠르다 — 舌紅, 脈弦細數. 이것들은 肝血不足에는 없다. 어지럼, 귀울림, 눈의 마름과 침침함, 손톱의 윤기 없음, 꿈이 많음, 월경량이 적거나 끊김은 두 병에 다 있다.","box":[1304,238,370,817],"src":[],"tts":"오른쪽 장군은 머리가 벌겋고 열기가 확확 오른다, 얼굴이 붉고 화끈거린다, 면적홍열. 머리는 무겁고 다리는 가볍다, 두중각경. 혀는 붉고 맥은 팽팽하면서 가늘고 빠르다, 설홍, 맥현세삭. 이것들은 간혈부족에는 없다. 어지럼, 귀울림, 눈의 마름과 침침함, 손톱의 윤기 없음, 꿈이 많음, 월경량이 적거나 끊김은 두 병에 다 있다."},{"n":8,"obj":"멀리 넓고 튼튼한 밑동 위로 불길을 곧장 위로 뿜는 벽돌 굴뚝 · 위만 무겁고 다리가 가는 급수탑","fact":"肝火 = 위로 타오르기만(上炎) ↔ 肝陽 = 下虛上盛 · 갈림축 頭重脚輕의 유무","hook":"밑동 튼튼한 굴뚝의 불 = 肝火 · 다리 가는 급수탑 = 肝陽","say":"멀리 굴뚝을 본다. 밑동이 넓고 튼튼한데 불길만 곧장 위로 뿜는다. 肝火上炎이다 — 實熱이 위로 타오르기만 하니 아래는 허하지 않다. 눈이 붉고 입이 쓰며 성급하게 화를 낸다. 급수탑은 다르다 — 위가 무겁고 다리가 가늘다. 肝陽上亢은 아래가 빈 下虛上盛이다. 둘을 가르는 것은 머리는 무겁고 다리는 가벼운가, 허리와 무릎이 시큰한가다.","box":[[1698,26,222,778],[800,0,566,1064]],"src":[],"tts":"멀리 굴뚝을 본다. 밑동이 넓고 튼튼한데 불길만 곧장 위로 뿜는다. 간화상염이다, 실열이 위로 타오르기만 하니 아래는 허하지 않다. 눈이 붉고 입이 쓰며 성급하게 화를 낸다. 급수탑은 다르다, 위가 무겁고 다리가 가늘다. 간양상항은 아래가 빈 하허상성이다. 둘을 가르는 것은 머리는 무겁고 다리는 가벼운가, 허리와 무릎이 시큰한가다."},{"n":9,"kind":"review","obj":"급수탑 들판 한 바퀴 — 마른 손톱 · 쥐 난 다리 · 안약 · 부푼 머리 · 후들거리는 다리 · 더듬는 손 · 굴뚝 불","fact":"肝血不足 爪甲·筋·目·夜盲·淡白 ↔ 肝陽上亢 頭痛·頭重脚輕·面赤 ↔ 肝火 上炎","hook":"물 한 방울 꼭지 · 부푼 머리와 가는 다리 · 굴뚝 불","say":"다시 본다. 물 한 방울 꼭지 곁의 창백한 장군 — 肝血不足: 마른 손톱, 저린 다리, 안약병과 마른 눈, 해 지면 더듬는 밤눈, 허연 얼굴. 급수탑 곁의 장군 — 肝陽上亢: 부푼 머리와 벌건 얼굴, 가늘게 후들거리는 다리, 頭重脚輕. 굴뚝의 곧은 불 — 肝火上炎은 위로 타기만 한다.","box":[[334,545,490,519],[800,0,566,1064],[1304,238,370,817],[1698,26,222,778]],"src":[],"tts":"다시 본다. 물 한 방울 꼭지 곁의 창백한 장군, 간혈부족: 마른 손톱, 저린 다리, 안약병과 마른 눈, 해 지면 더듬는 밤눈, 허연 얼굴. 급수탑 곁의 장군, 간양상항: 부푼 머리와 벌건 얼굴, 가늘게 후들거리는 다리, 두중각경. 굴뚝의 곧은 불, 간화상염은 위로 타기만 한다."}],"has_image":true},{"id":"zds-09","title":"望色 ① — 靑·赤·黃 (五色主病)","place":"세 불이 켜진 한낮의 사거리","image":"images/lessons/zds-09.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"한낮의 사거리 — 가운데 신호등과 양옆 신호등의 초록 · 노랑 · 빨강 불 · 모퉁이마다 같은 회색 옷을 입은 사람들","fact":"望色 ① — 五色主病 중 靑 · 赤 · 黃","hook":"신호등 세 불 = 靑 · 黃 · 赤 · 옷은 모두 회색, 얼굴빛만 다름","say":"한낮의 조용한 사거리. 신호등마다 초록, 노랑, 빨강 불이 켜졌다. 모퉁이마다 같은 회색 옷을 입은 사람들이 섰는데 얼굴빛만 다르다. 얼굴빛으로 병을 읽는 望色이다. 이 과는 다섯 색 가운데 푸른 靑, 붉은 赤, 누런 黃을 본다. 초록 불 아래는 靑, 빨간 불 아래는 赤, 노란 불 아래는 黃이다.","box":null,"src":[],"tts":"한낮의 조용한 사거리. 신호등마다 초록, 노랑, 빨강 불이 켜졌다. 모퉁이마다 같은 회색 옷을 입은 사람들이 섰는데 얼굴빛만 다르다. 얼굴빛으로 병을 읽는 망색이다. 이 과는 다섯 색 가운데 푸른 청, 붉은 적, 누런 황을 본다. 초록 불 아래는 청, 빨간 불 아래는 적, 노란 불 아래는 황이다."},{"n":1,"obj":"초록 불 아래 — 배를 움켜쥐고 몸을 꺾은 푸르스름한 얼굴의 남자","fact":"靑 = 痛 — 五色主病 靑: 寒 · 痛 · 瘀血 · 驚風 · 氣閉","hook":"푸른 얼굴로 배를 움켜쥠 = 아픔(痛)","say":"초록 불 아래, 푸르스름한 얼굴의 남자가 배를 움켜쥐고 몸을 꺾었다. 푸른빛은 통증이다 — 靑主痛. 氣血이 막혀 통하지 않으면 아프고 얼굴이 푸르다. 五色主病에서 靑은 寒證, 통증, 瘀血, 驚風, 氣閉를 가리킨다.","box":[79,519,245,483],"src":["JD-MANG-03-01"],"tts":"초록 불 아래, 푸르스름한 얼굴의 남자가 배를 움켜쥐고 몸을 꺾었다. 푸른빛은 통증이다, 청주통. 기혈이 막혀 통하지 않으면 아프고 얼굴이 푸르다. 오색주병에서 청은 한증, 통증, 어혈, 경풍, 기폐를 가리킨다."},{"n":2,"obj":"그 곁 — 입술이 보랏빛으로 퍼렇고 관자놀이에 푸른 핏줄이 불거진 남자 · 퍼런 손","fact":"靑 = 瘀血 — 脣甲靑紫 · 靑筋 · 面色黧黑 · 舌質紫暗 · 脈細澁","hook":"보랏빛 입술과 불거진 푸른 핏줄 = 막힌 피(瘀血)","say":"그 곁의 남자는 입술이 보랏빛으로 퍼렇고 관자놀이에 푸른 핏줄이 불거졌다. 피가 막혔다 — 瘀血. 입술과 손발톱이 퍼렇고 — 脣甲靑紫, 얼굴은 검푸르며, 살갗이 비늘처럼 거칠고 — 肌膚甲錯, 혀는 검붉은 자줏빛에 어혈 점이 있고 혀 밑 핏줄이 굵게 구불거린다. 맥은 가늘고 껄끄러운 細澁이다.","box":[353,389,195,497],"src":["BIN-EO-05"],"tts":"그 곁의 남자는 입술이 보랏빛으로 퍼렇고 관자놀이에 푸른 핏줄이 불거졌다. 피가 막혔다, 어혈. 입술과 손발톱이 퍼렇고, 순갑청자, 얼굴은 검푸르며, 살갗이 비늘처럼 거칠고, 기부갑착, 혀는 검붉은 자줏빛에 어혈 점이 있고 혀 밑 핏줄이 굵게 구불거린다. 맥은 가늘고 껄끄러운 세삽이다."},{"n":3,"obj":"눈송이 속에서 제 몸을 끌어안고 덜덜 떠는 푸른 얼굴의 남자","fact":"靑 = 寒 — 寒이 엉겨 氣血이 막히면 푸르다","hook":"눈 속에서 떠는 푸른 얼굴 = 추위(寒)","say":"눈송이가 흩날리는 가운데 푸른 얼굴의 남자가 제 몸을 끌어안고 덜덜 떤다. 푸른빛은 추위다 — 靑主寒. 찬 기운이 엉겨 氣血이 잘 돌지 않으니 얼굴이 푸르다.","box":[569,375,209,512],"src":[],"tts":"눈송이가 흩날리는 가운데 푸른 얼굴의 남자가 제 몸을 끌어안고 덜덜 떤다. 푸른빛은 추위다, 청주한. 찬 기운이 엉겨 기혈이 잘 돌지 않으니 얼굴이 푸르다."},{"n":4,"obj":"바닥에 누워 팔을 버둥거리며 눈이 뒤집힌 아이 — 푸르스름한 얼굴","fact":"靑 = 驚風 — 小兒驚風: 미간과 콧등 둘레가 푸름","hook":"경기 일으킨 아이의 푸른빛 = 驚風","say":"바닥에 누운 아이가 눈이 뒤집히고 팔다리를 버둥거린다. 얼굴, 특히 미간과 콧등 둘레가 푸르스름하다. 아이의 경기, 小兒驚風이다 — 肝風이 일어 푸른빛이 드러난다.","box":[353,886,310,202],"src":[],"tts":"바닥에 누운 아이가 눈이 뒤집히고 팔다리를 버둥거린다. 얼굴, 특히 미간과 콧등 둘레가 푸르스름하다. 아이의 경기, 소아경풍이다, 간풍이 일어 푸른빛이 드러난다."},{"n":5,"obj":"빨간 불 아래 — 얼굴 전체가 새빨갛고 땀 흘리며 소리치는 건장한 남자","fact":"滿面通紅 = 實熱(陽盛) — 赤 甚하면 實熱 · 微赤은 虛熱","hook":"온 얼굴이 새빨감 = 실한 열","say":"빨간 불 아래, 건장한 남자는 얼굴 전체가 새빨갛고 땀을 흘리며 소리친다. 온 얼굴이 붉다 — 滿面通紅. 陽이 왕성한 實熱이다. 赤은 熱證이다 — 붉음이 심하면 實熱, 살짝 붉으면 虛熱. 實하면 얼굴이 붉고, 虛하면 허옇고 윤기가 없다 — 虛는 淡白無華, 實은 面紅赤.","box":[1513,331,238,476],"src":["JD-MANG-03-02","BZ-BY-05-02"],"tts":"빨간 불 아래, 건장한 남자는 얼굴 전체가 새빨갛고 땀을 흘리며 소리친다. 온 얼굴이 붉다, 만면통홍. 양이 왕성한 실열이다. 적은 열증이다, 붉음이 심하면 실열, 살짝 붉으면 허열. 실하면 얼굴이 붉고, 허하면 허옇고 윤기가 없다, 허는 담백무화, 실은 면홍적."},{"n":6,"obj":"벤치에서 잠든 여윈 여자 — 핼쑥한 얼굴에 두 광대뼈와 콧등만 붉음","fact":"兩顴潮紅 = 虛熱(陰虛火旺) — 광대뼈만 오후에 붉어짐","hook":"광대뼈만 붉음 = 허한 열(陰虛)","say":"벤치에서 잠든 여윈 여자는 얼굴이 핼쑥한데 두 광대뼈와 콧등만 붉다. 광대뼈가 붉다 — 兩顴潮紅. 오후와 밤에 조수처럼 오르내리는 붉음이다. 陰이 모자라 火가 들뜬 虛熱, 陰虛火旺이다. 온 얼굴이 붉은 實熱과 가른다. 陰虛의 일반 증상은 五心煩熱, 潮熱, 盜汗, 顴紅, 입과 목의 마름, 붉고 이끼 적은 혀, 가늘고 빠른 맥이다. 위로 떠오른 陽이 얼굴을 붉히는 戴陽과도 가른다.","box":[1874,425,108,108],"src":["BZ-BY-04"],"tts":"벤치에서 잠든 여윈 여자는 얼굴이 핼쑥한데 두 광대뼈와 콧등만 붉다. 광대뼈가 붉다, 양관조홍. 오후와 밤에 조수처럼 오르내리는 붉음이다. 음이 모자라 화가 들뜬 허열, 음허화왕이다. 온 얼굴이 붉은 실열과 가른다. 음허의 일반 증상은 오심번열, 조열, 도한, 관홍, 입과 목의 마름, 붉고 이끼 적은 혀, 가늘고 빠른 맥이다. 위로 떠오른 양이 얼굴을 붉히는 대양과도 가른다."},{"n":7,"obj":"그 여자의 두 손 — 벌겋게 달아오름","fact":"五心煩熱 — 陰虛의 동반 증 · 心陰虛만의 특이 증상(心煩 · 盜汗 · 脈細數)","hook":"달아오른 손바닥 = 다섯 곳(손·발·가슴)의 번열","say":"그 여자의 두 손이 벌겋게 달아올랐다. 두 손바닥, 두 발바닥, 가슴 다섯 곳이 화끈거린다 — 五心煩熱. 陰虛에 따른다. 心血虛와 心陰虛는 가슴 두근거림, 잠 못 듦, 꿈 많음이 같고, 心陰虛에만 心煩, 五心煩熱, 盜汗, 가늘고 빠른 맥이 더해진다.","box":[1751,620,238,130],"src":["JSG2-013"],"tts":"그 여자의 두 손이 벌겋게 달아올랐다. 두 손바닥, 두 발바닥, 가슴 다섯 곳이 화끈거린다, 오심번열. 음허에 따른다. 심혈허와 심음허는 가슴 두근거림, 잠 못 듦, 꿈 많음이 같고, 심음허에만 심번, 오심번열, 도한, 가늘고 빠른 맥이 더해진다."},{"n":8,"obj":"눈을 감고 고개를 젖힌 채 잠든 그 여자 — 얼굴과 목·팔에 맺힌 땀방울","fact":"盜汗 = 陰虛 — 잠들면 나고 깨면 그침 ↔ 自汗 = 陽虛(낮에 절로)","hook":"잠자며 흘리는 땀 = 도둑 땀(盜汗)","say":"그 여자는 잠든 채 얼굴과 목에 땀방울이 맺혔다. 잠들면 나고 깨면 그치는 땀 — 도둑 도(盜), 盜汗. 陰虛로 腎陰이 밤에 陽氣를 붙들지 못해 난다. 營血의 일이다. 낮에 움직이지 않아도 절로 나는 땀은 自汗 — 陽虛로 衛氣가 새는 것이다. 自汗은 陽虛 낮, 盜汗은 陰虛 밤.","box":[1737,418,311,447],"src":["JD-MOON-03-02","JQ-REL-08","HUBJQ-0116","HUBJQ-0115"],"tts":"그 여자는 잠든 채 얼굴과 목에 땀방울이 맺혔다. 잠들면 나고 깨면 그치는 땀, 도둑 도, 도한. 음허로 신음이 밤에 양기를 붙들지 못해 난다. 영혈의 일이다. 낮에 움직이지 않아도 절로 나는 땀은 자한, 양허로 위기가 새는 것이다. 자한은 양허 낮, 도한은 음허 밤."},{"n":9,"obj":"노란 불 아래 — 여위고 축 처진 남자의 핏기 없이 누런 얼굴 · 거뭇한 눈그늘","fact":"萎黃 = 脾虛 — 氣血이 모자라 누렇게 시듦 · 五色主病 黃: 虛證 · 濕","hook":"시든 잎처럼 누런 얼굴 = 萎黃 = 脾가 허함","say":"노란 불 아래, 여위고 축 처진 남자의 얼굴이 핏기 없이 누렇고 눈그늘이 거뭇하다. 시든 잎처럼 누렇다 — 시들 위(萎), 萎黃. 脾가 허해 氣血이 모자라 얼굴을 채우지 못한다. 五色主病에서 黃은 虛證과 濕을 가리킨다.","box":[786,605,202,504],"src":["JD-MANG-03-03"],"tts":"노란 불 아래, 여위고 축 처진 남자의 얼굴이 핏기 없이 누렇고 눈그늘이 거뭇하다. 시든 잎처럼 누렇다, 시들 위, 위황. 비가 허해 기혈이 모자라 얼굴을 채우지 못한다. 오색주병에서 황은 허증과 습을 가리킨다."},{"n":10,"obj":"귤처럼 밝게 빛나는 주황빛 누런 얼굴 · 샛노란 흰자위의 남자","fact":"陽黃 = 濕熱 — 귤빛처럼 밝은 黃疸 · 目黃이 黃疸의 결정 표지","hook":"밝은 귤빛 + 노란 눈 = 陽黃(濕熱)","say":"가운데 남자는 얼굴과 살갗이 귤처럼 밝은 주황빛으로 누렇고, 흰자위까지 샛노랗다. 黃疸이다. 밝고 선명한 누름은 陽黃 — 濕과 熱이 엉긴 濕熱이다. 눈의 흰자가 누런 目黃이 黃疸을 가르는 표지다.","box":[1074,577,180,540],"src":[],"tts":"가운데 남자는 얼굴과 살갗이 귤처럼 밝은 주황빛으로 누렇고, 흰자위까지 샛노랗다. 황달이다. 밝고 선명한 누름은 양황, 습과 열이 엉긴 습열이다. 눈의 흰자가 누런 목황이 황달을 가르는 표지다."},{"n":11,"obj":"팔짱 끼고 웅크린 남자의 연기 낀 듯 어둡고 칙칙한 누런 얼굴","fact":"陰黃 = 寒濕 — 연기 낀 듯 어둡고 칙칙한 黃疸","hook":"그을린 듯 어두운 누름 = 陰黃(寒濕)","say":"오른쪽 남자는 얼굴이 연기에 그을린 듯 어둡고 칙칙하게 누렇고, 팔짱을 끼고 몸을 웅크렸다. 같은 黃疸이라도 어두운 누름은 陰黃 — 찬 濕이 엉긴 寒濕이다. 萎黃은 눈이 누렇지 않고 시들었을 뿐이고, 陽黃은 밝고, 陰黃은 어둡다.","box":[1268,677,202,454],"src":[],"tts":"오른쪽 남자는 얼굴이 연기에 그을린 듯 어둡고 칙칙하게 누렇고, 팔짱을 끼고 몸을 웅크렸다. 같은 황달이라도 어두운 누름은 음황, 찬 습이 엉긴 한습이다. 위황은 눈이 누렇지 않고 시들었을 뿐이고, 양황은 밝고, 음황은 어둡다."},{"n":12,"kind":"review","obj":"사거리 한 바퀴 — 초록 불 아래 넷 · 빨간 불 아래 둘 · 노란 불 아래 셋","fact":"靑 痛·瘀血·寒·驚風 / 赤 實熱 滿面·虛熱 顴紅 / 黃 萎黃 脾虛·陽黃 濕熱·陰黃 寒濕","hook":"배앓이 · 보랏빛 입술 · 떨림 · 경기 / 온 얼굴 · 광대 / 시든 · 귤빛 · 그을린","say":"다시 본다. 초록 불 아래 — 배를 움켜쥔 통증, 보랏빛 입술의 瘀血, 눈 속에서 떠는 寒, 아이의 驚風. 빨간 불 아래 — 온 얼굴이 붉은 實熱, 광대뼈만 붉고 손바닥이 달아오르고 자면서 땀 흘리는 陰虛의 虛熱. 노란 불 아래 — 시든 萎黃은 脾虛, 귤빛 陽黃은 濕熱, 그을린 陰黃은 寒濕.","box":[[0,346,807,797],[1456,288,592,605],[764,476,749,667]],"src":[],"tts":"다시 본다. 초록 불 아래, 배를 움켜쥔 통증, 보랏빛 입술의 어혈, 눈 속에서 떠는 한, 아이의 경풍. 빨간 불 아래, 온 얼굴이 붉은 실열, 광대뼈만 붉고 손바닥이 달아오르고 자면서 땀 흘리는 음허의 허열. 노란 불 아래, 시든 위황은 비허, 귤빛 양황은 습열, 그을린 음황은 한습."}],"has_image":true},{"id":"zds-10","title":"望色 ② — 白·黑 · 善色↔惡色(光澤)","place":"체크무늬 바닥의 옛 사진관","image":"images/lessons/zds-10.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"체크무늬 바닥의 옛 사진관 — 의자에 줄지어 앉은 여섯 사람 · 벽의 두 사진 · 사진기 뒤의 사진사","fact":"望色 ② — 五色主病 중 白 · 黑 · 그리고 善色↔惡色(光澤)","hook":"흑백 사진관 = 白 · 黑 · 유광/무광 인화 = 善惡","say":"검고 흰 체크무늬 바닥의 옛 사진관. 흑백 사진의 흑과 백 — 이 과는 다섯 색 가운데 흰 白과 검은 黑을 본다. 같은 회색 옷을 입은 여섯 사람이 의자에 줄지어 앉아 사진을 기다린다. 왼쪽 셋은 白, 오른쪽 셋은 黑이다. 벽에는 같은 얼굴을 반짝이게 뽑은 사진과 칙칙하게 뽑은 사진이 걸렸다 — 좋은 색과 나쁜 색을 가르는 것은 윤기다.","box":null,"src":[],"tts":"검고 흰 체크무늬 바닥의 옛 사진관. 흑백 사진의 흑과 백, 이 과는 다섯 색 가운데 흰 백과 검은 흑을 본다. 같은 회색 옷을 입은 여섯 사람이 의자에 줄지어 앉아 사진을 기다린다. 왼쪽 셋은 백, 오른쪽 셋은 흑이다. 벽에는 같은 얼굴을 반짝이게 뽑은 사진과 칙칙하게 뽑은 사진이 걸렸다, 좋은 색과 나쁜 색을 가르는 것은 윤기다."},{"n":1,"obj":"맨 왼쪽 — 축 처진 남자의 허옇고 윤기 없는 얼굴","fact":"淡白無華 = 氣虛 — 五色主病 白: 虛 · 寒 · 脫血 · 脫氣","hook":"맥없이 허연 얼굴 = 氣가 허함","say":"맨 왼쪽 남자는 축 처진 채 얼굴이 허옇고 윤기가 없다 — 淡白無華. 氣가 허하다, 氣虛. 虛하면 허옇고 윤기가 없고, 實하면 붉다. 五色主病에서 白은 虛, 寒, 피를 잃은 脫血, 氣를 잃은 脫氣를 가리킨다.","box":[526,421,120,138],"src":["JD-MANG-03-04","BZ-BY-05-02"],"tts":"맨 왼쪽 남자는 축 처진 채 얼굴이 허옇고 윤기가 없다, 담백무화. 기가 허하다, 기허. 허하면 허옇고 윤기가 없고, 실하면 붉다. 오색주병에서 백은 허, 한, 피를 잃은 탈혈, 기를 잃은 탈기를 가리킨다."},{"n":2,"obj":"둘째 — 번들번들 하얗고 퉁퉁 부은 얼굴(부은 눈두덩과 볼)","fact":"㿠白 = 陽虛 — 물이 넘쳐 부은 듯 번들거리는 흰빛","hook":"물 먹은 듯 부어 번들거리는 흰 얼굴 = 陽이 허해 물이 넘침","say":"둘째 남자는 얼굴이 번들번들 하얗고 눈두덩과 볼이 퉁퉁 부었다. 밝게 번들거리는 흰빛 — 㿠白. 陽이 허해 물을 데워 돌리지 못하니 물이 넘쳐 붓는다 — 陽虛, 水氣泛濫.","box":[692,406,130,138],"src":[],"tts":"둘째 남자는 얼굴이 번들번들 하얗고 눈두덩과 볼이 퉁퉁 부었다. 밝게 번들거리는 흰빛, 황백. 양이 허해 물을 데워 돌리지 못하니 물이 넘쳐 붓는다, 양허, 수기범람."},{"n":3,"obj":"셋째 — 잿빛이 도는 흰 얼굴 · 팔뚝의 피 젖은 붕대","fact":"蒼白 = 失血 · 血虛 — 面色蒼白 · 脣舌爪甲色淡","hook":"피 흘린 붕대 + 잿빛 흰 얼굴 = 피를 잃음","say":"셋째 남자는 얼굴이 잿빛 도는 흰색이고, 팔뚝에 감은 붕대가 피에 젖었다. 푸르스름하게 하얗다 — 蒼白. 피를 잃거나 血이 모자라다 — 失血, 血虛. 血虛의 대표 증상은 얼굴이 창백하고, 입술과 혀와 손발톱이 허옇고, 어지럽고 눈앞이 아찔하며, 가슴이 두근거리고, 눈이 침침하고 관절을 굽혔다 펴기 어려운 것이다.","box":[[908,398,115,138],[882,692,134,112]],"src":["BGI-HYUL-01-02"],"tts":"셋째 남자는 얼굴이 잿빛 도는 흰색이고, 팔뚝에 감은 붕대가 피에 젖었다. 푸르스름하게 하얗다, 창백. 피를 잃거나 혈이 모자라다, 실혈, 혈허. 혈허의 대표 증상은 얼굴이 창백하고, 입술과 혀와 손발톱이 허옇고, 어지럽고 눈앞이 아찔하며, 가슴이 두근거리고, 눈이 침침하고 관절을 굽혔다 펴기 어려운 것이다."},{"n":4,"obj":"넷째 — 얼굴에만 재를 바른 듯 거뭇하고 윤기 없는 잿빛","fact":"面黑無華 = 腎虛 — 五色主病 黑: 腎陽虛 · 寒 · 水飮 · 瘀血","hook":"재 뒤집어쓴 듯 거뭇한 얼굴 = 腎이 허함","say":"넷째 남자는 목과 손은 다른 사람과 같은데 얼굴만 재를 바른 듯 거뭇하고 윤기가 없다 — 面黑無華. 타고난 살빛이 아니라 병으로 변한 얼굴빛이다. 黑은 腎의 색이니 腎이 허하다. 五色主病에서 黑은 腎陽虛, 寒, 水飮, 瘀血을 가리킨다.","box":[1095,398,130,147],"src":["JD-MANG-03-05"],"tts":"넷째 남자는 목과 손은 다른 사람과 같은데 얼굴만 재를 바른 듯 거뭇하고 윤기가 없다, 면흑무화. 타고난 살빛이 아니라 병으로 변한 얼굴빛이다. 흑은 신의 색이니 신이 허하다. 오색주병에서 흑은 신양허, 한, 수음, 어혈을 가리킨다."},{"n":5,"obj":"다섯째 — 보통 얼굴에 두 눈 둘레만 검게 진 둥근 그늘","fact":"眼眶周圍發黑 = 水飮 — 눈두덩 둘레가 검음","hook":"판다처럼 검은 눈 둘레 = 물이 고임(水飮)","say":"다섯째 남자는 얼굴은 보통인데 두 눈 둘레만 판다처럼 검다 — 眼眶周圍發黑. 물이 고여 흩어지지 못하는 水飮이다. 腎이 물을 다스리지 못하면 눈두덩 아래에 검은 그늘이 진다.","box":[1283,392,130,144],"src":[],"tts":"다섯째 남자는 얼굴은 보통인데 두 눈 둘레만 판다처럼 검다, 안광주위발흑. 물이 고여 흩어지지 못하는 수음이다. 신이 물을 다스리지 못하면 눈두덩 아래에 검은 그늘이 진다."},{"n":6,"obj":"여섯째 — 얼굴의 멍든 듯 검붉은 보랏빛 얼룩 · 보랏빛 입술","fact":"黑而紫暗 = 瘀血 — 面色黧黑 · 脣舌靑紫 · 刺痛固定夜重 · 脈細澁","hook":"멍든 듯 검붉은 보라 = 막힌 피(瘀血)","say":"여섯째 남자는 얼굴에 멍든 듯 검붉은 보랏빛 얼룩이 번졌고, 입술도 보라색이다. 검으면서 어둡게 자줏빛이다 — 黑而紫暗. 瘀血이다. 瘀血의 특징 원문은 찌르듯 아프고 자리가 정해져 있으며 밤에 심하고, 덩어리가 한자리에서 움직이지 않으며, 피를 쏟으면 검붉은 덩어리가 섞이고, 얼굴과 혀가 검고 입술과 혀가 퍼렇고, 맥은 가늘고 껄끄럽다. 묽고 연한 피는 血虛다.","box":[1477,386,130,169],"src":["BIN-EO-05","BIG-010"],"tts":"여섯째 남자는 얼굴에 멍든 듯 검붉은 보랏빛 얼룩이 번졌고, 입술도 보라색이다. 검으면서 어둡게 자줏빛이다, 흑이자암. 어혈이다. 어혈의 특징 원문은 찌르듯 아프고 자리가 정해져 있으며 밤에 심하고, 덩어리가 한자리에서 움직이지 않으며, 피를 쏟으면 검붉은 덩어리가 섞이고, 얼굴과 혀가 검고 입술과 혀가 퍼렇고, 맥은 가늘고 껄끄럽다. 묽고 연한 피는 혈허다."},{"n":7,"obj":"벽의 두 사진 — 같은 얼굴의 여자를 반짝이게 뽑은 유광 사진(왼쪽) · 칙칙하게 뽑은 무광 사진(오른쪽)","fact":"善惡을 가르는 것은 色의 종류가 아니라 光澤 — 光明潤澤(善) ↔ 晦暗枯槁(惡)","hook":"같은 얼굴, 같은 색 — 윤기 있으면 善色 · 윤기 없으면 惡色","say":"벽에 같은 여자를 찍은 사진 둘이 걸렸다. 얼굴도 색도 같다. 왼쪽은 유광으로 뽑아 반짝반짝 빛나고, 오른쪽은 무광으로 뽑아 칙칙하고 먼지 낀 듯하다. 좋은 색과 나쁜 색을 가르는 것은 다섯 색 가운데 무슨 색이냐가 아니라 윤기다. 밝고 윤택하면 善色 — 光明潤澤, 어둡고 마르면 惡色 — 晦暗枯槁. 같은 黃色이라도 윤기가 있으면 예후가 좋다.","box":[[494,40,373,476],[1098,55,360,447]],"src":[],"tts":"벽에 같은 여자를 찍은 사진 둘이 걸렸다. 얼굴도 색도 같다. 왼쪽은 유광으로 뽑아 반짝반짝 빛나고, 오른쪽은 무광으로 뽑아 칙칙하고 먼지 낀 듯하다. 좋은 색과 나쁜 색을 가르는 것은 다섯 색 가운데 무슨 색이냐가 아니라 윤기다. 밝고 윤택하면 선색, 광명윤택, 어둡고 마르면 악색, 회암고고. 같은 황색이라도 윤기가 있으면 예후가 좋다."},{"n":8,"obj":"왼쪽 소품 탁자의 죽은 것 다섯 — 마른 풀 다발 · 엉긴 검붉은 핏덩이 · 초록 탱자 · 검댕 더미 · 흰 뼈","fact":"惡色 = 死色(五臟生成論) — 靑如草茲 · 黃如枳實 · 黑如炲 · 赤如衃血 · 白如枯骨","hook":"마른 풀 · 탱자 · 검댕 · 엉긴 피 · 흰 뼈 = 다섯 죽은 색","say":"왼쪽 소품 탁자에 죽은 것 다섯이 놓였다. 『五藏生成論』의 죽음의 색이다. 푸르기가 시든 풀 같으면 죽는다 — 靑如草茲. 누렇기가 말라 쪼그라든 탱자 같으면 — 黃如枳實. 검기가 검댕 같으면 — 黑如炲. 붉기가 엉긴 핏덩이 같으면 — 赤如衃血. 희기가 마른 뼈 같으면 — 白如枯骨. 모두 윤기가 없는 惡色이고, 神이 없어 氣가 이르지 못한 死色이다.","box":[22,584,313,180],"src":["JD-MANG-04"],"tts":"왼쪽 소품 탁자에 죽은 것 다섯이 놓였다. 오장생성론의 죽음의 색이다. 푸르기가 시든 풀 같으면 죽는다, 청여초자. 누렇기가 말라 쪼그라든 탱자 같으면, 황여지실. 검기가 검댕 같으면, 흑여태. 붉기가 엉긴 핏덩이 같으면, 적여배혈. 희기가 마른 뼈 같으면, 백여고골. 모두 윤기가 없는 악색이고, 신이 없어 기가 이르지 못한 사색이다."},{"n":9,"obj":"소품 탁자 위 촛대의 초 — 마지막으로 확 치솟은 큰 불꽃","fact":"得神者昌 · 失神者亡 · 假神 = 回光返照 · 殘燈復明 — 光澤은 色의 神","hook":"꺼지기 전 확 치솟은 불꽃 = 假神(殘燈復明)","say":"탁자 위 촛대의 초가 꺼지기 전 마지막으로 불꽃을 확 치솟았다. 꺼지기 직전 등불이 다시 밝아진다 — 殘燈復明, 回光返照. 오래 앓던 위중한 사람이 갑자기 좋아 보이는 것, 假神이다. 神이 있으면 살고 神을 잃으면 죽는다 — 得神者昌, 失神者亡. 얼굴빛의 윤기는 그 색의 神이다. 望色과 望神이 여기서 만난다.","box":[329,483,107,264],"src":["JD-MANG-02"],"tts":"탁자 위 촛대의 초가 꺼지기 전 마지막으로 불꽃을 확 치솟았다. 꺼지기 직전 등불이 다시 밝아진다, 잔등복명, 회광반조. 오래 앓던 위중한 사람이 갑자기 좋아 보이는 것, 가신이다. 신이 있으면 살고 신을 잃으면 죽는다, 득신자창, 실신자망. 얼굴빛의 윤기는 그 색의 신이다. 망색과 망신이 여기서 만난다."},{"n":10,"kind":"review","obj":"사진관 한 바퀴 — 왼쪽 셋(白) · 오른쪽 셋(黑) · 유광과 무광 사진 · 죽은 것 다섯 · 마지막 불꽃","fact":"白 淡白 氣虛·㿠白 陽虛·蒼白 血虛 / 黑 腎虛·眼眶 水飮·紫暗 瘀血 / 善惡 = 光澤","hook":"허연 · 부은 흰 · 잿빛 흰 / 거뭇 · 판다 눈 · 멍든 보라 / 유광 · 무광 / 죽은 다섯 · 마지막 불꽃","say":"다시 본다. 허옇고 윤기 없는 얼굴 — 氣虛. 부어 번들거리는 흰 얼굴 — 陽虛. 잿빛 흰 얼굴과 피 젖은 붕대 — 失血, 血虛. 거뭇한 얼굴 — 腎虛. 판다 같은 눈 둘레 — 水飮. 멍든 보라 — 瘀血. 유광과 무광 — 善惡은 윤기. 시든 풀, 탱자, 검댕, 핏덩이, 마른 뼈 — 죽음의 색. 마지막 불꽃 — 假神.","box":[[450,415,210,601],[646,401,222,615],[862,398,236,618],[1055,398,231,618],[1242,392,225,624],[1438,386,245,630],[494,40,373,476],[1098,55,360,447],[17,574,427,442]],"src":[],"tts":"다시 본다. 허옇고 윤기 없는 얼굴, 기허. 부어 번들거리는 흰 얼굴, 양허. 잿빛 흰 얼굴과 피 젖은 붕대, 실혈, 혈허. 거뭇한 얼굴, 신허. 판다 같은 눈 둘레, 수음. 멍든 보라, 어혈. 유광과 무광, 선악은 윤기. 시든 풀, 탱자, 검댕, 핏덩이, 마른 뼈, 죽음의 색. 마지막 불꽃, 가신."}],"has_image":true},{"id":"zds-11","title":"問診 — 十問歌 一問~十問의 차례","place":"보랏빛 노래방","image":"images/lessons/zds-11.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"보랏빛 노래방 — 벽 화면의 예약 목록: 노래 표지 열 장(윗줄 다섯 · 아랫줄 다섯) · 탁자의 책 둘 · 소파의 엄마와 아이","fact":"問診 — 十問歌: 열 가지 물음의 차례(一問~十問)","hook":"노래방 = 歌 · 예약 목록 열 곡의 차례 = 一問~十問 · 윗줄 왼쪽부터 1~5, 아랫줄 왼쪽부터 6~10","say":"보랏빛 노래방. 벽의 큰 화면에 예약
