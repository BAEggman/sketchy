<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한의학 Sketchy 과</title>
<style>
:root{
  --bg:#f5f3ee; --fg:#1c1c1f; --muted:#5d5d66; --card:#ffffff; --line:#dcd8cf; --chip:#ece8df;
  --accent:#a8500f; --accent-fg:#ffffff; --stage:#2a2c30; --ring:#ffcf3f;
  --good:#1d7a3a; --bad:#b3261e;
  --sans:'Noto Sans CJK KR','Noto Serif CJK KR','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
  --serif:'Noto Serif CJK KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',serif;
  --gut:16px; --vh:100vh; --chrome:330px;
  color-scheme:light dark;
}
@supports (height:100dvh){ :root{ --vh:100dvh; } }
@media (prefers-color-scheme:dark){
  :root{ --bg:#141518; --fg:#ececef; --muted:#a4a4ae; --card:#1e2024; --line:#34373d; --chip:#2a2c31;
    --accent:#f0a35e; --accent-fg:#1a1205; --stage:#0c0d0f; --good:#5cc47c; --bad:#ff8a80; }
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); line-height:1.55; font-size:16px; }
button,input{ font:inherit; color:inherit; }
[hidden]{ display:none !important; }
a{ color:var(--accent); }

.top{ display:flex; align-items:center; gap:12px; padding:10px var(--gut); border-bottom:1px solid var(--line); min-height:52px; }
.top h1{ font-size:1rem; margin:0; font-weight:700; letter-spacing:-.01em; }
.top .home{ text-decoration:none; font-size:.92rem; padding:6px 10px; border:1px solid var(--line); border-radius:8px; color:var(--fg); white-space:nowrap; }
.top .home:hover{ border-color:var(--accent); }
main{ padding:14px var(--gut) 40px; max-width:1360px; margin:0 auto; }

/* 과 목록 */
.lead{ color:var(--muted); margin:4px 0 16px; font-size:.95rem; }
.notice{ background:var(--chip); border-radius:8px; padding:8px 12px; margin:0 0 14px; font-size:.92rem; }
.lessons{ list-style:none; margin:0; padding:0; display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
.lcard{ display:flex; flex-direction:column; gap:4px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--card); text-decoration:none; color:var(--fg); height:100%; }
.lcard:hover,.lcard:focus-visible{ border-color:var(--accent); }
.lc-title{ font-family:var(--serif); font-weight:700; font-size:1.05rem; }
.lc-place{ color:var(--muted); font-size:.9rem; }
.lc-meta{ display:flex; flex-wrap:wrap; gap:6px 12px; font-size:.85rem; margin-top:4px; }
.lc-meta .rec{ color:var(--accent); font-weight:600; }
.lc-meta .none{ color:var(--muted); }
.tag{ display:inline-block; font-size:.75rem; padding:1px 7px; border-radius:99px; background:var(--chip); color:var(--muted); margin-left:6px; vertical-align:2px; font-family:var(--sans); font-weight:600; }
.tools{ margin-top:18px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:.9rem; color:var(--muted); }

/* 과 화면 */
.lhead{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px 16px; margin-bottom:12px; }
.lhead h2{ font-family:var(--serif); font-size:1.2rem; margin:0; line-height:1.35; }
.lhead p{ margin:2px 0 0; color:var(--muted); font-size:.9rem; }
.modes{ display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); }
.modes button{ border:0; background:none; padding:8px 16px; cursor:pointer; min-height:40px; font-weight:600; color:var(--muted); }
.modes button + button{ border-left:1px solid var(--line); }
.modes button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-fg); }

.lbody{ display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
.stagecol{ min-width:0; }
.stagewrap{ background:var(--stage); border-radius:10px; overflow:hidden; display:flex; justify-content:center; }
.stage{ position:relative; width:min(100%, calc(max(200px, var(--vh) - var(--chrome)) * var(--w,16) / var(--h,9))); aspect-ratio:var(--w,16) / var(--h,9); background:#8b8e94; user-select:none; -webkit-user-select:none; }
.stage img{ position:absolute; inset:0; width:100%; height:100%; object-fit:fill; display:block; }
.ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:12px; color:#f3f3f3; font-size:.9rem;
  background:repeating-linear-gradient(135deg,#8b8e94 0 18px,#83868c 18px 36px); }
.stage svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.shade{ fill:rgba(8,9,12,.68); transition:opacity .22s ease; opacity:0; }
.stage.dim .shade{ opacity:1; }
.ring-o{ fill:none; stroke:rgba(0,0,0,.55); stroke-width:7px; }
.ring{ fill:none; stroke:var(--ring); stroke-width:3px; }
.rings{ animation:pop .35s ease-out; }
@keyframes pop{ from{ opacity:0; } to{ opacity:1; } }
.hots{ position:absolute; inset:0; }
.hot{ position:absolute; display:block; margin:0; padding:0; background:transparent; border:2px solid transparent; border-radius:6px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.hot:hover{ border-color:rgba(255,255,255,.38); background:rgba(255,255,255,.05); }
.hot:focus-visible{ outline:none; border-color:rgba(255,255,255,.7); }
.hot.sel{ border-color:var(--ring); box-shadow:0 0 0 2px rgba(0,0,0,.45); }

.ctrl{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
.row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.row.nav{ justify-content:space-between; flex-wrap:nowrap; }
.btn{ border:1px solid var(--line); background:var(--card); border-radius:9px; padding:8px 14px; min-height:42px; cursor:pointer; font-weight:600; white-space:nowrap; }
.btn:hover:not(:disabled){ border-color:var(--accent); }
.btn:disabled{ opacity:.4; cursor:default; }
.btn.primary{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
.btn.good{ background:var(--good); border-color:var(--good); color:#fff; }
.btn.bad{ background:var(--bad); border-color:var(--bad); color:#fff; }
.btn[aria-pressed="true"]{ background:var(--chip); border-color:var(--accent); color:var(--accent); }
.btn.grow{ flex:1 1 0; }
.btn kbd{ font-family:var(--sans); font-size:.72rem; opacity:.75; font-weight:500; margin-left:4px; }
.count{ font-variant-numeric:tabular-nums; color:var(--muted); font-size:.92rem; white-space:nowrap; }
.dots{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; }
.dot{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); background:var(--card); padding:0; cursor:pointer; font-size:.66rem; line-height:1; color:var(--muted); font-variant-numeric:tabular-nums; }
.dot.frame{ border-radius:5px; }
.dot.review{ border-style:dashed; }
.dot[aria-current="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
.keys{ font-size:.78rem; color:var(--muted); text-align:center; }

.side{ display:flex; flex-direction:column; gap:10px; min-width:0; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.meta{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:.88rem; color:var(--muted); margin-bottom:6px; }
.badge{ display:inline-block; font-size:.78rem; font-weight:700; padding:2px 9px; border-radius:99px; background:var(--chip); color:var(--fg); white-space:nowrap; }
.badge.station{ background:var(--accent); color:var(--accent-fg); }
.fact{ font-family:var(--serif); font-weight:700; font-size:1.12rem; line-height:1.5; margin:0 0 8px; word-break:keep-all; overflow-wrap:anywhere; }
.hook{ margin:0 0 8px; font-size:.95rem; word-break:keep-all; overflow-wrap:anywhere; }
.hook b{ font-size:.75rem; background:var(--chip); padding:1px 7px; border-radius:99px; margin-right:6px; color:var(--muted); vertical-align:1px; }
.say{ margin:0; color:var(--muted); font-size:.92rem; word-break:keep-all; overflow-wrap:anywhere; }
.src{ margin:8px 0 0; font-size:.75rem; color:var(--muted); }
.opts{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.rate{ display:flex; align-items:center; gap:8px; font-size:.88rem; color:var(--muted); flex:1 1 200px; }
.rate input{ flex:1; min-width:90px; accent-color:var(--accent); }
.rate output{ font-variant-numeric:tabular-nums; min-width:3.2em; color:var(--fg); }
.hint{ color:var(--muted); font-size:.92rem; margin:0; }
.score{ font-size:2rem; font-weight:800; margin:0 0 4px; font-variant-numeric:tabular-nums; }
.wrong{ list-style:none; padding:0; margin:8px 0 0; display:flex; flex-direction:column; gap:6px; }
.wrong button{ width:100%; text-align:left; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:8px 10px; cursor:pointer; }
.wrong button:hover{ border-color:var(--accent); }
.wrong .wf{ display:block; font-family:var(--serif); font-weight:700; font-size:.95rem; }
.wrong .wo{ display:block; font-size:.8rem; line-height:1.45; color:var(--muted); margin-top:2px; }
.past{ font-size:.82rem; color:var(--muted); margin:10px 0 0; }

@media (max-width:599px){
  .stagewrap{ margin:0 calc(-1 * var(--gut)); border-radius:0; }
  .lhead .modes{ width:100%; }
  .modes button{ flex:1; }
}
@media (min-width:1000px){
  :root{ --chrome:250px; --gut:24px; }
  .lbody{ grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start; }
}
@media (prefers-reduced-motion:reduce){ .rings{ animation:none; } .shade{ transition:none; } }
</style>
</head>
<body>
<header class="top">
  <a class="home" id="homeLink" href="?" hidden>← 과 목록</a>
  <h1 id="pageTitle">한의학 Sketchy 과</h1>
</header>
<main>
  <section id="listView" hidden>
    <p class="lead">과마다 그림 한 장. 투어로 정거장을 차례로 듣고, 복습에서 그림을 짚어 보고, 시험으로 떠올려 본다.</p>
    <p class="notice" id="listNotice" hidden></p>
    <ul class="lessons" id="lessonList"></ul>
    <div class="tools">
      <button type="button" class="btn" data-act="export">시험 기록 내보내기 (JSON)</button>
      <span id="storeNote"></span>
    </div>
  </section>

  <section id="lessonView" hidden>
    <div class="lhead">
      <div><h2 id="lTitle"></h2><p id="lPlace"></p></div>
      <div class="modes" role="group" aria-label="보기 방식">
        <button type="button" data-mode="tour" aria-pressed="true">투어</button>
        <button type="button" data-mode="review" aria-pressed="false">복습</button>
        <button type="button" data-mode="test" aria-pressed="false">시험</button>
      </div>
    </div>
    <div class="lbody">
      <div class="stagecol">
        <div class="stagewrap">
          <div class="stage" id="stage">
            <img id="pic" alt="" decoding="async" draggable="false">
            <div class="ph" id="ph" hidden></div>
            <svg id="dim" viewBox="0 0 16 9" preserveAspectRatio="none" aria-hidden="true">
              <defs><mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="9">
                <rect id="maskBase" x="0" y="0" width="16" height="9" fill="#fff"/><g id="holeG"></g>
              </mask></defs>
              <rect class="shade" id="shade" x="0" y="0" width="16" height="9" mask="url(#holes)"/>
              <g class="rings" id="ringG"></g>
            </svg>
            <div class="hots" id="hots" hidden></div>
          </div>
        </div>

        <div class="ctrl" id="tourCtrl">
          <div class="row nav">
            <button type="button" class="btn" data-act="prev">← 이전</button>
            <span class="count" id="tCount"></span>
            <button type="button" class="btn primary" data-act="next">다음 →</button>
          </div>
          <div class="dots" id="tDots"></div>
          <div class="keys">←/→ 정거장 · 스페이스 자동 넘김</div>
        </div>
        <div class="ctrl" id="reviewCtrl" hidden>
          <div class="row nav">
            <button type="button" class="btn" data-act="rprev">← 앞 물건</button>
            <span class="count" id="rCount"></span>
            <button type="button" class="btn" data-act="rnext">뒤 물건 →</button>
          </div>
          <div class="keys">그림에서 물건을 누르면 사실이 뜬다 · ←/→ 차례로</div>
        </div>
        <div class="ctrl" id="testCtrl" hidden>
          <div class="row" id="tsAsk"><button type="button" class="btn primary grow" data-act="reveal">떠올렸으면 보기 <kbd>스페이스</kbd></button></div>
          <div class="row" id="tsJudge" hidden>
            <button type="button" class="btn bad grow" data-act="wrong">틀렸다 <kbd>←</kbd></button>
            <button type="button" class="btn good grow" data-act="right">맞았다 <kbd>→</kbd></button>
          </div>
          <div class="row" id="tsDone" hidden>
            <button type="button" class="btn primary grow" data-act="retest">다시 시험</button>
            <button type="button" class="btn grow" data-act="export">기록 내보내기 (JSON)</button>
          </div>
        </div>
      </div>

      <div class="side">
        <article class="card" id="tourCard">
          <div class="meta"><span class="badge" id="tBadge"></span><span id="tObj"></span></div>
          <p class="fact" id="tFact"></p>
          <p class="hook" id="tHook"><b>고리</b><span></span></p>
          <p class="say" id="tSay"></p>
          <p class="src" id="tSrc" hidden></p>
        </article>
        <div class="card opts" id="tourOpts">
          <button type="button" class="btn" data-act="auto" aria-pressed="false">자동 넘김</button>
          <button type="button" class="btn" data-act="voice" aria-pressed="true">내레이션</button>
          <button type="button" class="btn" data-act="replay" id="replayBtn">다시 듣기</button>
          <label class="rate">속도 <input id="rate" type="range" min="0.8" max="1.4" step="0.1" value="1"><output id="rateOut">1.0×</output></label>
          <p class="hint" id="ttsNote" hidden>이 브라우저는 읽어 주기(speechSynthesis)를 지원하지 않는다.</p>
        </div>

        <article class="card" id="reviewCard" hidden>
          <p class="hint" id="rHint">그림에서 물건을 눌러 보세요. 상자 테두리는 숨겨져 있다.</p>
          <div id="rBody" hidden>
            <div class="meta"><span class="badge station" id="rBadge"></span><span id="rObj"></span></div>
            <p class="fact" id="rFact"></p>
            <p class="hook" id="rHook"><b>고리</b><span></span></p>
          </div>
        </article>

        <article class="card" id="testCard" hidden>
          <div class="meta"><span class="badge station" id="sBadge"></span><span id="sProg"></span></div>
          <div id="sAsk"><p class="hint">밝혀진 자리에 무엇이 있었나? 사실을 떠올린 뒤 「보기」를 누른다.</p></div>
          <div id="sShow" hidden>
            <p class="meta" id="sObj"></p>
            <p class="fact" id="sFact"></p>
            <p class="hook" id="sHook"><b>고리</b><span></span></p>
          </div>
          <div id="sDone" hidden>
            <p class="score" id="sScore"></p>
            <p class="hint" id="sSaved"></p>
            <ul class="wrong" id="sWrong"></ul>
            <p class="past" id="sPast"></p>
          </div>
        </article>
      </div>
    </div>
  </section>
</main>
<script id="lessons-data" type="application/json">[{"id":"hist-01","title":"漢·晉 — 四大經典과 첫 정리자들","place":"한옥 서당 — 漢(한) 소리 = 한옥 · 經典 읽는 서당","image":"images/lessons/hist-01.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"한옥 서당 마당","fact":"漢·晉 — 四大經典이 서고, 그것을 처음 정리한 사람들","hook":"한옥(漢) 서당 = 經典을 읽는 漢·晉의 공부방","say":"漢에서 晉까지, 한옥 서당 마당이다. 漢의 「한」 소리를 따서 한옥이고, 經典을 읽는 서당이다. 왼쪽 대문에서 오른쪽 끝까지 대체로 시대 순서다. 금메달은 교재가 「최초」라고 한 책이다.","box":null,"src":[],"tts":"한에서 진까지, 한옥 서당 마당이다. 한의 한 소리를 따서 한옥이고, 경전을 읽는 서당이다. 왼쪽 대문에서 오른쪽 끝까지 대체로 시대 순서다. 금메달은 교재가 최초라고 한 책이다."},{"n":1,"obj":"대청을 받친 굵은 기둥 넷","fact":"四大經典 = 黃帝內經 · 神農本草經 · 傷寒論 · 金匱要略","hook":"기둥 넷 = 한의학을 받치는 經典 넷","say":"먼저 대청을 받친 굵은 기둥 넷. 한의학을 떠받치는 四大經典이다. 黃帝內經, 神農本草經, 傷寒論, 金匱要略 — 넷 모두 이 마당 어딘가에 다시 나온다.","box":[[480,160,68,480],[906,160,68,480],[1388,160,70,480],[1808,160,70,480]],"src":["UH-NJ-01"],"tts":"먼저 대청을 받친 굵은 기둥 넷. 한의학을 떠받치는 사대경전이다. 황제내경, 신농본초경, 상한론, 금궤요략, 넷 모두 이 마당 어딘가에 다시 나온다."},{"n":2,"obj":"노란 옷 흰 수염 노인 인형을 받쳐 든 선비 · 바닥의 두루마리","fact":"『黃帝內經』 — 현존 最古 의서 · 西漢 완성(黃帝에 依託) · 素問 9권 + 靈樞 9권","hook":"노란(黃) 옷 노인 인형 = 黃帝의 이름을 빌림(依託) · 두루마리 = 素問·靈樞","say":"대청 왼쪽, 선비가 노란 옷의 흰 수염 노인 인형을 받쳐 들었다. 노란(黃) 옷의 黃帝가 직접 쓴 것이 아니라 西漢 사람들이 그 이름에 기대어(依託) 엮은 『黃帝內經』, 현존하는 가장 오래된 의서다. 바닥의 두루마리는 素問 9권과 靈樞(鍼經) 9권이다.","box":[577,257,325,285],"src":["UH-NJ-02"],"tts":"대청 왼쪽, 선비가 노란 옷의 흰 수염 노인 인형을 받쳐 들었다. 노란 황 옷의 황제가 직접 쓴 것이 아니라 서한 사람들이 그 이름에 기대어 의탁 엮은 황제내경, 현존하는 가장 오래된 의서다. 바닥의 두루마리는 소문 9권과 영추, 침경, 9권이다."},{"n":3,"obj":"대문 지붕에 납작 엎드린 까치 · 머리 긁는 아이","fact":"扁鵲(秦越人) 『難經』 — 內經의 어려운 곳을 81개 문답으로 풀었다","hook":"납작할 편(扁) + 까치 작(鵲) = 扁鵲 · 머리 긁는 문제 = 難(어려울 난)","say":"대문 지붕에 납작 엎드린 까치 — 납작할 扁, 까치 鵲, 扁鵲이다. 본명은 秦越人. 까치가 내민 문제에 아이가 머리를 긁는다. 內經의 어려운(難) 곳을 묻고 답하며 다시 푼 『難經』, 문제가 81개라 81難이라 한다.","box":[[45,115,320,135],[390,490,105,215]],"src":["UH-NAN-01"],"tts":"대문 지붕에 납작 엎드린 까치, 납작할 편, 까치 작, 편작이다. 본명은 진월인. 까치가 내민 문제에 아이가 머리를 긁는다. 내경의 어려운 난 곳을 묻고 답하며 다시 푼 난경, 문제가 81개라 81난이라 한다."},{"n":4,"obj":"오른쪽 문짝에만 붉은 등 · 문지방에서 저절로 울리는 북 · 벽의 빈 액자 셋","fact":"難經 臟腑설 — 左腎爲腎·右腎爲命門 · 腎間動氣 · 三焦는 有名而無形","hook":"오른쪽 문 = 右腎 命門 · 두 짝 사이 북 = 腎間動氣 · 빈 액자 셋 = 이름만 있고 꼴이 없는 三焦","say":"대문 두 짝을 보자. 왼쪽은 그냥 문, 오른쪽 문에만 붉은 등이 켜졌다 — 왼쪽 腎은 腎, 오른쪽 腎은 命門이다. 두 짝 사이 문지방에서 북이 저절로 울린다, 두 腎 사이의 腎間動氣. 벽의 빈 액자 셋은 이름만 있고 꼴이 없는 三焦다. 『難經』은 三焦를 元氣之別使라 하고 臟腑의 表裏도 정리했다.","box":[0,340,385,440],"src":["UH-NAN-03","UHG-067","UHG-067-M01","UHG-067-M02","UHG-067-M03","UHG-067-M04"],"tts":"대문 두 짝을 보자. 왼쪽은 그냥 문, 오른쪽 문에만 붉은 등이 켜졌다, 왼쪽 신은 신, 오른쪽 신은 명문이다. 두 짝 사이 문지방에서 북이 저절로 울린다, 두 신 사이의 신간동기. 벽의 빈 액자 셋은 이름만 있고 꼴이 없는 삼초다. 난경은 삼초를 원기지별사라 하고 장부의 표리도 정리했다."},{"n":5,"obj":"풀잎 망토를 두르고 약초를 씹는 농부 신 · 3단 선반 · 금메달","fact":"『神農本草經』 — 최초의 藥物學서 · 365종 · 上·中·下 三品","hook":"약초 씹는 농부 신 = 神農 · 3단 선반 = 三品 · 금메달 = 최초","say":"풀잎 망토의 농부 신이 약초를 맛본다, 神農이다. 『神農本草經』은 최초의 藥物學 전문서로 365종을 실었다. 곁의 3단 선반처럼 上品(養命)·中品(養性)·下品(治病) 三品으로 나눴다. 성립 시기는 교재에 따라 秦漢 또는 東漢으로 적는다.","box":[355,710,375,410],"src":["BC-SA-01","UH-BC-01-01","UH-BC-01-02"],"tts":"풀잎 망토의 농부 신이 약초를 맛본다, 신농이다. 신농본초경은 최초의 약물학 전문서로 365종을 실었다. 곁의 3단 선반처럼 상품, 양명, 중품, 양성, 하품, 치병, 삼품으로 나눴다. 성립 시기는 교재에 따라 진한 또는 동한으로 적는다."},{"n":6,"obj":"대청 한가운데 앉아 처방 쪽지를 건네는 사람 · 담요 쓴 환자들 · 책상에 걸린 금메달","fact":"張仲景(東漢) 『傷寒雜病論』 — 辨證論治를 쓴 최초의 임상서 · 方書之祖","hook":"한가운데(仲) 앉은 사람 = 張仲景 · 담요 쓴 환자 = 傷寒(추위에 상함) · 처방 쪽지 = 方書之祖 · 금메달 = 최초","say":"대청 한가운데(仲)에 앉은 사람, 張仲景이다. 담요를 둘러쓴 傷寒 환자들 곁에서 처방 쪽지를 건넨다. 『傷寒雜病論』은 脈과 證을 함께 보아 辨證論治를 쓴 최초의 임상 전문서이고, 처방서의 조상이라 方書之祖라 한다.","box":[968,290,430,262],"src":["UH-SH-01","BZ-BY-01","BZ-BY-06-M01","UH-SH-03"],"tts":"대청 한가운데 중에 앉은 사람, 장중경이다. 담요를 둘러쓴 상한 환자들 곁에서 처방 쪽지를 건넨다. 상한잡병론은 맥과 증을 함께 보아 변증논치를 쓴 최초의 임상 전문서이고, 처방서의 조상이라 방서지조라 한다."},{"n":7,"obj":"여섯 단 사다리 · 칸이 셋인 금 궤짝","fact":"傷寒論 = 以六經統百病 · 金匱要略 = 千般疢難 不越三條","hook":"사다리 여섯 단 = 六經 · 금 궤짝(金匱) 세 칸 = 三條","say":"원님 오른쪽에 여섯 단 사다리. 『傷寒論』은 모든 병을 六經 여섯 단계로 거느린다 — 以六經統百病. 곁의 금 궤짝(金匱)은 칸이 셋, 『金匱要略』의 「千般疢難 不越三條」다. 이 세 갈래가 뒤에 三因學說로 이어진다.","box":[1480,215,310,350],"src":["UH-SH-02"],"tts":"원님 오른쪽에 여섯 단 사다리. 상한론은 모든 병을 육경 여섯 단계로 거느린다, 이육경통백병. 곁의 금 궤짝 금궤는 칸이 셋, 금궤요략의 천반진난 불월삼조다. 이 세 갈래가 뒤에 삼인학설로 이어진다."},{"n":8,"obj":"가슴에 붉은 꽃 단 의사가 끓는 사발을 든 곁에 잠든 환자 · 탁자의 칼 · 체조하는 다섯 짐승","fact":"華佗(東漢) — 麻沸散으로 마취해 開腹手術 · 五禽戲","hook":"꽃(華) = 華佗 · 끓는(沸) 사발 = 麻沸散 · 칼 = 外科 · 다섯 짐승 = 五禽戲","say":"가슴에 큰 꽃(華)을 단 의사, 華佗다. 부글부글 끓는(沸) 사발 — 麻沸散으로 환자를 재우고 칼로 배를 열었다. 뒤에서 호랑이·사슴·곰·원숭이·학이 체조한다, 다섯 짐승을 본뜬 五禽戲다.","box":[[810,675,480,445],[1235,560,575,250]],"src":["UHG-059"],"tts":"가슴에 큰 꽃 화를 단 의사, 화타다. 부글부글 끓는 비 사발, 마비산으로 환자를 재우고 칼로 배를 열었다. 뒤에서 호랑이, 사슴, 곰, 원숭이, 학이 체조한다, 다섯 짐승을 본뜬 오금희다."},{"n":9,"obj":"손가락으로 아이 손목을 짚는 거구의 아저씨","fact":"王叔和(晉) 『脈經』 — 24脈 · 寸關尺과 臟腑의 짝 · 獨取寸口를 확정","hook":"왕(王)만 한 아저씨(叔) = 王叔和 · 손목 = 寸口(寸·關·尺)","say":"덩치가 왕(王)만 한 아저씨(叔), 晉의 王叔和다. 손목 寸口만 짚는다. 『脈經』은 脈象 24종을 적고 寸·關·尺 세 자리와 臟腑의 짝을 정해 獨取寸口를 굳혔다 — 그 근거는 『難經』이 놓았다. 『脈訣』은 高陽生의 책이니 헷갈리지 말 것.","box":[1450,760,320,355],"src":["UH-ST-02","JD-MAEK-03"],"tts":"덩치가 왕만 한 아저씨 숙, 진의 왕숙화다. 손목 촌구만 짚는다. 맥경은 맥상 24종을 적고 촌, 관, 척 세 자리와 장부의 짝을 정해 독취촌구를 굳혔다, 그 근거는 난경이 놓았다. 맥결은 고양생의 책이니 헷갈리지 말 것."},{"n":10,"obj":"끈으로 묶은 책 두 권","fact":"王叔和가 『傷寒雜病論』을 다시 엮어 傷寒論·金匱要略 둘로 나눠 전했다","hook":"묶인 책 두 권 = 한 책을 두 책으로 나눔","say":"아저씨 곁 탁자에 책 두 권이 끈으로 묶여 있다. 흩어진 張仲景의 『傷寒雜病論』을 王叔和가 다시 엮어 『傷寒論』과 『金匱要略』 두 책으로 나눠 전했다.","box":[1670,970,215,160],"src":["UH-SH-01","UH-ST-02"],"tts":"아저씨 곁 탁자에 책 두 권이 끈으로 묶여 있다. 흩어진 장중경의 상한잡병론을 왕숙화가 다시 엮어 상한론과 금궤요략 두 책으로 나눠 전했다."},{"n":11,"obj":"칡넝쿨 감긴 은자가 통나무를 껴안음 · 팔꿈치 뒤 주머니 · 끓는 솥","fact":"葛洪(東晉) — 『抱朴子』 · 『肘後備急方』 · 『金匱藥方』","hook":"칡(葛) = 葛洪 · 통나무(朴)를 껴안음(抱) = 抱朴子 · 팔꿈치(肘) 뒤(後) 주머니 = 肘後備急方 · 솥 = 煉丹","say":"칡넝쿨(葛)에 감긴 은자, 東晉의 葛洪이다. 다듬지 않은 통나무(朴)를 껴안았으니(抱) 『抱朴子』, 팔꿈치(肘) 뒤(後)에 찬 주머니가 급할 때 꺼내 쓰는 『肘後備急方』이다. 곁의 솥은 그가 즐긴 煉丹術, 『金匱藥方』도 그의 책이다. 『肘後百一方』은 梁의 陶弘景이 이 책을 늘린 것이다.","box":[1805,565,240,305],"src":["UHG-033","BIG-016"],"tts":"칡넝쿨 갈에 감긴 은자, 동진의 갈홍이다. 다듬지 않은 통나무 박을 껴안았으니 포 포박자, 팔꿈치 주 뒤 후에 찬 주머니가 급할 때 꺼내 쓰는 주후비급방이다. 곁의 솥은 그가 즐긴 연단술, 금궤약방도 그의 책이다. 주후백일방은 양의 도홍경이 이 책을 늘린 것이다."},{"n":12,"kind":"review","obj":"금메달 둘 · 대청 한가운데 앉은 사람","fact":"금메달 둘 — 최초 藥物學서 神農本草經 · 최초 임상서 傷寒雜病論","hook":"금메달 = 최초 · 東漢 둘(張仲景·華佗) 다음 晉 둘(王叔和·葛洪)","say":"금메달을 다시 보자. 선반의 메달은 최초의 藥物學서 『神農本草經』, 대청 한가운데 책상에 걸린 메달은 辨證論治 최초의 임상서 『傷寒雜病論』이다. 東漢의 두 의사 張仲景·華佗 다음은 晉의 王叔和, 東晉의 葛洪이다.","box":[[680,745,45,120],[1145,462,42,90],[968,290,430,262]],"src":[],"tts":"금메달을 다시 보자. 선반의 메달은 최초의 약물학서 신농본초경, 대청 한가운데 책상에 걸린 메달은 변증논치 최초의 임상서 상한잡병론이다. 동한의 두 의사 장중경, 화타 다음은 진의 왕숙화, 동진의 갈홍이다."}],"has_image":true},{"id":"hist-02","title":"南北朝·隋 — 本草 정리와 「최초」의 전문서들","place":"강가 도자기 공방 마당","image":"images/lessons/hist-02.webp","w":2048,"h":1144,"design":"src/lessons/design/hist-02/","stations":[{"n":0,"kind":"frame","obj":"강가 도자기 공방 마당","fact":"南北朝·隋 — 本草를 정리하고 「최초」의 전문서들이 나온 시대","hook":"도자기 공방 마당 = 南北朝·隋의 의서들","say":"南北朝에서 隋까지, 강가의 도자기 공방 마당이다. 本草를 처음 정리한 사람과 「최초」가 붙은 전문서들이 이 마당에 모여 있다. 금메달이 달린 것은 교재가 「최초」라고 한 책이다.","box":null,"src":[],"tts":"남북조에서 수까지, 강가의 도자기 공방 마당이다. 본초를 처음 정리한 사람과 최초가 붙은 전문서들이 이 마당에 모여 있다. 금메달이 달린 것은 교재가 최초라고 한 책이다."},{"n":1,"obj":"물레 앞에서 항아리를 빚는 도공","fact":"陶弘景(梁) 『本草經集注』 — 『神農本草經』과 『名醫別錄』을 합쳐 정리","hook":"도공 = 陶(질그릇 도) → 陶弘景","say":"물레 앞의 도공부터 보자. 질그릇 도(陶), 陶弘景이다. 梁나라의 陶弘景은 『神農本草經』에 『名醫別錄』을 합쳐 『本草經集注』를 지었다.","box":[144,497,461,619],"src":["UH-BC-01-01","UHG-027","BC-SA-03"],"tts":"물레 앞의 도공부터 보자. 질그릇 도, 도홍경이다. 양나라의 도홍경은 신농본초경에 명의별록을 합쳐 본초경집주를 지었다."},{"n":2,"obj":"붉은 띠·검은 띠가 반반 감긴 큰 항아리","fact":"730종 — 本經 365는 붉은 글씨(朱書), 別錄 365는 검은 글씨(墨書)","hook":"두 색 반반 = 朱墨 구분, 365 + 365","say":"도공 뒤의 큰 항아리는 붉은 띠와 검은 띠가 반반이다. 本經에서 온 365종은 붉은 글씨로, 別錄에서 온 365종은 검은 글씨로 갈라 적었다. 둘을 합쳐 730종이다.","box":[29,281,348,417],"src":["UH-BC-01-01","BC-SA-03"],"tts":"도공 뒤의 큰 항아리는 붉은 띠와 검은 띠가 반반이다. 본경에서 온 365종은 붉은 글씨로, 별록에서 온 365종은 검은 글씨로 갈라 적었다. 둘을 합쳐 730종이다."},{"n":3,"obj":"등에 북 고리를 두른 천둥신이 무쇠 솥에 약초를 볶음 · 솥의 금메달","fact":"雷斅 『雷公炮炙論』 — 최초의 炮製(약재 손질) 전문서","hook":"천둥신 = 雷公 · 솥에 볶기 = 炮炙 · 금메달 = 최초","say":"등에 북 고리를 두른 천둥신, 雷公이 솥에 약초를 볶는다. 굽고 볶아 약재의 성질을 바꾸는 것이 炮炙, 곧 炮製다. 솥에 걸린 금메달 — 雷斅의 『雷公炮炙論』이 최초의 炮製 전문서다.","box":[386,89,446,659],"src":["UH-ST-05-02","BC-SA-03"],"tts":"등에 북 고리를 두른 천둥신, 뇌공이 솥에 약초를 볶는다. 굽고 볶아 약재의 성질을 바꾸는 것이 포자, 곧 포제다. 솥에 걸린 금메달, 뇌효의 뇌공포자론이 최초의 포제 전문서다."},{"n":4,"obj":"서랍 많은 약장 위, 잎을 맞잡은 약초 두 포기","fact":"徐之才(北齊) 『藥對』 — 약을 짝지어 쓰는 配伍","hook":"서랍 = 徐 · 짝 = 藥對","say":"가운데 서랍 많은 약장, 「서랍」의 서가 徐之才다. 그 위 약초 두 포기가 잎을 맞잡고 짝을 지었다. 약을 짝지어 쓰는 配伍를 다룬 北齊 徐之才의 『藥對』다.","box":[817,108,345,537],"src":["UHG-036","BJ-SA-04"],"tts":"가운데 서랍 많은 약장, 서랍의 서가 서지재다. 그 위 약초 두 포기가 잎을 맞잡고 짝을 지었다. 약을 짝지어 쓰는 배오를 다룬 북제 서지재의 약대다."},{"n":5,"obj":"줄자를 목에 감고 떠나는 도깨비 · 떨어진 쪽지와 금메달 · 외과 칼","fact":"『劉涓子鬼遺方』 — 현존 최초의 外科 전문서(귀신이 남긴 처방)","hook":"도깨비(鬼)가 남긴(遺) 처방(方) · 칼 = 外科 · 유연한 자 = 劉涓子","say":"도깨비가 쪽지를 떨어뜨리고 슬금슬금 간다. 귀신이 남기고 간 처방, 『鬼遺方』이다. 곁의 칼은 外科, 쪽지 위 금메달은 현존 최초의 外科 전문서라는 뜻이다. 목에 감은 말랑한 줄자, 「유연한 자」가 劉涓子다.","box":[823,665,590,397],"src":["UH-ST-04","BJ-SA-02"],"tts":"도깨비가 쪽지를 떨어뜨리고 슬금슬금 간다. 귀신이 남기고 간 처방, 귀유방이다. 곁의 칼은 외과, 쪽지 위 금메달은 현존 최초의 외과 전문서라는 뜻이다. 목에 감은 말랑한 줄자, 유연한 자가 유연자다."},{"n":6,"obj":"쪽지 빼곡한 책을 든 선생 · 한꺼번에 일어선 학생들과 넘어진 걸상 넷","fact":"全元起(梁) 『內經訓解』 — 『素問』에 처음으로 주석을 달았다","hook":"전원 기립 = 全元起 · 쪽지 붙은 책 = 주석","say":"선생이 쪽지가 빼곡한 책을 들자 학생들이 전원 기립했다. 걸상이 다 넘어졌다 — 全元起다. 梁나라 全元起는 『素問』에 처음으로 주석을 달아 『內經訓解』를 지었다. 교재가 「최초」를 달지 않아 금메달은 없다.","box":[1137,406,770,446],"src":[],"tts":"선생이 쪽지가 빼곡한 책을 들자 학생들이 전원 기립했다. 걸상이 다 넘어졌다, 전원기다. 양나라 전원기는 소문에 처음으로 주석을 달아 내경훈해를 지었다. 교재가 최초를 달지 않아 금메달은 없다."},{"n":7,"obj":"무늬가 저마다 다른 알이 든 사람만 한 둥지 · 금메달","fact":"巢元方(隋) 『諸病源候論』 — 최초의 病因·病機·證候 전문서","hook":"둥지 = 巢 · 무늬 다른 알 = 여러 병의 근원(源)과 증후(候)","say":"사람만 한 둥지, 새집 소(巢) — 巢元方이다. 알마다 겉무늬가 다르다. 여러 병의 속(源)과 겉으로 드러난 증후(候)를 가른 『諸病源候論』, 隋나라의 최초 病因·病機 전문서다.","box":[1249,248,463,273],"src":["UH-ST-04"],"tts":"사람만 한 둥지, 새집 소, 소원방이다. 알마다 겉무늬가 다르다. 여러 병의 속 원과 겉으로 드러난 증후를 가른 제병원후론, 수나라의 최초 병인, 병기 전문서다."},{"n":8,"obj":"꼭대기에 크고 흰 천이 여러 갈래로 걸린 버드나무 · 금메달","fact":"楊上善(隋) 『黃帝內經太素』 — 內經을 분류·재편한 최초의 분류 주석","hook":"버드나무 = 楊 · 꼭대기 = 上 · 크고(太) 흰(素) 천 · 갈래 = 분류","say":"강가 버드나무(楊) 꼭대기(上)에 크고 흰 천이 걸렸다 — 楊上善, 크고(太) 흰(素) 『太素』다. 천이 여러 갈래로 갈라진 것처럼 內經을 항목별로 갈라 다시 엮었다. 최초의 분류 주석이다.","box":[1566,0,481,554],"src":["UH-NJ-03"],"tts":"강가 버드나무 양 꼭대기 상에 크고 흰 천이 걸렸다, 양상선, 크고 태 흰 소 태소다. 천이 여러 갈래로 갈라진 것처럼 내경을 항목별로 갈라 다시 엮었다. 최초의 분류 주석이다."},{"n":9,"obj":"파도무늬 표지의 큰 책에 끼워진 낡은 책 두 권","fact":"『百濟新集方』·『新羅法師方』 — 失傳, 일본 『醫心方』(984)에 인용되어 전함","hook":"파도무늬 책 = 일본 醫心方 · 끼워진 두 권 = 百濟·新羅 의서","say":"앞쪽 탁자 위, 파도무늬 표지의 큰 책은 일본의 『醫心方』(984)이다. 그 안에 끼워진 낡은 두 권이 百濟의 『百濟新集方』과 新羅의 『新羅法師方』이다. 본디 책은 사라지고 이 책에 인용되어서만 전한다.","box":[1422,838,625,306],"src":["UHG-018"],"tts":"앞쪽 탁자 위, 파도무늬 표지의 큰 책은 일본의 의심방 984이다. 그 안에 끼워진 낡은 두 권이 백제의 백제신집방과 신라의 신라법사방이다. 본디 책은 사라지고 이 책에 인용되어서만 전한다."},{"n":10,"kind":"review","obj":"금메달 넷과 선생","fact":"「최초」 넷 — 炮製 雷公炮炙論 · 外科 鬼遺方 · 病因 諸病源候論 · 분류 주석 太素","hook":"금메달 = 최초 · 『素問』 첫 주석은 全元起(메달 없음)","say":"금메달을 다시 보자. 솥은 최초의 炮製서, 쪽지는 최초의 外科서, 둥지는 최초의 病因서, 버드나무는 최초의 분류 주석이다. 금메달은 없지만 『素問』에 처음 주석을 단 사람은 전원 기립의 全元起다.","box":[[734,544,75,78],[1235,915,140,85],[1595,426,78,89],[1600,170,66,78],[1137,406,237,443]],"src":[],"tts":"금메달을 다시 보자. 솥은 최초의 포제서, 쪽지는 최초의 외과서, 둥지는 최초의 병인서, 버드나무는 최초의 분류 주석이다. 금메달은 없지만 소문에 처음 주석을 단 사람은 전원 기립의 전원기다."}],"has_image":true},{"id":"hist-03","title":"唐 — 관찬 본초와 千金·外臺·王冰","place":"사탕(糖) 과자점 — 唐 = 당 소리","image":"images/lessons/hist-03.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"사탕 과자점","fact":"唐 — 나라가 엮은 본초와 千金·外臺·王冰의 시대","hook":"사탕(糖) 과자점 = 唐(당)","say":"唐나라, 「당」 소리를 따서 사탕(糖) 과자점이다. 왼쪽 앞의 사막 쟁반에서 시작해 오른쪽 문 밖까지 돌아보자. 금메달은 교재가 「최초」라고 한 책이다.","box":null,"src":[],"tts":"당나라, 당 소리를 따서 사탕 당 과자점이다. 왼쪽 앞의 사막 쟁반에서 시작해 오른쪽 문 밖까지 돌아보자. 금메달은 교재가 최초라고 한 책이다."},{"n":1,"obj":"사막 쟁반에서 낙타를 탄 아이 · 금덩이 둘(하나는 날개) · 낙타의 금메달","fact":"孫思邈(唐) 『備急千金要方』·『千金翼方』 — 중국 최초의 임상 백과","hook":"손자(孫)가 사막(思邈)에 = 孫思邈 · 금덩이(千金) = 千金要方 · 날개(翼) 금덩이 = 千金翼方 · 금메달 = 최초","say":"모래 사막 쟁반에서 아이가 낙타를 탔다. 손자(孫)가 사막(思邈)에 — 孫思邈이다. 품에 안은 금덩이가 천금(千金), 날개(翼) 달린 금덩이가 『千金翼方』이다. 『備急千金要方』은 병을 오장육부에 나눠 담은 중국 최초의 임상 백과다.","box":[[170,650,390,330],[25,860,760,265]],"src":["UH-ST-05-01"],"tts":"모래 사막 쟁반에서 아이가 낙타를 탔다. 손자 손이 사막에, 손사막이다. 품에 안은 금덩이가 천금, 날개 익 달린 금덩이가 천금익방이다. 비급천금요방은 병을 오장육부에 나눠 담은 중국 최초의 임상 백과다."},{"n":2,"obj":"권투 장갑 낀 개가 붓으로 점 찍힌 몸 그림을 고침","fact":"甄權(唐) — 옛 明堂圖(경혈 그림)를 교정","hook":"개(견) + 권투(권) = 甄權 · 점 찍힌 몸 그림 = 明堂圖","say":"벽에 점이 찍힌 몸 그림이 걸렸다, 경혈을 그린 明堂圖다. 권투 장갑을 낀 개가 붓으로 고친다 — 견(犬)과 권(拳), 甄權이다. 甄權은 孫思邈과 같은 唐代 사람으로 옛 明堂圖를 바로잡았다.","box":[65,101,396,548],"src":["HUBGR-0096","HUBGR-0098"],"tts":"벽에 점이 찍힌 몸 그림이 걸렸다, 경혈을 그린 명당도다. 권투 장갑을 낀 개가 붓으로 고친다, 견과 권, 견권이다. 견권은 손사막과 같은 당대 사람으로 옛 명당도를 바로잡았다."},{"n":3,"obj":"경례하는 소 · 붉은 리본과 봉인의 새 책 · 책 밑에 매달린 금메달","fact":"蘇敬(唐 659) 『新修本草』 — 세계 최초의 국가 약전(官修本草)","hook":"소(蘇)가 경례(敬) = 蘇敬 · 새(新) 책 + 붉은 봉인 = 나라가 엮음(官修) · 금메달 = 최초","say":"제복을 입은 소가 경례한다 — 소(蘇)와 경례(敬), 蘇敬이다. 곁의 새 책에 붉은 봉인이 찍혔다, 나라가 엮은(官修) 『新修本草』(659), 일명 唐本草다. 세계 최초의 국가 약전이라 금메달. 本草書의 차례는 本經 → 別錄 → 新修本草 → 證類本草 → 綱目 → 綱目拾遺.","box":[483,281,382,526],"src":["UH-ST-05-02","BC-SA-04","UHG-027"],"tts":"제복을 입은 소가 경례한다, 소와 경례 경, 소경이다. 곁의 새 책에 붉은 봉인이 찍혔다, 나라가 엮은 관수 신수본초, 659, 일명 당본초다. 세계 최초의 국가 약전이라 금메달. 본초서의 차례는 본경, 별록, 신수본초, 증류본초, 강목, 강목습유."},{"n":4,"obj":"작은 탁자에서 죽을 떠먹는 개구리(맹꽁이)","fact":"孟詵(唐) 『食療本草』 — 음식으로 다스리는(食治) 본초","hook":"맹(孟)꽁이 = 孟詵 · 죽 한 그릇 = 食療","say":"계산대 앞, 맹꽁이가 작은 탁자에서 죽을 떠먹는다. 맹(孟) — 孟詵이다. 약 대신 먹을거리로 병을 다스리는 『食療本草』, 음식 요법(食治)의 본초서다.","box":[886,620,267,259],"src":["UHG-029"],"tts":"계산대 앞, 맹꽁이가 작은 탁자에서 죽을 떠먹는다. 맹, 맹선이다. 약 대신 먹을거리로 병을 다스리는 식료본초, 음식 요법 식치의 본초서다."},{"n":5,"obj":"묵은 큰 장독 · 바닥에 흘린 사탕을 주워 담는 아이","fact":"陳藏器(唐 739) 『本草拾遺』 — 앞 본초가 빠뜨린 약을 주워 담았다","hook":"묵은(陳) 장독(藏器) = 陳藏器 · 흘린 것을 주움(拾遺)","say":"큰 장독은 오래 묵었다 — 묵을 陳, 갈무리할 藏, 그릇 器, 陳藏器다. 아이가 바닥에 흘린 사탕을 주워 담는다. 앞 본초서가 빠뜨린 약을 주워(拾) 모은(遺) 『本草拾遺』(739). 淸 趙學敏의 『本草綱目拾遺』와는 다른 책이다.","box":[994,331,324,311],"src":["UHG-029"],"tts":"큰 장독은 오래 묵었다, 묵을 진, 갈무리할 장, 그릇 기, 진장기다. 아이가 바닥에 흘린 사탕을 주워 담는다. 앞 본초서가 빠뜨린 약을 주워 습 모은 유 본초습유, 739. 청 조학민의 본초강목습유와는 다른 책이다."},{"n":6,"obj":"장독 위 선반의 사탕병 열 개(다섯 + 다섯)","fact":"十劑 — 宣·通·補·瀉·輕·重·滑·澀·燥·濕, 陳藏器가 처음 제창","hook":"사탕병 열 개 = 十劑","say":"장독 바로 위 선반에 사탕병이 다섯씩 두 줄, 열 개다. 약을 효능으로 열 가지로 나눈 十劑 — 宣·通·補·瀉·輕·重·滑·澀·燥·濕. 陳藏器가 『本草拾遺』에서 처음 내세웠다. 徐之才 『藥對』의 「十種」, 宋 『聖濟經』과 헷갈리는 함정이다.","box":[1030,101,454,238],"src":["BJ-10J-01"],"tts":"장독 바로 위 선반에 사탕병이 다섯씩 두 줄, 열 개다. 약을 효능으로 열 가지로 나눈 십제, 선, 통, 보, 사, 경, 중, 활, 삽, 조, 습. 진장기가 본초습유에서 처음 내세웠다. 서지재 약대의 십종, 송 성제경과 헷갈리는 함정이다."},{"n":7,"obj":"문 밖 마루에서 쉿 하는 사람 · 천을 덮고 자물쇠 채운 상자","fact":"王燾(唐 752) 『外臺秘要』 — 외과·각과 처방을 크게 모았다","hook":"바깥(外) 마루(臺) · 쉿(秘) · 천으로 덮은(燾) 상자 = 外臺秘要","say":"문 밖, 바깥(外)의 높은 마루(臺)에서 한 사람이 쉿(秘) 한다. 곁의 상자는 천으로 덮고(燾) 자물쇠를 채웠다. 王燾의 『外臺秘要』(752), 외과와 여러 과의 처방을 크게 모은 책이다.","box":[1679,281,288,296],"src":["UHG-062"],"tts":"문 밖, 바깥 외의 높은 마루 대에서 한 사람이 쉿 비 한다. 곁의 상자는 천으로 덮고 도 자물쇠를 채웠다. 왕도의 외대비요, 752, 외과와 여러 과의 처방을 크게 모은 책이다."},{"n":8,"obj":"고드름 달린 큰 얼음덩이 위의 펼친 흰 책 · 꽂힌 날씨 표지 일곱","fact":"王冰(唐 762) 『素問』 次注 — 運氣 七篇大論을 보태 넣었다","hook":"왕(王)만 한 얼음(冰) = 王冰 · 흰 책 = 素問 · 날씨 일곱 = 運氣 七篇","say":"사람만 한 얼음덩이 — 왕(王)만 한 얼음(冰), 王冰(啓玄子)이다. 위에 펼친 흰 책이 『素問』, 둘레에 해·구름·비·바람·번개·무지개·눈, 날씨 표지 일곱이 꽂혔다. 王冰은 『素問』에 주를 달며 運氣 七篇大論을 보태 지금의 『素問』을 만들었다(『靈樞』는 宋 史崧이 정리). 「益火之源 · 壯水之主」도 그의 주석이다.","box":[1196,598,465,541],"src":["UH-ST-06","UH-NJ-03"],"tts":"사람만 한 얼음덩이, 왕만 한 얼음 빙, 왕빙 계현자이다. 위에 펼친 흰 책이 소문, 둘레에 해, 구름, 비, 바람, 번개, 무지개, 눈, 날씨 표지 일곱이 꽂혔다. 왕빙은 소문에 주를 달며 운기 칠편대론을 보태 지금의 소문을 만들었다, 영추는 송 사숭이 정리. 익화지원, 장수지주도 그의 주석이다."},{"n":9,"obj":"물결 위 자두를 가득 실은 돛배 모형","fact":"李珣(唐末·五代) 『海藥本草』 — 바다 건너 들어온 외래 약물","hook":"자두(李)를 실은 배 = 李珣 · 바다(海) 건너 온 약 = 海藥","say":"문 옆 돛배 모형에 자주색 자두가 가득하다. 자두 李, 李珣이다. 바다(海)를 건너 들어온 외래 약물을 모은 『海藥本草』, 唐末·五代의 책이다.","box":[1629,656,367,476],"src":["UHG-029"],"tts":"문 옆 돛배 모형에 자주색 자두가 가득하다. 자두 이, 이순이다. 바다 해를 건너 들어온 외래 약물을 모은 해약본초, 당말, 오대의 책이다."},{"n":10,"kind":"review","obj":"금메달 둘 — 낙타 목 · 새 책 밑","fact":"唐의 「최초」 둘 — 국가 약전 新修本草 · 임상 백과 千金要方","hook":"금메달 = 최초 · 拾遺 함정: 淸 趙學敏 『本草綱目拾遺』","say":"금메달을 다시 보자. 새 책의 메달은 세계 최초의 국가 약전 『新修本草』, 낙타의 메달은 중국 최초의 임상 백과 『千金要方』이다. 唐의 본초 넷 — 新修(蘇敬) · 食療(孟詵) · 拾遺(陳藏器) · 海藥(李珣).","box":[[447,814,50,108],[670,649,80,158]],"src":[],"tts":"금메달을 다시 보자. 새 책의 메달은 세계 최초의 국가 약전 신수본초, 낙타의 메달은 중국 최초의 임상 백과 천금요방이다. 당의 본초 넷, 신수, 소경, 식료, 맹선, 습유, 진장기, 해약, 이순."}],"has_image":true},{"id":"hist-04","title":"宋 — 국가 方書와 錢乙·許叔微·陳無擇","place":"소나무(松) 숲 나라 약국 — 宋 = 송 소리 · 和劑局","image":"images/lessons/hist-04.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"소나무 숲 속 나라 약국","fact":"宋 — 나라가 엮은 方書, 그리고 아이·傷寒·三因을 다룬 의가들","hook":"소나무(松) 숲 = 宋(송) · 나라 약국 = 和劑局","say":"宋나라, 「송」 소리를 따서 소나무(松) 숲이다. 숲 속에 나라가 차린 약국, 和劑局이 있다. 宋은 나라가 직접 처방서를 엮은 시대다. 금메달은 교재가 「최초」라고 한 책이다.","box":null,"src":[],"tts":"송나라, 송 소리를 따서 소나무 송 숲이다. 숲 속에 나라가 차린 약국, 화제국이 있다. 송은 나라가 직접 처방서를 엮은 시대다. 금메달은 교재가 최초라고 한 책이다."},{"n":1,"obj":"선물 상자를 물고 나는 흰 비둘기","fact":"『太平聖惠方』 — 北宋 초 칙명으로 엮은 대형 方書(국가 첫 方書)","hook":"평화의 비둘기 = 太平 · 선물(은혜) = 聖惠","say":"하늘에 흰 비둘기가 선물 상자를 물고 난다. 평화(太平)의 비둘기가 은혜(惠)를 베푼다 — 『太平聖惠方』이다. 北宋 초 王懷隱 등이 칙명으로 엮은 대형 처방서로, 나라가 엮은 첫 方書다.","box":[137,50,339,296],"src":["UH-SJ-02","UH-SJ-02-M01"],"tts":"하늘에 흰 비둘기가 선물 상자를 물고 난다. 평화 태평의 비둘기가 은혜를 베푼다, 태평성혜방이다. 북송 초 왕회은 등이 칙명으로 엮은 대형 처방서로, 나라가 엮은 첫 방서다."},{"n":2,"obj":"약국 계산대의 똑같은 약상자 더미와 약사 · 계산대 앞 금메달","fact":"『太平惠民和劑局方』 — 나라 약국 和劑局의 처방집 · 최초의 국정 成藥典","hook":"나라 약국 = 和劑局 · 똑같이 미리 지은 약상자 = 成藥 · 금메달 = 최초","say":"약국 계산대에 똑같은 약상자가 가지런히 쌓였다. 미리 지어 둔 약, 成藥이다. 나라 약국 和劑局이 쓴 제제 규범이 『太平惠民和劑局方』, 최초의 국정 成藥 처방집이라 금메달이 걸렸다.","box":[634,454,577,483],"src":["UH-SJ-02","UH-SJ-02-M02"],"tts":"약국 계산대에 똑같은 약상자가 가지런히 쌓였다. 미리 지어 둔 약, 성약이다. 나라 약국 화제국이 쓴 제제 규범이 태평혜민화제국방, 최초의 국정 성약 처방집이라 금메달이 걸렸다."},{"n":3,"obj":"지붕까지 쌓인 책 탑 · 위에 뜬 금빛 후광","fact":"『聖濟總錄』 — 徽宗이 칙명으로 엮은 방대한 의학 총서","hook":"후광 = 聖 · 모두 쌓아 올린 책 = 總錄","say":"약사 뒤, 책이 지붕까지 쌓였고 꼭대기에 후광(聖)이 떴다. 모든 것을 모아 적은(總錄) 『聖濟總錄』, 徽宗이 칙명으로 엮은 방대한 임상 총서다. 宋의 국가 方書 셋 — 聖惠方 · 和劑局方 · 聖濟總錄.","box":[1247,144,223,598],"src":["UH-SJ-02","UH-SJ-02-M03"],"tts":"약사 뒤, 책이 지붕까지 쌓였고 꼭대기에 후광 성이 떴다. 모든 것을 모아 적은 총록 성제총록, 휘종이 칙명으로 엮은 방대한 임상 총서다. 송의 국가 방서 셋, 성혜방, 화제국방, 성제총록."},{"n":4,"obj":"전(부침개)을 든 아기 · 아기 목의 금메달","fact":"錢乙(北宋) 『小兒藥證直訣』 — 최초의 兒科 전문서","hook":"아기(小兒) + 전(錢) = 錢乙 · 금메달 = 최초","say":"앞 왼쪽, 턱받이를 한 아기가 커다란 전을 들었다. 아기(小兒)와 전(錢) — 錢乙이다. 北宋 錢乙의 『小兒藥證直訣』은 최초의 兒科 전문서라 아기 목에 금메달이 걸렸다.","box":[259,713,447,389],"src":["BJ-SA-04","UH-SJ-06-01"],"tts":"앞 왼쪽, 턱받이를 한 아기가 커다란 전을 들었다. 아기 소아와 전, 전을이다. 북송 전을의 소아약증직결은 최초의 아과 전문서라 아기 목에 금메달이 걸렸다."},{"n":5,"obj":"초록·빨강·노랑·하양·검정 블록 다섯 탑","fact":"錢乙 — 五臟辨證을 세워 小兒科에 처음 적용했다","hook":"다섯 색 블록 = 五臟(木火土金水)","say":"아기 곁에 블록 다섯이 쌓였다. 아래부터 초록·빨강·노랑·하양·검정 — 肝·心·脾·肺·腎 다섯 臟의 색이다. 錢乙은 五臟辨證을 세워 처음으로 아이 병에 썼다.","box":[94,634,144,468],"src":["UH-SJ-06-01","BZ-BY-06-M04"],"tts":"아기 곁에 블록 다섯이 쌓였다. 아래부터 초록, 빨강, 노랑, 하양, 검정, 간, 심, 비, 폐, 신 다섯 장의 색이다. 전을은 오장변증을 세워 처음으로 아이 병에 썼다."},{"n":6,"obj":"담요를 두르고 구명 튜브를 든 허수아비","fact":"許叔微(宋) 『普濟本事方』 · 『傷寒百證歌』·『傷寒發微論』·『傷寒九十論』","hook":"허수아비 = 許叔微 · 구명 튜브(널리 건짐) = 普濟 · 담요 = 傷寒","say":"소나무 사이 허수아비 — 許叔微다. 손에 든 구명 튜브는 널리(普) 건진다(濟), 『普濟本事方』이다. 어깨의 담요는 傷寒 — 『傷寒百證歌』·『傷寒發微論』·『傷寒九十論』 세 권도 그의 책이다.","box":[1585,339,425,382],"src":["UHG-046"],"tts":"소나무 사이 허수아비, 허숙미다. 손에 든 구명 튜브는 널리 보 건진다 제, 보제본사방이다. 어깨의 담요는 상한, 상한백증가, 상한발미론, 상한구십론 세 권도 그의 책이다."},{"n":7,"obj":"낡은 세발 걸상 위의 가면 · 회오리 · 벌","fact":"陳無擇 三因 — 內因 七情 · 外因 六淫 · 不內外因 『三因極一病證方論』","hook":"낡은(陳) 세발 걸상 = 三因 · 웃고 우는 가면 = 七情(안) · 회오리 = 六淫(밖) · 벌 = 不內外因","say":"앞 오른쪽, 낡은(陳) 세발 걸상 — 陳無擇(陳言)의 三因이다. 웃고 우는 가면은 마음 안의 七情, 內因. 회오리는 바깥 날씨 六淫, 外因. 벌은 안도 밖도 아닌 不內外因 — 벌레·짐승에 물림, 칼 다침, 음식·피로 같은 것이다. 책은 『三因極一病證方論』.","box":[1578,749,404,389],"src":["UH-SJ-03-01","UH-SJ-03-02","UH-SJ-03-03","BIN-SA-04-01","BIN-SA-04-02","BIN-SA-04-03"],"tts":"앞 오른쪽, 낡은 진 세발 걸상, 진무택 진언의 삼인이다. 웃고 우는 가면은 마음 안의 칠정, 내인. 회오리는 바깥 날씨 육음, 외인. 벌은 안도 밖도 아닌 불내외인, 벌레, 짐승에 물림, 칼 다침, 음식, 피로 같은 것이다. 책은 삼인극일병증방론."},{"n":8,"kind":"review","obj":"금메달 둘 — 계산대 · 아기","fact":"宋의 「최초」 둘 — 국정 成藥典 和劑局方 · 兒科서 小兒藥證直訣","hook":"금메달 = 최초 · 국가 方書 셋 = 비둘기·약국·후광 책 탑","say":"금메달을 다시 보자. 계산대의 메달은 최초의 국정 成藥典 『和劑局方』, 아기의 메달은 최초의 兒科서 『小兒藥證直訣』이다. 하늘의 비둘기, 약국, 후광 책 탑 — 宋의 국가 方書 셋도 한 번 더.","box":[[973,771,101,159],[365,905,90,115]],"src":[],"tts":"금메달을 다시 보자. 계산대의 메달은 최초의 국정 성약전 화제국방, 아기의 메달은 최초의 아과서 소아약증직결이다. 하늘의 비둘기, 약국, 후광 책 탑, 송의 국가 방서 셋도 한 번 더."}],"has_image":true},{"id":"hist-05","title":"本草書 계보 — 宋 국가 본초에서 淸 拾遺까지","place":"약초 계단밭 — 本草(풀·뿌리) · 아래→위 = 시대 순서","image":"images/lessons/hist-05.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"세 층 약초 계단밭","fact":"本草書 계보 — 아래 宋 · 가운데 金·元 · 위 明·淸, 층마다 왼→오른쪽 차례","hook":"약초(本草) 계단밭 · 아래에서 위로 = 시대 순서","say":"本草, 풀과 뿌리의 책들이 이어지는 약초 계단밭이다. 맨 아랫단이 宋, 가운데 단이 金·元, 맨 윗단이 明·淸이고 단마다 왼쪽에서 오른쪽으로 차례다. 시험은 이 순서를 묻는다.","box":null,"src":[],"tts":"본초, 풀과 뿌리의 책들이 이어지는 약초 계단밭이다. 맨 아랫단이 송, 가운데 단이 금, 원, 맨 윗단이 명, 청이고 단마다 왼쪽에서 오른쪽으로 차례다. 시험은 이 순서를 묻는다."},{"n":1,"obj":"약초가 넘치는 열린 보물 상자","fact":"『開寶本草』(宋) — 宋 국가 본초 편찬의 첫째","hook":"열린(開) 보물(寶) 상자 = 開寶","say":"아랫단 맨 왼쪽, 약초가 넘치는 보물 상자가 열렸다. 열 開, 보배 寶 — 『開寶本草』, 宋이 엮은 본초의 첫째다.","box":[43,858,310,267],"src":["UHG-028"],"tts":"아랫단 맨 왼쪽, 약초가 넘치는 보물 상자가 열렸다. 열 개, 보배 보, 개보본초, 송이 엮은 본초의 첫째다."},{"n":2,"obj":"펼친 책에서 쪽지를 오려 내는 큰 가위 · 날리는 쪽지","fact":"『嘉祐補註本草』(宋) — 둘째, 앞 책에 주를 보탰다(補註)","hook":"가위(가우 소리) · 책에 덧붙는 쪽지 = 補註","say":"큰 가위가 책 위에서 쪽지를 오린다. 「가우」 소리의 가위, 쪽지(註)를 덧붙인(補) 『嘉祐補註本草』 — 宋의 둘째 본초다.","box":[425,836,454,295],"src":["UHG-028"],"tts":"큰 가위가 책 위에서 쪽지를 오린다. 가우 소리의 가위, 쪽지 주를 덧붙인 보 가우보주본초, 송의 둘째 본초다."},{"n":3,"obj":"돋보기로 들여다보며 막대사탕을 쥔 노인","fact":"唐愼微(★宋) 『經史證類備急本草』 — 셋째, 이름의 唐에 속지 말 것","hook":"작은(微) 것까지 삼가(愼) 살피는 돋보기 = 愼微 · 사탕(糖) = 이름의 唐 함정","say":"노인이 돋보기로 작은(微) 것까지 삼가(愼) 들여다본다 — 唐愼微다. 손의 막대사탕은 唐(糖)이지만 함정, 이 사람은 宋代다. 『經史證類備急本草』, 줄여 證類本草가 셋째 책이다.","box":[937,843,267,274],"src":["UHG-028","UHG-029","UHG-027"],"tts":"노인이 돋보기로 작은 미 것까지 삼가 신 들여다본다, 당신미다. 손의 막대사탕은 당이지만 함정, 이 사람은 송대다. 경사증류비급본초, 줄여 증류본초가 셋째 책이다."},{"n":4,"obj":"큰 망원경을 렌치로 고치는 사람","fact":"『政和本草』(宋 1116) — 넷째, 『大觀本草』를 고쳐 엮었다","hook":"크게 보는(大觀) 망원경을 고침 = 大觀本草 교정 → 政和本草","say":"큰 망원경을 렌치로 고친다. 크게 본다(大觀) — 『大觀本草』를 바로잡아 1116년에 낸 『政和本草』, 宋의 넷째다. 開寶 → 嘉祐 → 證類 → 政和.","box":[1268,836,404,281],"src":["UHG-028"],"tts":"큰 망원경을 렌치로 고친다. 크게 본다 대관, 대관본초를 바로잡아 1116년에 낸 정화본초, 송의 넷째다. 개보, 가우, 증류, 정화."},{"n":5,"obj":"보따리 메고 오두막으로 걸어 돌아가는 약초","fact":"寇宗奭(宋) 『本草衍義』 — 藥物歸經 이론이 처음 나왔다","hook":"집으로 돌아가는(歸) 약초 = 歸經","say":"아랫단 끝, 다리 달린 약초가 보따리를 메고 집으로 돌아간다. 돌아갈 歸 — 약이 제 경락으로 돌아가는 歸經이다. 이 생각이 처음 나온 책이 寇宗奭의 『本草衍義』다.","box":[1657,843,390,288],"src":["UHG-061"],"tts":"아랫단 끝, 다리 달린 약초가 보따리를 메고 집으로 돌아간다. 돌아갈 귀, 약이 제 경락으로 돌아가는 귀경이다. 이 생각이 처음 나온 책이 구종석의 본초연의다."},{"n":6,"obj":"깃발을 들고 약초 행렬을 문으로 보내는 길잡이","fact":"張元素(潔古, 金) — 易水學派 시조 · 引經報使 창안","hook":"약초를 정해진 문으로 이끌어 보내는(引·報) 길잡이 = 引經報使","say":"가운데 단으로 올라가자. 깃발 든 길잡이가 약초 행렬을 정해진 문으로 들여보낸다. 약을 특정 장부·경락으로 데려가는 引經報使, 金의 張元素(潔古)가 만들었다. 易水學派의 시조다.","box":[180,512,908,295],"src":["UHG-038","BC-IN-01","UHG-061"],"tts":"가운데 단으로 올라가자. 깃발 든 길잡이가 약초 행렬을 정해진 문으로 들여보낸다. 약을 특정 장부, 경락으로 데려가는 인경보사, 금의 장원소 결고가 만들었다. 역수학파의 시조다."},{"n":7,"obj":"흰 진주가 쏟아지는 비단 주머니","fact":"張元素 『珍珠囊』 — 性味·升降浮沈·歸經·主治를 적어 후대 본초의 토대","hook":"진주(珍珠) 주머니(囊)","say":"비단 주머니에서 진주가 쏟아진다, 『珍珠囊』이다. 張元素는 여기에 약마다 性味·升降浮沈·歸經·主治를 적었다 — 뒤의 본초학이 이 위에 섰다.","box":[1160,627,281,173],"src":["BC-SA-05","UHG-038"],"tts":"비단 주머니에서 진주가 쏟아진다, 진주낭이다. 장원소는 여기에 약마다 성미, 승강부침, 귀경, 주치를 적었다, 뒤의 본초학이 이 위에 섰다."},{"n":8,"obj":"김 나는 푸른 녹 슨 옛 청동 국솥을 껴안은 거인","fact":"王好古(元) 『湯液本草』 — 內感陰證 연구 · 李東垣의 제자","hook":"거인(王)이 아끼는(好) 옛(古) 국솥(湯液)","say":"거인이 오래된 국솥을 아끼며 껴안았다. 큰(王) 사람이 옛것(古)을 좋아해(好) — 王好古, 국솥은 湯液이다. 元의 王好古는 『湯液本草』를 짓고 속으로 든 차가운 병, 內感陰證을 연구했다. 李東垣의 제자다.","box":[1477,411,494,389],"src":["UHG-055"],"tts":"거인이 오래된 국솥을 아끼며 껴안았다. 큰 왕 사람이 옛것 고를 좋아해 호, 왕호고, 국솥은 탕액이다. 원의 왕호고는 탕액본초를 짓고 속으로 든 차가운 병, 내감음증을 연구했다. 이동원의 제자다."},{"n":9,"obj":"자두나무 · 나무에 걸린 회중시계 · 칸마다 약초 하나씩 담은 벽 같은 그물","fact":"李時珍(明) 『本草綱目』 — 綱目 체계로 16세기 이전 약물학을 총괄","hook":"자두(李) · 시계(時) · 벼리(綱)와 그물코(目)","say":"윗단, 자두(李)나무에 회중시계(時)가 걸렸다 — 李時珍이다. 나무에 건 그물은 굵은 벼리(綱) 아래 그물코(目)마다 약초를 하나씩 담았다. 綱目 체계로 16세기까지의 약물학을 모두 정리한 明의 『本草綱目』이다.","box":[86,0,865,512],"src":["UH-MQ-01","BC-SA-05","UHG-027"],"tts":"윗단, 자두 이나무에 회중시계 시가 걸렸다, 이시진이다. 나무에 건 그물은 굵은 벼리 강 아래 그물코 목마다 약초를 하나씩 담았다. 강목 체계로 16세기까지의 약물학을 모두 정리한 명의 본초강목이다."},{"n":10,"obj":"그물에서 빠진 약초를 조 이삭 바구니에 주워 담는 여자","fact":"趙學敏(淸) 『本草綱目拾遺』 — 綱目이 빠뜨린 716종을 주워 담았다","hook":"조(趙) 이삭 바구니 · 빠진 것을 주움 = 拾遺","say":"그물에서 빠진 약초를 여자가 주워 담는다. 바구니에 꽂은 조 이삭 — 趙學敏이다. 『本草綱目』이 빠뜨린 716종을 주워(拾) 모은 淸의 『本草綱目拾遺』. 唐 陳藏器의 『本草拾遺』와 헷갈리는 함정이다.","box":[829,137,295,303],"src":["UHG-054","UHG-027"],"tts":"그물에서 빠진 약초를 여자가 주워 담는다. 바구니에 꽂은 조 이삭, 조학민이다. 본초강목이 빠뜨린 716종을 주워 습 모은 청의 본초강목습유. 당 진장기의 본초습유와 헷갈리는 함정이다."},{"n":11,"obj":"물길마다 바구니에 약초를 나눠 담는 사람 · 여덟 줄 두루마리","fact":"姚瀾(淸) 『本草分經』 — 歸經 약물을 경락별로 나눔 · 李時珍 『奇經八脈考』","hook":"물길(經)마다 나눈(分) 바구니 = 本草分經 · 물결(瀾) = 姚瀾 · 여덟 줄 = 奇經八脈","say":"윗단 오른쪽, 갈래 물길마다 바구니를 두고 약초를 나눠 담는다. 약을 경락(經)별로 나눈(分) 淸 姚瀾의 『本草分經』이다. 곁의 여덟 줄 두루마리는 奇經八脈 — 明의 李時珍이 『奇經八脈考』로 정리했다. 吳謙과 姚瀾은 淸 사람이다.","box":[1117,94,925,389],"src":["HUBGR-0079","HUBGR-0095","HUBGR-0102","HUBGR-0076","HUBGR-0092"],"tts":"윗단 오른쪽, 갈래 물길마다 바구니를 두고 약초를 나눠 담는다. 약을 경락 경별로 나눈 분 청 요란의 본초분경이다. 곁의 여덟 줄 두루마리는 기경팔맥, 명의 이시진이 기경팔맥고로 정리했다. 오겸과 요란은 청 사람이다."},{"n":12,"kind":"review","obj":"함정 둘 — 막대사탕 · 줍는 여자","fact":"宋 넷: 開寶→嘉祐→證類→政和 · 唐愼微는 宋 · 拾遺는 唐(陳藏器)과 淸(趙學敏) 둘","hook":"계단 셋 = 宋 / 金·元 / 明·淸","say":"다시 아랫단을 왼쪽부터 — 보물 상자, 가위, 사탕, 망원경: 開寶 → 嘉祐 → 證類 → 政和. 사탕을 쥐었어도 唐愼微는 宋 사람이다. 拾遺는 둘 — 唐 陳藏器의 『本草拾遺』와 맨 윗단 淸 趙學敏의 『本草綱目拾遺』.","box":[[937,843,267,274],[829,137,295,303]],"src":[],"tts":"다시 아랫단을 왼쪽부터, 보물 상자, 가위, 사탕, 망원경: 개보, 가우, 증류, 정화. 사탕을 쥐었어도 당신미는 송 사람이다. 습유는 둘, 당 진장기의 본초습유와 맨 윗단 청 조학민의 본초강목습유."}],"has_image":true},{"id":"hist-06","title":"金·元 — 金元四大家와 그 곁(成無己·杜本)","place":"금광(金鑛) 마을과 고개 너머 원(元)두막","image":"images/lessons/hist-06.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"금광 마을과 고개 너머 원두막","fact":"金·元 — 金元四大家(劉·張·李는 金, 朱만 元)와 成無己·杜本","hook":"금광(金) 마을 = 金 · 고개 너머 원(元)두막 = 元","say":"왼쪽은 금광 마을, 金이다. 갱도 앞과 흙담 곁의 세 사람이 金元四大家 가운데 金의 劉·張·李다. 고개 너머 원두막 쪽은 元 — 朱震亨과 杜本이 있다. 금메달은 교재가 「최초」라고 한 책이다.","box":null,"src":[],"tts":"왼쪽은 금광 마을, 금이다. 갱도 앞과 흙담 곁의 세 사람이 금원사대가 가운데 금의 유, 장, 이다. 고개 너머 원두막 쪽은 원, 주진형과 두본이 있다. 금메달은 교재가 최초라고 한 책이다."},{"n":1,"obj":"무기 걸이 있는 성문 · 쪽지가 잔뜩 붙은 담요 환자 · 성문의 금메달","fact":"成無己(★金) 『註解傷寒論』 — 傷寒論 최초의 전면 주해 · 『傷寒明理論』","hook":"성(城)의 무기(武器) = 成無己 · 담요 환자(傷寒)에 붙은 쪽지(註解) · 금메달 = 최초","say":"맨 왼쪽, 창과 칼을 건 성문 — 성(城)의 무기, 成無己다. 담요를 쓴 傷寒 환자에게 쪽지가 잔뜩 붙었다. 『傷寒論』에 처음으로 빠짐없이 주를 단 『註解傷寒論』, 그래서 금메달이다. 『傷寒明理論』도 그의 책. 宋이 아니라 金 사람이다.","box":[0,533,497,584],"src":["UH-SJ-01","UHG-045"],"tts":"맨 왼쪽, 창과 칼을 건 성문, 성의 무기, 성무기다. 담요를 쓴 상한 환자에게 쪽지가 잔뜩 붙었다. 상한론에 처음으로 빠짐없이 주를 단 주해상한론, 그래서 금메달이다. 상한명리론도 그의 책. 송이 아니라 금 사람이다."},{"n":2,"obj":"불붙은 날씨 표지 여섯 · 얼음 조각 섞인 우유를 끼얹는 사람","fact":"劉完素(守眞, 金) 寒凉派·主火 — 六氣皆從火化","hook":"우유(유) = 劉 · 찬 것으로 끔 = 寒凉 · 불붙은 날씨 여섯 = 六氣皆從火化","say":"첫째 갱도 앞, 바람·눈·해·물방울·마른 잎·불꽃 — 여섯 날씨 표지가 모두 불탄다. 여섯 기운이 다 불로 변한다, 六氣皆從火化. 한 사람이 얼음 조각 섞인 우유를 끼얹는다 — 우유의 「유」, 劉完素(守眞)다. 찬 약으로 불을 끄는 寒凉派, 主火派다.","box":[396,476,360,252],"src":["UH-4G-01","UH-4G-02","UHG-021"],"tts":"첫째 갱도 앞, 바람, 눈, 해, 물방울, 마른 잎, 불꽃, 여섯 날씨 표지가 모두 불탄다. 여섯 기운이 다 불로 변한다, 육기개종화화. 한 사람이 얼음 조각 섞인 우유를 끼얹는다, 우유의 유, 유완소 수진다. 찬 약으로 불을 끄는 한량파, 주화파다."},{"n":3,"obj":"불붙은 감정 가면 다섯","fact":"劉完素 — 五志過極皆爲熱甚 · 『素問玄機原病式』·『宣明論方』","hook":"불붙은 가면 다섯 = 다섯 감정이 지나치면 모두 열이 됨","say":"그 앞에 감정 가면 다섯이 불탄다. 다섯 감정이 지나치면 모두 열이 된다 — 五志過極皆爲熱甚. 劉完素의 책은 『素問玄機原病式』과 『宣明論方』, 運氣學說과 病機十九條에 기댔다.","box":[483,721,303,158],"src":["UH-4G-02","UHG-021"],"tts":"그 앞에 감정 가면 다섯이 불탄다. 다섯 감정이 지나치면 모두 열이 된다, 오지과극개위열심. 유완소의 책은 소문현기원병식과 선명론방, 운기학설과 병기십구조에 기댔다."},{"n":4,"obj":"종을 치는 장정 · 갱도에서 쫓겨 구르는 검은 덩이들","fact":"張從正(子和, 金) 攻下派 — 汗·吐·下로 邪를 몰아냄, 邪去則正安","hook":"종(從) 치는 장정(張·正) = 張從正 · 쫓겨나는 검은 덩이 = 邪","say":"둘째 갱도, 장정이 종을 친다 — 종 치는 장정, 張從正(子和)이다. 검은 덩이들이 갱도 밖으로 쫓겨나 굴러간다. 땀내고(汗) 토하고(吐) 설사시켜(下) 邪를 몰아내는 攻下派, 「邪가 나가면 正이 편안하다」 — 邪去則正安.","box":[800,346,339,295],"src":["UH-4G-01","UH-4G-03","UHG-022"],"tts":"둘째 갱도, 장정이 종을 친다, 종 치는 장정, 장종정 자화이다. 검은 덩이들이 갱도 밖으로 쫓겨나 굴러간다. 땀내고 한 토하고 토 설사시켜 하 사를 몰아내는 공하파, 사가 나가면 정이 편안하다, 사거즉정안."},{"n":5,"obj":"작은 문 앞에서 늙은 어머니를 모시고 절하는 젊은 선비","fact":"張從正 『儒門事親』 — 선비 집안(儒門)이 부모를 섬기는(事親) 책","hook":"선비 집(儒門)에서 부모를 섬김(事親)","say":"그 아래 작은 문 앞, 젊은 선비가 늙은 어머니를 모시고 공손히 절한다. 선비 집안(儒門)이 어버이를 섬기는(事親) 법 — 張從正의 『儒門事親』이다.","box":[814,692,382,404],"src":["UH-4G-03","UHG-022"],"tts":"그 아래 작은 문 앞, 젊은 선비가 늙은 어머니를 모시고 공손히 절한다. 선비 집안 유문이 어버이를 섬기는 사친 법, 장종정의 유문사친이다."},{"n":6,"obj":"자두를 문 채 흙을 퍼 구덩이를 메우는 사람","fact":"李杲(東垣, 金) 補土派 — 內傷脾胃 百病由生 · 補中益氣湯 · 스승 張元素","hook":"자두(李) = 李杲 · 담장(垣) = 東垣 · 흙(土)을 채움(補) = 補土派","say":"갱도에서 내려온 흙담 곁, 자두(李)를 문 사람이 구덩이를 누런 흙으로 메운다. 담(垣) 곁의 李杲, 호가 東垣이다. 흙(土)을 채우는(補) 補土派 — 脾胃가 상하면 온갖 병이 생긴다(內傷脾胃 百病由生). 甘溫으로 열을 다스리는 補中益氣湯을 만들었고, 스승은 張元素다.","box":[1160,605,331,317],"src":["UH-4G-01","UH-4G-04","UHG-023","BJ-SA-05"],"tts":"갱도에서 내려온 흙담 곁, 자두 이를 문 사람이 구덩이를 누런 흙으로 메운다. 담 원 곁의 이고, 호가 동원이다. 흙 토를 채우는 보 보토파, 비위가 상하면 온갖 병이 생긴다, 내상비위 백병유생. 감온으로 열을 다스리는 보중익기탕을 만들었고, 스승은 장원소다."},{"n":7,"obj":"담장 위로 곧게 솟는 초록 새싹","fact":"李杲 『脾胃論』·『內外傷辨惑論』 — 膽者少陽春升之氣","hook":"담(膽) 위로 솟는 봄 싹 = 少陽 春升之氣","say":"담장 위로 초록 새싹이 곧게 솟는다. 담(膽)은 少陽, 봄에 솟아오르는 기운 — 「膽者少陽春升之氣」, 李杲가 『脾胃論』에 쓴 말이다. 그의 책은 『脾胃論』과 『內外傷辨惑論』.","box":[1232,259,144,317],"src":["UH-4G-04","UHG-023","UHG-025"],"tts":"담장 위로 초록 새싹이 곧게 솟는다. 담은 소양, 봄에 솟아오르는 기운, 담자소양춘승지기, 이고가 비위론에 쓴 말이다. 그의 책은 비위론과 내외상변혹론."},{"n":8,"obj":"원두막 아래 금 거울에 혀를 내민 사람 · 거울의 금메달","fact":"杜本(元) 『敖氏傷寒金鏡錄』 — 최초의 舌診 전문서(舌象 36종)","hook":"금 거울(金鏡)에 비춘 혀 = 舌診 · 금메달 = 최초 · 책 이름의 傷寒은 함정","say":"고개 너머 원두막, 여기서부터 元이다. 금 거울(金鏡)에 혀를 내밀어 비춰 본다 — 杜本의 『敖氏傷寒金鏡錄』, 혀 모양 36가지를 그린 최초의 舌診 전문서다. 이름에 傷寒이 들었지만 舌診 책이다.","box":[1460,120,300,505],"src":["UH-SJ-04-03"],"tts":"고개 너머 원두막, 여기서부터 원이다. 금 거울 금경에 혀를 내밀어 비춰 본다, 두본의 오씨상한금경록, 혀 모양 36가지를 그린 최초의 설진 전문서다. 이름에 상한이 들었지만 설진 책이다."},{"n":9,"obj":"붉은 시냇가의 거의 빈 달 물통 · 붉은 물이 넘친 해 물통","fact":"朱震亨(丹溪, ★元) 滋陰派 — 陽常有餘 陰常不足 · 相火論","hook":"붉은(朱·丹) 시내(溪) = 朱震亨 丹溪 · 빈 달 물통 채우기 = 滋陰 · 넘치는 해 물통 = 陽常有餘","say":"붉은 시내(丹溪) — 朱震亨, 호가 丹溪다. 해 그림 물통은 넘쳐 둘레가 붉고, 달 그림 물통은 거의 비었다. 陽은 늘 남고 陰은 늘 모자라니(陽常有餘 陰常不足) 陰을 채운다 — 滋陰派. 망령되이 움직이는 相火를 누른다는 相火論도 그의 것. 金元四大家 가운데 혼자 元 사람이다.","box":[1780,548,266,259],"src":["UH-4G-01","UH-4G-05","UHG-024"],"tts":"붉은 시내 단계, 주진형, 호가 단계다. 해 그림 물통은 넘쳐 둘레가 붉고, 달 그림 물통은 거의 비었다. 양은 늘 남고 음은 늘 모자라니, 양상유여 음상부족, 음을 채운다, 자음파. 망령되이 움직이는 상화를 누른다는 상화론도 그의 것. 금원사대가 가운데 혼자 원 사람이다."},{"n":10,"obj":"알약 그림 약상자 더미를 걷어차 무너뜨리는 사람","fact":"朱震亨 『格致餘論』·『局方發揮』 — 『局方』의 기성 처방을 비판","hook":"약상자 더미(局方 = 和劑局方)를 걷어참 = 局方發揮","say":"맨 오른쪽 앞, 똑같은 약상자 더미를 걷어찬다. 宋의 나라 약국 처방집, 『和劑局方』을 비판한 『局方發揮』다. 『格致餘論』도 朱震亨의 책이다.","box":[1722,814,296,310],"src":["UH-4G-05","UHG-024"],"tts":"맨 오른쪽 앞, 똑같은 약상자 더미를 걷어찬다. 송의 나라 약국 처방집, 화제국방을 비판한 국방발휘다. 격치여론도 주진형의 책이다."},{"n":11,"kind":"review","obj":"금메달 둘 — 성문 · 금 거울","fact":"劉·張·李 = 金 · 朱 = 元 / 「최초」 둘 = 傷寒論 전면 주해 · 舌診서","hook":"금광 마을 = 金 · 원두막 = 元","say":"金元四大家를 다시 — 금광 마을의 劉完素 寒凉, 張從正 攻下, 李杲 補土는 金, 원두막 곁 朱震亨 滋陰만 元이다. 금메달 둘은 成無己의 첫 傷寒論 주해와 杜本의 첫 舌診서.","box":[[86,634,125,115],[1650,375,72,115]],"src":[],"tts":"금원사대가를 다시, 금광 마을의 유완소 한량, 장종정 공하, 이고 보토는 금, 원두막 곁 주진형 자음만 원이다. 금메달 둘은 성무기의 첫 상한론 주해와 두본의 첫 설진서."}],"has_image":true},{"id":"hist-07","title":"鍼灸書·혈 수 계보 — 349→354→359→360→361","place":"굴(穴) 마을 비탈길","image":"images/lessons/hist-07.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"굴(穴) 마을 비탈길","fact":"鍼灸書·혈 수 계보 — 굴을 오를수록 혈 수가 늘고 시대가 내려간다(晉→淸)","hook":"굴 = 穴(구멍 혈) · 왼쪽 아래 → 오른쪽 위 오르막 = 시대순","say":"구멍 혈(穴), 굴 마을이다. 왼쪽 아래에서 오른쪽 위로 비탈길이 오르고, 오를수록 혈 수가 는다 — 굴 셋이 349, 354, 359, 금 거울이 360, 꼭대기 굴이 361. 맨 아래가 晉, 꼭대기가 淸. 매달린 금메달 둘은 「최초」다.","box":null,"src":[],"tts":"구멍 혈, 굴 마을이다. 왼쪽 아래에서 오른쪽 위로 비탈길이 오르고, 오를수록 혈 수가 는다, 굴 셋이 349, 354, 359, 금 거울이 360, 꼭대기 굴이 361. 맨 아래가 진, 꼭대기가 청. 매달린 금메달 둘은 최초다."},{"n":1,"obj":"갑옷 입은 새 · 부리에 문 밀 이삭 · 굴 앞 기둥의 금메달","fact":"皇甫謐(晉) 『鍼灸甲乙經』 — 현존 최초의 침구 전문서 · 腧穴名 첫 집대성","hook":"갑옷(甲) 입은 새(乙, 새 을) = 甲乙經 · 밀 = 謐 · 금메달 = 현존 최초","say":"맨 아래 굴 앞, 갑옷을 입은 새가 밀 이삭을 물었다 — 갑옷 갑(甲), 새 을(乙), 『鍼灸甲乙經』이다. 밀은 皇甫謐의 「밀」. 기둥에 매단 금메달은 현존 최초의 침구 전문서. 혈 이름을 처음 모아 머리·얼굴, 배·등으로 나눠 적었다. 마을 맨 아래, 가장 이른 晉 사람이다(진시황의 秦이 아니다).","box":[26,773,410,348],"src":["UH-ST-03","GR-SA-02","HUBGR-0072","HUBGR-0094","HUBGR-0097","HUBGR-0093"],"tts":"맨 아래 굴 앞, 갑옷을 입은 새가 밀 이삭을 물었다, 갑옷 갑, 새 을, 침구갑을경이다. 밀은 황보밀의 밀. 기둥에 매단 금메달은 현존 최초의 침구 전문서. 혈 이름을 처음 모아 머리, 얼굴, 배, 등으로 나눠 적었다. 마을 맨 아래, 가장 이른 진 사람이다, 진시황의 진이 아니다."},{"n":2,"obj":"맨 아래 첫 굴","fact":"『甲乙經』 수혈 349 — 혈 수 계보의 출발","hook":"첫 굴 번지 = 350에서 하나 모자란 349","say":"새가 선 맨 아래 첫 굴이 349번지. 350에서 하나 모자란 수에서 출발해, 굴을 오를 때마다 혈 수가 늘어난다 — 한 번도 줄지 않는다.","box":[56,763,287,266],"src":["HUBGR-0082"],"tts":"새가 선 맨 아래 첫 굴이 349번지. 350에서 하나 모자란 수에서 출발해, 굴을 오를 때마다 혈 수가 늘어난다, 한 번도 줄지 않는다."},{"n":3,"obj":"받침대 위에 홀로 선, 온몸에 점이 박힌 구리 사람","fact":"王惟一(宋) 『銅人腧穴鍼灸圖經』 · 銅人 2具 주조 → 取穴 표준화","hook":"점 박힌 구리 사람 = 銅人 · 받침대 위 왕(王)처럼 오직 하나(惟一) = 王惟一","say":"둘째 굴 앞 받침대에 온몸에 점이 박힌 구리 사람이 왕처럼 오직 하나(惟一) 홀로 섰다 — 王惟一의 銅人이다. 宋 때 銅人 두 구를 부어 혈 자리를 몸에 새기고 『銅人腧穴鍼灸圖經』을 지었다. 銅人 주조는 『黃帝內經』이 아니라 宋의 일이고, 王執中에게 붙이면 틀린다.","box":[346,387,168,414],"src":["UH-SJ-05","GR-SA-04","HUBGR-0073","HUBGR-0089","HUBGR-0081","HUBGR-0099","HUBGR-0110"],"tts":"둘째 굴 앞 받침대에 온몸에 점이 박힌 구리 사람이 왕처럼 오직 하나 유일 홀로 섰다, 왕유일의 동인이다. 송 때 동인 두 구를 부어 혈 자리를 몸에 새기고 동인수혈침구도경을 지었다. 동인 주조는 황제내경이 아니라 송의 일이고, 왕집중에게 붙이면 틀린다."},{"n":4,"obj":"銅人 뒤 둘째 굴","fact":"『銅人經』 수혈 354 (349 + 5)","hook":"한 굴 오르면 다섯 늘어 354","say":"銅人 뒤 둘째 굴이 354번지. 첫 굴 349에서 다섯 늘었다.","box":[162,524,236,211],"src":["HUBGR-0083"],"tts":"동인 뒤 둘째 굴이 354번지. 첫 굴 349에서 다섯 늘었다."},{"n":5,"obj":"곧은 자를 세운 제 엄지에 대고 재는 큰 사람","fact":"王執中(南宋) 『鍼灸資生經』 — 同身寸 取穴의 표준","hook":"제 몸(同身)의 치수(寸)로 잼 = 同身寸 · 쥔 「자」 = 資生經 · 꽉 잡음(執) = 王執中","say":"셋째 굴 앞의 큰 사람이 곧은 자를 꽉 잡고 세운 제 엄지에 대어 잰다. 남의 자가 아니라 제 몸의 치수로 혈을 잡는 同身寸 — 잡을 집(執), 王執中이 표준으로 세웠다. 「자」를 쥐었으니 『鍼灸資生經』. 王惟一과 같은 宋, 그중 南宋 사람이다.","box":[729,510,205,322],"src":["GR-SA-05","HUBGR-0074","HUBGR-0090"],"tts":"셋째 굴 앞의 큰 사람이 곧은 자를 꽉 잡고 세운 제 엄지에 대어 잰다. 남의 자가 아니라 제 몸의 치수로 혈을 잡는 동신촌, 잡을 집, 왕집중이 표준으로 세웠다. 자를 쥐었으니 침구자생경. 왕유일과 같은 송, 그중 남송 사람이다."},{"n":6,"obj":"자 든 사람 뒤 셋째 굴","fact":"『資生經』 수혈 359 (354 + 5)","hook":"또 다섯 늘어 359","say":"자 든 사람 뒤 셋째 굴이 359번지 — 또 다섯 늘었다. 뒤에 나올 楊繼洲의 『鍼灸大成』도 같은 359다.","box":[643,473,219,215],"src":["HUBGR-0084"],"tts":"자 든 사람 뒤 셋째 굴이 359번지, 또 다섯 늘었다. 뒤에 나올 양계주의 침구대성도 같은 359다."},{"n":7,"obj":"한가운데 긴 침이 꽂힌 큰 나침반 · 두루마리를 노래하는 사람","fact":"竇默(漢卿, 元) 『鍼經指南』 — 標幽賦·通玄指要賦 수록","hook":"침(鍼)이 가리키는 남쪽(指南) = 鍼經指南 · 말없이(默) 가리킴 = 竇默 · 노래 = 賦","say":"길 앞 땅바닥의 큰 나침반 한가운데 긴 침이 꽂혔다 — 침의 길을 가리키는 『鍼經指南』. 방향만 말없이 가리키니 잠잠할 묵(默), 竇默, 곧 竇漢卿이다. 곁의 사람이 두루마리를 노래하듯 읽는다 — 침구 초학 필독인 노래체 「標幽賦」·「通玄指要賦」가 이 책에 실렸다. 元 사람.","box":[848,754,532,340],"src":["UHG-058","GRG2-026"],"tts":"길 앞 땅바닥의 큰 나침반 한가운데 긴 침이 꽂혔다, 침의 길을 가리키는 침경지남. 방향만 말없이 가리키니 잠잠할 묵, 두묵, 곧 두한경이다. 곁의 사람이 두루마리를 노래하듯 읽는다, 침구 초학 필독인 노래체 표유부, 통현지요부가 이 책에 실렸다. 원 사람."},{"n":8,"obj":"무지개색 미끄럼틀을 타는 흰 수염 노인 · 미끄럼틀 꼭대기의 금메달","fact":"滑壽(伯仁, 元) 『十四經發揮』 = 12正經 + 任·督 · 최초 天然色 經絡圖譜","hook":"미끄럼(滑) 타는 장수(壽) 노인 = 滑壽 · 무지개색 = 天然色 經絡圖 · 금메달 = 최초","say":"언덕 위 무지개색 미끄럼틀을 흰 수염 노인이 신나게 내려온다 — 미끄러질 활(滑), 목숨 수(壽), 滑壽, 자는 伯仁이다. 十二正經에 任脈·督脈 둘을 더해 十四經을 세운 『十四經發揮』. 꼭대기 금메달은 중국 최초의 天然色 經絡圖譜(기출 기준). 元 사람이다. 孫思邈이 『千金方』에서 경맥에 색을 칠한 것과는 별개.","box":[893,213,379,475],"src":["GR-SA-06","HUBGR-0075","HUBGR-0088","HUBGR-0091","HUBGR-0100"],"tts":"언덕 위 무지개색 미끄럼틀을 흰 수염 노인이 신나게 내려온다, 미끄러질 활, 목숨 수, 활수, 자는 백인이다. 십이정경에 임맥, 독맥 둘을 더해 십사경을 세운 십사경발휘. 꼭대기 금메달은 중국 최초의 천연색 경락도보, 기출 기준. 원 사람이다. 손사막이 천금방에서 경맥에 색을 칠한 것과는 별개."},{"n":9,"obj":"서랍 많은 약장 위에 앉은 봉황","fact":"徐鳳(明) 『鍼灸大全』(1439) — 歌賦體 · 『鍼灸大成』보다 앞섬","hook":"서랍(徐) + 봉황(鳳) = 徐鳳 · 서랍 칸 전부(全) = 大全","say":"미끄럼틀 오른쪽, 서랍 많은 약장 위에 봉황이 앉았다 — 서랍의 「서」가 徐, 봉황이 鳳 — 徐鳳이다. 서랍 칸을 전부 채웠으니 온전할 전(全), 『鍼灸大全』, 1439년 明. 노래체(歌賦)로 엮었고 楊繼洲의 『鍼灸大成』보다 160여 년 앞선다.","box":[1210,319,283,283],"src":["UHG-044"],"tts":"미끄럼틀 오른쪽, 서랍 많은 약장 위에 봉황이 앉았다, 서랍의 서가 서, 봉황이 봉, 서봉이다. 서랍 칸을 전부 채웠으니 온전할 전, 침구대전, 1439년 명. 노래체 가부로 엮었고 양계주의 침구대성보다 160여 년 앞선다."},{"n":10,"obj":"연못 섬에 크게 자란 버드나무 · 밑동에 부채꼴로 꽂힌 침","fact":"楊繼洲(明) 『鍼灸大成』(1601) — 명대 침구 집대성 · 수혈 359","hook":"버드나무(楊) + 섬(洲) = 楊繼洲 · 크게(大) 자라 이룬(成) 나무 = 大成","say":"연못 가운데 작은 섬에 버드나무가 크게 자랐다 — 버들 양(楊), 섬 주(洲), 楊繼洲. 밑동에 은빛 침이 부채꼴로 꽂혔다. 明代 침구를 크게 모아 이룬 『鍼灸大成』(1601), 혈 수는 셋째 굴과 같은 359. 약장 위 봉황의 『大全』과 헷갈리지 말 것 — 全은 徐鳳, 成은 楊繼洲. 李時珍과 같은 明 사람이다.","box":[1623,336,389,389],"src":["UHG-043","HUBGR-0077","HUBGR-0086","HUBGR-0101"],"tts":"연못 가운데 작은 섬에 버드나무가 크게 자랐다, 버들 양, 섬 주, 양계주. 밑동에 은빛 침이 부채꼴로 꽂혔다. 명대 침구를 크게 모아 이룬 침구대성, 1601, 혈 수는 셋째 굴과 같은 359. 약장 위 봉황의 대전과 헷갈리지 말 것, 전은 서봉, 성은 양계주. 이시진과 같은 명 사람이다."},{"n":11,"obj":"두 손 모아 공손히 절하는 사람 · 곁에 세운 둥근 금 거울","fact":"吳謙(淸) 『醫宗金鑑』(칙찬) — 수혈 360","hook":"겸손(謙)히 절함 = 吳謙 · 금 거울(金鑑) = 醫宗金鑑 · 꽉 찬 원 한 바퀴 = 360","say":"꼭대기 가까이, 한 사람이 두 손 모아 공손히 절한다 — 겸손할 겸(謙), 吳謙이다. 곁에 둥근 금 거울이 섰다 — 쇠 금(金), 거울 감(鑑), 황제 명으로 엮은 『醫宗金鑑』, 淸. 거울은 꽉 찬 원, 한 바퀴 360도 — 혈 수 360. 361이 아니다.","box":[1408,80,196,246],"src":["GR-SA-07","HUBGR-0085","UHG-060"],"tts":"꼭대기 가까이, 한 사람이 두 손 모아 공손히 절한다, 겸손할 겸, 오겸이다. 곁에 둥근 금 거울이 섰다, 쇠 금, 거울 감, 황제 명으로 엮은 의종금감, 청. 거울은 꽉 찬 원, 한 바퀴 360도, 혈 수 360. 361이 아니다."},{"n":12,"obj":"꼭대기 굴 · 자두나무 곁 바위틈에서 솟아 흘러내리는 시내","fact":"李學川(淸) 『針灸逢源』 — 현행 361혈 확정 (360 + 1)","hook":"자두(李) · 시내(川)의 근원(源) = 李學川 『針灸逢源』 · 한 바퀴 360에 하나 더 = 361","say":"맨 위 오른쪽, 자두나무 곁 바위틈에서 물이 솟아 시내가 흘러내린다 — 자두 이(李), 내 천(川), 그리고 근원 원(源). 시내의 근원을 만나는 곳, 李學川의 『針灸逢源』. 곁의 가장 높은 굴이 361번지 — 거울의 한 바퀴 360에 하나 더. 지금 쓰는 361혈이 여기서 정해졌다. 吳謙은 360, 李學川이 361이다.","box":[1636,0,412,307],"src":["HUBGR-0078"],"tts":"맨 위 오른쪽, 자두나무 곁 바위틈에서 물이 솟아 시내가 흘러내린다, 자두 이, 내 천, 그리고 근원 원. 시내의 근원을 만나는 곳, 이학천의 침구봉원. 곁의 가장 높은 굴이 361번지, 거울의 한 바퀴 360에 하나 더. 지금 쓰는 361혈이 여기서 정해졌다. 오겸은 360, 이학천이 361이다."},{"n":13,"kind":"review","obj":"오르막 번지 — 굴 셋 · 금 거울 · 꼭대기 굴","fact":"349 → 354 → 359 → 360 → 361 (다섯·다섯·하나·하나) · 晉→宋→元→明→淸","hook":"아래에서 위로 = 시대순 · 혈 수는 늘기만 한다","say":"아래부터 다시 오른다. 새의 첫 굴 349(晉 皇甫謐), 銅人 굴 354(宋 王惟一), 자 든 사람 굴 359(宋 王執中 — 明 楊繼洲도 359), 금 거울 360(淸 吳謙), 꼭대기 굴 361(淸 李學川). 다섯, 다섯, 하나, 하나 — 늘기만 한다. 사람 순서는 皇甫謐 → 孫思邈 → 王惟一 → 滑壽 → 楊繼洲 → 吳謙, 晉 → 唐 → 宋 → 元 → 明 → 淸.","box":[[56,763,287,266],[162,524,236,211],[643,473,219,215],[1500,80,104,246],[1638,97,169,164]],"src":["UHG-068","GRG2-025","HUBGR-0087","HUBGR-0103"],"tts":"아래부터 다시 오른다. 새의 첫 굴 349, 진 황보밀, 동인 굴 354, 송 왕유일, 자 든 사람 굴 359, 송 왕집중, 명 양계주도 359, 금 거울 360, 청 오겸, 꼭대기 굴 361, 청 이학천. 다섯, 다섯, 하나, 하나, 늘기만 한다. 사람 순서는 황보밀, 손사막, 왕유일, 활수, 양계주, 오겸, 진, 당, 송, 원, 명, 청."}],"has_image":true},{"id":"hist-08","title":"溫補學派 — 命門의 불을 지피는 사람들(+반박자 徐大椿)","place":"온돌방 아궁이","image":"images/lessons/hist-08.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"온돌방과 아궁이 · 문밖 툇마루","fact":"溫補學派(明)의 온돌방 · 문밖에 반박자 徐大椿(淸)","hook":"따뜻하게(溫) 채움(補) = 아궁이로 구들을 데움 · 등불 밝은(明) 방 안 · 맑은(淸) 하늘 아래 문밖","say":"불 때는 온돌방이다. 아궁이 불이 구들 밑을 데우듯, 몸 깊은 곳 命門의 불을 지펴 따뜻하게 채우는 것이 溫補. 방 안은 등불이 밝다 — 밝을 명(明), 明의 溫補學派. 문밖은 하늘이 맑다 — 맑을 청(淸), 거기서 얼굴을 찌푸린 사람이 그들을 반박한 淸의 徐大椿이다.","box":null,"src":[],"tts":"불 때는 온돌방이다. 아궁이 불이 구들 밑을 데우듯, 몸 깊은 곳 명문의 불을 지펴 따뜻하게 채우는 것이 온보. 방 안은 등불이 밝다, 밝을 명, 명의 온보학파. 문밖은 하늘이 맑다, 맑을 청, 거기서 얼굴을 찌푸린 사람이 그들을 반박한 청의 서대춘이다."},{"n":1,"obj":"아궁이에서 구들 밑으로 흐르는 뜨거운 열기","fact":"溫補學派 = 薛己·張介賓·趙獻可(교재) + 孫一奎·李中梓(통설) — 腎陽 補益","hook":"구들을 데우는 아궁이 열기 = 命門火를 덥혀 채움(溫補)","say":"아궁이의 열기가 구들 밑으로 흘러 방을 데운다 — 腎陽, 곧 命門의 불을 따뜻하게 채우는 溫補學派. 교재가 꼽는 셋은 薛己·張介賓·趙獻可, 통설로 孫一奎·李中梓를 더한다. 이 열기로 데운 방 안 사람들이 溫補派다.","box":[338,896,927,133],"src":["UH-MQ-07-01"],"tts":"아궁이의 열기가 구들 밑으로 흘러 방을 데운다, 신양, 곧 명문의 불을 따뜻하게 채우는 온보학파. 교재가 꼽는 셋은 설기, 장개빈, 조헌가, 통설로 손일규, 이중재를 더한다. 이 열기로 데운 방 안 사람들이 온보파다."},{"n":2,"obj":"백설기 위의 붉은 대추를 하나씩 집어내는 사람 · 곁의 작은 그릇","fact":"薛己(明) 『內科摘要』 — 溫補派","hook":"백설기 = 薛己 · 안(內)에서 요긴한 것(要)만 따 냄(摘) = 內科摘要","say":"방 안 왼쪽 앞, 하얀 백설기 위에서 붉은 대추만 하나씩 집어내 작은 그릇에 담는다 — 백설기의 「설기」, 薛己다. 안 내(內), 딸 적(摘), 요긴할 요(要) — 안에서 요긴한 것만 따 낸 『內科摘要』. 교재 溫補派 셋 가운데 첫 사람, 明.","box":[527,507,323,328],"src":[],"tts":"방 안 왼쪽 앞, 하얀 백설기 위에서 붉은 대추만 하나씩 집어내 작은 그릇에 담는다, 백설기의 설기, 설기다. 안 내, 딸 적, 요긴할 요, 안에서 요긴한 것만 따 낸 내과적요. 교재 온보파 셋 가운데 첫 사람, 명."},{"n":3,"obj":"열두 칸 장에 책을 꽂는 사람","fact":"張介賓(景岳) 『類經』 — 『內經』을 내용별 12類로 나눠 주석","hook":"장(欌) = 張 · 종류(類)별 열두 칸 = 『類經』 12類","say":"뒤 벽의 열두 칸 장에 한 사람이 책을 칸마다 나눠 꽂는다 — 장의 「장」, 張介賓이다. 무리 유(類) — 『內經』을 내용별 열두 갈래로 나눠 주석한 『類經』. 『內經』 전체에 처음 주석을 단 책은 馬蒔의 『註證發微』이고, 『類經』은 「처음」이 아니라 「분류」다. 나눠 다시 엮은 책은 楊上善 『太素』와 張介賓 『類經』. 素問은 王冰, 靈樞는 宋 史崧이 정리했다.","box":[630,256,348,445],"src":["UH-MQ-06","UH-NJ-03"],"tts":"뒤 벽의 열두 칸 장에 한 사람이 책을 칸마다 나눠 꽂는다, 장의 장, 장개빈이다. 무리 유, 내경을 내용별 열두 갈래로 나눠 주석한 유경. 내경 전체에 처음 주석을 단 책은 마시의 주증발미이고, 유경은 처음이 아니라 분류다. 나눠 다시 엮은 책은 양상선 태소와 장개빈 유경. 소문은 왕빙, 영추는 송 사숭이 정리했다."},{"n":4,"obj":"넘치지 않은 해 물통 · 빈 달 물통 곁에서 깜짝 놀라 펄쩍 뛰는 사람","fact":"張景岳 『景岳全書』 — 陽非有餘 眞陰不足 (朱震亨 陽常有餘 반박)","hook":"경악(驚愕) = 景岳 · 넘치지 않은 해 물통 = 陽非有餘 · 빈 달 물통 = 眞陰不足","say":"가운데, 물통 둘 곁에서 한 사람이 깜짝 놀라 펄쩍 뛴다 — 「경악」, 張介賓의 호 景岳이다. 해 물통은 넘치지 않고(陽非有餘), 달 물통은 비었다(眞陰不足). 朱震亨의 넘친 해 물통(陽常有餘)과 반대 — 陽은 남아돌지 않으니 깎지 말고 덥혀 채우라. 그의 책 『景岳全書』.","box":[[1014,323,271,415],[901,691,268,148]],"src":[],"tts":"가운데, 물통 둘 곁에서 한 사람이 깜짝 놀라 펄쩍 뛴다, 경악, 장개빈의 호 경악이다. 해 물통은 넘치지 않고 양비유여, 달 물통은 비었다 진음부족. 주진형의 넘친 해 물통 양상유여와 반대, 양은 남아돌지 않으니 깎지 말고 덥혀 채우라. 그의 책 경악전서."},{"n":5,"obj":"아궁이 불에 조개 꼬치를 바치는 사람 · 불 속의 작은 하트 불씨","fact":"趙獻可(明) 『醫貫』 — 小心命門說 · 命門의 불을 몸의 주인으로","hook":"조개(趙) 바침(獻) = 趙獻可 · 꿰뚫음(貫) = 醫貫 · 작은 하트(小心) = 小心命門","say":"아궁이 앞에 쪼그린 사람이 쇠꼬챙이에 조개를 꿰어 불에 바친다 — 조개의 「조」에 바칠 헌(獻), 趙獻可다. 꿰뚫을 관(貫), 『醫貫』. 불 깊숙이 작은 하트 불씨가 있다 — 작은 심장(小心) 자리의 命門, 小心命門說. 命門의 불을 몸의 주인으로 보고 그 불을 지핀다.","box":[164,717,461,384],"src":["JS-SIN-05-02"],"tts":"아궁이 앞에 쪼그린 사람이 쇠꼬챙이에 조개를 꿰어 불에 바친다, 조개의 조에 바칠 헌, 조헌가다. 꿰뚫을 관, 의관. 불 깊숙이 작은 하트 불씨가 있다, 작은 심장 소심 자리의 명문, 소심명문설. 명문의 불을 몸의 주인으로 보고 그 불을 지핀다."},{"n":6,"obj":"붉은 물 대야에서 까만 구슬을 건지는 아이","fact":"孫一奎(明) 『赤水玄珠』 — 溫補派(통설)","hook":"아이(손자) = 孫 · 붉은 물(赤水) + 검은 구슬(玄珠) = 赤水玄珠","say":"오른쪽 앞, 아이가 붉은 물 대야에서 까만 구슬을 건진다 — 붉을 적(赤), 물 수(水), 검을 현(玄), 구슬 주(珠). 손자의 「손」, 孫一奎의 『赤水玄珠』. 교재 셋에는 없고 통설로 溫補派에 넣는다.","box":[1178,666,256,200],"src":[],"tts":"오른쪽 앞, 아이가 붉은 물 대야에서 까만 구슬을 건진다, 붉을 적, 물 수, 검을 현, 구슬 주. 손자의 손, 손일규의 적수현주. 교재 셋에는 없고 통설로 온보파에 넣는다."},{"n":7,"obj":"자두를 입에 문 채 두꺼운 책을 열심히 읽는 젊은 선비","fact":"李中梓(士材, 明) 『醫宗必讀』·『內經知要』 — 溫補派(통설)","hook":"자두(李) = 李中梓 · 꼭(必) 읽음(讀) = 醫宗必讀","say":"그 곁, 젊은 선비가 자두를 입에 문 채 두꺼운 책을 열심히 읽는다 — 자두 이(李), 李中梓, 자는 士材. 반드시 필(必), 읽을 독(讀) — 의사라면 꼭 읽을 책 『醫宗必讀』. 『內經』의 요점을 추린 『內經知要』도 그의 책. 통설로 溫補派.","box":[1352,497,220,287],"src":["UHG-053"],"tts":"그 곁, 젊은 선비가 자두를 입에 문 채 두꺼운 책을 열심히 읽는다, 자두 이, 이중재, 자는 사재. 반드시 필, 읽을 독, 의사라면 꼭 읽을 책 의종필독. 내경의 요점을 추린 내경지요도 그의 책. 통설로 온보파."},{"n":8,"obj":"문밖 툇마루, 서랍장 곁에서 돌덩이를 치켜들고 부러진 조개 꼬치를 쥔 사람 · 떨어지는 조개 · 뒤의 큰 나무","fact":"徐大椿(淸) 『醫貫砭』 — 『醫貫』 반박 · 補陰派 ★溫補派 아님","hook":"서랍(徐) · 큰(大) 나무(椿) = 徐大椿 · 돌(砭)로 꼬치(貫)를 깸 = 醫貫砭","say":"문밖 툇마루 끝, 서랍장 곁의 사람이 얼굴을 찌푸리고 돌덩이를 치켜들었다 — 쥔 조개 꼬치는 두 동강, 조개는 땅으로 떨어진다. 서랍의 「서」가 徐, 뒤의 큰 나무가 큰 대(大), 참죽나무 춘(椿) — 徐大椿이다. 돌침 폄(砭) — 돌로 『醫貫』을 깨뜨린 『醫貫砭』, 趙獻可를 반박한 책. 맑은 하늘 아래 淸 사람이고, 溫補가 아니라 補陰派 — 陳念祖도 같은 편이다.","box":[[1720,517,302,410],[1756,31,292,625]],"src":["UH-MQ-07-02"],"tts":"문밖 툇마루 끝, 서랍장 곁의 사람이 얼굴을 찌푸리고 돌덩이를 치켜들었다, 쥔 조개 꼬치는 두 동강, 조개는 땅으로 떨어진다. 서랍의 서가 서, 뒤의 큰 나무가 큰 대, 참죽나무 춘, 서대춘이다. 돌침 폄, 돌로 의관을 깨뜨린 의관폄, 조헌가를 반박한 책. 맑은 하늘 아래 청 사람이고, 온보가 아니라 보음파, 진념조도 같은 편이다."},{"n":9,"kind":"review","obj":"방 안 사람들 · 문밖의 한 사람","fact":"溫補 = 薛己·張介賓·趙獻可(+孫一奎·李中梓) ↔ 徐大椿(補陰, 淸)","hook":"데운 방 안 = 溫補派 · 문밖 = 반박자","say":"다시 방을 돈다. 백설기 薛己 『內科摘要』, 열두 칸 장 張介賓 『類經』, 깜짝 놀란 景岳의 『景岳全書』 — 陽非有餘 眞陰不足, 아궁이의 조개 꼬치 趙獻可 『醫貫』 小心命門. 통설 둘은 붉은 물의 아이 孫一奎 『赤水玄珠』, 자두 문 선비 李中梓 『醫宗必讀』. 문밖에서 꼬치를 깬 徐大椿은 溫補派가 아니다.","box":[[348,256,1249,625],[1720,517,302,410]],"src":["UHG-026"],"tts":"다시 방을 돈다. 백설기 설기 내과적요, 열두 칸 장 장개빈 유경, 깜짝 놀란 경악의 경악전서, 양비유여 진음부족, 아궁이의 조개 꼬치 조헌가 의관 소심명문. 통설 둘은 붉은 물의 아이 손일규 적수현주, 자두 문 선비 이중재 의종필독. 문밖에서 꼬치를 깬 서대춘은 온보파가 아니다."}],"has_image":true},{"id":"hist-09","title":"溫病學派 — 王履·吳有性에서 淸 四大家까지","place":"유리 온실 식물원","image":"images/lessons/hist-09.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"유리 온실 식물원 · 바깥 정원","fact":"溫病學派 — 王履·吳有性(바깥)에서 淸 四大家(유리 안)까지","hook":"온실(溫室) = 溫病 · 맑은(淸) 유리 안 = 淸 四大家 · 유리 밖 = 그 앞 사람","say":"온실이다 — 따뜻할 온(溫), 溫病의 溫. 맑은 유리 안에 맑을 청(淸), 淸의 溫病 四大家 넷이 있고, 유리 밖 정원에 그 앞 사람 둘 — 王履와 吳有性이 있다.","box":null,"src":[],"tts":"온실이다, 따뜻할 온, 온병의 온. 맑은 유리 안에 맑을 청, 청의 온병 사대가 넷이 있고, 유리 밖 정원에 그 앞 사람 둘, 왕리와 오유성이 있다."},{"n":1,"obj":"큰 장화를 신고 붉은 시내 속을 온실 문 쪽으로 걸으며 담요 두른 환자를 손바닥으로 막는 사람","fact":"王履(安道, 元末明初) 『醫經溯洄集』 — 「溫病不得混稱傷寒」","hook":"장화 = 履 · 거슬러 오름 = 溯洄 · 붉은 시내 = 丹溪(朱震亨) 학파 · 담요 환자(傷寒)를 온실(溫病)에 못 들임","say":"온실 문 앞, 큰 장화를 신은 사람이 붉은 시내 속을 물이 시작되는 문 쪽으로 거슬러 걷는다 — 신 리(履), 王履. 거슬러 올라갈 소(溯), 『醫經溯洄集』. 붉은 시내는 丹溪 朱震亨의 물줄기, 그 학파다. 담요 두른 傷寒 환자를 손바닥으로 막아 온실에 못 들인다 — 溫病을 傷寒과 섞어 부르지 말라, 「溫病不得混稱傷寒」. 元末明初 사람.","box":[410,553,522,466],"src":["UHG-034"],"tts":"온실 문 앞, 큰 장화를 신은 사람이 붉은 시내 속을 물이 시작되는 문 쪽으로 거슬러 걷는다, 신 리, 왕리. 거슬러 올라갈 소, 의경소회집. 붉은 시내는 단계 주진형의 물줄기, 그 학파다. 담요 두른 상한 환자를 손바닥으로 막아 온실에 못 들인다, 온병을 상한과 섞어 부르지 말라, 온병부득혼칭상한. 원말명초 사람."},{"n":2,"obj":"깨진 항아리에서 새어 나오는 보라색 이상한 안개 · 곁의 오리","fact":"吳有性(又可, 明末) 『溫疫論』(1642) — 戾氣 = 別有一種異氣","hook":"오리 = 吳 · 이상한(異) 보라 안개 = 戾氣(風寒暑濕이 아님)","say":"맨 왼쪽, 오리 곁의 깨진 항아리에서 보라색 이상한 안개가 새어 나온다. 오리의 「오」, 吳有性(又可). 바람도 추위도 더위도 습기도 아닌, 천지 사이의 다른 한 가지 기운 「別有一種異氣」 — 戾氣다. 『溫疫論』, 1642년 明末.","box":[20,292,292,210],"src":["UH-MQ-02"],"tts":"맨 왼쪽, 오리 곁의 깨진 항아리에서 보라색 이상한 안개가 새어 나온다. 오리의 오, 오유성, 우가. 바람도 추위도 더위도 습기도 아닌, 천지 사이의 다른 한 가지 기운 별유일종이기, 려기다. 온역론, 1642년 명말."},{"n":3,"obj":"보라 안개가 코로 곧장 빨려 들어가 입을 벌리고 기침하는 정원사","fact":"吳有性 — 戾氣는 口鼻로 들어온다 · 一病一氣說","hook":"코·입으로 들어감 = 口鼻而入 · 안개 한 줄기에 병 하나 = 一病一氣","say":"그 안개 한 줄기가 정원사의 코로 곧장 들어가고, 정원사는 입을 벌려 기침한다 — 피부가 아니라 입과 코로 들어온다, 口鼻而入. 안개 한 줄기에 병 하나 — 병마다 제 戾氣가 따로 있다는 一病一氣說. 六淫과 갈라 세운 병인이다.","box":[287,113,274,397],"src":["BIN-SA-05"],"tts":"그 안개 한 줄기가 정원사의 코로 곧장 들어가고, 정원사는 입을 벌려 기침한다, 피부가 아니라 입과 코로 들어온다, 구비이입. 안개 한 줄기에 병 하나, 병마다 제 려기가 따로 있다는 일병일기설. 육음과 갈라 세운 병인이다."},{"n":4,"obj":"큰 잎을 우산처럼 받쳐 든 사람 · 곁에 매달린 금메달","fact":"葉桂(天士, 淸) 『溫熱論』 — 溫病學派 창시자","hook":"잎(葉) = 葉桂 · 하늘(天)을 가린 잎 = 葉天士 · 금메달 = 처음 연 사람","say":"온실 안 첫 사람, 커다란 잎을 우산처럼 받쳐 하늘을 가렸다 — 잎 엽(葉), 성으로는 섭, 葉桂, 자는 天士. 곁의 금메달은 溫病學派를 처음 연 창시자라는 뜻. 책은 『溫熱論』, 淸.","box":[947,123,440,589],"src":["UH-MQ-03"],"tts":"온실 안 첫 사람, 커다란 잎을 우산처럼 받쳐 하늘을 가렸다, 잎 엽, 성으로는 섭, 섭계, 자는 천사. 곁의 금메달은 온병학파를 처음 연 창시자라는 뜻. 책은 온열론, 청."},{"n":5,"obj":"세 겹 둥근 울타리(바깥부터 파랑·초록·빨강)와 한가운데 붉은 꽃","fact":"葉桂 — 衛氣營血 辨證 창시 · 溫邪上受 首先犯肺 逆傳心包","hook":"바깥에서 안으로 울타리 셋 + 꽃 = 衛 → 氣 → 營 → 血","say":"가운데, 둥근 울타리 세 겹 한가운데 붉은 꽃이 피었다. 바깥 파랑 울타리가 衛, 초록이 氣, 빨강이 營, 가장 깊은 곳의 붉은 꽃이 血 — 바깥에서 안으로 깊어지는 衛氣營血 辨證, 葉桂가 세웠다. 「溫邪上受 首先犯肺 逆傳心包」 — 溫邪는 위로 받아 먼저 肺를 범하고 心包로 거슬러 전한다. 三焦辨證은 吳鞠通.","box":[1118,540,484,295],"src":["SW-WB-01","SW-WB-02-01","BZ-BY-06-M02"],"tts":"가운데, 둥근 울타리 세 겹 한가운데 붉은 꽃이 피었다. 바깥 파랑 울타리가 위, 초록이 기, 빨강이 영, 가장 깊은 곳의 붉은 꽃이 혈, 바깥에서 안으로 깊어지는 위기영혈 변증, 섭계가 세웠다. 온사상수 수선범폐 역전심포, 온사는 위로 받아 먼저 폐를 범하고 심포로 거슬러 전한다. 삼초변증은 오국통."},{"n":6,"obj":"김이 자욱한 구석에서 땀을 흘리며 녹는 눈사람","fact":"薛雪(生白, 淸) 『溫熱病篇』(=濕熱病篇·濕熱條辨) — 濕熱辨證","hook":"눈(雪) = 薛雪 · 하얀(白) 눈사람 = 生白 · 축축하고(濕) 더운(熱) 김 = 濕熱","say":"오른쪽 김이 자욱한 구석, 하얀 눈사람이 땀을 흘리며 녹는다 — 눈 설(雪), 薛雪, 자는 生白. 축축하고 뜨거운 김 — 濕熱을 가려 다룬 『濕熱病篇』. 교재는 『溫熱病篇』, 카드는 『濕熱條辨』으로 적는다. 淸.","box":[1490,169,348,553],"src":["SW-WB-02-02"],"tts":"오른쪽 김이 자욱한 구석, 하얀 눈사람이 땀을 흘리며 녹는다, 눈 설, 설설, 자는 생백. 축축하고 뜨거운 김, 습열을 가려 다룬 습열병편. 교재는 온열병편, 카드는 습열조변으로 적는다. 청."},{"n":7,"obj":"세로로 매달린 화분 바구니 셋 · 맨 위 오리가 떨어뜨린 공","fact":"吳瑭(鞠通, 淸) 『溫病條辨』(1798) — 三焦辨證","hook":"오리 = 吳 · 공(鞠)이 통과(通) = 吳鞠通 · 위·가운데·아래 바구니 = 上焦·中焦·下焦","say":"오른쪽 끝, 화분 바구니 셋이 세로로 매달렸다. 맨 위 바구니의 오리가 공을 떨어뜨리고, 공은 가운데를 지나 맨 아래로 간다 — 공 국(鞠), 통할 통(通), 吳鞠通, 이름은 吳瑭. 上焦에서 中焦, 下焦로 내려가는 三焦辨證, 『溫病條辨』(1798)이다.","box":[1833,159,200,604],"src":["SW-WB-02-03","BZ-BY-06-M03"],"tts":"오른쪽 끝, 화분 바구니 셋이 세로로 매달렸다. 맨 위 바구니의 오리가 공을 떨어뜨리고, 공은 가운데를 지나 맨 아래로 간다, 공 국, 통할 통, 오국통, 이름은 오당. 상초에서 중초, 하초로 내려가는 삼초변증, 온병조변 1798이다."},{"n":8,"obj":"베틀로 천을 짜는 큰 수탉 · 천에 짜 넣은 쥐와 모기","fact":"王士雄(孟英, 淸) 『溫熱經緯』 — 콜레라·페스트·말라리아 病例","hook":"수컷(雄) 닭 = 王士雄 · 날실·씨실(經緯) = 溫熱經緯 · 쥐·모기 = 전염병 病例","say":"앞쪽, 큰 수탉이 베틀로 천을 짠다 — 수컷 웅(雄), 王士雄, 자는 孟英. 날실 경(經), 씨실 위(緯) — 짜서 엮은 『溫熱經緯』. 천에 쥐와 모기가 짜여 있다 — 페스트, 말라리아, 그리고 콜레라 같은 전염병의 病例를 적었다. 『溫病條辨』은 吳鞠通이니 헷갈리지 말 것.","box":[1408,701,604,389],"src":["UHG-042","SW-WB-02-04","UH-MQ-04"],"tts":"앞쪽, 큰 수탉이 베틀로 천을 짠다, 수컷 웅, 왕사웅, 자는 맹영. 날실 경, 씨실 위, 짜서 엮은 온열경위. 천에 쥐와 모기가 짜여 있다, 페스트, 말라리아, 그리고 콜레라 같은 전염병의 병례를 적었다. 온병조변은 오국통이니 헷갈리지 말 것."},{"n":9,"kind":"review","obj":"유리 밖 王履·吳有性 · 유리 안 淸 四大家","fact":"王履 → 吳有性(戾氣) → 淸 四大家 葉桂·薛雪·吳瑭·王士雄","hook":"衛氣營血 = 葉天士 · 三焦 = 吳鞠通 · 濕熱 = 薛雪 · 經緯 = 王孟英","say":"바깥부터. 장화의 王履 — 溫病은 傷寒이 아니다. 오리와 보라 안개의 吳有性 — 戾氣, 입과 코로 들어온다. 유리 안은 淸 溫病 四大家: 잎의 葉天士 衛氣營血, 눈사람 薛雪 濕熱, 공 떨어뜨리는 오리 吳鞠通 三焦, 베 짜는 수탉 王孟英 『溫熱經緯』. 辨證 둘은 衛氣營血이 葉天士, 三焦가 吳鞠通.","box":[[0,102,932,1034],[937,102,1111,1034]],"src":[],"tts":"바깥부터. 장화의 왕리, 온병은 상한이 아니다. 오리와 보라 안개의 오유성, 려기, 입과 코로 들어온다. 유리 안은 청 온병 사대가: 잎의 섭천사 위기영혈, 눈사람 설설 습열, 공 떨어뜨리는 오리 오국통 삼초, 베 짜는 수탉 왕맹영 온열경위. 변증 둘은 위기영혈이 섭천사, 삼초가 오국통."}],"has_image":true},{"id":"hist-10","title":"明·淸 — 정리된 책들(註證發微·醫方集解·雜病源流犀燭·醫林改錯)","place":"햇빛 드는 유리 서점","image":"images/lessons/hist-10.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"햇빛 드는 유리 서점","fact":"明·淸 — 옛 의서를 주석하고 모으고 바로잡은 책들","hook":"밝음(明)·맑음(淸) = 햇빛 쏟아지는 유리 서점","say":"햇빛이 쏟아지는 유리 서점이다 — 밝을 명(明), 맑을 청(淸). 明·淸 때 옛 의서에 주석을 달고, 처방을 모으고, 잘못을 바로잡은 책들이 있다. 왼쪽 탁자의 말만 明, 나머지는 淸.","box":null,"src":[],"tts":"햇빛이 쏟아지는 유리 서점이다, 밝을 명, 맑을 청. 명, 청 때 옛 의서에 주석을 달고, 처방을 모으고, 잘못을 바로잡은 책들이 있다. 왼쪽 탁자의 말만 명, 나머지는 청."},{"n":1,"obj":"펼친 책 두 권에 깃펜으로 적어 넣는 말 · 걸이 막대에 매단 금메달","fact":"馬蒔(明) 『素問註證發微』·『靈樞註證發微』 — 內經 전체 최초 주석","hook":"말(馬) = 馬蒔 · 두 책(素問·靈樞)에 적어 넣음 = 註 · 금메달 = 최초","say":"왼쪽 탁자, 말이 깃펜을 쥐고 펼친 책 두 권에 글을 적어 넣는다 — 말 마(馬), 馬蒔. 두 책은 素問과 靈樞, 적어 넣는 글은 주석 — 『素問註證發微』·『靈樞註證發微』. 걸이 막대에 매단 금메달은 『內經』 전체에 단 최초의 주석이라는 뜻. 내용별로 나눠 엮은 張介賓 『類經』과 구별한다. 明 사람.","box":[0,339,641,677],"src":["UH-MQ-06"],"tts":"왼쪽 탁자, 말이 깃펜을 쥐고 펼친 책 두 권에 글을 적어 넣는다, 말 마, 마시. 두 책은 소문과 영추, 적어 넣는 글은 주석, 소문주증발미, 영추주증발미. 걸이 막대에 매단 금메달은 내경 전체에 단 최초의 주석이라는 뜻. 내용별로 나눠 엮은 장개빈 유경과 구별한다. 명 사람."},{"n":2,"obj":"김 나는 국솥을 머리에 이고 음표를 날리며 노래하는 사람 · 끈으로 묶은 쪽지 뭉치","fact":"汪昂(淸) 『湯頭歌訣』·『醫方集解』","hook":"탕(湯)을 머리(頭)에 이고 노래(歌) = 湯頭歌訣 · 고개 쳐듦(昂) = 汪昂 · 모아 묶은 쪽지 = 醫方集解","say":"그 곁, 김 나는 국솥을 머리에 이고 음표를 날리며 노래한다 — 끓일 탕(湯), 머리 두(頭), 노래 가(歌), 탕을 머리에 이고 부르는 노래 『湯頭歌訣』. 솥을 높이 쳐들었다 — 쳐들 앙(昂), 汪昂이다. 손에는 처방 쪽지를 모아 묶은 뭉치 — 『醫方集解』. 淸. 역사상 가장 큰 方書는 明 朱橚의 『普濟方』, 張介賓은 『景岳全書』에서 처방을 功用대로 新方八陣·古方八陣에 나눴다.","box":[634,123,288,843],"src":["UHG-037","BJ-SA-06"],"tts":"그 곁, 김 나는 국솥을 머리에 이고 음표를 날리며 노래한다, 끓일 탕, 머리 두, 노래 가, 탕을 머리에 이고 부르는 노래 탕두가결. 솥을 높이 쳐들었다, 쳐들 앙, 왕앙이다. 손에는 처방 쪽지를 모아 묶은 뭉치, 의방집해. 청. 역사상 가장 큰 방서는 명 주숙의 보제방, 장개빈은 경악전서에서 처방을 공용대로 신방팔진, 고방팔진에 나눴다."},{"n":3,"obj":"긴 의자 위, 약초 잎·뿌리·잔가지를 채우고 덮개를 버클로 채운 배낭","fact":"汪昂 『本草備要』(1694) ★『本經疏證』은 汪昂이 아님","hook":"꼭 필요한(要) 약초만 갖춰(備) 챙긴 배낭 = 本草備要","say":"앞쪽 긴 의자 위, 약초 잎과 뿌리를 채우고 덮개를 버클로 꽉 채운 배낭 — 갖출 비(備), 요긴할 요(要), 꼭 필요한 本草만 갖춘 『本草備要』, 1694년. 이것도 汪昂의 책이다. 『本經疏證』은 汪昂이 아니라 鄒澍의 책.","box":[882,689,556,424],"src":[],"tts":"앞쪽 긴 의자 위, 약초 잎과 뿌리를 채우고 덮개를 버클로 꽉 채운 배낭, 갖출 비, 요긴할 요, 꼭 필요한 본초만 갖춘 본초비요, 1694년. 이것도 왕앙의 책이다. 본경소증은 왕앙이 아니라 추주의 책."},{"n":4,"obj":"수조 바닥에 가라앉은 뿔 달린 금빛 거북 · 등 위에서 타는 촛불","fact":"沈金鰲(淸) 『雜病源流犀燭』 (+『沈氏尊生書』·『婦科玉尺』)","hook":"가라앉음(沈) + 금빛 자라(金鰲) = 沈金鰲 · 무소 뿔(犀) + 촛불(燭) = 犀燭","say":"가운데 수조, 금빛 거북이 물 바닥에 가라앉아 있다 — 가라앉을 침(沈), 성으로는 심, 금 자라 오(鰲), 沈金鰲. 머리엔 무소 뿔(犀), 등에는 물속에서도 타는 촛불(燭) — 여러 병의 근원과 흐름을 밝혀 비춘 『雜病源流犀燭』. 『沈氏尊生書』·『婦科玉尺』도 그의 책, 淸.","box":[1055,392,432,455],"src":["UHG-035"],"tts":"가운데 수조, 금빛 거북이 물 바닥에 가라앉아 있다, 가라앉을 침, 성으로는 심, 금 자라 오, 심금오. 머리엔 무소 뿔 서, 등에는 물속에서도 타는 촛불 촉, 여러 병의 근원과 흐름을 밝혀 비춘 잡병원류서촉. 심씨존생서, 부과옥척도 그의 책, 청."},{"n":5,"obj":"연필과 지우개를 들고 벽의 인체 내장 그림을 고쳐 그리는 사람","fact":"王淸任(淸) 『醫林改錯』(1830) — 해부로 옛 잘못을 바로잡음","hook":"의가들(醫林)의 잘못(錯)을 고침(改) = 醫林改錯 · 지워서 맑게(淸) = 王淸任","say":"오른쪽 벽, 한 사람이 연필과 지우개를 들고 인체 내장 그림을 고쳐 그린다 — 수풀 림(林), 고칠 개(改), 어긋날 착(錯), 의가들의 잘못을 고친 『醫林改錯』, 1830년. 직접 본 해부로 옛 그림을 바로잡았다. 지워서 맑게 고친 사람 — 맑을 청(淸), 王淸任.","box":[1487,115,395,894],"src":["UH-MQ-05"],"tts":"오른쪽 벽, 한 사람이 연필과 지우개를 들고 인체 내장 그림을 고쳐 그린다, 수풀 림, 고칠 개, 어긋날 착, 의가들의 잘못을 고친 의림개착, 1830년. 직접 본 해부로 옛 그림을 바로잡았다. 지워서 맑게 고친 사람, 맑을 청, 왕청임."},{"n":6,"obj":"검붉은 덩어리로 막힌 유리관 · 관에 꽂힌 뚫어뻥 · 그 아래로 흐르는 붉은 물","fact":"王淸任 — 瘀血 상세 논술 · 活血祛瘀 ★唐宗海 『血證論』과 혼동","hook":"막힌 검붉은 덩어리 = 瘀血 · 뚫어 다시 흐르게 = 活血祛瘀","say":"그 곁 유리관이 검붉은 덩어리로 막혔다 — 瘀血. 관에 뚫어뻥을 꽂아 뚫자 그 아래로 붉은 물이 다시 흐른다 — 피를 살리고 瘀를 몰아내는 活血祛瘀, 王淸任이 내세웠다. 몸 안의 병리산물이 다시 병의 원인이 된다 — 痰은 朱丹溪의 「百病皆因痰作祟」, 瘀血은 王淸任. 『血證論』은 唐宗海의 책이니 헷갈리지 말 것.","box":[1747,0,282,1069],"src":["BIN-SA-06","UHG-041"],"tts":"그 곁 유리관이 검붉은 덩어리로 막혔다, 어혈. 관에 뚫어뻥을 꽂아 뚫자 그 아래로 붉은 물이 다시 흐른다, 피를 살리고 어를 몰아내는 활혈거어, 왕청임이 내세웠다. 몸 안의 병리산물이 다시 병의 원인이 된다, 담은 주단계의 백병개인담작수, 어혈은 왕청임. 혈증론은 당종해의 책이니 헷갈리지 말 것."},{"n":7,"kind":"review","obj":"서점 한 바퀴 — 말 · 국솥 · 배낭 · 수조 · 인체 그림 · 막힌 관","fact":"馬蒔(明) 註證發微 · 汪昂 · 沈金鰲 · 王淸任(淸)","hook":"주석(馬蒔) → 모음(汪昂·沈金鰲) → 바로잡음(王淸任)","say":"다시 한 바퀴. 글 적는 말 馬蒔 — 『內經』 전체 첫 주석, 明. 국솥 노래 汪昂 — 『湯頭歌訣』·『醫方集解』, 배낭은 『本草備要』. 수조의 금빛 거북 沈金鰲 — 『雜病源流犀燭』. 지우개와 뚫어뻥 王淸任 — 『醫林改錯』, 해부와 瘀血. 『血證論』은 唐宗海.","box":[[0,339,641,677],[634,123,288,843],[882,689,556,424],[1055,392,432,455],[1487,115,395,894],[1747,0,282,1069]],"src":[],"tts":"다시 한 바퀴. 글 적는 말 마시, 내경 전체 첫 주석, 명. 국솥 노래 왕앙, 탕두가결, 의방집해, 배낭은 본초비요. 수조의 금빛 거북 심금오, 잡병원류서촉. 지우개와 뚫어뻥 왕청임, 의림개착, 해부와 어혈. 혈증론은 당종해."}],"has_image":true}]</script>
<script>
// 한의학 Sketchy 과 재생기 — 과 목록 · 투어 · 복습 · 시험. build_player.py가 lessons.html에 끼워 넣는다.
(function () {
  'use strict';

  var LESSONS = JSON.parse(document.getElementById('lessons-data').textContent);
  var byId = Object.create(null);
  LESSONS.forEach(function (L) { byId[L.id] = L; });

  var KEY = 'sketchy_lessons_v1';          // { <과id>: [{date, score, total, wrong:[n…]}] }
  var PKEY = 'sketchy_lessons_prefs_v1';   // { rate, voice } — 이 브라우저만의 편의 설정
  var MODES = ['tour', 'review', 'test'];

  function $(id) { return document.getElementById(id); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---------- 저장소 (막혀 있어도 페이지는 돈다) ----------
  var memResults = null, storeBroken = false;
  function readResults() {
    if (storeBroken && memResults) return memResults;
    try {
      var raw = localStorage.getItem(KEY);
      var o = raw ? JSON.parse(raw) : {};
      if (o && typeof o === 'object' && !Array.isArray(o)) return o;
    } catch (e) { storeBroken = true; }
    return memResults || {};
  }
  function pushResult(id, rec) {
    var all = readResults();
    if (!Array.isArray(all[id])) all[id] = [];
    all[id].push(rec);
    memResults = all;
    try { localStorage.setItem(KEY, JSON.stringify(all)); return true; }
    catch (e) { storeBroken = true; return false; }
  }
  var prefs = { rate: 1, voice: true };
  try {
    var p = JSON.parse(localStorage.getItem(PKEY) || '{}') || {};
    if (typeof p.rate === 'number') prefs.rate = clamp(Math.round(p.rate * 10) / 10, 0.8, 1.4);
    if (p.voice === false) prefs.voice = false;
  } catch (e) { /* 기본값 */ }
  function savePrefs() { try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch (e) { /* 무시 */ } }

  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return String(iso || '');
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  }
  function exportResults() {
    var all = readResults();
    var blob = new Blob([JSON.stringify(all, null, 1) + '\n'], { type: 'application/json' });

    var k = e.key, space = k === ' ' || k === 'Spacebar';
    if (space && tag === 'BUTTON') return;                    // 키보드로 고른 단추는 제 일을 한다
    if (!space && k !== 'ArrowLeft' && k !== 'ArrowRight') return;
    e.preventDefault();
    if (S.mode === 'tour') {
      if (k === 'ArrowLeft') goTour(S.i - 1);
      else if (k === 'ArrowRight') goTour(S.i + 1);
      else setAuto(!S.auto);
    } else if (S.mode === 'review') {
      if (!space) stepReview(k === 'ArrowLeft' ? -1 : 1);
    } else if (S.test) {
      if (S.test.phase === 'ask' && space) { S.test.phase = 'shown'; renderTest(); }
      else if (S.test.phase === 'shown' && !space) judge(k === 'ArrowRight');
    }
  });

  route();
})();

</script>
