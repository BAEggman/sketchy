<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>한의학 Sketchy 과</title>
<style>
:root{
  --bg:#f5f3ee; --fg:#1c1c1f; --muted:#5d5d66; --card:#ffffff; --line:#dcd8cf; --chip:#ece8df;
  --accent:#a8500f; --accent-fg:#ffffff; --stage:#2a2c30; --ring:#ffcf3f;
  --good:#1d7a3a; --bad:#b3261e;
  --sans:'Noto Sans CJK KR','Noto Serif CJK KR','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;
  --serif:'Noto Serif CJK KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',serif;
  --gut:16px; --vh:100vh; --chrome:330px;
  color-scheme:light dark;
}
@supports (height:100dvh){ :root{ --vh:100dvh; } }
@media (prefers-color-scheme:dark){
  :root{ --bg:#141518; --fg:#ececef; --muted:#a4a4ae; --card:#1e2024; --line:#34373d; --chip:#2a2c31;
    --accent:#f0a35e; --accent-fg:#1a1205; --stage:#0c0d0f; --good:#5cc47c; --bad:#ff8a80; }
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans); line-height:1.55; font-size:16px; }
button,input{ font:inherit; color:inherit; }
[hidden]{ display:none !important; }
a{ color:var(--accent); }

.top{ display:flex; align-items:center; gap:12px; padding:10px var(--gut); border-bottom:1px solid var(--line); min-height:52px; }
.top h1{ font-size:1rem; margin:0; font-weight:700; letter-spacing:-.01em; }
.top .home{ text-decoration:none; font-size:.92rem; padding:6px 10px; border:1px solid var(--line); border-radius:8px; color:var(--fg); white-space:nowrap; }
.top .home:hover{ border-color:var(--accent); }
main{ padding:14px var(--gut) 40px; max-width:1360px; margin:0 auto; }

/* 과 목록 */
.lead{ color:var(--muted); margin:4px 0 16px; font-size:.95rem; }
.notice{ background:var(--chip); border-radius:8px; padding:8px 12px; margin:0 0 14px; font-size:.92rem; }
.lessons{ list-style:none; margin:0; padding:0; display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
.lcard{ display:flex; flex-direction:column; gap:4px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--card); text-decoration:none; color:var(--fg); height:100%; }
.lcard:hover,.lcard:focus-visible{ border-color:var(--accent); }
.lc-title{ font-family:var(--serif); font-weight:700; font-size:1.05rem; }
.lc-place{ color:var(--muted); font-size:.9rem; }
.lc-meta{ display:flex; flex-wrap:wrap; gap:6px 12px; font-size:.85rem; margin-top:4px; }
.lc-meta .rec{ color:var(--accent); font-weight:600; }
.lc-meta .none{ color:var(--muted); }
.tag{ display:inline-block; font-size:.75rem; padding:1px 7px; border-radius:99px; background:var(--chip); color:var(--muted); margin-left:6px; vertical-align:2px; font-family:var(--sans); font-weight:600; }
.tools{ margin-top:18px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:.9rem; color:var(--muted); }

/* 과 화면 */
.lhead{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:10px 16px; margin-bottom:12px; }
.lhead h2{ font-family:var(--serif); font-size:1.2rem; margin:0; line-height:1.35; }
.lhead p{ margin:2px 0 0; color:var(--muted); font-size:.9rem; }
.modes{ display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--card); }
.modes button{ border:0; background:none; padding:8px 16px; cursor:pointer; min-height:40px; font-weight:600; color:var(--muted); }
.modes button + button{ border-left:1px solid var(--line); }
.modes button[aria-pressed="true"]{ background:var(--accent); color:var(--accent-fg); }

.lbody{ display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
.stagecol{ min-width:0; }
.stagewrap{ background:var(--stage); border-radius:10px; overflow:hidden; display:flex; justify-content:center; }
.stage{ position:relative; width:min(100%, calc(max(200px, var(--vh) - var(--chrome)) * var(--w,16) / var(--h,9))); aspect-ratio:var(--w,16) / var(--h,9); background:#8b8e94; user-select:none; -webkit-user-select:none; }
.stage img{ position:absolute; inset:0; width:100%; height:100%; object-fit:fill; display:block; }
.ph{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:12px; color:#f3f3f3; font-size:.9rem;
  background:repeating-linear-gradient(135deg,#8b8e94 0 18px,#83868c 18px 36px); }
.stage svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.shade{ fill:rgba(8,9,12,.68); transition:opacity .22s ease; opacity:0; }
.stage.dim .shade{ opacity:1; }
.ring-o{ fill:none; stroke:rgba(0,0,0,.55); stroke-width:7px; }
.ring{ fill:none; stroke:var(--ring); stroke-width:3px; }
.rings{ animation:pop .35s ease-out; }
@keyframes pop{ from{ opacity:0; } to{ opacity:1; } }
.hots{ position:absolute; inset:0; }
.hot{ position:absolute; display:block; margin:0; padding:0; background:transparent; border:2px solid transparent; border-radius:6px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.hot:hover{ border-color:rgba(255,255,255,.38); background:rgba(255,255,255,.05); }
.hot:focus-visible{ outline:none; border-color:rgba(255,255,255,.7); }
.hot.sel{ border-color:var(--ring); box-shadow:0 0 0 2px rgba(0,0,0,.45); }

.ctrl{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
.row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.row.nav{ justify-content:space-between; flex-wrap:nowrap; }
.btn{ border:1px solid var(--line); background:var(--card); border-radius:9px; padding:8px 14px; min-height:42px; cursor:pointer; font-weight:600; white-space:nowrap; }
.btn:hover:not(:disabled){ border-color:var(--accent); }
.btn:disabled{ opacity:.4; cursor:default; }
.btn.primary{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
.btn.good{ background:var(--good); border-color:var(--good); color:#fff; }
.btn.bad{ background:var(--bad); border-color:var(--bad); color:#fff; }
.btn[aria-pressed="true"]{ background:var(--chip); border-color:var(--accent); color:var(--accent); }
.btn.grow{ flex:1 1 0; }
.btn kbd{ font-family:var(--sans); font-size:.72rem; opacity:.75; font-weight:500; margin-left:4px; }
.count{ font-variant-numeric:tabular-nums; color:var(--muted); font-size:.92rem; white-space:nowrap; }
.dots{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; }
.dot{ width:22px; height:22px; border-radius:50%; border:1.5px solid var(--line); background:var(--card); padding:0; cursor:pointer; font-size:.66rem; line-height:1; color:var(--muted); font-variant-numeric:tabular-nums; }
.dot.frame{ border-radius:5px; }
.dot.review{ border-style:dashed; }
.dot[aria-current="true"]{ background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
.keys{ font-size:.78rem; color:var(--muted); text-align:center; }

.side{ display:flex; flex-direction:column; gap:10px; min-width:0; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.meta{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; font-size:.88rem; color:var(--muted); margin-bottom:6px; }
.badge{ display:inline-block; font-size:.78rem; font-weight:700; padding:2px 9px; border-radius:99px; background:var(--chip); color:var(--fg); white-space:nowrap; }
.badge.station{ background:var(--accent); color:var(--accent-fg); }
.fact{ font-family:var(--serif); font-weight:700; font-size:1.12rem; line-height:1.5; margin:0 0 8px; word-break:keep-all; overflow-wrap:anywhere; }
.hook{ margin:0 0 8px; font-size:.95rem; word-break:keep-all; overflow-wrap:anywhere; }
.hook b{ font-size:.75rem; background:var(--chip); padding:1px 7px; border-radius:99px; margin-right:6px; color:var(--muted); vertical-align:1px; }
.say{ margin:0; color:var(--muted); font-size:.92rem; word-break:keep-all; overflow-wrap:anywhere; }
.src{ margin:8px 0 0; font-size:.75rem; color:var(--muted); }
.opts{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.rate{ display:flex; align-items:center; gap:8px; font-size:.88rem; color:var(--muted); flex:1 1 200px; }
.rate input{ flex:1; min-width:90px; accent-color:var(--accent); }
.rate output{ font-variant-numeric:tabular-nums; min-width:3.2em; color:var(--fg); }
.hint{ color:var(--muted); font-size:.92rem; margin:0; }
.score{ font-size:2rem; font-weight:800; margin:0 0 4px; font-variant-numeric:tabular-nums; }
.wrong{ list-style:none; padding:0; margin:8px 0 0; display:flex; flex-direction:column; gap:6px; }
.wrong button{ width:100%; text-align:left; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:8px 10px; cursor:pointer; }
.wrong button:hover{ border-color:var(--accent); }
.wrong .wf{ display:block; font-family:var(--serif); font-weight:700; font-size:.95rem; }
.wrong .wo{ display:block; font-size:.8rem; line-height:1.45; color:var(--muted); margin-top:2px; }
.past{ font-size:.82rem; color:var(--muted); margin:10px 0 0; }

@media (max-width:599px){
  .stagewrap{ margin:0 calc(-1 * var(--gut)); border-radius:0; }
  .lhead .modes{ width:100%; }
  .modes button{ flex:1; }
}
@media (min-width:1000px){
  :root{ --chrome:250px; --gut:24px; }
  .lbody{ grid-template-columns:minmax(0,1fr) 340px; gap:20px; align-items:start; }
}
@media (prefers-reduced-motion:reduce){ .rings{ animation:none; } .shade{ transition:none; } }
</style>
</head>
<body>
<header class="top">
  <a class="home" id="homeLink" href="?" hidden>← 과 목록</a>
  <h1 id="pageTitle">한의학 Sketchy 과</h1>
</header>
<main>
  <section id="listView" hidden>
    <p class="lead">과마다 그림 한 장. 투어로 정거장을 차례로 듣고, 복습에서 그림을 짚어 보고, 시험으로 떠올려 본다.</p>
    <p class="notice" id="listNotice" hidden></p>
    <ul class="lessons" id="lessonList"></ul>
    <div class="tools">
      <button type="button" class="btn" data-act="export">시험 기록 내보내기 (JSON)</button>
      <span id="storeNote"></span>
    </div>
  </section>

  <section id="lessonView" hidden>
    <div class="lhead">
      <div><h2 id="lTitle"></h2><p id="lPlace"></p></div>
      <div class="modes" role="group" aria-label="보기 방식">
        <button type="button" data-mode="tour" aria-pressed="true">투어</button>
        <button type="button" data-mode="review" aria-pressed="false">복습</button>
        <button type="button" data-mode="test" aria-pressed="false">시험</button>
      </div>
    </div>
    <div class="lbody">
      <div class="stagecol">
        <div class="stagewrap">
          <div class="stage" id="stage">
            <img id="pic" alt="" decoding="async" draggable="false">
            <div class="ph" id="ph" hidden></div>
            <svg id="dim" viewBox="0 0 16 9" preserveAspectRatio="none" aria-hidden="true">
              <defs><mask id="holes" maskUnits="userSpaceOnUse" x="0" y="0" width="16" height="9">
                <rect id="maskBase" x="0" y="0" width="16" height="9" fill="#fff"/><g id="holeG"></g>
              </mask></defs>
              <rect class="shade" id="shade" x="0" y="0" width="16" height="9" mask="url(#holes)"/>
              <g class="rings" id="ringG"></g>
            </svg>
            <div class="hots" id="hots" hidden></div>
          </div>
        </div>

        <div class="ctrl" id="tourCtrl">
          <div class="row nav">
            <button type="button" class="btn" data-act="prev">← 이전</button>
            <span class="count" id="tCount"></span>
            <button type="button" class="btn primary" data-act="next">다음 →</button>
          </div>
          <div class="dots" id="tDots"></div>
          <div class="keys">←/→ 정거장 · 스페이스 자동 넘김</div>
        </div>
        <div class="ctrl" id="reviewCtrl" hidden>
          <div class="row nav">
            <button type="button" class="btn" data-act="rprev">← 앞 물건</button>
            <span class="count" id="rCount"></span>
            <button type="button" class="btn" data-act="rnext">뒤 물건 →</button>
          </div>
          <div class="keys">그림에서 물건을 누르면 사실이 뜬다 · ←/→ 차례로</div>
        </div>
        <div class="ctrl" id="testCtrl" hidden>
          <div class="row" id="tsAsk"><button type="button" class="btn primary grow" data-act="reveal">떠올렸으면 보기 <kbd>스페이스</kbd></button></div>
          <div class="row" id="tsJudge" hidden>
            <button type="button" class="btn bad grow" data-act="wrong">틀렸다 <kbd>←</kbd></button>
            <button type="button" class="btn good grow" data-act="right">맞았다 <kbd>→</kbd></button>
          </div>
          <div class="row" id="tsDone" hidden>
            <button type="button" class="btn primary grow" data-act="retest">다시 시험</button>
            <button type="button" class="btn grow" data-act="export">기록 내보내기 (JSON)</button>
          </div>
        </div>
      </div>

      <div class="side">
        <article class="card" id="tourCard">
          <div class="meta"><span class="badge" id="tBadge"></span><span id="tObj"></span></div>
          <p class="fact" id="tFact"></p>
          <p class="hook" id="tHook"><b>고리</b><span></span></p>
          <p class="say" id="tSay"></p>
          <p class="src" id="tSrc" hidden></p>
        </article>
        <div class="card opts" id="tourOpts">
          <button type="button" class="btn" data-act="auto" aria-pressed="false">자동 넘김</button>
          <button type="button" class="btn" data-act="voice" aria-pressed="true">내레이션</button>
          <button type="button" class="btn" data-act="replay" id="replayBtn">다시 듣기</button>
          <label class="rate">속도 <input id="rate" type="range" min="0.8" max="1.4" step="0.1" value="1"><output id="rateOut">1.0×</output></label>
          <p class="hint" id="ttsNote" hidden>이 브라우저는 읽어 주기(speechSynthesis)를 지원하지 않는다.</p>
        </div>

        <article class="card" id="reviewCard" hidden>
          <p class="hint" id="rHint">그림에서 물건을 눌러 보세요. 상자 테두리는 숨겨져 있다.</p>
          <div id="rBody" hidden>
            <div class="meta"><span class="badge station" id="rBadge"></span><span id="rObj"></span></div>
            <p class="fact" id="rFact"></p>
            <p class="hook" id="rHook"><b>고리</b><span></span></p>
          </div>
        </article>

        <article class="card" id="testCard" hidden>
          <div class="meta"><span class="badge station" id="sBadge"></span><span id="sProg"></span></div>
          <div id="sAsk"><p class="hint">밝혀진 자리에 무엇이 있었나? 사실을 떠올린 뒤 「보기」를 누른다.</p></div>
          <div id="sShow" hidden>
            <p class="meta" id="sObj"></p>
            <p class="fact" id="sFact"></p>
            <p class="hook" id="sHook"><b>고리</b><span></span></p>
          </div>
          <div id="sDone" hidden>
            <p class="score" id="sScore"></p>
            <p class="hint" id="sSaved"></p>
            <ul class="wrong" id="sWrong"></ul>
            <p class="past" id="sPast"></p>
          </div>
        </article>
      </div>
    </div>
  </section>
</main>
<script id="lessons-data" type="application/json">[{"id":"hist-01","title":"漢·晉 — 四大經典과 첫 정리자들","place":"한옥 서당 — 漢(한) 소리 = 한옥 · 經典 읽는 서당","image":"images/lessons/hist-01.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"한옥 서당 마당","fact":"漢·晉 — 四大經典이 서고, 그것을 처음 정리한 사람들","hook":"한옥(漢) 서당 = 經典을 읽는 漢·晉의 공부방","say":"漢에서 晉까지, 한옥 서당 마당이다. 漢의 「한」 소리를 따서 한옥이고, 經典을 읽는 서당이다. 왼쪽 대문에서 오른쪽 끝까지 대체로 시대 순서다. 금메달은 교재가 「최초」라고 한 책이다.","box":null,"src":[]},{"n":1,"obj":"대청을 받친 굵은 기둥 넷","fact":"四大經典 = 黃帝內經 · 神農本草經 · 傷寒論 · 金匱要略","hook":"기둥 넷 = 한의학을 받치는 經典 넷","say":"먼저 대청을 받친 굵은 기둥 넷. 한의학을 떠받치는 四大經典이다. 黃帝內經, 神農本草經, 傷寒論, 金匱要略 — 넷 모두 이 마당 어딘가에 다시 나온다.","box":[[480,160,68,480],[906,160,68,480],[1388,160,70,480],[1808,160,70,480]],"src":["UH-NJ-01"]},{"n":2,"obj":"노란 옷 흰 수염 노인 인형을 받쳐 든 선비 · 바닥의 두루마리","fact":"『黃帝內經』 — 현존 最古 의서 · 西漢 완성(黃帝에 依託) · 素問 9권 + 靈樞 9권","hook":"노란(黃) 옷 노인 인형 = 黃帝의 이름을 빌림(依託) · 두루마리 = 素問·靈樞","say":"대청 왼쪽, 선비가 노란 옷의 흰 수염 노인 인형을 받쳐 들었다. 노란(黃) 옷의 黃帝가 직접 쓴 것이 아니라 西漢 사람들이 그 이름에 기대어(依託) 엮은 『黃帝內經』, 현존하는 가장 오래된 의서다. 바닥의 두루마리는 素問 9권과 靈樞(鍼經) 9권이다.","box":[577,257,325,285],"src":["UH-NJ-02"]},{"n":3,"obj":"대문 지붕에 납작 엎드린 까치 · 머리 긁는 아이","fact":"扁鵲(秦越人) 『難經』 — 內經의 어려운 곳을 81개 문답으로 풀었다","hook":"납작할 편(扁) + 까치 작(鵲) = 扁鵲 · 머리 긁는 문제 = 難(어려울 난)","say":"대문 지붕에 납작 엎드린 까치 — 납작할 扁, 까치 鵲, 扁鵲이다. 본명은 秦越人. 까치가 내민 문제에 아이가 머리를 긁는다. 內經의 어려운(難) 곳을 묻고 답하며 다시 푼 『難經』, 문제가 81개라 81難이라 한다.","box":[[45,115,320,135],[390,490,105,215]],"src":["UH-NAN-01"]},{"n":4,"obj":"오른쪽 문짝에만 붉은 등 · 문지방에서 저절로 울리는 북 · 벽의 빈 액자 셋","fact":"難經 臟腑설 — 左腎爲腎·右腎爲命門 · 腎間動氣 · 三焦는 有名而無形","hook":"오른쪽 문 = 右腎 命門 · 두 짝 사이 북 = 腎間動氣 · 빈 액자 셋 = 이름만 있고 꼴이 없는 三焦","say":"대문 두 짝을 보자. 왼쪽은 그냥 문, 오른쪽 문에만 붉은 등이 켜졌다 — 왼쪽 腎은 腎, 오른쪽 腎은 命門이다. 두 짝 사이 문지방에서 북이 저절로 울린다, 두 腎 사이의 腎間動氣. 벽의 빈 액자 셋은 이름만 있고 꼴이 없는 三焦다. 『難經』은 三焦를 元氣之別使라 하고 臟腑의 表裏도 정리했다.","box":[0,340,385,440],"src":["UH-NAN-03","UHG-067","UHG-067-M01","UHG-067-M02","UHG-067-M03","UHG-067-M04"]},{"n":5,"obj":"풀잎 망토를 두르고 약초를 씹는 농부 신 · 3단 선반 · 금메달","fact":"『神農本草經』 — 최초의 藥物學서 · 365종 · 上·中·下 三品","hook":"약초 씹는 농부 신 = 神農 · 3단 선반 = 三品 · 금메달 = 최초","say":"풀잎 망토의 농부 신이 약초를 맛본다, 神農이다. 『神農本草經』은 최초의 藥物學 전문서로 365종을 실었다. 곁의 3단 선반처럼 上品(養命)·中品(養性)·下品(治病) 三品으로 나눴다. 성립 시기는 교재에 따라 秦漢 또는 東漢으로 적는다.","box":[355,710,375,410],"src":["BC-SA-01","UH-BC-01-01","UH-BC-01-02"]},{"n":6,"obj":"대청 한가운데 앉아 처방 쪽지를 건네는 사람 · 담요 쓴 환자들 · 책상에 걸린 금메달","fact":"張仲景(東漢) 『傷寒雜病論』 — 辨證論治를 쓴 최초의 임상서 · 方書之祖","hook":"한가운데(仲) 앉은 사람 = 張仲景 · 담요 쓴 환자 = 傷寒(추위에 상함) · 처방 쪽지 = 方書之祖 · 금메달 = 최초","say":"대청 한가운데(仲)에 앉은 사람, 張仲景이다. 담요를 둘러쓴 傷寒 환자들 곁에서 처방 쪽지를 건넨다. 『傷寒雜病論』은 脈과 證을 함께 보아 辨證論治를 쓴 최초의 임상 전문서이고, 처방서의 조상이라 方書之祖라 한다.","box":[968,290,430,262],"src":["UH-SH-01","BZ-BY-01","BZ-BY-06-M01","UH-SH-03"]},{"n":7,"obj":"여섯 단 사다리 · 칸이 셋인 금 궤짝","fact":"傷寒論 = 以六經統百病 · 金匱要略 = 千般疢難 不越三條","hook":"사다리 여섯 단 = 六經 · 금 궤짝(金匱) 세 칸 = 三條","say":"원님 오른쪽에 여섯 단 사다리. 『傷寒論』은 모든 병을 六經 여섯 단계로 거느린다 — 以六經統百病. 곁의 금 궤짝(金匱)은 칸이 셋, 『金匱要略』의 「千般疢難 不越三條」다. 이 세 갈래가 뒤에 三因學說로 이어진다.","box":[1480,215,310,350],"src":["UH-SH-02"]},{"n":8,"obj":"가슴에 붉은 꽃 단 의사가 끓는 사발을 든 곁에 잠든 환자 · 탁자의 칼 · 체조하는 다섯 짐승","fact":"華佗(東漢) — 麻沸散으로 마취해 開腹手術 · 五禽戲","hook":"꽃(華) = 華佗 · 끓는(沸) 사발 = 麻沸散 · 칼 = 外科 · 다섯 짐승 = 五禽戲","say":"가슴에 큰 꽃(華)을 단 의사, 華佗다. 부글부글 끓는(沸) 사발 — 麻沸散으로 환자를 재우고 칼로 배를 열었다. 뒤에서 호랑이·사슴·곰·원숭이·학이 체조한다, 다섯 짐승을 본뜬 五禽戲다.","box":[[810,675,480,445],[1235,560,575,250]],"src":["UHG-059"]},{"n":9,"obj":"손가락으로 아이 손목을 짚는 거구의 아저씨","fact":"王叔和(晉) 『脈經』 — 24脈 · 寸關尺과 臟腑의 짝 · 獨取寸口를 확정","hook":"왕(王)만 한 아저씨(叔) = 王叔和 · 손목 = 寸口(寸·關·尺)","say":"덩치가 왕(王)만 한 아저씨(叔), 晉의 王叔和다. 손목 寸口만 짚는다. 『脈經』은 脈象 24종을 적고 寸·關·尺 세 자리와 臟腑의 짝을 정해 獨取寸口를 굳혔다 — 그 근거는 『難經』이 놓았다. 『脈訣』은 高陽生의 책이니 헷갈리지 말 것.","box":[1450,760,320,355],"src":["UH-ST-02","JD-MAEK-03"]},{"n":10,"obj":"끈으로 묶은 책 두 권","fact":"王叔和가 『傷寒雜病論』을 다시 엮어 傷寒論·金匱要略 둘로 나눠 전했다","hook":"묶인 책 두 권 = 한 책을 두 책으로 나눔","say":"아저씨 곁 탁자에 책 두 권이 끈으로 묶여 있다. 흩어진 張仲景의 『傷寒雜病論』을 王叔和가 다시 엮어 『傷寒論』과 『金匱要略』 두 책으로 나눠 전했다.","box":[1670,970,215,160],"src":["UH-SH-01","UH-ST-02"]},{"n":11,"obj":"칡넝쿨 감긴 은자가 통나무를 껴안음 · 팔꿈치 뒤 주머니 · 끓는 솥","fact":"葛洪(東晉) — 『抱朴子』 · 『肘後備急方』 · 『金匱藥方』","hook":"칡(葛) = 葛洪 · 통나무(朴)를 껴안음(抱) = 抱朴子 · 팔꿈치(肘) 뒤(後) 주머니 = 肘後備急方 · 솥 = 煉丹","say":"칡넝쿨(葛)에 감긴 은자, 東晉의 葛洪이다. 다듬지 않은 통나무(朴)를 껴안았으니(抱) 『抱朴子』, 팔꿈치(肘) 뒤(後)에 찬 주머니가 급할 때 꺼내 쓰는 『肘後備急方』이다. 곁의 솥은 그가 즐긴 煉丹術, 『金匱藥方』도 그의 책이다. 『肘後百一方』은 梁의 陶弘景이 이 책을 늘린 것이다.","box":[1805,565,240,305],"src":["UHG-033","BIG-016"]},{"n":12,"kind":"review","obj":"금메달 둘 · 대청 한가운데 앉은 사람","fact":"금메달 둘 — 최초 藥物學서 神農本草經 · 최초 임상서 傷寒雜病論","hook":"금메달 = 최초 · 東漢 둘(張仲景·華佗) 다음 晉 둘(王叔和·葛洪)","say":"금메달을 다시 보자. 선반의 메달은 최초의 藥物學서 『神農本草經』, 대청 한가운데 책상에 걸린 메달은 辨證論治 최초의 임상서 『傷寒雜病論』이다. 東漢의 두 의사 張仲景·華佗 다음은 晉의 王叔和, 東晉의 葛洪이다.","box":[[680,745,45,120],[1145,462,42,90],[968,290,430,262]],"src":[]}],"has_image":true},{"id":"hist-02","title":"南北朝·隋 — 本草 정리와 「최초」의 전문서들","place":"강가 도자기 공방 마당","image":"images/lessons/hist-02.webp","w":2048,"h":1144,"design":"src/lessons/design/hist-02/","stations":[{"n":0,"kind":"frame","obj":"강가 도자기 공방 마당","fact":"南北朝·隋 — 本草를 정리하고 「최초」의 전문서들이 나온 시대","hook":"도자기 공방 마당 = 南北朝·隋의 의서들","say":"南北朝에서 隋까지, 강가의 도자기 공방 마당이다. 本草를 처음 정리한 사람과 「최초」가 붙은 전문서들이 이 마당에 모여 있다. 금메달이 달린 것은 교재가 「최초」라고 한 책이다.","box":null,"src":[]},{"n":1,"obj":"물레 앞에서 항아리를 빚는 도공","fact":"陶弘景(梁) 『本草經集注』 — 『神農本草經』과 『名醫別錄』을 합쳐 정리","hook":"도공 = 陶(질그릇 도) → 陶弘景","say":"물레 앞의 도공부터 보자. 질그릇 도(陶), 陶弘景이다. 梁나라의 陶弘景은 『神農本草經』에 『名醫別錄』을 합쳐 『本草經集注』를 지었다.","box":[144,497,461,619],"src":["UH-BC-01-01","UHG-027","BC-SA-03"]},{"n":2,"obj":"붉은 띠·검은 띠가 반반 감긴 큰 항아리","fact":"730종 — 本經 365는 붉은 글씨(朱書), 別錄 365는 검은 글씨(墨書)","hook":"두 색 반반 = 朱墨 구분, 365 + 365","say":"도공 뒤의 큰 항아리는 붉은 띠와 검은 띠가 반반이다. 本經에서 온 365종은 붉은 글씨로, 別錄에서 온 365종은 검은 글씨로 갈라 적었다. 둘을 합쳐 730종이다.","box":[29,281,348,417],"src":["UH-BC-01-01","BC-SA-03"]},{"n":3,"obj":"등에 북 고리를 두른 천둥신이 무쇠 솥에 약초를 볶음 · 솥의 금메달","fact":"雷斅 『雷公炮炙論』 — 최초의 炮製(약재 손질) 전문서","hook":"천둥신 = 雷公 · 솥에 볶기 = 炮炙 · 금메달 = 최초","say":"등에 북 고리를 두른 천둥신, 雷公이 솥에 약초를 볶는다. 굽고 볶아 약재의 성질을 바꾸는 것이 炮炙, 곧 炮製다. 솥에 걸린 금메달 — 雷斅의 『雷公炮炙論』이 최초의 炮製 전문서다.","box":[386,89,446,659],"src":["UH-ST-05-02","BC-SA-03"]},{"n":4,"obj":"서랍 많은 약장 위, 잎을 맞잡은 약초 두 포기","fact":"徐之才(北齊) 『藥對』 — 약을 짝지어 쓰는 配伍","hook":"서랍 = 徐 · 짝 = 藥對","say":"가운데 서랍 많은 약장, 「서랍」의 서가 徐之才다. 그 위 약초 두 포기가 잎을 맞잡고 짝을 지었다. 약을 짝지어 쓰는 配伍를 다룬 北齊 徐之才의 『藥對』다.","box":[817,108,345,537],"src":["UHG-036","BJ-SA-04"]},{"n":5,"obj":"줄자를 목에 감고 떠나는 도깨비 · 떨어진 쪽지와 금메달 · 외과 칼","fact":"『劉涓子鬼遺方』 — 현존 최초의 外科 전문서(귀신이 남긴 처방)","hook":"도깨비(鬼)가 남긴(遺) 처방(方) · 칼 = 外科 · 유연한 자 = 劉涓子","say":"도깨비가 쪽지를 떨어뜨리고 슬금슬금 간다. 귀신이 남기고 간 처방, 『鬼遺方』이다. 곁의 칼은 外科, 쪽지 위 금메달은 현존 최초의 外科 전문서라는 뜻이다. 목에 감은 말랑한 줄자, 「유연한 자」가 劉涓子다.","box":[823,665,590,397],"src":["UH-ST-04","BJ-SA-02"]},{"n":6,"obj":"쪽지 빼곡한 책을 든 선생 · 한꺼번에 일어선 학생들과 넘어진 걸상 넷","fact":"全元起(梁) 『內經訓解』 — 『素問』에 처음으로 주석을 달았다","hook":"전원 기립 = 全元起 · 쪽지 붙은 책 = 주석","say":"선생이 쪽지가 빼곡한 책을 들자 학생들이 전원 기립했다. 걸상이 다 넘어졌다 — 全元起다. 梁나라 全元起는 『素問』에 처음으로 주석을 달아 『內經訓解』를 지었다. 교재가 「최초」를 달지 않아 금메달은 없다.","box":[1137,406,770,446],"src":[]},{"n":7,"obj":"무늬가 저마다 다른 알이 든 사람만 한 둥지 · 금메달","fact":"巢元方(隋) 『諸病源候論』 — 최초의 病因·病機·證候 전문서","hook":"둥지 = 巢 · 무늬 다른 알 = 여러 병의 근원(源)과 증후(候)","say":"사람만 한 둥지, 새집 소(巢) — 巢元方이다. 알마다 겉무늬가 다르다. 여러 병의 속(源)과 겉으로 드러난 증후(候)를 가른 『諸病源候論』, 隋나라의 최초 病因·病機 전문서다.","box":[1249,248,463,273],"src":["UH-ST-04"]},{"n":8,"obj":"꼭대기에 크고 흰 천이 여러 갈래로 걸린 버드나무 · 금메달","fact":"楊上善(隋) 『黃帝內經太素』 — 內經을 분류·재편한 최초의 분류 주석","hook":"버드나무 = 楊 · 꼭대기 = 上 · 크고(太) 흰(素) 천 · 갈래 = 분류","say":"강가 버드나무(楊) 꼭대기(上)에 크고 흰 천이 걸렸다 — 楊上善, 크고(太) 흰(素) 『太素』다. 천이 여러 갈래로 갈라진 것처럼 內經을 항목별로 갈라 다시 엮었다. 최초의 분류 주석이다.","box":[1566,0,481,554],"src":["UH-NJ-03"]},{"n":9,"obj":"파도무늬 표지의 큰 책에 끼워진 낡은 책 두 권","fact":"『百濟新集方』·『新羅法師方』 — 失傳, 일본 『醫心方』(984)에 인용되어 전함","hook":"파도무늬 책 = 일본 醫心方 · 끼워진 두 권 = 百濟·新羅 의서","say":"앞쪽 탁자 위, 파도무늬 표지의 큰 책은 일본의 『醫心方』(984)이다. 그 안에 끼워진 낡은 두 권이 百濟의 『百濟新集方』과 新羅의 『新羅法師方』이다. 본디 책은 사라지고 이 책에 인용되어서만 전한다.","box":[1422,838,625,306],"src":["UHG-018"]},{"n":10,"kind":"review","obj":"금메달 넷과 선생","fact":"「최초」 넷 — 炮製 雷公炮炙論 · 外科 鬼遺方 · 病因 諸病源候論 · 분류 주석 太素","hook":"금메달 = 최초 · 『素問』 첫 주석은 全元起(메달 없음)","say":"금메달을 다시 보자. 솥은 최초의 炮製서, 쪽지는 최초의 外科서, 둥지는 최초의 病因서, 버드나무는 최초의 분류 주석이다. 금메달은 없지만 『素問』에 처음 주석을 단 사람은 전원 기립의 全元起다.","box":[[734,544,75,78],[1235,915,140,85],[1595,426,78,89],[1600,170,66,78],[1137,406,237,443]],"src":[]}],"has_image":true}]</script>
<script>
// 한의학 Sketchy 과 재생기 — 과 목록 · 투어 · 복습 · 시험. build_player.py가 lessons.html에 끼워 넣는다.
(function () {
  'use strict';

  var LESSONS = JSON.parse(document.getElementById('lessons-data').textContent);
  var byId = Object.create(null);
  LESSONS.forEach(function (L) { byId[L.id] = L; });

  var KEY = 'sketchy_lessons_v1';          // { <과id>: [{date, score, total, wrong:[n…]}] }
  var PKEY = 'sketchy_lessons_prefs_v1';   // { rate, voice } — 이 브라우저만의 편의 설정
  var MODES = ['tour', 'review', 'test'];

  function $(id) { return document.getElementById(id); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---------- 저장소 (막혀 있어도 페이지는 돈다) ----------
  var memResults = null, storeBroken = false;
  function readResults() {
    if (storeBroken && memResults) return memResults;
    try {
      var raw = localStorage.getItem(KEY);
      var o = raw ? JSON.parse(raw) : {};
      if (o && typeof o === 'object' && !Array.isArray(o)) return o;
    } catch (e) { storeBroken = true; }
    return memResults || {};
  }
  function pushResult(id, rec) {
    var all = readResults();
    if (!Array.isArray(all[id])) all[id] = [];
    all[id].push(rec);
    memResults = all;
    try { localStorage.setItem(KEY, JSON.stringify(all)); return true; }
    catch (e) { storeBroken = true; return false; }
  }
  var prefs = { rate: 1, voice: true };
  try {
    var p = JSON.parse(localStorage.getItem(PKEY) || '{}') || {};
    if (typeof p.rate === 'number') prefs.rate = clamp(Math.round(p.rate * 10) / 10, 0.8, 1.4);
    if (p.voice === false) prefs.voice = false;
  } catch (e) { /* 기본값 */ }
  function savePrefs() { try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch (e) { /* 무시 */ } }

  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return String(iso || '');
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  }
  function exportResults() {
    var all = readResults();
    var blob = new Blob([JSON.stringify(all, null, 1) + '\n'], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sketchy_lessons_v1_' + fmtDate(new Date().toISOString()).replace(/-/g, '') + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  // ---------- 정거장 ----------
  function kindOf(st) { return st.kind === 'frame' || st.kind === 'review' ? st.kind : 'station'; }
  function boxesOf(st) {
    var b = st.box;
    if (!Array.isArray(b) || !b.length) return [];
    if (typeof b[0] === 'number') return b.length === 4 ? [b] : [];
    return b.filter(function (x) { return Array.isArray(x) && x.length === 4; });
  }
  function contentIdx(L) {
    var out = [];
    L.stations.forEach(function (st, i) { if (kindOf(st) === 'station' && boxesOf(st).length) out.push(i); });
    return out;
  }

  // ---------- 읽어 주기 (speechSynthesis, ko-KR) ----------
  var gestured = false;
  ['pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () { gestured = true; }, true);
  });
  function activated() {
    if (navigator.userActivation) return navigator.userActivation.hasBeenActive || gestured;
    return gestured;
  }
  var tts = {
    ok: 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function',
    voice: null, token: 0,
    pick: function () {
      if (!this.ok) return;
      var vs = window.speechSynthesis.getVoices() || [];
      var ko = vs.filter(function (v) { return /^ko([-_]|$)/i.test(v.lang || ''); });
      this.voice = ko.filter(function (v) { return v.localService; })[0] || ko[0] || null;
    },
    speak: function (text, rate, done) {
      this.stop();
      var my = ++this.token, self = this;
      var parts = (String(text).match(/[^.!?。…]+[.!?。…]*\s*/g) || [String(text)])
        .map(function (s) { return s.trim(); }).filter(Boolean);
      var i = 0;
      function next() {
        if (my !== self.token) return;
        if (i >= parts.length) { done(true); return; }
        try {
          var u = new SpeechSynthesisUtterance(parts[i++]);
          u.lang = 'ko-KR';
          if (self.voice) { try { u.voice = self.voice; } catch (e) { /* lang만으로 */ } }
          u.rate = rate;
          u.onend = next;
          u.onerror = function () { if (my === self.token) done(false); };
          window.speechSynthesis.speak(u);
        } catch (e) { done(false); }
      }
      next();
    },
    stop: function () {
      this.token++;
      if (this.ok) { try { window.speechSynthesis.cancel(); } catch (e) { /* 무시 */ } }
    }
  };
  if (tts.ok) {
    tts.pick();
    try { window.speechSynthesis.addEventListener('voiceschanged', function () { tts.pick(); }); } catch (e) { /* 옛 브라우저 */ }
  }

  // ---------- 상태 ----------
  var S = { L: null, mode: 'tour', i: 0, auto: false, heard: -1, speaking: false, sel: -1, test: null };
  var autoTimer = 0, safetyTimer = 0;

  // ---------- 그림 · 덮개 ----------
  var stage = $('stage'), pic = $('pic'), ph = $('ph'), svg = $('dim');
  var SVGNS = 'http://www.w3.org/2000/svg';
  function mountStage(L) {
    stage.style.setProperty('--w', L.w);
    stage.style.setProperty('--h', L.h);
    svg.setAttribute('viewBox', '0 0 ' + L.w + ' ' + L.h);
    ['holes', 'maskBase', 'shade'].forEach(function (id) {
      var el = $(id); el.setAttribute('width', L.w); el.setAttribute('height', L.h);
    });
    ph.textContent = '그림 준비 중 — ' + L.image;
    pic.alt = L.title + ' — ' + (L.place || '');
    pic.onerror = function () { pic.hidden = true; ph.hidden = false; };
    pic.onload = function () { pic.hidden = false; ph.hidden = true; };
    if (L.has_image === false) {
      pic.removeAttribute('src'); pic.hidden = true; ph.hidden = false;
    } else if (pic.getAttribute('src') !== L.image) {
      ph.hidden = true; pic.hidden = false; pic.src = L.image;
    }
    buildHots(L);
  }
  function svgRect(b, cls, extra) {
    var r = document.createElementNS(SVGNS, 'rect');
    r.setAttribute('x', b[0]); r.setAttribute('y', b[1]);
    r.setAttribute('width', b[2]); r.setAttribute('height', b[3]);
    r.setAttribute('rx', 10);
    if (cls) r.setAttribute('class', cls);
    if (extra) Object.keys(extra).forEach(function (k) { r.setAttribute(k, extra[k]); });
    return r;
  }
  function setHoles(boxes) {
    var holeG = $('holeG'), ringG = $('ringG');
    holeG.textContent = '';
    var fresh = ringG.cloneNode(false);           // 새 노드 → 밝힘 애니메이션 다시
    boxes.forEach(function (b) {
      holeG.appendChild(svgRect(b, null, { fill: '#000' }));
      fresh.appendChild(svgRect(b, 'ring-o', { 'vector-effect': 'non-scaling-stroke' }));
      fresh.appendChild(svgRect(b, 'ring', { 'vector-effect': 'non-scaling-stroke' }));
    });
    ringG.parentNode.replaceChild(fresh, ringG);
    stage.classList.toggle('dim', boxes.length > 0);
  }
  function buildHots(L) {
    var hots = $('hots');
    hots.textContent = '';
    var items = [];
    L.stations.forEach(function (st, i) {
      if (kindOf(st) !== 'station') return;
      boxesOf(st).forEach(function (b) { items.push({ i: i, n: st.n, b: b, area: b[2] * b[3] }); });
    });
    items.sort(function (a, b) { return b.area - a.area; });   // 작은 상자가 위에 오도록
    items.forEach(function (it) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'hot';
      el.dataset.i = it.i;
      el.setAttribute('aria-label', '정거장 ' + it.n);
      el.style.left = (it.b[0] / L.w * 100) + '%';
      el.style.top = (it.b[1] / L.h * 100) + '%';
      el.style.width = (it.b[2] / L.w * 100) + '%';
      el.style.height = (it.b[3] / L.h * 100) + '%';
      hots.appendChild(el);
    });
  }

  // ---------- 화면 전환 ----------
  function setText(el, t) { el.textContent = t == null ? '' : String(t); }
  function setHook(el, t) { el.hidden = !t; setText(el.querySelector('span'), t); }

  function showList(missing) {
    stopAll(); setAuto(false);
    S.L = null;
    $('lessonView').hidden = true; $('listView').hidden = false; $('homeLink').hidden = true;
    document.title = '한의학 Sketchy 과';
    var note = $('listNotice');
    note.hidden = !missing;
    if (missing) note.textContent = '과 「' + missing + '」를 찾지 못했다. 아래 목록에서 고르세요.';
    var all = readResults(), ul = $('lessonList');
    ul.textContent = '';
    if (!LESSONS.length) {
      var li0 = document.createElement('li'); li0.className = 'hint';
      li0.textContent = '과가 없다 — src/lessons/l/*.json을 넣고 build_player.py를 돌린다.';
      ul.appendChild(li0);
    }
    LESSONS.forEach(function (L) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'lcard'; a.href = '?l=' + encodeURIComponent(L.id); a.dataset.go = L.id;
      var t = document.createElement('span'); t.className = 'lc-title'; t.textContent = L.title;
      if (L.id.charAt(0) === '_') { var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = '데모'; t.appendChild(tg); }
      if (L.has_image === false) { var tg2 = document.createElement('span'); tg2.className = 'tag'; tg2.textContent = '그림 없음'; t.appendChild(tg2); }
      var pl = document.createElement('span'); pl.className = 'lc-place'; pl.textContent = L.place || '';
      var m = document.createElement('span'); m.className = 'lc-meta';
      var c = document.createElement('span'); c.textContent = '정거장 ' + L.stations.length + ' · 시험 ' + contentIdx(L).length;
      m.appendChild(c);
      var recs = Array.isArray(all[L.id]) ? all[L.id] : [];
      var r = document.createElement('span');
      if (recs.length) {
        var last = recs[recs.length - 1];
        r.className = 'rec';
        r.textContent = '마지막 시험 ' + last.score + '/' + last.total + ' · ' + fmtDate(last.date) + (recs.length > 1 ? ' (' + recs.length + '회)' : '');
      } else { r.className = 'none'; r.textContent = '시험 기록 없음'; }
      m.appendChild(r);
      a.appendChild(t); a.appendChild(pl); a.appendChild(m);
      li.appendChild(a); ul.appendChild(li);
    });
    $('storeNote').textContent = storeBroken ? '브라우저 저장소가 막혀 있어 기록은 이 탭에만 남는다.' : '';
  }

  function openLesson(id, mode) {
    var L = byId[id];
    if (S.L !== L) { stopAll(); setAuto(false); S.L = L; S.i = 0; S.sel = -1; S.heard = -1; mountStage(L); }
    $('listView').hidden = true; $('lessonView').hidden = false; $('homeLink').hidden = false;
    setText($('lTitle'), L.title);
    setText($('lPlace'), L.place ? '장소 · ' + L.place : '');
    document.title = L.title + ' — Sketchy 과';
    buildDots(L);
    setMode(mode, true);
  }

  function setMode(mode, fromRoute) {
    if (MODES.indexOf(mode) < 0) mode = 'tour';
    stopAll(); setAuto(false);
    S.mode = mode;
    document.querySelectorAll('.modes button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    });
    $('tourCtrl').hidden = $('tourCard').hidden = $('tourOpts').hidden = mode !== 'tour';
    $('reviewCtrl').hidden = $('reviewCard').hidden = mode !== 'review';
    $('testCtrl').hidden = $('testCard').hidden = mode !== 'test';
    $('hots').hidden = mode !== 'review';
    if (!fromRoute) replaceUrl(S.L.id, mode);
    if (mode === 'tour') goTour(S.i);
    else if (mode === 'review') { setHoles([]); selectReview(S.sel); }
    else startTest();
  }

  // ---------- 투어 ----------
  function buildDots(L) {
    var box = $('tDots');
    box.textContent = '';
    L.stations.forEach(function (st, i) {
      var k = kindOf(st), d = document.createElement('button');
      d.type = 'button'; d.className = 'dot ' + k; d.dataset.act = 'goto'; d.dataset.i = i;
      d.textContent = k === 'frame' ? '틀' : k === 'review' ? '↺' : st.n;
      d.setAttribute('aria-label', (k === 'frame' ? '틀' : k === 'review' ? '되짚기' : '정거장 ' + st.n) + (st.obj ? ' — ' + st.obj : ''));
      box.appendChild(d);
    });
  }
  function renderTour() {
    var L = S.L, st = L.stations[S.i], k = kindOf(st);
    setHoles(k === 'frame' ? [] : boxesOf(st));
    var bd = $('tBadge');
    bd.className = 'badge ' + k;
    bd.textContent = k === 'frame' ? '틀' : k === 'review' ? '되짚기' : '정거장 ' + st.n;
    var obj = k === 'frame' ? (L.place || st.obj) : st.obj;
    setText($('tObj'), obj === bd.textContent ? '' : obj);    // 「되짚기 되짚기」 겹침 피하기
    setText($('tFact'), st.fact);
    setHook($('tHook'), st.hook);
    setText($('tSay'), st.say);
    var src = $('tSrc'), cards = Array.isArray(st.src) ? st.src : [];
    src.hidden = !cards.length; src.textContent = cards.length ? '카드 ' + cards.join(' · ') : '';
    setText($('tCount'), (S.i + 1) + ' / ' + L.stations.length);
    document.querySelector('[data-act="prev"]').disabled = S.i === 0;
    document.querySelector('[data-act="next"]').disabled = S.i === L.stations.length - 1;
    document.querySelectorAll('#tDots .dot').forEach(function (d) {
      d.setAttribute('aria-current', String(+d.dataset.i === S.i));
    });
  }
  function goTour(i) {
    S.i = clamp(i, 0, S.L.stations.length - 1);
    renderTour();
    playStation(false);
  }
  function estimateMs(text) { return Math.max(4000, String(text || '').length * 95 / prefs.rate); }
  function clearTimers() { clearTimeout(autoTimer); clearTimeout(safetyTimer); }
  function setSpeaking(on) {
    S.speaking = on;
    setText($('replayBtn'), on ? '읽기 멈춤' : '다시 듣기');
  }
  function stopAll() { clearTimers(); tts.stop(); setSpeaking(false); }
  function afterStation() {
    clearTimers();
    if (!S.auto || S.mode !== 'tour') return;
    if (S.i >= S.L.stations.length - 1) { setAuto(false); return; }
    autoTimer = setTimeout(function () { goTour(S.i + 1); }, 900);
  }
  function playStation(force) {
    clearTimers(); tts.stop(); setSpeaking(false);
    if (S.mode !== 'tour') return;
    var st = S.L.stations[S.i];
    var text = st.say || st.fact || '', at = S.i;
    if (tts.ok && (prefs.voice || force) && activated() && text) {
      setSpeaking(true);
      tts.speak(text, prefs.rate, function () { S.heard = at; setSpeaking(false); afterStation(); });
      if (S.auto) safetyTimer = setTimeout(function () { stopAll(); afterStation(); }, estimateMs(text) * 2 + 4000);
    } else if (S.auto) {
      var shown = (st.fact || '') + (st.hook || '') + (st.say || '');
      autoTimer = setTimeout(afterStation, estimateMs(shown));
    }
  }
  function setAuto(on) {
    S.auto = !!on;
    var b = document.querySelector('[data-act="auto"]');
    if (b) b.setAttribute('aria-pressed', String(S.auto));
    if (!S.auto) { clearTimers(); return; }
    if (S.mode !== 'tour' || !S.L) return;
    if (S.i >= S.L.stations.length - 1) { goTour(0); return; }
    if (S.speaking) return;                       // 지금 읽는 것이 끝나면 넘어간다
    if (S.heard === S.i) { afterStation(); return; }   // 이미 다 들은 정거장이면 바로 다음으로
    playStation(false);
  }

  // ---------- 복습 ----------
  function selectReview(i) {
    var L = S.L;
    S.sel = i;
    document.querySelectorAll('#hots .hot').forEach(function (h) { h.classList.toggle('sel', +h.dataset.i === i); });
    var idx = contentIdx(L), pos = idx.indexOf(i);
    setText($('rCount'), (pos < 0 ? '–' : pos + 1) + ' / ' + idx.length);
    if (i < 0 || !L.stations[i]) { $('rHint').hidden = false; $('rBody').hidden = true; return; }
    var st = L.stations[i];
    $('rHint').hidden = true; $('rBody').hidden = false;
    setText($('rBadge'), '정거장 ' + st.n);
    setText($('rObj'), st.obj);
    setText($('rFact'), st.fact);
    setHook($('rHook'), st.hook);
  }
  function stepReview(d) {
    var idx = contentIdx(S.L);
    if (!idx.length) return;
    var pos = idx.indexOf(S.sel);
    pos = pos < 0 ? (d > 0 ? 0 : idx.length - 1) : (pos + d + idx.length) % idx.length;
    selectReview(idx[pos]);
  }

  // ---------- 시험 (순서대로, 틀·되짚기 제외) ----------
  function startTest() {
    var idx = contentIdx(S.L);
    S.test = { idx: idx, k: 0, phase: idx.length ? 'ask' : 'done', right: 0, wrong: [], saved: null };
    renderTest();
  }
  function renderTest() {
    var T = S.test, L = S.L;
    $('tsAsk').hidden = T.phase !== 'ask';
    $('tsJudge').hidden = T.phase !== 'shown';
    $('tsDone').hidden = T.phase !== 'done';
    $('sAsk').hidden = T.phase !== 'ask';
    $('sShow').hidden = T.phase !== 'shown';
    $('sDone').hidden = T.phase !== 'done';
    if (T.phase === 'done') {
      setHoles([]);
      setText($('sBadge'), '결과');
      setText($('sProg'), '');
      setText($('sScore'), T.idx.length ? T.right + ' / ' + T.idx.length : '시험할 정거장이 없다');
      setText($('sSaved'), T.saved === null ? '' : T.saved ? '기록을 남겼다.' : '브라우저 저장소가 막혀 기록은 이 탭에만 남는다 — 내보내기로 보관하세요.');
      var ul = $('sWrong');
      ul.textContent = '';
      T.wrong.forEach(function (n) {
        var i = -1;
        L.stations.forEach(function (st, j) { if (st.n === n && kindOf(st) === 'station') i = j; });
        if (i < 0) return;
        var st = L.stations[i], li = document.createElement('li'), b = document.createElement('button');
        b.type = 'button'; b.dataset.act = 'goto-tour'; b.dataset.i = i;
        var f = document.createElement('span'); f.className = 'wf'; f.textContent = st.n + '. ' + (st.fact || '');
        var o = document.createElement('span'); o.className = 'wo'; o.textContent = (st.obj || '') + (st.hook ? ' · ' + st.hook : '') + ' — 투어로 보기';
        b.appendChild(f); b.appendChild(o); li.appendChild(b); ul.appendChild(li);
      });
      if (T.idx.length && !T.wrong.length) {
        var ok = document.createElement('li'); ok.className = 'hint'; ok.textContent = '틀린 정거장 없음.'; ul.appendChild(ok);
      }
      var recs = (readResults()[L.id] || []).slice(-6, -1).reverse();
      setText($('sPast'), recs.length ? '지난 기록 · ' + recs.map(function (r) { return r.score + '/' + r.total + ' (' + fmtDate(r.date) + ')'; }).join(' · ') : '');
      return;
    }
    var st = L.stations[T.idx[T.k]];
    setHoles(boxesOf(st));
    setText($('sBadge'), '정거장 ' + st.n);
    setText($('sProg'), (T.k + 1) + ' / ' + T.idx.length + ' · 맞음 ' + T.right);
    if (T.phase === 'shown') {
      setText($('sObj'), st.obj);
      setText($('sFact'), st.fact);
      setHook($('sHook'), st.hook);
    }
  }
  function judge(ok) {
    var T = S.test;
    if (!T || T.phase !== 'shown') return;
    var st = S.L.stations[T.idx[T.k]];
    if (ok) T.right++; else T.wrong.push(st.n);
    T.k++;
    if (T.k >= T.idx.length) {
      T.phase = 'done';
      T.saved = pushResult(S.L.id, { date: new Date().toISOString(), score: T.right, total: T.idx.length, wrong: T.wrong.slice() });
    } else T.phase = 'ask';
    renderTest();
  }

  // ---------- 주소 ----------
  function urlFor(id, mode) {
    if (!id) return location.pathname;
    return '?l=' + encodeURIComponent(id) + (mode && mode !== 'tour' ? '&m=' + mode : '');
  }
  function pushUrl(id, mode) {
    try { history.pushState(null, '', urlFor(id, mode)); route(); }
    catch (e) { location.href = urlFor(id, mode); }
  }
  function replaceUrl(id, mode) {
    try { history.replaceState(null, '', urlFor(id, mode)); } catch (e) { /* file:// 등 */ }
  }
  function route() {
    var q = new URLSearchParams(location.search);
    var id = q.get('l');
    if (id && byId[id]) openLesson(id, q.get('m') || 'tour');
    else showList(id || null);
  }
  window.addEventListener('popstate', route);

  // ---------- 입력 ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('a[data-go], [data-act], [data-mode], .hot');
    if (!t) return;
    if (t.matches('a[data-go]')) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault(); pushUrl(t.dataset.go, 'tour'); return;
    }
    if (t.tagName === 'BUTTON' && e.detail > 0) t.blur();   // 마우스로 누른 뒤 스페이스가 단추를 다시 누르지 않게
    if (t.classList.contains('hot')) { selectReview(+t.dataset.i); return; }
    if (t.dataset.mode) { if (t.dataset.mode !== S.mode) setMode(t.dataset.mode); return; }
    switch (t.dataset.act) {
      case 'export': exportResults(); break;
      case 'prev': goTour(S.i - 1); break;
      case 'next': goTour(S.i + 1); break;
      case 'goto': goTour(+t.dataset.i); break;
      case 'goto-tour': S.i = +t.dataset.i; setMode('tour'); break;
      case 'auto': setAuto(!S.auto); break;
      case 'voice':
        prefs.voice = !prefs.voice; savePrefs();
        t.setAttribute('aria-pressed', String(prefs.voice));
        if (prefs.voice) playStation(false); else { stopAll(); if (S.auto) playStation(false); }
        break;
      case 'replay': if (S.speaking) { setAuto(false); stopAll(); } else playStation(true); break;
      case 'rprev': stepReview(-1); break;
      case 'rnext': stepReview(1); break;
      case 'reveal': if (S.test && S.test.phase === 'ask') { S.test.phase = 'shown'; renderTest(); } break;
      case 'right': judge(true); break;
      case 'wrong': judge(false); break;
      case 'retest': startTest(); break;
    }
  });
  $('homeLink').addEventListener('click', function (e) {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault(); pushUrl(null);
  });
  var rate = $('rate');
  function showRate() { setText($('rateOut'), prefs.rate.toFixed(1) + '×'); }
  rate.value = prefs.rate; showRate();
  rate.addEventListener('input', function () { prefs.rate = clamp(+rate.value, 0.8, 1.4); showRate(); });
  rate.addEventListener('change', function () { savePrefs(); if (S.speaking) playStation(true); });
  document.querySelector('[data-act="voice"]').setAttribute('aria-pressed', String(prefs.voice));
  if (!tts.ok) {
    $('ttsNote').hidden = false;
    ['voice', 'replay'].forEach(function (a) { document.querySelector('[data-act="' + a + '"]').disabled = true; });
    rate.disabled = true;
  }

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || !S.L || $('lessonView').hidden) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    var k = e.key, space = k === ' ' || k === 'Spacebar';
    if (space && tag === 'BUTTON') return;                    // 키보드로 고른 단추는 제 일을 한다
    if (!space && k !== 'ArrowLeft' && k !== 'ArrowRight') return;
    e.preventDefault();
    if (S.mode === 'tour') {
      if (k === 'ArrowLeft') goTour(S.i - 1);
      else if (k === 'ArrowRight') goTour(S.i + 1);
      else setAuto(!S.auto);
    } else if (S.mode === 'review') {
      if (!space) stepReview(k === 'ArrowLeft' ? -1 : 1);
    } else if (S.test) {
      if (S.test.phase === 'ask' && space) { S.test.phase = 'shown'; renderTest(); }
      else if (S.test.phase === 'shown' && !space) judge(k === 'ArrowRight');
    }
  });

  route();
})();

</script>
</body>
</html>
