한 노래 열 곡의 표지가 윗줄 다섯, 아랫줄 다섯으로 떴다. 노래, 歌 — 묻는 순서를 노래로 외운 十問歌다. 윗줄 왼쪽에서 오른쪽으로 첫째부터 다섯째, 아랫줄 왼쪽에서 오른쪽으로 여섯째부터 열째. 표지의 차례가 곧 물음의 차례다.","box":null,"src":[],"tts":"보랏빛 노래방. 벽의 큰 화면에 예약한 노래 열 곡의 표지가 윗줄 다섯, 아랫줄 다섯으로 떴다. 노래, 가, 묻는 순서를 노래로 외운 십문가다. 윗줄 왼쪽에서 오른쪽으로 첫째부터 다섯째, 아랫줄 왼쪽에서 오른쪽으로 여섯째부터 열째. 표지의 차례가 곧 물음의 차례다."},{"n":1,"obj":"윗줄 첫째 표지 — 파란 얼음 조각과 빨간 불꽃","fact":"一問 寒熱 — 첫째로 오한과 발열을 묻는다","hook":"얼음과 불 = 寒熱","say":"윗줄 첫째 표지에 얼음 조각과 불꽃이 나란하다. 첫째로 추위와 열을 묻는다 — 一問寒熱. 추운가, 열이 나는가, 둘이 함께인가, 번갈아 오는가. 十問歌의 앞 네 구는 一問寒熱二問汗, 三問頭身四問便, 五問飮食六問胸, 七聾八渴俱當辨이다.","box":[159,223,245,252],"src":["JD-MOON-01"],"tts":"윗줄 첫째 표지에 얼음 조각과 불꽃이 나란하다. 첫째로 추위와 열을 묻는다, 일문한열. 추운가, 열이 나는가, 둘이 함께인가, 번갈아 오는가. 십문가의 앞 네 구는 일문한열이문한, 삼문두신사문변, 오문음식륙문흉, 칠롱팔갈구당변이다."},{"n":2,"obj":"윗줄 둘째 표지 — 굵은 물방울(땀)","fact":"二問 汗 — 둘째로 땀을 묻는다","hook":"땀방울 = 汗","say":"윗줄 둘째 표지는 굵은 땀방울이다. 둘째로 땀을 묻는다 — 二問汗. 땀이 나는가, 언제, 어디서, 얼마나.","box":[428,223,245,252],"src":[],"tts":"윗줄 둘째 표지는 굵은 땀방울이다. 둘째로 땀을 묻는다, 이문한. 땀이 나는가, 언제, 어디서, 얼마나."},{"n":3,"obj":"윗줄 셋째 표지 — 머리가 아파 찡그린 아이(번개 같은 통증 표시)","fact":"三問 頭身 — 셋째로 머리와 몸을 묻는다","hook":"아픈 머리와 몸 = 頭身","say":"윗줄 셋째 표지는 머리가 아파 찡그린 아이다. 셋째로 머리와 몸을 묻는다 — 三問頭身. 머리가 아픈가, 어지러운가, 몸이 쑤시는가.","box":[699,223,245,252],"src":[],"tts":"윗줄 셋째 표지는 머리가 아파 찡그린 아이다. 셋째로 머리와 몸을 묻는다, 삼문두신. 머리가 아픈가, 어지러운가, 몸이 쑤시는가."},{"n":4,"obj":"윗줄 넷째 표지 — 하얀 변기","fact":"四問 便 — 넷째로 대소변을 묻는다","hook":"변기 = 便","say":"윗줄 넷째 표지는 하얀 변기다. 넷째로 대변과 소변을 묻는다 — 四問便.","box":[969,223,242,252],"src":[],"tts":"윗줄 넷째 표지는 하얀 변기다. 넷째로 대변과 소변을 묻는다, 사문변."},{"n":5,"obj":"윗줄 다섯째 표지 — 김 나는 국수 그릇과 컵","fact":"五問 飮食 — 다섯째로 먹고 마시는 것을 묻는다","hook":"국수와 컵 = 飮食","say":"윗줄 다섯째 표지는 김 나는 국수와 컵이다. 다섯째로 먹고 마시는 것을 묻는다 — 五問飮食. 입맛, 먹는 양, 좋아하는 맛.","box":[1237,223,244,252],"src":[],"tts":"윗줄 다섯째 표지는 김 나는 국수와 컵이다. 다섯째로 먹고 마시는 것을 묻는다, 오문음식. 입맛, 먹는 양, 좋아하는 맛."},{"n":6,"obj":"아랫줄 첫째(여섯째) 표지 — 두 손을 댄 가슴과 명치","fact":"六問 胸 — 여섯째로 가슴을 묻는다","hook":"가슴을 짚은 두 손 = 胸","say":"아랫줄 첫째, 곧 여섯째 표지는 두 손을 댄 가슴과 명치다. 여섯째로 가슴을 묻는다 — 六問胸. 가슴이 답답한가, 두근거리는가, 아픈가.","box":[159,502,245,251],"src":[],"tts":"아랫줄 첫째, 곧 여섯째 표지는 두 손을 댄 가슴과 명치다. 여섯째로 가슴을 묻는다, 육문흉. 가슴이 답답한가, 두근거리는가, 아픈가."},{"n":7,"obj":"아랫줄 둘째(일곱째) 표지 — 손을 오므려 귀 뒤에 댄 큰 귀","fact":"七問 聾 — 일곱째가 귀(聾) — 七聾八渴이 한 구라 자주 샌다","hook":"잘 안 들려 귀 뒤에 손을 댐 = 聾","say":"아랫줄 둘째, 곧 일곱째 표지는 큰 귀다. 잘 안 들려 손을 오므려 귀 뒤에 댔다. 일곱째로 귀가 먹먹한지, 울리는지 묻는다 — 七問聾. 「七聾八渴俱當辨」 한 구에 일곱째와 여덟째가 함께 들어 있어 일곱째가 귀라는 것이 자주 샌다.","box":[428,502,245,251],"src":[],"tts":"아랫줄 둘째, 곧 일곱째 표지는 큰 귀다. 잘 안 들려 손을 오므려 귀 뒤에 댔다. 일곱째로 귀가 먹먹한지, 울리는지 묻는다, 칠문롱. 칠롱팔갈구당변 한 구에 일곱째와 여덟째가 함께 들어 있어 일곱째가 귀라는 것이 자주 샌다."},{"n":8,"obj":"아랫줄 셋째(여덟째) 표지 — 물 잔에 대고 핥는 혀","fact":"八問 渴 — 여덟째로 목마름을 묻는다","hook":"물 잔을 핥는 혀 = 목마름(渴)","say":"아랫줄 셋째, 곧 여덟째 표지는 물 잔에 대고 핥는 혀다. 목이 탄다. 여덟째로 목마름을 묻는다 — 八問渴. 목이 마른가, 마시고 싶은가, 무엇을 마시고 싶은가.","box":[699,502,245,251],"src":[],"tts":"아랫줄 셋째, 곧 여덟째 표지는 물 잔에 대고 핥는 혀다. 목이 탄다. 여덟째로 목마름을 묻는다, 팔문갈. 목이 마른가, 마시고 싶은가, 무엇을 마시고 싶은가."},{"n":9,"obj":"아랫줄 넷째(아홉째) 표지 — 낡은 붕대를 감은 나무 목발","fact":"九問 舊病 — 아홉째로 예전에 앓은 병을 묻는다","hook":"낡은 붕대의 목발 = 舊病","say":"아랫줄 넷째, 곧 아홉째 표지는 낡은 붕대를 감은 나무 목발이다. 아홉째로 예전에 앓은 병을 묻는다 — 九問舊病.","box":[969,502,242,251],"src":[],"tts":"아랫줄 넷째, 곧 아홉째 표지는 낡은 붕대를 감은 나무 목발이다. 아홉째로 예전에 앓은 병을 묻는다, 구문구병."},{"n":10,"obj":"아랫줄 다섯째(열째) 표지 — 돋보기","fact":"十問 因 — 열째로 병의 원인을 묻는다","hook":"돋보기로 원인을 찾음 = 因","say":"아랫줄 다섯째, 곧 열째 표지는 돋보기다. 열째로 병이 생긴 까닭을 묻는다 — 十問因.","box":[1237,502,244,251],"src":[],"tts":"아랫줄 다섯째, 곧 열째 표지는 돋보기다. 열째로 병이 생긴 까닭을 묻는다, 십문인."},{"n":11,"obj":"탁자 위 — 두툼하고 낡은 갈색 책 · 얇고 새 노래책","fact":"出典 — 張景岳 『景岳全書』 十問篇 원문 ↔ 陳修園 『醫學實在易』의 고친 통용판","hook":"두꺼운 옛 책 = 張景岳 원문 · 얇은 새 노래책 = 陳修園의 통용판","say":"탁자에 두툼하고 낡은 책과 얇고 새 노래책이 나란하다. 十問歌는 판이 둘이다. 두꺼운 옛 책은 張景岳의 『景岳全書』 十問篇 원문이다 — 여덟째까지는 같고, 「九因脈色察陰陽, 十從氣味章神見」으로 끝난다. 얇은 새 노래책은 陳修園이 『醫學實在易』에서 고친 판이다 — 「九問舊病十問因, 再兼服藥參機變」으로 이어진다. 지금 통용되는 것은 陳修園의 판이고, 시험 카드도 이 판으로 묻는다.","box":[[314,896,453,231],[783,948,272,164]],"src":[],"tts":"탁자에 두툼하고 낡은 책과 얇고 새 노래책이 나란하다. 십문가는 판이 둘이다. 두꺼운 옛 책은 장경악의 경악전서 십문편 원문이다, 여덟째까지는 같고, 구인맥색찰음양, 십종기미장신견으로 끝난다. 얇은 새 노래책은 진수원이 의학실재이에서 고친 판이다, 구문구병십문인, 재겸복약참기변으로 이어진다. 지금 통용되는 것은 진수원의 판이고, 시험 카드도 이 판으로 묻는다."},{"n":12,"obj":"소파의 젊은 엄마가 든 달 모양 달력 · 곁의 아이가 내민 집게손가락의 보랏빛 핏줄","fact":"婦女尤必問經期 遲速閉崩 · 再添片語告兒科 — 經帶胎産 · 小兒 虎口三關指紋","hook":"달의 차고 기움 = 月經 · 아이 손가락 핏줄 = 指紋(虎口三關)","say":"소파의 젊은 엄마가 달이 차고 기우는 달력을 들었다. 부인에게는 반드시 월경을 묻는다 — 婦女尤必問經期. 빠른가 늦은가, 끊겼는가 쏟아지는가 — 遲速閉崩. 월경, 대하, 임신, 출산, 經帶胎産을 묻는다. 월경이 앞당겨지면 血熱이나 氣虛, 늦어지면 血寒, 血虛, 血瘀다. 곁의 아이가 집게손가락을 내밀었고 안쪽에 보랏빛 핏줄이 보인다. 아이에게는 몇 마디 더 — 再添片語告兒科. 집게손가락의 핏줄을 마디마다 보는 虎口三關 指紋法이다 — 風關, 氣關, 命關.","box":[[1459,637,231,268],[1727,742,82,140]],"src":["JD-MOON-08"],"tts":"소파의 젊은 엄마가 달이 차고 기우는 달력을 들었다. 부인에게는 반드시 월경을 묻는다, 부녀우필문경기. 빠른가 늦은가, 끊겼는가 쏟아지는가, 지속폐붕. 월경, 대하, 임신, 출산, 경대태산을 묻는다. 월경이 앞당겨지면 혈열이나 기허, 늦어지면 혈한, 혈허, 혈어다. 곁의 아이가 집게손가락을 내밀었고 안쪽에 보랏빛 핏줄이 보인다. 아이에게는 몇 마디 더, 재첨편어고아과. 집게손가락의 핏줄을 마디마다 보는 호구삼관 지문법이다, 풍관, 기관, 명관."},{"n":13,"kind":"review","obj":"노래방 화면 한 바퀴 — 윗줄 다섯 · 아랫줄 다섯 · 책 둘 · 달력과 손가락","fact":"一寒熱 二汗 三頭身 四便 五飮食 六胸 七聾 八渴 九舊病 十因","hook":"얼음불 · 땀방울 · 아픈 머리 · 변기 · 국수 / 가슴 · 귀 · 물 핥는 혀 · 목발 · 돋보기","say":"다시 부른다. 윗줄 — 얼음과 불, 寒熱. 땀방울, 汗. 아픈 머리, 頭身. 변기, 대소변. 국수와 컵, 飮食. 아랫줄 — 가슴, 胸. 귀 기울이기, 聾. 물 핥는 혀, 渴. 목발, 舊病. 돋보기, 因. 두꺼운 옛 책은 張景岳, 얇은 새 노래책은 陳修園. 엄마의 달력은 월경, 아이의 손가락은 指紋.","box":[[94,166,1437,644],[314,896,453,231],[1438,415,395,728]],"src":[],"tts":"다시 부른다. 윗줄, 얼음과 불, 한열. 땀방울, 한. 아픈 머리, 두신. 변기, 대소변. 국수와 컵, 음식. 아랫줄, 가슴, 흉. 귀 기울이기, 농. 물 핥는 혀, 갈. 목발, 구병. 돋보기, 인. 두꺼운 옛 책은 장경악, 얇은 새 노래책은 진수원. 엄마의 달력은 월경, 아이의 손가락은 지문."}],"has_image":true},{"id":"zds-12","title":"切診 — 綱領脈 네 쌍: 浮沈·遲數·虛實·滑澁","place":"푸른 골짜기의 시내","image":"images/lessons/zds-12.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"푸른 골짜기의 시내 — 바위 둑을 사이에 두고 갈라졌다 합치는 물길 네 구간","fact":"切診 — 綱領脈 네 쌍: 浮沈(깊이) · 遲數(빠르기) · 虛實(힘) · 滑澁(매끄러움)","hook":"脈 = 물갈래(𠂢) · 갈라진 두 물길이 한 쌍 · 깊이 · 빠르기 · 힘 · 결","say":"푸른 골짜기에 시내가 흐른다. 바위 둑을 사이에 두고 물길이 둘로 갈라졌다 다시 합치기를 네 번 한다. 脈이라는 글자에는 물이 갈래 지어 흐르는 모양이 들어 있다. 맥을 짚는 切診의 큰 줄기, 綱領脈 네 쌍을 이 물길에서 본다 — 물의 깊이는 浮沈, 빠르기는 遲數, 힘은 虛實, 결은 滑澁이다.","box":null,"src":[],"tts":"푸른 골짜기에 시내가 흐른다. 바위 둑을 사이에 두고 물길이 둘로 갈라졌다 다시 합치기를 네 번 한다. 맥이라는 글자에는 물이 갈래 지어 흐르는 모양이 들어 있다. 맥을 짚는 절진의 큰 줄기, 강령맥 네 쌍을 이 물길에서 본다, 물의 깊이는 부침, 빠르기는 지수, 힘은 허실, 결은 활삽이다."},{"n":1,"obj":"맨 왼쪽 얕은 물길 — 물 위에 뜬 초록 잎","fact":"浮脈 — 輕取卽得(살짝 대도 잡힘) · 主 表證 · 虛陽浮越","hook":"물 위에 뜬 잎 = 가볍게 대도 잡히는 浮","say":"맨 왼쪽 얕은 물길에 초록 잎이 물 위에 떴다. 뜰 부(浮), 浮脈. 손가락을 살짝 얹기만 해도 잡힌다 — 輕取卽得. 병이 겉에 있는 表證이다. 外感表證, 또는 虛한 陽이 위로 떠오른 虛陽浮越에도 나타난다. 浮, 沈, 遲, 數, 滑, 澁이 여섯 가지 중요한 맥, 六要脈이다.","box":[267,404,183,118],"src":["JD-MAEK-09-01","JD-MAEK-06-01"],"tts":"맨 왼쪽 얕은 물길에 초록 잎이 물 위에 떴다. 뜰 부, 부맥. 손가락을 살짝 얹기만 해도 잡힌다, 경취즉득. 병이 겉에 있는 표증이다. 외감표증, 또는 허한 양이 위로 떠오른 허양부월에도 나타난다. 부, 침, 지, 수, 활, 삽이 여섯 가지 중요한 맥, 육요맥이다."},{"n":2,"obj":"그 아래 깊고 검푸른 웅덩이 — 바닥에 가라앉은 둥근 돌","fact":"沈脈 — 重按始得(꾹 눌러야 잡힘) · 主 裏證","hook":"바닥에 가라앉은 돌 = 꾹 눌러야 잡히는 沈","say":"그 아래는 깊고 검푸른 웅덩이이고, 바닥에 둥근 돌이 가라앉았다. 잠길 침(沈), 沈脈. 꾹 눌러야 비로소 잡힌다 — 重按始得. 병이 속에 있는 裏證이다. 잎과 돌, 얕음과 깊음이 浮沈의 한 쌍이다.","box":[[0,591,613,552],[223,901,144,115]],"src":["JD-MAEK-10-01","JD-MAEK-06-02"],"tts":"그 아래는 깊고 검푸른 웅덩이이고, 바닥에 둥근 돌이 가라앉았다. 잠길 침, 침맥. 꾹 눌러야 비로소 잡힌다, 중안시득. 병이 속에 있는 이증이다. 잎과 돌, 얕음과 깊음이 부침의 한 쌍이다."},{"n":3,"obj":"둘째 물길의 위쪽 — 얼음 조각이 떠 거의 흐르지 않는 차가운 물 · 둑을 기어가는 달팽이","fact":"遲脈 — 一息三至 이하(한 숨에 세 번 이하) · 主 寒證 · 陰寒 · 陽虛","hook":"얼어서 느린 물 + 달팽이 = 遲 = 寒","say":"둘째 물길 위쪽은 얼음 조각이 떠서 물이 거의 흐르지 않고, 둑에는 달팽이가 기어간다. 느릴 지(遲), 遲脈. 숨 한 번에 세 번 이하로 뛴다 — 一息三至. 차가워서 느리다 — 寒證, 陰寒이나 陽虛다.","box":[[548,166,461,454],[548,339,89,82]],"src":["JD-MAEK-11-01","JD-MAEK-06-03"],"tts":"둘째 물길 위쪽은 얼음 조각이 떠서 물이 거의 흐르지 않고, 둑에는 달팽이가 기어간다. 느릴 지, 지맥. 숨 한 번에 세 번 이하로 뛴다, 일식삼지. 차가워서 느리다, 한증, 음한이나 양허다."},{"n":4,"obj":"둘째 물길의 아래쪽 — 김을 뿜으며 물보라 치고 내달리는 붉은 물","fact":"數脈 — 一息六至 이상(한 숨에 여섯 번 이상) · 主 熱證","hook":"뜨거워 내달리는 붉은 물 = 數 = 熱","say":"같은 물길 아래쪽은 붉게 달아올라 김을 뿜으며 물보라를 치고 내달린다. 잦을 삭(數), 數脈. 숨 한 번에 여섯 번 이상 뛴다 — 一息六至. 뜨거워서 빠르다 — 熱證. 얼음과 김, 느림과 빠름이 遲數의 한 쌍이다.","box":[476,605,540,538],"src":["JD-MAEK-11-03","JD-MAEK-06-04"],"tts":"같은 물길 아래쪽은 붉게 달아올라 김을 뿜으며 물보라를 치고 내달린다. 잦을 삭, 삭맥. 숨 한 번에 여섯 번 이상 뛴다, 일식륙지. 뜨거워서 빠르다, 열증. 얼음과 김, 느림과 빠름이 지수의 한 쌍이다."},{"n":5,"obj":"셋째 물길의 위쪽 — 넓고 마른 바닥에 가늘게 졸졸 흐르는 물","fact":"虛脈 — 三部無力(세 자리 모두 힘없음) · 主 虛證 · 氣血兩虛","hook":"마른 바닥의 가는 물줄기 = 힘없는 虛","say":"셋째 물길 위쪽은 넓은 바닥이 거의 말랐고 물이 가늘게 졸졸 흐른다. 빌 허(虛), 虛脈. 寸關尺 세 자리 모두 짚으면 힘없이 비어 있다 — 三部無力. 氣와 血이 다 모자란 虛證이다.","box":[1031,180,360,540],"src":["JD-MAEK-12-01"],"tts":"셋째 물길 위쪽은 넓은 바닥이 거의 말랐고 물이 가늘게 졸졸 흐른다. 빌 허, 허맥. 촌관척 세 자리 모두 짚으면 힘없이 비어 있다, 삼부무력. 기와 혈이 다 모자란 허증이다."},{"n":6,"obj":"셋째 물길의 아래쪽 — 가득 차올라 바위를 세차게 때리는 물살","fact":"實脈 — 三部有力(세 자리 모두 힘참) · 主 實證 · 邪盛","hook":"바위를 때리는 가득 찬 물살 = 힘센 實","say":"같은 물길 아래쪽은 물이 가득 차올라 바위를 세차게 때린다. 찰 실(實), 實脈. 세 자리 모두 꽉 차서 힘 있게 친다 — 三部有力. 邪氣가 왕성한 實證이다. 가는 물줄기와 세찬 물살이 虛實의 한 쌍이다.","box":[1103,670,490,473],"src":["JD-MAEK-12-02"],"tts":"같은 물길 아래쪽은 물이 가득 차올라 바위를 세차게 때린다. 찰 실, 실맥. 세 자리 모두 꽉 차서 힘 있게 친다, 삼부유력. 사기가 왕성한 실증이다. 가는 물줄기와 세찬 물살이 허실의 한 쌍이다."},{"n":7,"obj":"맨 오른쪽 위 매끄러운 물길 — 줄지어 떠내려오는 흰 진주들 · 둑에 앉은 배부른 임신부","fact":"滑脈 — 如珠走盤(쟁반에 구슬 구르듯) · 主 痰飮 · 食積 · 實熱 · 妊娠","hook":"물길을 구르는 진주 = 滑 · 곁의 임신부 = 妊娠","say":"맨 오른쪽 위 물길은 유리처럼 매끄럽고, 흰 진주들이 데굴데굴 굴러간다. 미끄러울 활(滑), 滑脈. 쟁반 위를 구슬이 구르듯 오고 감이 매끄럽다 — 如珠走盤, 往來流利. 痰飮, 食積, 實熱에 나타나고, 둑에 앉은 배부른 여자처럼 임신에도 나타난다.","box":[[1297,151,751,526],[1819,242,196,222]],"src":["JD-MAEK-12-03","JD-MAEK-06-05"],"tts":"맨 오른쪽 위 물길은 유리처럼 매끄럽고, 흰 진주들이 데굴데굴 굴러간다. 미끄러울 활, 활맥. 쟁반 위를 구슬이 구르듯 오고 감이 매끄럽다, 여주주반, 왕래류리. 담음, 식적, 실열에 나타나고, 둑에 앉은 배부른 여자처럼 임신에도 나타난다."},{"n":8,"obj":"맨 오른쪽 아래 물 없는 거친 돌 도랑 — 가로누운 대나무에 엇갈려 댄 작은 칼과 부스러기","fact":"澁脈 — 如輕刀刮竹(가벼운 칼로 대를 긁듯) · 主 精傷 · 血少 · 氣滯 · 血瘀","hook":"칼로 대나무를 긁는 껄끄러움 = 澁","say":"맨 오른쪽 아래는 물기 없는 거친 돌 도랑이고, 가로누운 대나무에 작은 칼을 엇갈려 대어 긁었다. 물이 매끄럽게 흐르지 못한다. 껄끄러울 삽(澁), 澁脈. 가벼운 칼로 대나무를 긁듯 껄끄럽다 — 如輕刀刮竹. 精이 상하고 血이 적거나, 氣가 막히고 血이 엉긴 것이다. 구르는 진주와 긁는 칼이 滑澁의 한 쌍이다.","box":[[1585,634,463,360],[1715,786,151,101]],"src":["JD-MAEK-12-04","JD-MAEK-06-06"],"tts":"맨 오른쪽 아래는 물기 없는 거친 돌 도랑이고, 가로누운 대나무에 작은 칼을 엇갈려 대어 긁었다. 물이 매끄럽게 흐르지 못한다. 껄끄러울 삽, 삽맥. 가벼운 칼로 대나무를 긁듯 껄끄럽다, 여경도괄죽. 정이 상하고 혈이 적거나, 기가 막히고 혈이 엉긴 것이다. 구르는 진주와 긁는 칼이 활삽의 한 쌍이다."},{"n":9,"kind":"review","obj":"골짜기 시내 한 바퀴 — 잎과 돌 · 얼음과 붉은 물살 · 가는 물과 세찬 물 · 진주와 칼","fact":"浮 表 · 沈 裏 / 遲 寒 · 數 熱 / 虛 虛證 · 實 實證 / 滑 痰飮·妊娠 · 澁 血少·血瘀","hook":"뜬 잎 · 가라앉은 돌 / 얼음 · 김 / 졸졸 · 콸콸 / 진주 · 칼","say":"다시 본다. 물 위의 잎 — 浮脈, 表證. 바닥의 돌 — 沈脈, 裏證. 얼음과 달팽이 — 遲脈, 寒證. 김 뿜는 물살 — 數脈, 熱證. 마른 바닥의 졸졸 — 虛脈, 虛證. 바위 때리는 물살 — 實脈, 實證. 구르는 진주와 임신부 — 滑脈, 痰飮과 임신. 대를 긁는 칼 — 澁脈, 血少와 血瘀.","box":[[0,591,613,552],[476,605,540,538],[1103,670,490,473],[1585,634,463,360]],"src":[],"tts":"다시 본다. 물 위의 잎, 부맥, 표증. 바닥의 돌, 침맥, 이증. 얼음과 달팽이, 지맥, 한증. 김 뿜는 물살, 삭맥, 열증. 마른 바닥의 졸졸, 허맥, 허증. 바위 때리는 물살, 실맥, 실증. 구르는 진주와 임신부, 활맥, 담음과 임신. 대를 긁는 칼, 삽맥, 혈소와 혈어."}],"has_image":true},{"id":"zds-13","title":"八綱 — 總綱 陰陽 아래 表裏·寒熱·虛實","place":"바닷가 어촌의 그물 손질장","image":"images/lessons/zds-13.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"바닷가 어촌의 그물 손질장 — 왼쪽은 햇빛, 오른쪽은 창고 그늘 · 가운데 나무틀의 굵은 밧줄 하나와 가는 밧줄 셋","fact":"八綱 — 總綱 陰陽 아래 表裏 · 寒熱 · 虛實 세 쌍","hook":"綱 = 그물의 벼리(큰 줄) · 굵은 줄 하나 = 陰陽 · 가는 줄 셋 = 表裏 · 寒熱 · 虛實","say":"바닷가 어촌의 그물 손질장. 왼쪽은 햇빛이 들고 오른쪽은 창고 그늘이다. 가운데 나무틀에 굵은 밧줄 하나가 세로로 드리웠고, 가는 밧줄 셋이 가로로 걸렸다. 그물을 거머쥐는 큰 줄을 벼리, 綱이라 한다. 여덟 벼리로 병을 가르는 八綱辨證이다. 八綱은 陰陽, 表裏, 寒熱, 虛實이다.","box":null,"src":[],"tts":"바닷가 어촌의 그물 손질장. 왼쪽은 햇빛이 들고 오른쪽은 창고 그늘이다. 가운데 나무틀에 굵은 밧줄 하나가 세로로 드리웠고, 가는 밧줄 셋이 가로로 걸렸다. 그물을 거머쥐는 큰 줄을 벼리, 강이라 한다. 여덟 벼리로 병을 가르는 팔강변증이다. 팔강은 음양, 표리, 한열, 허실이다."},{"n":1,"obj":"햇빛과 그늘의 경계에 드리운 굵은 밧줄 하나 — 두 손으로 움켜쥔 늙은 어부","fact":"陰陽 = 總綱 — 나머지 여섯을 陽과 陰 두 편으로 나눔","hook":"해와 그늘을 가르는 굵은 벼리 = 總綱 陰陽","say":"햇빛과 그늘의 경계에 굵은 밧줄 하나가 드리웠고, 늙은 어부가 두 손으로 움켜쥐었다. 이 큰 벼리가 陰陽이다 — 八綱의 總綱. 가는 밧줄 셋이 모두 이 벼리를 가로지르며, 그 위에 걸린 여섯을 햇빛 쪽 陽과 그늘 쪽 陰 두 편으로 나눈다.","box":[[1006,55,72,1023],[891,473,245,591]],"src":["YY-22-01","YY-22-02","BZ-BY-02-01"],"tts":"햇빛과 그늘의 경계에 굵은 밧줄 하나가 드리웠고, 늙은 어부가 두 손으로 움켜쥐었다. 이 큰 벼리가 음양이다, 팔강의 총강. 가는 밧줄 셋이 모두 이 벼리를 가로지르며, 그 위에 걸린 여섯을 햇빛 쪽 양과 그늘 쪽 음 두 편으로 나눈다."},{"n":2,"obj":"맨 위 줄 — 햇빛 쪽에 뜬 둥근 찌(부표) · 그늘 쪽에 매달려 늘어진 납 봉돌","fact":"表裏 = 病位의 深淺 — 表(겉·초기) ↔ 裏(장부·깊은 곳)","hook":"물 위에 뜨는 찌 = 表 · 깊이 가라앉는 봉돌 = 裏","say":"맨 위 줄에는 햇빛 쪽에 둥근 찌가, 그늘 쪽에 무거운 납 봉돌이 매달렸다. 찌는 물 위에 뜨고 봉돌은 깊이 가라앉는다. 병이 겉에 있나 속에 있나 — 表裏, 병의 자리와 깊이다. 表는 몸의 겉과 병의 초기, 裏는 장부와 깊은 곳이다.","box":[[637,242,130,173],[1309,233,118,167]],"src":["YY-22-03","YY-22-02-M02","BZ-BY-02-02"],"tts":"맨 위 줄에는 햇빛 쪽에 둥근 찌가, 그늘 쪽에 무거운 납 봉돌이 매달렸다. 찌는 물 위에 뜨고 봉돌은 깊이 가라앉는다. 병이 겉에 있나 속에 있나, 표리, 병의 자리와 깊이다. 표는 몸의 겉과 병의 초기, 이는 장부와 깊은 곳이다."},{"n":3,"obj":"가운데 줄 — 햇빛 쪽에 매달린 불 타는 화로 · 그늘 쪽에 매달려 녹아 떨어지는 얼음덩이","fact":"寒熱 = 病性 — 寒(陰性·저하) ↔ 熱(陽性·항진)","hook":"불 = 熱 · 얼음 = 寒","say":"가운데 줄에는 햇빛 쪽에 불 타는 화로가, 그늘 쪽에 물방울 떨어지는 얼음덩이가 매달렸다. 병의 성질이 차가운가 뜨거운가 — 寒熱, 病性이다. 寒은 陰의 성질로 기능이 떨어지고, 熱은 陽의 성질로 기능이 지나치다.","box":[[623,386,187,274],[1300,450,130,225]],"src":["YY-22-04","YY-22-02-M03","BZ-BY-02-03"],"tts":"가운데 줄에는 햇빛 쪽에 불 타는 화로가, 그늘 쪽에 물방울 떨어지는 얼음덩이가 매달렸다. 병의 성질이 차가운가 뜨거운가, 한열, 병성이다. 한은 음의 성질로 기능이 떨어지고, 열은 양의 성질로 기능이 지나치다."},{"n":4,"obj":"맨 아래 줄 — 햇빛 쪽의 물고기로 불룩 찬 그물 자루 · 그늘 쪽의 텅 비어 축 처진 그물 자루","fact":"虛實 = 邪正의 盛衰 — 虛(正氣 부족) ↔ 實(邪氣 성함)","hook":"꽉 찬 그물 = 實 · 텅 빈 그물 = 虛","say":"맨 아래 줄에는 햇빛 쪽에 물고기로 불룩 찬 그물 자루가, 그늘 쪽에 텅 비어 축 처진 그물 자루가 매달렸다. 누가 이기고 있나 — 虛實, 邪氣와 正氣의 성하고 쇠함이다. 實은 邪氣가 왕성한 것, 虛는 正氣가 모자란 것이다.","box":[[579,689,216,308],[1232,718,241,274]],"src":["YY-22-05","YY-22-02-M04","BZ-BY-02-04"],"tts":"맨 아래 줄에는 햇빛 쪽에 물고기로 불룩 찬 그물 자루가, 그늘 쪽에 텅 비어 축 처진 그물 자루가 매달렸다. 누가 이기고 있나, 허실, 사기와 정기의 성하고 쇠함이다. 실은 사기가 왕성한 것, 허는 정기가 모자란 것이다."},{"n":5,"obj":"햇빛 쪽에 걸린 셋(찌 · 불 · 꽉 찬 그물) · 그늘 쪽에 걸린 셋(봉돌 · 얼음 · 빈 그물)","fact":"陽 = 表 · 熱 · 實 / 陰 = 裏 · 寒 · 虛 — 자리가 곧 배속","hook":"햇빛 쪽 셋 = 陽 · 그늘 쪽 셋 = 陰","say":"햇빛 쪽에 걸린 것을 위에서부터 본다 — 찌, 불, 꽉 찬 그물. 表, 熱, 實이 陽이다. 그늘 쪽은 봉돌, 얼음, 빈 그물 — 裏, 寒, 虛가 陰이다. 陰陽은 증후를 모두 묶는 강령이라, 表熱實은 陽으로, 裏寒虛는 陰으로 귀납한다.","box":[[0,0,1026,1143],[1035,0,1013,1143]],"src":["YY-22-02-M01"],"tts":"햇빛 쪽에 걸린 것을 위에서부터 본다, 찌, 불, 꽉 찬 그물. 표, 열, 실이 양이다. 그늘 쪽은 봉돌, 얼음, 빈 그물, 이, 한, 허가 음이다. 음양은 증후를 모두 묶는 강령이라, 표열실은 양으로, 이한허는 음으로 귀납한다."},{"n":6,"kind":"review","obj":"그물 손질장 한 바퀴 — 굵은 벼리 · 찌와 봉돌 · 불과 얼음 · 찬 그물과 빈 그물","fact":"總綱 陰陽 / 表裏 病位 · 寒熱 病性 · 虛實 邪正 / 陽 表熱實 · 陰 裏寒虛","hook":"벼리 · 찌·봉돌 · 불·얼음 · 찬·빈 그물","say":"다시 본다. 해와 그늘을 가르는 굵은 벼리 — 總綱 陰陽. 찌와 봉돌 — 表裏, 병의 자리. 불과 얼음 — 寒熱, 병의 성질. 꽉 찬 그물과 빈 그물 — 虛實, 邪正의 성쇠. 햇빛 쪽 셋은 陽, 그늘 쪽 셋은 陰.","box":[[1006,55,72,1023],[0,0,1026,1143],[1035,0,1013,1143]],"src":[],"tts":"다시 본다. 해와 그늘을 가르는 굵은 벼리, 총강 음양. 찌와 봉돌, 표리, 병의 자리. 불과 얼음, 한열, 병의 성질. 꽉 찬 그물과 빈 그물, 허실, 사정의 성쇠. 햇빛 쪽 셋은 양, 그늘 쪽 셋은 음."}],"has_image":true},{"id":"zds-14","title":"六經 ① 三陽 — 太陽(中風·傷寒)·陽明(經證·腑證)·少陽","place":"늦은 오후의 한옥","image":"images/lessons/zds-14.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"늦은 오후의 한옥 — 왼쪽 대문 밖 길 · 가운데 중문 · 오른쪽 안마당","fact":"六經 ① 三陽 — 太陽(表) · 少陽(半表半裏) · 陽明(裏)","hook":"대문 밖 = 太陽·表 · 중문 = 少陽·半表半裏 · 안마당 = 陽明·裏","say":"해가 기우는 늦은 오후의 한옥. 왼쪽은 대문 밖 길, 가운데는 좁은 중문, 오른쪽은 깊숙한 안마당이다. 『傷寒論』의 六經 가운데 바깥의 세 陽經, 三陽을 본다. 자리의 깊이로는 대문 밖 太陽이 겉, 중문 少陽이 겉과 속의 사이, 안마당 陽明이 속이다. 병이 옮겨 가는 차례는 太陽, 陽明, 少陽이라 정거장도 그 차례로 간다.","box":null,"src":[],"tts":"해가 기우는 늦은 오후의 한옥. 왼쪽은 대문 밖 길, 가운데는 좁은 중문, 오른쪽은 깊숙한 안마당이다. 상한론의 육경 가운데 바깥의 세 양경, 삼양을 본다. 자리의 깊이로는 대문 밖 태양이 겉, 중문 소양이 겉과 속의 사이, 안마당 양명이 속이다. 병이 옮겨 가는 차례는 태양, 양명, 소양이라 정거장도 그 차례로 간다."},{"n":1,"obj":"왼쪽 대문 밖 바람 부는 흙길","fact":"太陽 = 表 — 六經의 첫 관문 · 肌表 · 膀胱","hook":"대문 밖 = 겉(表) = 太陽","say":"왼쪽, 대문 밖 흙길에 찬바람이 분다. 병이 처음 닿는 바깥 관문 — 太陽, 表다. 太陽의 실질은 몸의 겉 살갗과 足太陽膀胱經이다.","box":[[0,0,829,1143],[0,137,540,476]],"src":["SW-SHR-02-01"],"tts":"왼쪽, 대문 밖 흙길에 찬바람이 분다. 병이 처음 닿는 바깥 관문, 태양, 표다. 태양의 실질은 몸의 겉 살갗과 족태양방광경이다."},{"n":2,"obj":"대문 밖의 두 남자 — 한 손으로 뻣뻣한 목덜미를 잡고 바람에 덜덜 떪","fact":"太陽之爲病 脈浮 頭項強痛而惡寒 — 太陽病 提綱(1조)","hook":"목덜미를 잡고 떨기 = 頭項強痛 · 惡寒","say":"대문 밖의 두 남자는 한 손으로 뻣뻣한 목덜미를 잡고 바람에 덜덜 떤다. 『傷寒論』 첫 조문, 太陽病의 提綱이다 — 太陽之爲病, 脈浮, 頭項強痛而惡寒. 맥은 뜨고, 머리와 목덜미가 뻣뻣하게 아프며, 오싹 춥다.","box":[[137,430,270,634],[430,473,360,626]],"src":["SW-M6-01"],"tts":"대문 밖의 두 남자는 한 손으로 뻣뻣한 목덜미를 잡고 바람에 덜덜 떤다. 상한론 첫 조문, 태양병의 제강이다, 태양지위병, 맥부, 두항강통이오한. 맥은 뜨고, 머리와 목덜미가 뻣뻣하게 아프며, 오싹 춥다."},{"n":3,"obj":"찬바람 속에 움츠린 남자 A — 얼굴에 맺힌 땀 · 품에 안은 갈색 계피 다발","fact":"太陽中風 = 表虛 — 發熱 · 汗出 · 惡風 · 脈浮緩 → 桂枝湯","hook":"땀 흘리며 바람에 움츠림 = 中風 · 계피 = 桂枝湯","say":"남자 A는 찬바람 속에 움츠렸고 얼굴에 땀이 맺혔다. 땀이 새고 바람을 싫어한다 — 太陽中風. 겉이 허해 땀이 새는 表虛다. 열이 나고 땀이 나며 바람을 싫어하고 맥은 뜨고 느슨하다 — 脈浮緩. 품에 안은 계피 가지 — 桂枝湯이다.","box":[[137,430,270,634],[86,649,115,101]],"src":["SW-M6-02"],"tts":"남자 A는 찬바람 속에 움츠렸고 얼굴에 땀이 맺혔다. 땀이 새고 바람을 싫어한다, 태양중풍. 겉이 허해 땀이 새는 표허다. 열이 나고 땀이 나며 바람을 싫어하고 맥은 뜨고 느슨하다, 맥부완. 품에 안은 계피 가지, 계지탕이다."},{"n":4,"obj":"남자 B — 얼굴에 땀 없이 입김을 몰아쉬며 아파함 · 품에 안은 마디진 초록 마황 줄기","fact":"太陽傷寒 = 表實 — 惡寒 · 身疼腰痛 · 無汗而喘 · 脈浮緊 → 麻黃湯","hook":"땀 없이 헐떡임 = 傷寒 · 마디진 초록 줄기 = 麻黃湯","say":"남자 B는 땀 한 방울 없이 쌕쌕 숨을 몰아쉬며 온몸이 쑤신다. 太陽傷寒이다. 겉이 꽉 막혀 땀이 나지 않는 表實이다. 오한이 들고 몸과 허리가 아프며 땀 없이 숨이 차고 맥은 뜨고 팽팽하다 — 無汗而喘, 脈浮緊. 품에 안은 마디진 초록 줄기는 麻黃, 麻黃湯이다. 땀이 나면 中風 桂枝湯, 땀이 없으면 傷寒 麻黃湯.","box":[[430,473,360,626],[548,677,238,187]],"src":[],"tts":"남자 B는 땀 한 방울 없이 쌕쌕 숨을 몰아쉬며 온몸이 쑤신다. 태양상한이다. 겉이 꽉 막혀 땀이 나지 않는 표실이다. 오한이 들고 몸과 허리가 아프며 땀 없이 숨이 차고 맥은 뜨고 팽팽하다, 무한이천, 맥부긴. 품에 안은 마디진 초록 줄기는 마황, 마황탕이다. 땀이 나면 중풍 계지탕, 땀이 없으면 상한 마황탕."},{"n":5,"obj":"오른쪽 깊숙한 안마당","fact":"陽明 = 裏 · 熱盛 — 胃腸의 裏熱實","hook":"깊은 안마당 = 속(裏) = 陽明","say":"오른쪽, 담장 안 깊숙한 안마당이다. 陽明, 속이다. 熱이 성한 胃와 腸의 裏熱實이다. 陽明病의 提綱은 「陽明之爲病, 胃家實是也」 — 胃家가 實하다.","box":[1271,0,777,1143],"src":["SW-SHR-02-02"],"tts":"오른쪽, 담장 안 깊숙한 안마당이다. 양명, 속이다. 열이 성한 위와 장의 이열실이다. 양명병의 제강은 양명지위병, 위가실시야, 위가가 실하다."},{"n":6,"obj":"땀에 흠뻑 젖어 큰 사발로 물을 들이켜는 남자 D · 곁에 엎드린 흰 호랑이","fact":"陽明經證 = 四大(大熱 · 大汗 · 大渴 · 脈洪大) → 白虎湯 · 壯熱","hook":"큰 열 · 큰 땀 · 큰 갈증 = 四大 · 흰 호랑이 = 白虎湯","say":"안마당의 남자 D는 땀에 흠뻑 젖고 몸이 불덩이인데, 큰 사발로 물을 벌컥벌컥 들이켠다. 크게 뜨겁고, 크게 땀 나고, 크게 목마르고, 맥이 넓고 크다 — 四大, 陽明經證이다. 형체 없는 熱만 성하다. 곁에 엎드린 흰 호랑이 — 白虎湯이다. 오한 없이 높은 열이 계속되는 壯熱이다.","box":[[1415,363,221,455],[1294,530,490,222]],"src":["SW-M6-05","GAP1-021"],"tts":"안마당의 남자 D는 땀에 흠뻑 젖고 몸이 불덩이인데, 큰 사발로 물을 벌컥벌컥 들이켠다. 크게 뜨겁고, 크게 땀 나고, 크게 목마르고, 맥이 넓고 크다, 사대, 양명경증이다. 형체 없는 열만 성하다. 곁에 엎드린 흰 호랑이, 백호탕이다. 오한 없이 높은 열이 계속되는 장열이다."},{"n":7,"obj":"지는 해를 등지고 앉아 입을 벌리고 손짓하며 중얼거리는 남자 E — 북처럼 불룩하고 단단한 배","fact":"陽明腑證 = 痞滿燥實 · 日晡潮熱 · 譫語 · 便秘 → 承氣湯","hook":"해 질 녘 열 + 헛소리 + 단단한 배 = 腑證","say":"남자 E는 지는 해를 등지고 앉아 입을 벌리고 손짓하며 횡설수설한다. 배가 북처럼 불룩하고 단단하다. 陽明腑證이다. 腸에 마른 똥이 맺혀 배가 그득하고 단단하며 아파 누르지 못하게 하고, 변이 막혔다 — 痞滿燥實. 해 질 녘에 열이 조수처럼 오르고 — 日晡潮熱, 헛소리를 한다 — 譫語. 혀에 가시가 돋는다. 承氣湯 무리로 내린다.","box":[[1727,343,245,331],[1790,277,167,101]],"src":["SW-M6-13-01"],"tts":"남자 E는 지는 해를 등지고 앉아 입을 벌리고 손짓하며 횡설수설한다. 배가 북처럼 불룩하고 단단하다. 양명부증이다. 장에 마른 똥이 맺혀 배가 그득하고 단단하며 아파 누르지 못하게 하고, 변이 막혔다, 비만조실. 해 질 녘에 열이 조수처럼 오르고, 일포조열, 헛소리를 한다, 섬어. 혀에 가시가 돋는다. 승기탕 무리로 내린다."},{"n":8,"obj":"남자 D의 드러난 말랑한 배 · 남자 E의 단단한 북 같은 배","fact":"배가 무르면 經證(淸法 · 白虎湯) · 단단하면 腑證(下法 · 承氣湯)","hook":"말랑한 배 = 맑혀라(淸) · 단단한 배 = 내려라(下)","say":"두 남자의 배를 견준다. D의 배는 드러나 있어도 말랑하다 — 熱만 있고 맺힌 것이 없는 經證이라 맑힌다, 淸法, 白虎湯. E의 배는 북처럼 단단하다 — 맺힌 것이 있는 腑證이라 내린다, 下法, 承氣湯. 배를 눌러 보면 經證과 腑證이 갈린다.","box":[[1415,363,221,455],[1794,490,137,115]],"src":[],"tts":"두 남자의 배를 견준다. D의 배는 드러나 있어도 말랑하다, 열만 있고 맺힌 것이 없는 경증이라 맑힌다, 청법, 백호탕. E의 배는 북처럼 단단하다, 맺힌 것이 있는 부증이라 내린다, 하법, 승기탕. 배를 눌러 보면 경증과 부증이 갈린다."},{"n":9,"obj":"가운데 문간에 선 남자 C — 한 발은 문 밖, 한 발은 문지방 위 · 등에 멘 작은 땔나무 묶음","fact":"少陽 = 半表半裏 → 和法 · 小柴胡湯","hook":"문지방에 걸친 발 = 겉도 속도 아닌 사이 · 작은 땔나무(柴) = 小柴胡湯","say":"가운데 문간에 남자 C가 섰다. 한 발은 문 밖에, 한 발은 문지방 위에 걸쳤다. 겉과 속의 사이 — 半表半裏, 少陽이다. 땀을 내도 안 되고 내려도 안 되니 화해시킨다 — 和法. 등에 멘 작은 땔나무, 땔나무 시(柴) — 小柴胡湯이다.","box":[[847,357,360,669],[1110,663,86,130]],"src":["SW-SHR-02-03","SW-M6-07-02","SW-SHR-04-02","BZ-BEOP-05"],"tts":"가운데 문간에 남자 C가 섰다. 한 발은 문 밖에, 한 발은 문지방 위에 걸쳤다. 겉과 속의 사이, 반표반리, 소양이다. 땀을 내도 안 되고 내려도 안 되니 화해시킨다, 화법. 등에 멘 작은 땔나무, 땔나무 시, 소시호탕이다."},{"n":10,"obj":"남자 C의 몸 — 왼쪽 반은 고드름 달린 푸른 얼음, 오른쪽 반은 불꽃 이는 붉은 열","fact":"寒熱往來 — 오한과 발열이 번갈아 옴(少陽病 · 瘧疾)","hook":"반은 얼음 · 반은 불 = 추위와 열이 오감","say":"남자 C의 몸은 왼쪽 반이 고드름 달린 푸른 얼음, 오른쪽 반이 불꽃 이는 붉은 열이다. 추웠다 더웠다 번갈아 온다 — 寒熱往來. 少陽病의 대표 증상이고 학질에도 나타난다. 少陽病의 主症은 寒熱往來, 胸脇苦滿, 말없이 먹으려 하지 않음, 구역, 어지러움이다.","box":[847,357,360,669],"src":["SW-M6-07-01","JD-MOON-02-04"],"tts":"남자 C의 몸은 왼쪽 반이 고드름 달린 푸른 얼음, 오른쪽 반이 불꽃 이는 붉은 열이다. 추웠다 더웠다 번갈아 온다, 한열왕래. 소양병의 대표 증상이고 학질에도 나타난다. 소양병의 주증은 한열왕래, 흉협고만, 말없이 먹으려 하지 않음, 구역, 어지러움이다."},{"n":11,"obj":"남자 C가 두 손으로 짚은 갈비 아래","fact":"胸脇苦滿 — 가슴과 옆구리가 그득하고 괴로움(少陽經 부위)","hook":"갈비 아래를 짚음 = 胸脇苦滿","say":"남자 C는 두 손으로 갈비 아래를 짚었다. 가슴과 옆구리가 그득하게 답답하다 — 胸脇苦滿. 옆구리는 足少陽膽經이 지나는 자리다.","box":[922,634,202,115],"src":[],"tts":"남자 C는 두 손으로 갈비 아래를 짚었다. 가슴과 옆구리가 그득하게 답답하다, 흉협고만. 옆구리는 족소양담경이 지나는 자리다."},{"n":12,"obj":"남자 C의 얼굴 — 쓴 것을 맛본 듯 혀를 내밀어 찡그림 · 빙빙 도는 소용돌이 눈","fact":"少陽之爲病 口苦 咽乾 目眩也 — 少陽病 提綱(263조) · 脈弦","hook":"쓴 입 · 마른 목 · 빙빙 도는 눈","say":"남자 C는 쓴 것을 맛본 듯 혀를 내밀어 찡그리고, 눈이 소용돌이처럼 빙빙 돈다. 少陽病의 提綱이다 — 少陽之爲病, 口苦, 咽乾, 目眩也. 입이 쓰고, 목이 마르고, 눈앞이 어지럽다. 맥은 팽팽한 弦이다.","box":[944,368,166,166],"src":["SW-M6-06"],"tts":"남자 C는 쓴 것을 맛본 듯 혀를 내밀어 찡그리고, 눈이 소용돌이처럼 빙빙 돈다. 소양병의 제강이다, 소양지위병, 구고, 인건, 목현야. 입이 쓰고, 목이 마르고, 눈앞이 어지럽다. 맥은 팽팽한 현이다."},{"n":13,"kind":"review","obj":"한옥 한 바퀴 — 대문 밖 두 남자 · 안마당의 남자와 흰 호랑이 · 단단한 배의 남자 · 중문의 얼음불 남자","fact":"太陽 表: 中風 桂枝 · 傷寒 麻黃 / 陽明 裏: 經證 白虎 · 腑證 承氣 / 少陽 半表半裏: 小柴胡","hook":"계피 · 마황 / 흰 호랑이 · 북 같은 배 / 문턱의 얼음불","say":"다시 본다. 대문 밖 — 太陽, 목덜미를 잡고 떨기. 땀 나며 계피를 안은 中風은 桂枝湯, 땀 없이 헐떡이며 마황을 안은 傷寒은 麻黃湯. 안마당 — 陽明. 큰 사발과 흰 호랑이는 經證 白虎湯, 해 질 녘 헛소리와 단단한 배는 腑證 承氣湯. 문간 — 少陽, 반은 얼음 반은 불, 갈비 아래, 쓴 입과 어지러움, 작은 땔나무 小柴胡湯.","box":[[0,0,829,1143],[839,0,432,1127],[1271,0,777,1143]],"src":[],"tts":"다시 본다. 대문 밖, 태양, 목덜미를 잡고 떨기. 땀 나며 계피를 안은 중풍은 계지탕, 땀 없이 헐떡이며 마황을 안은 상한은 마황탕. 안마당, 양명. 큰 사발과 흰 호랑이는 경증 백호탕, 해 질 녘 헛소리와 단단한 배는 부증 승기탕. 문간, 소양, 반은 얼음 반은 불, 갈비 아래, 쓴 입과 어지러움, 작은 땔나무 소시호탕."}],"has_image":true},{"id":"zds-15","title":"六經 ② 三陰 — 太陰·少陰(寒化↔熱化)·厥陰 + 傳變(循經·越經·直中)","place":"밤의 한옥 안채","image":"images/lessons/zds-15.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"밤의 한옥 안채 단면 — 왼쪽 마당의 디딤돌 · 부엌 · 안방 · 맨 오른쪽 가장 어두운 뒷방","fact":"六經 ② 三陰 — 太陰 · 少陰(寒化↔熱化) · 厥陰 + 傳變(循經 · 越經 · 直中)","hook":"안채 = 속 = 三陰 · 부엌 = 太陰 · 안방 = 少陰 · 뒷방 = 厥陰","say":"밤의 한옥 안채를 단면으로 본다. 왼쪽 마당에 디딤돌이 놓였고, 부엌, 안방, 그리고 맨 오른쪽에 가장 어두운 뒷방이 있다. 바깥채가 三陽이었다면 안채는 속, 三陰이다. 부엌은 太陰, 안방은 少陰, 뒷방은 厥陰이다. 먼저 병이 안채로 들어오는 세 길, 傳變을 본다.","box":null,"src":[],"tts":"밤의 한옥 안채를 단면으로 본다. 왼쪽 마당에 디딤돌이 놓였고, 부엌, 안방, 그리고 맨 오른쪽에 가장 어두운 뒷방이 있다. 바깥채가 삼양이었다면 안채는 속, 삼음이다. 부엌은 태음, 안방은 소음, 뒷방은 궐음이다. 먼저 병이 안채로 들어오는 세 길, 전변을 본다."},{"n":1,"obj":"마당의 디딤돌 줄 — 바깥쪽 여섯 돌에 하나씩 찍힌 발자국","fact":"循經傳 — 太陽 → 陽明 → 少陽 → 太陰 → 少陰 → 厥陰 차례대로","hook":"여섯 돌을 차례로 밟은 발자국 = 六經을 차례대로","say":"마당의 디딤돌 바깥쪽 여섯 개에 발자국이 하나씩 찍혔다. 여섯 돌을 하나도 거르지 않고 차례로 밟았다. 병이 經의 차례대로 옮겨 간다 — 循經傳. 太陽, 陽明, 少陽, 太陰, 少陰, 厥陰. 겉에서 속으로 들어간다.","box":[26,574,467,569],"src":["SW-SHR-03-01"],"tts":"마당의 디딤돌 바깥쪽 여섯 개에 발자국이 하나씩 찍혔다. 여섯 돌을 하나도 거르지 않고 차례로 밟았다. 병이 경의 차례대로 옮겨 간다, 순경전. 태양, 양명, 소양, 태음, 소음, 궐음. 겉에서 속으로 들어간다."},{"n":2,"obj":"디딤돌 위에서 돌 몇 개를 건너뛰어 크게 뛰어오르는 남자","fact":"越經傳 — 차례를 건너뛰어 옮겨 감","hook":"돌을 건너뛰는 도약 = 越經","say":"한 남자가 디딤돌을 하나씩 밟지 않고 몇 개를 건너뛰어 크게 뛰어오른다. 넘을 월(越), 越經傳 — 차례를 건너뛰어 옮겨 간다. 太陽에서 바로 少陽이나 太陰으로 가는 식이다.","box":[127,329,259,327],"src":["SW-SHR-03-02"],"tts":"한 남자가 디딤돌을 하나씩 밟지 않고 몇 개를 건너뛰어 크게 뛰어오른다. 넘을 월, 월경전, 차례를 건너뛰어 옮겨 간다. 태양에서 바로 소양이나 태음으로 가는 식이다."},{"n":3,"obj":"안방 뒷벽의 작은 뒷문 — 어두운 바깥에서 곧장 기어 들어오는 남자","fact":"直中 — 三陽을 거치지 않고 곧바로 三陰에 듦 → 回陽救逆(四逆湯類)","hook":"대문·마당을 안 거치고 뒷문으로 곧장 = 直中","say":"안방 뒷벽의 작은 뒷문으로 한 남자가 어두운 바깥에서 곧장 기어 들어온다. 대문도 마당도 거치지 않았다. 바로 맞을 중(中), 直中 — 三陽을 거치지 않고 寒邪가 곧바로 三陰에 든다. 처음부터 그 經에서 병이 시작되는 本經自發과는 다르다. 陽이 쇠한 데 寒邪가 직중하면 陽을 되살려 거꾸로 막힌 것을 구한다 — 回陽救逆, 四逆湯 무리. 熱을 맑히는 치법은 금기다.","box":[1199,435,173,202],"src":["SW-SHR-03-04","GAP1-022","SW-SHR-05"],"tts":"안방 뒷벽의 작은 뒷문으로 한 남자가 어두운 바깥에서 곧장 기어 들어온다. 대문도 마당도 거치지 않았다. 바로 맞을 중, 직중, 삼양을 거치지 않고 한사가 곧바로 삼음에 든다. 처음부터 그 경에서 병이 시작되는 본경자발과는 다르다. 양이 쇠한 데 한사가 직중하면 양을 되살려 거꾸로 막힌 것을 구한다, 회양구역, 사역탕 무리. 열을 맑히는 치법은 금기다."},{"n":4,"obj":"부엌의 남자 — 불룩하게 붉어진 배를 움켜쥐고 토함","fact":"太陰之爲病 腹滿而吐 食不下 自利益甚 時腹自痛 — 太陰病 提綱(273조)","hook":"부른 배를 움켜쥐고 토함 = 腹滿而吐 · 時腹自痛","say":"부엌의 남자는 불룩한 배를 움켜쥐고 토한다. 太陰病의 提綱이다 — 太陰之爲病, 腹滿而吐, 食不下, 自利益甚, 時腹自痛. 배가 그득하고 토하며, 먹지 못하고, 설사가 점점 심해지고, 때때로 배가 절로 아프다. 脾가 허하고 찬 것이니 中焦를 데우는 理中湯을 쓴다.","box":[651,401,254,424],"src":["SW-M6-08"],"tts":"부엌의 남자는 불룩한 배를 움켜쥐고 토한다. 태음병의 제강이다, 태음지위병, 복만이토, 식불하, 자리익심, 시복자통. 배가 그득하고 토하며, 먹지 못하고, 설사가 점점 심해지고, 때때로 배가 절로 아프다. 비가 허하고 찬 것이니 중초를 데우는 이중탕을 쓴다."},{"n":5,"obj":"부엌 바닥 쟁반의 밥그릇과 물컵 — 손사래 치는 손","fact":"食不下 · 口不渴 — 裏寒의 표지 · 太陰 = 脾 裏虛寒","hook":"밥도 물도 마다함 = 먹지 못하고 목마르지 않음 = 속이 참","say":"부엌 바닥 쟁반에 밥그릇과 물컵이 놓였는데, 남자는 손사래를 친다. 밥이 넘어가지 않고 — 食不下, 목도 마르지 않다 — 口不渴. 속이 차갑다는 표지다. 太陰은 脾의 裏虛寒이다.","box":[584,651,159,95],"src":["SW-SHR-02-04"],"tts":"부엌 바닥 쟁반에 밥그릇과 물컵이 놓였는데, 남자는 손사래를 친다. 밥이 넘어가지 않고, 식불하, 목도 마르지 않다, 구불갈. 속이 차갑다는 표지다. 태음은 비의 이허한이다."},{"n":6,"obj":"부엌 아궁이에서 타는 불","fact":"自利益甚 → 溫中散寒 · 理中湯","hook":"아궁이 불 = 가운데(中焦)를 데워 찬 기운을 흩음","say":"부엌 아궁이에서 불이 탄다. 부엌은 집의 가운데를 데우는 곳이다. 설사가 갈수록 심한 것은 中焦가 차기 때문이다 — 自利益甚. 가운데를 데워 찬 기운을 흩는다 — 溫中散寒. 가운데를 다스리는 理中湯이다.","box":[522,565,101,91],"src":[],"tts":"부엌 아궁이에서 불이 탄다. 부엌은 집의 가운데를 데우는 곳이다. 설사가 갈수록 심한 것은 중초가 차기 때문이다, 자리익심. 가운데를 데워 찬 기운을 흩는다, 온중산한. 가운데를 다스리는 이중탕이다."},{"n":7,"obj":"안방 왼쪽 — 이불 속에 웅크려 깊이 잠든 남자 · 이불 밖으로 나온 퍼렇게 언 손발","fact":"少陰寒化 — 脈微細 · 但欲寐 · 四肢厥冷 → 四逆湯 · 回陽救逆","hook":"잠만 자려 함 + 얼어붙은 손발 = 少陰 寒化","say":"안방 왼쪽의 남자는 이불 속에 웅크려 깊이 잠들었고, 이불 밖으로 나온 손발이 퍼렇게 얼었다. 少陰病의 提綱이다 — 少陰之爲病, 脈微細, 但欲寐也. 맥은 가늘고 희미하며 그저 자려고만 한다. 心과 腎의 陽이 허해 寒으로 기운 寒化證이다. 네 팔다리가 차갑게 거슬러 오른다 — 四肢厥冷. 陽을 되살려 구하는 回陽救逆, 四逆湯이다.","box":[920,646,366,337],"src":["SW-M6-10-01","SW-SHR-04-03","SW-M6-09"],"tts":"안방 왼쪽의 남자는 이불 속에 웅크려 깊이 잠들었고, 이불 밖으로 나온 손발이 퍼렇게 얼었다. 소음병의 제강이다, 소음지위병, 맥미세, 단욕매야. 맥은 가늘고 희미하며 그저 자려고만 한다. 심과 신의 양이 허해 한으로 기운 한화증이다. 네 팔다리가 차갑게 거슬러 오른다, 사지궐랭. 양을 되살려 구하는 회양구역, 사역탕이다."},{"n":8,"obj":"안방 오른쪽 — 눈을 뜬 채 짜증스럽게 누운 남자 · 작은 상의 닭발 같은 노란 뿌리 · 접시의 갈색 아교 덩이","fact":"少陰熱化 — 心煩 不得眠 → 黃連阿膠湯 (麻黃附子細辛湯과 혼동 금지)","hook":"잠 못 드는 남자 + 黃連·阿膠 = 少陰 熱化","say":"안방 오른쪽의 남자는 눈을 뜬 채 짜증스럽게 누워 잠들지 못한다. 心과 腎의 陰이 허해 熱로 기운 熱化證이다 — 心中煩, 不得眠. 앞의 작은 상에 놓인 닭발 같은 노란 뿌리는 黃連, 접시의 갈색 덩이는 阿膠 — 黃連阿膠湯. zds-07 목욕탕의 잠 못 드는 임금과 같은 처방이다. 少陰의 陽이 허한데 겉에도 寒邪가 든 太少兩感은 麻黃附子細辛湯이니 헷갈리지 않는다.","box":[[1319,631,270,259],[1290,882,298,130]],"src":["SW-M6-10-02","SW-M6-11"],"tts":"안방 오른쪽의 남자는 눈을 뜬 채 짜증스럽게 누워 잠들지 못한다. 심과 신의 음이 허해 열로 기운 열화증이다, 심중번, 부득면. 앞의 작은 상에 놓인 닭발 같은 노란 뿌리는 황련, 접시의 갈색 덩이는 아교, 황련아교탕. zds-07 목욕탕의 잠 못 드는 임금과 같은 처방이다. 소음의 양이 허한데 겉에도 한사가 든 태소량감은 마황부자세신탕이니 헷갈리지 않는다."},{"n":9,"obj":"안방에 나란히 누운 두 남자 — 언 채 깊이 잠든 왼쪽 · 눈뜨고 뒤척이는 오른쪽","fact":"但欲寐(寒化) ↔ 不得眠(熱化) — 少陰(心腎)의 갈림목","hook":"자려고만 함 ↔ 잠 못 듦","say":"한 방에 두 남자가 나란히 누웠다. 왼쪽은 자려고만 하고 — 但欲寐, 寒化. 오른쪽은 잠을 못 이룬다 — 不得眠, 熱化. 少陰은 心과 腎이 쇠한 자리이고, 水와 火 두 기운을 다 가지므로 虛寒과 虛熱 두 갈래로 갈린다.","box":[[920,646,366,337],[1319,631,270,259]],"src":["SW-SHR-02-05"],"tts":"한 방에 두 남자가 나란히 누웠다. 왼쪽은 자려고만 하고, 단욕매, 한화. 오른쪽은 잠을 못 이룬다, 부득면, 열화. 소음은 심과 신이 쇠한 자리이고, 수와 화 두 기운을 다 가지므로 허한과 허열 두 갈래로 갈린다."},{"n":10,"obj":"맨 오른쪽 뒷방의 남자 — 머리 위로 타오르는 불꽃 · 얼음 대야에 담근 두 발","fact":"厥陰 = 上熱下寒 · 寒熱錯雜 — 마지막 經","hook":"위는 불, 아래는 얼음 = 上熱下寒","say":"맨 오른쪽 가장 어두운 뒷방. 남자의 머리 위로는 불꽃이 타오르는데 두 발은 얼음 대야에 담겼다. 위는 뜨겁고 아래는 차다 — 上熱下寒. 寒과 熱이 뒤섞였다 — 寒熱錯雜. 六經의 마지막, 厥陰이다.","box":[[1766,295,183,187],[1718,833,245,164]],"src":["SW-SHR-02-06"],"tts":"맨 오른쪽 가장 어두운 뒷방. 남자의 머리 위로는 불꽃이 타오르는데 두 발은 얼음 대야에 담겼다. 위는 뜨겁고 아래는 차다, 상열하한. 한과 열이 뒤섞였다, 한열착잡. 육경의 마지막, 궐음이다."},{"n":11,"obj":"뒷방 남자가 목마르게 들이켜는 그릇","fact":"厥陰之爲病 消渴 氣上撞心 心中疼熱 飢而不欲食 — 厥陰病 提綱(326조)","hook":"물을 들이켜도 목마름 = 消渴","say":"뒷방 남자는 그릇의 물을 목마르게 들이켠다. 厥陰病의 提綱이다 — 厥陰之爲病, 消渴, 氣上撞心, 心中疼熱, 飢而不欲食. 마셔도 목이 마르고, 氣가 가슴으로 치받고, 가슴속이 아프고 화끈하며, 배는 고픈데 먹으려 하지 않는다.","box":[1747,430,101,78],"src":["SW-M6-12"],"tts":"뒷방 남자는 그릇의 물을 목마르게 들이켠다. 궐음병의 제강이다, 궐음지위병, 소갈, 기상당심, 심중동열, 기이불욕식. 마셔도 목이 마르고, 기가 가슴으로 치받고, 가슴속이 아프고 화끈하며, 배는 고픈데 먹으려 하지 않는다."},{"n":12,"obj":"뒷방 남자가 입에서 뱉어 가슴까지 늘어뜨린 길고 허연 회충 · 다른 손의 검은 매실","fact":"食則吐蚘 → 蛔厥 · 烏梅丸","hook":"먹으면 회충을 토함 · 검은 매실 = 烏梅丸","say":"뒷방 남자가 입에서 길고 허연 회충을 뱉어 가슴까지 늘어뜨렸다. 먹으면 회충을 토한다 — 食則吐蚘. 회충 때문에 손발이 차게 거슬러 오르는 蛔厥이다. 다른 손의 검은 매실, 까마귀 오(烏), 매화 매(梅) — 烏梅丸이다.","box":[[1766,461,94,216],[1953,468,62,62]],"src":[],"tts":"뒷방 남자가 입에서 길고 허연 회충을 뱉어 가슴까지 늘어뜨렸다. 먹으면 회충을 토한다, 식즉토회. 회충 때문에 손발이 차게 거슬러 오르는 회궐이다. 다른 손의 검은 매실, 까마귀 오, 매화 매, 오매환이다."},{"n":13,"kind":"review","obj":"안채 한 바퀴 — 발자국 디딤돌과 뛰는 남자 · 뒷문으로 기어드는 남자 · 부엌 · 안방의 두 남자 · 뒷방","fact":"循經·越經·直中 / 太陰 腹滿吐利 理中 / 少陰 寒化 四逆 · 熱化 黃連阿膠 / 厥陰 上熱下寒 烏梅","hook":"발자국 · 도약 · 뒷문 / 토하는 배 · 아궁이 / 언 잠 · 뜬눈 / 불 머리 얼음 발 · 회충 · 매실","say":"다시 본다. 돌마다 찍힌 발자국 — 循經傳. 건너뛰는 도약 — 越經傳. 뒷문으로 곧장 — 直中. 부엌에서 배를 움켜쥐고 토하며 밥과 물을 마다함 — 太陰, 아궁이로 가운데를 데우는 理中湯. 안방에서 언 채 잠만 자는 남자 — 少陰 寒化, 四逆湯. 눈뜨고 뒤척이는 남자 — 少陰 熱化, 黃連阿膠湯. 뒷방의 불 머리와 얼음 발, 회충과 검은 매실 — 厥陰, 烏梅丸.","box":[[26,574,467,569],[458,130,442,879],[901,144,786,886],[1686,130,362,901]],"src":[],"tts":"다시 본다. 돌마다 찍힌 발자국, 순경전. 건너뛰는 도약, 월경전. 뒷문으로 곧장, 직중. 부엌에서 배를 움켜쥐고 토하며 밥과 물을 마다함, 태음, 아궁이로 가운데를 데우는 이중탕. 안방에서 언 채 잠만 자는 남자, 소음 한화, 사역탕. 눈뜨고 뒤척이는 남자, 소음 열화, 황련아교탕. 뒷방의 불 머리와 얼음 발, 회충과 검은 매실, 궐음, 오매환."}],"has_image":true},{"id":"zds-16","title":"溫病 衛氣營血 — 네 단계 × 證·舌·方","place":"衛兵所에서 의무실까지 군부대","image":"images/lessons/zds-16.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"군부대 — 왼쪽 정문 초소부터 연병장 · 밤의 막사 · 가장 안쪽 의무실까지 네 구역 · 혀를 내민 병사 넷","fact":"溫病 衛氣營血 — 네 단계마다 證 · 舌 · 方","hook":"衛兵 → 연병장 氣 → 兵營 營 → 의무실 血 · 깊이 = 단계","say":"군부대를 왼쪽 바깥에서 오른쪽 가장 안쪽으로 걷는다. 정문 초소, 낮의 연병장, 밤의 막사, 가장 안쪽 의무실. 지킬 위(衛)의 衛兵에서 병영의 營 깊숙이 — 溫病이 들어가는 네 단계, 衛氣營血이다. 병사 넷이 모두 혀를 내밀었다. 단계마다 증상, 혀, 처방을 본다. 葉天士 『溫熱論』이 이 강령을 세웠다.","box":null,"src":[],"tts":"군부대를 왼쪽 바깥에서 오른쪽 가장 안쪽으로 걷는다. 정문 초소, 낮의 연병장, 밤의 막사, 가장 안쪽 의무실. 지킬 위의 위병에서 병영의 영 깊숙이, 온병이 들어가는 네 단계, 위기영혈이다. 병사 넷이 모두 혀를 내밀었다. 단계마다 증상, 혀, 처방을 본다. 섭천사 온열론이 이 강령을 세웠다."},{"n":1,"obj":"정문 초소의 병사 — 외투를 어깨에 걸치고 목을 쥐고 기침","fact":"衛分 證 — 發熱 · 微惡風寒 · 頭痛 · 咽痛 · 咳嗽 · 脈浮數 (肺衛 表證)","hook":"어깨에 걸친 외투 = 조금 오싹함(微惡寒) · 목 쥐고 기침 = 咽痛 咳嗽","say":"정문 초소의 병사는 열이 나면서도 외투를 어깨에 걸쳤다. 조금 오싹하다 — 微惡風寒. 목을 쥐고 기침한다 — 咽痛, 咳嗽. 衛分證이다. 열이 나고 머리가 아프며 약간 목마르고, 맥은 뜨고 빠르다 — 脈浮數. 肺와 衛의 表證이다.","box":[137,334,288,620],"src":["SW-WQ-05"],"tts":"정문 초소의 병사는 열이 나면서도 외투를 어깨에 걸쳤다. 조금 오싹하다, 미오풍한. 목을 쥐고 기침한다, 인통, 해수. 위분증이다. 열이 나고 머리가 아프며 약간 목마르고, 맥은 뜨고 빠르다, 맥부삭. 폐와 위의 표증이다."},{"n":2,"obj":"초소 병사의 내민 혀 — 희끄무레한 분홍 바탕에 끝이 새빨감","fact":"衛分 舌 — 舌邊尖紅 · 苔薄白","hook":"가장자리·끝만 붉고 이끼가 얇게 흼","say":"초소 병사의 혀를 본다. 바탕은 희끄무레한 분홍인데 끝이 새빨갛다. 혀의 가장자리와 끝이 붉고 이끼가 얇고 희다 — 舌邊尖紅, 苔薄白. 衛分의 혀다.","box":[257,432,104,108],"src":["SW-WQ-04-01"],"tts":"초소 병사의 혀를 본다. 바탕은 희끄무레한 분홍인데 끝이 새빨갛다. 혀의 가장자리와 끝이 붉고 이끼가 얇고 희다, 설변첨홍, 태박백. 위분의 혀다."},{"n":3,"obj":"초소 병사가 든 흰·노란 인동꽃과 노란 개나리 가지","fact":"衛分 方 — 辛凉解表 · 銀翹散 · 在衛汗之可也","hook":"금은화(金銀花) + 연교(連翹 · 개나리) = 銀翹散","say":"병사가 흰 꽃과 노란 꽃이 섞인 인동꽃, 노란 개나리 가지를 들었다. 인동꽃은 金銀花, 개나리 열매는 連翹 — 銀翹散이다. 맵고 서늘한 약으로 겉을 푼다 — 辛凉解表. 葉天士의 강령은 「在衛汗之可也」 — 衛分이면 땀을 내도 된다. 傷寒은 寒邪가 피모로 들어 太陽부터 시작해 맵고 따뜻한 약으로 풀고, 溫病은 溫熱의 邪라 陰을 상하기 쉬워 맵고 서늘한 약으로 푼다.","box":[349,447,156,233],"src":["SW-WQ-03-01","SW-WQ-01","SW-SHR-01"],"tts":"병사가 흰 꽃과 노란 꽃이 섞인 인동꽃, 노란 개나리 가지를 들었다. 인동꽃은 금은화, 개나리 열매는 연교, 은교산이다. 맵고 서늘한 약으로 겉을 푼다, 신량해표. 섭천사의 강령은 재위한지가야, 위분이면 땀을 내도 된다. 상한은 한사가 피모로 들어 태양부터 시작해 맵고 따뜻한 약으로 풀고, 온병은 온열의 사라 음을 상하기 쉬워 맵고 서늘한 약으로 푼다."},{"n":4,"obj":"한낮 연병장의 병사 — 땀을 뚝뚝 흘리며 수통의 물을 들이켬 · 외투 없음","fact":"氣分 證 — 壯熱 · 不惡寒反惡熱 · 大汗 · 口渴喜冷飮 · 脈洪大","hook":"외투 없이 물을 들이켬 = 오한 없이 열을 싫어함","say":"한낮 연병장의 병사는 외투도 없이 땀을 뚝뚝 흘리며 수통의 물을 벌컥벌컥 들이켠다. 氣分證이다. 높은 열이 계속되고 — 壯熱, 오한은 없고 오히려 더위를 싫어하며 — 不惡寒反惡熱, 땀을 크게 흘리고 찬물을 찾는다. 맥은 넓고 크다. 속의 熱이 성하다. 陽明經證과 같은 壯熱이다.","box":[602,252,248,548],"src":["SW-WQ-06","GAP1-021"],"tts":"한낮 연병장의 병사는 외투도 없이 땀을 뚝뚝 흘리며 수통의 물을 벌컥벌컥 들이켠다. 기분증이다. 높은 열이 계속되고, 장열, 오한은 없고 오히려 더위를 싫어하며, 불오한반오열, 땀을 크게 흘리고 찬물을 찾는다. 맥은 넓고 크다. 속의 열이 성하다. 양명경증과 같은 장열이다."},{"n":5,"obj":"연병장 병사의 내민 혀 — 붉은 혀 위에 두툼한 누런 이끼","fact":"氣分 舌 — 舌紅 · 苔黃","hook":"붉은 혀 + 누런 이끼 = 氣分","say":"연병장 병사의 혀는 붉고 이끼가 누렇다 — 舌紅, 苔黃. 氣分의 혀다.","box":[677,310,94,79],"src":["SW-WQ-04-02"],"tts":"연병장 병사의 혀는 붉고 이끼가 누렇다, 설홍, 태황. 기분의 혀다."},{"n":6,"obj":"연병장 병사 곁에 앉은 흰 호랑이 · 바닥의 흰 돌덩이","fact":"氣分 方 — 淸氣泄熱 · 白虎湯(石膏 · 知母 · 粳米 · 甘草) · 到氣才可淸氣","hook":"흰 호랑이 = 白虎湯 · 흰 돌 = 石膏(zds-14와 같은 뜻)","say":"병사 곁에 흰 호랑이가 앉았고 바닥에 흰 돌덩이가 놓였다. 흰 호랑이는 白虎湯, 흰 돌은 그 군약 石膏다 — 石膏, 知母, 粳米, 甘草. 氣分의 熱을 맑혀 내린다 — 淸氣泄熱. 葉天士의 강령은 「到氣才可淸氣」 — 氣分에 이르러야 비로소 氣를 맑힌다.","box":[[764,392,242,365],[526,613,468,216]],"src":["SW-WQ-03-02"],"tts":"병사 곁에 흰 호랑이가 앉았고 바닥에 흰 돌덩이가 놓였다. 흰 호랑이는 백호탕, 흰 돌은 그 군약 석고다, 석고, 지모, 갱미, 감초. 기분의 열을 맑혀 내린다, 청기설열. 섭천사의 강령은 도기재가청기, 기분에 이르러야 비로소 기를 맑힌다."},{"n":7,"obj":"초승달 뜬 밤 막사 — 침상 위층에 누워 입을 벌리고 앓는 병사 · 살갗에 희미한 붉은 반점","fact":"營分 證 — 身熱夜甚 · 心煩不寐 · 時有譫語 · 斑疹隱隱 · 脈細數 (熱入心包)","hook":"밤에 더 뜨거워 앓음 = 營分 · 희미한 반점","say":"초승달 뜬 밤, 막사 침상 위층의 병사는 몸이 달아 입을 벌리고 끙끙 앓는다. 營分證이다. 밤에 열이 더하고 — 身熱夜甚, 가슴이 답답해 잠들지 못하고 — 心煩不寐, 때때로 헛소리를 한다 — 時有譫語. 살갗에 반점이 희미하게 비친다 — 斑疹隱隱. 맥은 가늘고 빠르다. 熱이 營에 들어 心을 어지럽힌다 — 熱入心包. 心은 邪를 받지 않으니 心包가 대신 받는다. 心包는 三焦와 表裏이고 臣使之官이다.","box":[[1211,329,329,248],[1095,29,94,108]],"src":["SW-WQ-07","JS-SIM-05"],"tts":"초승달 뜬 밤, 막사 침상 위층의 병사는 몸이 달아 입을 벌리고 끙끙 앓는다. 영분증이다. 밤에 열이 더하고, 신열야심, 가슴이 답답해 잠들지 못하고, 심번불매, 때때로 헛소리를 한다, 시유섬어. 살갗에 반점이 희미하게 비친다, 반진은은. 맥은 가늘고 빠르다. 열이 영에 들어 심을 어지럽힌다, 열입심포. 심은 사를 받지 않으니 심포가 대신 받는다. 심포는 삼초와 표리이고 신사지관이다."},{"n":8,"obj":"막사 병사의 내민 혀 — 짙은 진홍빛","fact":"營分 舌 — 舌絳(반드시 진홍)","hook":"진홍빛 혀 = 絳 = 營分","say":"막사 병사의 혀는 짙은 진홍빛이다 — 진홍 강(絳), 舌絳. 營分에서는 반드시 혀가 絳해진다.","box":[1405,378,50,55],"src":["SW-WQ-04-03"],"tts":"막사 병사의 혀는 짙은 진홍빛이다, 진홍 강, 설강. 영분에서는 반드시 혀가 강해진다."},{"n":9,"obj":"막사 침상 발치 탁자의 맑은 탕약 사발 — 검은 뿌리","fact":"營分 方 — 淸營透熱 · 淸營湯 · 入營猶可透熱轉氣 (犀角 · 玄參 · 羚羊角)","hook":"맑은 탕약 = 淸營 · 검은 뿌리 = 玄參","say":"침상 발치 탁자에 맑은 탕약 사발이 있고, 검은 뿌리가 담겼다. 營의 열을 맑히는 淸營湯이다. 검을 현(玄), 검은 뿌리는 玄參이다. 葉天士의 강령은 「入營猶可透熱轉氣」 — 營에 들어도 아직 열을 밖으로 내보내 氣分으로 돌릴 수 있다. 그 약이 犀角, 玄參, 羚羊角이다.","box":[1098,675,101,82],"src":["SW-WQ-03-03","SW-WQ-02"],"tts":"침상 발치 탁자에 맑은 탕약 사발이 있고, 검은 뿌리가 담겼다. 영의 열을 맑히는 청영탕이다. 검을 현, 검은 뿌리는 현참이다. 섭천사의 강령은 입영유가투열전기, 영에 들어도 아직 열을 밖으로 내보내 기분으로 돌릴 수 있다. 그 약이 서각, 현참, 영양각이다."},{"n":10,"obj":"가장 안쪽 의무실 — 온몸이 빽빽한 자줏빛 반점으로 덮여 몸부림치는 병사 · 코에서 흐르는 피와 피 담긴 대야","fact":"血分 證 — 身熱 · 躁擾昏狂 · 斑疹密布 · 吐衄便血 (熱盛動血)","hook":"빽빽한 자줏빛 반점 + 코피 = 熱이 血을 움직임","say":"가장 안쪽 의무실의 병사는 온몸이 빽빽한 자줏빛 반점으로 덮였고, 몸부림치며 코피를 쏟아 대야에 피가 고였다. 血分證이다. 반점이 빽빽하고 — 斑疹密布, 피를 토하고 코피 나고 변에 피가 섞인다 — 吐衄便血. 熱이 성해 血을 내몰고 血을 소모한다. 날뛰고 정신이 흐리다. 살갗과 평평한 자줏빛·붉은 얼룩은 斑으로 熱이 血分에 든 것이고, 좁쌀처럼 작게 돋은 붉은 것은 疹이다.","box":[[1583,473,424,385],[1819,800,148,151]],"src":["SW-WQ-08","JD-MANG-07"],"tts":"가장 안쪽 의무실의 병사는 온몸이 빽빽한 자줏빛 반점으로 덮였고, 몸부림치며 코피를 쏟아 대야에 피가 고였다. 혈분증이다. 반점이 빽빽하고, 반진밀포, 피를 토하고 코피 나고 변에 피가 섞인다, 토뉵변혈. 열이 성해 혈을 내몰고 혈을 소모한다. 날뛰고 정신이 흐리다. 살갗과 평평한 자줏빛, 붉은 얼룩은 반으로 열이 혈분에 든 것이고, 좁쌀처럼 작게 돋은 붉은 것은 진이다."},{"n":11,"obj":"의무실 병사의 내민 혀 — 검붉은 자줏빛","fact":"血分 舌 — 深絳 · 紫絳","hook":"더 짙은 진홍·자줏빛 혀 = 血分","say":"의무실 병사의 혀는 營分보다 더 짙어 검붉은 자줏빛이다 — 深絳, 紫絳. 血分의 혀다.","box":[1859,555,50,58],"src":["SW-WQ-04-04"],"tts":"의무실 병사의 혀는 영분보다 더 짙어 검붉은 자줏빛이다, 심강, 자강. 혈분의 혀다."},{"n":12,"obj":"의무실 협탁 위 작은 코뿔소 인형 · 다른 협탁의 검은 뿌리","fact":"血分 方 — 凉血散血 · 犀角地黃湯 · 入血直須凉血散血 (生地 · 丹皮 · 阿膠 · 赤芍)","hook":"코뿔소(犀) + 검은 뿌리(地黃) = 犀角地黃湯","say":"의무실 협탁 위에 작은 코뿔소 인형이, 다른 협탁에 검은 뿌리가 놓였다. 코뿔소 서(犀)의 犀角, 검은 뿌리 地黃 — 犀角地黃湯이다. 葉天士의 강령은 「入血直須凉血散血」 — 血에 들면 곧바로 피를 식히고 엉긴 피를 흩어야 한다. 그 약이 生地, 丹皮, 阿膠, 赤芍이다. 지금은 犀角 대신 물소 뿔을 쓴다.","box":[[1689,487,124,78],[1949,649,95,89]],"src":["SW-WQ-03-04"],"tts":"의무실 협탁 위에 작은 코뿔소 인형이, 다른 협탁에 검은 뿌리가 놓였다. 코뿔소 서의 서각, 검은 뿌리 지황, 서각지황탕이다. 섭천사의 강령은 입혈직수양혈산혈, 혈에 들면 곧바로 피를 식히고 엉긴 피를 흩어야 한다. 그 약이 생지, 단피, 아교, 적작이다. 지금은 서각 대신 물소 뿔을 쓴다."},{"n":13,"kind":"review","obj":"군부대 한 바퀴 — 초소 · 연병장 · 막사 · 의무실의 병사 넷과 그 혀와 약","fact":"衛 銀翹散 · 氣 白虎湯 · 營 淸營湯 · 血 犀角地黃湯 / 舌 邊尖紅 → 紅黃 → 絳 → 深絳","hook":"꽃 · 흰 호랑이 · 맑은 탕약 · 코뿔소 / 혀 끝붉음 → 누런 이끼 → 진홍 → 자주","say":"다시 걷는다. 초소 — 衛分, 살짝 오싹하고 기침, 끝이 붉은 혀, 인동꽃과 개나리의 銀翹散. 연병장 — 氣分, 땀과 찬물, 붉은 혀에 누런 이끼, 흰 호랑이 白虎湯. 밤의 막사 — 營分, 밤에 더 뜨겁고 헛소리, 진홍 혀, 淸營湯. 의무실 — 血分, 빽빽한 반점과 피, 자줏빛 혀, 코뿔소의 犀角地黃湯.","box":[[0,0,507,1143],[507,0,519,1143],[1026,0,513,1143],[1539,0,509,1143]],"src":[],"tts":"다시 걷는다. 초소, 위분, 살짝 오싹하고 기침, 끝이 붉은 혀, 인동꽃과 개나리의 은교산. 연병장, 기분, 땀과 찬물, 붉은 혀에 누런 이끼, 흰 호랑이 백호탕. 밤의 막사, 영분, 밤에 더 뜨겁고 헛소리, 진홍 혀, 청영탕. 의무실, 혈분, 빽빽한 반점과 피, 자줏빛 혀, 코뿔소의 서각지황탕."}],"has_image":true}]</script>
<script>
// 한의학 Sketchy 과 재생기 — 과 목록 · 투어 · 복습 · 시험. build_player.py가 lessons.html에 끼워 넣는다.
(function () {
  'use strict';

  var LESSONS = JSON.parse(document.getElementById('lessons-data').textContent);
  var byId = Object.create(null);
  LESSONS.forEach(function (L) { byId[L.id] = L; });

  var KEY = 'sketchy_lessons_v1';          // { <과id>: [{date, score, total, wrong:[n…]}] }
  var PKEY = 'sketchy_lessons_prefs_v1';   // { rate, voice } — 이 브라우저만의 편의 설정
  var MODES = ['tour', 'review', 'test'];

  function $(id) { return document.getElementById(id); }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ---------- 저장소 (막혀 있어도 페이지는 돈다) ----------
  var memResults = null, storeBroken = false;
  function readResults() {
    if (storeBroken && memResults) return memResults;
    try {
      var raw = localStorage.getItem(KEY);
      var o = raw ? JSON.parse(raw) : {};
      if (o && typeof o === 'object' && !Array.isArray(o)) return o;
    } catch (e) { storeBroken = true; }
    return memResults || {};
  }
  function pushResult(id, rec) {
    var all = readResults();
    if (!Array.isArray(all[id])) all[id] = [];
    all[id].push(rec);
    memResults = all;
    try { localStorage.setItem(KEY, JSON.stringify(all)); return true; }
    catch (e) { storeBroken = true; return false; }
  }
  var prefs = { rate: 1, voice: true };
  try {
    var p = JSON.parse(localStorage.getItem(PKEY) || '{}') || {};
    if (typeof p.rate === 'number') prefs.rate = clamp(Math.round(p.rate * 10) / 10, 0.8, 1.4);
    if (p.voice === false) prefs.voice = false;
  } catch (e) { /* 기본값 */ }
  function savePrefs() { try { localStorage.setItem(PKEY, JSON.stringify(prefs)); } catch (e) { /* 무시 */ } }

  function fmtDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return String(iso || '');
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
  }
  function exportResults() {
    var all = readResults();
    var blob = new Blob([JSON.stringify(all, null, 1) + '\n'], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sketchy_lessons_v1_' + fmtDate(new Date().toISOString()).replace(/-/g, '') + '.json';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  }

  // ---------- 정거장 ----------
  function kindOf(st) { return st.kind === 'frame' || st.kind === 'review' ? st.kind : 'station'; }
  function boxesOf(st) {
    var b = st.box;
    if (!Array.isArray(b) || !b.length) return [];
    if (typeof b[0] === 'number') return b.length === 4 ? [b] : [];
    return b.filter(function (x) { return Array.isArray(x) && x.length === 4; });
  }
  function contentIdx(L) {
    var out = [];
    L.stations.forEach(function (st, i) { if (kindOf(st) === 'station' && boxesOf(st).length) out.push(i); });
    return out;
  }

  // ---------- 읽어 주기 (speechSynthesis, ko-KR) ----------
  var gestured = false;
  ['pointerdown', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () { gestured = true; }, true);
  });
  function activated() {
    if (navigator.userActivation) return navigator.userActivation.hasBeenActive || gestured;
    return gestured;
  }
  var tts = {
    ok: 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function',
    voice: null, token: 0,
    pick: function () {
      if (!this.ok) return;
      var vs = window.speechSynthesis.getVoices() || [];
      var ko = vs.filter(function (v) { return /^ko([-_]|$)/i.test(v.lang || ''); });
      this.voice = ko.filter(function (v) { return v.localService; })[0] || ko[0] || null;
    },
    speak: function (text, rate, done) {
      this.stop();
      var my = ++this.token, self = this;
      var parts = (String(text).match(/[^.!?。…]+[.!?。…]*\s*/g) || [String(text)])
        .map(function (s) { return s.trim(); }).filter(Boolean);
      var i = 0;
      function next() {
        if (my !== self.token) return;
        if (i >= parts.length) { done(true); return; }
        try {
          var u = new SpeechSynthesisUtterance(parts[i++]);
          u.lang = 'ko-KR';
          if (self.voice) { try { u.voice = self.voice; } catch (e) { /* lang만으로 */ } }
          u.rate = rate;
          u.onend = next;
          u.onerror = function () { if (my === self.token) done(false); };
          window.speechSynthesis.speak(u);
        } catch (e) { done(false); }
      }
      next();
    },
    stop: function () {
      this.token++;
      if (this.ok) { try { window.speechSynthesis.cancel(); } catch (e) { /* 무시 */ } }
    }
  };
  if (tts.ok) {
    tts.pick();
    try { window.speechSynthesis.addEventListener('voiceschanged', function () { tts.pick(); }); } catch (e) { /* 옛 브라우저 */ }
  }

  // ---------- 상태 ----------
  var S = { L: null, mode: 'tour', i: 0, auto: false, heard: -1, speaking: false, sel: -1, test: null };
  var autoTimer = 0, safetyTimer = 0;

  // ---------- 그림 · 덮개 ----------
  var stage = $('stage'), pic = $('pic'), ph = $('ph'), svg = $('dim');
  var SVGNS = 'http://www.w3.org/2000/svg';
  function mountStage(L) {
    stage.style.setProperty('--w', L.w);
    stage.style.setProperty('--h', L.h);
    svg.setAttribute('viewBox', '0 0 ' + L.w + ' ' + L.h);
    ['holes', 'maskBase', 'shade'].forEach(function (id) {
      var el = $(id); el.setAttribute('width', L.w); el.setAttribute('height', L.h);
    });
    ph.textContent = '그림 준비 중 — ' + L.image;
    pic.alt = L.title + ' — ' + (L.place || '');
    pic.onerror = function () { pic.hidden = true; ph.hidden = false; };
    pic.onload = function () { pic.hidden = false; ph.hidden = true; };
    if (L.has_image === false) {
      pic.removeAttribute('src'); pic.hidden = true; ph.hidden = false;
    } else if (pic.getAttribute('src') !== L.image) {
      ph.hidden = true; pic.hidden = false; pic.src = L.image;
    }
    buildHots(L);
  }
  function svgRect(b, cls, extra) {
    var r = document.createElementNS(SVGNS, 'rect');
    r.setAttribute('x', b[0]); r.setAttribute('y', b[1]);
    r.setAttribute('width', b[2]); r.setAttribute('height', b[3]);
    r.setAttribute('rx', 10);
    if (cls) r.setAttribute('class', cls);
    if (extra) Object.keys(extra).forEach(function (k) { r.setAttribute(k, extra[k]); });
    return r;
  }
  function setHoles(boxes) {
    var holeG = $('holeG'), ringG = $('ringG');
    holeG.textContent = '';
    var fresh = ringG.cloneNode(false);           // 새 노드 → 밝힘 애니메이션 다시
    boxes.forEach(function (b) {
      holeG.appendChild(svgRect(b, null, { fill: '#000' }));
      fresh.appendChild(svgRect(b, 'ring-o', { 'vector-effect': 'non-scaling-stroke' }));
      fresh.appendChild(svgRect(b, 'ring', { 'vector-effect': 'non-scaling-stroke' }));
    });
    ringG.parentNode.replaceChild(fresh, ringG);
    stage.classList.toggle('dim', boxes.length > 0);
  }
  function buildHots(L) {
    var hots = $('hots');
    hots.textContent = '';
    var items = [];
    L.stations.forEach(function (st, i) {
      if (kindOf(st) !== 'station') return;
      boxesOf(st).forEach(function (b) { items.push({ i: i, n: st.n, b: b, area: b[2] * b[3] }); });
    });
    items.sort(function (a, b) { return b.area - a.area; });   // 작은 상자가 위에 오도록
    items.forEach(function (it) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'hot';
      el.dataset.i = it.i;
      el.setAttribute('aria-label', '정거장 ' + it.n);
      el.style.left = (it.b[0] / L.w * 100) + '%';
      el.style.top = (it.b[1] / L.h * 100) + '%';
      el.style.width = (it.b[2] / L.w * 100) + '%';
      el.style.height = (it.b[3] / L.h * 100) + '%';
      hots.appendChild(el);
    });
  }

  // ---------- 화면 전환 ----------
  function setText(el, t) { el.textContent = t == null ? '' : String(t); }
  function setHook(el, t) { el.hidden = !t; setText(el.querySelector('span'), t); }

  function showList(missing) {
    stopAll(); setAuto(false);
    S.L = null;
    $('lessonView').hidden = true; $('listView').hidden = false; $('homeLink').hidden = true;
    document.title = '한의학 Sketchy 과';
    var note = $('listNotice');
    note.hidden = !missing;
    if (missing) note.textContent = '과 「' + missing + '」를 찾지 못했다. 아래 목록에서 고르세요.';
    var all = readResults(), ul = $('lessonList');
    ul.textContent = '';
    if (!LESSONS.length) {
      var li0 = document.createElement('li'); li0.className = 'hint';
      li0.textContent = '과가 없다 — src/lessons/l/*.json을 넣고 build_player.py를 돌린다.';
      ul.appendChild(li0);
    }
    LESSONS.forEach(function (L) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'lcard'; a.href = '?l=' + encodeURIComponent(L.id); a.dataset.go = L.id;
      var t = document.createElement('span'); t.className = 'lc-title'; t.textContent = L.title;
      if (L.id.charAt(0) === '_') { var tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = '데모'; t.appendChild(tg); }
      if (L.has_image === false) { var tg2 = document.createElement('span'); tg2.className = 'tag'; tg2.textContent = '그림 없음'; t.appendChild(tg2); }
      var pl = document.createElement('span'); pl.className = 'lc-place'; pl.textContent = L.place || '';
      var m = document.createElement('span'); m.className = 'lc-meta';
      var c = document.createElement('span'); c.textContent = '정거장 ' + L.stations.length + ' · 시험 ' + contentIdx(L).length;
      m.appendChild(c);
      var recs = Array.isArray(all[L.id]) ? all[L.id] : [];
      var r = document.createElement('span');
      if (recs.length) {
        var last = recs[recs.length - 1];
        r.className = 'rec';
        r.textContent = '마지막 시험 ' + last.score + '/' + last.total + ' · ' + fmtDate(last.date) + (recs.length > 1 ? ' (' + recs.length + '회)' : '');
      } else { r.className = 'none'; r.textContent = '시험 기록 없음'; }
      m.appendChild(r);
      a.appendChild(t); a.appendChild(pl); a.appendChild(m);
      li.appendChild(a); ul.appendChild(li);
    });
    $('storeNote').textContent = storeBroken ? '브라우저 저장소가 막혀 있어 기록은 이 탭에만 남는다.' : '';
  }

  function openLesson(id, mode) {
    var L = byId[id];
    if (S.L !== L) { stopAll(); setAuto(false); S.L = L; S.i = 0; S.sel = -1; S.heard = -1; mountStage(L); }
    $('listView').hidden = true; $('lessonView').hidden = false; $('homeLink').hidden = false;
    setText($('lTitle'), L.title);
    setText($('lPlace'), L.place ? '장소 · ' + L.place : '');
    document.title = L.title + ' — Sketchy 과';
    buildDots(L);
    setMode(mode, true);
  }

  function setMode(mode, fromRoute) {
    if (MODES.indexOf(mode) < 0) mode = 'tour';
    stopAll(); setAuto(false);
    S.mode = mode;
    document.querySelectorAll('.modes button').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
    });
    $('tourCtrl').hidden = $('tourCard').hidden = $('tourOpts').hidden = mode !== 'tour';
    $('reviewCtrl').hidden = $('reviewCard').hidden = mode !== 'review';
    $('testCtrl').hidden = $('testCard').hidden = mode !== 'test';
    $('hots').hidden = mode !== 'review';
    if (!fromRoute) replaceUrl(S.L.id, mode);
    if (mode === 'tour') goTour(S.i);
    else if (mode === 'review') { setHoles([]); selectReview(S.sel); }
    else startTest();
  }

  // ---------- 투어 ----------
  function buildDots(L) {
    var box = $('tDots');
    box.textContent = '';
    L.stations.forEach(function (st, i) {
      var k = kindOf(st), d = document.createElement('button');
      d.type = 'button'; d.className = 'dot ' + k; d.dataset.act = 'goto'; d.dataset.i = i;
      d.textContent = k === 'frame' ? '틀' : k === 'review' ? '↺' : st.n;
      d.setAttribute('aria-label', (k === 'frame' ? '틀' : k === 'review' ? '되짚기' : '정거장 ' + st.n) + (st.obj ? ' — ' + st.obj : ''));
      box.appendChild(d);
    });
  }
  function renderTour() {
    var L = S.L, st = L.stations[S.i], k = kindOf(st);
    setHoles(k === 'frame' ? [] : boxesOf(st));
    var bd = $('tBadge');
    bd.className = 'badge ' + k;
    bd.textContent = k === 'frame' ? '틀' : k === 'review' ? '되짚기' : '정거장 ' + st.n;
    var obj = k === 'frame' ? (L.place || st.obj) : st.obj;
    setText($('tObj'), obj === bd.textContent ? '' : obj);    // 「되짚기 되짚기」 겹침 피하기
    setText($('tFact'), st.fact);
    setHook($('tHook'), st.hook);
    setText($('tSay'), st.say);
    var src = $('tSrc'), cards = Array.isArray(st.src) ? st.src : [];
    src.hidden = !cards.length; src.textContent = cards.length ? '카드 ' + cards.join(' · ') : '';
    setText($('tCount'), (S.i + 1) + ' / ' + L.stations.length);
    document.querySelector('[data-act="prev"]').disabled = S.i === 0;
    document.querySelector('[data-act="next"]').disabled = S.i === L.stations.length - 1;
    document.querySelectorAll('#tDots .dot').forEach(function (d) {
      d.setAttribute('aria-current', String(+d.dataset.i === S.i));
    });
  }
  function goTour(i) {
    S.i = clamp(i, 0, S.L.stations.length - 1);
    renderTour();
    playStation(false);
  }
  function estimateMs(text) { return Math.max(4000, String(text || '').length * 95 / prefs.rate); }
  function clearTimers() { clearTimeout(autoTimer); clearTimeout(safetyTimer); }
  function setSpeaking(on) {
    S.speaking = on;
    setText($('replayBtn'), on ? '읽기 멈춤' : '다시 듣기');
  }
  function stopAll() { clearTimers(); tts.stop(); setSpeaking(false); }
  function afterStation() {
    clearTimers();
    if (!S.auto || S.mode !== 'tour') return;
    if (S.i >= S.L.stations.length - 1) { setAuto(false); return; }
    autoTimer = setTimeout(function () { goTour(S.i + 1); }, 900);
  }
  function playStation(force) {
    clearTimers(); tts.stop(); setSpeaking(false);
    if (S.mode !== 'tour') return;
    var st = S.L.stations[S.i];
    // 읽어 주기는 한글 독음 대본(tts)을 쓴다 — 브라우저 음성이 한자를 중국어로 읽기 때문. 화면에는 한자가 든 say가 그대로 보인다.
    var text = st.tts || st.say || st.fact || '', at = S.i;
    if (tts.ok && (prefs.voice || force) && activated() && text) {
      setSpeaking(true);
      tts.speak(text, prefs.rate, function () { S.heard = at; setSpeaking(false); afterStation(); });
      if (S.auto) safetyTimer = setTimeout(function () { stopAll(); afterStation(); }, estimateMs(text) * 2 + 4000);
    } else if (S.auto) {
      var shown = (st.fact || '') + (st.hook || '') + (st.say || '');
      autoTimer = setTimeout(afterStation, estimateMs(shown));
    }
  }
  function setAuto(on) {
    S.auto = !!on;
    var b = document.querySelector('[data-act="auto"]');
    if (b) b.setAttribute('aria-pressed', String(S.auto));
    if (!S.auto) { clearTimers(); return; }
    if (S.mode !== 'tour' || !S.L) return;
    if (S.i >= S.L.stations.length - 1) { goTour(0); return; }
    if (S.speaking) return;                       // 지금 읽는 것이 끝나면 넘어간다
    if (S.heard === S.i) { afterStation(); return; }   // 이미 다 들은 정거장이면 바로 다음으로
    playStation(false);
  }

  // ---------- 복습 ----------
  function selectReview(i) {
    var L = S.L;
    S.sel = i;
    document.querySelectorAll('#hots .hot').forEach(function (h) { h.classList.toggle('sel', +h.dataset.i === i); });
    var idx = contentIdx(L), pos = idx.indexOf(i);
    setText($('rCount'), (pos < 0 ? '–' : pos + 1) + ' / ' + idx.length);
    if (i < 0 || !L.stations[i]) { $('rHint').hidden = false; $('rBody').hidden = true; return; }
    var st = L.stations[i];
    $('rHint').hidden = true; $('rBody').hidden = false;
    setText($('rBadge'), '정거장 ' + st.n);
    setText($('rObj'), st.obj);
    setText($('rFact'), st.fact);
    setHook($('rHook'), st.hook);
  }
  function stepReview(d) {
    var idx = contentIdx(S.L);
    if (!idx.length) return;
    var pos = idx.indexOf(S.sel);
    pos = pos < 0 ? (d > 0 ? 0 : idx.length - 1) : (pos + d + idx.length) % idx.length;
    selectReview(idx[pos]);
  }

  // ---------- 시험 (순서대로, 틀·되짚기 제외) ----------
  function startTest() {
    var idx = contentIdx(S.L);
    S.test = { idx: idx, k: 0, phase: idx.length ? 'ask' : 'done', right: 0, wrong: [], saved: null };
    renderTest();
  }
  function renderTest() {
    var T = S.test, L = S.L;
    $('tsAsk').hidden = T.phase !== 'ask';
    $('tsJudge').hidden = T.phase !== 'shown';
    $('tsDone').hidden = T.phase !== 'done';
    $('sAsk').hidden = T.phase !== 'ask';
    $('sShow').hidden = T.phase !== 'shown';
    $('sDone').hidden = T.phase !== 'done';
    if (T.phase === 'done') {
      setHoles([]);
      setText($('sBadge'), '결과');
      setText($('sProg'), '');
      setText($('sScore'), T.idx.length ? T.right + ' / ' + T.idx.length : '시험할 정거장이 없다');
      setText($('sSaved'), T.saved === null ? '' : T.saved ? '기록을 남겼다.' : '브라우저 저장소가 막혀 기록은 이 탭에만 남는다 — 내보내기로 보관하세요.');
      var ul = $('sWrong');
      ul.textContent = '';
      T.wrong.forEach(function (n) {
        var i = -1;
        L.stations.forEach(function (st, j) { if (st.n === n && kindOf(st) === 'station') i = j; });
        if (i < 0) return;
        var st = L.stations[i], li = document.createElement('li'), b = document.createElement('button');
        b.type = 'button'; b.dataset.act = 'goto-tour'; b.dataset.i = i;
        var f = document.createElement('span'); f.className = 'wf'; f.textContent = st.n + '. ' + (st.fact || '');
        var o = document.createElement('span'); o.className = 'wo'; o.textContent = (st.obj || '') + (st.hook ? ' · ' + st.hook : '') + ' — 투어로 보기';
        b.appendChild(f); b.appendChild(o); li.appendChild(b); ul.appendChild(li);
      });
      if (T.idx.length && !T.wrong.length) {
        var ok = document.createElement('li'); ok.className = 'hint'; ok.textContent = '틀린 정거장 없음.'; ul.appendChild(ok);
      }
      var recs = (readResults()[L.id] || []).slice(-6, -1).reverse();
      setText($('sPast'), recs.length ? '지난 기록 · ' + recs.map(function (r) { return r.score + '/' + r.total + ' (' + fmtDate(r.date) + ')'; }).join(' · ') : '');
      return;
    }
    var st = L.stations[T.idx[T.k]];
    setHoles(boxesOf(st));
    setText($('sBadge'), '정거장 ' + st.n);
    setText($('sProg'), (T.k + 1) + ' / ' + T.idx.length + ' · 맞음 ' + T.right);
    if (T.phase === 'shown') {
      setText($('sObj'), st.obj);
      setText($('sFact'), st.fact);
      setHook($('sHook'), st.hook);
    }
  }
  function judge(ok) {
    var T = S.test;
    if (!T || T.phase !== 'shown') return;
    var st = S.L.stations[T.idx[T.k]];
    if (ok) T.right++; else T.wrong.push(st.n);
    T.k++;
    if (T.k >= T.idx.length) {
      T.phase = 'done';
      T.saved = pushResult(S.L.id, { date: new Date().toISOString(), score: T.right, total: T.idx.length, wrong: T.wrong.slice() });
    } else T.phase = 'ask';
    renderTest();
  }

  // ---------- 주소 ----------
  function urlFor(id, mode) {
    if (!id) return location.pathname;
    return '?l=' + encodeURIComponent(id) + (mode && mode !== 'tour' ? '&m=' + mode : '');
  }
  function pushUrl(id, mode) {
    try { history.pushState(null, '', urlFor(id, mode)); route(); }
    catch (e) { location.href = urlFor(id, mode); }
  }
  function replaceUrl(id, mode) {
    try { history.replaceState(null, '', urlFor(id, mode)); } catch (e) { /* file:// 등 */ }
  }
  function route() {
    var q = new URLSearchParams(location.search);
    var id = q.get('l');
    if (id && byId[id]) openLesson(id, q.get('m') || 'tour');
    else showList(id || null);
  }
  window.addEventListener('popstate', route);

  // ---------- 입력 ----------
  document.addEventListener('click', function (e) {
    var t = e.target.closest('a[data-go], [data-act], [data-mode], .hot');
    if (!t) return;
    if (t.matches('a[data-go]')) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault(); pushUrl(t.dataset.go, 'tour'); return;
    }
    if (t.tagName === 'BUTTON' && e.detail > 0) t.blur();   // 마우스로 누른 뒤 스페이스가 단추를 다시 누르지 않게
    if (t.classList.contains('hot')) { selectReview(+t.dataset.i); return; }
    if (t.dataset.mode) { if (t.dataset.mode !== S.mode) setMode(t.dataset.mode); return; }
    switch (t.dataset.act) {
      case 'export': exportResults(); break;
      case 'prev': goTour(S.i - 1); break;
      case 'next': goTour(S.i + 1); break;
      case 'goto': goTour(+t.dataset.i); break;
      case 'goto-tour': S.i = +t.dataset.i; setMode('tour'); break;
      case 'auto': setAuto(!S.auto); break;
      case 'voice':
        prefs.voice = !prefs.voice; savePrefs();
        t.setAttribute('aria-pressed', String(prefs.voice));
        if (prefs.voice) playStation(false); else { stopAll(); if (S.auto) playStation(false); }
        break;
      case 'replay': if (S.speaking) { setAuto(false); stopAll(); } else playStation(true); break;
      case 'rprev': stepReview(-1); break;
      case 'rnext': stepReview(1); break;
      case 'reveal': if (S.test && S.test.phase === 'ask') { S.test.phase = 'shown'; renderTest(); } break;
      case 'right': judge(true); break;
      case 'wrong': judge(false); break;
      case 'retest': startTest(); break;
    }
  });
  $('homeLink').addEventListener('click', function (e) {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault(); pushUrl(null);
  });
  var rate = $('rate');
  function showRate() { setText($('rateOut'), prefs.rate.toFixed(1) + '×'); }
  rate.value = prefs.rate; showRate();
  rate.addEventListener('input', function () { prefs.rate = clamp(+rate.value, 0.8, 1.4); showRate(); });
  rate.addEventListener('change', function () { savePrefs(); if (S.speaking) playStation(true); });
  document.querySelector('[data-act="voice"]').setAttribute('aria-pressed', String(prefs.voice));
  if (!tts.ok) {
    $('ttsNote').hidden = false;
    ['voice', 'replay'].forEach(function (a) { document.querySelector('[data-act="' + a + '"]').disabled = true; });
    rate.disabled = true;
  }

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || !S.L || $('lessonView').hidden) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    var k = e.key, space = k === ' ' || k === 'Spacebar';
    if (space && tag === 'BUTTON') return;                    // 키보드로 고른 단추는 제 일을 한다
    if (!space && k !== 'ArrowLeft' && k !== 'ArrowRight') return;
    e.preventDefault();
    if (S.mode === 'tour') {
      if (k === 'ArrowLeft') goTour(S.i - 1);
      else if (k === 'ArrowRight') goTour(S.i + 1);
      else setAuto(!S.auto);
    } else if (S.mode === 'review') {
      if (!space) stepReview(k === 'ArrowLeft' ? -1 : 1);
    } else if (S.test) {
      if (S.test.phase === 'ask' && space) { S.test.phase = 'shown'; renderTest(); }
      else if (S.test.phase === 'shown' && !space) judge(k === 'ArrowRight');
    }
  });

  route();
})();

</script>
</body>
</html>
