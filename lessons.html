陽이 總綱: 陽=熱·實·表 · 陰=寒·虛·裏","hook":"밝은 햇빛 쪽 = 陽 = 實 · 짙푸른 쪽 = 陰 = 虛","say":"왼쪽 實의 성은 햇빛이 번진 밝은 쪽, 오른쪽 虛의 성은 짙푸른 어두운 쪽이다. 八綱의 강령은 陰陽 — 陽에는 熱, 實, 表가 들고, 陰에는 寒, 虛, 裏가 든다. 實은 陽, 虛는 陰이다.","box":[[0,0,1012,551],[1035,0,1012,551]],"src":["BZ-BY-02-01"],"tts":"왼쪽 실의 성은 햇빛이 번진 밝은 쪽, 오른쪽 허의 성은 짙푸른 어두운 쪽이다. 팔강의 강령은 음양, 양에는 열, 실, 표가 들고, 음에는 한, 허, 이가 든다. 실은 양, 허는 음이다."},{"n":6,"kind":"review","obj":"두 성 한 바퀴 — 격전과 수문 / 무너진 성과 보급 수레","fact":"邪氣盛則實 → 瀉 · 精氣奪則虛 → 補 · 實=陽 · 虛=陰","hook":"격전 · 수문 / 늙은 수비병 · 보급 수레","say":"다시 본다. 햇빛 속 격전 — 邪도 正도 세다, 邪氣盛則實. 목소리 우렁차고 숨이 거칠다. 수문으로 쓸어냄 — 實者瀉之. 짙푸른 쪽 무너진 성과 지친 늙은 수비병 — 正이 약하다, 精氣奪則虛. 목소리 작고 숨이 약하다. 보급 수레 — 虛者補之. 實은 陽, 虛는 陰.","box":[[144,134,868,755],[718,502,597,582],[1035,148,741,762],[1741,437,186,172]],"src":[],"tts":"다시 본다. 햇빛 속 격전, 사도 정도 세다, 사기성즉실. 목소리 우렁차고 숨이 거칠다. 수문으로 쓸어냄, 실자사지. 짙푸른 쪽 무너진 성과 지친 늙은 수비병, 정이 약하다, 정기탈즉허. 목소리 작고 숨이 약하다. 보급 수레, 허자보지. 실은 양, 허는 음."}],"has_image":true},{"id":"hp-15","title":"陰陽失調 ① 偏盛·偏衰 — 실한 寒熱과 허한 寒熱","place":"놀이터의 시소 넷","image":"images/lessons/hp-15.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"놀이터의 시소 넷 — 왼쪽은 빨강 해 자리 · 오른쪽은 파랑 달 자리 / 윗줄은 한쪽이 무거워지고 아랫줄은 한쪽이 가벼워짐","fact":"陰陽失調 — 偏盛(한쪽이 넘침) = 實 · 偏衰(한쪽이 모자람) = 虛","hook":"해 자리 = 陽 · 달 자리 = 陰 · 무거워짐 = 盛 · 가벼워짐 = 衰","say":"놀이터에 시소가 넷이다. 시소마다 왼쪽은 빨강 해 자리, 陽이고, 오른쪽은 파랑 달 자리, 陰이다. 陰陽이 고르면 시소는 수평이다. 치우칠 편 — 윗줄 둘은 한쪽에 무게가 더 얹혀 넘친다, 偏盛. 實이다. 아랫줄 둘은 한쪽이 너무 가벼워 모자란다, 偏衰. 虛다.","box":null,"src":[],"tts":"놀이터에 시소가 넷이다. 시소마다 왼쪽은 빨강 해 자리, 양이고, 오른쪽은 파랑 달 자리, 음이다. 음양이 고르면 시소는 수평이다. 치우칠 편, 윗줄 둘은 한쪽에 무게가 더 얹혀 넘친다, 편성. 실이다. 아랫줄 둘은 한쪽이 너무 가벼워 모자란다, 편쇠. 허다."},{"n":1,"obj":"윗줄 왼쪽 — 해 자리 아이 위에 불길 이는 무거운 쇳덩이가 얹혀 해 쪽이 쿵 내려앉음 · 아이는 벌건 얼굴에 땀","fact":"陽勝則熱 — 實熱: 壯熱·面紅目赤·煩躁·渴喜冷飮·小便短赤","hook":"해 자리에 얹힌 불덩이 쇳덩이 = 陽이 넘침 = 實熱","say":"윗줄 왼쪽, 해 자리 아이 위에 불길 이는 무거운 쇳덩이가 얹혀 해 쪽이 쿵 내려앉았다. 아이는 얼굴이 벌겋고 땀범벅이다. 陽이 이기면 뜨겁다 — 陽勝則熱, 陽偏勝은 實熱證이다. 높은 열 壯熱, 붉은 얼굴과 눈 面紅目赤, 煩躁, 찬물을 찾는 갈증, 舌紅苔黃, 脈洪數. 소변은 짧고 누렇고 붉으며 — 短少黃赤, 대변은 굳는다. 맑고 길게 많이 나오면 寒이다. 陽이 성하면 陰이 상한다 — 陽勝則陰病.","box":[[105,19,849,517],[177,19,229,272],[199,271,179,251]],"src":["BGI-YY-01","BZ-BY-03","JD-MUN-04-04"],"tts":"윗줄 왼쪽, 해 자리 아이 위에 불길 이는 무거운 쇳덩이가 얹혀 해 쪽이 쿵 내려앉았다. 아이는 얼굴이 벌겋고 땀범벅이다. 양이 이기면 뜨겁다, 양승즉열, 양편승은 실열증이다. 높은 열 장열, 붉은 얼굴과 눈 면홍목적, 번조, 찬물을 찾는 갈증, 설홍태황, 맥홍삭. 소변은 짧고 누렇고 붉으며, 단소황적, 대변은 굳는다. 맑고 길게 많이 나오면 한이다. 양이 성하면 음이 상한다, 양승즉음병."},{"n":2,"obj":"윗줄 오른쪽 — 달 자리 아이에 커다란 얼음 덩어리가 얹혀 달 쪽이 쿵 내려앉음 · 아이는 배를 움켜쥐고 맑은 콧물을 흘리며 떪","fact":"陰勝則寒 — 實寒: 脘腹冷痛(寒凝) · 맑은 콧물","hook":"달 자리에 얹힌 얼음 덩어리 = 陰이 넘침 = 實寒","say":"윗줄 오른쪽, 달 자리 아이에 커다란 얼음 덩어리가 얹혀 달 쪽이 쿵 내려앉았다. 아이는 배를 움켜쥐고 맑은 콧물을 흘리며 떤다. 陰이 이기면 차다 — 陰勝則寒, 陰偏勝은 實寒證이다. 배가 차고 아프다 — 冷痛은 寒이 엉긴 寒凝이다. 陰이 성하면 陽이 상한다 — 陰勝則陽病.","box":[[1100,40,863,510],[1597,156,352,395]],"src":["JD-MOON-04-05"],"tts":"윗줄 오른쪽, 달 자리 아이에 커다란 얼음 덩어리가 얹혀 달 쪽이 쿵 내려앉았다. 아이는 배를 움켜쥐고 맑은 콧물을 흘리며 떤다. 음이 이기면 차다, 음승즉한, 음편승은 실한증이다. 배가 차고 아프다, 냉통은 한이 엉긴 한응이다. 음이 성하면 양이 상한다, 음승즉양병."},{"n":3,"obj":"시소마다 빨강 해 자리와 파랑 달 자리","fact":"八綱 — 熱은 陽, 寒은 陰 (陰陽이 總綱: 陽=熱實表 · 陰=寒虛裏)","hook":"해 = 陽 = 熱 · 달 = 陰 = 寒","say":"시소마다 빨강 해 자리와 파랑 달 자리가 있다. 八綱의 강령은 陰陽 — 熱, 實, 表는 陽에 들고, 寒, 虛, 裏는 陰에 든다. 熱은 陽, 寒은 陰이다.","box":[[115,677,94,101],[1859,713,79,94]],"src":["BZ-BY-02-01"],"tts":"시소마다 빨강 해 자리와 파랑 달 자리가 있다. 팔강의 강령은 음양, 열, 실, 표는 양에 들고, 한, 허, 이는 음에 든다. 열은 양, 한은 음이다."},{"n":4,"obj":"아랫줄 왼쪽 — 해 자리에 담요를 두르고 눈을 감은 창백한 아이 · 너무 가벼워 해 쪽이 높이 들림","fact":"陽虛則寒 — 虛寒: 面色㿠白·畏寒肢冷·倦臥神疲·小便淸長","hook":"가벼워 들린 해 자리의 창백한 아이 = 陽이 모자람 = 虛寒","say":"아랫줄 왼쪽, 해 자리에는 담요를 두르고 눈을 감은 창백한 아이가 앉았다. 너무 가벼워 해 쪽이 높이 들렸다. 陽이 모자라 陰이 상대적으로 무거워졌다 — 陽虛則寒, 陽偏衰의 虛寒證이다. 얼굴이 희고 — 面色㿠白, 추위를 타고 손발이 차고 — 畏寒肢冷, 舌淡 脈遲. 웅크려 눕고 정신이 피로하며 — 倦臥神疲, 소변이 맑고 길고, 소화 안 된 설사를 한다 — 下利淸穀. 脾腎의 陽虛가 주이고, 腎陽이 근본이다. 陰勝則寒과는 다르다. 陰勝則寒은 陰寒의 邪가 주인 實寒이고 虛의 모습이 뚜렷하지 않다. 陽虛則寒은 虛해서 생긴 寒이다.","box":[[69,646,899,497],[184,646,157,208]],"src":["BGI-YY-03","BGI-YY-08"],"tts":"아랫줄 왼쪽, 해 자리에는 담요를 두르고 눈을 감은 창백한 아이가 앉았다. 너무 가벼워 해 쪽이 높이 들렸다. 양이 모자라 음이 상대적으로 무거워졌다, 양허즉한, 양편쇠의 허한증이다. 얼굴이 희고, 면색황백, 추위를 타고 손발이 차고, 외한지랭, 설담 맥지. 웅크려 눕고 정신이 피로하며, 권와신피, 소변이 맑고 길고, 소화 안 된 설사를 한다, 하리청곡. 비신의 양허가 주이고, 신양이 근본이다. 음승즉한과는 다르다. 음승즉한은 음한의 사가 주인 실한이고 허의 모습이 뚜렷하지 않다. 양허즉한은 허해서 생긴 한이다."},{"n":5,"obj":"아랫줄 왼쪽 도우미 — 해 쪽 판 위의 작은 화로와 금테 궤짝 곁에, 금테 궤짝을 하나 더 두 손으로 내려놓음","fact":"益火之源 以消陰翳 — 補陽(腎氣丸) · 陰病治陽","hook":"금테 궤짝 + 화로를 해 자리에 = 불을 북돋움 = 腎氣丸","say":"가벼운 해 쪽 판 위에 작은 화로와 금테 궤짝이 놓였고, 도우미가 금테 궤짝을 하나 더 두 손으로 내려놓는다. 사랑방에서 본 金匱腎氣丸이다. 불의 근원을 북돋아 그늘을 걷는다 — 益火之源 以消陰翳. 陽을 補해 陰寒을 다스린다 — 陰病治陽. 陽이 虛해 陰이 상대적으로 성한 陽虛陰盛, 陽虛則寒에 쓴다. 모자란 것을 채우는 補其不足이다. 반대로 偏盛은 남는 것을 덜어 낸다 — 損其有餘, 熱者寒之 寒者熱之.","box":[69,739,438,404],"src":["BZ-CHIK-07","OHG-001","BZ-CHIK-08"],"tts":"가벼운 해 쪽 판 위에 작은 화로와 금테 궤짝이 놓였고, 도우미가 금테 궤짝을 하나 더 두 손으로 내려놓는다. 사랑방에서 본 금궤신기환이다. 불의 근원을 북돋아 그늘을 걷는다, 익화지원 이소음예. 양을 보해 음한을 다스린다, 음병치양. 양이 허해 음이 상대적으로 성한 양허음성, 양허즉한에 쓴다. 모자란 것을 채우는 보기부족이다. 반대로 편성은 남는 것을 덜어 낸다, 손기유여, 열자한지 한자열지."},{"n":6,"obj":"아랫줄 오른쪽 — 달 자리에 팔다리가 가늘고 광대뼈가 붉으며 땀 흘리고 화끈한 손바닥을 든 깡마른 아이 · 너무 가벼워 달 쪽이 높이 들림","fact":"陰虛則熱 — 虛熱: 五心煩熱·潮熱·盜汗·顴紅·消瘦·舌紅少苔·脈細數","hook":"가벼워 들린 달 자리의 깡마르고 볼 붉은 아이 = 陰이 모자람 = 虛熱","say":"아랫줄 오른쪽, 달 자리에는 깡마른 아이가 광대뼈가 붉고 땀을 흘리며 화끈한 손바닥을 들었다. 너무 가벼워 달 쪽이 높이 들렸다. 陰이 모자라 陽이 상대적으로 무거워졌다 — 陰虛則熱, 陰偏衰의 虛熱證이다. 광대뼈가 붉고 — 顴紅, 손발바닥과 가슴이 화끈하고 — 五心煩熱, 때맞춰 열이 오르는 潮熱, 盜汗, 입과 목이 마르고, 몸이 마른다 — 形體消瘦. 舌紅少苔, 脈細數. 세 모습이 있다 — 온몸에 虛熱이 도는 陰虛內熱, 국부로 불이 오르는 陰虛火旺, 陽氣가 위로 들뜨는 陰虛陽亢. 肺, 肝, 腎의 陰虛가 주다.","box":[[1093,602,856,496],[1683,588,193,409]],"src":["BGI-YY-04","BZ-BY-04"],"tts":"아랫줄 오른쪽, 달 자리에는 깡마른 아이가 광대뼈가 붉고 땀을 흘리며 화끈한 손바닥을 들었다. 너무 가벼워 달 쪽이 높이 들렸다. 음이 모자라 양이 상대적으로 무거워졌다, 음허즉열, 음편쇠의 허열증이다. 광대뼈가 붉고, 관홍, 손발바닥과 가슴이 화끈하고, 오심번열, 때맞춰 열이 오르는 조열, 도한, 입과 목이 마르고, 몸이 마른다, 형체소수. 설홍소태, 맥세삭. 세 모습이 있다, 온몸에 허열이 도는 음허내열, 국부로 불이 오르는 음허화왕, 양기가 위로 들뜨는 음허양항. 폐, 간, 신의 음허가 주다."},{"n":7,"obj":"아랫줄 오른쪽 도우미 — 가벼운 달 쪽 판에 유리 물병으로 물을 붓고 · 판 위에 검은 환약 여섯 알 접시","fact":"壯水之主 以制陽光 — 補陰(六味地黃丸) · 陽病治陰","hook":"물 + 환약 여섯을 달 자리에 = 물을 튼튼히 = 六味地黃丸","say":"도우미가 가벼운 달 쪽 판에 유리 물병으로 물을 붓는다. 판 위에는 검은 환약 여섯 알 접시가 놓였다 — 六味地黃丸이다. 물의 주인을 튼튼히 해 햇빛을 누른다 — 壯水之主 以制陽光. 陰을 補해 虛熱을 다스린다 — 陽病治陰. 陰虛則熱, 陰虛陽亢에 쓴다.","box":[1381,602,308,438],"src":["OHG-002"],"tts":"도우미가 가벼운 달 쪽 판에 유리 물병으로 물을 붓는다. 판 위에는 검은 환약 여섯 알 접시가 놓였다, 육미지황환이다. 물의 주인을 튼튼히 해 햇빛을 누른다, 장수지주 이제양광. 음을 보해 허열을 다스린다, 양병치음. 음허즉열, 음허양항에 쓴다."},{"n":8,"kind":"review","obj":"시소 넷 한 바퀴 — 불덩이 쇳덩이 · 얼음 덩어리 / 담요 아이와 궤짝 · 깡마른 아이와 물","fact":"陽勝則熱·陰勝則寒(實) / 陽虛則寒→益火之源 · 陰虛則熱→壯水之主(虛)","hook":"넘쳐서 내려앉음 = 實 · 가벼워 들림 = 虛","say":"다시 본다. 해 자리에 불덩이가 얹혀 내려앉음 — 陽勝則熱, 實熱. 달 자리에 얼음이 얹혀 내려앉음 — 陰勝則寒, 實寒. 넘치면 덜어 낸다. 해 자리가 가벼워 들림 — 陽虛則寒, 虛寒. 금테 궤짝과 화로 — 益火之源 以消陰翳, 腎氣丸. 달 자리가 가벼워 들림 — 陰虛則熱, 虛熱. 물과 환약 여섯 — 壯水之主 以制陽光, 六味地黃丸.","box":[[105,19,849,517],[1100,40,863,510],[69,646,899,497],[1093,602,856,496]],"src":[],"tts":"다시 본다. 해 자리에 불덩이가 얹혀 내려앉음, 양승즉열, 실열. 달 자리에 얼음이 얹혀 내려앉음, 음승즉한, 실한. 넘치면 덜어 낸다. 해 자리가 가벼워 들림, 양허즉한, 허한. 금테 궤짝과 화로, 익화지원 이소음예, 신기환. 달 자리가 가벼워 들림, 음허즉열, 허열. 물과 환약 여섯, 장수지주 이제양광, 육미지황환."}],"has_image":true},{"id":"hp-16","title":"眞假 — 겉과 속이 다른 넷 (虛實眞假 · 陰陽格拒)","place":"가면무도회장","image":"images/lessons/hp-16.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"샹들리에 가면무도회장 — 막대 가면을 얼굴 옆에 든 손님 넷 · 가면은 진짜 얼굴과 반대","fact":"眞假 — 겉(假象)과 속(本質)이 다른 넷: 虛實眞假 · 陰陽格拒","hook":"가면 = 假 · 가면 옆 진짜 얼굴 = 眞","say":"샹들리에 아래 가면무도회장이다. 손님 넷이 막대 가면을 얼굴 옆에 들었다. 가면은 거짓 가, 假. 그 옆의 진짜 얼굴은 참 진, 眞. 가면은 늘 진짜 얼굴과 반대다. 겉모습과 본질이 다른 병 넷 — 虛와 實이 뒤바뀐 虛實眞假 둘, 寒과 熱이 뒤바뀐 陰陽格拒 둘. 가면이 아니라 얼굴을 보고, 배를 눌러 보면 眞이 드러난다.","box":null,"src":[],"tts":"샹들리에 아래 가면무도회장이다. 손님 넷이 막대 가면을 얼굴 옆에 들었다. 가면은 거짓 가, 가. 그 옆의 진짜 얼굴은 참 진, 진. 가면은 늘 진짜 얼굴과 반대다. 겉모습과 본질이 다른 병 넷, 허와 실이 뒤바뀐 허실진가 둘, 한과 열이 뒤바뀐 음양격거 둘. 가면이 아니라 얼굴을 보고, 배를 눌러 보면 진이 드러난다."},{"n":1,"obj":"맨 왼쪽 손님 — 시들고 슬픈 늙은이 가면 · 진짜 얼굴은 사나움 · 찢어진 조끼를 뚫고 불거진 근육 · 의사가 배를 누르자 버럭 소리침","fact":"大實有羸狀 = 眞實假虛 — 배를 누르면 아파함(拒按 → 實)","hook":"늙은이 가면 뒤 근육질 · 누르면 비명 = 眞實假虛","say":"맨 왼쪽 손님은 시들고 슬픈 늙은이 가면을 들었다. 그러나 진짜 얼굴은 사납고, 찢어진 조끼를 뚫고 근육이 불거진다. 큰 實에 여윈 모습이 있다 — 大實有羸狀, 眞實假虛. 본질은 實인데 虛의 가상이 보인다. 邪氣가 맺혀 막히니 팔다리가 차고 정신이 시든 듯하지만, 脈은 滑數有力하다. 의사가 배를 누르자 버럭 소리친다 — 누르면 아파 싫어하는 拒按은 熱痛, 實이다.","box":[[29,177,551,928],[494,357,402,726]],"src":["BGI-SA-05","JD-CHOK-03-02"],"tts":"맨 왼쪽 손님은 시들고 슬픈 늙은이 가면을 들었다. 그러나 진짜 얼굴은 사납고, 찢어진 조끼를 뚫고 근육이 불거진다. 큰 실에 여윈 모습이 있다, 대실유리상, 진실가허. 본질은 실인데 허의 가상이 보인다. 사기가 맺혀 막히니 팔다리가 차고 정신이 시든 듯하지만, 맥은 활삭유력하다. 의사가 배를 누르자 버럭 소리친다, 누르면 아파 싫어하는 거안은 열통, 실이다."},{"n":2,"obj":"둘째 손님 — 사나운 가면 · 반들반들한 고무 공기 근육 옷(가슴에 공기 주입구, 가는 손목과 발목) · 진짜 얼굴은 핼쑥 · 의사가 배를 누르자 편안한 미소","fact":"至虛有盛候 = 眞虛假實 — 배를 누르면 편해함(喜按 → 虛)","hook":"바람 넣은 가짜 근육 · 누르면 편안 = 眞虛假實","say":"둘째 손님은 사나운 가면을 들고, 반들반들한 고무 근육 옷을 입었다. 가슴에 공기 주입구가 있다 — 바람으로 부풀린 가짜 근육이다. 진짜 얼굴은 핼쑥하고 손목과 발목은 가늘다. 지극한 虛에 성한 듯한 모습이 있다 — 至虛有盛候, 眞虛假實. 운화할 힘이 없어 배가 부풀어 그득하니 實처럼 보이지만, 脈은 虛弱無力하다. 의사가 배를 누르자 편안히 웃는다 — 누르면 편한 喜按은 寒痛, 虛다.","box":[[783,293,431,806],[494,357,402,726]],"src":["JD-CHOK-03-01"],"tts":"둘째 손님은 사나운 가면을 들고, 반들반들한 고무 근육 옷을 입었다. 가슴에 공기 주입구가 있다, 바람으로 부풀린 가짜 근육이다. 진짜 얼굴은 핼쑥하고 손목과 발목은 가늘다. 지극한 허에 성한 듯한 모습이 있다, 지허유성후, 진허가실. 운화할 힘이 없어 배가 부풀어 그득하니 실처럼 보이지만, 맥은 허약무력하다. 의사가 배를 누르자 편안히 웃는다, 누르면 편한 희안은 한통, 허다."},{"n":3,"obj":"둘째 손님 곁 탁자 — 인삼","fact":"塞因塞用 — 補藥으로 막힘(虛性 脹滿·便秘)을 다스림 · 反治","hook":"부푼 배에 오히려 인삼 = 塞因塞用","say":"둘째 손님 곁 탁자에 인삼이 놓였다. 배가 막혀 그득한데 오히려 補한다 — 막힌 것을 막는 약으로 다스린다, 塞因塞用. 脾가 虛해 배가 부푼 虛性 脹滿과 便秘에 補法을 쓴다. 겉의 假象과는 반대로 보이지만 본질은 따르는 것 — 反治다. 짝이 되는 通因通用은 이미 통하는 병에 통하게 하는 것 — 濕熱 설사와 食積 설사에 攻下藥을, 瘀血로 인한 崩漏에 活血化瘀를 쓴다.","box":[1035,768,208,344],"src":["BZ-CHIK-05","BZ-CHIK-04-M04"],"tts":"둘째 손님 곁 탁자에 인삼이 놓였다. 배가 막혀 그득한데 오히려 보한다, 막힌 것을 막는 약으로 다스린다, 색인색용. 비가 허해 배가 부푼 허성 창만과 변비에 보법을 쓴다. 겉의 가상과는 반대로 보이지만 본질은 따르는 것, 반치다. 짝이 되는 통인통용은 이미 통하는 병에 통하게 하는 것, 습열 설사와 식적 설사에 공하약을, 어혈로 인한 붕루에 활혈화어를 쓴다."},{"n":4,"obj":"셋째 손님 — 볼만 새빨간 가면 · 진짜 얼굴은 창백하고 푸르스름 · 두꺼운 담요를 두르고 팔짱 끼고 웅크림 · 서리 앉은 맨발에 고드름","fact":"陰盛格陽 = 眞寒假熱 · 戴陽(兩顴潮紅 + 下利淸穀)","hook":"볼 빨간 가면 뒤 얼어붙은 몸 = 眞寒假熱","say":"셋째 손님은 볼이 새빨간 가면을 들었다. 진짜 얼굴은 창백하고 푸르스름하며, 두꺼운 담요를 두르고 팔짱을 끼고 웅크렸으며, 서리 앉은 맨발에는 고드름이 맺혔다. 陰이 속에 성해 陽을 밖으로 밀어냈다 — 陰盛格陽, 眞寒假熱. 겉으로 열이 나고 번조해도 오히려 옷과 이불을 끌어당긴다 — 煩熱反欲近衣被. 갈증이 있어도 뜨거운 물을 찾고, 脈은 沈遲, 舌質淡 苔白이다. 寒이 극에 달해 도리어 熱의 모습을 띤다 — 寒極反兼熱化. 실제 熱이라면 혀가 붉고 苔가 누렇다. 虛陽이 얼굴로 뜬 戴陽證 — 위로는 두 광대뼈가 붉고, 아래로는 소화 안 된 설사와 차가운 손발이다. 陰虛의 顴紅과 다르다.","box":[1222,357,337,748],"src":["BGI-YY-06","OHG2-007","YY-20","YY-21","OHG-044"],"tts":"셋째 손님은 볼이 새빨간 가면을 들었다. 진짜 얼굴은 창백하고 푸르스름하며, 두꺼운 담요를 두르고 팔짱을 끼고 웅크렸으며, 서리 앉은 맨발에는 고드름이 맺혔다. 음이 속에 성해 양을 밖으로 밀어냈다, 음성격양, 진한가열. 겉으로 열이 나고 번조해도 오히려 옷과 이불을 끌어당긴다, 번열반욕근의피. 갈증이 있어도 뜨거운 물을 찾고, 맥은 침지, 설질담 태백이다. 한이 극에 달해 도리어 열의 모습을 띤다, 한극반겸열화. 실제 열이라면 혀가 붉고 태가 누렇다. 허양이 얼굴로 뜬 대양증, 위로는 두 광대뼈가 붉고, 아래로는 소화 안 된 설사와 차가운 손발이다. 음허의 관홍과 다르다."},{"n":5,"obj":"셋째 손님 곁 탁자 — 김 나는 뜨거운 국 그릇과 검은 뿌리 토막","fact":"熱因熱用 — 熱藥으로 假熱을: 通脈四逆湯(附子) · 回陽","hook":"볼 빨간 손님에게 뜨거운 附子 국 = 熱因熱用","say":"곁의 탁자에 김 나는 뜨거운 국과 검은 뿌리 토막이 놓였다. 약령시 화로 좌판의 附子다. 열이 나 보이는 병에 뜨거운 약을 쓴다 — 熱因熱用. 眞寒假熱, 陰盛格陽에 通脈四逆湯으로 陽을 되돌린다 — 回陽救逆.","box":[1453,538,208,575],"src":["BZ-CHIK-06","BGI-SA-06-02","BZ-CHIK-04-M02","SW-M6-10-03"],"tts":"곁의 탁자에 김 나는 뜨거운 국과 검은 뿌리 토막이 놓였다. 약령시 화로 좌판의 부자다. 열이 나 보이는 병에 뜨거운 약을 쓴다, 열인열용. 진한가열, 음성격양에 통맥사역탕으로 양을 되돌린다, 회양구역."},{"n":6,"obj":"맨 오른쪽 손님 — 서리 앉은 창백한 얼음 가면 · 서리 낀 손 · 진짜 얼굴은 벌겋게 성남 · 외투 속 셔츠에서 이는 불길 · 몸 뒤로 치솟는 불","fact":"陽盛格陰 = 眞熱假寒 — 손발은 차도 옷을 싫어함(熱厥·陽厥)","hook":"얼음 가면 뒤 불타는 몸 = 眞熱假寒","say":"맨 오른쪽 손님은 서리 앉은 창백한 얼음 가면을 들었고 손도 서리가 꼈다. 그러나 진짜 얼굴은 벌겋게 성났고, 외투 속 셔츠에서 불길이 일고 몸 뒤로 불이 치솟는다. 陽이 속에 성해 陰을 겉으로 밀어냈다 — 陽盛格陰, 眞熱假寒. 손발이 차가워도 熱이 막아서 생긴 熱厥, 陽厥이고, 몸이 차 보여도 오히려 옷을 가까이하지 않는다 — 身寒反不欲近衣. 陰陽格拒는 陰과 陽이 서로 이어지지 못하고 끊긴 것이다 — 陰盛格陽은 眞寒假熱, 陽盛格陰은 眞熱假寒.","box":[1583,257,464,842],"src":["OHG-043"],"tts":"맨 오른쪽 손님은 서리 앉은 창백한 얼음 가면을 들었고 손도 서리가 꼈다. 그러나 진짜 얼굴은 벌겋게 성났고, 외투 속 셔츠에서 불길이 일고 몸 뒤로 불이 치솟는다. 양이 속에 성해 음을 겉으로 밀어냈다, 양성격음, 진열가한. 손발이 차가워도 열이 막아서 생긴 열궐, 양궐이고, 몸이 차 보여도 오히려 옷을 가까이하지 않는다, 신한반불욕근의. 음양격거는 음과 양이 서로 이어지지 못하고 끊긴 것이다, 음성격양은 진한가열, 양성격음은 진열가한."},{"n":7,"obj":"맨 오른쪽 손님 곁 탁자 — 얼음 그릇에 걸친 굵은 붉은 대황 줄기(끝은 초록 잎)","fact":"寒因寒用 — 寒藥으로 假寒을: 承氣湯(大黃) 下法","hook":"얼음 가면 손님에게 차가운 대황 = 寒因寒用","say":"곁의 탁자에는 얼음 그릇에 굵은 붉은 대황 줄기가 걸쳤다. 약령시 뚫어뻥 좌판의 大黃이다. 차가워 보이는 병에 찬 약을 쓴다 — 寒因寒用. 大黃이 든 承氣湯으로 속의 熱을 쳐 내린다 — 下法. 맨 왼쪽 眞實假虛 손님도 겉의 여윈 모습이 아니라 속의 實을 보고 이 承氣湯으로 친다.","box":[1849,682,197,431],"src":["BGI-SA-06-01","BZ-CHIK-04-M03"],"tts":"곁의 탁자에는 얼음 그릇에 굵은 붉은 대황 줄기가 걸쳤다. 약령시 뚫어뻥 좌판의 대황이다. 차가워 보이는 병에 찬 약을 쓴다, 한인한용. 대황이 든 승기탕으로 속의 열을 쳐 내린다, 하법. 맨 왼쪽 진실가허 손님도 겉의 여윈 모습이 아니라 속의 실을 보고 이 승기탕으로 친다."},{"n":8,"kind":"review","obj":"무도회장 한 바퀴 — 늙은이 가면의 근육질 · 공기 근육 옷과 인삼 · 볼 빨간 가면의 얼어붙은 몸과 뜨거운 국 · 얼음 가면의 불타는 몸과 대황","fact":"眞實假虛 拒按 · 眞虛假實 喜按→塞因塞用 / 眞寒假熱→熱因熱用 · 眞熱假寒→寒因寒用","hook":"가면은 假, 얼굴과 배가 眞","say":"다시 본다. 늙은이 가면 뒤 근육질, 누르면 비명 — 大實有羸狀, 眞實假虛, 承氣湯으로 친다. 공기 근육 옷, 누르면 편안 — 至虛有盛候, 眞虛假實, 인삼으로 補한다, 塞因塞用. 볼 빨간 가면 뒤 얼어붙은 몸 — 陰盛格陽, 眞寒假熱, 뜨거운 附子 국, 熱因熱用. 얼음 가면 뒤 불타는 몸 — 陽盛格陰, 眞熱假寒, 차가운 대황, 寒因寒用.","box":[[29,177,551,928],[783,293,431,806],[1222,357,337,748],[1583,257,464,842]],"src":[],"tts":"다시 본다. 늙은이 가면 뒤 근육질, 누르면 비명, 대실유리상, 진실가허, 승기탕으로 친다. 공기 근육 옷, 누르면 편안, 지허유성후, 진허가실, 인삼으로 보한다, 색인색용. 볼 빨간 가면 뒤 얼어붙은 몸, 음성격양, 진한가열, 뜨거운 부자 국, 열인열용. 얼음 가면 뒤 불타는 몸, 양성격음, 진열가한, 차가운 대황, 한인한용."}],"has_image":true},{"id":"hp-17","title":"陰陽失調 ③ 亡陽·亡陰 — 땀으로 갈린다","place":"비상 계단의 두 층계참","image":"images/lessons/hp-17.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"비상 계단 단면 — 나란한 두 층계참 · 초록 비상구 표지 아래 열린 문","fact":"亡陽·亡陰 — 陽이나 陰이 땀에 실려 한꺼번에 빠져나가는 위급증","hook":"비상구로 달아남 = 亡","say":"건물의 비상 계단을 잘라 본다. 나란한 두 층계참, 초록 비상구 표지 아래 문이 열렸다. 달아날 망, 亡. 陽이나 陰이 땀에 실려 한꺼번에 빠져나가는 위급한 병이다. 땀의 성질로 둘을 가른다.","box":null,"src":[],"tts":"건물의 비상 계단을 잘라 본다. 나란한 두 층계참, 초록 비상구 표지 아래 문이 열렸다. 달아날 망, 망. 양이나 음이 땀에 실려 한꺼번에 빠져나가는 위급한 병이다. 땀의 성질로 둘을 가른다."},{"n":1,"obj":"왼쪽 층계참 — 잿빛 창백한 얼굴 · 멍한 눈 · 묽고 찬 땀을 줄줄 흘려 얼음 웅덩이 · 서리 앉은 손발 / 비상구로 달아나는 해 요정","fact":"亡陽 — 大汗淋漓·汗稀而涼(冷汗)·手足厥冷·精神淡漠·脈微欲絶","hook":"달아나는 해 요정 + 묽고 찬 땀 = 亡陽","say":"왼쪽 층계참의 남자는 얼굴이 잿빛으로 창백하고 눈이 멍하다. 묽고 찬 땀을 줄줄 흘려 바닥에 얼음 웅덩이가 졌고, 손발에 서리가 앉았다. 해 요정, 陽이 비상구로 달아난다 — 亡陽. 땀이 줄줄 쏟아지고 — 大汗淋漓, 묽고 차다 — 汗稀而涼. 손발이 싸늘하고 — 手足厥冷, 정신이 멍하다 — 精神淡漠. 맥은 있는 듯 없는 듯 끊어지려 한다 — 微脈, 脈微欲絶. 숨이 넘어갈 때 쏟는 땀, 絶汗 또는 脫汗은 찬 땀이 줄줄 흐르고 기름처럼 끈적하기도 하다 — 陽이 망하고 陰이 마르는 것이다.","box":[[144,415,579,698],[494,386,179,179]],"src":["BGI-YY-07","JD-MOON-03-03","JD-MAEK-13-03"],"tts":"왼쪽 층계참의 남자는 얼굴이 잿빛으로 창백하고 눈이 멍하다. 묽고 찬 땀을 줄줄 흘려 바닥에 얼음 웅덩이가 졌고, 손발에 서리가 앉았다. 해 요정, 양이 비상구로 달아난다, 망양. 땀이 줄줄 쏟아지고, 대한림리, 묽고 차다, 한희이량. 손발이 싸늘하고, 수족궐랭, 정신이 멍하다, 정신담막. 맥은 있는 듯 없는 듯 끊어지려 한다, 미맥, 맥미욕절. 숨이 넘어갈 때 쏟는 땀, 절한 또는 탈한은 찬 땀이 줄줄 흐르고 기름처럼 끈적하기도 하다, 양이 망하고 음이 마르는 것이다."},{"n":2,"obj":"구조대원 — 한 손으로 해 요정의 손을 붙잡고, 다른 손으로 인삼과 검은 덩이뿌리가 든 김 나는 그릇을 내밂","fact":"回陽救逆 — 眞寒 위급: 四逆湯 · 參附湯(人參+附子)","hook":"해 요정을 붙잡고 인삼·附子 그릇 = 回陽救逆","say":"주황 조끼 구조대원이 한 손으로 해 요정의 손을 붙잡고, 다른 손으로 김 나는 그릇을 내민다. 그릇에는 인삼과 검은 덩이뿌리, 附子가 들었다. 달아나는 陽을 되돌려 위급함을 구한다 — 回陽救逆. 眞寒이 위급할 때의 溫法이고 처방은 四逆湯이다. 인삼과 附子를 함께 달인 參附湯도 쓴다.","box":[[574,343,424,539],[574,602,172,157]],"src":["SW-SHR-04-03"],"tts":"주황 조끼 구조대원이 한 손으로 해 요정의 손을 붙잡고, 다른 손으로 김 나는 그릇을 내민다. 그릇에는 인삼과 검은 덩이뿌리, 부자가 들었다. 달아나는 양을 되돌려 위급함을 구한다, 회양구역. 진한이 위급할 때의 온법이고 처방은 사역탕이다. 인삼과 부자를 함께 달인 삼부탕도 쓴다."},{"n":3,"obj":"오른쪽 층계참 — 벌건 얼굴로 입 벌려 헐떡임 · 시럽처럼 끈적한 뜨거운 땀이 늘어져 흐름 · 새빨간 혀 · 따뜻한 분홍 손 / 비상구로 달아나는 물방울 요정","fact":"亡陰 — 汗出不止·汗熱而黏·手足溫·喘渴煩躁·脈數無力·舌光紅無苔","hook":"달아나는 물방울 요정 + 끈적하고 뜨거운 땀 = 亡陰","say":"오른쪽 층계참의 남자는 얼굴이 벌겋고 입을 벌려 헐떡이며 목말라한다. 시럽처럼 끈적하고 뜨거운 땀이 줄줄이 늘어져 흐른다. 물방울 요정, 陰이 비상구로 달아난다 — 亡陰. 땀이 멎지 않고 — 汗出不止, 뜨겁고 끈적하다 — 汗熱而黏. 손발은 따뜻하고 — 手足溫, 숨이 차고 목마르고 번조하다 — 喘渴煩躁. 맥은 빠르되 힘이 없고 — 脈數無力, 혀는 반들반들 붉고 이끼가 없다 — 舌光紅無苔. 亡陽은 찬 땀에 찬 손발, 亡陰은 뜨거운 땀에 따뜻한 손발이다.","box":[[1453,437,453,561],[1438,415,172,157],[1683,595,92,99]],"src":[],"tts":"오른쪽 층계참의 남자는 얼굴이 벌겋고 입을 벌려 헐떡이며 목말라한다. 시럽처럼 끈적하고 뜨거운 땀이 줄줄이 늘어져 흐른다. 물방울 요정, 음이 비상구로 달아난다, 망음. 땀이 멎지 않고, 한출부지, 뜨겁고 끈적하다, 한열이점. 손발은 따뜻하고, 수족온, 숨이 차고 목마르고 번조하다, 천갈번조. 맥은 빠르되 힘이 없고, 맥삭무력, 혀는 반들반들 붉고 이끼가 없다, 설광홍무태. 망양은 찬 땀에 찬 손발, 망음은 뜨거운 땀에 따뜻한 손발이다."},{"n":4,"obj":"구조대원이 붙잡은 물방울 요정 · 환자 손의 작은 컵(겉에 인삼 조각 · 붉은 열매 그림, 안에 갈색 탕약)","fact":"益氣救陰 — 生脈散(人參·麥門冬·五味子) · 효능으로 지은 이름","hook":"물방울 요정을 붙잡고 인삼·붉은 열매 그림 컵 = 生脈散","say":"다른 구조대원이 물방울 요정의 손을 붙잡았다. 남자 손의 작은 컵에는 갈색 탕약이 담겼고, 겉에 인삼 조각과 붉은 열매가 그려졌다. 인삼, 붉은 열매 五味子, 그리고 麥門冬 — 生脈散. 氣를 더해 陰을 구한다 — 益氣救陰. 맥을 살린다는 효능으로 지은 이름이다. 補中益氣湯, 平胃散, 逍遙散도 효능으로 짓고, 白虎湯은 비유로 지었다.","box":[[1093,343,381,539],[1438,415,172,157],[1510,631,92,99]],"src":["BJ-MM-02-01"],"tts":"다른 구조대원이 물방울 요정의 손을 붙잡았다. 남자 손의 작은 컵에는 갈색 탕약이 담겼고, 겉에 인삼 조각과 붉은 열매가 그려졌다. 인삼, 붉은 열매 오미자, 그리고 맥문동, 생맥산. 기를 더해 음을 구한다, 익기구음. 맥을 살린다는 효능으로 지은 이름이다. 보중익기탕, 평위산, 소요산도 효능으로 짓고, 백호탕은 비유로 지었다."},{"n":5,"kind":"review","obj":"비상 계단 한 바퀴 — 찬 땀과 해 요정 · 인삼·附子 그릇 / 끈적한 땀과 물방울 요정 · 生脈散 컵","fact":"亡陽 冷汗·厥冷 → 回陽救逆 · 亡陰 熱黏汗·手足溫 → 益氣救陰","hook":"찬 땀 · 해 요정 / 뜨겁고 끈적한 땀 · 물방울 요정","say":"다시 본다. 묽고 찬 땀, 서리 앉은 손발, 달아나는 해 요정 — 亡陽, 脈微欲絶. 인삼과 附子 그릇 — 回陽救逆. 뜨겁고 끈적한 땀, 따뜻한 손발, 반들반들 붉은 혀, 달아나는 물방울 요정 — 亡陰. 인삼, 五味子, 麥門冬 컵 — 生脈散, 益氣救陰.","box":[[144,415,579,698],[574,343,424,539],[1453,437,453,561],[1093,343,381,539]],"src":[],"tts":"다시 본다. 묽고 찬 땀, 서리 앉은 손발, 달아나는 해 요정, 망양, 맥미욕절. 인삼과 부자 그릇, 회양구역. 뜨겁고 끈적한 땀, 따뜻한 손발, 반들반들 붉은 혀, 달아나는 물방울 요정, 망음. 인삼, 오미자, 맥문동 컵, 생맥산, 익기구음."}],"has_image":true},{"id":"hp-18","title":"氣血失常 — 氣 넷(虛·滯·逆·陷) · 血 셋(虛·瘀·熱)","place":"지하 보일러실","image":"images/lessons/hp-18.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"지하 보일러실 — 왼쪽 큰 보일러 · 윗줄 잿빛 증기관 넷 · 아랫줄 붉은 온수관 셋","fact":"氣血失常 — 氣 넷(虛·滯·逆·陷) · 血 셋(虛·瘀·熱)","hook":"증기관 = 氣 · 온수관 = 血 · 고장 일곱","say":"지하 보일러실이다. 왼쪽 큰 보일러에서 관이 두 줄로 뻗는다. 윗줄 잿빛 증기관은 氣, 아랫줄 붉은 온수관은 血이다. 관마다 고장이 났다 — 氣의 고장 넷, 血의 고장 셋. 氣血失常이다.","box":null,"src":[],"tts":"지하 보일러실이다. 왼쪽 큰 보일러에서 관이 두 줄로 뻗는다. 윗줄 잿빛 증기관은 기, 아랫줄 붉은 온수관은 혈이다. 관마다 고장이 났다, 기의 고장 넷, 혈의 고장 셋. 기혈실상이다."},{"n":1,"obj":"윗줄 첫째 증기관 — 끝에서 가늘고 힘없는 김이 겨우 피어오름 · 바늘이 낮은 압력계","fact":"氣虛 — 生化不足·消耗過多 → 기능 감퇴(少氣懶言·神疲乏力)","hook":"힘없는 김 · 낮은 압력계 = 氣虛","say":"윗줄 첫째 증기관은 끝에서 가늘고 힘없는 김이 겨우 피어오른다. 압력계 바늘도 낮다. 氣가 모자라다 — 氣虛. 만들어지는 것이 모자라거나 너무 많이 써서 닳아, 몸의 기능이 떨어진다. 숨이 짧고 말하기 싫으며 — 少氣懶言, 정신이 피로하고 힘이 없다.","box":[494,134,287,417],"src":["BGI-GI-01-01"],"tts":"윗줄 첫째 증기관은 끝에서 가늘고 힘없는 김이 겨우 피어오른다. 압력계 바늘도 낮다. 기가 모자라다, 기허. 만들어지는 것이 모자라거나 너무 많이 써서 닳아, 몸의 기능이 떨어진다. 숨이 짧고 말하기 싫으며, 소기나언, 정신이 피로하고 힘이 없다."},{"n":2,"obj":"둘째 증기관 — 가운데 꽁꽁 매듭진 관 · 그 앞이 풍선처럼 부풀어 쉭쉭거림","fact":"氣滯 — 氣機鬱滯: 국부 脹滿·脹痛 / 氣機失調 다섯(滯·逆·陷·閉·脫)","hook":"매듭 앞에 부푼 관 = 氣滯 · 脹痛","say":"둘째 증기관은 가운데가 꽁꽁 매듭졌고, 그 앞이 풍선처럼 부풀어 쉭쉭거린다. 氣가 막혔다 — 氣滯, 氣機鬱滯. 七情이 속에 맺히거나, 寒冷, 痰濕, 食積, 瘀血이 막아서 생긴다. 막힌 자리가 부풀어 그득하고 아프다 — 부풀 듯한 脹痛은 氣滯, 특히 肝이다. 氣가 막히면 血瘀와 水濕痰飮을 부른다 — 肺氣壅滯, 肝鬱氣滯, 脾胃氣滯. 氣의 움직임이 어긋나는 氣機失調는 다섯 — 氣滯, 氣逆, 氣陷, 氣閉, 氣脫.","box":[790,257,409,301],"src":["BGI-GI-02","BGI-GI-01-02","JD-MOON-04-01"],"tts":"둘째 증기관은 가운데가 꽁꽁 매듭졌고, 그 앞이 풍선처럼 부풀어 쉭쉭거린다. 기가 막혔다, 기체, 기기울체. 칠정이 속에 맺히거나, 한랭, 담습, 식적, 어혈이 막아서 생긴다. 막힌 자리가 부풀어 그득하고 아프다, 부풀 듯한 창통은 기체, 특히 간이다. 기가 막히면 혈어와 수습담음을 부른다, 폐기옹체, 간울기체, 비위기체. 기의 움직임이 어긋나는 기기실조는 다섯, 기체, 기역, 기함, 기폐, 기탈."},{"n":3,"obj":"셋째 증기관 — 부서진 밸브에서 김이 관을 벗어나 천장까지 위로 뿜어 오름","fact":"氣逆 — 肺(咳逆氣喘) · 胃(惡心·嘔吐·呃逆·噯氣) · 肝(頭痛·昏厥)","hook":"관을 벗어나 위로 치솟는 김 = 氣逆","say":"셋째 증기관은 부서진 밸브에서 김이 관을 벗어나 천장까지 위로 뿜어 오른다. 내려가야 할 氣가 거슬러 오른다 — 氣逆. 肺氣가 거스르면 기침하고 숨이 차다 — 咳逆氣喘. 胃氣가 거스르면 메스껍고 토하고 딸꾹질하고 트림한다 — 胃氣上逆, 胃氣不和. 肝氣가 거스르면 머리가 아프고 눈이 부풀고 가슴과 옆구리가 그득하며, 피를 토하고, 심하면 쓰러진다 — 昏厥.","box":[1265,12,308,467],"src":["BGI-GI-03-02","JD-MUN-03-04","BGI-GI-03-01","BGI-GI-03-03"],"tts":"셋째 증기관은 부서진 밸브에서 김이 관을 벗어나 천장까지 위로 뿜어 오른다. 내려가야 할 기가 거슬러 오른다, 기역. 폐기가 거스르면 기침하고 숨이 차다, 해역기천. 위기가 거스르면 메스껍고 토하고 딸꾹질하고 트림한다, 위기상역, 위기불화. 간기가 거스르면 머리가 아프고 눈이 부풀고 가슴과 옆구리가 그득하며, 피를 토하고, 심하면 쓰러진다, 혼궐."},{"n":4,"obj":"넷째 증기관 — 받침이 부러져 깊은 U자로 축 처짐","fact":"氣陷 — 氣虛에서: 中氣下陷 → 臟器下垂(胃下垂·子宮脫垂·脫肛)","hook":"축 처진 관 = 氣陷 · 장기가 처짐","say":"넷째 증기관은 받침이 부러져 깊은 U자로 축 처졌다. 氣가 아래로 꺼졌다 — 氣陷. 氣虛에서 온다. 脾氣가 약해 맑은 陽이 올라가지 못하고 가운데 氣가 꺼진다 — 中氣下陷. 장기가 처진다 — 위하수, 자궁 탈수, 탈항. 허리와 배가 그득하고 아래로 처지는 듯 무겁고, 숨이 짧고 힘이 없으며, 脈은 細無力하다.","box":[1438,343,582,323],"src":["BGI-GI-04"],"tts":"넷째 증기관은 받침이 부러져 깊은 U자로 축 처졌다. 기가 아래로 꺼졌다, 기함. 기허에서 온다. 비기가 약해 맑은 양이 올라가지 못하고 가운데 기가 꺼진다, 중기하함. 장기가 처진다, 위하수, 자궁 탈수, 탈항. 허리와 배가 그득하고 아래로 처지는 듯 무겁고, 숨이 짧고 힘이 없으며, 맥은 세무력하다."},{"n":5,"obj":"아랫줄 첫째 온수관 — 유리 구간이 거의 비고 바닥에 옅은 분홍 물만 가늘게 흐름","fact":"血虛 — 失血·脾胃虛弱·久病: 面色蒼白·脣舌爪甲色淡·頭暈·心悸·麻木","hook":"거의 빈 관 · 옅은 분홍 물 = 血虛","say":"아랫줄 첫째 온수관은 유리 구간이 거의 비었다. 바닥에 옅은 분홍 물만 가늘게 흐른다. 피가 모자라다 — 血虛. 피를 많이 잃었거나, 脾胃가 약해 피를 만들지 못하거나, 오래 앓아서다. 얼굴이 창백하고 — 面色蒼白, 입술과 혀와 손발톱이 옅고, 어지럽고 눈앞이 아찔하고, 가슴이 두근거리고, 눈이 침침하며, 팔다리가 저리고 굽히고 펴기가 어렵다.","box":[574,703,352,164],"src":["BGI-HYUL-01-01","BGI-HYUL-01-02"],"tts":"아랫줄 첫째 온수관은 유리 구간이 거의 비었다. 바닥에 옅은 분홍 물만 가늘게 흐른다. 피가 모자라다, 혈허. 피를 많이 잃었거나, 비위가 약해 피를 만들지 못하거나, 오래 앓아서다. 얼굴이 창백하고, 면색창백, 입술과 혀와 손발톱이 옅고, 어지럽고 눈앞이 아찔하고, 가슴이 두근거리고, 눈이 침침하며, 팔다리가 저리고 굽히고 펴기가 어렵다."},{"n":6,"obj":"둘째 온수관 — 유리 구간이 검보라 덩어리로 막혀 물이 고임 · 한 자리에 튀어나온 뾰족한 가시","fact":"血瘀 — 氣虛·氣滯·血寒·血熱·痰濁·離經之血 → 刺痛, 痛有定處","hook":"검보라 덩어리 · 한 자리의 가시 = 血瘀 · 刺痛","say":"둘째 온수관은 검보라 덩어리로 막혀 물이 고였고, 한 자리에 뾰족한 가시가 튀어나왔다. 피가 엉겨 막혔다 — 血瘀. 氣가 약하거나 막혀 피를 밀지 못하고, 찬 기운에 엉기고, 열에 졸아붙고, 痰濁이 막고, 경맥을 벗어난 피가 고여 생긴다. 찌르는 듯 아프고 아픈 자리가 정해져 있다 — 刺痛, 痛有定處. 따뜻하게 해도 덜하지 않고, 심하면 덩어리 癥이 된다. 하수 처리장의 瘀血이 병인이라면, 여기 血瘀는 병의 기전이다.","box":[1006,689,366,222],"src":["BGI-HYUL-02","JD-MOON-04-02"],"tts":"둘째 온수관은 검보라 덩어리로 막혀 물이 고였고, 한 자리에 뾰족한 가시가 튀어나왔다. 피가 엉겨 막혔다, 혈어. 기가 약하거나 막혀 피를 밀지 못하고, 찬 기운에 엉기고, 열에 졸아붙고, 담탁이 막고, 경맥을 벗어난 피가 고여 생긴다. 찌르는 듯 아프고 아픈 자리가 정해져 있다, 자통, 통유정처. 따뜻하게 해도 덜하지 않고, 심하면 덩어리 징이 된다. 하수 처리장의 어혈이 병인이라면, 여기 혈어는 병의 기전이다."},{"n":7,"obj":"셋째 온수관 — 벌겋게 달아 속의 물이 끓고 갈라진 틈으로 뜨거운 붉은 물이 뿜어 나옴","fact":"血熱 — 血行加速 → 迫血妄行: 身熱夜甚·衄血·吐血·尿血·舌紅絳","hook":"벌겋게 단 관에서 뿜는 물 = 血熱 · 迫血妄行","say":"셋째 온수관은 벌겋게 달아 속의 물이 끓고, 갈라진 틈으로 뜨거운 붉은 물이 뿜어 나온다. 피에 열이 있다 — 血熱. 피가 빨리 돌고, 심하면 피를 내몰아 제 길을 벗어나게 한다 — 迫血妄行. 열이 있고, 피와 陰을 닳게 하고, 피를 움직여 출혈시킨다. 밤에 열이 더하고 — 身熱夜甚, 가슴이 답답해 안절부절하며, 코피, 토혈, 혈뇨, 월경이 앞당겨진다. 혀는 붉다 못해 진홍빛이고 — 舌質紅絳, 脈은 細數하다.","box":[1467,646,323,308],"src":["BGI-HYUL-03"],"tts":"셋째 온수관은 벌겋게 달아 속의 물이 끓고, 갈라진 틈으로 뜨거운 붉은 물이 뿜어 나온다. 피에 열이 있다, 혈열. 피가 빨리 돌고, 심하면 피를 내몰아 제 길을 벗어나게 한다, 박혈망행. 열이 있고, 피와 음을 닳게 하고, 피를 움직여 출혈시킨다. 밤에 열이 더하고, 신열야심, 가슴이 답답해 안절부절하며, 코피, 토혈, 혈뇨, 월경이 앞당겨진다. 혀는 붉다 못해 진홍빛이고, 설질홍강, 맥은 세삭하다."},{"n":8,"kind":"review","obj":"보일러실 한 바퀴 — 힘없는 김 · 매듭과 부풂 · 거꾸로 뿜는 김 · 처진 관 / 빈 관 · 막힌 관 · 끓어 뿜는 관","fact":"氣虛·氣滯·氣逆·氣陷 / 血虛·血瘀·血熱","hook":"약함 · 막힘 · 거꾸로 · 처짐 / 빔 · 고임 · 끓음","say":"다시 본다. 증기관 넷 — 힘없는 김은 氣虛, 매듭 앞 부풂은 氣滯와 脹痛, 거꾸로 치솟는 김은 氣逆, 축 처진 관은 氣陷과 臟器下垂. 온수관 셋 — 거의 빈 관은 血虛, 덩어리와 가시는 血瘀와 刺痛, 끓어 뿜는 관은 血熱과 迫血妄行.","box":[[494,134,287,417],[790,257,409,301],[1265,12,308,467],[1438,343,582,323],[574,703,352,164],[1006,689,366,222],[1467,646,323,308]],"src":[],"tts":"다시 본다. 증기관 넷, 힘없는 김은 기허, 매듭 앞 부풂은 기체와 창통, 거꾸로 치솟는 김은 기역, 축 처진 관은 기함과 장기하수. 온수관 셋, 거의 빈 관은 혈허, 덩어리와 가시는 혈어와 자통, 끓어 뿜는 관은 혈열과 박혈망행."}],"has_image":true},{"id":"hp-19","title":"內生五邪 — 안에서 생긴 風寒濕燥火","place":"잠긴 아파트의 방 다섯","image":"images/lessons/hp-19.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"잠긴 현관과 방 다섯 — 아파트 단면","fact":"內生五邪 — 안에서 생긴 風·火·濕·燥·寒(六淫과 이름만 같음)","hook":"잠긴 현관 = 밖에서 들어온 게 아님 · 방 다섯 = 안에서 난 사고","say":"아파트를 잘라 본다. 왼쪽 끝 현관은 꽉 잠겼고, 그 안으로 방 다섯이 늘어섰다. 방마다 사고가 났는데, 밖에서 들어온 것이 아니라 집 안에서 났다. 몸 안에서 생긴 다섯 사기, 內生五邪다. 바깥 六淫과 이름만 같다.","box":null,"src":[],"tts":"아파트를 잘라 본다. 왼쪽 끝 현관은 꽉 잠겼고, 그 안으로 방 다섯이 늘어섰다. 방마다 사고가 났는데, 밖에서 들어온 것이 아니라 집 안에서 났다. 몸 안에서 생긴 다섯 사기, 내생오사다. 바깥 육음과 이름만 같다."},{"n":1,"obj":"왼쪽 끝 — 쇠사슬과 자물쇠로 꽉 잠긴 현관문","fact":"內生五邪 — 外感 아님: 氣血津液·臟腑 失調 → 內風·內寒·內濕·內燥·內火","hook":"쇠사슬로 잠긴 문 = 外感이 아님","say":"현관문은 쇠사슬과 자물쇠로 꽉 잠겼다. 밖에서 들어온 사기, 外感이 아니다. 氣血津液과 臟腑의 기능이 어긋나 몸 안에서 생겨, 六淫과 비슷한 병리 상태를 만든다 — 內風, 內寒, 內濕, 內燥, 內火. 六淫 세 과의 언덕, 늪, 찜질방이 밖이라면 이 잠긴 집은 안이다.","box":[36,386,248,604],"src":["BGI-NAE-01"],"tts":"현관문은 쇠사슬과 자물쇠로 꽉 잠겼다. 밖에서 들어온 사기, 외감이 아니다. 기혈진액과 장부의 기능이 어긋나 몸 안에서 생겨, 육음과 비슷한 병리 상태를 만든다, 내풍, 내한, 내습, 내조, 내화. 육음 세 과의 언덕, 늪, 찜질방이 밖이라면 이 잠긴 집은 안이다."},{"n":2,"obj":"첫째 방 — 창이 닫혔는데 커튼이 펄럭이고 천장 등이 흔들림 · 손을 떨고 얼굴이 처진 남자","fact":"內風 = 肝風內動 — 熱極生風·肝陽化風·陰虛風動·血虛生風","hook":"닫힌 방 안의 바람 · 떨리는 손 = 肝風內動","say":"첫째 방은 창이 닫혔는데도 커튼이 펄럭이고 천장 등이 흔들린다 — 안에서 일어난 바람이다. 남자는 손을 떨고, 얼굴이 처졌다. 입과 눈이 돌아가는 口眼喎斜가 온다. 風氣內動, 肝風內動이다. 몸이 흔들리고 떨리고 경련한다. 모두 肝이 風을 주관하기 때문이고, 네 갈래가 있다. 熱極生風 — 열병이 극에 달해 진액이 졸아 힘줄을 기르지 못하니, 경련하고 뒤로 활처럼 휘며 고열에 정신이 흐리다. 肝陽化風 — 陰이 虛해 肝陽이 치솟아 제어되지 않으니, 근육이 떨리고 어지럽고 입과 눈이 돌아가고 半身不遂가 온다. 陰虛風動 — 陰液이 모자라 虛한 바람이 인다. 血虛生風 — 피가 모자라 힘줄을 기르지 못한다. 血燥生風을 더하기도 한다.","box":[281,221,342,770],"src":["BGI-NAE-02-01","BGI-NAE-02-02","BGI-NAE-02-03","BGI-NAE-02-04","BGI-NAE-03","JSG-043"],"tts":"첫째 방은 창이 닫혔는데도 커튼이 펄럭이고 천장 등이 흔들린다, 안에서 일어난 바람이다. 남자는 손을 떨고, 얼굴이 처졌다. 입과 눈이 돌아가는 구안와사가 온다. 풍기내동, 간풍내동이다. 몸이 흔들리고 떨리고 경련한다. 모두 간이 풍을 주관하기 때문이고, 네 갈래가 있다. 열극생풍, 열병이 극에 달해 진액이 졸아 힘줄을 기르지 못하니, 경련하고 뒤로 활처럼 휘며 고열에 정신이 흐리다. 간양화풍, 음이 허해 간양이 치솟아 제어되지 않으니, 근육이 떨리고 어지럽고 입과 눈이 돌아가고 반신불수가 온다. 음허풍동, 음액이 모자라 허한 바람이 인다. 혈허생풍, 피가 모자라 힘줄을 기르지 못한다. 혈조생풍을 더하기도 한다."},{"n":3,"obj":"둘째 방 — 달 뜬 밤 · 눈을 뜬 채 잠 못 들고 땀 흘리며 뒤척이는 남자 · 머리맡에 크게 타오르는 촛불","fact":"內火 = 火熱內生 — 心煩·不寐 · 少火↔壯火 · 實火↔虛火","hook":"크게 타오르는 촛불 · 뜬눈의 밤 = 火熱內生","say":"둘째 방은 달 뜬 밤이다. 남자는 눈을 뜬 채 잠들지 못하고 땀 흘리며 뒤척인다 — 不寐, 心煩. 머리맡 촛불이 크게 타오른다. 몸 안에서 생긴 火 — 火熱內生이다. 몸을 덥히고 움직이는 정상의 陽氣는 작은 불, 少火다. 지나치게 치솟아 氣血津精을 태우는 것이 큰 불, 壯火 — 壯火食氣. 實火는 陽氣가 남거나 邪가 뭉쳐 火가 된 것으로 급하고 열이 높다. 虛火는 陰虛陽亢으로 虛한 불이 위로 타는 것으로 느리고 뼛속이 달아오르는 骨蒸潮熱이 온다. 火熱이 안에서 생기는 길은 넷 — 陽盛有餘, 陰虛陽亢, 氣滯血瘀가 뭉쳐 化火, 五志過極化火. 實은 邪氣가 성하고 正氣가 아직 쇠하지 않은 것이다.","box":[[627,221,339,770],[667,538,92,186]],"src":["BGI-NAE-07-01","BGI-NAE-07-02","BIG-012"],"tts":"둘째 방은 달 뜬 밤이다. 남자는 눈을 뜬 채 잠들지 못하고 땀 흘리며 뒤척인다, 불매, 심번. 머리맡 촛불이 크게 타오른다. 몸 안에서 생긴 화, 화열내생이다. 몸을 덥히고 움직이는 정상의 양기는 작은 불, 소화다. 지나치게 치솟아 기혈진정을 태우는 것이 큰 불, 장화, 장화식기. 실화는 양기가 남거나 사가 뭉쳐 화가 된 것으로 급하고 열이 높다. 허화는 음허양항으로 허한 불이 위로 타는 것으로 느리고 뼛속이 달아오르는 골증조열이 온다. 화열이 안에서 생기는 길은 넷, 양성유여, 음허양항, 기체혈어가 뭉쳐 화화, 오지과극화화. 실은 사기가 성하고 정기가 아직 쇠하지 않은 것이다."},{"n":4,"obj":"셋째 방 — 바닥 배수구가 머리카락과 찌꺼기로 막혀 흙탕물이 차고 축축한 벽에 곰팡이와 버섯 · 발이 퉁퉁 부어 굼뜬 남자","fact":"內濕 = 濕濁內生 — 脾 運化 失調(脾虛生濕) · 諸濕腫滿皆屬於脾","hook":"막힌 배수구 · 곰팡이 · 부은 발 = 內濕","say":"셋째 방은 욕실이다. 바닥 배수구가 머리카락과 찌꺼기로 막혀 흙탕물이 찼고, 축축한 벽에 곰팡이와 버섯이 자란다. 남자는 발이 퉁퉁 부어 굼뜨게 앉았다. 脾가 물을 나르고 퍼뜨리지 못해 水濕과 痰濁이 생겼다 — 濕濁內生. 脾가 虛하면 濕이 생기고, 脾는 痰을 만드는 근원이다. 『素問』 至眞要大論 — 諸濕腫滿皆屬於脾. 脾陽과 腎陽이 허하면 더하고, 대변이 묽다.","box":[970,221,342,770],"src":["BGI-NAE-05"],"tts":"셋째 방은 욕실이다. 바닥 배수구가 머리카락과 찌꺼기로 막혀 흙탕물이 찼고, 축축한 벽에 곰팡이와 버섯이 자란다. 남자는 발이 퉁퉁 부어 굼뜨게 앉았다. 비가 물을 나르고 퍼뜨리지 못해 수습과 담탁이 생겼다, 습탁내생. 비가 허하면 습이 생기고, 비는 담을 만드는 근원이다. 소문 지진요대론, 제습종만개속어비. 비양과 신양이 허하면 더하고, 대변이 묽다."},{"n":5,"obj":"넷째 방 — 금 간 벽 · 말라 죽은 화분 · 물이 보이지 않는 정수기 물통 · 살갗이 마른 채 입을 가리고 마른기침하는 남자","fact":"內燥 = 津傷化燥 — 肺(燥金之臟)·胃大腸(燥金之腑)·腎(陰液의 근본)","hook":"물 없는 물통 · 마른 화분 · 마른기침 = 津傷化燥","say":"넷째 방은 벽이 금 가고 화분이 말라 죽었다. 정수기 물통에도 물이 보이지 않는다. 남자는 살갗이 마른 채 입을 가리고 마른기침을 한다. 진액이 상해 메말랐다 — 津傷化燥, 內燥. 진액이 모자라면 몸이 마르고 윤기를 잃는다. 진액 대사가 어긋나는 길은 둘 — 만들어지는 것이 모자라거나 너무 써서 생기는 津液不足, 그리고 퍼뜨리고 내보내지 못해 고이는 水濕痰飮이다. 津이 상한 傷津은 더위, 땀, 고열로 입과 코와 피부가 마르는 것, 液이 마른 脫液은 열병 끝이나 오랜 병으로 혀가 반들반들 붉고 이끼가 없으며 몸이 여위는 것 — 液은 닳으면 채우기 어렵다. 燥는 肺, 胃, 大腸에 잘 생긴다. 肺는 燥金의 臟, 胃와 大腸은 燥金의 腑로 진액을 주관한다. 오래되면 오장 陰液의 뿌리인 腎에 이른다. 대변이 굳는다.","box":[[1312,221,346,770],[1510,509,99,222]],"src":["BGI-NAE-06-01","BGI-NAE-06-02","BGI-NAE-06-03","BGI-JIN-01","BGI-JIN-02"],"tts":"넷째 방은 벽이 금 가고 화분이 말라 죽었다. 정수기 물통에도 물이 보이지 않는다. 남자는 살갗이 마른 채 입을 가리고 마른기침을 한다. 진액이 상해 메말랐다, 진상화조, 내조. 진액이 모자라면 몸이 마르고 윤기를 잃는다. 진액 대사가 어긋나는 길은 둘, 만들어지는 것이 모자라거나 너무 써서 생기는 진액부족, 그리고 퍼뜨리고 내보내지 못해 고이는 수습담음이다. 진이 상한 상진은 더위, 땀, 고열로 입과 코와 피부가 마르는 것, 액이 마른 탈액은 열병 끝이나 오랜 병으로 혀가 반들반들 붉고 이끼가 없으며 몸이 여위는 것, 액은 닳으면 채우기 어렵다. 조는 폐, 위, 대장에 잘 생긴다. 폐는 조금의 장, 위와 대장은 조금의 부로 진액을 주관한다. 오래되면 오장 음액의 뿌리인 신에 이른다. 대변이 굳는다."},{"n":6,"obj":"다섯째 방 — 벽걸이 보일러 둥근 창 속 불꽃 없는 버너와 가는 연기 · 서리와 고드름 · 두꺼운 이불 속에 웅크려 허리를 움켜쥔 남자","fact":"內寒 = 寒從中生 — 脾腎 陽虛(命門火衰): 畏寒·蜷臥·腰膝冷痛","hook":"꺼진 보일러 불씨 · 방 안 고드름 = 寒從中生","say":"다섯째 방은 벽걸이 보일러의 둥근 창 속에 불꽃이 없고 가는 연기만 오른다 — 불씨가 꺼졌다. 방 안에 서리와 고드름이 맺혔고, 남자는 두꺼운 이불 속에 웅크려 허리를 움켜쥐었다. 생명의 불, 命門의 불이 약해졌다 — 命門火衰. 陽氣가 쇠해 덥히고 기화하는 힘이 떨어지니 안에서 寒이 생긴다 — 寒從中生, 陽虛陰盛. 脾陽과 腎陽이 주이고 — 諸寒收引皆屬於腎, 추위를 타고 손발이 차며, 웅크려 누워 따뜻한 것을 찾고, 배가 차고 대변이 묽고, 혀가 촉촉하고 목마르지 않다. 腎陽이 쇠하면 온몸이 虛寒하고, 발기가 안 되고 정이 차며, 자궁이 차서 아이가 들지 않고, 붓고 소변이 막히며, 허리와 무릎이 시리고 아프다 — 腰膝冷痛, 舌淡 脈沈無力. 寒從中生은 陽氣가 쇠해 덥히지 못하고, 陽이 막혀 퍼지지 못하고, 陽이 陰을 기화하지 못해 水濕痰濁이 쌓인 것이다. 바깥 寒邪가 곧바로 들어온 直中은 外因이다.","box":[[1662,221,352,770],[1691,321,143,244]],"src":["BGI-NAE-04","BIG-015","JSG2-019"],"tts":"다섯째 방은 벽걸이 보일러의 둥근 창 속에 불꽃이 없고 가는 연기만 오른다, 불씨가 꺼졌다. 방 안에 서리와 고드름이 맺혔고, 남자는 두꺼운 이불 속에 웅크려 허리를 움켜쥐었다. 생명의 불, 명문의 불이 약해졌다, 명문화쇠. 양기가 쇠해 덥히고 기화하는 힘이 떨어지니 안에서 한이 생긴다, 한종중생, 양허음성. 비양과 신양이 주이고, 제한수인개속어신, 추위를 타고 손발이 차며, 웅크려 누워 따뜻한 것을 찾고, 배가 차고 대변이 묽고, 혀가 촉촉하고 목마르지 않다. 신양이 쇠하면 온몸이 허한하고, 발기가 안 되고 정이 차며, 자궁이 차서 아이가 들지 않고, 붓고 소변이 막히며, 허리와 무릎이 시리고 아프다, 요슬냉통, 설담 맥침무력. 한종중생은 양기가 쇠해 덥히지 못하고, 양이 막혀 퍼지지 못하고, 양이 음을 기화하지 못해 수습담탁이 쌓인 것이다. 바깥 한사가 곧바로 들어온 직중은 외인이다."},{"n":7,"kind":"review","obj":"잠긴 집 한 바퀴 — 잠긴 현관 · 바람 부는 방 · 촛불 방 · 곰팡이 욕실 · 메마른 방 · 얼어붙은 방","fact":"內風(肝) · 內火(心) · 內濕(脾) · 內燥(肺·胃·大腸) · 內寒(腎)","hook":"펄럭이는 커튼 · 큰 촛불 · 막힌 배수구 · 빈 물통 · 꺼진 보일러","say":"다시 본다. 잠긴 현관 — 外感이 아닌 內生五邪. 닫힌 방의 바람과 떨리는 손 — 內風, 肝風內動. 큰 촛불과 뜬눈의 밤 — 內火, 火熱內生. 막힌 배수구와 곰팡이와 부은 발 — 內濕, 濕濁內生, 脾. 물 없는 물통과 마른기침 — 內燥, 津傷化燥. 꺼진 보일러와 고드름 — 內寒, 寒從中生, 腎.","box":[[36,386,248,604],[281,221,342,770],[627,221,339,770],[970,221,342,770],[1312,221,346,770],[1662,221,352,770]],"src":[],"tts":"다시 본다. 잠긴 현관, 외감이 아닌 내생오사. 닫힌 방의 바람과 떨리는 손, 내풍, 간풍내동. 큰 촛불과 뜬눈의 밤, 내화, 화열내생. 막힌 배수구와 곰팡이와 부은 발, 내습, 습탁내생, 비. 물 없는 물통과 마른기침, 내조, 진상화조. 꺼진 보일러와 고드름, 내한, 한종중생, 신."}],"has_image":true},{"id":"yyox-01","title":"天人相應 — 다섯 땅의 다섯 치법(異法方宜)과 衛氣의 낮·밤","place":"다섯 방향의 장터 마을","image":"images/lessons/yyox-01.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"다섯 방향의 장터 마을 — 가운데 광장 · 오른쪽 바다 · 왼쪽 바위산 · 위 눈 언덕 · 아래 안개 늪","fact":"異法方宜論 — 땅이 다르면 먹는 것·병·치법이 다르다(天人相應)","hook":"지도처럼 본다: 오른쪽 = 東(해 뜨는 바다) · 왼쪽 = 西 · 위 = 北 · 아래 = 南 · 가운데 = 中央","say":"지도처럼 내려다본 장터 마을이다. 오른쪽 해 뜨는 바다가 東, 왼쪽 바위산이 西, 위 눈 언덕이 北, 아래 안개 늪이 南, 가운데 광장이 中央. 땅이 다르면 먹는 것이 다르고, 병이 다르고, 고치는 법이 다르다 — 『素問·異法方宜論』. 사람이 하늘과 땅을 따른다는 天人相應이다.","box":null,"src":[],"tts":"지도처럼 내려다본 장터 마을이다. 오른쪽 해 뜨는 바다가 동, 왼쪽 바위산이 서, 위 눈 언덕이 북, 아래 안개 늪이 남, 가운데 광장이 중앙. 땅이 다르면 먹는 것이 다르고, 병이 다르고, 고치는 법이 다르다, 소문, 이법방의론. 사람이 하늘과 땅을 따른다는 천인상응이다."},{"n":1,"obj":"바닷가 모래밭에서 생선을 먹는 사람 · 어깨의 붉은 종기 · 곁에서 뾰족한 돌을 든 사람","fact":"東方 — 魚鹽之地 · 食魚嗜鹹 → 癰瘍 → 砭石","hook":"해 뜨는 바다 = 東 · 생선 = 魚鹽·嗜鹹 · 붉은 종기 = 癰瘍 · 뾰족한 돌 = 砭石","say":"오른쪽, 해 뜨는 바닷가가 東方이다 — 天地가 처음 生하는 곳. 한 사람이 생선을 통째로 먹는다 — 물고기와 소금의 땅, 짠맛을 즐긴다. 그래서 어깨에 붉은 종기가 났다 — 癰瘍. 곁의 사람이 뾰족한 돌로 종기를 짼다 — 돌침, 砭石이다.","box":[1513,418,535,368],"src":["CI-01-01","CI-02","OHG2-012"],"tts":"오른쪽, 해 뜨는 바닷가가 동방이다, 천지가 처음 생하는 곳. 한 사람이 생선을 통째로 먹는다, 물고기와 소금의 땅, 짠맛을 즐긴다. 그래서 어깨에 붉은 종기가 났다, 옹양. 곁의 사람이 뾰족한 돌로 종기를 짼다, 돌침, 폄석이다."},{"n":2,"obj":"금덩이·옥이 박힌 바위산 앞, 기름진 고기를 들고 해골 그려진 약병을 들이켜는 살찐 사람","fact":"西方 — 金玉之域 · 華食(기름진 음식) → 病生於內 → 毒藥","hook":"금·옥 바위산 = 金玉之域 · 기름진 고기 = 華食 · 속병 = 病生於內 · 해골 약병 = 毒藥","say":"왼쪽 바위산에 금덩이와 옥이 박혔다 — 西方, 金玉之域. 天地가 거두어들이는 곳이다. 살찐 사람이 기름진 고기를 들었다. 바람 세고 땅이 굳센 곳이라 邪氣가 겉몸을 못 상하고, 병은 안에서 생긴다 — 病生於內. 그래서 해골 그려진 약병을 들이켠다 — 속을 치는 毒藥이다.","box":[0,404,613,526],"src":["CI-01-02","CI-03"],"tts":"왼쪽 바위산에 금덩이와 옥이 박혔다, 서방, 금옥지역. 천지가 거두어들이는 곳이다. 살찐 사람이 기름진 고기를 들었다. 바람 세고 땅이 굳센 곳이라 사기가 겉몸을 못 상하고, 병은 안에서 생긴다, 병생어내. 그래서 해골 그려진 약병을 들이켠다, 속을 치는 독약이다."},{"n":3,"obj":"눈 언덕에서 염소 곁에 앉아 젖을 마시는 털옷 목자 · 불룩한 배 위에서 타는 뜸","fact":"北方 — 高陵·風寒 · 乳食 → 藏寒生滿病 → 灸焫","hook":"눈 언덕 = 北·閉藏 · 젖 사발 = 乳食 · 불룩한 배 = 滿病 · 배 위의 뜸 = 灸焫","say":"위쪽 눈 덮인 높은 언덕이 北方이다 — 天地가 닫아 갈무리하는 곳, 바람이 차고 얼음이 언다. 털옷 입은 목자가 염소 곁에서 젖을 마신다 — 들에 살며 젖을 먹는다, 乳食. 속이 차가워져 배가 불룩하다 — 藏寒生滿病. 배 위에서 뜸이 탄다 — 灸焫이다.","box":[829,65,447,303],"src":["CI-01-03","CI-04"],"tts":"위쪽 눈 덮인 높은 언덕이 북방이다, 천지가 닫아 갈무리하는 곳, 바람이 차고 얼음이 언다. 털옷 입은 목자가 염소 곁에서 젖을 마신다, 들에 살며 젖을 먹는다, 유식. 속이 차가워져 배가 불룩하다, 장한생만병. 배 위에서 뜸이 탄다, 구설이다."},{"n":4,"obj":"안개 낀 늪에서 얼굴을 찡그리며 장아찌를 먹는 사람 · 팔에 꽂힌 가는 침들","fact":"南方 — 地下·霧露 · 嗜酸食腐 → 攣痺 → 微鍼(九鍼)","hook":"안개 낀 낮은 늪 = 南·霧露 · 신 장아찌 = 嗜酸食腐 · 가는 침 = 微鍼","say":"아래쪽 안개 낀 낮은 늪이 南方이다 — 天地가 길러 키우는 곳, 陽이 성한 곳. 땅이 낮고 안개와 이슬이 모인다. 한 사람이 신 장아찌를 먹으며 얼굴을 찡그린다 — 신 것과 삭힌 것을 즐긴다, 嗜酸食腐. 그래서 힘줄이 오그라들고 저리다 — 攣痺. 팔에 가는 침이 꽂혔다 — 微鍼, 아홉 가지 침 九鍼이 남쪽에서 왔다.","box":[894,807,346,336],"src":["CI-01-04","CI-05"],"tts":"아래쪽 안개 낀 낮은 늪이 남방이다, 천지가 길러 키우는 곳, 양이 성한 곳. 땅이 낮고 안개와 이슬이 모인다. 한 사람이 신 장아찌를 먹으며 얼굴을 찡그린다, 신 것과 삭힌 것을 즐긴다, 기산식부. 그래서 힘줄이 오그라들고 저리다, 연비. 팔에 가는 침이 꽂혔다, 미침, 아홉 가지 침 구침이 남쪽에서 왔다."},{"n":5,"obj":"광장 돗자리에 음식 접시들에 둘러싸여 누운 사람 · 그 다리를 주무르고 당기는 사람","fact":"中央 — 地平以濕 · 食雜而不勞 → 痿厥寒熱 → 導引按蹻","hook":"가운데 광장 = 中央 · 여러 접시 = 食雜 · 누워만 있음 = 不勞 · 늘어진 다리 = 痿厥 · 주무름 = 導引按蹻","say":"가운데 광장이 中央이다 — 땅이 평평하고 습해 만물이 나는 곳. 한 사람이 여러 음식 접시에 둘러싸여 누워만 있다 — 이것저것 먹고 일하지 않는다, 食雜而不勞. 그래서 다리에 힘이 빠지고 寒熱이 난다 — 痿厥寒熱. 곁의 사람이 다리를 주무르고 당긴다 — 導引按蹻다.","box":[634,389,822,411],"src":["CI-01-05","CI-06"],"tts":"가운데 광장이 중앙이다, 땅이 평평하고 습해 만물이 나는 곳. 한 사람이 여러 음식 접시에 둘러싸여 누워만 있다, 이것저것 먹고 일하지 않는다, 식잡이불로. 그래서 다리에 힘이 빠지고 한열이 난다, 위궐한열. 곁의 사람이 다리를 주무르고 당긴다, 도인안교다."},{"n":6,"obj":"반은 낮, 반은 밤인 담 두른 집 — 해 아래 담 밖을 도는 창 든 파수꾼 · 달 아래 담 안 잠자리에서 자는 사람","fact":"衛氣 — 낮엔 陽分 25周(깨어 있음) · 밤엔 陰分 25周(잠)","hook":"창 든 파수꾼 = 衛 · 해 아래 담 밖 순찰 = 晝行陽 · 달 아래 담 안의 잠 = 夜行陰","say":"왼쪽 위 집은 반은 낮, 반은 밤이다. 창 든 파수꾼이 衛氣 — 지킬 위(衛). 해 아래에서는 담 밖을 돈다 — 낮에는 몸 겉 陽分을 스물다섯 바퀴 돌아 깨어 있다. 달 아래에서는 담 안에 들어 잔다 — 밤에는 陰分을 스물다섯 바퀴. 새벽에 눈을 뜨면 눈에서 출발해 脈 밖을 빠르게 돈다. 하늘에 낮밤이 있듯 사람에게 자고 일어남이 있다 — 天有晝夜 人有臥起.","box":[14,0,634,396],"src":["JGG-007","JQ-QI-14","HUBJQ-0016"],"tts":"왼쪽 위 집은 반은 낮, 반은 밤이다. 창 든 파수꾼이 위기, 지킬 위. 해 아래에서는 담 밖을 돈다, 낮에는 몸 겉 양분을 스물다섯 바퀴 돌아 깨어 있다. 달 아래에서는 담 안에 들어 잔다, 밤에는 음분을 스물다섯 바퀴. 새벽에 눈을 뜨면 눈에서 출발해 맥 밖을 빠르게 돈다. 하늘에 낮밤이 있듯 사람에게 자고 일어남이 있다, 천유주야 인유와기."},{"n":7,"kind":"review","obj":"다섯 방위 한 바퀴 — 동 · 서 · 북 · 남 · 가운데","fact":"東 癰瘍-砭石 · 西 內病-毒藥 · 北 滿病-灸焫 · 南 攣痺-微鍼 · 中 痿厥-導引按蹻","hook":"생선 → 돌 · 고기 → 약병 · 젖 → 뜸 · 장아찌 → 침 · 여러 접시 → 주무름","say":"다시 한 바퀴. 東 바닷가 생선 — 癰瘍에 砭石. 西 바위산 기름진 고기 — 속병에 毒藥. 北 눈 언덕 젖 — 滿病에 뜸 灸焫. 南 안개 늪 장아찌 — 攣痺에 微鍼. 中央 광장 여러 접시 — 痿厥寒熱에 導引按蹻. 출전은 『素問·異法方宜論』이다 — 金匱眞言論이 아니다.","box":[[1513,418,535,368],[0,404,613,526],[829,65,447,303],[894,807,346,336],[634,389,822,411]],"src":["OHG-051","CI-01-06"],"tts":"다시 한 바퀴. 동 바닷가 생선, 옹양에 폄석. 서 바위산 기름진 고기, 속병에 독약. 북 눈 언덕 젖, 만병에 뜸 구설. 남 안개 늪 장아찌, 연비에 미침. 중앙 광장 여러 접시, 위궐한열에 도인안교. 출전은 소문, 이법방의론이다, 금궤진언론이 아니다."}],"has_image":true},{"id":"yyox-02","title":"陰陽 — 속성(全一·對待·統一)·分化와 네 관계(互根·制約·消長·轉化) + 원문 둘","place":"볕 드는 쪽·그늘진 쪽이 갈린 언덕","image":"images/lessons/yyox-02.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"볕 드는 쪽과 그늘진 쪽으로 갈린 한 언덕","fact":"陰陽 — 속성 셋 · 발전변화 속성 둘 · 기본내용 넷(互根·制約·消長·轉化)","hook":"왼쪽 볕 든 쪽 = 陽 · 오른쪽 그늘진 쪽 = 陰 (언덕 阝 + 볕 昜 / 그늘 侌)","say":"언덕 하나가 가운데 금으로 갈렸다. 왼쪽 볕 든 쪽이 陽, 오른쪽 그늘진 쪽이 陰 — 글자부터 언덕의 볕과 그늘이다. 이 언덕에서 陰陽의 속성 셋, 발전변화 속성 둘, 그리고 네 관계인 互根·制約·消長·轉化를 차례로 본다.","box":null,"src":[],"tts":"언덕 하나가 가운데 금으로 갈렸다. 왼쪽 볕 든 쪽이 양, 오른쪽 그늘진 쪽이 음, 글자부터 언덕의 볕과 그늘이다. 이 언덕에서 음양의 속성 셋, 발전변화 속성 둘, 그리고 네 관계인 호근, 제약, 소장, 전화를 차례로 본다."},{"n":1,"obj":"언덕 꼭대기, 금 위에 앉은 둥근 바위 하나 — 반은 볕, 반은 그늘","fact":"全一(專一) — 陰과 陽은 본디 한 덩어리, 한 근원(一氣)","hook":"바위는 하나 = 全一 · 볕 든 반쪽 + 그늘진 반쪽","say":"언덕 꼭대기, 둥근 바위 하나가 금 위에 앉았다. 반은 볕, 반은 그늘이지만 바위는 하나다 — 陰과 陽이 합쳐 온전한 하나, 全一이다. 온전할 전(全)으로도, 오로지 전(專)으로도 적는다 — 본디 한 기운, 한 근원이라는 뜻. 對待·統一과 함께 陰陽의 속성 셋이다.","box":[901,50,245,238],"src":["YY-01-M01","YY-01"],"tts":"언덕 꼭대기, 둥근 바위 하나가 금 위에 앉았다. 반은 볕, 반은 그늘이지만 바위는 하나다, 음과 양이 합쳐 온전한 하나, 전일이다. 온전할 전으로도, 오로지 전으로도 적는다, 본디 한 기운, 한 근원이라는 뜻. 대대, 통일과 함께 음양의 속성 셋이다."},{"n":2,"obj":"키 큰 사람 · 중간 사람 · 작은 사람이 나란히 선 셋 — 가운데 사람이 손가락으로 가리킴","fact":"對待 — 陰陽은 상대와 견주어 정해진다(상대성)","hook":"가운데 사람: 큰 사람 곁에선 작고(陰) 작은 사람 곁에선 크다(陽)","say":"볕 쪽 위, 키가 다른 세 사람. 가운데 사람은 큰 사람 곁에서는 작고, 작은 사람 곁에서는 크다. 陰이냐 陽이냐는 누구와 견주느냐로 정해진다 — 마주 대할 대(對), 기다릴 대(待), 對待. 陰陽의 상대성이다.","box":[324,86,331,360],"src":["YY-01-M02","OHG-042"],"tts":"볕 쪽 위, 키가 다른 세 사람. 가운데 사람은 큰 사람 곁에서는 작고, 작은 사람 곁에서는 크다. 음이냐 양이냐는 누구와 견주느냐로 정해진다, 마주 대할 대, 기다릴 대, 대대. 음양의 상대성이다."},{"n":3,"obj":"멜대 하나에 해 그림 물통과 달 그림 물통을 멘 짐꾼","fact":"統一 — 맞서는 陰陽이 한 바탕에 묶여 있다(대립의 통일)","hook":"해 물통(陽) + 달 물통(陰)이 멜대 하나에 = 統一","say":"왼쪽 아래, 짐꾼이 멜대 하나에 해 물통과 달 물통을 멨다. 해와 달은 맞서지만 한 멜대에 달렸다 — 맞서는 둘이 한 바탕에 묶인 統一. 한쪽이 없으면 멜대가 기운다.","box":[331,793,331,303],"src":["YY-01-M03"],"tts":"왼쪽 아래, 짐꾼이 멜대 하나에 해 물통과 달 물통을 멨다. 해와 달은 맞서지만 한 멜대에 달렸다, 맞서는 둘이 한 바탕에 묶인 통일. 한쪽이 없으면 멜대가 기운다."},{"n":4,"obj":"큰 것에서 작은 것으로 늘어선 인형 넷 — 저마다 반은 희고 반은 검다","fact":"分化 — 陰 속에 또 陰陽, 陽 속에 또 陰陽(無限可分) ★발전변화 속성","hook":"인형 속에 또 인형, 저마다 흑백 반반 = 나누어도 또 陰陽","say":"그늘 쪽 가운데, 큰 인형에서 작은 인형이 차례로 나온다. 인형마다 반은 희고 반은 검다 — 陰 속에 또 陰陽, 陽 속에 또 陰陽. 끝없이 나뉘는 分化다. 分化와 消長 둘은 발전변화 속성이라 부른다 — 속성 셋인 全一·對待·統一과 다른 갈래이니 섞지 말 것.","box":[1376,540,396,223],"src":["YY-02"],"tts":"그늘 쪽 가운데, 큰 인형에서 작은 인형이 차례로 나온다. 인형마다 반은 희고 반은 검다, 음 속에 또 음양, 양 속에 또 음양. 끝없이 나뉘는 분화다. 분화와 소장 둘은 발전변화 속성이라 부른다, 속성 셋인 전일, 대대, 통일과 다른 갈래이니 섞지 말 것."},{"n":5,"obj":"금 양쪽에 밑동을 맞대고 선 두 나무 — 땅속에서 뿌리가 금을 넘어 서로의 땅에 박힘","fact":"陰陽互根 — 서로 뿌리가 된다: 陽根於陰 陰根於陽 · 獨陰不生 孤陽不長","hook":"뿌리(根)가 서로의 땅에 = 互根","say":"한가운데, 볕 쪽 나무와 그늘 쪽 나무가 금 양쪽에 밑동을 맞대고 섰다. 땅속을 보면 뿌리가 금을 넘어 서로의 땅에 박혔다 — 뿌리 근(根), 陰陽互根. 陽은 陰에 뿌리박고 陰은 陽에 뿌리박는다. 그래서 陰만으로는 나지 못하고 陽만으로는 자라지 못한다 — 獨陰不生 孤陽不長. 陰損及陽, 陰中求陽도 이 뿌리 이야기다.","box":[749,288,569,519],"src":["YY-03-M01","YY-04","OHG-021"],"tts":"한가운데, 볕 쪽 나무와 그늘 쪽 나무가 금 양쪽에 밑동을 맞대고 섰다. 땅속을 보면 뿌리가 금을 넘어 서로의 땅에 박혔다, 뿌리 근, 음양호근. 양은 음에 뿌리박고 음은 양에 뿌리박는다. 그래서 음만으로는 나지 못하고 양만으로는 자라지 못한다, 독음불생 고양부장. 음손급양, 음중구양도 이 뿌리 이야기다."},{"n":6,"obj":"금을 사이에 둔 줄다리기 — 흰 옷 사람과 검은 옷 사람, 금 위에 멈춘 붉은 매듭","fact":"對立制約 — 서로 당겨 누르며 평형: 陰勝則陽病 陽勝則陰病","hook":"팽팽한 줄 = 制約으로 평형 · 한쪽이 이기면 진 쪽이 병","say":"아래 가운데, 흰 옷과 검은 옷이 줄다리기를 한다. 붉은 매듭이 금 위에 멈췄다 — 서로 당겨 누르니 평형이다, 對立制約. 한쪽이 이기면 진 쪽이 병든다 — 陰勝則陽病 陽勝則陰病. 陽이 이기면 熱, 陰이 이기면 寒. 寒者熱之 熱者寒之도 이 줄다리기다. 調經論의 陽虛則外寒 陰虛則內熱과는 구별한다.","box":[721,800,641,274],"src":["YY-03-M03","YY-17","OHG-022","OHG2-006"],"tts":"아래 가운데, 흰 옷과 검은 옷이 줄다리기를 한다. 붉은 매듭이 금 위에 멈췄다, 서로 당겨 누르니 평형이다, 대립제약. 한쪽이 이기면 진 쪽이 병든다, 음승즉양병 양승즉음병. 양이 이기면 열, 음이 이기면 한. 한자열지 열자한지도 이 줄다리기다. 조경론의 양허즉외한 음허즉내열과는 구별한다."},{"n":7,"obj":"롤러로 밝은 칠을 미는 칠장이 · 나무 뒤에서 금을 넘어 그늘 쪽으로 번진 밝은 땅","fact":"消長 — 한쪽이 늘면 한쪽이 준다: 陽長陰消 · 陰長陽消(量의 변화)","hook":"밝은 칠이 번지면 그늘이 줄어든다 = 陽長陰消","say":"볕 쪽 가운데, 칠장이가 롤러로 밝은 칠을 민다. 나무 뒤로 밝은 땅이 금을 넘어 그늘 쪽으로 번졌다 — 陽이 자라면 陰이 사라진다, 陽長陰消. 거꾸로면 陰長陽消. 冬至에서 夏至까지가 陰消陽長이다. 성질은 그대로이고 분량만 늘고 준다 — 사라질 소(消), 자랄 장(長), 消長.","box":[[461,483,295,267],[1031,432,317,209]],"src":["YY-03-M04","OHG-024"],"tts":"볕 쪽 가운데, 칠장이가 롤러로 밝은 칠을 민다. 나무 뒤로 밝은 땅이 금을 넘어 그늘 쪽으로 번졌다, 양이 자라면 음이 사라진다, 양장음소. 거꾸로면 음장양소. 동지에서 하지까지가 음소양장이다. 성질은 그대로이고 분량만 늘고 준다, 사라질 소, 자랄 장, 소장."},{"n":8,"obj":"왼쪽 끝 큰 모닥불(불꽃 끝이 눈송이로) · 오른쪽 끝 큰 얼음(위에서 불이 솟음)","fact":"轉化 — 極에 이르면 뒤집힌다: 重陰必陽 重陽必陰 · 寒極生熱 熱極生寒","hook":"볕 쪽 맨 끝 불 → 눈 · 그늘 쪽 맨 끝 얼음 → 불 = 끝(極)에서 뒤집힘","say":"양쪽 끝을 본다. 왼쪽 끝 큰 모닥불은 불꽃 끝이 눈송이로 바뀌고, 오른쪽 끝 큰 얼음에서는 불이 솟는다. 끝까지 가면 뒤집힌다 — 轉化. 重陰必陽 重陽必陰, 寒極生熱 熱極生寒. 언제나가 아니라 끝에 이르렀을 때만이다 — 物極必反.","box":[[0,29,259,879],[1845,389,203,548]],"src":["YY-08","OHG-023","YY-03-M02"],"tts":"양쪽 끝을 본다. 왼쪽 끝 큰 모닥불은 불꽃 끝이 눈송이로 바뀌고, 오른쪽 끝 큰 얼음에서는 불이 솟는다. 끝까지 가면 뒤집힌다, 전화. 중음필양 중양필음, 한극생열 열극생한. 언제나가 아니라 끝에 이르렀을 때만이다, 물극필반."},{"n":9,"obj":"그늘 쪽 집 — 안에서 열쇠를 쥐고 궤를 지키는 검은 옷 사람 · 밖에서 편지를 들고 달리는 흰 옷 사람","fact":"陰在內 陽之守也 · 陽在外 陰之使也","hook":"안의 지킴이(守) = 陰 · 밖의 심부름꾼(使) = 陽","say":"그늘 쪽 위의 집. 안에는 검은 옷 사람이 열쇠를 쥐고 궤를 지키고, 밖에는 흰 옷 사람이 편지를 들고 달린다. 陰은 안에서 陽의 지킴이가 되고, 陽은 밖에서 陰의 심부름꾼이 된다 — 陰在內 陽之守也, 陽在外 陰之使也. 지킬 수(守), 부릴 사(使)다. 이것도 互根의 원문이다.","box":[1434,72,562,411],"src":["YY-05"],"tts":"그늘 쪽 위의 집. 안에는 검은 옷 사람이 열쇠를 쥐고 궤를 지키고, 밖에는 흰 옷 사람이 편지를 들고 달린다. 음은 안에서 양의 지킴이가 되고, 양은 밖에서 음의 심부름꾼이 된다, 음재내 양지수야, 양재외 음지사야. 지킬 수, 부릴 사다. 이것도 호근의 원문이다."},{"n":10,"obj":"빛나는 온전한 태극 원반 · 두 쪽으로 쪼개져 빛을 잃은 태극 원반","fact":"陰平陽秘 精神乃治 · 陰陽離決 精氣乃絶(生氣通天論)","hook":"온전한 원반 = 陰平陽秘 · 쪼개진 원반 = 陰陽離決","say":"오른쪽 아래 원반 둘. 온전한 원반은 빛난다 — 陰이 고르고 陽이 단단히 여며지면 精神이 다스려진다, 陰平陽秘 精神乃治. 쪼개져 흩어진 원반은 빛을 잃었다 — 陰陽이 갈라서면 精氣가 끊어진다, 陰陽離決 精氣乃絶. 『素問·生氣通天論』. 몸의 구조와 기능이 고르게 어울린 상태가 陰平陽秘다 — 五行의 亢害承制와 구별한다.","box":[1420,901,447,173],"src":["YY-06","OHG-017","OHG2-014"],"tts":"오른쪽 아래 원반 둘. 온전한 원반은 빛난다, 음이 고르고 양이 단단히 여며지면 정신이 다스려진다, 음평양비 정신내치. 쪼개져 흩어진 원반은 빛을 잃었다, 음양이 갈라서면 정기가 끊어진다, 음양리결 정기내절. 소문, 생기통천론. 몸의 구조와 기능이 고르게 어울린 상태가 음평양비다, 오행의 항해승제와 구별한다."},{"n":11,"kind":"review","obj":"언덕 한 바퀴 — 바위 · 세 사람 · 멜대 · 인형 / 두 나무 · 줄다리기 · 칠장이 · 불과 얼음","fact":"속성 全一·對待·統一 / 발전변화 分化·消長 / 관계 互根·制約·消長·轉化","hook":"바위·세 사람·멜대 = 속성 셋 · 인형·칠 = 발전변화 둘 · 나무·줄·칠·불얼음 = 관계 넷","say":"다시 본다. 속성 셋 — 바위 하나 全一, 키 다른 세 사람 對待, 멜대 하나 統一. 발전변화 속성 둘 — 인형 分化, 칠장이 消長. 기본내용 넷 — 뿌리 얽힌 두 나무 互根, 줄다리기 對立制約, 칠장이 消長, 불과 얼음 轉化. 消長은 두 갈래에 다 든다.","box":[[901,50,245,238],[324,86,331,360],[331,793,331,303],[1376,540,396,223],[749,288,569,519],[721,800,641,274],[461,483,295,267],[0,29,259,879],[1845,389,203,548]],"src":["YY-03"],"tts":"다시 본다. 속성 셋, 바위 하나 전일, 키 다른 세 사람 대대, 멜대 하나 통일. 발전변화 속성 둘, 인형 분화, 칠장이 소장. 기본내용 넷, 뿌리 얽힌 두 나무 호근, 줄다리기 대립제약, 칠장이 소장, 불과 얼음 전화. 소장은 두 갈래에 다 든다."}],"has_image":true},{"id":"yyox-03","title":"五行 왕국 — 다섯 인물(臟·色·官)과 그 성질(曲直·炎上·稼穡·從革·潤下)","place":"봄에서 겨울로 이어진 다섯 칸 들판","image":"images/lessons/yyox-03.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"봄에서 겨울로 이어진 다섯 칸 들판","fact":"五行 왕국 — 木火土金水 다섯 칸마다 臟·色·官 한 사람과 그 行의 성질","hook":"왼쪽 → 오른쪽 = 봄·여름·長夏·가을·겨울 = 木 → 火 → 土 → 金 → 水(相生 차례)","say":"들판이 다섯 칸으로 나뉘어 봄에서 겨울로 이어진다. 왼쪽부터 木, 火, 土, 金, 水 — 차례대로 낳는 相生의 순서다. 칸마다 뒤에는 그 行의 장부를 맡은 사람이 서 있고, 앞에는 그 行의 성질을 보여 주는 물건이 있다.","box":null,"src":[],"tts":"들판이 다섯 칸으로 나뉘어 봄에서 겨울로 이어진다. 왼쪽부터 목, 화, 토, 금, 수, 차례대로 낳는 상생의 순서다. 칸마다 뒤에는 그 행의 장부를 맡은 사람이 서 있고, 앞에는 그 행의 성질을 보여 주는 물건이 있다."},{"n":1,"obj":"봄 들판, 칼을 쥔 초록 갑옷의 장군","fact":"木 = 肝 · 靑 · 將軍之官(謀慮出焉)","hook":"초록 갑옷 = 靑·木 · 장군 = 將軍之官","say":"첫 칸은 봄, 木이다. 초록 갑옷의 장군이 섰다 — 肝은 將軍之官, 꾀와 헤아림 謀慮가 여기서 나온다. 색은 靑. 肝은 疏泄을 맡고 血을 갈무리한다. 굳센 장부라 剛臟, 피의 바다라 血海, 罷極之本이라고도 한다. 바탕은 陰인데 쓰임은 陽이다 — 體陰而用陽.","box":[58,108,281,440],"src":["JS-GAN-01","JSG-016"],"tts":"첫 칸은 봄, 목이다. 초록 갑옷의 장군이 섰다, 간은 장군지관, 꾀와 헤아림 모려가 여기서 나온다. 색은 청. 간은 소설을 맡고 혈을 갈무리한다. 굳센 장부라 강장, 피의 바다라 혈해, 파극지본이라고도 한다. 바탕은 음인데 쓰임은 양이다, 체음이용양."},{"n":2,"obj":"굽은 묘목 하나와 곧게 선 묘목 하나","fact":"木曰曲直 — 굽고 곧게 뻗음: 生長·升發·條達·舒暢","hook":"굽은(曲) 묘목 + 곧은(直) 묘목 = 曲直","say":"장군 앞의 묘목 둘 — 하나는 굽었고 하나는 곧다. 굽을 곡(曲), 곧을 직(直), 木曰曲直. 나무가 굽었다 펴지며 위로 밖으로 뻗듯, 자라고 오르고 막힘없이 펴지는 성질이다 — 生長·升發·條達·舒暢. 肝의 疏泄이 이것을 닮았다.","box":[29,627,360,411],"src":["OH-02-01"],"tts":"장군 앞의 묘목 둘, 하나는 굽었고 하나는 곧다. 굽을 곡, 곧을 직, 목왈곡직. 나무가 굽었다 펴지며 위로 밖으로 뻗듯, 자라고 오르고 막힘없이 펴지는 성질이다, 생장, 승발, 조달, 서창. 간의 소설이 이것을 닮았다."},{"n":3,"obj":"여름 들판, 옥좌에 앉은 붉은 용포의 임금","fact":"火 = 心 · 赤 · 君主之官(神明出焉)","hook":"붉은 용포 = 赤·火 · 옥좌의 임금 = 君主之官","say":"둘째 칸은 여름, 火다. 붉은 용포의 임금이 옥좌에 앉았다 — 心은 君主之官, 神明이 여기서 나온다. 색은 赤. 心은 血脈을 맡고 神을 갈무리한다. 五臟六腑의 큰 주인이고 生之本이며, 빛은 얼굴에 드러나고 血脈을 채운다.","box":[519,159,238,389],"src":["JS-SIM-01","JSG-015"],"tts":"둘째 칸은 여름, 화다. 붉은 용포의 임금이 옥좌에 앉았다, 심은 군주지관, 신명이 여기서 나온다. 색은 적. 심은 혈맥을 맡고 신을 갈무리한다. 오장육부의 큰 주인이고 생지본이며, 빛은 얼굴에 드러나고 혈맥을 채운다."},{"n":4,"obj":"불꽃과 불티가 곧게 위로 솟는 모닥불","fact":"火曰炎上 — 타오르며 위로: 溫熱·向上(蒸騰)","hook":"위로만 솟는 불꽃 = 炎上","say":"임금 앞 모닥불, 불꽃과 불티가 위로만 솟는다 — 불꽃 염(炎), 위 상(上), 火曰炎上. 따뜻하고 뜨겁고 위로 오르는 성질이다 — 溫熱·向上. 心의 陽이 온몸을 덥히고 밀어 주는 것이 이것을 닮았다.","box":[476,620,274,440],"src":["OH-02-02"],"tts":"임금 앞 모닥불, 불꽃과 불티가 위로만 솟는다, 불꽃 염, 위 상, 화왈염상. 따뜻하고 뜨겁고 위로 오르는 성질이다, 온열, 향상. 심의 양이 온몸을 덥히고 밀어 주는 것이 이것을 닮았다."},{"n":5,"obj":"곡식 자루 가득한 나무 곳간 문 앞의 노란 옷 농부","fact":"土 = 脾 · 黃 · 倉廩之官(五味出焉)","hook":"노란 옷 = 黃·土 · 곡식 곳간 = 倉廩之官","say":"셋째 칸은 곡식 익는 長夏, 土다. 노란 옷 농부가 곡식 곳간 문 앞에 섰다 — 脾胃는 倉廩之官, 곳간 창(倉), 곳간 름(廩). 五味가 여기서 나온다. 색은 黃. 脾는 運化와 升淸을 맡고 血을 거느린다. 後天之本, 氣血生化之源이며, 마른 것을 좋아하고 습을 싫어한다. 같은 대목에서 膻中은 臣使之官, 大腸은 傳道之官, 小腸은 受盛之官이다.","box":[836,0,396,461],"src":["JS-BI-01","JS-BI-01-M01","JSG-002","JSG-017"],"tts":"셋째 칸은 곡식 익는 장하, 토다. 노란 옷 농부가 곡식 곳간 문 앞에 섰다, 비위는 창름지관, 곳간 창, 곳간 름 늠. 오미가 여기서 나온다. 색은 황. 비는 운화와 승청을 맡고 혈을 거느린다. 후천지본, 기혈생화지원이며, 마른 것을 좋아하고 습을 싫어한다. 같은 대목에서 전중은 신사지관, 대장은 전도지관, 소장은 수성지관이다."},{"n":6,"obj":"반은 씨 뿌린 고랑, 반은 베어 묶은 볏단과 낫이 놓인 밭","fact":"土爰稼穡 — 심고 거둠: 化生·承載(萬物之母)","hook":"씨 뿌린 고랑(稼) + 거둔 볏단(穡) = 稼穡","say":"농부 앞의 밭 — 왼쪽 고랑에는 씨를 뿌렸고 오른쪽에는 볏단과 낫이 있다. 심을 가(稼), 거둘 색(穡), 土爰稼穡. 洪範은 이 줄만 가로 왈 대신 이에 원(爰)을 쓴다. 만물을 낳아 기르고 실어 받치는 성질 — 化生·承載, 흙은 萬物之母다. 脾의 運化가 이것을 닮았다.","box":[836,778,389,365],"src":["OH-02-03"],"tts":"농부 앞의 밭, 왼쪽 고랑에는 씨를 뿌렸고 오른쪽에는 볏단과 낫이 있다. 심을 가, 거둘 색, 토원가색. 홍범은 이 줄만 가로 왈 대신 이에 원을 쓴다. 만물을 낳아 기르고 실어 받치는 성질, 화생, 승재, 흙은 만물지모다. 비의 운화가 이것을 닮았다."},{"n":7,"obj":"가을 갈대밭, 흰 도포에 긴 흰 수염의 노인(재상)","fact":"金 = 肺 · 白 · 相傅之官(治節出焉)","hook":"흰 도포 = 白·金 · 늙은 재상 = 相傅之官","say":"넷째 칸은 가을, 金이다. 흰 도포의 늙은 재상이 섰다 — 肺는 相傅之官, 임금을 돕는 재상이다. 다스림과 조절, 治節이 여기서 나온다. 색은 白. 肺는 氣를 맡고, 宣發하고 肅降하며, 물길을 틔우고, 온 脈이 모인다 — 朝百脈. 덮개처럼 맨 위에 있어 華蓋, 여려서 嬌臟, 水之上源이다.","box":[1355,151,180,404],"src":["JS-PYE-01","JS-PYE-01-M01","JSG-014"],"tts":"넷째 칸은 가을, 금이다. 흰 도포의 늙은 재상이 섰다, 폐는 상부지관, 임금을 돕는 재상이다. 다스림과 조절, 치절이 여기서 나온다. 색은 백. 폐는 기를 맡고, 선발하고 숙강하며, 물길을 틔우고, 온 맥이 모인다, 조백맥. 덮개처럼 맨 위에 있어 화개, 여려서 교장, 수지상원이다."},{"n":8,"obj":"모루 위, 망치질로 구부려 모양을 바꾼 달군 쇠막대","fact":"金曰從革 — 따르고 바뀜: 變革·肅殺·收斂·下降","hook":"망치를 따라(從) 모양을 바꾸는(革) 쇠 = 從革","say":"재상 앞 모루에서 달군 쇠가 망치를 따라 새 모양으로 바뀐다 — 따를 종(從), 바꿀 혁(革), 金曰從革. 바꾸고, 가을 서리처럼 죽이고, 거두고, 내리는 성질이다 — 變革·肅殺·收斂·下降. 肺의 淸肅과 肅降이 이것을 닮았다.","box":[1283,735,324,331],"src":["OH-02-04"],"tts":"재상 앞 모루에서 달군 쇠가 망치를 따라 새 모양으로 바뀐다, 따를 종, 바꿀 혁, 금왈종혁. 바꾸고, 가을 서리처럼 죽이고, 거두고, 내리는 성질이다, 변혁, 숙살, 수렴, 하강. 폐의 청숙과 숙강이 이것을 닮았다."},{"n":9,"obj":"겨울 눈밭, 큰 바위를 머리 위로 번쩍 든 검은 옷의 장사","fact":"水 = 腎 · 黑 · 作强之官(伎巧出焉)","hook":"검은 옷 = 黑·水 · 바위를 드는 힘 = 作强之官","say":"다섯째 칸은 겨울, 水다. 검은 잠수복의 장사가 큰 바위를 번쩍 들었다 — 腎은 作强之官, 힘써 굳세게 하는 벼슬이다. 솜씨 伎巧가 여기서 나온다. 색은 黑. 腎은 精을 갈무리하고 물을 맡고 氣를 받아들인다. 先天之本, 封藏之本이며 뼈를 맡아 髓를 낳고, 빛은 머리털에 드러난다. 같은 대목에서 三焦는 決瀆之官, 膀胱은 州都之官이다.","box":[1737,65,231,490],"src":["JS-SIN-01","JS-SIN-01-M01","JSG-003","JSG-018"],"tts":"다섯째 칸은 겨울, 수다. 검은 잠수복의 장사가 큰 바위를 번쩍 들었다, 신은 작강지관, 힘써 굳세게 하는 벼슬이다. 솜씨 기교가 여기서 나온다. 색은 흑. 신은 정을 갈무리하고 물을 맡고 기를 받아들인다. 선천지본, 봉장지본이며 뼈를 맡아 수를 낳고, 빛은 머리털에 드러난다. 같은 대목에서 삼초는 결독지관, 방광은 주도지관이다."},{"n":10,"obj":"돌계단을 타고 낮은 못으로 떨어지는 작은 폭포","fact":"水曰潤下 — 적시며 아래로: 滋潤·下行·寒冷·閉藏","hook":"땅을 적시며(潤) 아래로(下) 흐르는 물 = 潤下","say":"장사 앞, 물이 돌계단을 타고 낮은 못으로 흘러내리며 땅을 적신다 — 적실 윤(潤), 아래 하(下), 水曰潤下. 차서 내려간다는 寒下가 아니다. 적시고 내려가고 차갑고 갈무리하는 성질이다 — 滋潤·下行·寒冷·閉藏. 腎의 藏精이 이것을 닮았다.","box":[1657,620,391,432],"src":["OH-02-05"],"tts":"장사 앞, 물이 돌계단을 타고 낮은 못으로 흘러내리며 땅을 적신다, 적실 윤, 아래 하, 수왈윤하. 차서 내려간다는 한하가 아니다. 적시고 내려가고 차갑고 갈무리하는 성질이다, 자윤, 하행, 한랭, 폐장. 신의 장정이 이것을 닮았다."},{"n":11,"kind":"review","obj":"다섯 칸 한 줄 — 장군 · 임금 · 농부 · 재상 · 장사와 그 앞의 물건","fact":"曲直·炎上·稼穡·從革·潤下 / 將軍·君主·倉廩·相傅·作强","hook":"묘목 · 모닥불 · 밭 · 모루 · 폭포","say":"왼쪽부터 다시. 굽고 곧은 묘목 — 木曰曲直, 장군 肝. 모닥불 — 火曰炎上, 임금 心. 씨와 볏단 — 土爰稼穡, 곳간 농부 脾. 모루의 쇠 — 金曰從革, 재상 肺. 폭포 — 水曰潤下, 장사 腎. 『尙書·洪範』의 다섯 구절이다. 十二官에서 膽은 中正之官, 決斷이 나온다.","box":[[0,58,396,1038],[411,130,411,966],[829,0,404,1143],[1240,130,396,966],[1643,58,405,1038]],"src":["OH-01","OHG-033","JSG-001"],"tts":"왼쪽부터 다시. 굽고 곧은 묘목, 목왈곡직, 장군 간. 모닥불, 화왈염상, 임금 심. 씨와 볏단, 토원가색, 곳간 농부 비. 모루의 쇠, 금왈종혁, 재상 폐. 폭포, 수왈윤하, 장사 신. 상서, 홍범의 다섯 구절이다. 십이관에서 담은 중정지관, 결단이 나온다."}],"has_image":true},{"id":"yyox-04","title":"五行의 자리와 수 — 五方 · 相生 · 相剋 · 生成數(水火木金土)","place":"다섯 구역 과수원","image":"images/lessons/yyox-04.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"다섯 구역 과수원 — 위 검은 못 · 아래 붉은 모닥불 · 오른쪽 초록 나무 · 왼쪽 흰 연장 걸이 · 가운데 누런 흙","fact":"五行의 자리와 수 — 五方 · 相生 · 相剋 · 生成數","hook":"지도처럼: 위 北 水(黑) · 아래 南 火(赤) · 오른쪽 東 木(靑) · 왼쪽 西 金(白) · 가운데 土(黃) · 흰 판의 점 = 生數","say":"지도처럼 내려다본 과수원이다. 위 검은 구역의 못이 北의 水, 아래 붉은 구역의 모닥불이 南의 火, 오른쪽 초록 구역의 나무가 東의 木, 왼쪽 흰 구역의 쇠 연장이 西의 金, 가운데 누런 흙이 中央의 土. 구역마다 놓인 흰 판의 점이 그 行의 生數다.","box":null,"src":[],"tts":"지도처럼 내려다본 과수원이다. 위 검은 구역의 못이 북의 수, 아래 붉은 구역의 모닥불이 남의 화, 오른쪽 초록 구역의 나무가 동의 목, 왼쪽 흰 구역의 쇠 연장이 서의 금, 가운데 누런 흙이 중앙의 토. 구역마다 놓인 흰 판의 점이 그 행의 생수다."},{"n":1,"obj":"못 쪽에서 물뿌리개를 들고 와 나무뿌리에 물을 붓는 정원사","fact":"相生 — 木→火→土→金→水→木 (木生火·火生土·土生金·金生水·水生木)","hook":"물을 주면 나무가 자란다 = 水生木 — 낳는 차례의 한 마디","say":"정원사가 못의 물을 길어 와 나무에 붓는다 — 물이 나무를 낳는다, 水生木. 相生은 이렇게 다음 것을 낳아 기르는 차례다. 木은 타서 火를 낳고, 火는 재가 되어 土를 낳고, 土는 속에서 金을 낳고, 金은 물을 맺어 水를 낳고, 水는 다시 木을 기른다. 과수원으로는 오른쪽 나무에서 아래 모닥불, 가운데 흙, 왼쪽 쇠, 위쪽 못, 다시 나무다.","box":[1225,130,483,389],"src":["OH-03-02"],"tts":"정원사가 못의 물을 길어 와 나무에 붓는다, 물이 나무를 낳는다, 수생목. 상생은 이렇게 다음 것을 낳아 기르는 차례다. 목은 타서 화를 낳고, 화는 재가 되어 토를 낳고, 토는 속에서 금을 낳고, 금은 물을 맺어 수를 낳고, 수는 다시 목을 기른다. 과수원으로는 오른쪽 나무에서 아래 모닥불, 가운데 흙, 왼쪽 쇠, 위쪽 못, 다시 나무다."},{"n":2,"obj":"나무줄기에 깊이 박힌 쇠도끼 · 왼쪽 구역의 도끼·낫 걸이","fact":"相剋 — 木剋土 · 土剋水 · 水剋火 · 火剋金 · 金剋木","hook":"쇠도끼가 나무를 찍는다 = 金剋木 — 누르는 차례의 한 마디","say":"나무줄기에 쇠도끼가 박혔다 — 왼쪽 걸이에서 온 쇠가 나무를 이긴다, 金剋木. 相剋은 하나 건너 누르는 차례다. 나무뿌리가 흙을 뚫고, 흙 둑이 물을 막고, 물이 불을 끄고, 불이 쇠를 녹이고, 쇠가 나무를 찍는다 — 木剋土, 土剋水, 水剋火, 火剋金, 金剋木. 相生 차례 木火土金水에서 한 칸씩 건너뛰면 된다.","box":[[1585,259,195,259],[72,281,252,288]],"src":["OH-03-03"],"tts":"나무줄기에 쇠도끼가 박혔다, 왼쪽 걸이에서 온 쇠가 나무를 이긴다, 금극목. 상극은 하나 건너 누르는 차례다. 나무뿌리가 흙을 뚫고, 흙 둑이 물을 막고, 물이 불을 끄고, 불이 쇠를 녹이고, 쇠가 나무를 찍는다, 목극토, 토극수, 수극화, 화극금, 금극목. 상생 차례 목화토금수에서 한 칸씩 건너뛰면 된다."},{"n":3,"obj":"위쪽 검은 구역의 둥근 못 · 점 하나짜리 흰 판","fact":"水 — 生數 1 · 成數 6 (北)","hook":"점 하나 = 生數 1 · 가운데 흙의 5를 더하면 成數 6","say":"위쪽 검은 구역, 못 곁의 흰 판에 점이 하나 — 水의 生數는 1이다. 북쪽, 검은색. 成數는 여기에 가운데 흙의 다섯을 더한다 — 하나 더하기 다섯, 6. 水는 1과 6. 生數는 낳는 수, 成數는 이루는 수 — 흙을 만나야 이루어진다. 生成數는 水 1·6, 火 2·7, 木 3·8, 金 4·9, 土 5·10 차례다.","box":[[440,50,324,202],[793,29,461,245]],"src":["CI-12-03"],"tts":"위쪽 검은 구역, 못 곁의 흰 판에 점이 하나, 수의 생수는 1이다. 북쪽, 검은색. 성수는 여기에 가운데 흙의 다섯을 더한다, 하나 더하기 다섯, 6. 수는 1과 6. 생수는 낳는 수, 성수는 이루는 수, 흙을 만나야 이루어진다. 생성수는 수 1, 6, 화 2, 7, 목 3, 8, 금 4, 9, 토 5, 10 차례다."},{"n":4,"obj":"아래쪽 붉은 구역의 모닥불 · 점 둘짜리 흰 판","fact":"火 — 生數 2 · 成數 7 (南)","hook":"점 둘 = 生數 2 · 5를 더하면 成數 7","say":"아래쪽 붉은 구역, 모닥불 곁의 판에 점이 둘 — 火의 生數는 2. 남쪽, 붉은색. 다섯을 더해 成數는 7. 火는 2와 7. 成數만 물으면 木은 8, 火는 7이다.","box":[[865,879,317,209],[1268,822,216,252]],"src":["CI-12-01"],"tts":"아래쪽 붉은 구역, 모닥불 곁의 판에 점이 둘, 화의 생수는 2. 남쪽, 붉은색. 다섯을 더해 성수는 7. 화는 2와 7. 성수만 물으면 목은 8, 화는 7이다."},{"n":5,"obj":"오른쪽 초록 구역의 큰 나무 · 점 셋짜리 흰 판","fact":"木 — 生數 3 · 成數 8 (東)","hook":"점 셋 = 生數 3 · 5를 더하면 成數 8","say":"오른쪽 초록 구역, 나무 아래 판에 점이 셋 — 木의 生數는 3. 동쪽, 푸른색. 다섯을 더해 成數는 8. 木은 3과 8.","box":[[1643,598,360,238],[1492,29,310,490]],"src":[],"tts":"오른쪽 초록 구역, 나무 아래 판에 점이 셋, 목의 생수는 3. 동쪽, 푸른색. 다섯을 더해 성수는 8. 목은 3과 8."},{"n":6,"obj":"왼쪽 흰 구역의 도끼·낫 걸이 · 점 넷짜리 흰 판","fact":"金 — 生數 4 · 成數 9 (西)","hook":"점 넷 = 生數 4 · 5를 더하면 成數 9","say":"왼쪽 흰 구역, 쇠 연장 걸이 곁의 판에 점이 넷 — 金의 生數는 4. 서쪽, 흰색. 다섯을 더해 成數는 9. 金은 4와 9. 『金匱眞言論』이 적는 수도 金 9, 水 6이다.","box":[[151,497,360,187],[72,281,252,288]],"src":["CI-12-02"],"tts":"왼쪽 흰 구역, 쇠 연장 걸이 곁의 판에 점이 넷, 금의 생수는 4. 서쪽, 흰색. 다섯을 더해 성수는 9. 금은 4와 9. 금궤진언론이 적는 수도 금 9, 수 6이다."},{"n":7,"obj":"가운데 누런 구역의 삽 꽂힌 흙무더기 · 점 다섯짜리 흰 판","fact":"土 — 生數 5 · 成數 10 (中央)","hook":"점 다섯 = 生數 5 · 5를 더하면 成數 10 · 다른 넷의 成數도 이 5를 얻어 이뤄진다","say":"가운데 누런 구역, 흙무더기 곁의 판에 점이 다섯 — 土의 生數는 5. 가운데, 누런색. 다섯을 더해 成數는 10. 다른 넷의 成數는 모두 이 흙의 5를 얻어 이루어진다. 다만 『金匱眞言論』은 土에만 成數 10이 아니라 生數 5를 쓴다.","box":[865,382,490,295],"src":[],"tts":"가운데 누런 구역, 흙무더기 곁의 판에 점이 다섯, 토의 생수는 5. 가운데, 누런색. 다섯을 더해 성수는 10. 다른 넷의 성수는 모두 이 흙의 5를 얻어 이루어진다. 다만 금궤진언론은 토에만 성수 10이 아니라 생수 5를 쓴다."},{"n":8,"obj":"점 하나 · 둘 · 셋 · 넷 · 다섯 — 흰 판 다섯 장","fact":"生成 순서 水→火→木→金→土 ≠ 相生 순서 木→火→土→金→水","hook":"점 수대로: 위(水) → 아래(火) → 오른쪽(木) → 왼쪽(金) → 가운데(土)","say":"흰 판을 점 수대로 센다. 하나는 위의 水, 둘은 아래의 火, 셋은 오른쪽 木, 넷은 왼쪽 金, 다섯은 가운데 土 — 五行이 생겨난 차례, 水火木金土다. 낳는 차례인 相生 木火土金水와 다르다. 위와 아래, 오른쪽과 왼쪽, 그리고 가운데 — 십자를 긋는 순서로 외운다.","box":[[440,50,324,202],[865,879,317,209],[1643,598,360,238],[151,497,360,187],[872,483,303,187]],"src":["OH-03-01"],"tts":"흰 판을 점 수대로 센다. 하나는 위의 수, 둘은 아래의 화, 셋은 오른쪽 목, 넷은 왼쪽 금, 다섯은 가운데 토, 오행이 생겨난 차례, 수화목금토다. 낳는 차례인 상생 목화토금수와 다르다. 위와 아래, 오른쪽과 왼쪽, 그리고 가운데, 십자를 긋는 순서로 외운다."},{"n":9,"kind":"review","obj":"과수원 한 바퀴 — 못 · 모닥불 · 나무 · 연장 걸이 · 흙무더기","fact":"水1·6 火2·7 木3·8 金4·9 土5·10 / 相生 木火土金水 · 相剋 한 칸 건너","hook":"점 + 5 = 成數 · 물 주기 = 相生 · 도끼 = 相剋","say":"다시 한 바퀴. 위 못 — 水 1과 6. 아래 모닥불 — 火 2와 7. 오른쪽 나무 — 木 3과 8. 왼쪽 쇠 연장 — 金 4와 9. 가운데 흙 — 土 5와 10. 물 주는 정원사는 相生, 낳는 차례 木火土金水. 나무에 박힌 도끼는 相剋, 한 칸 건너 누른다. 생겨난 차례는 점 수대로 水火木金土.","box":[[793,29,461,245],[1268,822,216,252],[1492,29,310,490],[72,281,252,288],[865,382,490,295]],"src":[],"tts":"다시 한 바퀴. 위 못, 수 1과 6. 아래 모닥불, 화 2와 7. 오른쪽 나무, 목 3과 8. 왼쪽 쇠 연장, 금 4와 9. 가운데 흙, 토 5와 10. 물 주는 정원사는 상생, 낳는 차례 목화토금수. 나무에 박힌 도끼는 상극, 한 칸 건너 누른다. 생겨난 차례는 점 수대로 수화목금토."}],"has_image":true},{"id":"yyox-05","title":"金匱眞言論 다섯 방위 — 竅·數·音·臭 (일반 배속과 갈리는 자리)","place":"금 궤짝 다섯을 방위대로 놓은 금고방","image":"images/lessons/yyox-05.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"돌 금고방에 방위대로 놓인 금 궤짝 다섯","fact":"金匱眞言論 — 다섯 방위의 色·臟·竅·數·音·臭","hook":"금 궤짝 = 金匱 · 띠 색 = 방위의 색 · 뚜껑 그림 = 開竅 · 흰 판 점의 합 = 數 · 곁의 물건 = 音과 臭","say":"금 궤짝에 넣어 둔 참된 말 — 『素問·金匱眞言論』이다. 금 궤짝 다섯이 방위대로 놓였다. 위가 北, 오른쪽이 東, 아래가 南, 왼쪽이 西, 그리고 가운데. 띠 색이 방위의 색이고, 뚜껑 안쪽 그림이 그 장부가 열리는 구멍, 곁의 흰 판 점을 모두 더한 것이 수, 곁의 물건이 소리와 냄새다. 흔히 아는 배속과 갈리는 자리가 셋 있다.","box":null,"src":[],"tts":"금 궤짝에 넣어 둔 참된 말, 소문, 금궤진언론이다. 금 궤짝 다섯이 방위대로 놓였다. 위가 북, 오른쪽이 동, 아래가 남, 왼쪽이 서, 그리고 가운데. 띠 색이 방위의 색이고, 뚜껑 안쪽 그림이 그 장부가 열리는 구멍, 곁의 흰 판 점을 모두 더한 것이 수, 곁의 물건이 소리와 냄새다. 흔히 아는 배속과 갈리는 자리가 셋 있다."},{"n":1,"obj":"초록 띠 궤짝 — 뚜껑의 큰 눈 · 점 다섯 판과 점 셋 판 · 누린내 나는 뿔 큰 숫양","fact":"東方 靑 → 肝 — 開竅 目 · 數 8 · 音 角 · 臭 臊","hook":"눈 = 目 · 5 + 3 = 8 · 뿔 = 角 · 숫양 누린내 = 臊","say":"오른쪽 초록 띠 궤짝이 東方이다. 푸른빛이 肝으로 통한다. 뚜껑에 큰 눈 — 開竅於目. 흰 판은 다섯과 셋, 더해서 8 — 木의 成數다. 곁의 숫양은 뿔이 크다 — 뿔 각(角), 木의 소리다. 털에서 누린내가 난다 — 누린내 조(臊).","box":[1420,144,598,548],"src":["CI-07","OGI-OUN-06-01","CI-12-01"],"tts":"오른쪽 초록 띠 궤짝이 동방이다. 푸른빛이 간으로 통한다. 뚜껑에 큰 눈, 개규어목. 흰 판은 다섯과 셋, 더해서 8, 목의 성수다. 곁의 숫양은 뿔이 크다, 뿔 각, 목의 소리다. 털에서 누린내가 난다, 누린내 조."},{"n":2,"obj":"붉은 띠 궤짝 — 뚜껑의 큰 귀 · 점 다섯 판과 점 둘 판 · 그을려 검은 연기 나는 징","fact":"南方 赤 → 心 — 開竅 耳(★) · 數 7 · 音 徵 · 臭 焦","hook":"귀 = 耳(혀가 아님) · 5 + 2 = 7 · 징 = 徵 · 탄내 = 焦","say":"아래쪽 붉은 띠 궤짝이 南方이다. 붉은빛이 心으로 통한다. 뚜껑에는 혀가 아니라 큰 귀 — 이 편은 心이 귀로 열린다고 한다, 開竅於耳. 함정 자리다. 흰 판은 다섯과 둘, 더해서 7 — 火의 成數. 곁의 징이 火의 소리다 — 글자는 부를 징(徵), 소리 이름으로는 치라고 읽는다. 징이 불에 그을려 탄내가 난다 — 탈 초(焦).","box":[1312,656,663,483],"src":["CI-08","OGI-OUN-06-02"],"tts":"아래쪽 붉은 띠 궤짝이 남방이다. 붉은빛이 심으로 통한다. 뚜껑에는 혀가 아니라 큰 귀, 이 편은 심이 귀로 열린다고 한다, 개규어이. 함정 자리다. 흰 판은 다섯과 둘, 더해서 7, 화의 성수. 곁의 징이 화의 소리다, 글자는 부를 징, 소리 이름으로는 치라고 읽는다. 징이 불에 그을려 탄내가 난다, 탈 초."},{"n":3,"obj":"누런 띠 궤짝 — 뚜껑의 큰 입 · 점 다섯 판 하나 · 향 연기와 꽃에 둘러싸인 금빛 궁궐 모형","fact":"中央 黃 → 脾 — 開竅 口 · 數 5(★生數) · 音 宮 · 臭 香","hook":"입 = 口 · 판 하나뿐 5 = 土만 生數 · 궁궐 = 宮 · 향 연기 = 香","say":"가운데 누런 띠 궤짝이 中央이다. 누런빛이 脾로 통한다. 뚜껑에 큰 입 — 開竅於口. 흰 판은 다섯 하나뿐 — 수는 5다. 다른 넷은 다섯에 제 수를 더한 成數를 쓰는데, 土만 成數 10이 아니라 生數 5를 쓴다. 河圖로 치면 土는 5와 10이다. 곁의 금빛 궁궐이 土의 소리 — 집 궁(宮). 향 연기가 피어오른다 — 향기 향(香).","box":[764,389,663,483],"src":["CI-09","OGI-OUN-06-03","CI-12-02"],"tts":"가운데 누런 띠 궤짝이 중앙이다. 누런빛이 비로 통한다. 뚜껑에 큰 입, 개규어구. 흰 판은 다섯 하나뿐, 수는 5다. 다른 넷은 다섯에 제 수를 더한 성수를 쓰는데, 토만 성수 10이 아니라 생수 5를 쓴다. 하도로 치면 토는 5와 10이다. 곁의 금빛 궁궐이 토의 소리, 집 궁. 향 연기가 피어오른다, 향기 향."},{"n":4,"obj":"흰 띠 궤짝 — 뚜껑의 큰 코 · 점 다섯 판과 점 넷 판 · 냄새 나는 날생선을 든 봇짐 상인","fact":"西方 白 → 肺 — 開竅 鼻 · 數 9 · 音 商 · 臭 腥","hook":"코 = 鼻 · 5 + 4 = 9 · 상인 = 商 · 생선 비린내 = 腥","say":"왼쪽 흰 띠 궤짝이 西方이다. 흰빛이 肺로 통한다. 뚜껑에 큰 코 — 開竅於鼻. 흰 판은 다섯과 넷, 더해서 9 — 金의 成數. 곁에 선 사람은 봇짐을 진 상인이다 — 장사 상(商), 金의 소리다. 손에 든 날생선에서 비린내가 난다 — 비릴 성(腥).","box":[79,540,613,526],"src":["CI-10","OGI-OUN-06-04"],"tts":"왼쪽 흰 띠 궤짝이 서방이다. 흰빛이 폐로 통한다. 뚜껑에 큰 코, 개규어비. 흰 판은 다섯과 넷, 더해서 9, 금의 성수. 곁에 선 사람은 봇짐을 진 상인이다, 장사 상, 금의 소리다. 손에 든 날생선에서 비린내가 난다, 비릴 성."},{"n":5,"obj":"검은 띠 궤짝 — 뚜껑의 둥근 구멍 둘 · 점 다섯 판과 점 하나 판 · 깨진 썩은 알에 꽂힌 검은 깃털","fact":"北方 黑 → 腎 — 開竅 二陰(★) · 數 6 · 音 羽 · 臭 腐","hook":"구멍 둘 = 二陰(귀가 아님) · 5 + 1 = 6 · 깃털 = 羽 · 썩은 알 = 腐","say":"위쪽 검은 띠 궤짝이 北方이다. 검은빛이 腎으로 통한다. 뚜껑에는 귀가 아니라 구멍 둘 — 앞뒤 두 陰, 開竅於二陰. 귀는 이 편에서 心이 가져갔다. 흔히 외우는 배속에서는 腎이 귀와 二陰에 함께 열린다. 흰 판은 다섯과 하나, 더해서 6 — 水의 成數. 곁의 검은 깃털이 水의 소리 — 깃 우(羽). 깨진 알이 썩어 냄새가 난다 — 썩을 부(腐).","box":[699,22,656,396],"src":["CI-11","OGI-OUN-06-05","JS-SIN-04","JS-CORE-07-05"],"tts":"위쪽 검은 띠 궤짝이 북방이다. 검은빛이 신으로 통한다. 뚜껑에는 귀가 아니라 구멍 둘, 앞뒤 두 음, 개규어이음. 귀는 이 편에서 심이 가져갔다. 흔히 외우는 배속에서는 신이 귀와 이음에 함께 열린다. 흰 판은 다섯과 하나, 더해서 6, 수의 성수. 곁의 검은 깃털이 수의 소리, 깃 우. 깨진 알이 썩어 냄새가 난다, 썩을 부."},{"n":6,"kind":"review","obj":"금고방 한 바퀴 — 초록 · 붉은 · 누런 · 흰 · 검은 띠 궤짝","fact":"竅 目·耳·口·鼻·二陰 / 數 8·7·5·9·6 / 音 角徵宮商羽 / 臭 臊焦香腥腐","hook":"함정 셋: 心 = 耳 · 腎 = 二陰 · 土 = 5","say":"木火土金水 차례로 다시. 뚜껑 그림은 눈, 귀, 입, 코, 구멍 둘. 흰 판은 8, 7, 5, 9, 6. 물건은 뿔, 징, 궁궐, 상인, 깃털 — 角徵宮商羽. 냄새는 누린내, 탄내, 향내, 비린내, 썩은내. 함정은 셋 — 心이 귀, 腎이 二陰, 土만 5.","box":[[1420,144,598,548],[1312,656,663,483],[764,389,663,483],[79,540,613,526],[699,22,656,396]],"src":[],"tts":"목화토금수 차례로 다시. 뚜껑 그림은 눈, 귀, 입, 코, 구멍 둘. 흰 판은 8, 7, 5, 9, 6. 물건은 뿔, 징, 궁궐, 상인, 깃털, 각치궁상우. 냄새는 누린내, 탄내, 향내, 비린내, 썩은내. 함정은 셋, 심이 귀, 신이 이음, 토만 5."}],"has_image":true},{"id":"yyox-06","title":"宣明五氣의 길 — 五味所入 · 五味所走 · 五精所并 (+ 靈樞 五果·五菜)","place":"다섯 맛 주막 거리","image":"images/lessons/yyox-06.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"천막 색이 다른 다섯 주막 — 초록 · 붉은 · 누런 · 흰 · 검은","fact":"宣明五氣 — 五味가 들어가는 곳(入) · 달려가는 곳(走) · 精氣가 몰리면(并)","hook":"왼쪽부터 木火土金水 = 신맛 · 쓴맛 · 단맛 · 매운맛 · 짠맛 · 손님 = 그 맛이 들어가는 臟","say":"다섯 맛을 파는 주막 거리다. 천막 색이 왼쪽부터 초록, 붉은색, 누런색, 흰색, 검은색 — 木火土金水 차례다. 좌판에는 그 집의 맛과 과일과 채소가 놓였고, 앞에는 그 맛이 찾아가는 장부의 사람이 섰고, 길 위로는 그 맛이 달려가는 곳이 뛰어나간다. 『素問·宣明五氣』의 표들이다.","box":null,"src":[],"tts":"다섯 맛을 파는 주막 거리다. 천막 색이 왼쪽부터 초록, 붉은색, 누런색, 흰색, 검은색, 목화토금수 차례다. 좌판에는 그 집의 맛과 과일과 채소가 놓였고, 앞에는 그 맛이 찾아가는 장부의 사람이 섰고, 길 위로는 그 맛이 달려가는 곳이 뛰어나간다. 소문, 선명오기의 표들이다."},{"n":1,"obj":"좌판 왼쪽의 맛 다섯 — 자른 레몬 · 김 나는 커피 · 꿀단지 · 붉은 고추 · 소금 더미와 소금통","fact":"五味所入 — 酸入肝 · 苦入心 · 甘入脾 · 辛入肺 · 鹹入腎","hook":"레몬 → 장군 · 커피 → 임금 · 꿀 → 농부 · 고추 → 재상 · 소금 → 장사","say":"주막마다 좌판 왼쪽에 그 집의 맛이 놓였다. 초록 천막은 신 레몬 — 손님은 장군 肝, 酸入肝. 붉은 천막은 쓴 커피 — 임금 心, 苦入心. 누런 천막은 단 꿀 — 농부 脾, 甘入脾. 흰 천막은 매운 고추 — 재상 肺, 辛入肺. 검은 천막은 짠 소금 — 장사 腎, 鹹入腎. 五味所入이다.","box":[[69,458,107,110],[487,440,107,125],[896,411,101,157],[1283,455,111,107],[1681,440,117,125]],"src":["BC-5M-04"],"tts":"주막마다 좌판 왼쪽에 그 집의 맛이 놓였다. 초록 천막은 신 레몬, 손님은 장군 간, 산입간. 붉은 천막은 쓴 커피, 임금 심, 고입심. 누런 천막은 단 꿀, 농부 비, 감입비. 흰 천막은 매운 고추, 재상 폐, 신입폐. 검은 천막은 짠 소금, 장사 신, 함입신. 오미소입이다."},{"n":2,"obj":"길 위를 달려 나가는 다섯 — 활 · 뼈 · 고깃덩이 · 바람 구름 · 핏방울","fact":"宣明五氣 五味所走 — 酸走筋 · 苦走骨 · 甘走肉 · 辛走氣 · 鹹走血","hook":"활시위 = 힘줄(筋) · 뼈 = 骨 · 고기 = 肉 · 바람 = 氣 · 핏방울 = 血","say":"맛은 들어간 뒤 달려가는 곳이 따로 있다 — 달릴 주(走). 신맛 집 앞에서는 활이 달린다 — 활시위는 힘줄, 酸走筋. 쓴맛 집 앞에서는 뼈 — 苦走骨. 단맛 집 앞에서는 고깃덩이 — 甘走肉. 매운맛 집 앞에서는 바람 구름 — 辛走氣. 짠맛 집 앞에서는 핏방울 — 鹹走血. 그래서 氣의 병에는 매운 것을, 血의 병에는 짠 것을, 뼈의 병에는 쓴 것을, 살의 병에는 단 것을, 힘줄의 병에는 신 것을 많이 먹지 말라 한다 — 五味所禁.","box":[[331,775,164,236],[682,859,157,102],[994,836,169,130],[1316,836,200,130],[1686,822,121,135]],"src":["CI-15"],"tts":"맛은 들어간 뒤 달려가는 곳이 따로 있다, 달릴 주. 신맛 집 앞에서는 활이 달린다, 활시위는 힘줄, 산주근. 쓴맛 집 앞에서는 뼈, 고주골. 단맛 집 앞에서는 고깃덩이, 감주육. 매운맛 집 앞에서는 바람 구름, 신주기. 짠맛 집 앞에서는 핏방울, 함주혈. 그래서 기의 병에는 매운 것을, 혈의 병에는 짠 것을, 뼈의 병에는 쓴 것을, 살의 병에는 단 것을, 힘줄의 병에는 신 것을 많이 먹지 말라 한다, 오미소금."},{"n":3,"obj":"오른쪽 아래 침 묶음 — 커피잔에 끈으로 묶인 핏방울 · 소금통에 끈으로 묶인 뼈","fact":"九針論 — 苦走血 · 鹹走骨 (宣明五氣와 苦·鹹이 뒤바뀜)","hook":"침 묶음 = 九針論 · 커피 + 핏방울 = 苦走血 · 소금 + 뼈 = 鹹走骨","say":"오른쪽 아래 구석에 침 묶음이 섰다 — 『靈樞·九針論』이다. 여기서는 커피잔이 핏방울에, 소금통이 뼈에 묶였다 — 苦走血, 鹹走骨. 길 위의 宣明五氣와 쓴맛, 짠맛 둘이 뒤바뀐다. 宣明五氣는 쓴맛이 뼈, 짠맛이 피. 九針論은 쓴맛이 피, 짠맛이 뼈. 나머지 셋은 같다.","box":[1657,987,378,147],"src":["BC-5M-05"],"tts":"오른쪽 아래 구석에 침 묶음이 섰다, 영추, 구침론이다. 여기서는 커피잔이 핏방울에, 소금통이 뼈에 묶였다, 고주혈, 함주골. 길 위의 선명오기와 쓴맛, 짠맛 둘이 뒤바뀐다. 선명오기는 쓴맛이 뼈, 짠맛이 피. 구침론은 쓴맛이 피, 짠맛이 뼈. 나머지 셋은 같다."},{"n":4,"obj":"다섯 손님의 얼굴 — 손톱 무는 초록 갑옷 장군 · 웃는 붉은 용포 임금 · 기둥 뒤로 숨는 노란 옷 사람 · 우는 흰 도포 노인 · 벌벌 떠는 검은 옷 대머리","fact":"五精所并 — 肝 憂 · 心 喜 · 脾 畏 · 肺 悲 · 腎 恐 (虛而相并)","hook":"근심 · 웃음 · 겁내 숨음 · 눈물 · 벌벌 떪 = 憂 · 喜 · 畏 · 悲 · 恐","say":"손님들의 얼굴을 본다. 장군은 손톱을 물며 근심한다 — 精氣가 肝에 몰리면 근심 우(憂). 임금은 웃는다 — 心에 몰리면 기쁠 희(喜). 농부는 겁내어 기둥 뒤로 숨는다 — 농부의 脾에 몰리면 두려워할 외(畏). 재상은 운다 — 재상의 肺에 몰리면 슬플 비(悲). 장사는 벌벌 떤다 — 腎에 몰리면 무서울 공(恐). 『素問·宣明五氣』의 五精所并이다. 허한 곳으로 精氣가 몰려서 생긴다 — 虛而相并. 肝이 怒가 아니라 憂, 脾가 思가 아니라 畏인 것이 五志와 다른 자리다.","box":[[137,545,197,337],[581,552,182,323],[1103,555,143,272],[1417,555,150,306],[1763,559,193,308]],"src":["SUP-BYEONG-01","SUP-BYEONG-02","SUP-BYEONG-03","SUP-BYEONG-04","SUP-BYEONG-05","SUP-BYEONG-06"],"tts":"손님들의 얼굴을 본다. 장군은 손톱을 물며 근심한다, 정기가 간에 몰리면 근심 우. 임금은 웃는다, 심에 몰리면 기쁠 희. 농부는 겁내어 기둥 뒤로 숨는다, 농부의 비에 몰리면 두려워할 외. 재상은 운다, 재상의 폐에 몰리면 슬플 비. 장사는 벌벌 떤다, 신에 몰리면 무서울 공. 소문, 선명오기의 오정소병이다. 허한 곳으로 정기가 몰려서 생긴다, 허이상병. 간이 노가 아니라 우, 비가 사가 아니라 외인 것이 오지와 다른 자리다."},{"n":5,"obj":"좌판 가운데 과일 다섯 — 자두 · 살구 · 대추 · 복숭아 · 밤송이","fact":"五果(靈樞) — 李 · 杏 · 棗 · 桃 · 栗 (木火土金水) ★桃 = 金","hook":"자두 · 살구 · 대추 · 복숭아(흰 천막 = 金) · 밤","say":"좌판 가운데는 과일이다. 초록 집 자두 — 오얏 리(李). 붉은 집 살구 — 살구 행(杏). 누런 집 대추 — 대추 조(棗). 흰 집 복숭아 — 복숭아 도(桃). 검은 집 밤 — 밤 률(栗). 『靈樞』의 五果다. 대추가 土, 복숭아가 흰 집 곧 金의 과일이라는 것이 자주 나오는 함정이다.","box":[[179,461,86,98],[595,458,92,101],[994,464,104,101],[1392,461,95,98],[1796,450,117,110]],"src":["OHG-038"],"tts":"좌판 가운데는 과일이다. 초록 집 자두, 오얏 리. 붉은 집 살구, 살구 행. 누런 집 대추, 대추 조. 흰 집 복숭아, 복숭아 도. 검은 집 밤, 밤 률. 영추의 오과다. 대추가 토, 복숭아가 흰 집 곧 금의 과일이라는 것이 자주 나오는 함정이다."},{"n":6,"obj":"좌판 오른쪽 채소 다섯 — 부추 단 · 흰 알뿌리 염교 · 둥근 아욱 잎 · 파 · 콩잎과 콩꼬투리","fact":"五菜(靈樞) — 韭 · 薤 · 葵 · 蔥 · 藿 (木火土金水)","hook":"부추 · 염교 · 아욱 · 파 · 콩잎","say":"좌판 오른쪽은 채소다. 초록 집 부추 — 부추 구(韭). 붉은 집 흰 알뿌리 염교 — 염교 해(薤). 누런 집 둥근 잎 아욱 — 아욱 규(葵). 흰 집 파 — 파 총(蔥). 검은 집 콩잎 — 콩잎 곽(藿). 『靈樞』의 五菜다. 같은 차례로 五脈은 弦·鉤·代·毛·石, 五臟이 갈무리하는 것은 魂·神·意·魄·志다.","box":[[264,461,160,107],[689,455,138,112],[1088,447,131,115],[1485,455,159,104],[1910,441,108,127]],"src":["OHG2-009"],"tts":"좌판 오른쪽은 채소다. 초록 집 부추, 부추 구. 붉은 집 흰 알뿌리 염교, 염교 해. 누런 집 둥근 잎 아욱, 아욱 규. 흰 집 파, 파 총. 검은 집 콩잎, 콩잎 곽. 영추의 오채다. 같은 차례로 오맥은 현, 구, 대, 모, 석, 오장이 갈무리하는 것은 혼, 신, 의, 백, 지다."},{"n":7,"kind":"review","obj":"다섯 주막 한 줄 — 초록 · 붉은 · 누런 · 흰 · 검은 천막","fact":"入 肝心脾肺腎 / 走 筋骨肉氣血(九針論 苦血·鹹骨) / 并 憂喜畏悲恐","hook":"좌판(맛 · 과일 · 채소) → 손님(얼굴) → 길(달리는 것)","say":"왼쪽부터 다시. 신맛 집 — 肝, 힘줄, 근심, 자두, 부추. 쓴맛 집 — 心, 뼈, 기쁨, 살구, 염교. 단맛 집 — 脾, 살, 겁, 대추, 아욱. 매운맛 집 — 肺, 氣, 슬픔, 복숭아, 파. 짠맛 집 — 腎, 피, 무서움, 밤, 콩잎. 침 묶음의 九針論에서만 쓴맛이 피, 짠맛이 뼈.","box":[[36,173,404,843],[447,173,396,793],[853,173,393,796],[1254,173,389,796],[1650,173,389,790]],"src":[],"tts":"왼쪽부터 다시. 신맛 집, 간, 힘줄, 근심, 자두, 부추. 쓴맛 집, 심, 뼈, 기쁨, 살구, 염교. 단맛 집, 비, 살, 겁, 대추, 아욱. 매운맛 집, 폐, 기, 슬픔, 복숭아, 파. 짠맛 집, 신, 피, 무서움, 밤, 콩잎. 침 묶음의 구침론에서만 쓴맛이 피, 짠맛이 뼈."}],"has_image":true},{"id":"yyox-07","title":"나를 가운데 놓는 다섯 자리 — 旺相休囚死 · 五邪(虛·實·賊·微·正)","place":"고을 관아","image":"images/lessons/yyox-07.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"고을 관아 — 가운데 대청의 사또 의자 · 그 뒤 뒷방 · 앞의 낮은 책상 · 왼쪽 옥 · 오른쪽 형장","fact":"나를 가운데 놓는 다섯 자리 — 旺相休囚死와 五邪(虛·實·賊·微·正)","hook":"사또 의자 = 나(旺) · 앞 책상 = 내가 낳은 자식 · 뒷방 = 나를 낳은 어미 · 옥 = 나를 剋함 · 형장 = 내가 剋함","say":"고을 관아다. 가운데 사또 의자에 앉은 이가 나, 지금 철을 맡은 行이다. 앞의 낮은 책상에는 내가 낳은 자식이, 의자 뒤 뒷방에는 나를 낳은 어미가, 왼쪽 옥에는 나를 剋하는 이가, 오른쪽 형장에는 내가 剋하는 이가 있다. 이 다섯 자리에 붙인 이름이 旺相休囚死이고, 다섯 자리에서 나에게 오는 병이 五邪다. 그림은 長夏, 土가 사또인 철이다.","box":null,"src":[],"tts":"고을 관아다. 가운데 사또 의자에 앉은 이가 나, 지금 철을 맡은 행이다. 앞의 낮은 책상에는 내가 낳은 자식이, 의자 뒤 뒷방에는 나를 낳은 어미가, 왼쪽 옥에는 나를 극하는 이가, 오른쪽 형장에는 내가 극하는 이가 있다. 이 다섯 자리에 붙인 이름이 왕상휴수사이고, 다섯 자리에서 나에게 오는 병이 오사다. 그림은 장하, 토가 사또인 철이다."},{"n":1,"obj":"가운데 큰 사또 의자 · 그 앞의 낮은 책상 · 의자 뒤 침상 놓인 뒷방","fact":"旺 = 제철 자신(當令) · 相 = 제철이 낳는 자식 · 休 = 제철을 낳은 어미","hook":"의자 = 旺 · 곁에서 돕는 책상 = 相 · 쉬는 뒷방 = 休","say":"사또 의자가 旺이다 — 제철을 맡아 기운이 왕성하다, 當令. 앞의 낮은 책상이 相 — 도울 상(相), 제철이 낳는 자식이 곁에서 돕는다. 그 行의 눈으로 보면 제철은 나를 낳는 것, 生我者다. 의자 뒤 뒷방이 休 — 쉴 휴(休), 제철을 낳은 어미는 자식에게 令을 넘기고 쉰다. 그 行의 눈으로 보면 제철은 내가 낳은 것, 我生者다.","box":[[891,329,280,366],[829,901,399,197],[810,170,447,222]],"src":["OH-04-01","OH-04-02","OH-04-03"],"tts":"사또 의자가 왕이다, 제철을 맡아 기운이 왕성하다, 당령. 앞의 낮은 책상이 상, 도울 상, 제철이 낳는 자식이 곁에서 돕는다. 그 행의 눈으로 보면 제철은 나를 낳는 것, 생아자다. 의자 뒤 뒷방이 휴, 쉴 휴, 제철을 낳은 어미는 자식에게 영을 넘기고 쉰다. 그 행의 눈으로 보면 제철은 내가 낳은 것, 아생자다."},{"n":2,"obj":"왼쪽 굵은 창살의 옥 · 오른쪽 형장의 나무 기둥","fact":"囚 = 제철을 剋하는 것 · 死 = 제철에게 剋당하는 것","hook":"옥 = 囚(갇힘) · 형장 기둥 = 死","say":"왼쪽 옥이 囚 — 가둘 수(囚). 제철을 剋하는 行은 왕성한 제철에게 덤비지 못하고 갇힌다. 그 行의 눈으로 보면 제철은 내가 剋하는 것, 我克者다. 오른쪽 형장이 死 — 제철에게 剋당하는 行은 기운이 가장 없다. 그 行의 눈으로 보면 제철은 나를 剋하는 것, 克我者다.","box":[[0,476,497,667],[1766,458,197,558]],"src":["OH-04-04","OH-04-05"],"tts":"왼쪽 옥이 수, 가둘 수. 제철을 극하는 행은 왕성한 제철에게 덤비지 못하고 갇힌다. 그 행의 눈으로 보면 제철은 내가 극하는 것, 아극자다. 오른쪽 형장이 사, 제철에게 극당하는 행은 기운이 가장 없다. 그 행의 눈으로 보면 제철은 나를 극하는 것, 극아자다."},{"n":3,"obj":"사또 의자에 앉은 노란 옷 사람(농부) · 뒷방 침상에서 낮잠 자는 붉은 용포의 임금","fact":"長夏 — 土旺 · 金相 · 火休 · 木囚 · 水死 (長夏의 心 = 休)","hook":"농부(土)가 사또 = 長夏 · 임금(火)은 뒷방에서 쉼 = 火休","say":"그림의 철은 長夏다. 노란 옷 농부, 土가 사또 의자에 앉았다 — 土旺. 앞 책상의 흰 도포 노인은 土가 낳은 金 — 金相. 뒷방에서 낮잠 자는 붉은 용포 임금은 土를 낳은 火 — 火休. 옥의 초록 갑옷 장군은 土를 剋하는 木 — 木囚. 형장의 검은 옷 장사는 土에게 剋당하는 水 — 水死. 그래서 長夏의 心은 休다 — 火가 土를 낳고 令을 다 넘겨 쉰다.","box":[[922,334,216,355],[862,173,395,182]],"src":["OHG-050"],"tts":"그림의 철은 장하다. 노란 옷 농부, 토가 사또 의자에 앉았다, 토왕. 앞 책상의 흰 도포 노인은 토가 낳은 금, 금상. 뒷방에서 낮잠 자는 붉은 용포 임금은 토를 낳은 화, 화휴. 옥의 초록 갑옷 장군은 토를 극하는 목, 목수. 형장의 검은 옷 장사는 토에게 극당하는 수, 수사. 그래서 장하의 심은 휴다, 화가 토를 낳고 영을 다 넘겨 쉰다."},{"n":4,"obj":"뒷방 침상의 임금 쪽에서 사또 의자 뒤로 날아가는 베개","fact":"虛邪 — 從後來者(生我·어미에게서 옴) · 쉽게 물러난다","hook":"뒤(後)에서 온 푹신한 베개 = 虛邪","say":"이제 다섯 자리에서 사또에게 병이 온다. 뒷방의 임금 쪽에서 베개 하나가 등 뒤로 날아온다 — 뒤에서 오는 것, 從後來者, 虛邪다. 나를 낳은 어미 쪽에서 온 병 — 母病及子. 낳아 주는 기운을 끼고 와서 푹신한 베개처럼 쉽게 물러난다.","box":[1059,257,313,274],"src":["OH-05-01","OH-06-02"],"tts":"이제 다섯 자리에서 사또에게 병이 온다. 뒷방의 임금 쪽에서 베개 하나가 등 뒤로 날아온다, 뒤에서 오는 것, 종후래자, 허사다. 나를 낳은 어미 쪽에서 온 병, 모병급자. 낳아 주는 기운을 끼고 와서 푹신한 베개처럼 쉽게 물러난다."},{"n":5,"obj":"앞의 낮은 책상 곁에서 사또 쪽으로 검은 쇠공을 던지는 흰 도포 노인","fact":"實邪 — 從前來者(我生·자식에게서 옴) · 세력이 왕성","hook":"앞(前)에서 온 묵직한 쇠공 = 實邪","say":"앞 책상 곁의 흰 도포 노인이 검은 쇠공을 던진다 — 앞에서 오는 것, 從前來者, 實邪다. 내가 낳은 자식 쪽에서 온 병 — 자식이 어미의 기운을 훔친다, 子盜母氣. 쇠공처럼 묵직해 세력이 왕성하다.","box":[634,685,490,442],"src":["OH-05-02","OH-06-03"],"tts":"앞 책상 곁의 흰 도포 노인이 검은 쇠공을 던진다, 앞에서 오는 것, 종전래자, 실사다. 내가 낳은 자식 쪽에서 온 병, 자식이 어미의 기운을 훔친다, 자도모기. 쇠공처럼 묵직해 세력이 왕성하다."},{"n":6,"obj":"옥 창살 사이로 긴 창을 내지르는 초록 갑옷 장군","fact":"賊邪 — 從所不勝來者(克我) · 가장 위험 · 相乘에 해당","hook":"나를 이기는 쪽에서 온 창 = 賊邪(도둑 賊)","say":"옥의 장군이 창살 사이로 긴 창을 내지른다 — 내가 이기지 못하는 쪽에서 오는 것, 從所不勝來者, 賊邪다. 도둑 적(賊). 나를 剋하는 行이 덮치니 다섯 가운데 가장 위험하다 — 相乘이 이것이다. 木과 金으로 말하면, 金이 木을 剋하니 木에게 金은 所不勝이고 金에게 木은 所勝이다. 거꾸로 말하면 틀린다.","box":[58,540,649,497],"src":["OH-05-03","OH-06-04","OHG-026","OHG2-005"],"tts":"옥의 장군이 창살 사이로 긴 창을 내지른다, 내가 이기지 못하는 쪽에서 오는 것, 종소불승래자, 적사다. 도둑 적. 나를 극하는 행이 덮치니 다섯 가운데 가장 위험하다, 상승이 이것이다. 목과 금으로 말하면, 금이 목을 극하니 목에게 금은 소불승이고 금에게 목은 소승이다. 거꾸로 말하면 틀린다."},{"n":7,"obj":"형장 기둥에 묶인 채 작은 돌멩이를 튕기는 검은 옷 대머리 사람","fact":"微邪 — 從所勝來者(我克) · 가장 가볍다","hook":"내가 이기는 쪽에서 온 돌멩이 = 微邪(작을 微)","say":"형장 기둥에 묶인 장사가 작은 돌멩이를 튕긴다 — 내가 이기는 쪽에서 오는 것, 從所勝來者, 微邪다. 작을 미(微). 내가 剋하는 行이 거꾸로 건드리는 것이라 다섯 가운데 가장 가볍고, 눌러 다스릴 수 있다.","box":[1585,577,378,440],"src":["OH-05-04","OH-06-01"],"tts":"형장 기둥에 묶인 장사가 작은 돌멩이를 튕긴다, 내가 이기는 쪽에서 오는 것, 종소승래자, 미사다. 작을 미. 내가 극하는 행이 거꾸로 건드리는 것이라 다섯 가운데 가장 가볍고, 눌러 다스릴 수 있다."},{"n":8,"obj":"제 배를 두 손으로 움켜쥔 사또 의자의 노란 옷 사람","fact":"正邪 — 自病(제 장부가 스스로 앓음)","hook":"남이 던진 것 없이 제 배앓이 = 自病 = 正邪","say":"사또는 제 배를 움켜쥐고 있다 — 남에게서 온 것이 아니라 제 장부가 스스로 앓는다. 自病, 正邪다.","box":[922,334,216,355],"src":["OH-05-05"],"tts":"사또는 제 배를 움켜쥐고 있다, 남에게서 온 것이 아니라 제 장부가 스스로 앓는다. 자병, 정사다."},{"n":9,"kind":"review","obj":"관아 한 바퀴 — 뒷방 베개 · 앞 책상 쇠공 · 옥의 창 · 형장 돌멩이 · 사또의 배앓이","fact":"虛邪 後(母) · 實邪 前(子) · 賊邪 所不勝 · 微邪 所勝 · 正邪 自病 / 微\u003c虛\u003c實\u003c賊","hook":"베개 · 쇠공 · 창 · 돌멩이 · 배앓이 / 의자 旺 · 책상 相 · 뒷방 休 · 옥 囚 · 형장 死","say":"다시 본다. 뒷방 베개 — 뒤에서, 어미에게서 온 虛邪. 앞 책상 쇠공 — 앞에서, 자식에게서 온 實邪. 옥의 창 — 所不勝에서 온 賊邪. 형장 돌멩이 — 所勝에서 온 微邪. 사또의 배앓이 — 自病, 正邪. 『難經』 五十難이다. 가벼운 순서로 돌멩이, 베개, 쇠공, 창 — 微邪, 虛邪, 實邪, 賊邪. 자리 이름은 의자 旺, 책상 相, 뒷방 休, 옥 囚, 형장 死.","box":[[1059,257,313,274],[634,685,490,442],[58,540,649,497],[1585,577,378,440],[922,334,216,355]],"src":["OHG-025","OHG-027"],"tts":"다시 본다. 뒷방 베개, 뒤에서, 어미에게서 온 허사. 앞 책상 쇠공, 앞에서, 자식에게서 온 실사. 옥의 창, 소불승에서 온 적사. 형장 돌멩이, 소승에서 온 미사. 사또의 배앓이, 자병, 정사. 난경 오십난이다. 가벼운 순서로 돌멩이, 베개, 쇠공, 창, 미사, 허사, 실사, 적사. 자리 이름은 의자 왕, 책상 상, 뒷방 휴, 옥 수, 형장 사."}],"has_image":true},{"id":"yyox-08","title":"相生相剋의 균형과 깨짐 — 制化·亢害承制·勝復 ↔ 母子相及·相乘·相侮","place":"씨름판 셋과 긴 의자","image":"images/lessons/yyox-08.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"씨름판 셋과 긴 의자 — 판마다 초록 갑옷 장군 · 노란 옷 농부 · 흰 도포 노인","fact":"相生·相剋의 균형과 깨짐 — 制化·勝復 ↔ 母子相及·相乘·相侮","hook":"장군 = 木 · 농부 = 土 · 흰 도포 노인 = 金 · 검은 옷 대머리 = 水 / 왼쪽 판 고름 · 가운데 판 太過 · 오른쪽 판 不及","say":"씨름판 셋과 긴 의자다. 판마다 같은 세 사람이 나온다 — 초록 갑옷 장군은 木, 노란 옷 농부는 土, 흰 도포 노인은 金이다. 木은 土를 剋하고, 金은 木을 剋한다. 왼쪽 판은 눌러 주는 이가 있어 고른 판, 가운데 판은 장군이 너무 커진 판, 오른쪽 판은 장군이 너무 작아진 판이다. 긴 의자에는 어미와 자식이 앉았다.","box":null,"src":[],"tts":"씨름판 셋과 긴 의자다. 판마다 같은 세 사람이 나온다, 초록 갑옷 장군은 목, 노란 옷 농부는 토, 흰 도포 노인은 금이다. 목은 토를 극하고, 금은 목을 극한다. 왼쪽 판은 눌러 주는 이가 있어 고른 판, 가운데 판은 장군이 너무 커진 판, 오른쪽 판은 장군이 너무 작아진 판이다. 긴 의자에는 어미와 자식이 앉았다."},{"n":1,"obj":"왼쪽 판 — 넘어진 농부 앞에서 두 팔을 치켜들고 으스대는 장군","fact":"亢則害 承乃制 制則生化 — 지나치면 해롭고, 뒤이은 기운이 눌러야 生化(制化)","hook":"으스대며 치솟음 = 亢 · 뒤에서 샅바를 잡음 = 承乃制","say":"왼쪽 판. 장군이 농부를 넘어뜨리고 두 팔을 치켜들며 으스댄다 — 木이 지나치게 뻗쳤다, 높을 항(亢). 지나치면 해가 된다, 亢則害. 그러나 뒤에서 흰 도포 노인이 샅바를 잡아당긴다 — 뒤이어 받치는 기운이 누른다, 承乃制. 눌러 주어야 낳고 기르는 일이 이어진다, 制則生化. 낳음과 누름이 함께 있어 평형을 지키는 것이 制化다. 『素問·六微旨大論』. 몸의 평형을 말하는 陰平陽秘와 구별한다.","box":[202,483,468,486],"src":["OH-07","OHG2-014","SU2-OH-02"],"tts":"왼쪽 판. 장군이 농부를 넘어뜨리고 두 팔을 치켜들며 으스댄다, 목이 지나치게 뻗쳤다, 높을 항. 지나치면 해가 된다, 항즉해. 그러나 뒤에서 흰 도포 노인이 샅바를 잡아당긴다, 뒤이어 받치는 기운이 누른다, 승내제. 눌러 주어야 낳고 기르는 일이 이어진다, 제즉생화. 낳음과 누름이 함께 있어 평형을 지키는 것이 제화다. 소문, 육미지대론. 몸의 평형을 말하는 음평양비와 구별한다."},{"n":2,"obj":"왼쪽 판 — 뒤에서 장군의 샅바를 두 손으로 잡아당기는 흰 도포 노인","fact":"勝復 — 勝氣 뒤에 復氣 · 子復母仇: 木이 土를 치면 土의 자식 金이 木을 누른다","hook":"먼저 이김(勝) → 뒤에서 되갚음(復) · 노인(金)은 농부(土)의 자식","say":"샅바를 당기는 흰 도포 노인을 다시 본다. 먼저 장군이 이겼고, 뒤이어 노인이 되갚는다 — 이길 승(勝), 돌아올 복(復), 勝復이다. 노인 金은 넘어진 농부 土가 낳은 자식이다. 木이 土를 치니 土의 자식 金이 木을 눌러 어미의 원수를 갚는다 — 子復母仇. 한 行이 지나치면 반드시 되갚음이 따라와 다시 고르게 된다. 運氣에서는 먼저 勝氣, 나중에 復氣라 한다.","box":[584,458,226,409],"src":["OHG-031","OH-10"],"tts":"샅바를 당기는 흰 도포 노인을 다시 본다. 먼저 장군이 이겼고, 뒤이어 노인이 되갚는다, 이길 승, 돌아올 복, 승복이다. 노인 금은 넘어진 농부 토가 낳은 자식이다. 목이 토를 치니 토의 자식 금이 목을 눌러 어미의 원수를 갚는다, 자복모구. 한 행이 지나치면 반드시 되갚음이 따라와 다시 고르게 된다. 운기에서는 먼저 승기, 나중에 복기라 한다."},{"n":3,"obj":"긴 의자 — 재채기 구름을 곁의 꼬마 장군에게 뿜는 검은 옷 대머리 사람","fact":"母病及子 — 어미의 병이 자식에게 미친다(예: 腎水 → 肝木)","hook":"검은 옷(水)은 꼬마 장군(木)의 어미 · 재채기가 옮음 = 母病及子","say":"맨 왼쪽 긴 의자. 검은 옷 대머리 사람이 재채기를 하고, 구름이 곁의 꼬마 장군에게 날아간다. 검은 옷은 水, 꼬마 장군은 水가 낳은 木이다. 어미의 병이 자식에게 미친다 — 母病及子. 腎의 병이 肝으로 옮는 꼴이다.","box":[123,163,476,424],"src":["OHG-028"],"tts":"맨 왼쪽 긴 의자. 검은 옷 대머리 사람이 재채기를 하고, 구름이 곁의 꼬마 장군에게 날아간다. 검은 옷은 수, 꼬마 장군은 수가 낳은 목이다. 어미의 병이 자식에게 미친다, 모병급자. 신의 병이 간으로 옮는 꼴이다."},{"n":4,"obj":"긴 의자 — 큰 물병에 빨대를 꽂아 빨아 마시는 꼬마 장군","fact":"子病及母 · 子盜母氣 — 자식이 어미의 기운을 축낸다(肝陽上亢 = 水不涵木)","hook":"자식(木)이 어미(水)의 물을 다 빨아 마심 = 子盜母氣","say":"꼬마 장군은 어미 곁에서 큰 물병에 빨대를 꽂아 물을 다 빨아 마신다. 자식이 어미의 기운을 훔친다 — 子盜母氣. 자식의 병이 어미에게 미치는 子病及母다. 肝陽上亢이 이 꼴이다 — 腎의 물이 말라 나무를 적시지 못한다, 水不涵木.","box":[378,223,216,277],"src":[],"tts":"꼬마 장군은 어미 곁에서 큰 물병에 빨대를 꽂아 물을 다 빨아 마신다. 자식이 어미의 기운을 훔친다, 자도모기. 자식의 병이 어미에게 미치는 자병급모다. 간양상항이 이 꼴이다, 신의 물이 말라 나무를 적시지 못한다, 수불함목."},{"n":5,"obj":"가운데 판 — 납작 엎드린 농부를 깔고 누르는 거인 장군","fact":"相乘 — 剋하는 방향으로 지나치게 누름: 木乘土(木旺乘土 · 土虛木乘)","hook":"올라탐(乘) = 相乘 · 본디 이기는 상대를 한도 넘게 누름","say":"가운데 판. 거인이 된 장군이 농부를 깔고 앉았다 — 탈 승(乘), 相乘이다. 木이 土를 剋하는 것은 본디 방향인데 한도를 넘었다. 내 기운이 남아돌아 이기는 상대를 올라탄다 — 其氣有餘則乘其所勝. 두 꼴이 있다. 木이 너무 세서 타는 木旺乘土, 土가 약해서 타는 土虛木乘. 肝의 병을 보면 脾로 옮을 것을 안다는 말이 相乘의 예이고, 五邪로는 賊邪다.","box":[862,432,435,285],"src":["OH-08","OHG2-002","OHG2-003","OHG-029","OHG-026"],"tts":"가운데 판. 거인이 된 장군이 농부를 깔고 앉았다, 탈 승, 상승이다. 목이 토를 극하는 것은 본디 방향인데 한도를 넘었다. 내 기운이 남아돌아 이기는 상대를 올라탄다, 기기유여즉승기소승. 두 꼴이 있다. 목이 너무 세서 타는 목왕승토, 토가 약해서 타는 토허목승. 간의 병을 보면 비로 옮을 것을 안다는 말이 상승의 예이고, 오사로는 적사다."},{"n":6,"obj":"가운데 판 — 거인 장군의 손에 수염을 잡아당겨져 찡그리는 흰 도포 노인","fact":"相侮 — 剋을 거슬러 업신여김: 木侮金(木火刑金 = 肝火犯肺)","hook":"수염을 잡아당김 = 업신여김(侮) · 본디 나를 누르던 쪽에게 거꾸로","say":"거인 장군의 손은 흰 도포 노인의 수염을 잡아당긴다 — 업신여길 모(侮), 相侮다. 金은 본디 木을 剋하는 쪽인데 거꾸로 당한다 — 反克. 木火刑金, 肝火가 肺를 범하는 것이 이 꼴이다. 내 기운이 남아돌면 나를 이기던 쪽을 업신여기고, 그쪽 기운이 모자라도 얕보고 업신여긴다. 자식이 어미를 乘한다, 侮한다는 식의 말은 相侮가 아니다.","box":[1225,311,233,372],"src":["OH-09","OHG-030","OHG2-004"],"tts":"거인 장군의 손은 흰 도포 노인의 수염을 잡아당긴다, 업신여길 모, 상모다. 금은 본디 목을 극하는 쪽인데 거꾸로 당한다, 반극. 목화형금, 간화가 폐를 범하는 것이 이 꼴이다. 내 기운이 남아돌면 나를 이기던 쪽을 업신여기고, 그쪽 기운이 모자라도 얕보고 업신여긴다. 자식이 어미를 승한다, 모한다는 식의 말은 상모가 아니다."},{"n":7,"obj":"가운데 판 — 남들의 두 배로 커진 거인 장군의 몸집","fact":"太過 — 氣有餘則制己所勝而侮所不勝: 木 太過 → 木乘土 + 木侮金","hook":"너무 큼 = 太過 → 깔고 앉기(乘)와 수염 당기기(侮)가 한꺼번에","say":"거인 장군의 큰 몸집이 太過다. 기운이 남아돌면 내가 이기는 쪽은 짓누르고, 나를 이기는 쪽은 업신여긴다 — 氣有餘則制己所勝而侮所不勝. 그래서 木이 太過하면 木乘土와 木侮金이 함께 나타난다. 『素問·五運行大論』.","box":[901,206,414,474],"src":["OHG2-001"],"tts":"거인 장군의 큰 몸집이 태과다. 기운이 남아돌면 내가 이기는 쪽은 짓누르고, 나를 이기는 쪽은 업신여긴다, 기유여즉제기소승이모소불승. 그래서 목이 태과하면 목승토와 목모금이 함께 나타난다. 소문, 오운행대론."},{"n":8,"obj":"오른쪽 판 — 엎드린 작은 장군을 위에서 깔아 누르는 흰 도포 노인 · 발길질하며 혀를 내미는 농부","fact":"不及 — 己所不勝侮而乘之 · 己所勝輕而侮之: 木 不及 → 金乘木 + 土侮木","hook":"너무 작음 = 不及 → 노인(金)에게 깔리고(乘) 농부(土)에게 놀림받음(侮)","say":"오른쪽 판은 거꾸로다. 장군이 작고 말랐다 — 不及. 흰 도포 노인이 위에서 깔아 누른다 — 나를 이기는 쪽이 업신여기며 올라탄다, 己所不勝侮而乘之, 金乘木. 농부는 발길질하며 혀를 내민다 — 내가 이기던 쪽이 얕보고 업신여긴다, 己所勝輕而侮之, 土侮木. 木이 不及하면 金乘木과 土侮木이 함께 나타난다.","box":[1459,494,542,424],"src":[],"tts":"오른쪽 판은 거꾸로다. 장군이 작고 말랐다, 불급. 흰 도포 노인이 위에서 깔아 누른다, 나를 이기는 쪽이 업신여기며 올라탄다, 기소불승모이승지, 금승목. 농부는 발길질하며 혀를 내민다, 내가 이기던 쪽이 얕보고 업신여긴다, 기소승경이모지, 토모목. 목이 불급하면 금승목과 토모목이 함께 나타난다."},{"n":9,"kind":"review","obj":"긴 의자 · 왼쪽 판 · 가운데 판 · 오른쪽 판","fact":"고름: 亢害承制·勝復 / 깨짐: 母病及子·子盜母氣 · 相乘(순방향) · 相侮(역방향)","hook":"샅바 당김 · 재채기 · 빨대 · 깔고 앉기 · 수염 당기기 · 거인 · 꼬마","say":"다시 본다. 왼쪽 판 — 으스대는 장군의 샅바를 노인이 당긴다. 亢害承制, 勝復, 子復母仇. 긴 의자 — 재채기는 母病及子, 빨대는 子盜母氣. 가운데 판 — 거인 장군이 깔고 앉으면 相乘, 수염을 당기면 相侮, 太過면 둘이 함께. 오른쪽 판 — 작은 장군은 깔리고 놀림받는다. 不及이면 金乘木과 土侮木.","box":[[58,161,540,427],[40,458,803,587],[807,206,666,589],[1352,494,666,543]],"src":[],"tts":"다시 본다. 왼쪽 판, 으스대는 장군의 샅바를 노인이 당긴다. 항해승제, 승복, 자복모구. 긴 의자, 재채기는 모병급자, 빨대는 자도모기. 가운데 판, 거인 장군이 깔고 앉으면 상승, 수염을 당기면 상모, 태과면 둘이 함께. 오른쪽 판, 작은 장군은 깔리고 놀림받는다. 불급이면 금승목과 토모목."}],"has_image":true},{"id":"yyox-09","title":"五行으로 읽는 병의 신호 — 主色·客色 · 色 겸화 · 五脈 · 五變動","place":"주인과 손님이 마주 앉은 사랑방","image":"images/lessons/yyox-09.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"주인과 손님이 마주 앉은 사랑방","fact":"五行으로 읽는 병의 신호 — 主色·客色 · 色 겸화 · 色脈 · 五脈 · 五變動","hook":"주인 = 主色(장부의 색) · 손님 = 客色(때의 색) · 등 = 색의 겸화 · 선반 = 脈 · 병풍 = 變動","say":"사랑방에 주인과 손님이 마주 앉았다. 주인은 장부의 색, 손님은 철 따라 오는 색이다. 천장의 등은 두 색이 함께 보일 때를, 오른쪽 선반은 다섯 脈을, 뒤의 병풍은 병이 드러나는 다섯 움직임을 보여 준다. 五行으로 병의 신호를 읽는 법이다.","box":null,"src":[],"tts":"사랑방에 주인과 손님이 마주 앉았다. 주인은 장부의 색, 손님은 철 따라 오는 색이다. 천장의 등은 두 색이 함께 보일 때를, 오른쪽 선반은 다섯 맥을, 뒤의 병풍은 병이 드러나는 다섯 움직임을 보여 준다. 오행으로 병의 신호를 읽는 법이다."},{"n":1,"obj":"초록 얼굴의 주인 · 붉은 옷에 붉은 부채를 든 손님","fact":"主色 = 장부의 본색(주인) · 客色 = 때에 응하는 색(손님)","hook":"주인의 얼굴색 = 主色 · 손님의 옷 색 = 客色(붉음 = 여름)","say":"주인의 얼굴은 초록빛이다 — 제 장부의 본디 색, 主色. 肝은 靑, 心은 赤, 脾는 黃, 肺는 白, 腎은 黑. 손님은 붉은 옷에 붉은 부채를 들었다 — 철을 따라 찾아오는 색, 客色. 봄은 靑, 여름은 赤, 長夏는 黃, 가을은 白, 겨울은 黑. 붉은 손님이니 지금은 여름이다.","box":[[1071,595,388,424],[360,497,536,551]],"src":[],"tts":"주인의 얼굴은 초록빛이다, 제 장부의 본디 색, 주색. 간은 청, 심은 적, 비는 황, 폐는 백, 신은 흑. 손님은 붉은 옷에 붉은 부채를 들었다, 철을 따라 찾아오는 색, 객색. 봄은 청, 여름은 적, 장하는 황, 가을은 백, 겨울은 흑. 붉은 손님이니 지금은 여름이다."},{"n":2,"obj":"두툼한 윗자리에 앉은 손님 · 낮은 바닥에서 손님에게 절하는 주인","fact":"客色이 主色을 이기면 順 · 主色이 客色을 이기면 逆","hook":"손님이 윗자리 = 客勝主 = 順 · 주인이 윗자리를 차지하면 逆","say":"손님은 두툼한 윗자리에 앉았고, 주인은 낮은 바닥에서 절한다. 손님이 주인을 이긴 꼴이다 — 때의 색이 장부의 색을 이기면 철을 따르는 것이라 병이 순하다, 順. 거꾸로 주인이 윗자리를 차지하면 — 장부의 색이 때의 색을 이기면 逆이다. 여름이면 색도 脈도 여름 것이 나와야 한다.","box":[[360,497,536,551],[1071,595,388,424]],"src":["OH-15"],"tts":"손님은 두툼한 윗자리에 앉았고, 주인은 낮은 바닥에서 절한다. 손님이 주인을 이긴 꼴이다, 때의 색이 장부의 색을 이기면 철을 따르는 것이라 병이 순하다, 순. 거꾸로 주인이 윗자리를 차지하면, 장부의 색이 때의 색을 이기면 역이다. 여름이면 색도 맥도 여름 것이 나와야 한다."},{"n":3,"obj":"천장의 등 둘 — 초록 띠가 든 빨간 등은 환히 켜짐 · 초록 띠가 든 노란 등은 찢어져 꺼짐","fact":"靑赤 겸화 = 相生(木生火) → 順 · 靑黃 겸화 = 相剋(木·土) → 逆","hook":"초록 + 빨강 = 낳는 사이라 환함(順) · 초록 + 노랑 = 누르는 사이라 찢어짐(逆)","say":"천장의 등 둘을 본다. 초록과 빨강이 함께 든 등은 환하게 켜졌다 — 靑과 赤이 함께 보이면 木이 火를 낳는 相生이라 병이 순하다, 順. 초록과 노랑이 함께 든 등은 찢어져 꺼졌다 — 靑과 黃이 함께 보이면 木과 土의 相剋이라 逆이다.","box":[[336,62,229,236],[595,62,215,229]],"src":["OH-16"],"tts":"천장의 등 둘을 본다. 초록과 빨강이 함께 든 등은 환하게 켜졌다, 청과 적이 함께 보이면 목이 화를 낳는 상생이라 병이 순하다, 순. 초록과 노랑이 함께 든 등은 찢어져 꺼졌다, 청과 황이 함께 보이면 목과 토의 상극이라 역이다."},{"n":4,"obj":"오른쪽 벽의 초록 탈 · 끈으로 이어진 선반 첫 칸의 거문고","fact":"色脈相得 — 색과 脈의 五行이 서로 맞음(靑色 + 弦脈)","hook":"초록 탈(靑) + 거문고 줄(弦)을 끈으로 이음 = 색과 脈이 짝","say":"오른쪽 벽에 초록 탈이 걸렸고, 끈이 아래 선반의 거문고로 이어졌다. 초록은 木의 색, 거문고 줄은 木의 脈인 弦이다. 색과 脈이 같은 五行으로 맞았다 — 色脈相得. 색을 보았으면 脈도 그 짝이 나오는지 본다.","box":[1575,307,99,565],"src":[],"tts":"오른쪽 벽에 초록 탈이 걸렸고, 끈이 아래 선반의 거문고로 이어졌다. 초록은 목의 색, 거문고 줄은 목의 맥인 현이다. 색과 맥이 같은 오행으로 맞았다, 색맥상득. 색을 보았으면 맥도 그 짝이 나오는지 본다."},{"n":5,"obj":"선반 네 칸에 왼쪽부터 다섯 — 거문고 · 쇠갈고리 · 병에 꽂은 대나무와 그 곁의 흰 털 뭉치(한 칸) · 돌","fact":"五脈 — 肝 弦 · 心 鉤 · 脾 代 · 肺 毛 · 腎 石 (四時脈 春弦·夏鉤·秋毛·冬石)","hook":"거문고 줄 = 弦 · 갈고리 = 鉤 · 대나무(대) = 代 · 털 = 毛 · 돌 = 石","say":"선반을 왼쪽부터 본다. 거문고 — 줄 현(弦), 肝의 脈이고 봄의 脈. 쇠갈고리 — 갈고리 구(鉤), 心의 脈이고 여름의 脈. 병에 꽂은 대나무 — 대신할 대(代), 脾의 脈. 그 곁의 흰 털 뭉치 — 털 모(毛), 肺의 脈이고 가을의 脈, 浮라고도 한다. 돌 — 돌 석(石), 腎의 脈이고 겨울의 脈, 營이라고도 한다. 『玉機眞藏論』의 四時脈에서 脾는 철이 따로 없는 孤藏이라 사방을 적신다 — 以灌四傍. 같은 차례로 五精은 魂神意魄志, 五菜는 韭薤葵蔥藿이다.","box":[1561,689,487,373],"src":["OHG-036","OHG2-009","CI-13-01","CI-13-02","CI-13-03","CI-13-04","CI-13-05"],"tts":"선반을 왼쪽부터 본다. 거문고, 줄 현, 간의 맥이고 봄의 맥. 쇠갈고리, 갈고리 구, 심의 맥이고 여름의 맥. 병에 꽂은 대나무, 대신할 대, 비의 맥. 그 곁의 흰 털 뭉치, 털 모, 폐의 맥이고 가을의 맥, 부라고도 한다. 돌, 돌 석, 신의 맥이고 겨울의 맥, 영이라고도 한다. 옥기진장론의 사시맥에서 비는 철이 따로 없는 고장이라 사방을 적신다, 이관사방. 같은 차례로 오정은 혼신의백지, 오채는 구해규총곽이다."},{"n":6,"obj":"병풍 그림 다섯 — 두 주먹을 쥔 사람 · 이마를 짚고 근심하는 사람 · 가슴에 손 얹고 입에서 방울이 튀는(딸꾹질) 사람 · 주먹에 대고 기침하는 사람 · 몸을 감싸고 떠는 사람","fact":"五變動 — 肝 握 · 心 憂 · 脾 噦 · 肺 咳 · 腎 慄","hook":"주먹 쥠 · 근심 · 딸꾹질 · 기침 · 떨림","say":"뒤의 병풍 그림 다섯을 왼쪽부터 본다. 두 주먹을 꽉 쥔 사람 — 쥘 악(握), 肝. 이마를 짚고 근심하는 사람 — 근심 우(憂), 心. 가슴에 손을 얹고 딸꾹질하는 사람 — 딸꾹질 얼(噦), 脾. 기침하는 사람 — 기침 해(咳), 肺. 몸을 감싸고 떠는 사람 — 떨 률(慄), 腎. 병이 변해 드러나는 다섯 움직임, 五變動이다. 脾의 딸꾹질이 자주 나온다.","box":[516,321,1022,517],"src":["OHG-037"],"tts":"뒤의 병풍 그림 다섯을 왼쪽부터 본다. 두 주먹을 꽉 쥔 사람, 쥘 악, 간. 이마를 짚고 근심하는 사람, 근심 우, 심. 가슴에 손을 얹고 딸꾹질하는 사람, 딸꾹질 얼, 비. 기침하는 사람, 기침 해, 폐. 몸을 감싸고 떠는 사람, 떨 률, 신. 병이 변해 드러나는 다섯 움직임, 오변동이다. 비의 딸꾹질이 자주 나온다."},{"n":7,"kind":"review","obj":"사랑방 한 바퀴 — 주인과 손님 · 등 둘 · 탈과 선반 · 병풍","fact":"客勝主 順·主勝客 逆 / 靑赤 順·靑黃 逆 / 弦鉤代毛石 / 握憂噦咳慄","hook":"윗자리 손님 · 켜진 등과 찢어진 등 · 선반 다섯 · 병풍 다섯","say":"다시 본다. 윗자리의 붉은 손님과 절하는 초록 주인 — 客色이 主色을 이기면 順. 초록 빨강 등은 相生이라 順, 초록 노랑 등은 相剋이라 逆. 초록 탈과 거문고 — 色脈相得. 선반은 거문고, 갈고리, 대나무, 털, 돌 — 弦鉤代毛石. 병풍은 주먹, 근심, 딸꾹질, 기침, 떨림.","box":[[360,497,536,551],[1071,595,388,424],[336,62,229,236],[595,62,215,229],[1561,689,487,373],[516,321,1022,517]],"src":[],"tts":"다시 본다. 윗자리의 붉은 손님과 절하는 초록 주인, 객색이 주색을 이기면 순. 초록 빨강 등은 상생이라 순, 초록 노랑 등은 상극이라 역. 초록 탈과 거문고, 색맥상득. 선반은 거문고, 갈고리, 대나무, 털, 돌, 현구대모석. 병풍은 주먹, 근심, 딸꾹질, 기침, 떨림."}],"has_image":true},{"id":"yyox-10","title":"五行 치법 — 전변 예방 · 虛則補其母 實則瀉其子 · 여덟 치법","place":"짚길로 나뉜 텃밭","image":"images/lessons/yyox-10.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"짚길로 나뉜 텃밭 — 윗줄 세 밭 · 가운뎃줄 네 밭 · 아랫줄 네 밭","fact":"五行 치법 — 원칙 셋 · 相生 치법 넷 · 相剋 치법 넷","hook":"윗줄 = 원칙 · 가운뎃줄 = 相生으로 돕기 · 아랫줄 = 相剋으로 누르기 / 나무 = 肝 · 흙 = 脾 · 쇠 = 肺 · 물 = 腎","say":"텃밭이 세 줄이다. 윗줄 세 밭은 치료의 원칙, 가운뎃줄 네 밭은 相生을 써서 돕는 치법, 아랫줄 네 밭은 相剋을 써서 누르는 치법이다. 밭일 동작이 곧 치법 이름이다. 나무는 肝, 흙은 脾, 쇠는 肺, 물은 腎이다.","box":null,"src":[],"tts":"텃밭이 세 줄이다. 윗줄 세 밭은 치료의 원칙, 가운뎃줄 네 밭은 상생을 써서 돕는 치법, 아랫줄 네 밭은 상극을 써서 누르는 치법이다. 밭일 동작이 곧 치법 이름이다. 나무는 간, 흙은 비, 쇠는 폐, 물은 신이다."},{"n":1,"obj":"잎이 누렇게 병든 나무를 가리키는 일꾼 · 나무 둘레에 돌로 테를 둘러 놓은 흙","fact":"見肝之病 知肝傳脾 當先實脾 — 옮겨 갈 곳을 미리 채운다","hook":"병든 나무(肝) → 흙(脾)으로 번질 것을 알고 흙부터 돌로 둘러 지킴 = 實脾","say":"윗줄 왼쪽. 일꾼이 잎이 누렇게 병든 나무를 가리킨다 — 肝의 병이다. 그런데 나무 둘레의 흙은 벌써 돌로 테를 둘러 단단히 지켜 놓았다. 肝의 병을 보면 脾로 옮을 것을 알고 먼저 脾를 채운다 — 見肝之病 知肝傳脾 當先實脾. 木이 土를 올라타는 相乘의 길을 미리 막는 것이다.","box":[295,0,471,385],"src":["OH-14","OHG-029"],"tts":"윗줄 왼쪽. 일꾼이 잎이 누렇게 병든 나무를 가리킨다, 간의 병이다. 그런데 나무 둘레의 흙은 벌써 돌로 테를 둘러 단단히 지켜 놓았다. 간의 병을 보면 비로 옮을 것을 알고 먼저 비를 채운다, 견간지병 지간전비 당선실비. 목이 토를 올라타는 상승의 길을 미리 막는 것이다."},{"n":2,"obj":"열매가 둘뿐인 가는 나무 · 열매는 두고 뿌리 곁에 거름 자루를 대는 일꾼","fact":"虛則補其母 — 허하면 그 어미를 補한다(難經)","hook":"열매(子)가 부실 → 나무(母) 뿌리에 거름 = 補其母","say":"윗줄 가운데. 가는 나무에 열매가 둘뿐이다. 일꾼은 열매는 건드리지 않고 나무뿌리에 거름 자루를 댄다 — 자식이 허하면 어미를 채운다, 虛則補其母. 『難經』의 원칙이다. 침으로는 제 경맥의 어미 혈을 補한다 — 肺가 허하면 太淵을 補한다. 같은 『難經』은 五臟에서 생긴 덩이를 積, 六腑에서 생긴 덩이를 聚라 가른다.","box":[944,17,313,353],"src":["UH-NAN-04","HUBGR-0200"],"tts":"윗줄 가운데. 가는 나무에 열매가 둘뿐이다. 일꾼은 열매는 건드리지 않고 나무뿌리에 거름 자루를 댄다, 자식이 허하면 어미를 채운다, 허즉보기모. 난경의 원칙이다. 침으로는 제 경맥의 어미 혈을 보한다, 폐가 허하면 태연을 보한다. 같은 난경은 오장에서 생긴 덩이를 적, 육부에서 생긴 덩이를 취라 가른다."},{"n":3,"obj":"열매가 너무 많이 달린 큰 나무 · 열매를 따서 바구니에 담는 일꾼","fact":"實則瀉其子 — 실하면 그 자식을 瀉한다","hook":"너무 실한 나무(母) → 열매(子)를 따 냄 = 瀉其子","say":"윗줄 오른쪽. 나무에 열매가 너무 많이 달렸다. 일꾼이 열매를 따 낸다 — 어미가 실하면 자식을 덜어 낸다, 實則瀉其子. 肝이 실하면 그 자식인 火를 瀉한다 — 肝經의 火穴 行間이나 心經의 少海를 쓴다. 肺가 실하면 尺澤을 瀉한다.","box":[1388,0,481,378],"src":["GRG2-022"],"tts":"윗줄 오른쪽. 나무에 열매가 너무 많이 달렸다. 일꾼이 열매를 따 낸다, 어미가 실하면 자식을 덜어 낸다, 실즉사기자. 간이 실하면 그 자식인 화를 사한다, 간경의 화혈 행간이나 심경의 소해를 쓴다. 폐가 실하면 척택을 사한다."},{"n":4,"obj":"갈라진 마른 땅, 잎이 붉게 탄 나무 · 뿌리에 물통의 물을 붓는 일꾼","fact":"滋水涵木 — 腎水를 길러 肝木을 적신다: 腎水虛 → 肝陽上亢","hook":"물을 대어(滋水) 나무를 적심(涵木) · 붉게 탄 잎 = 肝陽上亢","say":"가운뎃줄 첫 밭. 땅이 말라 갈라지고 나뭇잎이 붉게 탔다 — 腎의 물이 모자라 나무를 적시지 못하니 肝陽이 위로 치솟았다. 水不涵木, 肝陽上亢. 일꾼이 뿌리에 물을 붓는다 — 불을 자(滋), 젖을 함(涵), 滋水涵木. 腎陰을 길러 肝을 가라앉히는 법이다.","box":[75,307,389,402],"src":["OH-12-01"],"tts":"가운뎃줄 첫 밭. 땅이 말라 갈라지고 나뭇잎이 붉게 탔다, 신의 물이 모자라 나무를 적시지 못하니 간양이 위로 치솟았다. 수불함목, 간양상항. 일꾼이 뿌리에 물을 붓는다, 불을 자, 젖을 함, 자수함목. 신음을 길러 간을 가라앉히는 법이다."},{"n":5,"obj":"흙가마 아궁이에 장작을 더 넣는 일꾼 · 곁에 쌓인 갓 구운 흙벽돌","fact":"益火生土 — 命門火(腎陽)를 더해 脾土를 돕는다(溫腎健脾) ★心火 아님","hook":"불을 더해(益火) 흙벽돌을 구움(生土) · 아궁이 불 = 命門火","say":"둘째 밭. 일꾼이 흙가마 아궁이에 장작을 더 넣고, 곁에는 갓 구운 흙벽돌이 쌓였다 — 불을 더해 흙을 낳는다, 益火生土. 이 불은 心의 불이 아니라 아궁이 불, 곧 命門의 불 腎陽이다. 腎陽을 덥혀 脾를 튼튼히 하는 법이라 溫腎健脾法이라고도 한다.","box":[631,408,474,308],"src":["OH-12-02","OHG-009"],"tts":"둘째 밭. 일꾼이 흙가마 아궁이에 장작을 더 넣고, 곁에는 갓 구운 흙벽돌이 쌓였다, 불을 더해 흙을 낳는다, 익화생토. 이 불은 심의 불이 아니라 아궁이 불, 곧 명문의 불 신양이다. 신양을 덥혀 비를 튼튼히 하는 법이라 온신건비법이라고도 한다."},{"n":6,"obj":"괭이로 흙을 높이 북돋는 일꾼 · 흙무더기에서 돋아난 금덩이들","fact":"培土生金 — 脾土를 북돋아 肺金을 돕는다: 脾虛 → 肺虛","hook":"흙을 북돋아(培土) 금이 남(生金)","say":"셋째 밭. 일꾼이 괭이로 흙을 높이 북돋자 흙무더기에서 금덩이가 돋는다 — 북돋울 배(培), 培土生金. 脾가 허해 肺까지 약해졌을 때, 脾를 補해 肺를 돕는 법이다.","box":[1172,415,481,280],"src":["OH-12-03"],"tts":"셋째 밭. 일꾼이 괭이로 흙을 높이 북돋자 흙무더기에서 금덩이가 돋는다, 북돋울 배, 배토생금. 비가 허해 폐까지 약해졌을 때, 비를 보해 폐를 돕는 법이다."},{"n":7,"obj":"무쇠 손펌프에서 무쇠 물통으로 쏟아지는 물(사람 없음)","fact":"金水相生 — 肺金과 腎水를 함께 기른다: 肺腎陰虛","hook":"쇠(金) 펌프와 물(水) = 金水相生","say":"넷째 밭에는 사람이 없
