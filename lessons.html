』 1894. 아기 — 崔圭憲 『小兒醫方』.","box":[[46,507,562,562],[507,435,404,326],[944,248,293,432],[775,689,510,454],[1242,507,231,331],[1473,141,556,582],[1559,752,470,391]],"src":[],"tts":"해 뜨는 쪽에서 다시. 보석 거울, 허준 동의보감 1610. 허리 침, 허임 침구경험방 1644. 해골 책, 주제군징. 찻잔, 정약용 마과회통 1798. 묶은 책, 황도연 방약합편 1885. 자두와 말, 이제마 동의수세보원 1894. 아기, 최규헌 소아의방."}],"has_image":true},{"id":"hist-14","title":"한국 근대 — 서양식 병원과 한의학 교육기관","place":"개항장 부두 거리","image":"images/lessons/hist-14.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"증기선이 들어온 개항장 부두 거리","fact":"한국 근대 — 서양식 병원과 한의학 교육기관(1877 → 1964)","hook":"증기선·부두 = 개항(1877 부산) · 왼쪽 → 오른쪽 = 연도순","say":"증기선이 들어온 개항장 부두다 — 1877년 부산. 배에서 내려 오른쪽으로 걸으면 연도순이다: 서양식 병원들, 한·양 협진, 한의학 학교, 일제의 격하, 그리고 해방 뒤의 한의과 대학.","box":null,"src":[],"tts":"증기선이 들어온 개항장 부두다, 1877년 부산. 배에서 내려 오른쪽으로 걸으면 연도순이다: 서양식 병원들, 한, 양 협진, 한의학 학교, 일제의 격하, 그리고 해방 뒤의 한의과 대학."},{"n":1,"obj":"구명 튜브를 건 흰 서양식 2층 건물(병원) · 양옆의 벚나무 · 문등에 매단 금메달","fact":"濟生醫院(1877 부산 · 일본인) — 최초의 서양식 병원","hook":"구명 튜브 = 濟生 · 벚꽃 = 일본인이 세움 · 금메달 = 최초","say":"부두 앞 흰 서양식 건물이 병원이다. 벽에 구명 튜브를 걸었다 — 건질 제(濟), 살 생(生), 濟生醫院. 양옆의 벚꽃은 일본인이 세웠다는 표시. 문등에 매단 금메달은 우리나라 최초의 서양식 병원, 1877년 부산. 朝鮮 초 鄕藥을 거둔 濟生院(1397)과 이름이 닮았으니 갈라 둔다.","box":[216,29,922,605],"src":["UHG-014"],"tts":"부두 앞 흰 서양식 건물이 병원이다. 벽에 구명 튜브를 걸었다, 건질 제, 살 생, 제생의원. 양옆의 벚꽃은 일본인이 세웠다는 표시. 문등에 매단 금메달은 우리나라 최초의 서양식 병원, 1877년 부산. 조선 초 향약을 거둔 제생원 1397과 이름이 닮았으니 갈라 둔다."},{"n":2,"obj":"검은 왕진 가방을 든 서양 의사가 사람을 가득 실은 작은 배를 밧줄로 끌어당김","fact":"알렌 — 廣惠院 → 濟衆院(1885) 최초 서양식 국립병원","hook":"넓은(廣) 은혜(惠) → 무리(衆)를 건짐(濟) = 廣惠院 → 濟衆院","say":"물가, 왕진 가방을 든 서양 의사가 사람을 가득 실은 배를 밧줄로 끌어당긴다 — 알렌이다. 처음 이름은 넓은 은혜의 廣惠院, 같은 해 건질 제(濟), 무리 중(衆) — 무리를 건지는 濟衆院으로 바꿨다. 1885년, 최초의 서양식 국립병원.","box":[14,562,786,447],"src":["UHG-015"],"tts":"물가, 왕진 가방을 든 서양 의사가 사람을 가득 실은 배를 밧줄로 끌어당긴다, 알렌이다. 처음 이름은 넓은 은혜의 광혜원, 같은 해 건질 제, 무리 중, 무리를 건지는 제중원으로 바꿨다. 1885년, 최초의 서양식 국립병원."},{"n":3,"obj":"넓은 평상에 누운 환자 한 명을 서양 의사(청진기)와 한의사(침)가 함께 돌봄","fact":"廣濟院 — 양·한방 협진(지문 1889 · 통설 1900)","hook":"넓은(廣) 평상 · 함께 건짐(濟) = 廣濟院 · 청진기 + 침 = 협진","say":"가운데, 넓은 평상에 누운 환자 한 사람을 청진기 든 서양 의사와 침 든 한의사가 함께 돌본다 — 넓을 광(廣), 건질 제(濟), 廣濟院. 양방과 한방이 함께 본 협진 병원이다. 문제 지문은 1889년, 통설은 1900년 — 內部病院을 고친 이름이다.","box":[807,526,533,497],"src":["UHG-016"],"tts":"가운데, 넓은 평상에 누운 환자 한 사람을 청진기 든 서양 의사와 침 든 한의사가 함께 돌본다, 넓을 광, 건질 제, 광제원. 양방과 한방이 함께 본 협진 병원이다. 문제 지문은 1889년, 통설은 1900년, 내부병원을 고친 이름이다."},{"n":4,"obj":"침 꽂힌 인체 모형을 둘러싸고 책을 든 학생들의 작은 학교 · 문간의 용 수놓은 비단 주머니와 금괴 · 교문의 금메달","fact":"同濟醫學校(1904) — 고종 사재(내탕금) · 최초 한의학 교육기관","hook":"함께(同) 배움 = 同濟 · 용 주머니 = 임금의 사재 · 금메달 = 최초","say":"작은 학교에서 학생들이 책을 들고 침 꽂힌 인체 모형을 둘러싸 함께 공부한다 — 한가지 동(同), 同濟醫學校. 문간의 용 수놓은 비단 주머니에서 금괴가 쏟아진다 — 임금의 주머니, 고종의 사재, 곧 내탕금으로 세웠다. 교문의 금메달은 최초의 한의학 교육기관, 1904년.","box":[1165,245,525,497],"src":["UHG-010"],"tts":"작은 학교에서 학생들이 책을 들고 침 꽂힌 인체 모형을 둘러싸 함께 공부한다, 한가지 동, 동제의학교. 문간의 용 수놓은 비단 주머니에서 금괴가 쏟아진다, 임금의 주머니, 고종의 사재, 곧 내탕금으로 세웠다. 교문의 금메달은 최초의 한의학 교육기관, 1904년."},{"n":5,"obj":"교단 위 검은 제복의 사내 · 그 아래 방석에 학생처럼 놀라 앉은 한의사","fact":"醫生規則(1913) — 한의사를 醫師에서 醫生으로 격하","hook":"스승(師)의 교단 → 학생(生)의 방석 = 師 → 生 격하","say":"오른쪽 앞, 검은 제복의 사내가 교단을 차지했고, 한의사는 그 아래 학생 방석에 밀려 앉아 놀란다 — 스승 사(師)에서 날 생(生)으로, 醫師를 醫生으로 깎아내린 醫生規則, 1913년 일제. 1907년 세운 大韓醫院은 서양 의사가 모자랐다.","box":[1441,490,607,605],"src":["UHG-013"],"tts":"오른쪽 앞, 검은 제복의 사내가 교단을 차지했고, 한의사는 그 아래 학생 방석에 밀려 앉아 놀란다, 스승 사에서 날 생으로, 의사를 의생으로 깎아내린 의생규칙, 1913년 일제. 1907년 세운 대한의원은 서양 의사가 모자랐다."},{"n":6,"obj":"뒤쪽의 낮은 갈색 학교 건물","fact":"東洋大學館(1948) — 최초의 4년제 한의과 교육기관","hook":"낮은 건물 = 4년제 · 먼저(1948)","say":"맨 뒤, 해방 뒤에 선 학교 건물 둘. 낮은 갈색 건물이 東洋大學館 — 1948년, 최초의 4년제 한의과 교육기관이다.","box":[1499,151,267,353],"src":["UHG-011"],"tts":"맨 뒤, 해방 뒤에 선 학교 건물 둘. 낮은 갈색 건물이 동양대학관, 1948년, 최초의 4년제 한의과 교육기관이다."},{"n":7,"obj":"그 곁의 더 높은 학교 건물","fact":"東洋醫科大學(1964) — 최초의 6년제 한의과대학 → 경희대","hook":"더 높은 건물 = 6년제 · 나중(1964)","say":"그 곁 더 높은 건물이 東洋醫科大學 — 1964년, 최초의 6년제 한의과대학. 뒤에 경희대 한의대로 이어졌다. 낮은 건물 4년제가 먼저, 높은 건물 6년제가 나중.","box":[1756,32,291,480],"src":["UHG-012"],"tts":"그 곁 더 높은 건물이 동양의과대학, 1964년, 최초의 6년제 한의과대학. 뒤에 경희대 한의대로 이어졌다. 낮은 건물 4년제가 먼저, 높은 건물 6년제가 나중."},{"n":8,"kind":"review","obj":"부두에서 오른쪽으로 — 구명 튜브 병원 · 끌어올린 배 · 넓은 의자 · 작은 학교 · 교단 · 학교 건물 둘","fact":"濟生醫院 1877 → 濟衆院 1885 → 廣濟院 → 同濟 1904 → 醫生規則 1913 → 1948·1964","hook":"병원 셋(濟生·濟衆·廣濟) → 학교(同濟) → 격하(醫生) → 대학 둘(4년·6년)","say":"부두부터 다시. 구명 튜브 濟生醫院 1877, 배를 끄는 알렌 濟衆院 1885, 넓은 평상 협진 廣濟院. 용 주머니 同濟醫學校 1904, 교단에서 방석으로 醫生規則 1913. 낮은 건물 東洋大學館 1948, 높은 건물 東洋醫科大學 1964.","box":[[216,29,922,605],[14,562,786,447],[807,526,533,497],[1165,245,525,497],[1441,490,607,605],[1499,151,267,353],[1756,32,291,480]],"src":[],"tts":"부두부터 다시. 구명 튜브 제생의원 1877, 배를 끄는 알렌 제중원 1885, 넓은 평상 협진 광제원. 용 주머니 동제의학교 1904, 교단에서 방석으로 의생규칙 1913. 낮은 건물 동양대학관 1948, 높은 건물 동양의과대학 1964."}],"has_image":true},{"id":"yyox-01","title":"天人相應 — 다섯 땅의 다섯 치법(異法方宜)과 衛氣의 낮·밤","place":"다섯 방향의 장터 마을","image":"images/lessons/yyox-01.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"다섯 방향의 장터 마을 — 가운데 광장 · 오른쪽 바다 · 왼쪽 바위산 · 위 눈 언덕 · 아래 안개 늪","fact":"異法方宜論 — 땅이 다르면 먹는 것·병·치법이 다르다(天人相應)","hook":"지도처럼 본다: 오른쪽 = 東(해 뜨는 바다) · 왼쪽 = 西 · 위 = 北 · 아래 = 南 · 가운데 = 中央","say":"지도처럼 내려다본 장터 마을이다. 오른쪽 해 뜨는 바다가 東, 왼쪽 바위산이 西, 위 눈 언덕이 北, 아래 안개 늪이 南, 가운데 광장이 中央. 땅이 다르면 먹는 것이 다르고, 병이 다르고, 고치는 법이 다르다 — 『素問·異法方宜論』. 사람이 하늘과 땅을 따른다는 天人相應이다.","box":null,"src":[],"tts":"지도처럼 내려다본 장터 마을이다. 오른쪽 해 뜨는 바다가 동, 왼쪽 바위산이 서, 위 눈 언덕이 북, 아래 안개 늪이 남, 가운데 광장이 중앙. 땅이 다르면 먹는 것이 다르고, 병이 다르고, 고치는 법이 다르다, 소문, 이법방의론. 사람이 하늘과 땅을 따른다는 천인상응이다."},{"n":1,"obj":"바닷가 모래밭에서 생선을 먹는 사람 · 어깨의 붉은 종기 · 곁에서 뾰족한 돌을 든 사람","fact":"東方 — 魚鹽之地 · 食魚嗜鹹 → 癰瘍 → 砭石","hook":"해 뜨는 바다 = 東 · 생선 = 魚鹽·嗜鹹 · 붉은 종기 = 癰瘍 · 뾰족한 돌 = 砭石","say":"오른쪽, 해 뜨는 바닷가가 東方이다 — 天地가 처음 生하는 곳. 한 사람이 생선을 통째로 먹는다 — 물고기와 소금의 땅, 짠맛을 즐긴다. 그래서 어깨에 붉은 종기가 났다 — 癰瘍. 곁의 사람이 뾰족한 돌로 종기를 짼다 — 돌침, 砭石이다.","box":[1513,418,535,368],"src":["CI-01-01","CI-02","OHG2-012"],"tts":"오른쪽, 해 뜨는 바닷가가 동방이다, 천지가 처음 생하는 곳. 한 사람이 생선을 통째로 먹는다, 물고기와 소금의 땅, 짠맛을 즐긴다. 그래서 어깨에 붉은 종기가 났다, 옹양. 곁의 사람이 뾰족한 돌로 종기를 짼다, 돌침, 폄석이다."},{"n":2,"obj":"금덩이·옥이 박힌 바위산 앞, 기름진 고기를 들고 해골 그려진 약병을 들이켜는 살찐 사람","fact":"西方 — 金玉之域 · 華食(기름진 음식) → 病生於內 → 毒藥","hook":"금·옥 바위산 = 金玉之域 · 기름진 고기 = 華食 · 속병 = 病生於內 · 해골 약병 = 毒藥","say":"왼쪽 바위산에 금덩이와 옥이 박혔다 — 西方, 金玉之域. 天地가 거두어들이는 곳이다. 살찐 사람이 기름진 고기를 들었다. 바람 세고 땅이 굳센 곳이라 邪氣가 겉몸을 못 상하고, 병은 안에서 생긴다 — 病生於內. 그래서 해골 그려진 약병을 들이켠다 — 속을 치는 毒藥이다.","box":[0,404,613,526],"src":["CI-01-02","CI-03"],"tts":"왼쪽 바위산에 금덩이와 옥이 박혔다, 서방, 금옥지역. 천지가 거두어들이는 곳이다. 살찐 사람이 기름진 고기를 들었다. 바람 세고 땅이 굳센 곳이라 사기가 겉몸을 못 상하고, 병은 안에서 생긴다, 병생어내. 그래서 해골 그려진 약병을 들이켠다, 속을 치는 독약이다."},{"n":3,"obj":"눈 언덕에서 염소 곁에 앉아 젖을 마시는 털옷 목자 · 불룩한 배 위에서 타는 뜸","fact":"北方 — 高陵·風寒 · 乳食 → 藏寒生滿病 → 灸焫","hook":"눈 언덕 = 北·閉藏 · 젖 사발 = 乳食 · 불룩한 배 = 滿病 · 배 위의 뜸 = 灸焫","say":"위쪽 눈 덮인 높은 언덕이 北方이다 — 天地가 닫아 갈무리하는 곳, 바람이 차고 얼음이 언다. 털옷 입은 목자가 염소 곁에서 젖을 마신다 — 들에 살며 젖을 먹는다, 乳食. 속이 차가워져 배가 불룩하다 — 藏寒生滿病. 배 위에서 뜸이 탄다 — 灸焫이다.","box":[829,65,447,303],"src":["CI-01-03","CI-04"],"tts":"위쪽 눈 덮인 높은 언덕이 북방이다, 천지가 닫아 갈무리하는 곳, 바람이 차고 얼음이 언다. 털옷 입은 목자가 염소 곁에서 젖을 마신다, 들에 살며 젖을 먹는다, 유식. 속이 차가워져 배가 불룩하다, 장한생만병. 배 위에서 뜸이 탄다, 구설이다."},{"n":4,"obj":"안개 낀 늪에서 얼굴을 찡그리며 장아찌를 먹는 사람 · 팔에 꽂힌 가는 침들","fact":"南方 — 地下·霧露 · 嗜酸食腐 → 攣痺 → 微鍼(九鍼)","hook":"안개 낀 낮은 늪 = 南·霧露 · 신 장아찌 = 嗜酸食腐 · 가는 침 = 微鍼","say":"아래쪽 안개 낀 낮은 늪이 南方이다 — 天地가 길러 키우는 곳, 陽이 성한 곳. 땅이 낮고 안개와 이슬이 모인다. 한 사람이 신 장아찌를 먹으며 얼굴을 찡그린다 — 신 것과 삭힌 것을 즐긴다, 嗜酸食腐. 그래서 힘줄이 오그라들고 저리다 — 攣痺. 팔에 가는 침이 꽂혔다 — 微鍼, 아홉 가지 침 九鍼이 남쪽에서 왔다.","box":[894,807,346,336],"src":["CI-01-04","CI-05"],"tts":"아래쪽 안개 낀 낮은 늪이 남방이다, 천지가 길러 키우는 곳, 양이 성한 곳. 땅이 낮고 안개와 이슬이 모인다. 한 사람이 신 장아찌를 먹으며 얼굴을 찡그린다, 신 것과 삭힌 것을 즐긴다, 기산식부. 그래서 힘줄이 오그라들고 저리다, 연비. 팔에 가는 침이 꽂혔다, 미침, 아홉 가지 침 구침이 남쪽에서 왔다."},{"n":5,"obj":"광장 돗자리에 음식 접시들에 둘러싸여 누운 사람 · 그 다리를 주무르고 당기는 사람","fact":"中央 — 地平以濕 · 食雜而不勞 → 痿厥寒熱 → 導引按蹻","hook":"가운데 광장 = 中央 · 여러 접시 = 食雜 · 누워만 있음 = 不勞 · 늘어진 다리 = 痿厥 · 주무름 = 導引按蹻","say":"가운데 광장이 中央이다 — 땅이 평평하고 습해 만물이 나는 곳. 한 사람이 여러 음식 접시에 둘러싸여 누워만 있다 — 이것저것 먹고 일하지 않는다, 食雜而不勞. 그래서 다리에 힘이 빠지고 寒熱이 난다 — 痿厥寒熱. 곁의 사람이 다리를 주무르고 당긴다 — 導引按蹻다.","box":[634,389,822,411],"src":["CI-01-05","CI-06"],"tts":"가운데 광장이 중앙이다, 땅이 평평하고 습해 만물이 나는 곳. 한 사람이 여러 음식 접시에 둘러싸여 누워만 있다, 이것저것 먹고 일하지 않는다, 식잡이불로. 그래서 다리에 힘이 빠지고 한열이 난다, 위궐한열. 곁의 사람이 다리를 주무르고 당긴다, 도인안교다."},{"n":6,"obj":"반은 낮, 반은 밤인 담 두른 집 — 해 아래 담 밖을 도는 창 든 파수꾼 · 달 아래 담 안 잠자리에서 자는 사람","fact":"衛氣 — 낮엔 陽分 25周(깨어 있음) · 밤엔 陰分 25周(잠)","hook":"창 든 파수꾼 = 衛 · 해 아래 담 밖 순찰 = 晝行陽 · 달 아래 담 안의 잠 = 夜行陰","say":"왼쪽 위 집은 반은 낮, 반은 밤이다. 창 든 파수꾼이 衛氣 — 지킬 위(衛). 해 아래에서는 담 밖을 돈다 — 낮에는 몸 겉 陽分을 스물다섯 바퀴 돌아 깨어 있다. 달 아래에서는 담 안에 들어 잔다 — 밤에는 陰分을 스물다섯 바퀴. 새벽에 눈을 뜨면 눈에서 출발해 脈 밖을 빠르게 돈다. 하늘에 낮밤이 있듯 사람에게 자고 일어남이 있다 — 天有晝夜 人有臥起.","box":[14,0,634,396],"src":["JGG-007","JQ-QI-14","HUBJQ-0016"],"tts":"왼쪽 위 집은 반은 낮, 반은 밤이다. 창 든 파수꾼이 위기, 지킬 위. 해 아래에서는 담 밖을 돈다, 낮에는 몸 겉 양분을 스물다섯 바퀴 돌아 깨어 있다. 달 아래에서는 담 안에 들어 잔다, 밤에는 음분을 스물다섯 바퀴. 새벽에 눈을 뜨면 눈에서 출발해 맥 밖을 빠르게 돈다. 하늘에 낮밤이 있듯 사람에게 자고 일어남이 있다, 천유주야 인유와기."},{"n":7,"kind":"review","obj":"다섯 방위 한 바퀴 — 동 · 서 · 북 · 남 · 가운데","fact":"東 癰瘍-砭石 · 西 內病-毒藥 · 北 滿病-灸焫 · 南 攣痺-微鍼 · 中 痿厥-導引按蹻","hook":"생선 → 돌 · 고기 → 약병 · 젖 → 뜸 · 장아찌 → 침 · 여러 접시 → 주무름","say":"다시 한 바퀴. 東 바닷가 생선 — 癰瘍에 砭石. 西 바위산 기름진 고기 — 속병에 毒藥. 北 눈 언덕 젖 — 滿病에 뜸 灸焫. 南 안개 늪 장아찌 — 攣痺에 微鍼. 中央 광장 여러 접시 — 痿厥寒熱에 導引按蹻. 출전은 『素問·異法方宜論』이다 — 金匱眞言論이 아니다.","box":[[1513,418,535,368],[0,404,613,526],[829,65,447,303],[894,807,346,336],[634,389,822,411]],"src":["OHG-051","CI-01-06"],"tts":"다시 한 바퀴. 동 바닷가 생선, 옹양에 폄석. 서 바위산 기름진 고기, 속병에 독약. 북 눈 언덕 젖, 만병에 뜸 구설. 남 안개 늪 장아찌, 연비에 미침. 중앙 광장 여러 접시, 위궐한열에 도인안교. 출전은 소문, 이법방의론이다, 금궤진언론이 아니다."}],"has_image":true},{"id":"yyox-02","title":"陰陽 — 속성(全一·對待·統一)·分化와 네 관계(互根·制約·消長·轉化) + 원문 둘","place":"볕 드는 쪽·그늘진 쪽이 갈린 언덕","image":"images/lessons/yyox-02.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"볕 드는 쪽과 그늘진 쪽으로 갈린 한 언덕","fact":"陰陽 — 속성 셋 · 발전변화 속성 둘 · 기본내용 넷(互根·制約·消長·轉化)","hook":"왼쪽 볕 든 쪽 = 陽 · 오른쪽 그늘진 쪽 = 陰 (언덕 阝 + 볕 昜 / 그늘 侌)","say":"언덕 하나가 가운데 금으로 갈렸다. 왼쪽 볕 든 쪽이 陽, 오른쪽 그늘진 쪽이 陰 — 글자부터 언덕의 볕과 그늘이다. 이 언덕에서 陰陽의 속성 셋, 발전변화 속성 둘, 그리고 네 관계인 互根·制約·消長·轉化를 차례로 본다.","box":null,"src":[],"tts":"언덕 하나가 가운데 금으로 갈렸다. 왼쪽 볕 든 쪽이 양, 오른쪽 그늘진 쪽이 음, 글자부터 언덕의 볕과 그늘이다. 이 언덕에서 음양의 속성 셋, 발전변화 속성 둘, 그리고 네 관계인 호근, 제약, 소장, 전화를 차례로 본다."},{"n":1,"obj":"언덕 꼭대기, 금 위에 앉은 둥근 바위 하나 — 반은 볕, 반은 그늘","fact":"全一(專一) — 陰과 陽은 본디 한 덩어리, 한 근원(一氣)","hook":"바위는 하나 = 全一 · 볕 든 반쪽 + 그늘진 반쪽","say":"언덕 꼭대기, 둥근 바위 하나가 금 위에 앉았다. 반은 볕, 반은 그늘이지만 바위는 하나다 — 陰과 陽이 합쳐 온전한 하나, 全一이다. 온전할 전(全)으로도, 오로지 전(專)으로도 적는다 — 본디 한 기운, 한 근원이라는 뜻. 對待·統一과 함께 陰陽의 속성 셋이다.","box":[901,50,245,238],"src":["YY-01-M01","YY-01"],"tts":"언덕 꼭대기, 둥근 바위 하나가 금 위에 앉았다. 반은 볕, 반은 그늘이지만 바위는 하나다, 음과 양이 합쳐 온전한 하나, 전일이다. 온전할 전으로도, 오로지 전으로도 적는다, 본디 한 기운, 한 근원이라는 뜻. 대대, 통일과 함께 음양의 속성 셋이다."},{"n":2,"obj":"키 큰 사람 · 중간 사람 · 작은 사람이 나란히 선 셋 — 가운데 사람이 손가락으로 가리킴","fact":"對待 — 陰陽은 상대와 견주어 정해진다(상대성)","hook":"가운데 사람: 큰 사람 곁에선 작고(陰) 작은 사람 곁에선 크다(陽)","say":"볕 쪽 위, 키가 다른 세 사람. 가운데 사람은 큰 사람 곁에서는 작고, 작은 사람 곁에서는 크다. 陰이냐 陽이냐는 누구와 견주느냐로 정해진다 — 마주 대할 대(對), 기다릴 대(待), 對待. 陰陽의 상대성이다.","box":[324,86,331,360],"src":["YY-01-M02","OHG-042"],"tts":"볕 쪽 위, 키가 다른 세 사람. 가운데 사람은 큰 사람 곁에서는 작고, 작은 사람 곁에서는 크다. 음이냐 양이냐는 누구와 견주느냐로 정해진다, 마주 대할 대, 기다릴 대, 대대. 음양의 상대성이다."},{"n":3,"obj":"멜대 하나에 해 그림 물통과 달 그림 물통을 멘 짐꾼","fact":"統一 — 맞서는 陰陽이 한 바탕에 묶여 있다(대립의 통일)","hook":"해 물통(陽) + 달 물통(陰)이 멜대 하나에 = 統一","say":"왼쪽 아래, 짐꾼이 멜대 하나에 해 물통과 달 물통을 멨다. 해와 달은 맞서지만 한 멜대에 달렸다 — 맞서는 둘이 한 바탕에 묶인 統一. 한쪽이 없으면 멜대가 기운다.","box":[331,793,331,303],"src":["YY-01-M03"],"tts":"왼쪽 아래, 짐꾼이 멜대 하나에 해 물통과 달 물통을 멨다. 해와 달은 맞서지만 한 멜대에 달렸다, 맞서는 둘이 한 바탕에 묶인 통일. 한쪽이 없으면 멜대가 기운다."},{"n":4,"obj":"큰 것에서 작은 것으로 늘어선 인형 넷 — 저마다 반은 희고 반은 검다","fact":"分化 — 陰 속에 또 陰陽, 陽 속에 또 陰陽(無限可分) ★발전변화 속성","hook":"인형 속에 또 인형, 저마다 흑백 반반 = 나누어도 또 陰陽","say":"그늘 쪽 가운데, 큰 인형에서 작은 인형이 차례로 나온다. 인형마다 반은 희고 반은 검다 — 陰 속에 또 陰陽, 陽 속에 또 陰陽. 끝없이 나뉘는 分化다. 分化와 消長 둘은 발전변화 속성이라 부른다 — 속성 셋인 全一·對待·統一과 다른 갈래이니 섞지 말 것.","box":[1376,540,396,223],"src":["YY-02"],"tts":"그늘 쪽 가운데, 큰 인형에서 작은 인형이 차례로 나온다. 인형마다 반은 희고 반은 검다, 음 속에 또 음양, 양 속에 또 음양. 끝없이 나뉘는 분화다. 분화와 소장 둘은 발전변화 속성이라 부른다, 속성 셋인 전일, 대대, 통일과 다른 갈래이니 섞지 말 것."},{"n":5,"obj":"금 양쪽에 밑동을 맞대고 선 두 나무 — 땅속에서 뿌리가 금을 넘어 서로의 땅에 박힘","fact":"陰陽互根 — 서로 뿌리가 된다: 陽根於陰 陰根於陽 · 獨陰不生 孤陽不長","hook":"뿌리(根)가 서로의 땅에 = 互根","say":"한가운데, 볕 쪽 나무와 그늘 쪽 나무가 금 양쪽에 밑동을 맞대고 섰다. 땅속을 보면 뿌리가 금을 넘어 서로의 땅에 박혔다 — 뿌리 근(根), 陰陽互根. 陽은 陰에 뿌리박고 陰은 陽에 뿌리박는다. 그래서 陰만으로는 나지 못하고 陽만으로는 자라지 못한다 — 獨陰不生 孤陽不長. 陰損及陽, 陰中求陽도 이 뿌리 이야기다.","box":[749,288,569,519],"src":["YY-03-M01","YY-04","OHG-021"],"tts":"한가운데, 볕 쪽 나무와 그늘 쪽 나무가 금 양쪽에 밑동을 맞대고 섰다. 땅속을 보면 뿌리가 금을 넘어 서로의 땅에 박혔다, 뿌리 근, 음양호근. 양은 음에 뿌리박고 음은 양에 뿌리박는다. 그래서 음만으로는 나지 못하고 양만으로는 자라지 못한다, 독음불생 고양부장. 음손급양, 음중구양도 이 뿌리 이야기다."},{"n":6,"obj":"금을 사이에 둔 줄다리기 — 흰 옷 사람과 검은 옷 사람, 금 위에 멈춘 붉은 매듭","fact":"對立制約 — 서로 당겨 누르며 평형: 陰勝則陽病 陽勝則陰病","hook":"팽팽한 줄 = 制約으로 평형 · 한쪽이 이기면 진 쪽이 병","say":"아래 가운데, 흰 옷과 검은 옷이 줄다리기를 한다. 붉은 매듭이 금 위에 멈췄다 — 서로 당겨 누르니 평형이다, 對立制約. 한쪽이 이기면 진 쪽이 병든다 — 陰勝則陽病 陽勝則陰病. 陽이 이기면 熱, 陰이 이기면 寒. 寒者熱之 熱者寒之도 이 줄다리기다. 調經論의 陽虛則外寒 陰虛則內熱과는 구별한다.","box":[721,800,641,274],"src":["YY-03-M03","YY-17","OHG-022","OHG2-006"],"tts":"아래 가운데, 흰 옷과 검은 옷이 줄다리기를 한다. 붉은 매듭이 금 위에 멈췄다, 서로 당겨 누르니 평형이다, 대립제약. 한쪽이 이기면 진 쪽이 병든다, 음승즉양병 양승즉음병. 양이 이기면 열, 음이 이기면 한. 한자열지 열자한지도 이 줄다리기다. 조경론의 양허즉외한 음허즉내열과는 구별한다."},{"n":7,"obj":"롤러로 밝은 칠을 미는 칠장이 · 나무 뒤에서 금을 넘어 그늘 쪽으로 번진 밝은 땅","fact":"消長 — 한쪽이 늘면 한쪽이 준다: 陽長陰消 · 陰長陽消(量의 변화)","hook":"밝은 칠이 번지면 그늘이 줄어든다 = 陽長陰消","say":"볕 쪽 가운데, 칠장이가 롤러로 밝은 칠을 민다. 나무 뒤로 밝은 땅이 금을 넘어 그늘 쪽으로 번졌다 — 陽이 자라면 陰이 사라진다, 陽長陰消. 거꾸로면 陰長陽消. 冬至에서 夏至까지가 陰消陽長이다. 성질은 그대로이고 분량만 늘고 준다 — 사라질 소(消), 자랄 장(長), 消長.","box":[[461,483,295,267],[1031,432,317,209]],"src":["YY-03-M04","OHG-024"],"tts":"볕 쪽 가운데, 칠장이가 롤러로 밝은 칠을 민다. 나무 뒤로 밝은 땅이 금을 넘어 그늘 쪽으로 번졌다, 양이 자라면 음이 사라진다, 양장음소. 거꾸로면 음장양소. 동지에서 하지까지가 음소양장이다. 성질은 그대로이고 분량만 늘고 준다, 사라질 소, 자랄 장, 소장."},{"n":8,"obj":"왼쪽 끝 큰 모닥불(불꽃 끝이 눈송이로) · 오른쪽 끝 큰 얼음(위에서 불이 솟음)","fact":"轉化 — 極에 이르면 뒤집힌다: 重陰必陽 重陽必陰 · 寒極生熱 熱極生寒","hook":"볕 쪽 맨 끝 불 → 눈 · 그늘 쪽 맨 끝 얼음 → 불 = 끝(極)에서 뒤집힘","say":"양쪽 끝을 본다. 왼쪽 끝 큰 모닥불은 불꽃 끝이 눈송이로 바뀌고, 오른쪽 끝 큰 얼음에서는 불이 솟는다. 끝까지 가면 뒤집힌다 — 轉化. 重陰必陽 重陽必陰, 寒極生熱 熱極生寒. 언제나가 아니라 끝에 이르렀을 때만이다 — 物極必反.","box":[[0,29,259,879],[1845,389,203,548]],"src":["YY-08","OHG-023","YY-03-M02"],"tts":"양쪽 끝을 본다. 왼쪽 끝 큰 모닥불은 불꽃 끝이 눈송이로 바뀌고, 오른쪽 끝 큰 얼음에서는 불이 솟는다. 끝까지 가면 뒤집힌다, 전화. 중음필양 중양필음, 한극생열 열극생한. 언제나가 아니라 끝에 이르렀을 때만이다, 물극필반."},{"n":9,"obj":"그늘 쪽 집 — 안에서 열쇠를 쥐고 궤를 지키는 검은 옷 사람 · 밖에서 편지를 들고 달리는 흰 옷 사람","fact":"陰在內 陽之守也 · 陽在外 陰之使也","hook":"안의 지킴이(守) = 陰 · 밖의 심부름꾼(使) = 陽","say":"그늘 쪽 위의 집. 안에는 검은 옷 사람이 열쇠를 쥐고 궤를 지키고, 밖에는 흰 옷 사람이 편지를 들고 달린다. 陰은 안에서 陽의 지킴이가 되고, 陽은 밖에서 陰의 심부름꾼이 된다 — 陰在內 陽之守也, 陽在外 陰之使也. 지킬 수(守), 부릴 사(使)다. 이것도 互根의 원문이다.","box":[1434,72,562,411],"src":["YY-05"],"tts":"그늘 쪽 위의 집. 안에는 검은 옷 사람이 열쇠를 쥐고 궤를 지키고, 밖에는 흰 옷 사람이 편지를 들고 달린다. 음은 안에서 양의 지킴이가 되고, 양은 밖에서 음의 심부름꾼이 된다, 음재내 양지수야, 양재외 음지사야. 지킬 수, 부릴 사다. 이것도 호근의 원문이다."},{"n":10,"obj":"빛나는 온전한 태극 원반 · 두 쪽으로 쪼개져 빛을 잃은 태극 원반","fact":"陰平陽秘 精神乃治 · 陰陽離決 精氣乃絶(生氣通天論)","hook":"온전한 원반 = 陰平陽秘 · 쪼개진 원반 = 陰陽離決","say":"오른쪽 아래 원반 둘. 온전한 원반은 빛난다 — 陰이 고르고 陽이 단단히 여며지면 精神이 다스려진다, 陰平陽秘 精神乃治. 쪼개져 흩어진 원반은 빛을 잃었다 — 陰陽이 갈라서면 精氣가 끊어진다, 陰陽離決 精氣乃絶. 『素問·生氣通天論』. 몸의 구조와 기능이 고르게 어울린 상태가 陰平陽秘다 — 五行의 亢害承制와 구별한다.","box":[1420,901,447,173],"src":["YY-06","OHG-017","OHG2-014"],"tts":"오른쪽 아래 원반 둘. 온전한 원반은 빛난다, 음이 고르고 양이 단단히 여며지면 정신이 다스려진다, 음평양비 정신내치. 쪼개져 흩어진 원반은 빛을 잃었다, 음양이 갈라서면 정기가 끊어진다, 음양리결 정기내절. 소문, 생기통천론. 몸의 구조와 기능이 고르게 어울린 상태가 음평양비다, 오행의 항해승제와 구별한다."},{"n":11,"kind":"review","obj":"언덕 한 바퀴 — 바위 · 세 사람 · 멜대 · 인형 / 두 나무 · 줄다리기 · 칠장이 · 불과 얼음","fact":"속성 全一·對待·統一 / 발전변화 分化·消長 / 관계 互根·制約·消長·轉化","hook":"바위·세 사람·멜대 = 속성 셋 · 인형·칠 = 발전변화 둘 · 나무·줄·칠·불얼음 = 관계 넷","say":"다시 본다. 속성 셋 — 바위 하나 全一, 키 다른 세 사람 對待, 멜대 하나 統一. 발전변화 속성 둘 — 인형 分化, 칠장이 消長. 기본내용 넷 — 뿌리 얽힌 두 나무 互根, 줄다리기 對立制約, 칠장이 消長, 불과 얼음 轉化. 消長은 두 갈래에 다 든다.","box":[[901,50,245,238],[324,86,331,360],[331,793,331,303],[1376,540,396,223],[749,288,569,519],[721,800,641,274],[461,483,295,267],[0,29,259,879],[1845,389,203,548]],"src":["YY-03"],"tts":"다시 본다. 속성 셋, 바위 하나 전일, 키 다른 세 사람 대대, 멜대 하나 통일. 발전변화 속성 둘, 인형 분화, 칠장이 소장. 기본내용 넷, 뿌리 얽힌 두 나무 호근, 줄다리기 대립제약, 칠장이 소장, 불과 얼음 전화. 소장은 두 갈래에 다 든다."}],"has_image":true},{"id":"yyox-03","title":"五行 왕국 — 다섯 인물(臟·色·官)과 그 성질(曲直·炎上·稼穡·從革·潤下)","place":"봄에서 겨울로 이어진 다섯 칸 들판","image":"images/lessons/yyox-03.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"봄에서 겨울로 이어진 다섯 칸 들판","fact":"五行 왕국 — 木火土金水 다섯 칸마다 臟·色·官 한 사람과 그 行의 성질","hook":"왼쪽 → 오른쪽 = 봄·여름·長夏·가을·겨울 = 木 → 火 → 土 → 金 → 水(相生 차례)","say":"들판이 다섯 칸으로 나뉘어 봄에서 겨울로 이어진다. 왼쪽부터 木, 火, 土, 金, 水 — 차례대로 낳는 相生의 순서다. 칸마다 뒤에는 그 行의 장부를 맡은 사람이 서 있고, 앞에는 그 行의 성질을 보여 주는 물건이 있다.","box":null,"src":[],"tts":"들판이 다섯 칸으로 나뉘어 봄에서 겨울로 이어진다. 왼쪽부터 목, 화, 토, 금, 수, 차례대로 낳는 상생의 순서다. 칸마다 뒤에는 그 행의 장부를 맡은 사람이 서 있고, 앞에는 그 행의 성질을 보여 주는 물건이 있다."},{"n":1,"obj":"봄 들판, 칼을 쥔 초록 갑옷의 장군","fact":"木 = 肝 · 靑 · 將軍之官(謀慮出焉)","hook":"초록 갑옷 = 靑·木 · 장군 = 將軍之官","say":"첫 칸은 봄, 木이다. 초록 갑옷의 장군이 섰다 — 肝은 將軍之官, 꾀와 헤아림 謀慮가 여기서 나온다. 색은 靑. 肝은 疏泄을 맡고 血을 갈무리한다. 굳센 장부라 剛臟, 피의 바다라 血海, 罷極之本이라고도 한다. 바탕은 陰인데 쓰임은 陽이다 — 體陰而用陽.","box":[58,108,281,440],"src":["JS-GAN-01","JSG-016"],"tts":"첫 칸은 봄, 목이다. 초록 갑옷의 장군이 섰다, 간은 장군지관, 꾀와 헤아림 모려가 여기서 나온다. 색은 청. 간은 소설을 맡고 혈을 갈무리한다. 굳센 장부라 강장, 피의 바다라 혈해, 파극지본이라고도 한다. 바탕은 음인데 쓰임은 양이다, 체음이용양."},{"n":2,"obj":"굽은 묘목 하나와 곧게 선 묘목 하나","fact":"木曰曲直 — 굽고 곧게 뻗음: 生長·升發·條達·舒暢","hook":"굽은(曲) 묘목 + 곧은(直) 묘목 = 曲直","say":"장군 앞의 묘목 둘 — 하나는 굽었고 하나는 곧다. 굽을 곡(曲), 곧을 직(直), 木曰曲直. 나무가 굽었다 펴지며 위로 밖으로 뻗듯, 자라고 오르고 막힘없이 펴지는 성질이다 — 生長·升發·條達·舒暢. 肝의 疏泄이 이것을 닮았다.","box":[29,627,360,411],"src":["OH-02-01"],"tts":"장군 앞의 묘목 둘, 하나는 굽었고 하나는 곧다. 굽을 곡, 곧을 직, 목왈곡직. 나무가 굽었다 펴지며 위로 밖으로 뻗듯, 자라고 오르고 막힘없이 펴지는 성질이다, 생장, 승발, 조달, 서창. 간의 소설이 이것을 닮았다."},{"n":3,"obj":"여름 들판, 옥좌에 앉은 붉은 용포의 임금","fact":"火 = 心 · 赤 · 君主之官(神明出焉)","hook":"붉은 용포 = 赤·火 · 옥좌의 임금 = 君主之官","say":"둘째 칸은 여름, 火다. 붉은 용포의 임금이 옥좌에 앉았다 — 心은 君主之官, 神明이 여기서 나온다. 색은 赤. 心은 血脈을 맡고 神을 갈무리한다. 五臟六腑의 큰 주인이고 生之本이며, 빛은 얼굴에 드러나고 血脈을 채운다.","box":[519,159,238,389],"src":["JS-SIM-01","JSG-015"],"tts":"둘째 칸은 여름, 화다. 붉은 용포의 임금이 옥좌에 앉았다, 심은 군주지관, 신명이 여기서 나온다. 색은 적. 심은 혈맥을 맡고 신을 갈무리한다. 오장육부의 큰 주인이고 생지본이며, 빛은 얼굴에 드러나고 혈맥을 채운다."},{"n":4,"obj":"불꽃과 불티가 곧게 위로 솟는 모닥불","fact":"火曰炎上 — 타오르며 위로: 溫熱·向上(蒸騰)","hook":"위로만 솟는 불꽃 = 炎上","say":"임금 앞 모닥불, 불꽃과 불티가 위로만 솟는다 — 불꽃 염(炎), 위 상(上), 火曰炎上. 따뜻하고 뜨겁고 위로 오르는 성질이다 — 溫熱·向上. 心의 陽이 온몸을 덥히고 밀어 주는 것이 이것을 닮았다.","box":[476,620,274,440],"src":["OH-02-02"],"tts":"임금 앞 모닥불, 불꽃과 불티가 위로만 솟는다, 불꽃 염, 위 상, 화왈염상. 따뜻하고 뜨겁고 위로 오르는 성질이다, 온열, 향상. 심의 양이 온몸을 덥히고 밀어 주는 것이 이것을 닮았다."},{"n":5,"obj":"곡식 자루 가득한 나무 곳간 문 앞의 노란 옷 농부","fact":"土 = 脾 · 黃 · 倉廩之官(五味出焉)","hook":"노란 옷 = 黃·土 · 곡식 곳간 = 倉廩之官","say":"셋째 칸은 곡식 익는 長夏, 土다. 노란 옷 농부가 곡식 곳간 문 앞에 섰다 — 脾胃는 倉廩之官, 곳간 창(倉), 곳간 름(廩). 五味가 여기서 나온다. 색은 黃. 脾는 運化와 升淸을 맡고 血을 거느린다. 後天之本, 氣血生化之源이며, 마른 것을 좋아하고 습을 싫어한다. 같은 대목에서 膻中은 臣使之官, 大腸은 傳道之官, 小腸은 受盛之官이다.","box":[836,0,396,461],"src":["JS-BI-01","JS-BI-01-M01","JSG-002","JSG-017"],"tts":"셋째 칸은 곡식 익는 장하, 토다. 노란 옷 농부가 곡식 곳간 문 앞에 섰다, 비위는 창름지관, 곳간 창, 곳간 름 늠. 오미가 여기서 나온다. 색은 황. 비는 운화와 승청을 맡고 혈을 거느린다. 후천지본, 기혈생화지원이며, 마른 것을 좋아하고 습을 싫어한다. 같은 대목에서 전중은 신사지관, 대장은 전도지관, 소장은 수성지관이다."},{"n":6,"obj":"반은 씨 뿌린 고랑, 반은 베어 묶은 볏단과 낫이 놓인 밭","fact":"土爰稼穡 — 심고 거둠: 化生·承載(萬物之母)","hook":"씨 뿌린 고랑(稼) + 거둔 볏단(穡) = 稼穡","say":"농부 앞의 밭 — 왼쪽 고랑에는 씨를 뿌렸고 오른쪽에는 볏단과 낫이 있다. 심을 가(稼), 거둘 색(穡), 土爰稼穡. 洪範은 이 줄만 가로 왈 대신 이에 원(爰)을 쓴다. 만물을 낳아 기르고 실어 받치는 성질 — 化生·承載, 흙은 萬物之母다. 脾의 運化가 이것을 닮았다.","box":[836,778,389,365],"src":["OH-02-03"],"tts":"농부 앞의 밭, 왼쪽 고랑에는 씨를 뿌렸고 오른쪽에는 볏단과 낫이 있다. 심을 가, 거둘 색, 토원가색. 홍범은 이 줄만 가로 왈 대신 이에 원을 쓴다. 만물을 낳아 기르고 실어 받치는 성질, 화생, 승재, 흙은 만물지모다. 비의 운화가 이것을 닮았다."},{"n":7,"obj":"가을 갈대밭, 흰 도포에 긴 흰 수염의 노인(재상)","fact":"金 = 肺 · 白 · 相傅之官(治節出焉)","hook":"흰 도포 = 白·金 · 늙은 재상 = 相傅之官","say":"넷째 칸은 가을, 金이다. 흰 도포의 늙은 재상이 섰다 — 肺는 相傅之官, 임금을 돕는 재상이다. 다스림과 조절, 治節이 여기서 나온다. 색은 白. 肺는 氣를 맡고, 宣發하고 肅降하며, 물길을 틔우고, 온 脈이 모인다 — 朝百脈. 덮개처럼 맨 위에 있어 華蓋, 여려서 嬌臟, 水之上源이다.","box":[1355,151,180,404],"src":["JS-PYE-01","JS-PYE-01-M01","JSG-014"],"tts":"넷째 칸은 가을, 금이다. 흰 도포의 늙은 재상이 섰다, 폐는 상부지관, 임금을 돕는 재상이다. 다스림과 조절, 치절이 여기서 나온다. 색은 백. 폐는 기를 맡고, 선발하고 숙강하며, 물길을 틔우고, 온 맥이 모인다, 조백맥. 덮개처럼 맨 위에 있어 화개, 여려서 교장, 수지상원이다."},{"n":8,"obj":"모루 위, 망치질로 구부려 모양을 바꾼 달군 쇠막대","fact":"金曰從革 — 따르고 바뀜: 變革·肅殺·收斂·下降","hook":"망치를 따라(從) 모양을 바꾸는(革) 쇠 = 從革","say":"재상 앞 모루에서 달군 쇠가 망치를 따라 새 모양으로 바뀐다 — 따를 종(從), 바꿀 혁(革), 金曰從革. 바꾸고, 가을 서리처럼 죽이고, 거두고, 내리는 성질이다 — 變革·肅殺·收斂·下降. 肺의 淸肅과 肅降이 이것을 닮았다.","box":[1283,735,324,331],"src":["OH-02-04"],"tts":"재상 앞 모루에서 달군 쇠가 망치를 따라 새 모양으로 바뀐다, 따를 종, 바꿀 혁, 금왈종혁. 바꾸고, 가을 서리처럼 죽이고, 거두고, 내리는 성질이다, 변혁, 숙살, 수렴, 하강. 폐의 청숙과 숙강이 이것을 닮았다."},{"n":9,"obj":"겨울 눈밭, 큰 바위를 머리 위로 번쩍 든 검은 옷의 장사","fact":"水 = 腎 · 黑 · 作强之官(伎巧出焉)","hook":"검은 옷 = 黑·水 · 바위를 드는 힘 = 作强之官","say":"다섯째 칸은 겨울, 水다. 검은 잠수복의 장사가 큰 바위를 번쩍 들었다 — 腎은 作强之官, 힘써 굳세게 하는 벼슬이다. 솜씨 伎巧가 여기서 나온다. 색은 黑. 腎은 精을 갈무리하고 물을 맡고 氣를 받아들인다. 先天之本, 封藏之本이며 뼈를 맡아 髓를 낳고, 빛은 머리털에 드러난다. 같은 대목에서 三焦는 決瀆之官, 膀胱은 州都之官이다.","box":[1737,65,231,490],"src":["JS-SIN-01","JS-SIN-01-M01","JSG-003","JSG-018"],"tts":"다섯째 칸은 겨울, 수다. 검은 잠수복의 장사가 큰 바위를 번쩍 들었다, 신은 작강지관, 힘써 굳세게 하는 벼슬이다. 솜씨 기교가 여기서 나온다. 색은 흑. 신은 정을 갈무리하고 물을 맡고 기를 받아들인다. 선천지본, 봉장지본이며 뼈를 맡아 수를 낳고, 빛은 머리털에 드러난다. 같은 대목에서 삼초는 결독지관, 방광은 주도지관이다."},{"n":10,"obj":"돌계단을 타고 낮은 못으로 떨어지는 작은 폭포","fact":"水曰潤下 — 적시며 아래로: 滋潤·下行·寒冷·閉藏","hook":"땅을 적시며(潤) 아래로(下) 흐르는 물 = 潤下","say":"장사 앞, 물이 돌계단을 타고 낮은 못으로 흘러내리며 땅을 적신다 — 적실 윤(潤), 아래 하(下), 水曰潤下. 차서 내려간다는 寒下가 아니다. 적시고 내려가고 차갑고 갈무리하는 성질이다 — 滋潤·下行·寒冷·閉藏. 腎의 藏精이 이것을 닮았다.","box":[1657,620,391,432],"src":["OH-02-05"],"tts":"장사 앞, 물이 돌계단을 타고 낮은 못으로 흘러내리며 땅을 적신다, 적실 윤, 아래 하, 수왈윤하. 차서 내려간다는 한하가 아니다. 적시고 내려가고 차갑고 갈무리하는 성질이다, 자윤, 하행, 한랭, 폐장. 신의 장정이 이것을 닮았다."},{"n":11,"kind":"review","obj":"다섯 칸 한 줄 — 장군 · 임금 · 농부 · 재상 · 장사와 그 앞의 물건","fact":"曲直·炎上·稼穡·從革·潤下 / 將軍·君主·倉廩·相傅·作强","hook":"묘목 · 모닥불 · 밭 · 모루 · 폭포","say":"왼쪽부터 다시. 굽고 곧은 묘목 — 木曰曲直, 장군 肝. 모닥불 — 火曰炎上, 임금 心. 씨와 볏단 — 土爰稼穡, 곳간 농부 脾. 모루의 쇠 — 金曰從革, 재상 肺. 폭포 — 水曰潤下, 장사 腎. 『尙書·洪範』의 다섯 구절이다. 十二官에서 膽은 中正之官, 決斷이 나온다.","box":[[0,58,396,1038],[411,130,411,966],[829,0,404,1143],[1240,130,396,966],[1643,58,405,1038]],"src":["OH-01","OHG-033","JSG-001"],"tts":"왼쪽부터 다시. 굽고 곧은 묘목, 목왈곡직, 장군 간. 모닥불, 화왈염상, 임금 심. 씨와 볏단, 토원가색, 곳간 농부 비. 모루의 쇠, 금왈종혁, 재상 폐. 폭포, 수왈윤하, 장사 신. 상서, 홍범의 다섯 구절이다. 십이관에서 담은 중정지관, 결단이 나온다."}],"has_image":true},{"id":"yyox-04","title":"五行의 자리와 수 — 五方 · 相生 · 相剋 · 生成數(水火木金土)","place":"다섯 구역 과수원","image":"images/lessons/yyox-04.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"다섯 구역 과수원 — 위 검은 못 · 아래 붉은 모닥불 · 오른쪽 초록 나무 · 왼쪽 흰 연장 걸이 · 가운데 누런 흙","fact":"五行의 자리와 수 — 五方 · 相生 · 相剋 · 生成數","hook":"지도처럼: 위 北 水(黑) · 아래 南 火(赤) · 오른쪽 東 木(靑) · 왼쪽 西 金(白) · 가운데 土(黃) · 흰 판의 점 = 生數","say":"지도처럼 내려다본 과수원이다. 위 검은 구역의 못이 北의 水, 아래 붉은 구역의 모닥불이 南의 火, 오른쪽 초록 구역의 나무가 東의 木, 왼쪽 흰 구역의 쇠 연장이 西의 金, 가운데 누런 흙이 中央의 土. 구역마다 놓인 흰 판의 점이 그 行의 生數다.","box":null,"src":[],"tts":"지도처럼 내려다본 과수원이다. 위 검은 구역의 못이 북의 수, 아래 붉은 구역의 모닥불이 남의 화, 오른쪽 초록 구역의 나무가 동의 목, 왼쪽 흰 구역의 쇠 연장이 서의 금, 가운데 누런 흙이 중앙의 토. 구역마다 놓인 흰 판의 점이 그 행의 생수다."},{"n":1,"obj":"못 쪽에서 물뿌리개를 들고 와 나무뿌리에 물을 붓는 정원사","fact":"相生 — 木→火→土→金→水→木 (木生火·火生土·土生金·金生水·水生木)","hook":"물을 주면 나무가 자란다 = 水生木 — 낳는 차례의 한 마디","say":"정원사가 못의 물을 길어 와 나무에 붓는다 — 물이 나무를 낳는다, 水生木. 相生은 이렇게 다음 것을 낳아 기르는 차례다. 木은 타서 火를 낳고, 火는 재가 되어 土를 낳고, 土는 속에서 金을 낳고, 金은 물을 맺어 水를 낳고, 水는 다시 木을 기른다. 과수원으로는 오른쪽 나무에서 아래 모닥불, 가운데 흙, 왼쪽 쇠, 위쪽 못, 다시 나무다.","box":[1225,130,483,389],"src":["OH-03-02"],"tts":"정원사가 못의 물을 길어 와 나무에 붓는다, 물이 나무를 낳는다, 수생목. 상생은 이렇게 다음 것을 낳아 기르는 차례다. 목은 타서 화를 낳고, 화는 재가 되어 토를 낳고, 토는 속에서 금을 낳고, 금은 물을 맺어 수를 낳고, 수는 다시 목을 기른다. 과수원으로는 오른쪽 나무에서 아래 모닥불, 가운데 흙, 왼쪽 쇠, 위쪽 못, 다시 나무다."},{"n":2,"obj":"나무줄기에 깊이 박힌 쇠도끼 · 왼쪽 구역의 도끼·낫 걸이","fact":"相剋 — 木剋土 · 土剋水 · 水剋火 · 火剋金 · 金剋木","hook":"쇠도끼가 나무를 찍는다 = 金剋木 — 누르는 차례의 한 마디","say":"나무줄기에 쇠도끼가 박혔다 — 왼쪽 걸이에서 온 쇠가 나무를 이긴다, 金剋木. 相剋은 하나 건너 누르는 차례다. 나무뿌리가 흙을 뚫고, 흙 둑이 물을 막고, 물이 불을 끄고, 불이 쇠를 녹이고, 쇠가 나무를 찍는다 — 木剋土, 土剋水, 水剋火, 火剋金, 金剋木. 相生 차례 木火土金水에서 한 칸씩 건너뛰면 된다.","box":[[1585,259,195,259],[72,281,252,288]],"src":["OH-03-03"],"tts":"나무줄기에 쇠도끼가 박혔다, 왼쪽 걸이에서 온 쇠가 나무를 이긴다, 금극목. 상극은 하나 건너 누르는 차례다. 나무뿌리가 흙을 뚫고, 흙 둑이 물을 막고, 물이 불을 끄고, 불이 쇠를 녹이고, 쇠가 나무를 찍는다, 목극토, 토극수, 수극화, 화극금, 금극목. 상생 차례 목화토금수에서 한 칸씩 건너뛰면 된다."},{"n":3,"obj":"위쪽 검은 구역의 둥근 못 · 점 하나짜리 흰 판","fact":"水 — 生數 1 · 成數 6 (北)","hook":"점 하나 = 生數 1 · 가운데 흙의 5를 더하면 成數 6","say":"위쪽 검은 구역, 못 곁의 흰 판에 점이 하나 — 水의 生數는 1이다. 북쪽, 검은색. 成數는 여기에 가운데 흙의 다섯을 더한다 — 하나 더하기 다섯, 6. 水는 1과 6. 生數는 낳는 수, 成數는 이루는 수 — 흙을 만나야 이루어진다. 生成數는 水 1·6, 火 2·7, 木 3·8, 金 4·9, 土 5·10 차례다.","box":[[440,50,324,202],[793,29,461,245]],"src":["CI-12-03"],"tts":"위쪽 검은 구역, 못 곁의 흰 판에 점이 하나, 수의 생수는 1이다. 북쪽, 검은색. 성수는 여기에 가운데 흙의 다섯을 더한다, 하나 더하기 다섯, 6. 수는 1과 6. 생수는 낳는 수, 성수는 이루는 수, 흙을 만나야 이루어진다. 생성수는 수 1, 6, 화 2, 7, 목 3, 8, 금 4, 9, 토 5, 10 차례다."},{"n":4,"obj":"아래쪽 붉은 구역의 모닥불 · 점 둘짜리 흰 판","fact":"火 — 生數 2 · 成數 7 (南)","hook":"점 둘 = 生數 2 · 5를 더하면 成數 7","say":"아래쪽 붉은 구역, 모닥불 곁의 판에 점이 둘 — 火의 生數는 2. 남쪽, 붉은색. 다섯을 더해 成數는 7. 火는 2와 7. 成數만 물으면 木은 8, 火는 7이다.","box":[[865,879,317,209],[1268,822,216,252]],"src":["CI-12-01"],"tts":"아래쪽 붉은 구역, 모닥불 곁의 판에 점이 둘, 화의 생수는 2. 남쪽, 붉은색. 다섯을 더해 성수는 7. 화는 2와 7. 성수만 물으면 목은 8, 화는 7이다."},{"n":5,"obj":"오른쪽 초록 구역의 큰 나무 · 점 셋짜리 흰 판","fact":"木 — 生數 3 · 成數 8 (東)","hook":"점 셋 = 生數 3 · 5를 더하면 成數 8","say":"오른쪽 초록 구역, 나무 아래 판에 점이 셋 — 木의 生數는 3. 동쪽, 푸른색. 다섯을 더해 成數는 8. 木은 3과 8.","box":[[1643,598,360,238],[1492,29,310,490]],"src":[],"tts":"오른쪽 초록 구역, 나무 아래 판에 점이 셋, 목의 생수는 3. 동쪽, 푸른색. 다섯을 더해 성수는 8. 목은 3과 8."},{"n":6,"obj":"왼쪽 흰 구역의 도끼·낫 걸이 · 점 넷짜리 흰 판","fact":"金 — 生數 4 · 成數 9 (西)","hook":"점 넷 = 生數 4 · 5를 더하면 成數 9","say":"왼쪽 흰 구역, 쇠 연장 걸이 곁의 판에 점이 넷 — 金의 生數는 4. 서쪽, 흰색. 다섯을 더해 成數는 9. 金은 4와 9. 『金匱眞言論』이 적는 수도 金 9, 水 6이다.","box":[[151,497,360,187],[72,281,252,288]],"src":["CI-12-02"],"tts":"왼쪽 흰 구역, 쇠 연장 걸이 곁의 판에 점이 넷, 금의 생수는 4. 서쪽, 흰색. 다섯을 더해 성수는 9. 금은 4와 9. 금궤진언론이 적는 수도 금 9, 수 6이다."},{"n":7,"obj":"가운데 누런 구역의 삽 꽂힌 흙무더기 · 점 다섯짜리 흰 판","fact":"土 — 生數 5 · 成數 10 (中央)","hook":"점 다섯 = 生數 5 · 5를 더하면 成數 10 · 다른 넷의 成數도 이 5를 얻어 이뤄진다","say":"가운데 누런 구역, 흙무더기 곁의 판에 점이 다섯 — 土의 生數는 5. 가운데, 누런색. 다섯을 더해 成數는 10. 다른 넷의 成數는 모두 이 흙의 5를 얻어 이루어진다. 다만 『金匱眞言論』은 土에만 成數 10이 아니라 生數 5를 쓴다.","box":[865,382,490,295],"src":[],"tts":"가운데 누런 구역, 흙무더기 곁의 판에 점이 다섯, 토의 생수는 5. 가운데, 누런색. 다섯을 더해 성수는 10. 다른 넷의 성수는 모두 이 흙의 5를 얻어 이루어진다. 다만 금궤진언론은 토에만 성수 10이 아니라 생수 5를 쓴다."},{"n":8,"obj":"점 하나 · 둘 · 셋 · 넷 · 다섯 — 흰 판 다섯 장","fact":"生成 순서 水→火→木→金→土 ≠ 相生 순서 木→火→土→金→水","hook":"점 수대로: 위(水) → 아래(火) → 오른쪽(木) → 왼쪽(金) → 가운데(土)","say":"흰 판을 점 수대로 센다. 하나는 위의 水, 둘은 아래의 火, 셋은 오른쪽 木, 넷은 왼쪽 金, 다섯은 가운데 土 — 五行이 생겨난 차례, 水火木金土다. 낳는 차례인 相生 木火土金水와 다르다. 위와 아래, 오른쪽과 왼쪽, 그리고 가운데 — 십자를 긋는 순서로 외운다.","box":[[440,50,324,202],[865,879,317,209],[1643,598,360,238],[151,497,360,187],[872,483,303,187]],"src":["OH-03-01"],"tts":"흰 판을 점 수대로 센다. 하나는 위의 수, 둘은 아래의 화, 셋은 오른쪽 목, 넷은 왼쪽 금, 다섯은 가운데 토, 오행이 생겨난 차례, 수화목금토다. 낳는 차례인 상생 목화토금수와 다르다. 위와 아래, 오른쪽과 왼쪽, 그리고 가운데, 십자를 긋는 순서로 외운다."},{"n":9,"kind":"review","obj":"과수원 한 바퀴 — 못 · 모닥불 · 나무 · 연장 걸이 · 흙무더기","fact":"水1·6 火2·7 木3·8 金4·9 土5·10 / 相生 木火土金水 · 相剋 한 칸 건너","hook":"점 + 5 = 成數 · 물 주기 = 相生 · 도끼 = 相剋","say":"다시 한 바퀴. 위 못 — 水 1과 6. 아래 모닥불 — 火 2와 7. 오른쪽 나무 — 木 3과 8. 왼쪽 쇠 연장 — 金 4와 9. 가운데 흙 — 土 5와 10. 물 주는 정원사는 相生, 낳는 차례 木火土金水. 나무에 박힌 도끼는 相剋, 한 칸 건너 누른다. 생겨난 차례는 점 수대로 水火木金土.","box":[[793,29,461,245],[1268,822,216,252],[1492,29,310,490],[72,281,252,288],[865,382,490,295]],"src":[],"tts":"다시 한 바퀴. 위 못, 수 1과 6. 아래 모닥불, 화 2와 7. 오른쪽 나무, 목 3과 8. 왼쪽 쇠 연장, 금 4와 9. 가운데 흙, 토 5와 10. 물 주는 정원사는 상생, 낳는 차례 목화토금수. 나무에 박힌 도끼는 상극, 한 칸 건너 누른다. 생겨난 차례는 점 수대로 수화목금토."}],"has_image":true},{"id":"yyox-05","title":"金匱眞言論 다섯 방위 — 竅·數·音·臭 (일반 배속과 갈리는 자리)","place":"금 궤짝 다섯을 방위대로 놓은 금고방","image":"images/lessons/yyox-05.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"돌 금고방에 방위대로 놓인 금 궤짝 다섯","fact":"金匱眞言論 — 다섯 방위의 色·臟·竅·數·音·臭","hook":"금 궤짝 = 金匱 · 띠 색 = 방위의 색 · 뚜껑 그림 = 開竅 · 흰 판 점의 합 = 數 · 곁의 물건 = 音과 臭","say":"금 궤짝에 넣어 둔 참된 말 — 『素問·金匱眞言論』이다. 금 궤짝 다섯이 방위대로 놓였다. 위가 北, 오른쪽이 東, 아래가 南, 왼쪽이 西, 그리고 가운데. 띠 색이 방위의 색이고, 뚜껑 안쪽 그림이 그 장부가 열리는 구멍, 곁의 흰 판 점을 모두 더한 것이 수, 곁의 물건이 소리와 냄새다. 흔히 아는 배속과 갈리는 자리가 셋 있다.","box":null,"src":[],"tts":"금 궤짝에 넣어 둔 참된 말, 소문, 금궤진언론이다. 금 궤짝 다섯이 방위대로 놓였다. 위가 북, 오른쪽이 동, 아래가 남, 왼쪽이 서, 그리고 가운데. 띠 색이 방위의 색이고, 뚜껑 안쪽 그림이 그 장부가 열리는 구멍, 곁의 흰 판 점을 모두 더한 것이 수, 곁의 물건이 소리와 냄새다. 흔히 아는 배속과 갈리는 자리가 셋 있다."},{"n":1,"obj":"초록 띠 궤짝 — 뚜껑의 큰 눈 · 점 다섯 판과 점 셋 판 · 누린내 나는 뿔 큰 숫양","fact":"東方 靑 → 肝 — 開竅 目 · 數 8 · 音 角 · 臭 臊","hook":"눈 = 目 · 5 + 3 = 8 · 뿔 = 角 · 숫양 누린내 = 臊","say":"오른쪽 초록 띠 궤짝이 東方이다. 푸른빛이 肝으로 통한다. 뚜껑에 큰 눈 — 開竅於目. 흰 판은 다섯과 셋, 더해서 8 — 木의 成數다. 곁의 숫양은 뿔이 크다 — 뿔 각(角), 木의 소리다. 털에서 누린내가 난다 — 누린내 조(臊).","box":[1420,144,598,548],"src":["CI-07","OGI-OUN-06-01","CI-12-01"],"tts":"오른쪽 초록 띠 궤짝이 동방이다. 푸른빛이 간으로 통한다. 뚜껑에 큰 눈, 개규어목. 흰 판은 다섯과 셋, 더해서 8, 목의 성수다. 곁의 숫양은 뿔이 크다, 뿔 각, 목의 소리다. 털에서 누린내가 난다, 누린내 조."},{"n":2,"obj":"붉은 띠 궤짝 — 뚜껑의 큰 귀 · 점 다섯 판과 점 둘 판 · 그을려 검은 연기 나는 징","fact":"南方 赤 → 心 — 開竅 耳(★) · 數 7 · 音 徵 · 臭 焦","hook":"귀 = 耳(혀가 아님) · 5 + 2 = 7 · 징 = 徵 · 탄내 = 焦","say":"아래쪽 붉은 띠 궤짝이 南方이다. 붉은빛이 心으로 통한다. 뚜껑에는 혀가 아니라 큰 귀 — 이 편은 心이 귀로 열린다고 한다, 開竅於耳. 함정 자리다. 흰 판은 다섯과 둘, 더해서 7 — 火의 成數. 곁의 징이 火의 소리다 — 글자는 부를 징(徵), 소리 이름으로는 치라고 읽는다. 징이 불에 그을려 탄내가 난다 — 탈 초(焦).","box":[1312,656,663,483],"src":["CI-08","OGI-OUN-06-02"],"tts":"아래쪽 붉은 띠 궤짝이 남방이다. 붉은빛이 심으로 통한다. 뚜껑에는 혀가 아니라 큰 귀, 이 편은 심이 귀로 열린다고 한다, 개규어이. 함정 자리다. 흰 판은 다섯과 둘, 더해서 7, 화의 성수. 곁의 징이 화의 소리다, 글자는 부를 징, 소리 이름으로는 치라고 읽는다. 징이 불에 그을려 탄내가 난다, 탈 초."},{"n":3,"obj":"누런 띠 궤짝 — 뚜껑의 큰 입 · 점 다섯 판 하나 · 향 연기와 꽃에 둘러싸인 금빛 궁궐 모형","fact":"中央 黃 → 脾 — 開竅 口 · 數 5(★生數) · 音 宮 · 臭 香","hook":"입 = 口 · 판 하나뿐 5 = 土만 生數 · 궁궐 = 宮 · 향 연기 = 香","say":"가운데 누런 띠 궤짝이 中央이다. 누런빛이 脾로 통한다. 뚜껑에 큰 입 — 開竅於口. 흰 판은 다섯 하나뿐 — 수는 5다. 다른 넷은 다섯에 제 수를 더한 成數를 쓰는데, 土만 成數 10이 아니라 生數 5를 쓴다. 河圖로 치면 土는 5와 10이다. 곁의 금빛 궁궐이 土의 소리 — 집 궁(宮). 향 연기가 피어오른다 — 향기 향(香).","box":[764,389,663,483],"src":["CI-09","OGI-OUN-06-03","CI-12-02"],"tts":"가운데 누런 띠 궤짝이 중앙이다. 누런빛이 비로 통한다. 뚜껑에 큰 입, 개규어구. 흰 판은 다섯 하나뿐, 수는 5다. 다른 넷은 다섯에 제 수를 더한 성수를 쓰는데, 토만 성수 10이 아니라 생수 5를 쓴다. 하도로 치면 토는 5와 10이다. 곁의 금빛 궁궐이 토의 소리, 집 궁. 향 연기가 피어오른다, 향기 향."},{"n":4,"obj":"흰 띠 궤짝 — 뚜껑의 큰 코 · 점 다섯 판과 점 넷 판 · 냄새 나는 날생선을 든 봇짐 상인","fact":"西方 白 → 肺 — 開竅 鼻 · 數 9 · 音 商 · 臭 腥","hook":"코 = 鼻 · 5 + 4 = 9 · 상인 = 商 · 생선 비린내 = 腥","say":"왼쪽 흰 띠 궤짝이 西方이다. 흰빛이 肺로 통한다. 뚜껑에 큰 코 — 開竅於鼻. 흰 판은 다섯과 넷, 더해서 9 — 金의 成數. 곁에 선 사람은 봇짐을 진 상인이다 — 장사 상(商), 金의 소리다. 손에 든 날생선에서 비린내가 난다 — 비릴 성(腥).","box":[79,540,613,526],"src":["CI-10","OGI-OUN-06-04"],"tts":"왼쪽 흰 띠 궤짝이 서방이다. 흰빛이 폐로 통한다. 뚜껑에 큰 코, 개규어비. 흰 판은 다섯과 넷, 더해서 9, 금의 성수. 곁에 선 사람은 봇짐을 진 상인이다, 장사 상, 금의 소리다. 손에 든 날생선에서 비린내가 난다, 비릴 성."},{"n":5,"obj":"검은 띠 궤짝 — 뚜껑의 둥근 구멍 둘 · 점 다섯 판과 점 하나 판 · 깨진 썩은 알에 꽂힌 검은 깃털","fact":"北方 黑 → 腎 — 開竅 二陰(★) · 數 6 · 音 羽 · 臭 腐","hook":"구멍 둘 = 二陰(귀가 아님) · 5 + 1 = 6 · 깃털 = 羽 · 썩은 알 = 腐","say":"위쪽 검은 띠 궤짝이 北方이다. 검은빛이 腎으로 통한다. 뚜껑에는 귀가 아니라 구멍 둘 — 앞뒤 두 陰, 開竅於二陰. 귀는 이 편에서 心이 가져갔다. 흔히 외우는 배속에서는 腎이 귀와 二陰에 함께 열린다. 흰 판은 다섯과 하나, 더해서 6 — 水의 成數. 곁의 검은 깃털이 水의 소리 — 깃 우(羽). 깨진 알이 썩어 냄새가 난다 — 썩을 부(腐).","box":[699,22,656,396],"src":["CI-11","OGI-OUN-06-05","JS-SIN-04","JS-CORE-07-05"],"tts":"위쪽 검은 띠 궤짝이 북방이다. 검은빛이 신으로 통한다. 뚜껑에는 귀가 아니라 구멍 둘, 앞뒤 두 음, 개규어이음. 귀는 이 편에서 심이 가져갔다. 흔히 외우는 배속에서는 신이 귀와 이음에 함께 열린다. 흰 판은 다섯과 하나, 더해서 6, 수의 성수. 곁의 검은 깃털이 수의 소리, 깃 우. 깨진 알이 썩어 냄새가 난다, 썩을 부."},{"n":6,"kind":"review","obj":"금고방 한 바퀴 — 초록 · 붉은 · 누런 · 흰 · 검은 띠 궤짝","fact":"竅 目·耳·口·鼻·二陰 / 數 8·7·5·9·6 / 音 角徵宮商羽 / 臭 臊焦香腥腐","hook":"함정 셋: 心 = 耳 · 腎 = 二陰 · 土 = 5","say":"木火土金水 차례로 다시. 뚜껑 그림은 눈, 귀, 입, 코, 구멍 둘. 흰 판은 8, 7, 5, 9, 6. 물건은 뿔, 징, 궁궐, 상인, 깃털 — 角徵宮商羽. 냄새는 누린내, 탄내, 향내, 비린내, 썩은내. 함정은 셋 — 心이 귀, 腎이 二陰, 土만 5.","box":[[1420,144,598,548],[1312,656,663,483],[764,389,663,483],[79,540,613,526],[699,22,656,396]],"src":[],"tts":"목화토금수 차례로 다시. 뚜껑 그림은 눈, 귀, 입, 코, 구멍 둘. 흰 판은 8, 7, 5, 9, 6. 물건은 뿔, 징, 궁궐, 상인, 깃털, 각치궁상우. 냄새는 누린내, 탄내, 향내, 비린내, 썩은내. 함정은 셋, 심이 귀, 신이 이음, 토만 5."}],"has_image":true},{"id":"yyox-06","title":"宣明五氣의 길 — 五味所入 · 五味所走 · 五精所并 (+ 靈樞 五果·五菜)","place":"다섯 맛 주막 거리","image":"images/lessons/yyox-06.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"천막 색이 다른 다섯 주막 — 초록 · 붉은 · 누런 · 흰 · 검은","fact":"宣明五氣 — 五味가 들어가는 곳(入) · 달려가는 곳(走) · 精氣가 몰리면(并)","hook":"왼쪽부터 木火土金水 = 신맛 · 쓴맛 · 단맛 · 매운맛 · 짠맛 · 손님 = 그 맛이 들어가는 臟","say":"다섯 맛을 파는 주막 거리다. 천막 색이 왼쪽부터 초록, 붉은색, 누런색, 흰색, 검은색 — 木火土金水 차례다. 좌판에는 그 집의 맛과 과일과 채소가 놓였고, 앞에는 그 맛이 찾아가는 장부의 사람이 섰고, 길 위로는 그 맛이 달려가는 곳이 뛰어나간다. 『素問·宣明五氣』의 표들이다.","box":null,"src":[],"tts":"다섯 맛을 파는 주막 거리다. 천막 색이 왼쪽부터 초록, 붉은색, 누런색, 흰색, 검은색, 목화토금수 차례다. 좌판에는 그 집의 맛과 과일과 채소가 놓였고, 앞에는 그 맛이 찾아가는 장부의 사람이 섰고, 길 위로는 그 맛이 달려가는 곳이 뛰어나간다. 소문, 선명오기의 표들이다."},{"n":1,"obj":"좌판 왼쪽의 맛 다섯 — 자른 레몬 · 김 나는 커피 · 꿀단지 · 붉은 고추 · 소금 더미와 소금통","fact":"五味所入 — 酸入肝 · 苦入心 · 甘入脾 · 辛入肺 · 鹹入腎","hook":"레몬 → 장군 · 커피 → 임금 · 꿀 → 농부 · 고추 → 재상 · 소금 → 장사","say":"주막마다 좌판 왼쪽에 그 집의 맛이 놓였다. 초록 천막은 신 레몬 — 손님은 장군 肝, 酸入肝. 붉은 천막은 쓴 커피 — 임금 心, 苦入心. 누런 천막은 단 꿀 — 농부 脾, 甘入脾. 흰 천막은 매운 고추 — 재상 肺, 辛入肺. 검은 천막은 짠 소금 — 장사 腎, 鹹入腎. 五味所入이다.","box":[[69,458,107,110],[487,440,107,125],[896,411,101,157],[1283,455,111,107],[1681,440,117,125]],"src":["BC-5M-04"],"tts":"주막마다 좌판 왼쪽에 그 집의 맛이 놓였다. 초록 천막은 신 레몬, 손님은 장군 간, 산입간. 붉은 천막은 쓴 커피, 임금 심, 고입심. 누런 천막은 단 꿀, 농부 비, 감입비. 흰 천막은 매운 고추, 재상 폐, 신입폐. 검은 천막은 짠 소금, 장사 신, 함입신. 오미소입이다."},{"n":2,"obj":"길 위를 달려 나가는 다섯 — 활 · 뼈 · 고깃덩이 · 바람 구름 · 핏방울","fact":"宣明五氣 五味所走 — 酸走筋 · 苦走骨 · 甘走肉 · 辛走氣 · 鹹走血","hook":"활시위 = 힘줄(筋) · 뼈 = 骨 · 고기 = 肉 · 바람 = 氣 · 핏방울 = 血","say":"맛은 들어간 뒤 달려가는 곳이 따로 있다 — 달릴 주(走). 신맛 집 앞에서는 활이 달린다 — 활시위는 힘줄, 酸走筋. 쓴맛 집 앞에서는 뼈 — 苦走骨. 단맛 집 앞에서는 고깃덩이 — 甘走肉. 매운맛 집 앞에서는 바람 구름 — 辛走氣. 짠맛 집 앞에서는 핏방울 — 鹹走血. 그래서 氣의 병에는 매운 것을, 血의 병에는 짠 것을, 뼈의 병에는 쓴 것을, 살의 병에는 단 것을, 힘줄의 병에는 신 것을 많이 먹지 말라 한다 — 五味所禁.","box":[[331,775,164,236],[682,859,157,102],[994,836,169,130],[1316,836,200,130],[1686,822,121,135]],"src":["CI-15"],"tts":"맛은 들어간 뒤 달려가는 곳이 따로 있다, 달릴 주. 신맛 집 앞에서는 활이 달린다, 활시위는 힘줄, 산주근. 쓴맛 집 앞에서는 뼈, 고주골. 단맛 집 앞에서는 고깃덩이, 감주육. 매운맛 집 앞에서는 바람 구름, 신주기. 짠맛 집 앞에서는 핏방울, 함주혈. 그래서 기의 병에는 매운 것을, 혈의 병에는 짠 것을, 뼈의 병에는 쓴 것을, 살의 병에는 단 것을, 힘줄의 병에는 신 것을 많이 먹지 말라 한다, 오미소금."},{"n":3,"obj":"오른쪽 아래 침 묶음 — 커피잔에 끈으로 묶인 핏방울 · 소금통에 끈으로 묶인 뼈","fact":"九針論 — 苦走血 · 鹹走骨 (宣明五氣와 苦·鹹이 뒤바뀜)","hook":"침 묶음 = 九針論 · 커피 + 핏방울 = 苦走血 · 소금 + 뼈 = 鹹走骨","say":"오른쪽 아래 구석에 침 묶음이 섰다 — 『靈樞·九針論』이다. 여기서는 커피잔이 핏방울에, 소금통이 뼈에 묶였다 — 苦走血, 鹹走骨. 길 위의 宣明五氣와 쓴맛, 짠맛 둘이 뒤바뀐다. 宣明五氣는 쓴맛이 뼈, 짠맛이 피. 九針論은 쓴맛이 피, 짠맛이 뼈. 나머지 셋은 같다.","box":[1657,987,378,147],"src":["BC-5M-05"],"tts":"오른쪽 아래 구석에 침 묶음이 섰다, 영추, 구침론이다. 여기서는 커피잔이 핏방울에, 소금통이 뼈에 묶였다, 고주혈, 함주골. 길 위의 선명오기와 쓴맛, 짠맛 둘이 뒤바뀐다. 선명오기는 쓴맛이 뼈, 짠맛이 피. 구침론은 쓴맛이 피, 짠맛이 뼈. 나머지 셋은 같다."},{"n":4,"obj":"다섯 손님의 얼굴 — 손톱 무는 초록 갑옷 장군 · 웃는 붉은 용포 임금 · 기둥 뒤로 숨는 노란 옷 사람 · 우는 흰 도포 노인 · 벌벌 떠는 검은 옷 대머리","fact":"五精所并 — 肝 憂 · 心 喜 · 脾 畏 · 肺 悲 · 腎 恐 (虛而相并)","hook":"근심 · 웃음 · 겁내 숨음 · 눈물 · 벌벌 떪 = 憂 · 喜 · 畏 · 悲 · 恐","say":"손님들의 얼굴을 본다. 장군은 손톱을 물며 근심한다 — 精氣가 肝에 몰리면 근심 우(憂). 임금은 웃는다 — 心에 몰리면 기쁠 희(喜). 농부는 겁내어 기둥 뒤로 숨는다 — 농부의 脾에 몰리면 두려워할 외(畏). 재상은 운다 — 재상의 肺에 몰리면 슬플 비(悲). 장사는 벌벌 떤다 — 腎에 몰리면 무서울 공(恐). 『素問·宣明五氣』의 五精所并이다. 허한 곳으로 精氣가 몰려서 생긴다 — 虛而相并. 肝이 怒가 아니라 憂, 脾가 思가 아니라 畏인 것이 五志와 다른 자리다.","box":[[137,545,197,337],[581,552,182,323],[1103,555,143,272],[1417,555,150,306],[1763,559,193,308]],"src":["SUP-BYEONG-01","SUP-BYEONG-02","SUP-BYEONG-03","SUP-BYEONG-04","SUP-BYEONG-05","SUP-BYEONG-06"],"tts":"손님들의 얼굴을 본다. 장군은 손톱을 물며 근심한다, 정기가 간에 몰리면 근심 우. 임금은 웃는다, 심에 몰리면 기쁠 희. 농부는 겁내어 기둥 뒤로 숨는다, 농부의 비에 몰리면 두려워할 외. 재상은 운다, 재상의 폐에 몰리면 슬플 비. 장사는 벌벌 떤다, 신에 몰리면 무서울 공. 소문, 선명오기의 오정소병이다. 허한 곳으로 정기가 몰려서 생긴다, 허이상병. 간이 노가 아니라 우, 비가 사가 아니라 외인 것이 오지와 다른 자리다."},{"n":5,"obj":"좌판 가운데 과일 다섯 — 자두 · 살구 · 대추 · 복숭아 · 밤송이","fact":"五果(靈樞) — 李 · 杏 · 棗 · 桃 · 栗 (木火土金水) ★桃 = 金","hook":"자두 · 살구 · 대추 · 복숭아(흰 천막 = 金) · 밤","say":"좌판 가운데는 과일이다. 초록 집 자두 — 오얏 리(李). 붉은 집 살구 — 살구 행(杏). 누런 집 대추 — 대추 조(棗). 흰 집 복숭아 — 복숭아 도(桃). 검은 집 밤 — 밤 률(栗). 『靈樞』의 五果다. 대추가 土, 복숭아가 흰 집 곧 金의 과일이라는 것이 자주 나오는 함정이다.","box":[[179,461,86,98],[595,458,92,101],[994,464,104,101],[1392,461,95,98],[1796,450,117,110]],"src":["OHG-038"],"tts":"좌판 가운데는 과일이다. 초록 집 자두, 오얏 리. 붉은 집 살구, 살구 행. 누런 집 대추, 대추 조. 흰 집 복숭아, 복숭아 도. 검은 집 밤, 밤 률. 영추의 오과다. 대추가 토, 복숭아가 흰 집 곧 금의 과일이라는 것이 자주 나오는 함정이다."},{"n":6,"obj":"좌판 오른쪽 채소 다섯 — 부추 단 · 흰 알뿌리 염교 · 둥근 아욱 잎 · 파 · 콩잎과 콩꼬투리","fact":"五菜(靈樞) — 韭 · 薤 · 葵 · 蔥 · 藿 (木火土金水)","hook":"부추 · 염교 · 아욱 · 파 · 콩잎","say":"좌판 오른쪽은 채소다. 초록 집 부추 — 부추 구(韭). 붉은 집 흰 알뿌리 염교 — 염교 해(薤). 누런 집 둥근 잎 아욱 — 아욱 규(葵). 흰 집 파 — 파 총(蔥). 검은 집 콩잎 — 콩잎 곽(藿). 『靈樞』의 五菜다. 같은 차례로 五脈은 弦·鉤·代·毛·石, 五臟이 갈무리하는 것은 魂·神·意·魄·志다.","box":[[264,461,160,107],[689,455,138,112],[1088,447,131,115],[1485,455,159,104],[1910,441,108,127]],"src":["OHG2-009"],"tts":"좌판 오른쪽은 채소다. 초록 집 부추, 부추 구. 붉은 집 흰 알뿌리 염교, 염교 해. 누런 집 둥근 잎 아욱, 아욱 규. 흰 집 파, 파 총. 검은 집 콩잎, 콩잎 곽. 영추의 오채다. 같은 차례로 오맥은 현, 구, 대, 모, 석, 오장이 갈무리하는 것은 혼, 신, 의, 백, 지다."},{"n":7,"kind":"review","obj":"다섯 주막 한 줄 — 초록 · 붉은 · 누런 · 흰 · 검은 천막","fact":"入 肝心脾肺腎 / 走 筋骨肉氣血(九針論 苦血·鹹骨) / 并 憂喜畏悲恐","hook":"좌판(맛 · 과일 · 채소) → 손님(얼굴) → 길(달리는 것)","say":"왼쪽부터 다시. 신맛 집 — 肝, 힘줄, 근심, 자두, 부추. 쓴맛 집 — 心, 뼈, 기쁨, 살구, 염교. 단맛 집 — 脾, 살, 겁, 대추, 아욱. 매운맛 집 — 肺, 氣, 슬픔, 복숭아, 파. 짠맛 집 — 腎, 피, 무서움, 밤, 콩잎. 침 묶음의 九針論에서만 쓴맛이 피, 짠맛이 뼈.","box":[[36,173,404,843],[447,173,396,793],[853,173,393,796],[1254,173,389,796],[1650,173,389,790]],"src":[],"tts":"왼쪽부터 다시. 신맛 집, 간, 힘줄, 근심, 자두, 부추. 쓴맛 집, 심, 뼈, 기쁨, 살구, 염교. 단맛 집, 비, 살, 겁, 대추, 아욱. 매운맛 집, 폐, 기, 슬픔, 복숭아, 파. 짠맛 집, 신, 피, 무서움, 밤, 콩잎. 침 묶음의 구침론에서만 쓴맛이 피, 짠맛이 뼈."}],"has_image":true},{"id":"yyox-07","title":"나를 가운데 놓는 다섯 자리 — 旺相休囚死 · 五邪(虛·實·賊·微·正)","place":"고을 관아","image":"images/lessons/yyox-07.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"고을 관아 — 가운데 대청의 사또 의자 · 그 뒤 뒷방 · 앞의 낮은 책상 · 왼쪽 옥 · 오른쪽 형장","fact":"나를 가운데 놓는 다섯 자리 — 旺相休囚死와 五邪(虛·實·賊·微·正)","hook":"사또 의자 = 나(旺) · 앞 책상 = 내가 낳은 자식 · 뒷방 = 나를 낳은 어미 · 옥 = 나를 剋함 · 형장 = 내가 剋함","say":"고을 관아다. 가운데 사또 의자에 앉은 이가 나, 지금 철을 맡은 行이다. 앞의 낮은 책상에는 내가 낳은 자식이, 의자 뒤 뒷방에는 나를 낳은 어미가, 왼쪽 옥에는 나를 剋하는 이가, 오른쪽 형장에는 내가 剋하는 이가 있다. 이 다섯 자리에 붙인 이름이 旺相休囚死이고, 다섯 자리에서 나에게 오는 병이 五邪다. 그림은 長夏, 土가 사또인 철이다.","box":null,"src":[],"tts":"고을 관아다. 가운데 사또 의자에 앉은 이가 나, 지금 철을 맡은 행이다. 앞의 낮은 책상에는 내가 낳은 자식이, 의자 뒤 뒷방에는 나를 낳은 어미가, 왼쪽 옥에는 나를 극하는 이가, 오른쪽 형장에는 내가 극하는 이가 있다. 이 다섯 자리에 붙인 이름이 왕상휴수사이고, 다섯 자리에서 나에게 오는 병이 오사다. 그림은 장하, 토가 사또인 철이다."},{"n":1,"obj":"가운데 큰 사또 의자 · 그 앞의 낮은 책상 · 의자 뒤 침상 놓인 뒷방","fact":"旺 = 제철 자신(當令) · 相 = 제철이 낳는 자식 · 休 = 제철을 낳은 어미","hook":"의자 = 旺 · 곁에서 돕는 책상 = 相 · 쉬는 뒷방 = 休","say":"사또 의자가 旺이다 — 제철을 맡아 기운이 왕성하다, 當令. 앞의 낮은 책상이 相 — 도울 상(相), 제철이 낳는 자식이 곁에서 돕는다. 그 行의 눈으로 보면 제철은 나를 낳는 것, 生我者다. 의자 뒤 뒷방이 休 — 쉴 휴(休), 제철을 낳은 어미는 자식에게 令을 넘기고 쉰다. 그 行의 눈으로 보면 제철은 내가 낳은 것, 我生者다.","box":[[891,329,280,366],[829,901,399,197],[810,170,447,222]],"src":["OH-04-01","OH-04-02","OH-04-03"],"tts":"사또 의자가 왕이다, 제철을 맡아 기운이 왕성하다, 당령. 앞의 낮은 책상이 상, 도울 상, 제철이 낳는 자식이 곁에서 돕는다. 그 행의 눈으로 보면 제철은 나를 낳는 것, 생아자다. 의자 뒤 뒷방이 휴, 쉴 휴, 제철을 낳은 어미는 자식에게 영을 넘기고 쉰다. 그 행의 눈으로 보면 제철은 내가 낳은 것, 아생자다."},{"n":2,"obj":"왼쪽 굵은 창살의 옥 · 오른쪽 형장의 나무 기둥","fact":"囚 = 제철을 剋하는 것 · 死 = 제철에게 剋당하는 것","hook":"옥 = 囚(갇힘) · 형장 기둥 = 死","say":"왼쪽 옥이 囚 — 가둘 수(囚). 제철을 剋하는 行은 왕성한 제철에게 덤비지 못하고 갇힌다. 그 行의 눈으로 보면 제철은 내가 剋하는 것, 我克者다. 오른쪽 형장이 死 — 제철에게 剋당하는 行은 기운이 가장 없다. 그 行의 눈으로 보면 제철은 나를 剋하는 것, 克我者다.","box":[[0,476,497,667],[1766,458,197,558]],"src":["OH-04-04","OH-04-05"],"tts":"왼쪽 옥이 수, 가둘 수. 제철을 극하는 행은 왕성한 제철에게 덤비지 못하고 갇힌다. 그 행의 눈으로 보면 제철은 내가 극하는 것, 아극자다. 오른쪽 형장이 사, 제철에게 극당하는 행은 기운이 가장 없다. 그 행의 눈으로 보면 제철은 나를 극하는 것, 극아자다."},{"n":3,"obj":"사또 의자에 앉은 노란 옷 사람(농부) · 뒷방 침상에서 낮잠 자는 붉은 용포의 임금","fact":"長夏 — 土旺 · 金相 · 火休 · 木囚 · 水死 (長夏의 心 = 休)","hook":"농부(土)가 사또 = 長夏 · 임금(火)은 뒷방에서 쉼 = 火休","say":"그림의 철은 長夏다. 노란 옷 농부, 土가 사또 의자에 앉았다 — 土旺. 앞 책상의 흰 도포 노인은 土가 낳은 金 — 金相. 뒷방에서 낮잠 자는 붉은 용포 임금은 土를 낳은 火 — 火休. 옥의 초록 갑옷 장군은 土를 剋하는 木 — 木囚. 형장의 검은 옷 장사는 土에게 剋당하는 水 — 水死. 그래서 長夏의 心은 休다 — 火가 土를 낳고 令을 다 넘겨 쉰다.","box":[[922,334,216,355],[862,173,395,182]],"src":["OHG-050"],"tts":"그림의 철은 장하다. 노란 옷 농부, 토가 사또 의자에 앉았다, 토왕. 앞 책상의 흰 도포 노인은 토가 낳은 금, 금상. 뒷방에서 낮잠 자는 붉은 용포 임금은 토를 낳은 화, 화휴. 옥의 초록 갑옷 장군은 토를 극하는 목, 목수. 형장의 검은 옷 장사는 토에게 극당하는 수, 수사. 그래서 장하의 심은 휴다, 화가 토를 낳고 영을 다 넘겨 쉰다."},{"n":4,"obj":"뒷방 침상의 임금 쪽에서 사또 의자 뒤로 날아가는 베개","fact":"虛邪 — 從後來者(生我·어미에게서 옴) · 쉽게 물러난다","hook":"뒤(後)에서 온 푹신한 베개 = 虛邪","say":"이제 다섯 자리에서 사또에게 병이 온다. 뒷방의 임금 쪽에서 베개 하나가 등 뒤로 날아온다 — 뒤에서 오는 것, 從後來者, 虛邪다. 나를 낳은 어미 쪽에서 온 병 — 母病及子. 낳아 주는 기운을 끼고 와서 푹신한 베개처럼 쉽게 물러난다.","box":[1059,257,313,274],"src":["OH-05-01","OH-06-02"],"tts":"이제 다섯 자리에서 사또에게 병이 온다. 뒷방의 임금 쪽에서 베개 하나가 등 뒤로 날아온다, 뒤에서 오는 것, 종후래자, 허사다. 나를 낳은 어미 쪽에서 온 병, 모병급자. 낳아 주는 기운을 끼고 와서 푹신한 베개처럼 쉽게 물러난다."},{"n":5,"obj":"앞의 낮은 책상 곁에서 사또 쪽으로 검은 쇠공을 던지는 흰 도포 노인","fact":"實邪 — 從前來者(我生·자식에게서 옴) · 세력이 왕성","hook":"앞(前)에서 온 묵직한 쇠공 = 實邪","say":"앞 책상 곁의 흰 도포 노인이 검은 쇠공을 던진다 — 앞에서 오는 것, 從前來者, 實邪다. 내가 낳은 자식 쪽에서 온 병 — 자식이 어미의 기운을 훔친다, 子盜母氣. 쇠공처럼 묵직해 세력이 왕성하다.","box":[634,685,490,442],"src":["OH-05-02","OH-06-03"],"tts":"앞 책상 곁의 흰 도포 노인이 검은 쇠공을 던진다, 앞에서 오는 것, 종전래자, 실사다. 내가 낳은 자식 쪽에서 온 병, 자식이 어미의 기운을 훔친다, 자도모기. 쇠공처럼 묵직해 세력이 왕성하다."},{"n":6,"obj":"옥 창살 사이로 긴 창을 내지르는 초록 갑옷 장군","fact":"賊邪 — 從所不勝來者(克我) · 가장 위험 · 相乘에 해당","hook":"나를 이기는 쪽에서 온 창 = 賊邪(도둑 賊)","say":"옥의 장군이 창살 사이로 긴 창을 내지른다 — 내가 이기지 못하는 쪽에서 오는 것, 從所不勝來者, 賊邪다. 도둑 적(賊). 나를 剋하는 行이 덮치니 다섯 가운데 가장 위험하다 — 相乘이 이것이다. 木과 金으로 말하면, 金이 木을 剋하니 木에게 金은 所不勝이고 金에게 木은 所勝이다. 거꾸로 말하면 틀린다.","box":[58,540,649,497],"src":["OH-05-03","OH-06-04","OHG-026","OHG2-005"],"tts":"옥의 장군이 창살 사이로 긴 창을 내지른다, 내가 이기지 못하는 쪽에서 오는 것, 종소불승래자, 적사다. 도둑 적. 나를 극하는 행이 덮치니 다섯 가운데 가장 위험하다, 상승이 이것이다. 목과 금으로 말하면, 금이 목을 극하니 목에게 금은 소불승이고 금에게 목은 소승이다. 거꾸로 말하면 틀린다."},{"n":7,"obj":"형장 기둥에 묶인 채 작은 돌멩이를 튕기는 검은 옷 대머리 사람","fact":"微邪 — 從所勝來者(我克) · 가장 가볍다","hook":"내가 이기는 쪽에서 온 돌멩이 = 微邪(작을 微)","say":"형장 기둥에 묶인 장사가 작은 돌멩이를 튕긴다 — 내가 이기는 쪽에서 오는 것, 從所勝來者, 微邪다. 작을 미(微). 내가 剋하는 行이 거꾸로 건드리는 것이라 다섯 가운데 가장 가볍고, 눌러 다스릴 수 있다.","box":[1585,577,378,440],"src":["OH-05-04","OH-06-01"],"tts":"형장 기둥에 묶인 장사가 작은 돌멩이를 튕긴다, 내가 이기는 쪽에서 오는 것, 종소승래자, 미사다. 작을 미. 내가 극하는 행이 거꾸로 건드리는 것이라 다섯 가운데 가장 가볍고, 눌러 다스릴 수 있다."},{"n":8,"obj":"제 배를 두 손으로 움켜쥔 사또 의자의 노란 옷 사람","fact":"正邪 — 自病(제 장부가 스스로 앓음)","hook":"남이 던진 것 없이 제 배앓이 = 自病 = 正邪","say":"사또는 제 배를 움켜쥐고 있다 — 남에게서 온 것이 아니라 제 장부가 스스로 앓는다. 自病, 正邪다.","box":[922,334,216,355],"src":["OH-05-05"],"tts":"사또는 제 배를 움켜쥐고 있다, 남에게서 온 것이 아니라 제 장부가 스스로 앓는다. 자병, 정사다."},{"n":9,"kind":"review","obj":"관아 한 바퀴 — 뒷방 베개 · 앞 책상 쇠공 · 옥의 창 · 형장 돌멩이 · 사또의 배앓이","fact":"虛邪 後(母) · 實邪 前(子) · 賊邪 所不勝 · 微邪 所勝 · 正邪 自病 / 微\u003c虛\u003c實\u003c賊","hook":"베개 · 쇠공 · 창 · 돌멩이 · 배앓이 / 의자 旺 · 책상 相 · 뒷방 休 · 옥 囚 · 형장 死","say":"다시 본다. 뒷방 베개 — 뒤에서, 어미에게서 온 虛邪. 앞 책상 쇠공 — 앞에서, 자식에게서 온 實邪. 옥의 창 — 所不勝에서 온 賊邪. 형장 돌멩이 — 所勝에서 온 微邪. 사또의 배앓이 — 自病, 正邪. 『難經』 五十難이다. 가벼운 순서로 돌멩이, 베개, 쇠공, 창 — 微邪, 虛邪, 實邪, 賊邪. 자리 이름은 의자 旺, 책상 相, 뒷방 休, 옥 囚, 형장 死.","box":[[1059,257,313,274],[634,685,490,442],[58,540,649,497],[1585,577,378,440],[922,334,216,355]],"src":["OHG-025","OHG-027"],"tts":"다시 본다. 뒷방 베개, 뒤에서, 어미에게서 온 허사. 앞 책상 쇠공, 앞에서, 자식에게서 온 실사. 옥의 창, 소불승에서 온 적사. 형장 돌멩이, 소승에서 온 미사. 사또의 배앓이, 자병, 정사. 난경 오십난이다. 가벼운 순서로 돌멩이, 베개, 쇠공, 창, 미사, 허사, 실사, 적사. 자리 이름은 의자 왕, 책상 상, 뒷방 휴, 옥 수, 형장 사."}],"has_image":true},{"id":"yyox-08","title":"相生相剋의 균형과 깨짐 — 制化·亢害承制·勝復 ↔ 母子相及·相乘·相侮","place":"씨름판 셋과 긴 의자","image":"images/lessons/yyox-08.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"씨름판 셋과 긴 의자 — 판마다 초록 갑옷 장군 · 노란 옷 농부 · 흰 도포 노인","fact":"相生·相剋의 균형과 깨짐 — 制化·勝復 ↔ 母子相及·相乘·相侮","hook":"장군 = 木 · 농부 = 土 · 흰 도포 노인 = 金 · 검은 옷 대머리 = 水 / 왼쪽 판 고름 · 가운데 판 太過 · 오른쪽 판 不及","say":"씨름판 셋과 긴 의자다. 판마다 같은 세 사람이 나온다 — 초록 갑옷 장군은 木, 노란 옷 농부는 土, 흰 도포 노인은 金이다. 木은 土를 剋하고, 金은 木을 剋한다. 왼쪽 판은 눌러 주는 이가 있어 고른 판, 가운데 판은 장군이 너무 커진 판, 오른쪽 판은 장군이 너무 작아진 판이다. 긴 의자에는 어미와 자식이 앉았다.","box":null,"src":[],"tts":"씨름판 셋과 긴 의자다. 판마다 같은 세 사람이 나온다, 초록 갑옷 장군은 목, 노란 옷 농부는 토, 흰 도포 노인은 금이다. 목은 토를 극하고, 금은 목을 극한다. 왼쪽 판은 눌러 주는 이가 있어 고른 판, 가운데 판은 장군이 너무 커진 판, 오른쪽 판은 장군이 너무 작아진 판이다. 긴 의자에는 어미와 자식이 앉았다."},{"n":1,"obj":"왼쪽 판 — 넘어진 농부 앞에서 두 팔을 치켜들고 으스대는 장군","fact":"亢則害 承乃制 制則生化 — 지나치면 해롭고, 뒤이은 기운이 눌러야 生化(制化)","hook":"으스대며 치솟음 = 亢 · 뒤에서 샅바를 잡음 = 承乃制","say":"왼쪽 판. 장군이 농부를 넘어뜨리고 두 팔을 치켜들며 으스댄다 — 木이 지나치게 뻗쳤다, 높을 항(亢). 지나치면 해가 된다, 亢則害. 그러나 뒤에서 흰 도포 노인이 샅바를 잡아당긴다 — 뒤이어 받치는 기운이 누른다, 承乃制. 눌러 주어야 낳고 기르는 일이 이어진다, 制則生化. 낳음과 누름이 함께 있어 평형을 지키는 것이 制化다. 『素問·六微旨大論』. 몸의 평형을 말하는 陰平陽秘와 구별한다.","box":[202,483,468,486],"src":["OH-07","OHG2-014","SU2-OH-02"],"tts":"왼쪽 판. 장군이 농부를 넘어뜨리고 두 팔을 치켜들며 으스댄다, 목이 지나치게 뻗쳤다, 높을 항. 지나치면 해가 된다, 항즉해. 그러나 뒤에서 흰 도포 노인이 샅바를 잡아당긴다, 뒤이어 받치는 기운이 누른다, 승내제. 눌러 주어야 낳고 기르는 일이 이어진다, 제즉생화. 낳음과 누름이 함께 있어 평형을 지키는 것이 제화다. 소문, 육미지대론. 몸의 평형을 말하는 음평양비와 구별한다."},{"n":2,"obj":"왼쪽 판 — 뒤에서 장군의 샅바를 두 손으로 잡아당기는 흰 도포 노인","fact":"勝復 — 勝氣 뒤에 復氣 · 子復母仇: 木이 土를 치면 土의 자식 金이 木을 누른다","hook":"먼저 이김(勝) → 뒤에서 되갚음(復) · 노인(金)은 농부(土)의 자식","say":"샅바를 당기는 흰 도포 노인을 다시 본다. 먼저 장군이 이겼고, 뒤이어 노인이 되갚는다 — 이길 승(勝), 돌아올 복(復), 勝復이다. 노인 金은 넘어진 농부 土가 낳은 자식이다. 木이 土를 치니 土의 자식 金이 木을 눌러 어미의 원수를 갚는다 — 子復母仇. 한 行이 지나치면 반드시 되갚음이 따라와 다시 고르게 된다. 運氣에서는 먼저 勝氣, 나중에 復氣라 한다.","box":[584,458,226,409],"src":["OHG-031","OH-10"],"tts":"샅바를 당기는 흰 도포 노인을 다시 본다. 먼저 장군이 이겼고, 뒤이어 노인이 되갚는다, 이길 승, 돌아올 복, 승복이다. 노인 금은 넘어진 농부 토가 낳은 자식이다. 목이 토를 치니 토의 자식 금이 목을 눌러 어미의 원수를 갚는다, 자복모구. 한 행이 지나치면 반드시 되갚음이 따라와 다시 고르게 된다. 운기에서는 먼저 승기, 나중에 복기라 한다."},{"n":3,"obj":"긴 의자 — 재채기 구름을 곁의 꼬마 장군에게 뿜는 검은 옷 대머리 사람","fact":"母病及子 — 어미의 병이 자식에게 미친다(예: 腎水 → 肝木)","hook":"검은 옷(水)은 꼬마 장군(木)의 어미 · 재채기가 옮음 = 母病及子","say":"맨 왼쪽 긴 의자. 검은 옷 대머리 사람이 재채기를 하고, 구름이 곁의 꼬마 장군에게 날아간다. 검은 옷은 水, 꼬마 장군은 水가 낳은 木이다. 어미의 병이 자식에게 미친다 — 母病及子. 腎의 병이 肝으로 옮는 꼴이다.","box":[123,163,476,424],"src":["OHG-028"],"tts":"맨 왼쪽 긴 의자. 검은 옷 대머리 사람이 재채기를 하고, 구름이 곁의 꼬마 장군에게 날아간다. 검은 옷은 수, 꼬마 장군은 수가 낳은 목이다. 어미의 병이 자식에게 미친다, 모병급자. 신의 병이 간으로 옮는 꼴이다."},{"n":4,"obj":"긴 의자 — 큰 물병에 빨대를 꽂아 빨아 마시는 꼬마 장군","fact":"子病及母 · 子盜母氣 — 자식이 어미의 기운을 축낸다(肝陽上亢 = 水不涵木)","hook":"자식(木)이 어미(水)의 물을 다 빨아 마심 = 子盜母氣","say":"꼬마 장군은 어미 곁에서 큰 물병에 빨대를 꽂아 물을 다 빨아 마신다. 자식이 어미의 기운을 훔친다 — 子盜母氣. 자식의 병이 어미에게 미치는 子病及母다. 肝陽上亢이 이 꼴이다 — 腎의 물이 말라 나무를 적시지 못한다, 水不涵木.","box":[378,223,216,277],"src":[],"tts":"꼬마 장군은 어미 곁에서 큰 물병에 빨대를 꽂아 물을 다 빨아 마신다. 자식이 어미의 기운을 훔친다, 자도모기. 자식의 병이 어미에게 미치는 자병급모다. 간양상항이 이 꼴이다, 신의 물이 말라 나무를 적시지 못한다, 수불함목."},{"n":5,"obj":"가운데 판 — 납작 엎드린 농부를 깔고 누르는 거인 장군","fact":"相乘 — 剋하는 방향으로 지나치게 누름: 木乘土(木旺乘土 · 土虛木乘)","hook":"올라탐(乘) = 相乘 · 본디 이기는 상대를 한도 넘게 누름","say":"가운데 판. 거인이 된 장군이 농부를 깔고 앉았다 — 탈 승(乘), 相乘이다. 木이 土를 剋하는 것은 본디 방향인데 한도를 넘었다. 내 기운이 남아돌아 이기는 상대를 올라탄다 — 其氣有餘則乘其所勝. 두 꼴이 있다. 木이 너무 세서 타는 木旺乘土, 土가 약해서 타는 土虛木乘. 肝의 병을 보면 脾로 옮을 것을 안다는 말이 相乘의 예이고, 五邪로는 賊邪다.","box":[862,432,435,285],"src":["OH-08","OHG2-002","OHG2-003","OHG-029","OHG-026"],"tts":"가운데 판. 거인이 된 장군이 농부를 깔고 앉았다, 탈 승, 상승이다. 목이 토를 극하는 것은 본디 방향인데 한도를 넘었다. 내 기운이 남아돌아 이기는 상대를 올라탄다, 기기유여즉승기소승. 두 꼴이 있다. 목이 너무 세서 타는 목왕승토, 토가 약해서 타는 토허목승. 간의 병을 보면 비로 옮을 것을 안다는 말이 상승의 예이고, 오사로는 적사다."},{"n":6,"obj":"가운데 판 — 거인 장군의 손에 수염을 잡아당겨져 찡그리는 흰 도포 노인","fact":"相侮 — 剋을 거슬러 업신여김: 木侮金(木火刑金 = 肝火犯肺)","hook":"수염을 잡아당김 = 업신여김(侮) · 본디 나를 누르던 쪽에게 거꾸로","say":"거인 장군의 손은 흰 도포 노인의 수염을 잡아당긴다 — 업신여길 모(侮), 相侮다. 金은 본디 木을 剋하는 쪽인데 거꾸로 당한다 — 反克. 木火刑金, 肝火가 肺를 범하는 것이 이 꼴이다. 내 기운이 남아돌면 나를 이기던 쪽을 업신여기고, 그쪽 기운이 모자라도 얕보고 업신여긴다. 자식이 어미를 乘한다, 侮한다는 식의 말은 相侮가 아니다.","box":[1225,311,233,372],"src":["OH-09","OHG-030","OHG2-004"],"tts":"거인 장군의 손은 흰 도포 노인의 수염을 잡아당긴다, 업신여길 모, 상모다. 금은 본디 목을 극하는 쪽인데 거꾸로 당한다, 반극. 목화형금, 간화가 폐를 범하는 것이 이 꼴이다. 내 기운이 남아돌면 나를 이기던 쪽을 업신여기고, 그쪽 기운이 모자라도 얕보고 업신여긴다. 자식이 어미를 승한다, 모한다는 식의 말은 상모가 아니다."},{"n":7,"obj":"가운데 판 — 남들의 두 배로 커진 거인 장군의 몸집","fact":"太過 — 氣有餘則制己所勝而侮所不勝: 木 太過 → 木乘土 + 木侮金","hook":"너무 큼 = 太過 → 깔고 앉기(乘)와 수염 당기기(侮)가 한꺼번에","say":"거인 장군의 큰 몸집이 太過다. 기운이 남아돌면 내가 이기는 쪽은 짓누르고, 나를 이기는 쪽은 업신여긴다 — 氣有餘則制己所勝而侮所不勝. 그래서 木이 太過하면 木乘土와 木侮金이 함께 나타난다. 『素問·五運行大論』.","box":[901,206,414,474],"src":["OHG2-001"],"tts":"거인 장군의 큰 몸집이 태과다. 기운이 남아돌면 내가 이기는 쪽은 짓누르고, 나를 이기는 쪽은 업신여긴다, 기유여즉제기소승이모소불승. 그래서 목이 태과하면 목승토와 목모금이 함께 나타난다. 소문, 오운행대론."},{"n":8,"obj":"오른쪽 판 — 엎드린 작은 장군을 위에서 깔아 누르는 흰 도포 노인 · 발길질하며 혀를 내미는 농부","fact":"不及 — 己所不勝侮而乘之 · 己所勝輕而侮之: 木 不及 → 金乘木 + 土侮木","hook":"너무 작음 = 不及 → 노인(金)에게 깔리고(乘) 농부(土)에게 놀림받음(侮)","say":"오른쪽 판은 거꾸로다. 장군이 작고 말랐다 — 不及. 흰 도포 노인이 위에서 깔아 누른다 — 나를 이기는 쪽이 업신여기며 올라탄다, 己所不勝侮而乘之, 金乘木. 농부는 발길질하며 혀를 내민다 — 내가 이기던 쪽이 얕보고 업신여긴다, 己所勝輕而侮之, 土侮木. 木이 不及하면 金乘木과 土侮木이 함께 나타난다.","box":[1459,494,542,424],"src":[],"tts":"오른쪽 판은 거꾸로다. 장군이 작고 말랐다, 불급. 흰 도포 노인이 위에서 깔아 누른다, 나를 이기는 쪽이 업신여기며 올라탄다, 기소불승모이승지, 금승목. 농부는 발길질하며 혀를 내민다, 내가 이기던 쪽이 얕보고 업신여긴다, 기소승경이모지, 토모목. 목이 불급하면 금승목과 토모목이 함께 나타난다."},{"n":9,"kind":"review","obj":"긴 의자 · 왼쪽 판 · 가운데 판 · 오른쪽 판","fact":"고름: 亢害承制·勝復 / 깨짐: 母病及子·子盜母氣 · 相乘(순방향) · 相侮(역방향)","hook":"샅바 당김 · 재채기 · 빨대 · 깔고 앉기 · 수염 당기기 · 거인 · 꼬마","say":"다시 본다. 왼쪽 판 — 으스대는 장군의 샅바를 노인이 당긴다. 亢害承制, 勝復, 子復母仇. 긴 의자 — 재채기는 母病及子, 빨대는 子盜母氣. 가운데 판 — 거인 장군이 깔고 앉으면 相乘, 수염을 당기면 相侮, 太過면 둘이 함께. 오른쪽 판 — 작은 장군은 깔리고 놀림받는다. 不及이면 金乘木과 土侮木.","box":[[58,161,540,427],[40,458,803,587],[807,206,666,589],[1352,494,666,543]],"src":[],"tts":"다시 본다. 왼쪽 판, 으스대는 장군의 샅바를 노인이 당긴다. 항해승제, 승복, 자복모구. 긴 의자, 재채기는 모병급자, 빨대는 자도모기. 가운데 판, 거인 장군이 깔고 앉으면 상승, 수염을 당기면 상모, 태과면 둘이 함께. 오른쪽 판, 작은 장군은 깔리고 놀림받는다. 불급이면 금승목과 토모목."}],"has_image":true},{"id":"yyox-09","title":"五行으로 읽는 병의 신호 — 主色·客色 · 色 겸화 · 五脈 · 五變動","place":"주인과 손님이 마주 앉은 사랑방","image":"images/lessons/yyox-09.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"주인과 손님이 마주 앉은 사랑방","fact":"五行으로 읽는 병의 신호 — 主色·客色 · 色 겸화 · 色脈 · 五脈 · 五變動","hook":"주인 = 主色(장부의 색) · 손님 = 客色(때의 색) · 등 = 색의 겸화 · 선반 = 脈 · 병풍 = 變動","say":"사랑방에 주인과 손님이 마주 앉았다. 주인은 장부의 색, 손님은 철 따라 오는 색이다. 천장의 등은 두 색이 함께 보일 때를, 오른쪽 선반은 다섯 脈을, 뒤의 병풍은 병이 드러나는 다섯 움직임을 보여 준다. 五行으로 병의 신호를 읽는 법이다.","box":null,"src":[],"tts":"사랑방에 주인과 손님이 마주 앉았다. 주인은 장부의 색, 손님은 철 따라 오는 색이다. 천장의 등은 두 색이 함께 보일 때를, 오른쪽 선반은 다섯 맥을, 뒤의 병풍은 병이 드러나는 다섯 움직임을 보여 준다. 오행으로 병의 신호를 읽는 법이다."},{"n":1,"obj":"초록 얼굴의 주인 · 붉은 옷에 붉은 부채를 든 손님","fact":"主色 = 장부의 본색(주인) · 客色 = 때에 응하는 색(손님)","hook":"주인의 얼굴색 = 主色 · 손님의 옷 색 = 客色(붉음 = 여름)","say":"주인의 얼굴은 초록빛이다 — 제 장부의 본디 색, 主色. 肝은 靑, 心은 赤, 脾는 黃, 肺는 白, 腎은 黑. 손님은 붉은 옷에 붉은 부채를 들었다 — 철을 따라 찾아오는 색, 客色. 봄은 靑, 여름은 赤, 長夏는 黃, 가을은 白, 겨울은 黑. 붉은 손님이니 지금은 여름이다.","box":[[1071,595,388,424],[360,497,536,551]],"src":[],"tts":"주인의 얼굴은 초록빛이다, 제 장부의 본디 색, 주색. 간은 청, 심은 적, 비는 황, 폐는 백, 신은 흑. 손님은 붉은 옷에 붉은 부채를 들었다, 철을 따라 찾아오는 색, 객색. 봄은 청, 여름은 적, 장하는 황, 가을은 백, 겨울은 흑. 붉은 손님이니 지금은 여름이다."},{"n":2,"obj":"두툼한 윗자리에 앉은 손님 · 낮은 바닥에서 손님에게 절하는 주인","fact":"客色이 主色을 이기면 順 · 主色이 客色을 이기면 逆","hook":"손님이 윗자리 = 客勝主 = 順 · 주인이 윗자리를 차지하면 逆","say":"손님은 두툼한 윗자리에 앉았고, 주인은 낮은 바닥에서 절한다. 손님이 주인을 이긴 꼴이다 — 때의 색이 장부의 색을 이기면 철을 따르는 것이라 병이 순하다, 順. 거꾸로 주인이 윗자리를 차지하면 — 장부의 색이 때의 색을 이기면 逆이다. 여름이면 색도 脈도 여름 것이 나와야 한다.","box":[[360,497,536,551],[1071,595,388,424]],"src":["OH-15"],"tts":"손님은 두툼한 윗자리에 앉았고, 주인은 낮은 바닥에서 절한다. 손님이 주인을 이긴 꼴이다, 때의 색이 장부의 색을 이기면 철을 따르는 것이라 병이 순하다, 순. 거꾸로 주인이 윗자리를 차지하면, 장부의 색이 때의 색을 이기면 역이다. 여름이면 색도 맥도 여름 것이 나와야 한다."},{"n":3,"obj":"천장의 등 둘 — 초록 띠가 든 빨간 등은 환히 켜짐 · 초록 띠가 든 노란 등은 찢어져 꺼짐","fact":"靑赤 겸화 = 相生(木生火) → 順 · 靑黃 겸화 = 相剋(木·土) → 逆","hook":"초록 + 빨강 = 낳는 사이라 환함(順) · 초록 + 노랑 = 누르는 사이라 찢어짐(逆)","say":"천장의 등 둘을 본다. 초록과 빨강이 함께 든 등은 환하게 켜졌다 — 靑과 赤이 함께 보이면 木이 火를 낳는 相生이라 병이 순하다, 順. 초록과 노랑이 함께 든 등은 찢어져 꺼졌다 — 靑과 黃이 함께 보이면 木과 土의 相剋이라 逆이다.","box":[[336,62,229,236],[595,62,215,229]],"src":["OH-16"],"tts":"천장의 등 둘을 본다. 초록과 빨강이 함께 든 등은 환하게 켜졌다, 청과 적이 함께 보이면 목이 화를 낳는 상생이라 병이 순하다, 순. 초록과 노랑이 함께 든 등은 찢어져 꺼졌다, 청과 황이 함께 보이면 목과 토의 상극이라 역이다."},{"n":4,"obj":"오른쪽 벽의 초록 탈 · 끈으로 이어진 선반 첫 칸의 거문고","fact":"色脈相得 — 색과 脈의 五行이 서로 맞음(靑色 + 弦脈)","hook":"초록 탈(靑) + 거문고 줄(弦)을 끈으로 이음 = 색과 脈이 짝","say":"오른쪽 벽에 초록 탈이 걸렸고, 끈이 아래 선반의 거문고로 이어졌다. 초록은 木의 색, 거문고 줄은 木의 脈인 弦이다. 색과 脈이 같은 五行으로 맞았다 — 色脈相得. 색을 보았으면 脈도 그 짝이 나오는지 본다.","box":[1575,307,99,565],"src":[],"tts":"오른쪽 벽에 초록 탈이 걸렸고, 끈이 아래 선반의 거문고로 이어졌다. 초록은 목의 색, 거문고 줄은 목의 맥인 현이다. 색과 맥이 같은 오행으로 맞았다, 색맥상득. 색을 보았으면 맥도 그 짝이 나오는지 본다."},{"n":5,"obj":"선반 네 칸에 왼쪽부터 다섯 — 거문고 · 쇠갈고리 · 병에 꽂은 대나무와 그 곁의 흰 털 뭉치(한 칸) · 돌","fact":"五脈 — 肝 弦 · 心 鉤 · 脾 代 · 肺 毛 · 腎 石 (四時脈 春弦·夏鉤·秋毛·冬石)","hook":"거문고 줄 = 弦 · 갈고리 = 鉤 · 대나무(대) = 代 · 털 = 毛 · 돌 = 石","say":"선반을 왼쪽부터 본다. 거문고 — 줄 현(弦), 肝의 脈이고 봄의 脈. 쇠갈고리 — 갈고리 구(鉤), 心의 脈이고 여름의 脈. 병에 꽂은 대나무 — 대신할 대(代), 脾의 脈. 그 곁의 흰 털 뭉치 — 털 모(毛), 肺의 脈이고 가을의 脈, 浮라고도 한다. 돌 — 돌 석(石), 腎의 脈이고 겨울의 脈, 營이라고도 한다. 『玉機眞藏論』의 四時脈에서 脾는 철이 따로 없는 孤藏이라 사방을 적신다 — 以灌四傍. 같은 차례로 五精은 魂神意魄志, 五菜는 韭薤葵蔥藿이다.","box":[1561,689,487,373],"src":["OHG-036","OHG2-009","CI-13-01","CI-13-02","CI-13-03","CI-13-04","CI-13-05"],"tts":"선반을 왼쪽부터 본다. 거문고, 줄 현, 간의 맥이고 봄의 맥. 쇠갈고리, 갈고리 구, 심의 맥이고 여름의 맥. 병에 꽂은 대나무, 대신할 대, 비의 맥. 그 곁의 흰 털 뭉치, 털 모, 폐의 맥이고 가을의 맥, 부라고도 한다. 돌, 돌 석, 신의 맥이고 겨울의 맥, 영이라고도 한다. 옥기진장론의 사시맥에서 비는 철이 따로 없는 고장이라 사방을 적신다, 이관사방. 같은 차례로 오정은 혼신의백지, 오채는 구해규총곽이다."},{"n":6,"obj":"병풍 그림 다섯 — 두 주먹을 쥔 사람 · 이마를 짚고 근심하는 사람 · 가슴에 손 얹고 입에서 방울이 튀는(딸꾹질) 사람 · 주먹에 대고 기침하는 사람 · 몸을 감싸고 떠는 사람","fact":"五變動 — 肝 握 · 心 憂 · 脾 噦 · 肺 咳 · 腎 慄","hook":"주먹 쥠 · 근심 · 딸꾹질 · 기침 · 떨림","say":"뒤의 병풍 그림 다섯을 왼쪽부터 본다. 두 주먹을 꽉 쥔 사람 — 쥘 악(握), 肝. 이마를 짚고 근심하는 사람 — 근심 우(憂), 心. 가슴에 손을 얹고 딸꾹질하는 사람 — 딸꾹질 얼(噦), 脾. 기침하는 사람 — 기침 해(咳), 肺. 몸을 감싸고 떠는 사람 — 떨 률(慄), 腎. 병이 변해 드러나는 다섯 움직임, 五變動이다. 脾의 딸꾹질이 자주 나온다.","box":[516,321,1022,517],"src":["OHG-037"],"tts":"뒤의 병풍 그림 다섯을 왼쪽부터 본다. 두 주먹을 꽉 쥔 사람, 쥘 악, 간. 이마를 짚고 근심하는 사람, 근심 우, 심. 가슴에 손을 얹고 딸꾹질하는 사람, 딸꾹질 얼, 비. 기침하는 사람, 기침 해, 폐. 몸을 감싸고 떠는 사람, 떨 률, 신. 병이 변해 드러나는 다섯 움직임, 오변동이다. 비의 딸꾹질이 자주 나온다."},{"n":7,"kind":"review","obj":"사랑방 한 바퀴 — 주인과 손님 · 등 둘 · 탈과 선반 · 병풍","fact":"客勝主 順·主勝客 逆 / 靑赤 順·靑黃 逆 / 弦鉤代毛石 / 握憂噦咳慄","hook":"윗자리 손님 · 켜진 등과 찢어진 등 · 선반 다섯 · 병풍 다섯","say":"다시 본다. 윗자리의 붉은 손님과 절하는 초록 주인 — 客色이 主色을 이기면 順. 초록 빨강 등은 相生이라 順, 초록 노랑 등은 相剋이라 逆. 초록 탈과 거문고 — 色脈相得. 선반은 거문고, 갈고리, 대나무, 털, 돌 — 弦鉤代毛石. 병풍은 주먹, 근심, 딸꾹질, 기침, 떨림.","box":[[360,497,536,551],[1071,595,388,424],[336,62,229,236],[595,62,215,229],[1561,689,487,373],[516,321,1022,517]],"src":[],"tts":"다시 본다. 윗자리의 붉은 손님과 절하는 초록 주인, 객색이 주색을 이기면 순. 초록 빨강 등은 상생이라 순, 초록 노랑 등은 상극이라 역. 초록 탈과 거문고, 색맥상득. 선반은 거문고, 갈고리, 대나무, 털, 돌, 현구대모석. 병풍은 주먹, 근심, 딸꾹질, 기침, 떨림."}],"has_image":true},{"id":"yyox-10","title":"五行 치법 — 전변 예방 · 虛則補其母 實則瀉其子 · 여덟 치법","place":"짚길로 나뉜 텃밭","image":"images/lessons/yyox-10.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"짚길로 나뉜 텃밭 — 윗줄 세 밭 · 가운뎃줄 네 밭 · 아랫줄 네 밭","fact":"五行 치법 — 원칙 셋 · 相生 치법 넷 · 相剋 치법 넷","hook":"윗줄 = 원칙 · 가운뎃줄 = 相生으로 돕기 · 아랫줄 = 相剋으로 누르기 / 나무 = 肝 · 흙 = 脾 · 쇠 = 肺 · 물 = 腎","say":"텃밭이 세 줄이다. 윗줄 세 밭은 치료의 원칙, 가운뎃줄 네 밭은 相生을 써서 돕는 치법, 아랫줄 네 밭은 相剋을 써서 누르는 치법이다. 밭일 동작이 곧 치법 이름이다. 나무는 肝, 흙은 脾, 쇠는 肺, 물은 腎이다.","box":null,"src":[],"tts":"텃밭이 세 줄이다. 윗줄 세 밭은 치료의 원칙, 가운뎃줄 네 밭은 상생을 써서 돕는 치법, 아랫줄 네 밭은 상극을 써서 누르는 치법이다. 밭일 동작이 곧 치법 이름이다. 나무는 간, 흙은 비, 쇠는 폐, 물은 신이다."},{"n":1,"obj":"잎이 누렇게 병든 나무를 가리키는 일꾼 · 나무 둘레에 돌로 테를 둘러 놓은 흙","fact":"見肝之病 知肝傳脾 當先實脾 — 옮겨 갈 곳을 미리 채운다","hook":"병든 나무(肝) → 흙(脾)으로 번질 것을 알고 흙부터 돌로 둘러 지킴 = 實脾","say":"윗줄 왼쪽. 일꾼이 잎이 누렇게 병든 나무를 가리킨다 — 肝의 병이다. 그런데 나무 둘레의 흙은 벌써 돌로 테를 둘러 단단히 지켜 놓았다. 肝의 병을 보면 脾로 옮을 것을 알고 먼저 脾를 채운다 — 見肝之病 知肝傳脾 當先實脾. 木이 土를 올라타는 相乘의 길을 미리 막는 것이다.","box":[295,0,471,385],"src":["OH-14","OHG-029"],"tts":"윗줄 왼쪽. 일꾼이 잎이 누렇게 병든 나무를 가리킨다, 간의 병이다. 그런데 나무 둘레의 흙은 벌써 돌로 테를 둘러 단단히 지켜 놓았다. 간의 병을 보면 비로 옮을 것을 알고 먼저 비를 채운다, 견간지병 지간전비 당선실비. 목이 토를 올라타는 상승의 길을 미리 막는 것이다."},{"n":2,"obj":"열매가 둘뿐인 가는 나무 · 열매는 두고 뿌리 곁에 거름 자루를 대는 일꾼","fact":"虛則補其母 — 허하면 그 어미를 補한다(難經)","hook":"열매(子)가 부실 → 나무(母) 뿌리에 거름 = 補其母","say":"윗줄 가운데. 가는 나무에 열매가 둘뿐이다. 일꾼은 열매는 건드리지 않고 나무뿌리에 거름 자루를 댄다 — 자식이 허하면 어미를 채운다, 虛則補其母. 『難經』의 원칙이다. 침으로는 제 경맥의 어미 혈을 補한다 — 肺가 허하면 太淵을 補한다. 같은 『難經』은 五臟에서 생긴 덩이를 積, 六腑에서 생긴 덩이를 聚라 가른다.","box":[944,17,313,353],"src":["UH-NAN-04","HUBGR-0200"],"tts":"윗줄 가운데. 가는 나무에 열매가 둘뿐이다. 일꾼은 열매는 건드리지 않고 나무뿌리에 거름 자루를 댄다, 자식이 허하면 어미를 채운다, 허즉보기모. 난경의 원칙이다. 침으로는 제 경맥의 어미 혈을 보한다, 폐가 허하면 태연을 보한다. 같은 난경은 오장에서 생긴 덩이를 적, 육부에서 생긴 덩이를 취라 가른다."},{"n":3,"obj":"열매가 너무 많이 달린 큰 나무 · 열매를 따서 바구니에 담는 일꾼","fact":"實則瀉其子 — 실하면 그 자식을 瀉한다","hook":"너무 실한 나무(母) → 열매(子)를 따 냄 = 瀉其子","say":"윗줄 오른쪽. 나무에 열매가 너무 많이 달렸다. 일꾼이 열매를 따 낸다 — 어미가 실하면 자식을 덜어 낸다, 實則瀉其子. 肝이 실하면 그 자식인 火를 瀉한다 — 肝經의 火穴 行間이나 心經의 少海를 쓴다. 肺가 실하면 尺澤을 瀉한다.","box":[1388,0,481,378],"src":["GRG2-022"],"tts":"윗줄 오른쪽. 나무에 열매가 너무 많이 달렸다. 일꾼이 열매를 따 낸다, 어미가 실하면 자식을 덜어 낸다, 실즉사기자. 간이 실하면 그 자식인 화를 사한다, 간경의 화혈 행간이나 심경의 소해를 쓴다. 폐가 실하면 척택을 사한다."},{"n":4,"obj":"갈라진 마른 땅, 잎이 붉게 탄 나무 · 뿌리에 물통의 물을 붓는 일꾼","fact":"滋水涵木 — 腎水를 길러 肝木을 적신다: 腎水虛 → 肝陽上亢","hook":"물을 대어(滋水) 나무를 적심(涵木) · 붉게 탄 잎 = 肝陽上亢","say":"가운뎃줄 첫 밭. 땅이 말라 갈라지고 나뭇잎이 붉게 탔다 — 腎의 물이 모자라 나무를 적시지 못하니 肝陽이 위로 치솟았다. 水不涵木, 肝陽上亢. 일꾼이 뿌리에 물을 붓는다 — 불을 자(滋), 젖을 함(涵), 滋水涵木. 腎陰을 길러 肝을 가라앉히는 법이다.","box":[75,307,389,402],"src":["OH-12-01"],"tts":"가운뎃줄 첫 밭. 땅이 말라 갈라지고 나뭇잎이 붉게 탔다, 신의 물이 모자라 나무를 적시지 못하니 간양이 위로 치솟았다. 수불함목, 간양상항. 일꾼이 뿌리에 물을 붓는다, 불을 자, 젖을 함, 자수함목. 신음을 길러 간을 가라앉히는 법이다."},{"n":5,"obj":"흙가마 아궁이에 장작을 더 넣는 일꾼 · 곁에 쌓인 갓 구운 흙벽돌","fact":"益火生土 — 命門火(腎陽)를 더해 脾土를 돕는다(溫腎健脾) ★心火 아님","hook":"불을 더해(益火) 흙벽돌을 구움(生土) · 아궁이 불 = 命門火","say":"둘째 밭. 일꾼이 흙가마 아궁이에 장작을 더 넣고, 곁에는 갓 구운 흙벽돌이 쌓였다 — 불을 더해 흙을 낳는다, 益火生土. 이 불은 心의 불이 아니라 아궁이 불, 곧 命門의 불 腎陽이다. 腎陽을 덥혀 脾를 튼튼히 하는 법이라 溫腎健脾法이라고도 한다.","box":[631,408,474,308],"src":["OH-12-02","OHG-009"],"tts":"둘째 밭. 일꾼이 흙가마 아궁이에 장작을 더 넣고, 곁에는 갓 구운 흙벽돌이 쌓였다, 불을 더해 흙을 낳는다, 익화생토. 이 불은 심의 불이 아니라 아궁이 불, 곧 명문의 불 신양이다. 신양을 덥혀 비를 튼튼히 하는 법이라 온신건비법이라고도 한다."},{"n":6,"obj":"괭이로 흙을 높이 북돋는 일꾼 · 흙무더기에서 돋아난 금덩이들","fact":"培土生金 — 脾土를 북돋아 肺金을 돕는다: 脾虛 → 肺虛","hook":"흙을 북돋아(培土) 금이 남(生金)","say":"셋째 밭. 일꾼이 괭이로 흙을 높이 북돋자 흙무더기에서 금덩이가 돋는다 — 북돋울 배(培), 培土生金. 脾가 허해 肺까지 약해졌을 때, 脾를 補해 肺를 돕는 법이다.","box":[1172,415,481,280],"src":["OH-12-03"],"tts":"셋째 밭. 일꾼이 괭이로 흙을 높이 북돋자 흙무더기에서 금덩이가 돋는다, 북돋울 배, 배토생금. 비가 허해 폐까지 약해졌을 때, 비를 보해 폐를 돕는 법이다."},{"n":7,"obj":"무쇠 손펌프에서 무쇠 물통으로 쏟아지는 물(사람 없음)","fact":"金水相生 — 肺金과 腎水를 함께 기른다: 肺腎陰虛","hook":"쇠(金) 펌프와 물(水) = 金水相生","say":"넷째 밭에는 사람이 없다. 무쇠 펌프에서 물이 쏟아진다 — 쇠가 물을 낳고 물이 쇠를 적신다, 金水相生. 肺陰과 腎陰은 서로 기른다. 腎陰이 허해 肺와 腎의 陰이 함께 마를 때, 둘을 함께 자양한다.","box":[1748,430,229,280],"src":["OH-12-04","JS-REL-06-03"],"tts":"넷째 밭에는 사람이 없다. 무쇠 펌프에서 물이 쏟아진다, 쇠가 물을 낳고 물이 쇠를 적신다, 금수상생. 폐음과 신음은 서로 기른다. 신음이 허해 폐와 신의 음이 함께 마를 때, 둘을 함께 자양한다."},{"n":8,"obj":"흙둑을 깨며 기운 나무를 두 손으로 미는 일꾼 · 줄기를 말뚝에 맨 밧줄 · 금 간 흙둑","fact":"抑木扶土 — 肝木을 누르고 脾土를 붙든다: 肝旺脾虛","hook":"나무를 누르고(抑木) 흙을 붙듦(扶土)","say":"아랫줄 첫 밭. 나무가 기울어 흙둑을 깨뜨린다. 일꾼이 줄기를 두 손으로 밀어 누르고 밧줄로 말뚝에 매어, 흙둑이 더 무너지지 않게 붙든다 — 누를 억(抑), 도울 부(扶), 抑木扶土. 肝이 드세고 脾가 허할 때, 肝을 풀고 脾를 튼튼히 한다.","box":[55,754,445,373],"src":["OH-13-01"],"tts":"아랫줄 첫 밭. 나무가 기울어 흙둑을 깨뜨린다. 일꾼이 줄기를 두 손으로 밀어 누르고 밧줄로 말뚝에 매어, 흙둑이 더 무너지지 않게 붙든다, 누를 억, 도울 부, 억목부토. 간이 드세고 비가 허할 때, 간을 풀고 비를 튼튼히 한다."},{"n":9,"obj":"삽으로 흙을 퍼 올려 둑을 쌓는 일꾼 · 둑에 막힌 푸른 물","fact":"培土制水 — 脾土를 북돋아 水를 다스린다: 土虛水侮 · 水腫","hook":"흙을 북돋아(培土) 물을 막음(制水) · 넘치는 물 = 水腫","say":"둘째 밭. 일꾼이 삽으로 흙을 퍼 올려 둑을 높이고, 둑이 푸른 물을 막는다 — 培土制水. 土가 허해 물이 거꾸로 업신여기고 넘쳐 온몸이 붓는 水腫에, 脾를 補해 물을 다스린다. 가운뎃줄의 培土生金과 앞 두 글자가 같다 — 금을 낳으면 相生 치법, 물을 막으면 相剋 치법이다. 滋水涵木은 腎水가 허해 肝陽이 치솟을 때였다.","box":[610,790,438,353],"src":["OH-13-02","OHG-032"],"tts":"둘째 밭. 일꾼이 삽으로 흙을 퍼 올려 둑을 높이고, 둑이 푸른 물을 막는다, 배토제수. 토가 허해 물이 거꾸로 업신여기고 넘쳐 온몸이 붓는 수종에, 비를 보해 물을 다스린다. 가운뎃줄의 배토생금과 앞 두 글자가 같다, 금을 낳으면 상생 치법, 물을 막으면 상극 치법이다. 자수함목은 신수가 허해 간양이 치솟을 때였다."},{"n":10,"obj":"큰 쇠 가위로 무성한 나무를 치는 일꾼","fact":"佐金平木 = 淸金制木 — 肺金을 도와 肝木을 고른다: 木火刑金","hook":"쇠 가위를 써서(佐金) 나무를 고르게 침(平木)","say":"셋째 밭. 일꾼이 큰 쇠 가위로 무성한 나무를 고르게 친다 — 도울 좌(佐), 평평할 평(平), 佐金平木. 淸金制木이라고도 한다. 肝의 불이 肺를 상하게 하는 木火刑金, 肝火犯肺에 쓴다. 肺의 맑게 내리는 힘을 도와 肝을 누른다.","box":[1056,754,417,352],"src":["OH-13-03","OHG-010"],"tts":"셋째 밭. 일꾼이 큰 쇠 가위로 무성한 나무를 고르게 친다, 도울 좌, 평평할 평, 좌금평목. 청금제목이라고도 한다. 간의 불이 폐를 상하게 하는 목화형금, 간화범폐에 쓴다. 폐의 맑게 내리는 힘을 도와 간을 누른다."},{"n":11,"obj":"밭 아래쪽 모닥불에서 장작을 갈퀴로 긁어내는 일꾼 · 밭 위쪽에서 대통 물로 채워지는 못","fact":"瀉南補北 — 心火를 덜고 腎水를 채운다: 腎陰虛 · 心火旺","hook":"아래 = 南 = 불을 덜어 냄(瀉) · 위 = 北 = 물을 채움(補)","say":"넷째 밭. 아래쪽 남쪽에는 모닥불, 위쪽 북쪽에는 못이 있다. 일꾼은 불에서 장작을 긁어내고, 못에는 대통으로 물이 채워진다 — 남쪽을 덜고 북쪽을 채운다, 瀉南補北. 南은 心火, 北은 腎水. 腎陰이 허하고 心火가 드세어 心과 腎이 사귀지 못할 때 — 心腎不交, 水火未濟 — 心火를 瀉하고 腎水를 補한다.","box":[1583,739,438,404],"src":["OH-13-04","OHG2-015"],"tts":"넷째 밭. 아래쪽 남쪽에는 모닥불, 위쪽 북쪽에는 못이 있다. 일꾼은 불에서 장작을 긁어내고, 못에는 대통으로 물이 채워진다, 남쪽을 덜고 북쪽을 채운다, 사남보북. 남은 심화, 북은 신수. 신음이 허하고 심화가 드세어 심과 신이 사귀지 못할 때, 심신불교, 수화미제, 심화를 사하고 신수를 보한다."},{"n":12,"kind":"review","obj":"텃밭 세 줄 — 윗줄 셋 · 가운뎃줄 넷 · 아랫줄 넷","fact":"相生: 滋水涵木·益火生土·培土生金·金水相生 / 相剋: 抑木扶土·培土制水·佐金平木·瀉南補北","hook":"물 대기 · 아궁이 · 금 돋는 흙 · 펌프 / 나무 묶기 · 둑 · 가위 · 불 덜고 못 채우기","say":"다시 본다. 윗줄 — 병든 나무 곁 흙부터 다지기 當先實脾, 나무에 거름 補其母, 열매 따기 瀉其子. 가운뎃줄 相生 — 물 대기 滋水涵木, 아궁이 불 益火生土, 흙에서 금 培土生金, 쇠 펌프 金水相生. 아랫줄 相剋 — 나무 누르고 흙 붙들기 抑木扶土, 둑 쌓기 培土制水, 쇠 가위 佐金平木, 불 덜고 못 채우기 瀉南補北.","box":[[295,0,1574,385],[75,307,1903,409],[55,739,1966,404]],"src":[],"tts":"다시 본다. 윗줄, 병든 나무 곁 흙부터 다지기 당선실비, 나무에 거름 보기모, 열매 따기 사기자. 가운뎃줄 상생, 물 대기 자수함목, 아궁이 불 익화생토, 흙에서 금 배토생금, 쇠 펌프 금수상생. 아랫줄 상극, 나무 누르고 흙 붙들기 억목부토, 둑 쌓기 배토제수, 쇠 가위 좌금평목, 불 덜고 못 채우기 사남보북."}],"has_image":true},{"id":"yyox-11","title":"八卦 ① 여덟 괘의 象 — 自然·家族·身體(近取諸身)","place":"등 뒤에 그림 가리개를 세운 대가족 잔칫상","image":"images/lessons/yyox-11.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"한 줄로 앉은 대가족 여덟 사람 — 저마다 등 뒤에 그림 한 폭짜리 가리개","fact":"八卦의 象 — 自然(등 뒤 가리개 그림) · 家族(앉은 사람) · 身體(크게 그린 몸)","hook":"제 등 뒤 그림 = 自然 · 식구 여덟 = 家族 · 유난히 큰 몸 한 곳 = 近取諸身","say":"대가족 여덟이 한 줄로 앉아 잔칫상을 받았다. 식구 여덟이 八卦다. 사람마다 등 뒤에 그림 한 폭짜리 가리개를 세웠다. 등 뒤 그림은 그 괘의 自然, 앉은 사람은 家族, 유난히 크게 그려진 몸 한 곳은 가까이 제 몸에서 취한 象 — 近取諸身이다. 가운데 부모부터 보고, 아들은 왼쪽으로, 딸은 오른쪽으로 간다.","box":null,"src":[],"tts":"대가족 여덟이 한 줄로 앉아 잔칫상을 받았다. 식구 여덟이 팔괘다. 사람마다 등 뒤에 그림 한 폭짜리 가리개를 세웠다. 등 뒤 그림은 그 괘의 자연, 앉은 사람은 가족, 유난히 크게 그려진 몸 한 곳은 가까이 제 몸에서 취한 상, 근취제신이다. 가운데 부모부터 보고, 아들은 왼쪽으로, 딸은 오른쪽으로 간다."},{"n":1,"obj":"가운데 흰 수염 아버지 — 풍선처럼 큰 머리 · 등 뒤 가리개는 해 뜬 하늘","fact":"乾 = 天 · 父 · 首","hook":"하늘에 닿은 큰 머리의 아버지 = 天·父·首","say":"가운데 흰 수염 아버지. 머리가 풍선처럼 커서 등 뒤의 하늘 그림을 가렸고, 그 위로 해가 떴다. 乾괘는 하늘이고 아버지이고 머리다 — 하늘 천(天), 아비 부(父), 머리 수(首). 하늘처럼 맨 위에서 다스리는 것이 머리다.","box":[[797,455,251,467],[822,372,210,334]],"src":["PG-02-01","PG-05-01"],"tts":"가운데 흰 수염 아버지. 머리가 풍선처럼 커서 등 뒤의 하늘 그림을 가렸고, 그 위로 해가 떴다. 건괘는 하늘이고 아버지이고 머리다, 하늘 천, 아비 부, 머리 수. 하늘처럼 맨 위에서 다스리는 것이 머리다."},{"n":2,"obj":"아버지 오른쪽의 어머니 — 공처럼 불룩한 배 · 등 뒤 가리개는 갈아 놓은 밭","fact":"坤 = 地 · 母 · 腹","hook":"밭 그림 앞, 배가 불룩한 어머니 = 地·母·腹","say":"아버지 옆의 어머니. 붉은 치마 앞으로 배가 공처럼 불룩하고, 등 뒤에는 갈아 놓은 밭 그림이 있다. 坤괘는 땅이고 어머니이고 배다 — 땅 지(地), 어미 모(母), 배 복(腹). 땅처럼 만물을 담아 기르는 것이 배다.","box":[[1049,540,258,382],[1071,372,206,334]],"src":["PG-02-02","PG-05-02"],"tts":"아버지 옆의 어머니. 붉은 치마 앞으로 배가 공처럼 불룩하고, 등 뒤에는 갈아 놓은 밭 그림이 있다. 곤괘는 땅이고 어머니이고 배다, 땅 지, 어미 모, 배 복. 땅처럼 만물을 담아 기르는 것이 배다."},{"n":3,"obj":"아버지 왼쪽의 맏아들 — 앞으로 내민 커다란 맨발바닥 둘 · 등 뒤 가리개는 번개 치는 먹구름","fact":"震 = 雷 · 長男 · 足","hook":"번개 앞, 발이 큰 맏아들 = 雷·長男·足","say":"아버지 왼쪽의 맏아들. 앞으로 내민 맨발바닥이 엄청나게 크고, 등 뒤에는 번개 치는 먹구름 그림이 있다. 震괘는 우레이고 長男이고 발이다 — 우레 뇌(雷), 발 족(足). 우레처럼 떨쳐 움직이는 것이 발이다.","box":[[545,530,251,392],[577,372,210,334]],"src":["PG-02-03","PG-05-03"],"tts":"아버지 왼쪽의 맏아들. 앞으로 내민 맨발바닥이 엄청나게 크고, 등 뒤에는 번개 치는 먹구름 그림이 있다. 진괘는 우레이고 장남이고 발이다, 우레 뇌, 발 족. 우레처럼 떨쳐 움직이는 것이 발이다."},{"n":4,"obj":"그 왼쪽의 둘째 아들 — 부채만 한 두 귀 · 등 뒤 가리개는 굽이쳐 흐르는 물","fact":"坎 = 水 · 中男 · 耳","hook":"물 그림 앞, 귀가 큰 둘째 아들 = 水·中男·耳","say":"그 왼쪽 둘째 아들은 두 귀가 부채만 하고, 등 뒤에는 굽이쳐 흐르는 물 그림이 있다. 坎괘는 물이고 中男이고 귀다 — 물 수(水), 귀 이(耳). 물이 구덩이로 흘러들듯 소리가 귀로 흘러든다.","box":[[324,552,221,330],[324,372,213,334]],"src":["PG-02-05","PG-05-05"],"tts":"그 왼쪽 둘째 아들은 두 귀가 부채만 하고, 등 뒤에는 굽이쳐 흐르는 물 그림이 있다. 감괘는 물이고 중남이고 귀다, 물 수, 귀 이. 물이 구덩이로 흘러들듯 소리가 귀로 흘러든다."},{"n":5,"obj":"맨 왼쪽의 막내아들 — 제 머리보다 큰 두 손 · 등 뒤 가리개는 높은 산","fact":"艮 = 山 · 少男 · 手","hook":"산 그림 앞, 손이 큰 막내아들 = 山·少男·手","say":"맨 왼쪽 막내아들은 양옆으로 벌린 두 손이 제 머리보다 크고, 등 뒤에는 높은 산 그림이 있다. 艮괘는 산이고 少男이고 손이다 — 메 산(山), 손 수(手). 산처럼 막아서 멈추게 하는 것이 손이다.","box":[[40,651,291,271],[84,372,212,334]],"src":["PG-02-07","PG-05-07"],"tts":"맨 왼쪽 막내아들은 양옆으로 벌린 두 손이 제 머리보다 크고, 등 뒤에는 높은 산 그림이 있다. 간괘는 산이고 소남이고 손이다, 메 산, 손 수. 산처럼 막아서 멈추게 하는 것이 손이다."},{"n":6,"obj":"어머니 오른쪽의 맏딸 — 책상다리한 굵은 맨 넓적다리 · 등 뒤 가리개는 바람에 휘는 나무","fact":"巽 = 風 · 長女 · 股","hook":"바람 그림 곁, 넓적다리가 굵은 맏딸 = 風·長女·股","say":"어머니 오른쪽의 맏딸. 책상다리한 맨 넓적다리가 몸통보다 굵고, 등 뒤에는 바람에 휘는 나무 그림이 있다. 巽괘는 바람이고 長女이고 넓적다리다 — 바람 풍(風), 넓적다리 고(股). 발을 따라 움직이는 것이 넓적다리다. 맏아들의 발과 맏딸의 넓적다리가 짝이다.","box":[[1280,548,329,375],[1312,372,210,334]],"src":["PG-02-04","PG-05-04"],"tts":"어머니 오른쪽의 맏딸. 책상다리한 맨 넓적다리가 몸통보다 굵고, 등 뒤에는 바람에 휘는 나무 그림이 있다. 손괘는 바람이고 장녀이고 넓적다리다, 바람 풍, 넓적다리 고. 발을 따라 움직이는 것이 넓적다리다. 맏아들의 발과 맏딸의 넓적다리가 짝이다."},{"n":7,"obj":"그 오른쪽의 둘째 딸 — 동그랗게 부릅뜬 큰 두 눈 · 등 뒤 가리개는 타오르는 불","fact":"離 = 火 · 中女 · 目","hook":"불 그림 곁, 눈이 큰 둘째 딸 = 火·中女·目","say":"그 오른쪽 둘째 딸은 두 눈을 동그랗게 크게 부릅떴고, 등 뒤에는 타오르는 불 그림이 있다. 離괘는 불이고 中女이고 눈이다 — 불 화(火), 눈 목(目). 불처럼 밝게 비추어 보는 것이 눈이다. 둘째 아들의 귀와 둘째 딸의 눈이 짝이다.","box":[[1561,581,241,342],[1557,372,210,334]],"src":["PG-02-06","PG-05-06"],"tts":"그 오른쪽 둘째 딸은 두 눈을 동그랗게 크게 부릅떴고, 등 뒤에는 타오르는 불 그림이 있다. 이괘는 불이고 중녀이고 눈이다, 불 화, 눈 목. 불처럼 밝게 비추어 보는 것이 눈이다. 둘째 아들의 귀와 둘째 딸의 눈이 짝이다."},{"n":8,"obj":"맨 오른쪽의 막내딸 — 크게 벌리고 웃는 입 · 등 뒤 가리개는 갈대 난 못","fact":"兌 = 澤 · 少女 · 口","hook":"못 그림 곁, 입 벌려 웃는 막내딸 = 澤·少女·口","say":"맨 오른쪽 막내딸은 입을 크게 벌리고 웃고, 등 뒤에는 갈대 난 못 그림이 있다. 兌괘는 못이고 少女이고 입이다 — 못 택(澤), 입 구(口). 兌는 기쁨이라 입이 웃는다. 막내아들의 손과 막내딸의 입이 짝이다.","box":[[1792,651,226,271],[1799,372,210,334]],"src":["PG-02-08","PG-05-08"],"tts":"맨 오른쪽 막내딸은 입을 크게 벌리고 웃고, 등 뒤에는 갈대 난 못 그림이 있다. 태괘는 못이고 소녀이고 입이다, 못 택, 입 구. 태는 기쁨이라 입이 웃는다. 막내아들의 손과 막내딸의 입이 짝이다."},{"n":9,"kind":"review","obj":"가리개 여덟과 식구 여덟 — 왼쪽부터 막내아들 · 둘째 아들 · 맏아들 · 아버지 · 어머니 · 맏딸 · 둘째 딸 · 막내딸","fact":"乾首·坤腹·震足·巽股·坎耳·離目·艮手·兌口 / 天地雷風水火山澤","hook":"머리·배 / 발·귀·손(아들) / 넓적다리·눈·입(딸)","say":"다시 본다. 가운데 큰 머리 아버지 乾괘 — 하늘과 머리. 불룩한 배 어머니 坤괘 — 땅과 배. 왼쪽으로 큰 발 맏아들 震괘 — 우레, 큰 귀 둘째 坎괘 — 물, 큰 손 막내 艮괘 — 산. 오른쪽으로 넓적다리 맏딸 巽괘 — 바람, 큰 눈 둘째 離괘 — 불, 웃는 입 막내 兌괘 — 못.","box":[[84,372,1926,334],[40,455,1977,467]],"src":[],"tts":"다시 본다. 가운데 큰 머리 아버지 건괘, 하늘과 머리. 불룩한 배 어머니 곤괘, 땅과 배. 왼쪽으로 큰 발 맏아들 진괘, 우레, 큰 귀 둘째 감괘, 물, 큰 손 막내 간괘, 산. 오른쪽으로 넓적다리 맏딸 손괘, 바람, 큰 눈 둘째 이괘, 불, 웃는 입 막내 태괘, 못."}],"has_image":true},{"id":"yyox-12","title":"八卦 ② 先天(伏羲) — 一乾天…八坤地 번호와 마주 보는 네 쌍(對待)","place":"伏羲의 팔각정 바닥","image":"images/lessons/yyox-12.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"위에서 내려다본 여덟 모 정자 바닥 — 여덟 쪽 그림과 한가운데 뱀 몸의 伏羲","fact":"先天八卦(伏羲) — 번호 一乾…八坤 · 마주 보는 네 쌍(對待) · 위가 南","hook":"해 뜬 위쪽 = 南 · 흰 타일 = 번호 · 현판 = 괘의 획 · 마주 보는 쪽 = 짝","say":"伏羲의 팔각정 바닥을 위에서 내려다본다. 한가운데 뱀의 몸을 한 伏羲가 서 있고, 바닥은 여덟 쪽 그림으로 나뉘었다. 太極이 陰陽을 낳고, 陰陽이 四象을, 四象이 八卦를 낳는다. 그 여덟 괘를 伏羲가 벌여 놓은 것이 先天八卦다. 옛 그림은 남쪽을 위에 둔다 — 해가 뜬 위쪽이 남, 아래가 북, 왼쪽이 동, 오른쪽이 서다. 쪽마다 현판에는 괘의 세 줄 획이, 흰 타일에는 번호가 있다.","box":null,"src":[],"tts":"복희의 팔각정 바닥을 위에서 내려다본다. 한가운데 뱀의 몸을 한 복희가 서 있고, 바닥은 여덟 쪽 그림으로 나뉘었다. 태극이 음양을 낳고, 음양이 사상을, 사상이 팔괘를 낳는다. 그 여덟 괘를 복희가 벌여 놓은 것이 선천팔괘다. 옛 그림은 남쪽을 위에 둔다, 해가 뜬 위쪽이 남, 아래가 북, 왼쪽이 동, 오른쪽이 서다. 쪽마다 현판에는 괘의 세 줄 획이, 흰 타일에는 번호가 있다."},{"n":1,"obj":"쪽마다 놓인 흰 점 타일 여덟 — 맨 위 점 하나, 왼쪽으로 내려가며 둘·셋·넷, 오른쪽 위에서 내려가며 다섯·여섯·일곱, 맨 아래 여덟","fact":"一乾天 二兌澤 三離火 四震雷 五巽風 六坎水 七艮山 八坤地","hook":"위 하나 → 왼쪽을 내려가며 둘 셋 넷 → 오른쪽 위로 건너가 다섯 여섯 일곱 → 아래 여덟","say":"흰 타일의 점을 센다. 맨 위 하늘이 하나. 왼쪽으로 내려가며 못이 둘, 불이 셋, 우레가 넷. 다시 오른쪽 위로 건너가 바람이 다섯, 내려가며 물이 여섯, 산이 일곱, 맨 아래 땅이 여덟이다. 一乾天, 二兌澤, 三離火, 四震雷, 五巽風, 六坎水, 七艮山, 八坤地. 왼쪽 넷도 오른쪽 넷도 위에서 아래로 센다.","box":[[1096,20,112,112],[355,160,112,112],[238,396,112,112],[342,891,112,112],[1583,160,112,112],[1699,396,112,112],[1594,892,112,112],[1096,1013,112,112]],"src":["PG-01"],"tts":"흰 타일의 점을 센다. 맨 위 하늘이 하나. 왼쪽으로 내려가며 못이 둘, 불이 셋, 우레가 넷. 다시 오른쪽 위로 건너가 바람이 다섯, 내려가며 물이 여섯, 산이 일곱, 맨 아래 땅이 여덟이다. 일건천, 이태택, 삼리화, 사진뢰, 오손풍, 육감수, 칠간산, 팔곤지. 왼쪽 넷도 오른쪽 넷도 위에서 아래로 센다."},{"n":2,"obj":"가운데 伏羲 곁에 앉은 꼬리 많은 흰 여우(구미호) · 마주 보는 맨 위 타일(점 하나)과 맨 아래 타일(점 여덟)","fact":"마주 보는 짝의 합은 언제나 9 — 乾1·坤8 / 兌2·艮7 / 離3·坎6 / 震4·巽5","hook":"구미호의 구(九) = 아홉 · 맞은편 번호 = 9에서 빼기","say":"伏羲 곁에 꼬리가 여럿 달린 흰 여우, 구미호가 앉았다 — 아홉 구(九). 마주 보는 두 타일의 점을 더하면 언제나 아홉이다. 맨 위 하나와 맨 아래 여덟, 못의 둘과 산의 일곱, 불의 셋과 물의 여섯, 우레의 넷과 바람의 다섯. 한쪽 번호를 알면 맞은편은 아홉에서 빼면 된다.","box":[[1045,612,120,100],[1096,20,112,112],[1096,1013,112,112]],"src":[],"tts":"복희 곁에 꼬리가 여럿 달린 흰 여우, 구미호가 앉았다, 아홉 구. 마주 보는 두 타일의 점을 더하면 언제나 아홉이다. 맨 위 하나와 맨 아래 여덟, 못의 둘과 산의 일곱, 불의 셋과 물의 여섯, 우레의 넷과 바람의 다섯. 한쪽 번호를 알면 맞은편은 아홉에서 빼면 된다."},{"n":3,"obj":"뱀 몸의 伏羲 — 한 손은 위쪽을 가리키고 다른 손은 아래로 내림 · 맨 위 쪽 그림은 해 뜬 하늘 · 맨 아래 쪽 그림은 갈아 놓은 흙","fact":"天地定位 — 乾(南, 위) ↔ 坤(北, 아래)","hook":"한 손은 위 하늘로, 한 손은 아래 땅으로 = 하늘과 땅이 제자리를 잡음","say":"伏羲가 한 손으로 위의 하늘을 가리키고, 다른 손은 아래의 땅 쪽으로 내렸다. 하늘과 땅이 제자리를 잡았다 — 天地定位. 乾괘가 위쪽 남, 坤괘가 아래쪽 북에서 마주 본다. 先天의 네 원리 가운데 첫째다. 나머지 셋은 山澤通氣, 雷風相薄, 水火不相射다.","box":[[862,372,327,366],[764,0,533,418],[764,721,526,422]],"src":["PG-03"],"tts":"복희가 한 손으로 위의 하늘을 가리키고, 다른 손은 아래의 땅 쪽으로 내렸다. 하늘과 땅이 제자리를 잡았다, 천지정위. 건괘가 위쪽 남, 곤괘가 아래쪽 북에서 마주 본다. 선천의 네 원리 가운데 첫째다. 나머지 셋은 산택통기, 뇌풍상박, 수화불상사다."},{"n":4,"obj":"왼쪽 위 쪽 그림 — 흰 김이 피어오르는 못 · 오른쪽 아래 쪽 그림 — 봉우리에 흰 김이 걸린 산","fact":"山澤通氣 — 兌(東南) ↔ 艮(西北)","hook":"못의 김이 맞은편 산봉우리에 걸림 = 기운이 통함","say":"왼쪽 위 못에서 흰 김이 피어오르고, 맞은편 오른쪽 아래 산봉우리에 같은 흰 김이 걸렸다. 산과 못이 기운을 통한다 — 山澤通氣. 兌괘가 동남, 艮괘가 서북에서 마주 본다.","box":[[368,137,584,360],[1110,641,562,497]],"src":[],"tts":"왼쪽 위 못에서 흰 김이 피어오르고, 맞은편 오른쪽 아래 산봉우리에 같은 흰 김이 걸렸다. 산과 못이 기운을 통한다, 산택통기. 태괘가 동남, 간괘가 서북에서 마주 본다."},{"n":5,"obj":"왼쪽 아래 쪽 그림 — 번개 치는 먹구름 · 오른쪽 위 쪽 그림 — 바람에 휘는 나무","fact":"雷風相薄 — 震(東北) ↔ 巽(西南)","hook":"번개와 바람이 마주 보고 다가붙음 = 相薄","say":"왼쪽 아래 먹구름에서 번개가 치고, 맞은편 오른쪽 위에서는 바람이 나무를 휜다. 우레와 바람이 서로 다가붙어 부딪친다 — 닥칠 박(薄), 雷風相薄. 震괘가 동북, 巽괘가 서남에서 마주 본다.","box":[[382,634,569,504],[1110,130,569,368]],"src":[],"tts":"왼쪽 아래 먹구름에서 번개가 치고, 맞은편 오른쪽 위에서는 바람이 나무를 휜다. 우레와 바람이 서로 다가붙어 부딪친다, 닥칠 박, 뇌풍상박. 진괘가 동북, 손괘가 서남에서 마주 본다."},{"n":6,"obj":"왼쪽 쪽 그림 — 불과 그 곁에 내려놓은 활·화살통 · 오른쪽 쪽 그림 — 물과 그 곁에 내려놓은 활·화살통","fact":"水火不相射 — 離(東, 왼쪽) ↔ 坎(西, 오른쪽)","hook":"불 곁에도 물 곁에도 내려놓은 활 = 서로 쏘지 않음","say":"왼쪽의 불 곁에도, 오른쪽의 물 곁에도 활과 화살통이 그냥 놓여 있다. 물과 불이 서로 쏘지 않는다 — 쏠 사(射), 水火不相射. 서로 해치지 않고 돕는다는 뜻이다. 離괘가 동, 坎괘가 서에서 마주 본다.","box":[[368,339,512,461],[1175,346,504,454]],"src":[],"tts":"왼쪽의 불 곁에도, 오른쪽의 물 곁에도 활과 화살통이 그냥 놓여 있다. 물과 불이 서로 쏘지 않는다, 쏠 사, 수화불상사. 서로 해치지 않고 돕는다는 뜻이다. 이괘가 동, 감괘가 서에서 마주 본다."},{"n":7,"obj":"현판 여덟의 세 줄 획 — 맨 위는 세 줄 다 이어짐 · 맨 아래는 세 줄 다 끊김 · 왼쪽은 가운데만 끊김 · 오른쪽은 가운데만 이어짐 · 왼쪽 위는 맨 윗줄만 끊김 · 오른쪽 아래는 맨 윗줄만 이어짐 · 오른쪽 위는 맨 아랫줄만 끊김 · 왼쪽 아래는 맨 아랫줄만 이어짐","fact":"三連乾·三絶坤·虛中離·中連坎·上絶兌·上連艮·下絶巽·下連震","hook":"이어진 줄 = 陽 · 끊긴 줄 = 陰 · 마주 보는 짝은 획이 정반대","say":"현판의 세 줄을 본다. 이어진 줄이 陽, 끊긴 줄이 陰이다. 맨 위 乾괘는 세 줄 다 이어져 三連, 맨 아래 坤괘는 세 줄 다 끊겨 三絶. 왼쪽 離괘는 가운데만 비어 虛中, 오른쪽 坎괘는 가운데만 이어져 中連. 왼쪽 위 兌괘는 윗줄만 끊겨 上絶, 맞은편 艮괘는 윗줄만 이어져 上連. 오른쪽 위 巽괘는 아랫줄만 끊겨 下絶, 맞은편 震괘는 아랫줄만 이어져 下連. 마주 보는 짝은 획이 정반대다. 왼쪽을 아래에서 위로 오르면 陽이 자란다 — 震괘 한 줄, 離괘와 兌괘 두 줄, 乾괘 세 줄. 陽息陰消다.","box":[[955,10,138,135],[430,44,166,166],[232,512,126,128],[423,961,154,154],[1461,44,166,166],[1693,512,126,128],[1474,961,154,154],[960,1008,130,128]],"src":[],"tts":"현판의 세 줄을 본다. 이어진 줄이 양, 끊긴 줄이 음이다. 맨 위 건괘는 세 줄 다 이어져 삼련, 맨 아래 곤괘는 세 줄 다 끊겨 삼절. 왼쪽 이괘는 가운데만 비어 허중, 오른쪽 감괘는 가운데만 이어져 중련. 왼쪽 위 태괘는 윗줄만 끊겨 상절, 맞은편 간괘는 윗줄만 이어져 상련. 오른쪽 위 손괘는 아랫줄만 끊겨 하절, 맞은편 진괘는 아랫줄만 이어져 하련. 마주 보는 짝은 획이 정반대다. 왼쪽을 아래에서 위로 오르면 양이 자란다, 진괘 한 줄, 이괘와 태괘 두 줄, 건괘 세 줄. 양식음소다."},{"n":8,"kind":"review","obj":"정자 바닥 한 바퀴 — 타일 여덟 · 현판 여덟 · 마주 보는 네 쌍 · 가운데 伏羲와 흰 여우","fact":"一乾天…八坤地(짝 합 9) · 天地定位·山澤通氣·雷風相薄·水火不相射","hook":"점 타일 · 구미호 · 두 손 · 흰 김 · 번개와 바람 · 내려놓은 활","say":"다시 본다. 타일은 위에서 하나, 왼쪽으로 둘 셋 넷, 오른쪽으로 다섯 여섯 일곱, 아래 여덟 — 마주 보면 아홉. 伏羲의 두 손은 天地定位, 못과 산의 흰 김은 山澤通氣, 번개와 바람은 雷風相薄, 내려놓은 활은 水火不相射.","box":[[137,0,1780,1143]],"src":[],"tts":"다시 본다. 타일은 위에서 하나, 왼쪽으로 둘 셋 넷, 오른쪽으로 다섯 여섯 일곱, 아래 여덟, 마주 보면 아홉. 복희의 두 손은 천지정위, 못과 산의 흰 김은 산택통기, 번개와 바람은 뇌풍상박, 내려놓은 활은 수화불상사."}],"has_image":true},{"id":"yyox-13","title":"八卦 ③ 後天(文王) — 帝出乎震, 한 해를 도는 여덟 동작과 방위","place":"물 위의 여덟 모 물레바퀴","image":"images/lessons/yyox-13.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"물 위에 누워 도는 여덟 모 물레바퀴 — 여덟 칸마다 자줏빛 옷에 금관을 쓴 임금","fact":"後天八卦(文王) — 帝出乎震, 東에서 시계 방향으로 한 해를 돈다 · 위가 南","hook":"자줏빛 임금 = 帝 · 한낮 해 뜬 위쪽 = 南 · 해 뜨는 왼쪽 = 東 · 현판 = 괘","say":"물 위에 여덟 모 물레바퀴가 누워 돈다. 칸마다 자줏빛 옷에 금관을 쓴 임금이 한 번씩 나온다 — 임금 제(帝). 왼쪽 해 뜨는 칸에서 시작해 시계 방향으로 한 바퀴, 하루가 지나고 한 해가 지난다. 文王의 後天八卦다. 옛 그림은 남쪽을 위에 둔다 — 한낮의 해가 뜬 위쪽이 남, 해 뜨는 왼쪽이 동, 해 지는 오른쪽이 서, 달 뜬 아래쪽이 북이다. 칸 끝 현판의 세 줄이 그 칸의 괘다.","box":null,"src":[],"tts":"물 위에 여덟 모 물레바퀴가 누워 돈다. 칸마다 자줏빛 옷에 금관을 쓴 임금이 한 번씩 나온다, 임금 제. 왼쪽 해 뜨는 칸에서 시작해 시계 방향으로 한 바퀴, 하루가 지나고 한 해가 지난다. 문왕의 후천팔괘다. 옛 그림은 남쪽을 위에 둔다, 한낮의 해가 뜬 위쪽이 남, 해 뜨는 왼쪽이 동, 해 지는 오른쪽이 서, 달 뜬 아래쪽이 북이다. 칸 끝 현판의 세 줄이 그 칸의 괘다."},{"n":1,"obj":"왼쪽 칸 — 해 뜰 때 열린 대문으로 걸어 나오는 임금 · 발치에 돋는 새싹 · 현판은 맨 아랫줄만 이어진 세 줄","fact":"帝出乎震 — 震 = 東(春), 만물이 나온다","hook":"해 뜨는 대문을 나서는 임금 = 出 · 새싹 = 봄","say":"왼쪽 칸. 해가 뜨고, 임금이 대문을 열고 나온다. 발치에는 새싹이 돋는다. 임금이 震괘에서 나온다 — 帝出乎震. 震괘는 동쪽이고 봄이다. 만물이 여기서 나온다. 여기서부터 震, 巽, 離, 坤, 兌, 乾, 坎, 艮의 차례로 돈다.","box":[[350,360,543,425],[249,503,142,141]],"src":["PG-06-04","PG-04"],"tts":"왼쪽 칸. 해가 뜨고, 임금이 대문을 열고 나온다. 발치에는 새싹이 돋는다. 임금이 진괘에서 나온다, 제출호진. 진괘는 동쪽이고 봄이다. 만물이 여기서 나온다. 여기서부터 진, 손, 이, 곤, 태, 건, 감, 간의 차례로 돈다."},{"n":2,"obj":"왼쪽 위 칸 — 긴 자를 대고 모종을 한 줄로 맞추는 임금 · 현판은 맨 아랫줄만 끊긴 세 줄","fact":"齊乎巽 — 巽 = 東南, 만물이 깨끗이 가지런해진다(潔齊)","hook":"자를 대고 줄 맞춘 모종 = 가지런할 齊","say":"왼쪽 위 칸. 임금이 긴 자를 대고 모종을 한 줄로 가지런히 맞춘다 — 가지런할 제(齊), 齊乎巽. 巽괘는 동남쪽이다. 만물이 깨끗하고 가지런해진다.","box":[[353,86,598,389],[460,118,146,142]],"src":["PG-06-05"],"tts":"왼쪽 위 칸. 임금이 긴 자를 대고 모종을 한 줄로 가지런히 맞춘다, 가지런할 제, 제호손. 손괘는 동남쪽이다. 만물이 깨끗하고 가지런해진다."},{"n":3,"obj":"맨 위 칸 — 한낮의 해 아래 꼬리 긴 꿩과 얼굴을 맞대고 서로 눈을 들여다보는 임금 · 현판은 가운데 줄만 끊긴 세 줄","fact":"相見乎離 — 離 = 南, 밝아서 만물이 서로 본다","hook":"한낮의 해 + 꿩과 눈을 맞춤 = 相見 · 꿩 = 離의 짐승","say":"맨 위 칸. 한낮의 해 아래 임금이 꼬리 긴 꿩과 얼굴을 맞대고 서로 눈을 들여다본다 — 相見乎離. 離괘는 남쪽이고 밝음이다. 밝아서 만물이 서로 본다. 꿩은 離괘의 짐승이고, 옆 칸에서 밭을 가는 소는 坤괘의 짐승이다.","box":[[786,65,504,382],[953,18,145,142]],"src":["PG-06-03"],"tts":"맨 위 칸. 한낮의 해 아래 임금이 꼬리 긴 꿩과 얼굴을 맞대고 서로 눈을 들여다본다, 상견호리. 이괘는 남쪽이고 밝음이다. 밝아서 만물이 서로 본다. 꿩은 이괘의 짐승이고, 옆 칸에서 밭을 가는 소는 곤괘의 짐승이다."},{"n":4,"obj":"오른쪽 위 칸 — 소에 쟁기를 메워 밭을 가는 임금 · 현판은 세 줄 다 끊김","fact":"致役乎坤 — 坤 = 西南, 땅이 만물을 기른다(致養)","hook":"소를 부려 밭을 갊 = 땅에 일을 맡김(役)","say":"오른쪽 위 칸. 임금이 소를 부려 밭을 간다. 땅에 일을 맡긴다 — 부릴 역(役), 致役乎坤. 坤괘는 서남쪽이다. 땅이 만물을 기른다.","box":[[1095,79,634,396],[1488,119,145,141]],"src":["PG-06-08"],"tts":"오른쪽 위 칸. 임금이 소를 부려 밭을 간다. 땅에 일을 맡긴다, 부릴 역, 치역호곤. 곤괘는 서남쪽이다. 땅이 만물을 기른다."},{"n":5,"obj":"오른쪽 칸 — 단풍잎 날리는 노을 속에 과일 바구니를 안고 입 벌려 웃는 임금 · 현판은 맨 윗줄만 끊긴 세 줄","fact":"說言乎兌 — 兌 = 西(正秋), 만물이 기뻐한다","hook":"가을 열매를 안고 웃음 = 기뻐할 說(열)","say":"오른쪽 칸. 단풍잎이 날리는 가을 저녁, 임금이 과일 바구니를 안고 입을 벌려 웃는다. 기뻐할 열 자를 써서 說言乎兌. 兌괘는 서쪽이고 한가을, 正秋다. 만물이 기뻐한다.","box":[[1160,353,562,432],[1672,504,141,140]],"src":["PG-06-02"],"tts":"오른쪽 칸. 단풍잎이 날리는 가을 저녁, 임금이 과일 바구니를 안고 입을 벌려 웃는다. 기뻐할 열 자를 써서 열언호태. 태괘는 서쪽이고 한가을, 정추다. 만물이 기뻐한다."},{"n":6,"obj":"오른쪽 아래 칸 — 칼을 들고 검은 그림자 무사와 싸우는 임금 · 현판은 세 줄 다 이어짐","fact":"戰乎乾 — 乾 = 西北, 陰과 陽이 서로 부딪친다(相薄)","hook":"검은 그림자와 칼싸움 = 戰 · 어둠(陰)과 밝음(陽)의 다툼","say":"오른쪽 아래 칸. 해 질 녘, 임금이 칼을 들고 검은 그림자 무사와 싸운다 — 싸울 전(戰), 戰乎乾. 乾괘는 서북쪽이다. 陰과 陽이 서로 부딪친다.","box":[[1110,634,605,418],[1488,904,133,128]],"src":["PG-06-01"],"tts":"오른쪽 아래 칸. 해 질 녘, 임금이 칼을 들고 검은 그림자 무사와 싸운다, 싸울 전, 전호건. 건괘는 서북쪽이다. 음과 양이 서로 부딪친다."},{"n":7,"obj":"맨 아래 칸 — 초승달 뜬 밤 물가에 주저앉아 이마를 짚은 지친 임금 · 곁에 내려놓은 연장 · 현판은 가운데 줄만 이어진 세 줄","fact":"勞乎坎 — 坎 = 北(水), 수고한 만물이 돌아가 쉰다(所歸)","hook":"한밤 물가에 지쳐 주저앉음 = 수고로울 勞","say":"맨 아래 칸. 한밤, 초승달 아래 물가에서 임금이 연장을 내려놓고 지쳐 주저앉아 이마를 짚는다 — 수고로울 노(勞), 勞乎坎. 坎괘는 정북쪽이고 물이다. 수고한 만물이 돌아가 쉰다.","box":[[771,706,512,360],[964,1013,131,124]],"src":["PG-06-06"],"tts":"맨 아래 칸. 한밤, 초승달 아래 물가에서 임금이 연장을 내려놓고 지쳐 주저앉아 이마를 짚는다, 수고로울 노, 노호감. 감괘는 정북쪽이고 물이다. 수고한 만물이 돌아가 쉰다."},{"n":8,"obj":"왼쪽 아래 칸 — 산 위 돌탑(망루) 꼭대기에 마지막 돌을 올리는 임금 · 현판은 맨 윗줄만 이어진 세 줄","fact":"成言乎艮 — 艮 = 東北, 끝을 이루고 다시 시작한다","hook":"돌탑의 마지막 돌 = 이룰 成 · 바로 옆이 다시 해 뜨는 칸","say":"왼쪽 아래 칸. 동트기 전 산 위에서 임금이 돌탑에 마지막 돌을 올린다 — 이룰 성(成), 成言乎艮. 艮괘는 동북쪽이고 산이다. 만물이 끝을 이루고 다시 시작한다. 바로 옆이 해 뜨는 震괘다.","box":[[353,634,584,418],[440,904,134,128]],"src":["PG-06-07"],"tts":"왼쪽 아래 칸. 동트기 전 산 위에서 임금이 돌탑에 마지막 돌을 올린다, 이룰 성, 성언호간. 간괘는 동북쪽이고 산이다. 만물이 끝을 이루고 다시 시작한다. 바로 옆이 해 뜨는 진괘다."},{"n":9,"obj":"여덟 모 물레바퀴 전체 — 왼쪽 칸부터 시계 방향으로 대문 · 모종 · 꿩 · 소 · 과일 바구니 · 칼싸움 · 주저앉기 · 돌탑","fact":"後天 차례 — 震→巽→離→坤→兌→乾→坎→艮 (東에서 시계 방향)","hook":"나오고 · 가지런 · 서로 보고 · 길러지고 · 기뻐하고 · 싸우고 · 쉬고 · 이룸","say":"바퀴를 한 바퀴 돌린다. 왼쪽에서 시작해 시계 방향으로 — 震, 巽, 離, 坤, 兌, 乾, 坎, 艮. 나오고, 가지런해지고, 서로 보고, 길러지고, 기뻐하고, 싸우고, 쉬고, 이룬다. 震괘가 봄, 離괘가 여름, 兌괘가 가을, 坎괘가 겨울이다.","box":[238,12,1581,1131],"src":[],"tts":"바퀴를 한 바퀴 돌린다. 왼쪽에서 시작해 시계 방향으로, 진, 손, 이, 곤, 태, 건, 감, 간. 나오고, 가지런해지고, 서로 보고, 길러지고, 기뻐하고, 싸우고, 쉬고, 이룬다. 진괘가 봄, 이괘가 여름, 태괘가 가을, 감괘가 겨울이다."},{"n":10,"obj":"바퀴 한가운데 굴대에 박힌 놋쇠 나침반","fact":"기본서 「방위」 = 後天 자리 · 先天은 乾南·坤北·離東·坎西","hook":"나침반 = 방위를 물으면 이 바퀴(後天)로 답한다","say":"굴대에는 놋쇠 나침반이 박혀 있다. 방위를 물으면 이 바퀴, 後天으로 답한다. 乾괘는 서북, 坎괘는 북, 艮괘는 동북, 震괘는 동, 巽괘는 동남, 離괘는 남, 坤괘는 서남, 兌괘는 서. 伏羲의 先天은 자리가 다르다 — 乾괘가 남, 坤괘가 북, 離괘가 동, 坎괘가 서. 先天은 마주 보는 짝이고, 後天은 돌아가는 차례다.","box":[894,440,267,267],"src":[],"tts":"굴대에는 놋쇠 나침반이 박혀 있다. 방위를 물으면 이 바퀴, 후천으로 답한다. 건괘는 서북, 감괘는 북, 간괘는 동북, 진괘는 동, 손괘는 동남, 이괘는 남, 곤괘는 서남, 태괘는 서. 복희의 선천은 자리가 다르다, 건괘가 남, 곤괘가 북, 이괘가 동, 감괘가 서. 선천은 마주 보는 짝이고, 후천은 돌아가는 차례다."},{"n":11,"kind":"review","obj":"물레바퀴 한 바퀴 — 여덟 칸의 임금과 현판 여덟 · 가운데 나침반","fact":"帝出乎震·齊乎巽·相見乎離·致役乎坤·說言乎兌·戰乎乾·勞乎坎·成言乎艮","hook":"東 震 → 東南 巽 → 南 離 → 西南 坤 → 西 兌 → 西北 乾 → 北 坎 → 東北 艮","say":"다시 돈다. 왼쪽 동, 대문을 나서는 震괘. 동남, 모종을 맞추는 巽괘. 위쪽 남, 꿩과 마주 본 離괘. 서남, 밭 가는 坤괘. 오른쪽 서, 웃는 兌괘. 서북, 싸우는 乾괘. 아래쪽 북, 주저앉은 坎괘. 동북, 돌탑의 艮괘. 가운데 나침반 — 방위는 後天으로 답한다.","box":[[238,12,1581,1131]],"src":[],"tts":"다시 돈다. 왼쪽 동, 대문을 나서는 진괘. 동남, 모종을 맞추는 손괘. 위쪽 남, 꿩과 마주 본 이괘. 서남, 밭 가는 곤괘. 오른쪽 서, 웃는 태괘. 서북, 싸우는 건괘. 아래쪽 북, 주저앉은 감괘. 동북, 돌탑의 간괘. 가운데 나침반, 방위는 후천으로 답한다."}],"has_image":true},{"id":"yyox-14","title":"五運六氣 ① 干支 五行과 同化年 — 天符·歲會·太一天符·同天符·同歲會","place":"六十甲子 관청 마당","image":"images/lessons/yyox-14.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"옛 관청 마당 — 지붕 끝의 깃발 열 · 대청의 판관 · 마당의 색 방석 다섯과 열두 짐승 · 샘가의 두 사람","fact":"干支 五行과 同化年 — 天符·歲會·太一天符·同天符·同歲會","hook":"깃발 = 天干 · 짐승 = 地支 · 옷 색 = 그해의 運 · 머리 위 = 司天 · 방석 = 年支 · 샘 = 在泉","say":"六十甲子를 다스리는 관청 마당이다. 지붕 끝의 깃발 열 개는 天干, 마당의 열두 짐승은 地支다. 사람의 옷 색은 그해의 運이고, 머리 위를 덮은 것은 하늘의 기운 司天, 깔고 앉은 방석은 그해 地支의 자리, 마당 구석의 샘은 땅속의 기운 在泉이다. 運이 이 가운데 어느 것과 같은 五行이 되는 해가 同化年이다. 같은 기운이 겹쳐 치우침이 커지는 해다.","box":null,"src":[],"tts":"육십갑자를 다스리는 관청 마당이다. 지붕 끝의 깃발 열 개는 천간, 마당의 열두 짐승은 지지다. 사람의 옷 색은 그해의 운이고, 머리 위를 덮은 것은 하늘의 기운 사천, 깔고 앉은 방석은 그해 지지의 자리, 마당 구석의 샘은 땅속의 기운 재천이다. 운이 이 가운데 어느 것과 같은 오행이 되는 해가 동화년이다. 같은 기운이 겹쳐 치우침이 커지는 해다."},{"n":1,"obj":"지붕 끝에 한 줄로 걸린 깃발 열 — 큰 것과 작은 것이 짝을 이룬 다섯 쌍: 왼쪽부터 초록 · 빨강 · 노랑 · 하양 · 검정","fact":"天干 형제배속 — 甲乙木·丙丁火·戊己土·庚辛金·壬癸水 (고정, 主運에 씀)","hook":"큰 깃발 = 형(陽干) · 작은 깃발 = 아우(陰干) · 색 = 五行","say":"지붕 끝에 깃발 열 개가 큰 것 작은 것 짝지어 걸렸다. 초록 한 쌍이 甲과 乙, 木. 빨강 한 쌍이 丙과 丁, 火. 노랑 한 쌍이 戊와 己, 土. 하양 한 쌍이 庚과 辛, 金. 검정 한 쌍이 壬과 癸, 水. 큰 깃발이 형, 작은 깃발이 아우라 형제배속이라 한다. 방위처럼 고정되어 변하지 않고, 해마다 똑같이 도는 主運에 쓴다. 甲과 己가 합해 土가 되는 化五運과는 다른 축이다.","box":[101,40,1881,179],"src":["OGI-GJ-01"],"tts":"지붕 끝에 깃발 열 개가 큰 것 작은 것 짝지어 걸렸다. 초록 한 쌍이 갑과 을, 목. 빨강 한 쌍이 병과 정, 화. 노랑 한 쌍이 무와 기, 토. 하양 한 쌍이 경과 신, 금. 검정 한 쌍이 임과 계, 수. 큰 깃발이 형, 작은 깃발이 아우라 형제배속이라 한다. 방위처럼 고정되어 변하지 않고, 해마다 똑같이 도는 주운에 쓴다. 갑과 기가 합해 토가 되는 화오운과는 다른 축이다."},{"n":2,"obj":"마당의 색 방석 다섯과 열두 짐승 — 오른쪽 초록 방석에 호랑이·토끼 · 앞쪽 빨강 방석에 뱀·말 · 왼쪽 하양 방석에 원숭이·닭 · 뒤쪽 검정 방석에 돼지·쥐 · 가운데 노랑 방석에 용·개·소·양","fact":"地支 五行 — 寅卯木·巳午火·申酉金·亥子水·辰戌丑未土","hook":"방석 색 = 五行 · 가운데 노랑에 넷(辰戌丑未) · 오른쪽이 東","say":"마당에 색 방석 다섯이 깔렸다. 오른쪽 동쪽 초록 방석에 호랑이와 토끼 — 寅과 卯, 木. 앞쪽 남쪽 빨강 방석에 뱀과 말 — 巳와 午, 火. 왼쪽 서쪽 하양 방석에 원숭이와 닭 — 申과 酉, 金. 뒤쪽 북쪽 검정 방석에 돼지와 쥐 — 亥와 子, 水. 가운데 노랑 방석에는 넷이 모였다. 용, 개, 소, 양 — 辰, 戌, 丑, 未, 土다.","box":[[1369,555,569,288],[774,850,804,267],[307,588,414,190],[862,483,370,101],[660,562,702,288]],"src":["GAP1-001"],"tts":"마당에 색 방석 다섯이 깔렸다. 오른쪽 동쪽 초록 방석에 호랑이와 토끼, 인과 묘, 목. 앞쪽 남쪽 빨강 방석에 뱀과 말, 사와 오, 화. 왼쪽 서쪽 하양 방석에 원숭이와 닭, 신과 유, 금. 뒤쪽 북쪽 검정 방석에 돼지와 쥐, 해와 자, 수. 가운데 노랑 방석에는 넷이 모였다. 용, 개, 소, 양, 진, 술, 축, 미, 토다."},{"n":3,"obj":"대청 한가운데 노란 휘장 아래 앉은 노란 옷의 판관 — 나무 방망이를 치켜듦","fact":"天符 = 中運과 司天之氣의 五行이 같은 해 (예: 己未年) — 執法","hook":"옷(運)과 머리 위 휘장(司天)이 같은 색 = 하늘과 맞음(天符)","say":"대청 한가운데 판관이 앉았다. 옷도 노랑, 머리 위 휘장도 노랑이다. 그해의 運과 하늘의 기운 司天이 같은 五行인 해 — 天符다. 己未년을 보면 甲과 己가 합한 土運에, 丑未의 太陰濕土가 司天이다. 『六微旨大論』은 하늘과 만난다 하여 天符라 했고, 법을 쥔 벼슬 執法에 견주었다. 모두 열두 해다.","box":[829,123,447,310],"src":["OGI-SANG-02"],"tts":"대청 한가운데 판관이 앉았다. 옷도 노랑, 머리 위 휘장도 노랑이다. 그해의 운과 하늘의 기운 사천이 같은 오행인 해, 천부다. 기미년을 보면 갑과 기가 합한 토운에, 축미의 태음습토가 사천이다. 육미지대론은 하늘과 만난다 하여 천부라 했고, 법을 쥔 벼슬 집법에 견주었다. 모두 열두 해다."},{"n":4,"obj":"오른쪽 초록 방석에 토끼와 함께 앉은 초록 옷의 관리 — 놋쇠 나팔을 붊 · 곁에 수평을 이룬 저울","fact":"歲會 = 中運과 年支 방위 五行이 같은 해 (當位 · 氣之平) — 行令","hook":"옷(運)과 깔고 앉은 방석(年支)이 같은 색 = 제자리(當位) · 수평 저울 = 氣之平","say":"오른쪽 초록 방석에는 초록 옷의 관리가 토끼 곁에 앉아 명을 알리는 나팔을 분다. 옷과 방석이 같은 색이다. 그해의 運과 年支의 五行이 같은 해 — 歲會다. 丁卯년은 木運이 卯에 임했고, 甲辰년은 土運이 辰에 임했다. 木運이 卯에, 火運이 午에, 土運이 辰戌丑未에, 金運이 酉에, 水運이 子에 임하는 여덟 해다. 제자리에 앉았다 하여 當位, 곁의 저울처럼 기운이 고르다 하여 氣之平이라 한다. 명을 행하는 벼슬 行令이다. 天符는 運과 司天, 歲會는 運과 年支 — 섞지 않는다.","box":[[1593,507,209,242],[1640,703,157,121],[1460,675,179,128]],"src":["OGI-SANG-03"],"tts":"오른쪽 초록 방석에는 초록 옷의 관리가 토끼 곁에 앉아 명을 알리는 나팔을 분다. 옷과 방석이 같은 색이다. 그해의 운과 연지의 오행이 같은 해, 세회다. 정묘년은 목운이 묘에 임했고, 갑진년은 토운이 진에 임했다. 목운이 묘에, 화운이 오에, 토운이 진술축미에, 금운이 유에, 수운이 자에 임하는 여덟 해다. 제자리에 앉았다 하여 당위, 곁의 저울처럼 기운이 고르다 하여 기지평이라 한다. 명을 행하는 벼슬 행령이다. 천부는 운과 사천, 세회는 운과 연지, 섞지 않는다."},{"n":5,"obj":"앞쪽 빨강 방석에 말과 함께 앉은 빨간 옷의 귀인 — 빨간 일산을 씀 · 금방울을 단 네 짐승: 말 · 소 · 양 · 닭","fact":"太一天符 = 天符이면서 歲會 — 戊午·己丑·己未·乙酉 넷 — 貴人","hook":"일산(司天)·옷(運)·방석(年支) 셋이 다 빨강 · 금방울 넷 = 말·소·양·닭","say":"앞쪽 빨강 방석에는 빨간 옷의 귀인이 빨간 일산을 쓰고 말 곁에 앉았다. 머리 위도, 옷도, 방석도 한 색이다. 天符이면서 歲會인 해 — 太一天符, 가장 귀한 貴人이다. 금방울을 단 짐승이 넷이다. 말, 소, 양, 닭 — 戊午, 己丑, 己未, 乙酉. 이 네 해뿐이다. 원문 글자는 클 태에 한 일, 太一이다.","box":[[1283,757,233,310],[1028,847,251,251],[1059,559,219,150],[1143,667,186,160],[502,584,150,176]],"src":["OGI-SANG-04"],"tts":"앞쪽 빨강 방석에는 빨간 옷의 귀인이 빨간 일산을 쓰고 말 곁에 앉았다. 머리 위도, 옷도, 방석도 한 색이다. 천부이면서 세회인 해, 태일천부, 가장 귀한 귀인이다. 금방울을 단 짐승이 넷이다. 말, 소, 양, 닭, 무오, 기축, 기미, 을유. 이 네 해뿐이다. 원문 글자는 클 태에 한 일, 태일이다."},{"n":6,"obj":"작은 놋쇠 나팔을 든 토끼와 쥐 · 가운데 노랑 방석의 용과 개","fact":"순수 歲會는 丁卯·丙子 둘 — 甲辰·甲戌은 歲會이면서 同天符","hook":"나팔만 든 토끼·쥐 = 歲會만 · 금방울 넷은 太一天符 · 용·개는 同天符를 겸함","say":"歲會 여덟 해의 짐승을 본다. 토끼, 말, 닭, 쥐, 그리고 노랑 방석의 용, 개, 소, 양이다. 금방울을 단 말, 소, 양, 닭은 太一天符로 올라갔다. 용과 개, 곧 甲辰과 甲戌은 歲會이면서 샘가의 同天符에도 든다. 그래서 관리의 나팔만 든 토끼와 쥐, 丁卯와 丙子 둘만이 어디에도 겹치지 않는 歲會다.","box":[[1460,675,179,128],[1067,464,140,101],[749,598,277,205],[912,677,160,150]],"src":[],"tts":"세회 여덟 해의 짐승을 본다. 토끼, 말, 닭, 쥐, 그리고 노랑 방석의 용, 개, 소, 양이다. 금방울을 단 말, 소, 양, 닭은 태일천부로 올라갔다. 용과 개, 곧 갑진과 갑술은 세회이면서 샘가의 동천부에도 든다. 그래서 관리의 나팔만 든 토끼와 쥐, 정묘와 병자 둘만이 어디에도 겹치지 않는 세회다."},{"n":7,"obj":"왼쪽 앞 돌샘가에 무릎 꿇은 파
