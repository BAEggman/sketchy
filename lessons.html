』 1894. 아기 — 崔圭憲 『小兒醫方』.","box":[[46,507,562,562],[507,435,404,326],[944,248,293,432],[775,689,510,454],[1242,507,231,331],[1473,141,556,582],[1559,752,470,391]],"src":[],"tts":"해 뜨는 쪽에서 다시. 보석 거울, 허준 동의보감 1610. 허리 침, 허임 침구경험방 1644. 해골 책, 주제군징. 찻잔, 정약용 마과회통 1798. 묶은 책, 황도연 방약합편 1885. 자두와 말, 이제마 동의수세보원 1894. 아기, 최규헌 소아의방."}],"has_image":true},{"id":"hist-14","title":"한국 근대 — 서양식 병원과 한의학 교육기관","place":"개항장 부두 거리","image":"images/lessons/hist-14.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"증기선이 들어온 개항장 부두 거리","fact":"한국 근대 — 서양식 병원과 한의학 교육기관(1877 → 1964)","hook":"증기선·부두 = 개항(1877 부산) · 왼쪽 → 오른쪽 = 연도순","say":"증기선이 들어온 개항장 부두다 — 1877년 부산. 배에서 내려 오른쪽으로 걸으면 연도순이다: 서양식 병원들, 한·양 협진, 한의학 학교, 일제의 격하, 그리고 해방 뒤의 한의과 대학.","box":null,"src":[],"tts":"증기선이 들어온 개항장 부두다, 1877년 부산. 배에서 내려 오른쪽으로 걸으면 연도순이다: 서양식 병원들, 한, 양 협진, 한의학 학교, 일제의 격하, 그리고 해방 뒤의 한의과 대학."},{"n":1,"obj":"구명 튜브를 건 흰 서양식 2층 건물(병원) · 양옆의 벚나무 · 문등에 매단 금메달","fact":"濟生醫院(1877 부산 · 일본인) — 최초의 서양식 병원","hook":"구명 튜브 = 濟生 · 벚꽃 = 일본인이 세움 · 금메달 = 최초","say":"부두 앞 흰 서양식 건물이 병원이다. 벽에 구명 튜브를 걸었다 — 건질 제(濟), 살 생(生), 濟生醫院. 양옆의 벚꽃은 일본인이 세웠다는 표시. 문등에 매단 금메달은 우리나라 최초의 서양식 병원, 1877년 부산. 朝鮮 초 鄕藥을 거둔 濟生院(1397)과 이름이 닮았으니 갈라 둔다.","box":[216,29,922,605],"src":["UHG-014"],"tts":"부두 앞 흰 서양식 건물이 병원이다. 벽에 구명 튜브를 걸었다, 건질 제, 살 생, 제생의원. 양옆의 벚꽃은 일본인이 세웠다는 표시. 문등에 매단 금메달은 우리나라 최초의 서양식 병원, 1877년 부산. 조선 초 향약을 거둔 제생원 1397과 이름이 닮았으니 갈라 둔다."},{"n":2,"obj":"검은 왕진 가방을 든 서양 의사가 사람을 가득 실은 작은 배를 밧줄로 끌어당김","fact":"알렌 — 廣惠院 → 濟衆院(1885) 최초 서양식 국립병원","hook":"넓은(廣) 은혜(惠) → 무리(衆)를 건짐(濟) = 廣惠院 → 濟衆院","say":"물가, 왕진 가방을 든 서양 의사가 사람을 가득 실은 배를 밧줄로 끌어당긴다 — 알렌이다. 처음 이름은 넓은 은혜의 廣惠院, 같은 해 건질 제(濟), 무리 중(衆) — 무리를 건지는 濟衆院으로 바꿨다. 1885년, 최초의 서양식 국립병원.","box":[14,562,786,447],"src":["UHG-015"],"tts":"물가, 왕진 가방을 든 서양 의사가 사람을 가득 실은 배를 밧줄로 끌어당긴다, 알렌이다. 처음 이름은 넓은 은혜의 광혜원, 같은 해 건질 제, 무리 중, 무리를 건지는 제중원으로 바꿨다. 1885년, 최초의 서양식 국립병원."},{"n":3,"obj":"넓은 평상에 누운 환자 한 명을 서양 의사(청진기)와 한의사(침)가 함께 돌봄","fact":"廣濟院 — 양·한방 협진(지문 1889 · 통설 1900)","hook":"넓은(廣) 평상 · 함께 건짐(濟) = 廣濟院 · 청진기 + 침 = 협진","say":"가운데, 넓은 평상에 누운 환자 한 사람을 청진기 든 서양 의사와 침 든 한의사가 함께 돌본다 — 넓을 광(廣), 건질 제(濟), 廣濟院. 양방과 한방이 함께 본 협진 병원이다. 문제 지문은 1889년, 통설은 1900년 — 內部病院을 고친 이름이다.","box":[807,526,533,497],"src":["UHG-016"],"tts":"가운데, 넓은 평상에 누운 환자 한 사람을 청진기 든 서양 의사와 침 든 한의사가 함께 돌본다, 넓을 광, 건질 제, 광제원. 양방과 한방이 함께 본 협진 병원이다. 문제 지문은 1889년, 통설은 1900년, 내부병원을 고친 이름이다."},{"n":4,"obj":"침 꽂힌 인체 모형을 둘러싸고 책을 든 학생들의 작은 학교 · 문간의 용 수놓은 비단 주머니와 금괴 · 교문의 금메달","fact":"同濟醫學校(1904) — 고종 사재(내탕금) · 최초 한의학 교육기관","hook":"함께(同) 배움 = 同濟 · 용 주머니 = 임금의 사재 · 금메달 = 최초","say":"작은 학교에서 학생들이 책을 들고 침 꽂힌 인체 모형을 둘러싸 함께 공부한다 — 한가지 동(同), 同濟醫學校. 문간의 용 수놓은 비단 주머니에서 금괴가 쏟아진다 — 임금의 주머니, 고종의 사재, 곧 내탕금으로 세웠다. 교문의 금메달은 최초의 한의학 교육기관, 1904년.","box":[1165,245,525,497],"src":["UHG-010"],"tts":"작은 학교에서 학생들이 책을 들고 침 꽂힌 인체 모형을 둘러싸 함께 공부한다, 한가지 동, 동제의학교. 문간의 용 수놓은 비단 주머니에서 금괴가 쏟아진다, 임금의 주머니, 고종의 사재, 곧 내탕금으로 세웠다. 교문의 금메달은 최초의 한의학 교육기관, 1904년."},{"n":5,"obj":"교단 위 검은 제복의 사내 · 그 아래 방석에 학생처럼 놀라 앉은 한의사","fact":"醫生規則(1913) — 한의사를 醫師에서 醫生으로 격하","hook":"스승(師)의 교단 → 학생(生)의 방석 = 師 → 生 격하","say":"오른쪽 앞, 검은 제복의 사내가 교단을 차지했고, 한의사는 그 아래 학생 방석에 밀려 앉아 놀란다 — 스승 사(師)에서 날 생(生)으로, 醫師를 醫生으로 깎아내린 醫生規則, 1913년 일제. 1907년 세운 大韓醫院은 서양 의사가 모자랐다.","box":[1441,490,607,605],"src":["UHG-013"],"tts":"오른쪽 앞, 검은 제복의 사내가 교단을 차지했고, 한의사는 그 아래 학생 방석에 밀려 앉아 놀란다, 스승 사에서 날 생으로, 의사를 의생으로 깎아내린 의생규칙, 1913년 일제. 1907년 세운 대한의원은 서양 의사가 모자랐다."},{"n":6,"obj":"뒤쪽의 낮은 갈색 학교 건물","fact":"東洋大學館(1948) — 최초의 4년제 한의과 교육기관","hook":"낮은 건물 = 4년제 · 먼저(1948)","say":"맨 뒤, 해방 뒤에 선 학교 건물 둘. 낮은 갈색 건물이 東洋大學館 — 1948년, 최초의 4년제 한의과 교육기관이다.","box":[1499,151,267,353],"src":["UHG-011"],"tts":"맨 뒤, 해방 뒤에 선 학교 건물 둘. 낮은 갈색 건물이 동양대학관, 1948년, 최초의 4년제 한의과 교육기관이다."},{"n":7,"obj":"그 곁의 더 높은 학교 건물","fact":"東洋醫科大學(1964) — 최초의 6년제 한의과대학 → 경희대","hook":"더 높은 건물 = 6년제 · 나중(1964)","say":"그 곁 더 높은 건물이 東洋醫科大學 — 1964년, 최초의 6년제 한의과대학. 뒤에 경희대 한의대로 이어졌다. 낮은 건물 4년제가 먼저, 높은 건물 6년제가 나중.","box":[1756,32,291,480],"src":["UHG-012"],"tts":"그 곁 더 높은 건물이 동양의과대학, 1964년, 최초의 6년제 한의과대학. 뒤에 경희대 한의대로 이어졌다. 낮은 건물 4년제가 먼저, 높은 건물 6년제가 나중."},{"n":8,"kind":"review","obj":"부두에서 오른쪽으로 — 구명 튜브 병원 · 끌어올린 배 · 넓은 의자 · 작은 학교 · 교단 · 학교 건물 둘","fact":"濟生醫院 1877 → 濟衆院 1885 → 廣濟院 → 同濟 1904 → 醫生規則 1913 → 1948·1964","hook":"병원 셋(濟生·濟衆·廣濟) → 학교(同濟) → 격하(醫生) → 대학 둘(4년·6년)","say":"부두부터 다시. 구명 튜브 濟生醫院 1877, 배를 끄는 알렌 濟衆院 1885, 넓은 평상 협진 廣濟院. 용 주머니 同濟醫學校 1904, 교단에서 방석으로 醫生規則 1913. 낮은 건물 東洋大學館 1948, 높은 건물 東洋醫科大學 1964.","box":[[216,29,922,605],[14,562,786,447],[807,526,533,497],[1165,245,525,497],[1441,490,607,605],[1499,151,267,353],[1756,32,291,480]],"src":[],"tts":"부두부터 다시. 구명 튜브 제생의원 1877, 배를 끄는 알렌 제중원 1885, 넓은 평상 협진 광제원. 용 주머니 동제의학교 1904, 교단에서 방석으로 의생규칙 1913. 낮은 건물 동양대학관 1948, 높은 건물 동양의과대학 1964."}],"has_image":true},{"id":"hp-01","title":"藥性 ① 四氣五味 — 차고 더운 네 기운 · 다섯 맛의 작용","place":"온도 다이얼 달린 다섯 맛 분식집","image":"images/lessons/hp-01.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"다섯 맛 분식집 — 벽의 반원 온도 다이얼 · 다섯 칸으로 나뉜 카운터 · 앞쪽의 두 손님","fact":"藥性 — 四氣(寒·凉·溫·熱)와 五味(酸·苦·甘·辛·鹹)","hook":"온도 다이얼 = 四氣 · 카운터 다섯 칸 = 五味","say":"작은 분식집이다. 벽에 커다란 반원 다이얼이 걸렸고, 카운터는 다섯 칸으로 나뉘었다. 약에는 차고 더운 성질, 四氣가 있고 다섯 가지 맛, 五味가 있다. 藥性의 첫 두 기둥이다. 다이얼이 四氣이고, 카운터 다섯 칸이 五味다.","box":null,"src":[],"tts":"작은 분식집이다. 벽에 커다란 반원 다이얼이 걸렸고, 카운터는 다섯 칸으로 나뉘었다. 약에는 차고 더운 성질, 사기가 있고 다섯 가지 맛, 오미가 있다. 약성의 첫 두 기둥이다. 다이얼이 사기이고, 카운터 다섯 칸이 오미다."},{"n":1,"obj":"벽의 반원 다이얼 — 왼쪽부터 진파랑 큰 눈송이 · 연파랑 작은 눈송이 · 주황 작은 불꽃 · 빨강 큰 불꽃 · 오른쪽 창의 햇빛이 불꽃 쪽 끝 빨강 칸을 비춤","fact":"四氣 寒·凉·溫·熱(凉=微寒) · 溫熱=陽 · 寒凉=陰","hook":"작은 눈송이 = 조금 찬 凉 · 볕 드는 불꽃 쪽 = 陽 · 반대편 눈송이 쪽 = 陰","say":"벽의 다이얼을 왼쪽부터 읽는다. 진파랑 큰 눈송이 — 찰 한(寒). 연파랑 작은 눈송이 — 서늘할 량(凉), 조금 찬 微寒이다. 주황 작은 불꽃 — 따뜻할 온(溫), 조금 더운 것. 빨강 큰 불꽃 — 더울 열(熱). 이 넷이 四氣, 四性이다. 오른쪽 창에서 든 햇빛이 불꽃 쪽을 비춘다. 볕 드는 불꽃 쪽, 溫熱은 陽이라 補益하고, 風寒을 發散하고, 속을 덥히는 溫裏를 한다. 반대편 눈송이 쪽, 寒凉은 陰이라 열을 식히는 淸熱, 피를 서늘하게 하는 凉血을 한다.","box":[[613,22,829,425],[1766,29,151,252]],"src":["BC-4G-01"],"tts":"벽의 다이얼을 왼쪽부터 읽는다. 진파랑 큰 눈송이, 찰 한. 연파랑 작은 눈송이, 서늘할 량, 조금 찬 미한이다. 주황 작은 불꽃, 따뜻할 온, 조금 더운 것. 빨강 큰 불꽃, 더울 열. 이 넷이 사기, 사성이다. 오른쪽 창에서 든 햇빛이 불꽃 쪽을 비춘다. 볕 드는 불꽃 쪽, 온열은 양이라 보익하고, 풍한을 발산하고, 속을 덥히는 온리를 한다. 반대편 눈송이 쪽, 한량은 음이라 열을 식히는 청열, 피를 서늘하게 하는 양혈을 한다."},{"n":2,"obj":"앞쪽 두 손님 — 왼쪽은 눈썹에 서리 앉은 패딩 남자가 가스버너 위 끓는 국을 먹음 · 오른쪽은 땀 흘리는 민소매 남자가 얼음 빙수를 먹음","fact":"治寒用熱藥 · 治熱用寒藥 — 찬 병엔 더운 약, 더운 병엔 찬 약","hook":"얼어붙은 손님엔 끓는 국 · 땀범벅 손님엔 얼음","say":"앞쪽 두 손님을 본다. 왼쪽 남자는 눈썹에 서리가 앉은 채 떨면서, 가스버너 위에서 끓는 국을 떠먹는다. 오른쪽 남자는 얼굴이 벌겋고 땀을 뚝뚝 흘리며 얼음 빙수를 먹는다. 찬 병에는 더운 약을, 더운 병에는 찬 약을 쓴다 — 治寒用熱藥, 治熱用寒藥. 얼음은 寒, 불은 熱이다.","box":[[86,721,447,422],[1600,742,411,401]],"src":[],"tts":"앞쪽 두 손님을 본다. 왼쪽 남자는 눈썹에 서리가 앉은 채 떨면서, 가스버너 위에서 끓는 국을 떠먹는다. 오른쪽 남자는 얼굴이 벌겋고 땀을 뚝뚝 흘리며 얼음 빙수를 먹는다. 찬 병에는 더운 약을, 더운 병에는 찬 약을 쓴다, 치한용열약, 치열용한약. 얼음은 한, 불은 열이다."},{"n":3,"obj":"카운터 첫 칸 — 자른 레몬 바구니 · 물이 가득한데 주둥이 끈을 꽉 조여 한 방울도 새지 않는 천 주머니","fact":"酸 — 五能 收 · 작용 收澀(斂汗·澀精·止瀉)","hook":"레몬 = 酸 · 꽉 조인 주머니 = 거두고 막는 收澀","say":"카운터 첫 칸에 자른 레몬이 있다 — 신맛, 酸. 곁의 천 주머니에는 물이 가득한데, 주둥이 끈을 꽉 조여 한 방울도 새지 않는다. 신맛은 거두어들인다 — 酸收. 거두고 막아서 새는 것을 멈춘다 — 收澀. 땀이 새면 斂汗, 精이 새면 澀精, 설사가 새면 止瀉다.","box":[[50,569,216,144],[274,526,159,187]],"src":["BC-5M-01-01","BC-5M-02-01"],"tts":"카운터 첫 칸에 자른 레몬이 있다, 신맛, 산. 곁의 천 주머니에는 물이 가득한데, 주둥이 끈을 꽉 조여 한 방울도 새지 않는다. 신맛은 거두어들인다, 산수. 거두고 막아서 새는 것을 멈춘다, 수삽. 땀이 새면 염한, 정이 새면 삽정, 설사가 새면 지사다."},{"n":4,"obj":"둘째 칸 — 김 나는 블랙커피 · 종이 필터에서 아래로 똑똑 떨어지는 커피 · 바짝 말라 뒤틀리고 갈라져 굳은 설거지 스펀지(초록 수세미 면)","fact":"苦 — 五能 堅 · 작용 泄·燥·堅(降泄·燥濕·堅陰)","hook":"아래로 떨어지는 커피 = 泄 · 말라 굳은 스펀지 = 燥 · 堅","say":"둘째 칸은 김 나는 블랙커피 — 쓴맛, 苦. 종이 필터에서 커피가 아래로 똑똑 떨어진다. 아래로 빼내는 泄, 降泄이다. 곁의 설거지 스펀지는 바짝 말라 뒤틀리고 갈라져 돌처럼 굳었다. 습을 말리는 燥, 燥濕이고, 단단하게 하는 堅, 堅陰이다. 五能 카드는 苦를 한 글자로 堅이라 묻는다.","box":[[468,476,270,245],[718,634,125,89]],"src":["BC-5M-01-02","BC-5M-02-02"],"tts":"둘째 칸은 김 나는 블랙커피, 쓴맛, 고. 종이 필터에서 커피가 아래로 똑똑 떨어진다. 아래로 빼내는 설, 강설이다. 곁의 설거지 스펀지는 바짝 말라 뒤틀리고 갈라져 돌처럼 굳었다. 습을 말리는 조, 조습이고, 단단하게 하는 견, 견음이다. 오능 카드는 고를 한 글자로 견이라 묻는다."},{"n":5,"obj":"한가운데 칸 — 기울인 금빛 꿀단지에서 길게 늘어지며 아주 천천히 흘러 빈 그릇을 채우는 꿀","fact":"甘 — 五能 緩 · 작용 補·和·緩","hook":"느릿느릿 늘어지는 꿀 = 緩 · 그릇을 채움 = 補 · 한가운데 = 和","say":"카운터 한가운데에 금빛 꿀단지가 기울었다 — 단맛, 甘. 꿀이 길게 늘어지며 아주 천천히 흘러내린다. 급한 것을 늦추는 緩이다. 빈 그릇이 차오른다 — 채우는 補. 다섯 칸의 한가운데에 앉아 다른 맛들을 어울리게 한다 — 和. 五能 카드는 甘을 緩이라 묻는다.","box":[872,418,317,303],"src":["BC-5M-01-03","BC-5M-02-03"],"tts":"카운터 한가운데에 금빛 꿀단지가 기울었다, 단맛, 감. 꿀이 길게 늘어지며 아주 천천히 흘러내린다. 급한 것을 늦추는 완이다. 빈 그릇이 차오른다, 채우는 보. 다섯 칸의 한가운데에 앉아 다른 맛들을 어울리게 한다, 화. 오능 카드는 감을 완이라 묻는다."},{"n":6,"obj":"넷째 칸 — 붉은 고추 더미 · 양옆으로 넓게 부채꼴로 흩날리는 고춧가루","fact":"辛 — 五能 散 · 작용 散·潤·橫行(發散·行氣活血)","hook":"양옆으로 흩날리는 고춧가루 = 흩는 散 · 옆으로 가는 橫行","say":"넷째 칸은 붉은 고추 — 매운맛, 辛. 고춧가루가 양옆으로 넓게 부채꼴로 흩날린다. 흩어 내보내는 散, 發散이다. 옆으로 퍼져 가는 橫行은 막힌 氣와 血을 돌린다 — 行氣活血. 腠理를 열어 진액이 돌게 하니, 적시는 潤도 辛에 붙는다.","box":[[1240,598,339,130],[1167,476,533,130]],"src":["BC-5M-01-04","BC-5M-02-04"],"tts":"넷째 칸은 붉은 고추, 매운맛, 신. 고춧가루가 양옆으로 넓게 부채꼴로 흩날린다. 흩어 내보내는 산, 발산이다. 옆으로 퍼져 가는 횡행은 막힌 기와 혈을 돌린다, 행기활혈. 주리를 열어 진액이 돌게 하니, 적시는 윤도 신에 붙는다."},{"n":7,"obj":"마지막 칸 — 흰 소금 더미 · 나무 통 속 배추가 소금에 절여져 잎이 흐물흐물 늘어지고 아래 소금물로 처짐","fact":"鹹 — 五能 軟 · 작용 下·軟堅(軟堅散結) · 辛甘=陽 · 酸苦鹹=陰","hook":"절여져 흐물해진 배추 = 굳은 것을 무르게 하는 軟堅 · 아래로 처짐 = 下","say":"마지막 칸은 흰 소금 — 짠맛, 鹹. 나무 통 속 배추가 소금에 절여져, 빳빳하던 잎이 흐물흐물 늘어지고 아래 소금물로 처졌다. 굳은 것을 무르게 하는 軟, 軟堅이고 맺힌 것을 푸는 散結이다. 아래로 내리는 下도 짠맛의 일이다. 덧붙여 五味의 陰陽 — 辛甘은 發散하니 陽, 酸苦鹹은 涌泄하니 陰이다.","box":[[1629,620,144,94],[1730,461,303,259]],"src":["BC-5M-01-05","BC-5M-02-05"],"tts":"마지막 칸은 흰 소금, 짠맛, 함. 나무 통 속 배추가 소금에 절여져, 빳빳하던 잎이 흐물흐물 늘어지고 아래 소금물로 처졌다. 굳은 것을 무르게 하는 연, 연견이고 맺힌 것을 푸는 산결이다. 아래로 내리는 하도 짠맛의 일이다. 덧붙여 오미의 음양, 신감은 발산하니 양, 산고함은 용설하니 음이다."},{"n":8,"kind":"review","obj":"분식집 한 바퀴 — 다이얼과 두 손님 · 레몬 · 커피 · 꿀 · 고추 · 소금","fact":"寒凉=陰 · 溫熱=陽 / 酸收 · 苦堅 · 甘緩 · 辛散 · 鹹軟","hook":"눈송이 둘 · 불꽃 둘 / 주머니 · 스펀지 · 꿀 줄기 · 고춧가루 · 절인 배추","say":"다시 본다. 다이얼의 큰 눈송이와 작은 눈송이 — 寒凉, 陰. 작은 불꽃과 큰 불꽃 — 溫熱, 陽. 떠는 손님엔 끓는 국, 땀 흘리는 손님엔 빙수. 레몬과 꽉 조인 주머니 — 酸收, 收澀. 커피 방울과 굳은 스펀지 — 苦는 泄하고 燥하고 堅하다. 느린 꿀 — 甘緩, 補하고 和한다. 흩날리는 고춧가루 — 辛散. 절인 배추 — 鹹軟, 軟堅하고 下한다.","box":[[613,22,829,425],[274,526,159,187],[872,418,317,303],[1730,461,303,259]],"src":[],"tts":"다시 본다. 다이얼의 큰 눈송이와 작은 눈송이, 한량, 음. 작은 불꽃과 큰 불꽃, 온열, 양. 떠는 손님엔 끓는 국, 땀 흘리는 손님엔 빙수. 레몬과 꽉 조인 주머니, 산수, 수삽. 커피 방울과 굳은 스펀지, 고는 설하고 조하고 견하다. 느린 꿀, 감완, 보하고 화한다. 흩날리는 고춧가루, 신산. 절인 배추, 함연, 연견하고 하한다."}],"has_image":true},{"id":"hp-02","title":"藥性 ② 升降浮沈 — 약이 가는 방향과 그것을 바꾸는 포제","place":"엘리베이터 있는 실내 수영장","image":"images/lessons/hp-02.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"실내 수영장 단면 — 왼쪽 유리 엘리베이터 두 칸 · 수면과 깊은 물 · 천장 아래 열기구 · 오른쪽 안전요원","fact":"升降浮沈 — 약 기운이 몸 안에서 가는 방향(위·아래·밖·안)","hook":"오르내리는 엘리베이터 · 뜨고 가라앉는 수영장 = 升降浮沈","say":"유리 천장 아래 실내 수영장을 옆에서 잘라 본다. 왼쪽에는 유리 엘리베이터가 오르내리고, 물 위에 뜬 사람과 물속으로 가라앉는 사람이 있다. 오를 승, 내릴 강, 뜰 부, 잠길 침 — 升降浮沈. 약 기운이 몸 안에서 어느 쪽으로 가는지다. 이 수영장에서는 위아래 자리가 곧 방향이다.","box":null,"src":[],"tts":"유리 천장 아래 실내 수영장을 옆에서 잘라 본다. 왼쪽에는 유리 엘리베이터가 오르내리고, 물 위에 뜬 사람과 물속으로 가라앉는 사람이 있다. 오를 승, 내릴 강, 뜰 부, 잠길 침, 승강부침. 약 기운이 몸 안에서 어느 쪽으로 가는지다. 이 수영장에서는 위아래 자리가 곧 방향이다."},{"n":1,"obj":"왼쪽 유리 엘리베이터 — 꼭대기 쪽으로 올라가는 칸 · 바닥 쪽으로 내려가는 칸","fact":"升 = 上升(위로 오름) · 降 = 下降(아래로 내림)","hook":"올라가는 칸 = 升 · 내려가는 칸 = 降","say":"왼쪽 유리 엘리베이터는 두 칸이다. 한 칸은 꼭대기 쪽으로 올라가고, 다른 한 칸은 바닥 쪽으로 내려간다. 오를 승(升)은 위로 오르는 上升, 내릴 강(降)은 아래로 내리는 下降이다.","box":[[89,159,221,375],[343,663,205,360]],"src":[],"tts":"왼쪽 유리 엘리베이터는 두 칸이다. 한 칸은 꼭대기 쪽으로 올라가고, 다른 한 칸은 바닥 쪽으로 내려간다. 오를 승은 위로 오르는 상승, 내릴 강은 아래로 내리는 하강이다."},{"n":2,"obj":"수영장 — 수면에 별처럼 팔다리를 벌리고 떠서 물결을 바깥으로 퍼뜨리는 여자 · 깊은 물로 내려가는 잠수부와 물이 빨려 내려가는 바닥 배수구","fact":"浮 = 上行發散(떠올라 밖으로 흩음) · 沈 = 下行泄利(가라앉아 아래로 빼냄)","hook":"뜬 채 물결을 퍼뜨림 = 浮 · 배수구로 빨려 내려감 = 沈","say":"수면에는 여자가 별처럼 팔다리를 벌리고 떠서, 물결을 바깥으로 동그랗게 퍼뜨린다. 뜰 부(浮) — 위로 떠서 밖으로 흩는 上行發散이다. 그 아래 깊은 물로 잠수부가 내려가고, 곁의 바닥 배수구로 물이 소용돌이치며 빨려 내려간다. 잠길 침(沈) — 아래로 가라앉아 빼내는 下行泄利다. 엘리베이터의 升降과 합쳐 넷이다.","box":[[692,526,735,195],[1175,742,252,252],[1283,994,259,112]],"src":["BC-SB-01-01"],"tts":"수면에는 여자가 별처럼 팔다리를 벌리고 떠서, 물결을 바깥으로 동그랗게 퍼뜨린다. 뜰 부, 위로 떠서 밖으로 흩는 상행발산이다. 그 아래 깊은 물로 잠수부가 내려가고, 곁의 바닥 배수구로 물이 소용돌이치며 빨려 내려간다. 잠길 침, 아래로 가라앉아 빼내는 하행설리다. 엘리베이터의 승강과 합쳐 넷이다."},{"n":3,"obj":"유리 천장으로 볕이 가득한 위쪽 · 어둑한 검푸른 깊은 물","fact":"升浮=陽(發表·催吐·祛風·開竅) · 沈降=陰(收斂·降逆·滲利·安神)","hook":"볕 든 위 = 升浮 = 陽 · 어두운 깊은 물 = 沈降 = 陰","say":"위쪽은 유리 천장으로 볕이 가득하고, 깊은 물은 어둑하다. 위로 떠올라 밖으로 흩는 升浮는 陽이다. 땀을 내 겉을 푸는 發表, 토하게 하는 催吐, 風을 몰아내는 祛風, 막힌 구멍을 여는 開竅가 升浮의 일이다. 아래로 가라앉아 안으로 거두는 沈降은 陰이다. 거두어들이는 收斂, 치민 氣를 내리는 降逆, 물을 빼는 滲利, 마음을 가라앉히는 安神이 沈降의 일이다.","box":[[569,0,1477,490],[569,728,1247,415]],"src":["BC-SB-01-02"],"tts":"위쪽은 유리 천장으로 볕이 가득하고, 깊은 물은 어둑하다. 위로 떠올라 밖으로 흩는 승부는 양이다. 땀을 내 겉을 푸는 발표, 토하게 하는 최토, 풍을 몰아내는 거풍, 막힌 구멍을 여는 개규가 승부의 일이다. 아래로 가라앉아 안으로 거두는 침강은 음이다. 거두어들이는 수렴, 치민 기를 내리는 강역, 물을 빼는 삼리, 마음을 가라앉히는 안신이 침강의 일이다."},{"n":4,"obj":"천장 아래로 떠오르는 열기구 — 버너 불꽃 · 바구니의 붉은 고추와 꿀단지 / 깊은 바닥에 서리 덮여 가라앉은 레몬 · 커피잔 · 소금통","fact":"辛甘·溫熱 → 대개 升浮 / 酸苦鹹·寒凉 → 대개 沈降","hook":"불꽃 + 고추·꿀 = 떠오름 · 서리 덮인 레몬·커피·소금 = 가라앉음","say":"천장 아래로 열기구가 떠오른다. 버너 불꽃은 溫熱, 바구니의 붉은 고추와 꿀단지는 辛과 甘이다. 辛甘하고 溫熱한 약은 대개 升浮한다. 깊은 바닥에는 서리 덮인 레몬, 커피잔, 소금통이 가라앉았다. 酸, 苦, 鹹에 서리의 寒凉 — 대개 沈降한다. 맛과 기운이 방향을 정하지만 配伍와 炮製로 바뀐다. 川芎처럼 위로는 머리, 아래로는 血海까지 두 방향으로 가는 약도 있다 — 雙向性이다.","box":[[966,0,288,317],[663,908,504,202]],"src":["BC-SB-02"],"tts":"천장 아래로 열기구가 떠오른다. 버너 불꽃은 온열, 바구니의 붉은 고추와 꿀단지는 신과 감이다. 신감하고 온열한 약은 대개 승부한다. 깊은 바닥에는 서리 덮인 레몬, 커피잔, 소금통이 가라앉았다. 산, 고, 함에 서리의 한량, 대개 침강한다. 맛과 기운이 방향을 정하지만 배오와 포제로 바뀐다. 천궁처럼 위로는 머리, 아래로는 혈해까지 두 방향으로 가는 약도 있다, 쌍향성이다."},{"n":5,"obj":"올라가는 엘리베이터 칸 — 얼굴 붉은 남자가 초록 술병을 치켜듦","fact":"酒炒則升 — 술로 볶으면 약 기운을 위로 올린다","hook":"술병 든 붉은 얼굴이 꼭대기로 = 酒製 升","say":"위로 올라가는 엘리베이터 칸을 다시 본다. 얼굴이 벌건 남자가 초록 술병을 치켜들었다. 술을 마시면 얼굴로 열이 오르듯, 술로 볶으면 약 기운이 위로 오른다 — 酒炒則升.","box":[89,159,221,375],"src":["BC-SB-03-01"],"tts":"위로 올라가는 엘리베이터 칸을 다시 본다. 얼굴이 벌건 남자가 초록 술병을 치켜들었다. 술을 마시면 얼굴로 열이 오르듯, 술로 볶으면 약 기운이 위로 오른다, 주초즉승."},{"n":6,"obj":"오른쪽 안전요원 — 울퉁불퉁한 생강 뿌리를 쥐어짜 즙이 사방으로 튐","fact":"薑汁炒則散 — 생강즙으로 볶으면 흩는다","hook":"사방으로 튀는 생강즙 = 散","say":"오른쪽 안전요원이 울퉁불퉁한 생강 뿌리를 주먹으로 쥐어짜자, 즙이 스프링클러처럼 사방으로 튄다. 생강즙으로 볶으면 흩는다 — 薑汁炒則散.","box":[1549,324,331,353],"src":["BC-SB-03-02"],"tts":"오른쪽 안전요원이 울퉁불퉁한 생강 뿌리를 주먹으로 쥐어짜자, 즙이 스프링클러처럼 사방으로 튄다. 생강즙으로 볶으면 흩는다, 강즙초즉산."},{"n":7,"obj":"안전요원 곁 벤치 — 투명한 연노랑 식초병 · 주둥이 끈을 꽉 조여 묶은 수영 가방","fact":"醋炒則斂 — 식초로 볶으면 거두어들인다(收斂)","hook":"식초 곁 꽉 조인 가방 = 斂 (酸收의 끈 주머니와 같은 뜻)","say":"그 곁 벤치에 투명한 연노랑 식초병과 수영 가방이 있다. 가방 주둥이 끈을 꽉 조였다. 식초는 신맛이고, 신맛은 거둔다 — 酸收. 식초로 볶으면 거두어들인다 — 醋炒則斂, 收斂이다.","box":[1881,440,166,137],"src":["BC-SB-03-03"],"tts":"그 곁 벤치에 투명한 연노랑 식초병과 수영 가방이 있다. 가방 주둥이 끈을 꽉 조였다. 식초는 신맛이고, 신맛은 거둔다, 산수. 식초로 볶으면 거두어들인다, 초초즉렴, 수렴이다."},{"n":8,"obj":"내려가는 엘리베이터 칸 — 물이 찰랑이는 양동이(위에 흰 소금 알갱이)를 든 남자","fact":"鹽水炒則下行 — 소금물로 볶으면 아래로 내려간다","hook":"소금물 양동이 들고 바닥으로 = 鹽水炒 下行","say":"바닥으로 내려가는 엘리베이터 칸에서는 남자가 찰랑이는 소금물 양동이를 들었다. 물 위에 흰 소금 알갱이가 떴다. 짠맛은 아래로 내린다. 소금물로 볶으면 약 기운이 아래로 간다 — 鹽水炒則下行.","box":[343,663,205,360],"src":["BC-SB-03-04"],"tts":"바닥으로 내려가는 엘리베이터 칸에서는 남자가 찰랑이는 소금물 양동이를 들었다. 물 위에 흰 소금 알갱이가 떴다. 짠맛은 아래로 내린다. 소금물로 볶으면 약 기운이 아래로 간다, 염수초즉하행."},{"n":9,"kind":"review","obj":"수영장 한 바퀴 — 엘리베이터 두 칸 · 뜬 여자와 잠수부 · 볕과 깊은 물 · 열기구와 바닥 · 생강과 식초","fact":"升浮=陽 · 沈降=陰 / 酒 升 · 薑汁 散 · 醋 斂 · 鹽水 下行","hook":"술병 오름 · 소금물 내림 · 생강즙 흩음 · 식초 가방 조임","say":"다시 본다. 올라가는 칸과 내려가는 칸 — 升과 降. 뜬 여자의 물결과 배수구 — 浮는 上行發散, 沈은 下行泄利. 볕 든 위는 陽, 어두운 깊은 물은 陰. 열기구의 불꽃과 고추, 꿀 — 辛甘溫熱은 升浮, 바닥의 레몬, 커피, 소금 — 酸苦鹹寒凉은 沈降. 술병은 올라간다 — 酒炒則升. 생강즙은 흩어진다 — 薑汁炒則散. 식초 가방은 조인다 — 醋炒則斂. 소금물은 내려간다 — 鹽水炒則下行.","box":[[89,159,221,375],[343,663,205,360],[1549,324,331,353],[1881,440,166,137]],"src":[],"tts":"다시 본다. 올라가는 칸과 내려가는 칸, 승과 강. 뜬 여자의 물결과 배수구, 부는 상행발산, 침은 하행설리. 볕 든 위는 양, 어두운 깊은 물은 음. 열기구의 불꽃과 고추, 꿀, 신감온열은 승부, 바닥의 레몬, 커피, 소금, 산고함한량은 침강. 술병은 올라간다, 주초즉승. 생강즙은 흩어진다, 강즙초즉산. 식초 가방은 조인다, 초초즉렴. 소금물은 내려간다, 염수초즉하행."}],"has_image":true},{"id":"hp-03","title":"配伍 — 七情 일곱 관계와 禁忌(十八反·十九畏)","place":"맞선 중매 사무소","image":"images/lessons/hp-03.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"맞선 중매 사무소 — 분홍 하트 장식 · 테이블 여섯(윗줄 셋 · 아랫줄 셋)","fact":"配伍 — 약을 짝지어 씀: 七情 일곱 관계와 配伍禁忌","hook":"짝짓는 중매 사무소 = 配伍","say":"분홍 하트가 걸린 중매 사무소다. 테이블이 윗줄에 셋, 아랫줄에 셋 있다. 약을 짝지어 함께 쓰는 것이 配伍다. 짝을 지으면 서로 돕기도 하고 해치기도 한다 — 그 일곱 가지 관계가 七情이다. 윗줄은 혼자 온 손님과 힘이 세지는 짝, 아랫줄은 약해지거나 독이 나는 짝이다.","box":null,"src":[],"tts":"분홍 하트가 걸린 중매 사무소다. 테이블이 윗줄에 셋, 아랫줄에 셋 있다. 약을 짝지어 함께 쓰는 것이 배오다. 짝을 지으면 서로 돕기도 하고 해치기도 한다, 그 일곱 가지 관계가 칠정이다. 윗줄은 혼자 온 손님과 힘이 세지는 짝, 아랫줄은 약해지거나 독이 나는 짝이다."},{"n":1,"obj":"윗줄 왼쪽 — 의자 하나뿐인 1인용 테이블에 혼자 앉아 아령을 드는 남자","fact":"單行 — 한 약만 단독으로 써서 효과를 냄 · 七情의 첫째","hook":"혼자 온 손님이 혼자 아령 = 單行","say":"윗줄 왼쪽, 의자 하나뿐인 1인용 테이블에 남자가 혼자 앉아 아령을 든다. 짝 없이 혼자 해낸다. 홑 단(單), 單行 — 한 약만 단독으로 써서 효과를 낸다. 七情은 이 單行에 짝 관계 여섯을 더한 일곱이다. 相須, 相使, 相畏, 相殺, 相惡, 相反.","box":[173,123,476,432],"src":["BC-7J-01","BC-7J-01-M01"],"tts":"윗줄 왼쪽, 의자 하나뿐인 1인용 테이블에 남자가 혼자 앉아 아령을 든다. 짝 없이 혼자 해낸다. 홑 단, 단행, 한 약만 단독으로 써서 효과를 낸다. 칠정은 이 단행에 짝 관계 여섯을 더한 일곱이다. 상수, 상사, 상외, 상살, 상오, 상반."},{"n":2,"obj":"윗줄 가운데 — 흰 옷 입은 닮은 형제가 팔짱 끼고 함께 알통 · 한 손엔 흰 돌, 한 손엔 하얀 뿌리","fact":"相須 — 성능 비슷한 약끼리 서로 효과를 키움(石膏+知母)","hook":"닮은 형제가 같이 키우는 알통 = 相須","say":"윗줄 가운데, 흰 옷을 입은 닮은 형제가 팔짱을 끼고 함께 알통을 키운다. 한 사람은 흰 돌, 한 사람은 하얀 뿌리를 쥐었다. 相須 — 서로가 서로를 쓴다. 성능이 비슷한 약을 함께 써서 서로 효과를 키운다. 흰 돌 石膏와 知母, 또는 知母와 黃柏이다. 약성이 강해지는 것은 이 相須와 다음 相使 둘이다.","box":[778,101,519,454],"src":["BC-7J-02","BC-7J-01-M02","BC-7J-04-01"],"tts":"윗줄 가운데, 흰 옷을 입은 닮은 형제가 팔짱을 끼고 함께 알통을 키운다. 한 사람은 흰 돌, 한 사람은 하얀 뿌리를 쥐었다. 상수, 서로가 서로를 쓴다. 성능이 비슷한 약을 함께 써서 서로 효과를 키운다. 흰 돌 석고와 지모, 또는 지모와 황백이다. 약성이 강해지는 것은 이 상수와 다음 상사 둘이다."},{"n":3,"obj":"윗줄 오른쪽 — 노란 정장의 큰 사장이 알통 자랑 · 뒤에서 부채질하고 서류가방 든 비서 · 비서가 옆구리에 낀 흰 공(버섯 덩이)","fact":"相使 — 주약을 보조약이 도와 효능↑(主從, 黃芪+茯苓)","hook":"노란 사장(黃芪) + 흰 공 든 비서(茯苓) = 相使","say":"윗줄 오른쪽, 노란 정장의 큰 사장이 알통을 자랑하고, 뒤에서 비서가 부채질하며 가방을 들어 준다. 비서 옆구리에는 흰 공이 끼어 있다 — 소나무 뿌리에 붙는 버섯 덩이다. 부릴 사(使), 相使 — 한 약이 주인, 다른 약이 심부름꾼이 되어 주된 효능을 키운다. 노란 黃芪가 주인, 흰 茯苓이 보조다. 대등한 相須와 달리 相使는 주종이다.","box":[[1449,123,339,432],[1780,187,223,353]],"src":["BC-7J-01-M03"],"tts":"윗줄 오른쪽, 노란 정장의 큰 사장이 알통을 자랑하고, 뒤에서 비서가 부채질하며 가방을 들어 준다. 비서 옆구리에는 흰 공이 끼어 있다, 소나무 뿌리에 붙는 버섯 덩이다. 부릴 사, 상사, 한 약이 주인, 다른 약이 심부름꾼이 되어 주된 효능을 키운다. 노란 황기가 주인, 흰 복령이 보조다. 대등한 상수와 달리 상사는 주종이다."},{"n":4,"obj":"아랫줄 왼쪽 — 초록 독 연기에 싸여 둥근 흰 덩이줄기를 쥐고 벌벌 떠는 창백한 남자 · 맞은편에서 생강을 쥐어짜 즙을 튀기는 여자","fact":"相畏 — 한 약의 독이 다른 약에 억눌림: 半夏畏生薑","hook":"독 연기 남자가 생강 여자를 무서워함 = 半夏畏生薑","say":"아랫줄 왼쪽, 초록 독 연기에 싸인 창백한 남자가 둥근 흰 덩이줄기를 쥐고 벌벌 떤다. 이 독한 덩이줄기가 半夏다. 맞은편 여자가 생강을 쥐어짜 독 연기 쪽으로 즙을 튀긴다. 두려워할 외(畏) — 半夏는 生薑을 두려워한다, 半夏畏生薑. 독이 있는 쪽을 주어로 부른 이름이 相畏다.","box":[[86,663,259,454],[432,728,238,389]],"src":["BC-7J-03-01","BC-7J-01-M05"],"tts":"아랫줄 왼쪽, 초록 독 연기에 싸인 창백한 남자가 둥근 흰 덩이줄기를 쥐고 벌벌 떤다. 이 독한 덩이줄기가 반하다. 맞은편 여자가 생강을 쥐어짜 독 연기 쪽으로 즙을 튀긴다. 두려워할 외, 반하는 생강을 두려워한다, 반하외생강. 독이 있는 쪽을 주어로 부른 이름이 상외다."},{"n":5,"obj":"같은 테이블 — 웃으며 생강을 쥐어짜 맞은편 남자의 독 연기 쪽으로 즙을 튀기는 여자","fact":"相殺 — 한 약이 다른 약의 독을 없앰: 生薑殺半夏毒","hook":"생강 여자가 독을 죽임 = 生薑殺半夏毒","say":"같은 테이블을 이번엔 여자 쪽에서 본다. 웃으며 생강을 쥐어짜 남자의 독 연기에 즙을 튀긴다. 죽일 살(殺) — 生薑은 半夏의 독을 죽인다, 生薑殺半夏毒. 없애는 쪽을 주어로 부른 이름이 相殺이다. 相畏와 相殺은 같은 사건의 두 이름이고, 일하는 쪽은 둘 다 生薑이다. 독성이 약해지는 것이 이 둘, 相畏와 相殺이다.","box":[432,728,238,389],"src":["BC-7J-03-02","BC-7J-01-M06","BC-7J-04-03"],"tts":"같은 테이블을 이번엔 여자 쪽에서 본다. 웃으며 생강을 쥐어짜 남자의 독 연기에 즙을 튀긴다. 죽일 살, 생강은 반하의 독을 죽인다, 생강살반하독. 없애는 쪽을 주어로 부른 이름이 상살이다. 상외와 상살은 같은 사건의 두 이름이고, 일하는 쪽은 둘 다 생강이다. 독성이 약해지는 것이 이 둘, 상외와 상살이다."},{"n":6,"obj":"아랫줄 가운데 — 노인 곁에서 금빛으로 빛나는 사람 모양 인삼 · 맞은편에서 흰 무를 치켜들고 청소기로 그 빛을 빨아들이는 여자","fact":"相惡 — 한 약이 다른 약의 효능을 깎음: 人蔘惡萊菔子","hook":"무 든 여자가 인삼 노인의 빛을 빨아감 = 相惡","say":"아랫줄 가운데, 노인 곁에서 사람 모양 인삼이 금빛으로 빛난다. 맞은편 여자가 흰 무를 치켜들고 청소기로 그 빛을 빨아들인다. 미워할 오(惡), 相惡 — 한 약이 다른 약의 효능을 깎는다. 人蔘은 무씨 萊菔子를 미워한다, 人蔘惡萊菔子. 生薑惡黃芩도 같은 꼴이다. 빛이 한쪽으로만 빨려 가듯, 相惡의 화살은 한 방향이다. 약성이 약해지는 것은 相惡 하나다.","box":[[764,721,314,396],[1067,656,363,471]],"src":["BC-7J-03-03","BC-7J-01-M04","BC-7J-04-02"],"tts":"아랫줄 가운데, 노인 곁에서 사람 모양 인삼이 금빛으로 빛난다. 맞은편 여자가 흰 무를 치켜들고 청소기로 그 빛을 빨아들인다. 미워할 오, 상오, 한 약이 다른 약의 효능을 깎는다. 인삼은 무씨 내복자를 미워한다, 인삼오내복자. 생강오황금도 같은 꼴이다. 빛이 한쪽으로만 빨려 가듯, 상오의 화살은 한 방향이다. 약성이 약해지는 것은 상오 하나다."},{"n":7,"obj":"아랫줄 오른쪽 — 의자에서 벌떡 일어나 서로 고함치는 두 손님(검은 감초 막대를 입에 댄 남자 · 울퉁불퉁한 붉은 뿌리를 치켜든 남자) · 사이에서 터지는 해골 모양 독구름","fact":"相反 — 함께 쓰면 독성·부작용이 생김(甘草反甘遂) · 禁忌","hook":"앙숙이 만나 해골 독구름 = 相反","say":"아랫줄 오른쪽, 두 손님이 의자에서 벌떡 일어나 서로 고함친다. 왼쪽 남자는 검은 감초 막대를 입에 댔고, 오른쪽 남자는 울퉁불퉁한 붉은 뿌리를 치켜들었다. 둘 사이에서 해골 모양 독구름이 터진다. 돌이킬 반(反), 相反 — 함께 쓰면 독성과 부작용이 생긴다. 甘草는 甘遂와 相反이다. 독성이 강해지는 것이 相反이고, 그래서 함께 쓰지 말라는 配伍禁忌, 十八反과 十九畏로 이어진다.","box":[[1412,677,605,447],[1564,577,298,213]],"src":["BC-7J-03-04","BC-7J-01-M07","BC-7J-04-04"],"tts":"아랫줄 오른쪽, 두 손님이 의자에서 벌떡 일어나 서로 고함친다. 왼쪽 남자는 검은 감초 막대를 입에 댔고, 오른쪽 남자는 울퉁불퉁한 붉은 뿌리를 치켜들었다. 둘 사이에서 해골 모양 독구름이 터진다. 돌이킬 반, 상반, 함께 쓰면 독성과 부작용이 생긴다. 감초는 감수와 상반이다. 독성이 강해지는 것이 상반이고, 그래서 함께 쓰지 말라는 배오금기, 십팔반과 십구외로 이어진다."},{"n":8,"obj":"먹구름을 인 성난 둘 — 독 연기 남자 바로 뒤에 선 까마귀 가면 남자 · 인삼 노인 쪽을 노려보는 갈대 든 남자 / 오른쪽 테이블의 감초 막대","fact":"十八反 — 烏頭·甘草·藜蘆 세 축이 각자의 짝과 相反","hook":"까마귀 머리 = 烏頭 · 갈대 = 藜蘆 · 감초 = 甘草","say":"먹구름을 인 성난 사람이 둘 있다. 독 연기 남자 바로 뒤에 선 까마귀 가면 — 까마귀 오, 머리 두, 烏頭다. 烏頭는 半夏, 瓜蔞, 貝母, 白蘞, 白芨과 相反이다. 인삼 노인 쪽의 갈대 든 남자 — 갈대 닮은 풀, 藜蘆다. 藜蘆는 人蔘, 丹參, 玄參, 沙參, 苦參의 다섯 參과 細辛, 芍藥에 相反이다. 그리고 오른쪽 테이블의 감초 — 甘草는 大戟, 芫花, 甘遂, 海藻와 相反이다. 이 세 축이 十八反이다.","box":[[281,562,238,490],[1020,569,265,471],[1412,677,605,447]],"src":["BC-GG2-01"],"tts":"먹구름을 인 성난 사람이 둘 있다. 독 연기 남자 바로 뒤에 선 까마귀 가면, 까마귀 오, 머리 두, 오두다. 오두는 반하, 과루, 패모, 백렴, 백급과 상반이다. 인삼 노인 쪽의 갈대 든 남자, 갈대 닮은 풀, 여로다. 여로는 인삼, 단삼, 현삼, 사삼, 고삼의 다섯 삼과 세신, 작약에 상반이다. 그리고 오른쪽 테이블의 감초, 감초는 대극, 원화, 감수, 해조와 상반이다. 이 세 축이 십팔반이다."},{"n":9,"obj":"인삼 노인 머리 위로 날아들며 까만 똥 알갱이를 떨어뜨리는 날다람쥐 · 질겁한 노인","fact":"十九畏 — 人蔘畏五靈脂 등 함께 쓰지 않는 짝(七情 相畏와 다름)","hook":"날다람쥐 똥 = 五靈脂 · 질겁한 인삼 노인 = 人蔘畏五靈脂","say":"인삼 노인 머리 위로 날다람쥐가 날아들며 까만 똥 알갱이를 떨어뜨린다. 노인이 질겁한다. 날다람쥐 똥이 五靈脂다 — 人蔘畏五靈脂, 十九畏의 한 짝이다. 나머지는 硫黃畏朴硝, 水銀畏砒霜, 巴豆畏牽牛, 丁香畏鬱金, 川烏와 草烏畏犀角, 肉桂畏赤石脂. 여기서 畏는 함께 쓰지 말라는 금기다. 독을 눌러 주는 七情의 相畏와 글자만 같고 뜻이 다르다. 人蔘 한 사람에게 萊菔子는 相惡, 藜蘆는 相反, 五靈脂는 十九畏다.","box":[[689,540,208,249],[764,721,314,396]],"src":["BC-GG2-02"],"tts":"인삼 노인 머리 위로 날다람쥐가 날아들며 까만 똥 알갱이를 떨어뜨린다. 노인이 질겁한다. 날다람쥐 똥이 오령지다, 인삼외오령지, 십구외의 한 짝이다. 나머지는 유황외박초, 수은외비상, 파두외견우, 정향외울금, 천오와 초오외서각, 육계외적석지. 여기서 외는 함께 쓰지 말라는 금기다. 독을 눌러 주는 칠정의 상외와 글자만 같고 뜻이 다르다. 인삼 한 사람에게 내복자는 상오, 여로는 상반, 오령지는 십구외다."},{"n":10,"kind":"review","obj":"중매 사무소 한 바퀴 — 혼자 아령 · 닮은 형제 · 사장과 비서 / 독 연기와 생강 · 인삼과 무 · 해골 독구름 · 까마귀 가면 · 갈대 · 날다람쥐","fact":"강해짐 相須·相使 / 독 약해짐 相畏·相殺 / 약해짐 相惡 / 독 강해짐 相反","hook":"윗줄은 커지는 알통 · 아랫줄은 걷히는 독, 빨리는 빛, 터지는 독","say":"다시 본다. 혼자 든 아령 — 單行. 닮은 형제의 알통 — 相須, 사장과 비서 — 相使, 둘 다 약성이 강해진다. 독 연기 남자와 생강즙 튀기는 여자 — 半夏畏生薑은 相畏, 生薑殺半夏毒은 相殺, 둘 다 독이 약해진다. 인삼의 빛을 빨아가는 무 — 相惡, 약성이 약해진다. 해골 독구름 — 相反, 독이 강해진다. 까마귀 가면 烏頭, 감초 막대 甘草, 갈대 藜蘆 — 十八反. 날다람쥐 똥 五靈脂를 두려워하는 人蔘 — 十九畏.","box":[[173,123,476,432],[778,101,519,454],[86,663,259,454],[764,721,314,396],[1412,677,605,447]],"src":[],"tts":"다시 본다. 혼자 든 아령, 단행. 닮은 형제의 알통, 상수, 사장과 비서, 상사, 둘 다 약성이 강해진다. 독 연기 남자와 생강즙 튀기는 여자, 반하외생강은 상외, 생강살반하독은 상살, 둘 다 독이 약해진다. 인삼의 빛을 빨아가는 무, 상오, 약성이 약해진다. 해골 독구름, 상반, 독이 강해진다. 까마귀 가면 오두, 감초 막대 감초, 갈대 여로, 십팔반. 날다람쥐 똥 오령지를 두려워하는 인삼, 십구외."}],"has_image":true},{"id":"hp-04","title":"修治(炮製) — 독하고 거친 약은 손질해서: 生半夏 · 炒·炙·煅 · 黃芪 生↔炙","place":"수리 공방 뒤 불 작업장","image":"images/lessons/hp-04.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"수리 공방 뒤 불 작업장 — 왼쪽부터 담금 통 · 볶음 팬 셋 · 석쇠와 바름 그릇 다섯 · 대장간 화로","fact":"修治(炮製) — 약을 손질해 독을 줄이고 성질을 바꿈","hook":"수리 공방 = 닦고 다스리는 修治 · 팬 · 석쇠 · 화로 = 炒 · 炙 · 煅","say":"수리 공방 뒤의 불 작업장이다. 왼쪽부터 담금 통, 볶음 팬 셋, 석쇠와 바름 그릇, 대장간 화로가 늘어섰다. 닦을 수, 다스릴 치 — 修治, 炮製라고도 한다. 독하고 거친 약은 손질해서 쓴다. 팬에 볶는 炒, 석쇠에 발라 굽는 炙, 화로에 달구는 煅이 이 작업장의 세 가지 불이다.","box":null,"src":[],"tts":"수리 공방 뒤의 불 작업장이다. 왼쪽부터 담금 통, 볶음 팬 셋, 석쇠와 바름 그릇, 대장간 화로가 늘어섰다. 닦을 수, 다스릴 치, 수치, 포제라고도 한다. 독하고 거친 약은 손질해서 쓴다. 팬에 볶는 초, 석쇠에 발라 굽는 자, 화로에 달구는 단이 이 작업장의 세 가지 불이다."},{"n":1,"obj":"왼쪽 담금 통 — 초록 독 연기를 뿜는 둥근 흰 덩이줄기 · 함께 잠긴 갈색 감초 막대 · 쏟아붓는 흰 석회 가루","fact":"生半夏 有毒·내복 금기 → 甘草·石灰로 制해 독성↓","hook":"독 연기 덩이줄기 + 감초 막대 + 석회 가루 = 손질한 半夏","say":"왼쪽 나무 통에 둥근 흰 덩이줄기가 떠서 초록 독 연기를 뿜는다. 중매 사무소에서 생강 여자 앞에서 떨던 그 半夏다. 날것 生半夏는 독이 있어 먹으면 안 된다. 반드시 손질한다. 통에는 갈색 감초 막대가 함께 잠겼고, 흰 석회 가루를 쏟아붓는다. 半夏는 甘草와 石灰로 다스려 독을 줄인다 — 法半夏다. 생강으로 다스리면 薑半夏다.","box":[[0,605,620,538],[331,483,288,288],[79,0,670,677]],"src":["BC-PJ-05-02"],"tts":"왼쪽 나무 통에 둥근 흰 덩이줄기가 떠서 초록 독 연기를 뿜는다. 중매 사무소에서 생강 여자 앞에서 떨던 그 반하다. 날것 생반하는 독이 있어 먹으면 안 된다. 반드시 손질한다. 통에는 갈색 감초 막대가 함께 잠겼고, 흰 석회 가루를 쏟아붓는다. 반하는 감초와 석회로 다스려 독을 줄인다, 법반하다. 생강으로 다스리면 강반하다."},{"n":2,"obj":"첫째 팬 — 작은 불 위에서 노릇하게 볶인 작은 씨앗들","fact":"炒黃 — 文火·中火로 겉만 노랗게(씨앗류 子仁類)","hook":"작은 불 · 노란 씨앗 = 炒黃","say":"볶음 팬 셋은 오른쪽으로 갈수록 불이 커진다. 볶을 초(炒). 첫째 팬은 작고 순한 불, 文火다. 작은 씨앗들이 겉만 노릇하게 볶였다 — 炒黃. 씨앗 종류인 子仁類를 이렇게 볶는다.","box":[605,329,320,270],"src":["BC-PJ-02-01"],"tts":"볶음 팬 셋은 오른쪽으로 갈수록 불이 커진다. 볶을 초. 첫째 팬은 작고 순한 불, 문화다. 작은 씨앗들이 겉만 노릇하게 볶였다, 초황. 씨앗 종류인 자인류를 이렇게 볶는다."},{"n":3,"obj":"둘째 팬 — 중간 불 위에서 짙은 갈색으로 눌어 쪼그라든 산사 열매","fact":"炒焦 — 中火·武火로 겉을 焦黃褐色까지(山楂·梔子)","hook":"중간 불 · 갈색으로 눌은 붉은 열매 = 炒焦","say":"둘째 팬은 중간 불이다. 산사 열매가 짙은 갈색으로 눌어 쪼그라들었다 — 그을릴 초(焦), 炒焦. 겉이 눋도록 焦黃褐色까지 볶는다. 山楂와 梔子가 이렇다.","box":[847,248,331,274],"src":["BC-PJ-02-02"],"tts":"둘째 팬은 중간 불이다. 산사 열매가 짙은 갈색으로 눌어 쪼그라들었다, 그을릴 초, 초초. 겉이 눋도록 초황갈색까지 볶는다. 산사와 치자가 이렇다."},{"n":4,"obj":"셋째 팬 — 활활 타는 센 불 위에서 새까맣게 탔지만 잎 모양은 그대로인 잎","fact":"炒炭 — 焦黑色·炒炭存性 → 止血↑(大薊·荊芥炭·側柏葉)","hook":"센 불 · 까맣게 탄 잎 = 炒炭 → 피를 멎게","say":"셋째 팬은 활활 타는 센 불, 武火다. 잎이 새까맣게 탔지만 잎 모양은 그대로다. 숯 탄(炭), 炒炭 — 까맣게 태우되 약성은 남긴다, 炒炭存性. 검게 태우면 피를 멎게 하는 힘이 커진다. 大薊, 荊芥炭, 側柏葉이다. 작은 불에서 센 불로 — 노랑, 갈색, 검정.","box":[1078,17,352,476],"src":["BC-PJ-02-03"],"tts":"셋째 팬은 활활 타는 센 불, 무화다. 잎이 새까맣게 탔지만 잎 모양은 그대로다. 숯 탄, 초탄, 까맣게 태우되 약성은 남긴다, 초탄존성. 검게 태우면 피를 멎게 하는 힘이 커진다. 대계, 형개탄, 측백엽이다. 작은 불에서 센 불로, 노랑, 갈색, 검정."},{"n":5,"obj":"석쇠 앞 바름 그릇 줄의 첫째 — 초록 술병","fact":"酒炙 — 上行·淸上焦熱(黃連·大黃) · 活血(當歸)","hook":"초록 술병 = 위로 올리는 酒炙","say":"석쇠에는 노란 뿌리 조각이 구워지고, 앞에는 솔을 꽂은 바름 그릇 다섯이 줄지었다. 액체를 발라 굽는 것이 구울 자(炙), 炙法이다. 첫째는 초록 술병 — 酒炙. 술은 위로 올린다. 위로 올라가 上焦의 열을 식히니 黃連과 大黃을 酒炙하고, 피를 돌리니 當歸를 酒炙한다.","box":[738,703,95,231],"src":["BC-PJ-03-01"],"tts":"석쇠에는 노란 뿌리 조각이 구워지고, 앞에는 솔을 꽂은 바름 그릇 다섯이 줄지었다. 액체를 발라 굽는 것이 구울 자, 자법이다. 첫째는 초록 술병, 주자. 술은 위로 올린다. 위로 올라가 상초의 열을 식히니 황련과 대황을 주자하고, 피를 돌리니 당귀를 주자한다."},{"n":6,"obj":"둘째 — 투명한 연노랑 식초병","fact":"醋炙 — 疏肝·活血止痛(乳香·柴胡)","hook":"식초병 = 肝을 풀고 통증을 멎게 하는 醋炙","say":"둘째는 식초병 — 醋炙. 신맛은 肝으로 들어간다. 맺힌 肝氣를 풀고 피를 돌려 통증을 멎게 한다 — 疏肝, 活血止痛. 乳香과 柴胡를 醋炙한다.","box":[853,775,86,202],"src":["BC-PJ-03-02"],"tts":"둘째는 식초병, 초자. 신맛은 간으로 들어간다. 맺힌 간기를 풀고 피를 돌려 통증을 멎게 한다, 소간, 활혈지통. 유향과 시호를 초자한다."},{"n":7,"obj":"셋째 — 물 담긴 양동이(소금물)","fact":"鹽炙 — 下行·補肝腎(杜仲·知母)","hook":"소금물 = 아래로 내려 肝腎을 補하는 鹽炙","say":"셋째는 물 담긴 양동이, 소금물이다 — 鹽炙. 소금물은 아래로 내린다. 아래로 내려가 肝腎을 補한다. 杜仲과 知母를 鹽炙한다.","box":[969,862,130,150],"src":["BC-PJ-03-03"],"tts":"셋째는 물 담긴 양동이, 소금물이다, 염자. 소금물은 아래로 내린다. 아래로 내려가 간신을 보한다. 두충과 지모를 염자한다."},{"n":8,"obj":"넷째 — 생강 조각이 담긴 그릇","fact":"薑炙 — 和胃止嘔(竹茹)","hook":"생강 그릇 = 위를 달래 구역을 멎게 하는 薑炙","say":"넷째는 생강 조각이 담긴 그릇 — 薑炙. 생강은 위를 달래 구역질을 멎게 한다 — 和胃止嘔. 竹茹를 薑炙한다.","box":[1107,847,135,164],"src":["BC-PJ-03-04"],"tts":"넷째는 생강 조각이 담긴 그릇, 강자. 생강은 위를 달래 구역질을 멎게 한다, 화위지구. 죽여를 강자한다."},{"n":9,"obj":"다섯째 금빛 꿀단지 · 석쇠 위 꿀 발라 반짝이는 노란 뿌리 / 석쇠 옆 찬 쟁반의 날 노란 뿌리","fact":"蜜炙 — 潤肺止咳·補脾·緩和 / 같은 黃芪도 生用↔炙用이 갈림","hook":"꿀 발라 구운 뿌리 ↔ 찬 쟁반의 날 뿌리 = 炙黃芪 ↔ 生黃芪","say":"다섯째는 금빛 꿀단지 — 꿀 밀(蜜), 蜜炙. 꿀은 단맛이라 누그러뜨린다 — 緩和. 폐를 적셔 기침을 멎게 하는 潤肺止咳, 脾를 補하는 補脾. 麻黃, 黃芪, 甘草를 蜜炙한다. 석쇠 위 노란 뿌리 하나가 꿀을 발라 반짝이고, 옆 찬 쟁반에는 같은 뿌리가 날것으로 놓였다. 둘 다 黃芪다. 날것은 겉을 단단히 해 땀을 멎게 하는 固表止汗, 물을 빼 부기를 내리는 利水消腫. 꿀에 구운 것은 속을 補하고 氣를 더하는 補中益氣, 처진 陽氣를 들어 올리는 升擧陽氣. 같은 약이 손질로 갈린다. 修治의 목적은 독과 부작용을 줄이고, 약성을 바꾸거나 누그러뜨리고, 효과와 작용 부위를 넓히고, 조제를 쉽게 하고, 깨끗이 해 저장과 복용을 편하게 하는 것이다.","box":[[1248,847,133,190],[1222,631,159,115],[1287,637,298,196]],"src":["BC-PJ-03-05","BC-SB-03-05","BC-PJ-01"],"tts":"다섯째는 금빛 꿀단지, 꿀 밀, 밀자. 꿀은 단맛이라 누그러뜨린다, 완화. 폐를 적셔 기침을 멎게 하는 윤폐지해, 비를 보하는 보비. 마황, 황기, 감초를 밀자한다. 석쇠 위 노란 뿌리 하나가 꿀을 발라 반짝이고, 옆 찬 쟁반에는 같은 뿌리가 날것으로 놓였다. 둘 다 황기다. 날것은 겉을 단단히 해 땀을 멎게 하는 고표지한, 물을 빼 부기를 내리는 이수소종. 꿀에 구운 것은 속을 보하고 기를 더하는 보중익기, 처진 양기를 들어 올리는 승거양기. 같은 약이 손질로 갈린다. 수치의 목적은 독과 부작용을 줄이고, 약성을 바꾸거나 누그러뜨리고, 효과와 작용 부위를 넓히고, 조제를 쉽게 하고, 깨끗이 해 저장과 복용을 편하게 하는 것이다."},{"n":10,"obj":"오른쪽 대장간 화로 — 벌건 숯불에 바로 놓인 굴 껍데기와 흰 뼈","fact":"明煅 — 불에 직접 달굼 → 收斂 강화(牡蠣·龍骨)","hook":"숯불 위 굴 껍데기와 뼈 = 明煅","say":"오른쪽은 대장간 화로다. 쇠를 달구듯 세게 달구는 것이 달굴 단(煅). 벌건 숯불에 굴 껍데기와 흰 뼈가 바로 놓였다 — 明煅. 불에 그대로 달구면 거두는 힘이 세진다. 굴 껍데기 牡蠣, 뼈 화석 龍骨이다.","box":[1583,718,280,179],"src":["BC-PJ-04-01"],"tts":"오른쪽은 대장간 화로다. 쇠를 달구듯 세게 달구는 것이 달굴 단. 벌건 숯불에 굴 껍데기와 흰 뼈가 바로 놓였다, 명단. 불에 그대로 달구면 거두는 힘이 세진다. 굴 껍데기 모려, 뼈 화석 용골이다."},{"n":11,"obj":"대장장이 — 집게로 벌겋게 단 구릿빛 돌을 액체 담긴 나무 양동이에 담가 치익 김이 솟음","fact":"煅淬 — 붉게 달군 뒤 액체에 담가 식힘(自然銅·爐甘石)","hook":"벌건 돌을 식초에 치익 = 煅淬","say":"대장장이가 집게로 벌겋게 단 구릿빛 돌을 식초 담긴 나무 양동이에 담그자 치익 하고 김이 솟는다. 담금질이다 — 煅淬. 붉게 달군 뒤 식초 같은 액체에 담가 식힌다. 구릿빛 돌 自然銅, 그리고 爐甘石이다.","box":[[1557,0,277,680],[1780,0,267,721]],"src":["BC-PJ-04-02"],"tts":"대장장이가 집게로 벌겋게 단 구릿빛 돌을 식초 담긴 나무 양동이에 담그자 치익 하고 김이 솟는다. 담금질이다, 단쉬. 붉게 달군 뒤 식초 같은 액체에 담가 식힌다. 구릿빛 돌 자연동, 그리고 노감석이다."},{"n":12,"obj":"숯불 속 뚜껑을 밧줄로 꽁꽁 묶어 봉한 질그릇 단지 · 뚜껑 밑으로 삐져나온 검은 머리카락","fact":"悶煅 — 밀폐해 달궈 炭化(血餘炭 止血 · 乾漆 독성 완화)","hook":"봉한 단지 속 머리카락 = 悶煅 → 血餘炭","say":"숯불 속에는 뚜껑을 밧줄로 꽁꽁 묶어 봉한 질그릇 단지가 있고, 뚜껑 밑으로 검은 머리카락이 삐져나왔다. 답답할 민(悶), 悶煅 — 공기를 막고 달궈 숯으로 만든다. 머리카락을 태운 숯이 血餘炭, 피를 멎게 한다. 옻 乾漆은 이렇게 해서 독을 누그러뜨린다.","box":[1825,738,196,196],"src":["BC-PJ-04-03"],"tts":"숯불 속에는 뚜껑을 밧줄로 꽁꽁 묶어 봉한 질그릇 단지가 있고, 뚜껑 밑으로 검은 머리카락이 삐져나왔다. 답답할 민, 민단, 공기를 막고 달궈 숯으로 만든다. 머리카락을 태운 숯이 혈여탄, 피를 멎게 한다. 옻 건칠은 이렇게 해서 독을 누그러뜨린다."},{"n":13,"kind":"review","obj":"불 작업장 한 바퀴 — 담금 통 · 팬 셋 · 바름 그릇 다섯과 노란 뿌리 둘 · 화로의 굴 껍데기 · 담금질 · 봉한 단지","fact":"炒黃·炒焦·炒炭 / 酒·醋·鹽·薑·蜜炙 / 明煅·煅淬·悶煅","hook":"노랑·갈색·검정 팬 / 술·식초·소금물·생강·꿀 / 숯불·치익·봉한 단지","say":"다시 본다. 감초와 석회에 담근 독 덩이줄기 — 生半夏를 다스린다. 팬 셋 — 노랗게 炒黃, 갈색으로 炒焦, 까맣게 炒炭은 피를 멎게. 바름 그릇 다섯 — 술은 위로, 식초는 肝으로, 소금물은 아래로, 생강은 위장을 달래고, 꿀은 누그러뜨리고 폐를 적신다. 날 黃芪는 겉을 막고, 꿀 구운 黃芪는 속을 채운다. 화로 — 숯불 위 굴 껍데기는 明煅, 식초에 치익 담금질은 煅淬, 봉한 단지 속 머리카락은 悶煅.","box":[[0,605,620,538],[847,248,331,274],[804,536,784,331],[1583,718,280,179]],"src":[],"tts":"다시 본다. 감초와 석회에 담근 독 덩이줄기, 생반하를 다스린다. 팬 셋, 노랗게 초황, 갈색으로 초초, 까맣게 초탄은 피를 멎게. 바름 그릇 다섯, 술은 위로, 식초는 간으로, 소금물은 아래로, 생강은 위장을 달래고, 꿀은 누그러뜨리고 폐를 적신다. 날 황기는 겉을 막고, 꿀 구운 황기는 속을 채운다. 화로, 숯불 위 굴 껍데기는 명단, 식초에 치익 담금질은 단쉬, 봉한 단지 속 머리카락은 민단."}],"has_image":true},{"id":"hp-05","title":"효능별 대표약 — 人參·附子·當歸·大黃·半夏 (+先煎·後下)","place":"약령시 장터 좌판 골목","image":"images/lessons/hp-05.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"약령시 장터 골목 — 천막 친 좌판 다섯","fact":"효능별 대표약 좌판 — 補氣·溫裏·補血·攻下·化痰","hook":"좌판 다섯 = 효능 다섯","say":"약재 시장, 약령시의 좌판 골목이다. 천막 친 좌판 다섯이 늘어섰고, 좌판마다 같은 효능의 약을 모아 판다. 왼쪽부터 氣를 채우는 補氣, 속을 덥히는 溫裏, 피를 채우는 補血, 쳐서 내리는 攻下, 가래를 삭이는 化痰. 그리고 달이는 법 둘, 먼저 넣는 先煎과 나중 넣는 後下가 곁들여 있다.","box":null,"src":[],"tts":"약재 시장, 약령시의 좌판 골목이다. 천막 친 좌판 다섯이 늘어섰고, 좌판마다 같은 효능의 약을 모아 판다. 왼쪽부터 기를 채우는 보기, 속을 덥히는 온리, 피를 채우는 보혈, 쳐서 내리는 공하, 가래를 삭이는 화담. 그리고 달이는 법 둘, 먼저 넣는 선전과 나중 넣는 후하가 곁들여 있다."},{"n":1,"obj":"첫 좌판 — 둥실 뜬 풍선 다발 · 커다란 인삼 · 노란 뿌리 묶음 · 붉은 대추 · 감초 막대 다발","fact":"補氣藥 — 人參·黨參·黃芪·白朮·山藥·甘草·大棗 (人參 大補元氣)","hook":"풍선을 채우는 공기 = 氣 · 커다란 인삼 = 補氣의 대표","say":"첫 좌판에는 풍선 다발이 둥실 떠 있다. 풍선을 채우는 것은 공기, 氣다 — 氣를 채우는 補氣藥 좌판이다. 대표는 사람 닮은 커다란 뿌리, 人參. 元氣를 크게 補한다 — 大補元氣. 노란 뿌리 묶음은 黃芪, 붉은 대추는 大棗, 감초 막대는 甘草다. 여기에 黨參, 白朮, 山藥까지가 補氣藥이다.","box":[[43,0,418,353],[12,411,352,425]],"src":["BC-CL-10-01"],"tts":"첫 좌판에는 풍선 다발이 둥실 떠 있다. 풍선을 채우는 것은 공기, 기다, 기를 채우는 보기약 좌판이다. 대표는 사람 닮은 커다란 뿌리, 인삼. 원기를 크게 보한다, 대보원기. 노란 뿌리 묶음은 황기, 붉은 대추는 대조, 감초 막대는 감초다. 여기에 당삼, 백출, 산약까지가 보기약이다."},{"n":2,"obj":"둘째 좌판 — 벌건 숯 화로 · 울퉁불퉁한 검은 뿌리 · 말린 생강 · 말아 놓은 계피 · 정향 접시","fact":"溫裏藥 — 附子·乾薑·肉桂·吳茱萸·丁香 (속을 덥힘)","hook":"숯 화로 = 속을 덥히는 溫裏 · 검은 뿌리 = 附子","say":"둘째 좌판에는 숯 화로가 벌겋게 타고 있다. 속을 덥히는 溫裏藥 좌판이다. 대표는 울퉁불퉁한 검은 뿌리, 附子. 말린 생강 乾薑, 말아 놓은 계피 肉桂, 접시의 마른 꽃봉오리 丁香, 그리고 吳茱萸가 溫裏藥이다.","box":[[408,378,164,274],[392,637,369,144]],"src":["BC-CL-05-01"],"tts":"둘째 좌판에는 숯 화로가 벌겋게 타고 있다. 속을 덥히는 온리약 좌판이다. 대표는 울퉁불퉁한 검은 뿌리, 부자. 말린 생강 건강, 말아 놓은 계피 육계, 접시의 마른 꽃봉오리 정향, 그리고 오수유가 온리약이다."},{"n":3,"obj":"둘째 좌판 앞 의자 — 손발에 고드름과 서리가 앉은 손님이 김 나는 그릇을 마심 · 볼에 온기가 돎","fact":"回陽救逆 — 眞寒 위급(亡陽 · 四肢厥冷)에 四逆湯(附子)","hook":"고드름 손발 손님이 국물에 녹아남 = 回陽救逆","say":"좌판 앞 의자에 손님이 앉았다. 손발에 고드름과 서리가 앉았다 — 팔다리가 싸늘한 四肢厥冷, 陽이 빠져나간 亡陽이다. 김 나는 그릇을 마시자 볼에 온기가 돈다. 달아난 陽을 되돌려 위급함을 구한다 — 回陽救逆. 眞寒이 위급할 때 쓰는 溫法이고, 처방은 附子가 든 四逆湯이다.","box":[703,649,231,473],"src":["SW-SHR-04-03"],"tts":"좌판 앞 의자에 손님이 앉았다. 손발에 고드름과 서리가 앉았다, 팔다리가 싸늘한 사지궐랭, 양이 빠져나간 망양이다. 김 나는 그릇을 마시자 볼에 온기가 돈다. 달아난 양을 되돌려 위급함을 구한다, 회양구역. 진한이 위급할 때 쓰는 온법이고, 처방은 부자가 든 사역탕이다."},{"n":4,"obj":"화로 곁 끓는 질그릇 냄비 — 안에 조약돌 · 조개껍데기 · 거친 검은 덩어리 · 곁에 큰 모래시계","fact":"先煎 — 광석·패각·독성약은 먼저 넣어 오래(石膏·牡蠣·生草烏)","hook":"돌 · 조개 · 검은 뿌리 + 모래시계 = 먼저 오래 달이는 先煎","say":"화로 곁 질그릇 냄비가 끓는다. 안에는 조약돌, 조개껍데기, 거친 검은 덩어리가 들었고, 곁에 큰 모래시계가 섰다. 먼저 넣어 오래 달인다 — 先煎, 久煎. 단단한 광석과 조개껍데기는 우러나는 데 오래 걸리고, 독이 있는 약은 오래 달여야 독이 준다. 石膏, 牡蠣, 生草烏가 先煎하고, 附子도 오래 달여 독을 줄인다.","box":[574,392,280,259],"src":["BJ-JH-03-01"],"tts":"화로 곁 질그릇 냄비가 끓는다. 안에는 조약돌, 조개껍데기, 거친 검은 덩어리가 들었고, 곁에 큰 모래시계가 섰다. 먼저 넣어 오래 달인다, 선전, 구전. 단단한 광석과 조개껍데기는 우러나는 데 오래 걸리고, 독이 있는 약은 오래 달여야 독이 준다. 석고, 모려, 생초오가 선전하고, 부자도 오래 달여 독을 줄인다."},{"n":5,"obj":"셋째 좌판 — 작은 집 그림 팻말 · 갈래진 갈색 뿌리 · 새까만 찐 뿌리 · 흰 뿌리 · 갈색 아교 덩이 · 동그란 용안 열매","fact":"補血藥 — 當歸·熟地黃·白芍·何首烏·阿膠·龍眼肉","hook":"집 그림 팻말 = 돌아갈 歸 · 갈색 뿌리 = 當歸","say":"셋째 좌판에는 작은 집 그림 팻말이 섰다. 마땅할 당, 돌아갈 귀 — 當歸. 피를 제자리로 돌아가게 한다는 이름이다. 갈래진 갈색 뿌리가 當歸, 피를 채우는 補血藥의 대표다. 새까맣게 쪄 낸 뿌리 熟地黃, 흰 뿌리 白芍, 갈색 아교 덩이 阿膠, 동그란 용안 열매 龍眼肉, 그리고 何首烏가 補血藥이다.","box":[[879,378,164,138],[876,545,404,245]],"src":["BC-CL-10-03"],"tts":"셋째 좌판에는 작은 집 그림 팻말이 섰다. 마땅할 당, 돌아갈 귀, 당귀. 피를 제자리로 돌아가게 한다는 이름이다. 갈래진 갈색 뿌리가 당귀, 피를 채우는 보혈약의 대표다. 새까맣게 쪄 낸 뿌리 숙지황, 흰 뿌리 백작, 갈색 아교 덩이 아교, 동그란 용안 열매 용안육, 그리고 하수오가 보혈약이다."},{"n":6,"obj":"셋째 좌판 앞 바구니 — 노란 뿌리 넷과 갈색 뿌리 하나","fact":"氣能生血 — 血虛에 補氣藥을 더함(當歸補血湯 黃芪:當歸=5:1)","hook":"노란 黃芪 잔뜩 + 갈색 當歸 하나 = 當歸補血湯","say":"좌판 앞 바구니에는 첫 좌판의 노란 뿌리, 黃芪가 넷이나 담겼고 갈색 當歸는 하나뿐이다. 피가 모자란데 왜 氣를 채우는 黃芪를 이렇게 많이 넣는가. 氣가 血을 만든다 — 氣能生血. 그래서 當歸補血湯은 黃芪를 當歸보다 훨씬 많이, 다섯 대 하나로 쓴다.","box":[1084,819,210,251],"src":["HUBJQ-0127"],"tts":"좌판 앞 바구니에는 첫 좌판의 노란 뿌리, 황기가 넷이나 담겼고 갈색 당귀는 하나뿐이다. 피가 모자란데 왜 기를 채우는 황기를 이렇게 많이 넣는가. 기가 혈을 만든다, 기능생혈. 그래서 당귀보혈탕은 황기를 당귀보다 훨씬 많이, 다섯 대 하나로 쓴다."},{"n":7,"obj":"넷째 좌판 — 굵은 대황 줄기와 큰 잎 · 흰 결정 더미 · 알로에 화분 · 카운터 위 고무 뚫어뻥 · 좌판 밑 배수관에서 갈색 덩어리가 아래로 빠져 내려감","fact":"攻下藥 — 大黃·芒硝·蘆薈 (瀉下攻積: 막힌 것을 쳐서 아래로)","hook":"뚫어뻥과 아래로 빠지는 덩어리 = 攻下 · 굵은 줄기 = 大黃","say":"넷째 좌판 위에는 고무 뚫어뻥이 놓였고, 좌판 밑 배수관에서 막혔던 갈색 덩어리가 아래로 빠져 내려간다. 쌓인 것을 쳐서 아래로 내보낸다 — 攻下, 瀉下攻積. 대표는 굵은 줄기와 큰 잎의 大黃, 쓰고 찬 약이다. 흰 결정 더미 芒硝, 화분의 알로에 蘆薈가 攻下藥이다.","box":[[1191,430,297,360],[1446,666,135,86],[1568,651,121,130],[1417,406,121,259],[1395,819,265,265]],"src":["BC-CL-03-01"],"tts":"넷째 좌판 위에는 고무 뚫어뻥이 놓였고, 좌판 밑 배수관에서 막혔던 갈색 덩어리가 아래로 빠져 내려간다. 쌓인 것을 쳐서 아래로 내보낸다, 공하, 사하공적. 대표는 굵은 줄기와 큰 잎의 대황, 쓰고 찬 약이다. 흰 결정 더미 망초, 화분의 알로에 노회가 공하약이다."},{"n":8,"obj":"넷째 좌판 끝 — 끓는 냄비에 맨 마지막으로 넣는 싱싱한 박하 잎 · 피어오르는 향 · 울리는 자명종","fact":"後下 — 향 있는 약은 나중에 넣어 살짝 달임(薄荷·砂仁)","hook":"마지막에 넣는 박하 + 울리는 자명종 = 後下","say":"그 곁 끓는 냄비에는 싱싱한 박하 잎을 맨 마지막에 넣는다. 향이 피어오르고, 자명종이 울린다 — 이제 불을 끌 때다. 나중에 넣는다 — 後下. 향이 날아가지 않게, 방향성 약은 마지막에 넣어 살짝만 달인다. 薄荷와 砂仁이다.","box":[[1525,357,186,294],[1705,458,99,121]],"src":["BJ-JH-03-02"],"tts":"그 곁 끓는 냄비에는 싱싱한 박하 잎을 맨 마지막에 넣는다. 향이 피어오르고, 자명종이 울린다, 이제 불을 끌 때다. 나중에 넣는다, 후하. 향이 날아가지 않게, 방향성 약은 마지막에 넣어 살짝만 달인다. 박하와 사인이다."},{"n":9,"obj":"다섯째 좌판 — 작은 흰 덩이줄기 · 흰 겨자씨 · 길고 검은 꼬투리 · 별 모양 열매 · 따뜻한 전등 아래 그릇에서 묽어져 넘쳐흐르는 끈적한 흰 점액","fact":"溫化寒痰藥 — 半夏·天南星·白附子·白芥子·皂莢","hook":"전등 아래 녹는 끈적한 점액 = 溫化寒痰 · 흰 덩이줄기 = 半夏","say":"다섯째 좌판에서는 따뜻한 전등 아래 그릇의 끈적한 흰 점액이 묽어져 넘쳐흐른다. 차가운 가래를 덥혀서 삭인다 — 溫化寒痰. 대표는 작은 흰 덩이줄기 半夏, 습을 말리고 가래를 삭이는 燥濕化痰이다. 별 모양 天南星, 흰 겨자씨 白芥子, 길고 검은 꼬투리 皂莢, 그리고 白附子가 溫化寒痰藥이다.","box":[[1878,363,150,95],[1885,536,161,130],[1741,565,306,254]],"src":["BC-CL-08-01"],"tts":"다섯째 좌판에서는 따뜻한 전등 아래 그릇의 끈적한 흰 점액이 묽어져 넘쳐흐른다. 차가운 가래를 덥혀서 삭인다, 온화한담. 대표는 작은 흰 덩이줄기 반하, 습을 말리고 가래를 삭이는 조습화담이다. 별 모양 천남성, 흰 겨자씨 백개자, 길고 검은 꼬투리 조협, 그리고 백부자가 온화한담약이다."},{"n":10,"kind":"review","obj":"좌판 골목 한 바퀴 — 풍선 · 화로와 얼어붙은 손님 · 집 팻말과 바구니 · 뚫어뻥과 박하 냄비 · 녹는 점액","fact":"補氣 人參 · 溫裏 附子 · 補血 當歸 · 攻下 大黃 · 化痰 半夏","hook":"풍선 · 화로 · 집 팻말 · 뚫어뻥 · 전등","say":"다시 본다. 풍선 좌판 — 補氣, 大補元氣의 人參. 화로 좌판 — 溫裏, 附子. 얼어붙은 손님에게 四逆湯 — 回陽救逆. 돌과 조개와 모래시계 — 先煎. 집 팻말 좌판 — 補血, 當歸. 黃芪 잔뜩에 當歸 하나 — 氣能生血, 當歸補血湯. 뚫어뻥 좌판 — 攻下, 大黃. 마지막 박하와 자명종 — 後下. 전등 아래 녹는 점액 — 溫化寒痰, 半夏.","box":[[43,0,418,353],[703,649,231,473],[1084,819,210,251],[1417,406,121,259],[1525,357,186,294],[1885,536,161,130]],"src":[],"tts":"다시 본다. 풍선 좌판, 보기, 대보원기의 인삼. 화로 좌판, 온리, 부자. 얼어붙은 손님에게 사역탕, 회양구역. 돌과 조개와 모래시계, 선전. 집 팻말 좌판, 보혈, 당귀. 황기 잔뜩에 당귀 하나, 기능생혈, 당귀보혈탕. 뚫어뻥 좌판, 공하, 대황. 마지막 박하와 자명종, 후하. 전등 아래 녹는 점액, 온화한담, 반하."}],"has_image":true},{"id":"hp-06","title":"君臣佐使 — 한 처방의 네 자리 (麻黃湯)","place":"조선 궁궐 어전","image":"images/lessons/hp-06.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"조선 궁궐 어전 — 높은 자리일수록 위에: 왕 · 대신 · 관원 셋 · 심부름 아이 둘 · 오른쪽 문으로 쳐들어오는 얼음 귀신","fact":"君臣佐使 — 한 처방 안 약의 네 자리 · 예: 麻黃湯","hook":"어전의 서열 = 처방 속 약의 역할","say":"조선 궁궐의 어전이다. 자리가 높을수록 위에 선다. 왕이 가장 크다. 임금 군, 신하 신, 도울 좌, 부릴 사 — 君臣佐使. 한 처방 안에서 약이 맡는 네 자리다. 오른쪽 문으로 얼음 귀신이 쳐들어왔다 — 바깥에서 든 찬 기운이다. 이 어전 전체가 하나의 처방, 麻黃湯이다.","box":null,"src":[],"tts":"조선 궁궐의 어전이다. 자리가 높을수록 위에 선다. 왕이 가장 크다. 임금 군, 신하 신, 도울 좌, 부릴 사, 군신좌사. 한 처방 안에서 약이 맡는 네 자리다. 오른쪽 문으로 얼음 귀신이 쳐들어왔다, 바깥에서 든 찬 기운이다. 이 어전 전체가 하나의 처방, 마황탕이다."},{"n":1,"obj":"단 위의 가장 큰 왕 — 마디진 초록 줄기 다발에서 불길을 뿜어 얼음 귀신을 곧장 겨눔","fact":"君藥 — 主病·主證을 곧바로 침, 힘·양이 가장 큼 / 君 = 麻黃","hook":"가장 큰 왕의 초록 줄기 불길 = 君 麻黃","say":"단 위의 가장 큰 왕이 마디진 초록 줄기 다발을 쥐고 불길을 뿜어 얼음 귀신을 곧장 겨눈다. 임금 군(君), 君藥. 주된 병과 증상, 主病과 主證을 곧바로 친다. 힘이 가장 세고 양도 가장 많다. 이 초록 줄기가 麻黃, 麻黃湯의 君藥이다.","box":[[605,133,406,519],[994,184,796,251]],"src":["BJ-GS-01","BJ-GS-04-01"],"tts":"단 위의 가장 큰 왕이 마디진 초록 줄기 다발을 쥐고 불길을 뿜어 얼음 귀신을 곧장 겨눈다. 임금 군, 군약. 주된 병과 증상, 주병과 주증을 곧바로 친다. 힘이 가장 세고 양도 가장 많다. 이 초록 줄기가 마황, 마황탕의 군약이다."},{"n":2,"obj":"왕 오른쪽 한 단 아래의 파란 옷 대신 — 계피 가지 다발을 치켜들어 곁의 작은 회색 도깨비를 내려침","fact":"臣藥 — 君을 도와 主證을 치고 兼證을 맡음 / 臣 = 桂枝","hook":"계피 가지 든 대신 = 臣 桂枝 · 곁의 도깨비 = 兼證","say":"왕 오른쪽, 한 단 아래에 파란 옷 대신이 섰다. 신하 신(臣), 臣藥. 왕 곁에서 君藥을 도와 主證을 치는 힘을 키운다. 그리고 계피 가지 다발을 치켜들어 곁의 작은 회색 도깨비를 내려친다 — 딸린 증상, 兼證도 臣藥이 맡는다. 계피 가지 桂枝가 麻黃湯의 臣藥이다.","box":[[1251,357,323,337],[1496,494,135,114]],"src":["BJ-GS-04-02"],"tts":"왕 오른쪽, 한 단 아래에 파란 옷 대신이 섰다. 신하 신, 신약. 왕 곁에서 군약을 도와 주증을 치는 힘을 키운다. 그리고 계피 가지 다발을 치켜들어 곁의 작은 회색 도깨비를 내려친다, 딸린 증상, 겸증도 신약이 맡는다. 계피 가지 계지가 마황탕의 신약이다."},{"n":3,"obj":"가운데 줄 왼쪽 초록 옷 관원 — 주황 살구씨 그릇을 내밀며 신이 나서 앞으로 밀고 나감","fact":"佐助 — 君臣을 도와 효과를 더하고 兼證을 다스림 / 佐 = 杏仁","hook":"살구씨 그릇 든 관원 = 佐助 · 杏仁","say":"가운데 줄 왼쪽, 초록 옷 관원이 살구씨 그릇을 들고 신이 나서 밀고 나간다. 도울 좌(佐), 佐助. 君臣을 거들어 효과를 더하고 兼證을 다스린다. 살구씨 杏仁이 麻黃湯의 佐藥이다 — 막힌 肺氣를 내려 기침을 멎게 해 麻黃을 돕는다.","box":[502,602,352,438],"src":["BJ-GS-02-01","BJ-GS-04-03"],"tts":"가운데 줄 왼쪽, 초록 옷 관원이 살구씨 그릇을 들고 신이 나서 밀고 나간다. 도울 좌, 좌조. 군신을 거들어 효과를 더하고 겸증을 다스린다. 살구씨 행인이 마황탕의 좌약이다, 막힌 폐기를 내려 기침을 멎게 해 마황을 돕는다."},{"n":4,"obj":"가운데 관원 — 국자로 물을 위로 끼얹어 왕의 불길에 치익 김이 남","fact":"佐制 — 君臣藥의 독성·열성·치우침을 눌러 줌","hook":"불길에 물 뿌리는 관원 = 佐制","say":"가운데 관원은 국자로 물을 위로 끼얹는다. 왕의 불길에 닿아 치익 김이 난다. 불길이 너무 사나워지지 않게 하려는 것이다. 누를 제(制), 佐制. 君臣藥의 독성, 지나친 열성, 치우친 성질을 눌러 준다.","box":[826,566,330,474],"src":["BJ-GS-02-02"],"tts":"가운데 관원은 국자로 물을 위로 끼얹는다. 왕의 불길에 닿아 치익 김이 난다. 불길이 너무 사나워지지 않게 하려는 것이다. 누를 제, 좌제. 군신약의 독성, 지나친 열성, 치우친 성질을 눌러 준다."},{"n":5,"obj":"가운데 줄 오른쪽 관원 — 김 나는 뜨거운 그릇과 작은 얼음 조각을 한 쟁반에 나란히 받쳐 듦","fact":"反佐 — 君藥과 반대 성미를 조금 함께 씀 · 寒熱竝用(反佐法)","hook":"한 쟁반의 뜨거운 그릇 + 얼음 조각 = 反佐","say":"오른쪽 관원은 김 나는 뜨거운 그릇과 작은 얼음 조각을 한 쟁반에 나란히 들었다. 거스를 반(反), 反佐. 君藥과 반대되는 성미의 약을 조금 함께 써서 치료한다 — 藥物反佐. 뜨거운 약을 식혀 먹이는 服用反佐도 있다. 쓰고 찬 약으로 열병을 치는데 도리어 열이 더해지면 찬 약과 더운 약을 함께 쓴다 — 寒熱竝用, 反佐法이다.","box":[1251,602,294,445],"src":["BJ-GS-02-03","BZ-BEOP-06"],"tts":"오른쪽 관원은 김 나는 뜨거운 그릇과 작은 얼음 조각을 한 쟁반에 나란히 들었다. 거스를 반, 반좌. 군약과 반대되는 성미의 약을 조금 함께 써서 치료한다, 약물반좌. 뜨거운 약을 식혀 먹이는 복용반좌도 있다. 쓰고 찬 약으로 열병을 치는데 도리어 열이 더해지면 찬 약과 더운 약을 함께 쓴다, 한열병용, 반좌법이다."},{"n":6,"obj":"앞줄 왼쪽 심부름 아이 — 등에 장작 다발을 지고 등불을 내밀어 길을 비춤","fact":"引經報使 — 약을 病所로 이끎(少陽=柴胡·靑皮 · 陽明=白芷)","hook":"장작 진 등불 아이 = 길잡이 使 · 장작 = 柴胡","say":"앞줄 왼쪽 심부름 아이가 등에 장작 다발을 지고 등불을 내밀어 길을 비춘다. 부릴 사(使), 使藥의 첫째 일 — 引經報使. 처방의 약들을 병이 있는 곳, 病所로 이끈다. 등에 진 땔나무가 柴胡 — 少陽으로 이끄는 약이다. 少陽은 柴胡와 靑皮, 陽明은 白芷가 이끈다.","box":[75,747,519,396],"src":["BJ-GS-03-01"],"tts":"앞줄 왼쪽 심부름 아이가 등에 장작 다발을 지고 등불을 내밀어 길을 비춘다. 부릴 사, 사약의 첫째 일, 인경보사. 처방의 약들을 병이 있는 곳, 병소로 이끈다. 등에 진 땔나무가 시호, 소양으로 이끄는 약이다. 소양은 시호와 청피, 양명은 백지가 이끈다."},{"n":7,"obj":"앞줄 오른쪽 심부름 아이 — 큰 가마솥을 긴 막대로 저어 여러 색 약재가 금빛 국 속에 어우러짐","fact":"調和諸藥 — 여러 약의 氣味를 고르게 함 / 使 = 甘草","hook":"가마솥을 저어 하나로 = 調和 · 젓는 막대 = 甘草","say":"앞줄 오른쪽 아이는 큰 가마솥을 긴 막대로 젓는다. 여러 색 약재가 금빛 국 속에 어우러진다. 使藥의 둘째 일 — 調和諸藥, 여러 약의 氣味를 고르게 한다. 젓는 막대가 甘草다. 麻黃湯의 使藥이다.","box":[1459,761,555,382],"src":["BJ-GS-03-02","BJ-GS-04-04"],"tts":"앞줄 오른쪽 아이는 큰 가마솥을 긴 막대로 젓는다. 여러 색 약재가 금빛 국 속에 어우러진다. 사약의 둘째 일, 조화제약, 여러 약의 기미를 고르게 한다. 젓는 막대가 감초다. 마황탕의 사약이다."},{"n":8,"kind":"review","obj":"어전 한 바퀴 — 왕 · 대신 · 관원 셋 · 심부름 아이 둘","fact":"麻黃湯 — 君 麻黃 · 臣 桂枝 · 佐 杏仁 · 使 甘草","hook":"초록 줄기 왕 · 계피 대신 · 살구씨 관원 · 감초 막대 아이","say":"다시 본다. 가장 큰 왕의 초록 줄기 — 君, 麻黃. 主證을 곧바로 친다. 계피 가지 대신 — 臣, 桂枝. 君을 돕고 兼證을 맡는다. 관원 셋 — 살구씨는 佐助, 杏仁. 물 뿌리기는 佐制, 뜨거운 그릇과 얼음은 反佐. 심부름 아이 둘 — 장작과 등불은 引經報使, 가마솥 젓기는 調和諸藥, 甘草. 麻黃, 桂枝, 杏仁, 甘草 — 麻黃湯이다.","box":[[605,133,406,519],[1251,357,323,337],[502,602,352,438],[1459,761,555,382]],"src":[],"tts":"다시 본다. 가장 큰 왕의 초록 줄기, 군, 마황. 주증을 곧바로 친다. 계피 가지 대신, 신, 계지. 군을 돕고 겸증을 맡는다. 관원 셋, 살구씨는 좌조, 행인. 물 뿌리기는 좌제, 뜨거운 그릇과 얼음은 반좌. 심부름 아이 둘, 장작과 등불은 인경보사, 가마솥 젓기는 조화제약, 감초. 마황, 계지, 행인, 감초, 마황탕이다."}],"has_image":true},{"id":"hp-07","title":"基本方 짝 — 四君子·四物 → 八珍 / 六味·腎氣丸 / 和解 小柴胡湯","place":"선비 사랑방","image":"images/lessons/hp-07.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"선비 사랑방 — 사군자 병풍과 소반 · 네 칸 쟁반 · 보물 상자 · 환약 선반 · 열린 문 앞 섶 단","fact":"基本方 짝 — 補氣·補血 → 氣血雙補 / 補陰·補陽 / 和解","hook":"병풍 · 쟁반 · 보물 상자 · 환약 둘 · 섶 단","say":"선비의 사랑방이다. 왼쪽부터 네 폭 병풍과 소반, 네 칸 쟁반, 보물 상자, 환약 선반, 그리고 열린 문 앞의 섶 단. 처방의 기본이 되는 짝들이 여기 있다. 氣를 채우는 것과 血을 채우는 것, 그 둘을 합친 것. 陰을 채우는 것과 陽을 채우는 것. 그리고 어느 쪽으로도 몰지 않는 和解.","box":null,"src":[],"tts":"선비의 사랑방이다. 왼쪽부터 네 폭 병풍과 소반, 네 칸 쟁반, 보물 상자, 환약 선반, 그리고 열린 문 앞의 섶 단. 처방의 기본이 되는 짝들이 여기 있다. 기를 채우는 것과 혈을 채우는 것, 그 둘을 합친 것. 음을 채우는 것과 양을 채우는 것. 그리고 어느 쪽으로도 몰지 않는 화해."},{"n":1,"obj":"매화 · 난초 · 국화 · 대나무 네 폭 병풍 · 앞 소반의 사람 모양 인삼 · 흰 덩이뿌리 · 흰 버섯 공 · 감초 막대","fact":"四君子湯 — 人參·白朮·茯苓·甘草 · 補氣 기본방 · 補可去弱 · 緩方","hook":"네 군자 병풍 = 四君子 · 소반 위 넷 = 人參·白朮·茯苓·甘草","say":"왼쪽에 매화, 난초, 국화, 대나무 네 폭 병풍 — 네 군자, 四君子다. 앞 소반에 네 가지가 놓였다. 사람 모양 뿌리 人參, 흰 덩이뿌리 白朮, 흰 버섯 공 茯苓, 감초 막대 甘草. 이 넷이 四君子湯, 氣를 채우는 補氣의 기본방이다. 十劑에서 補는 약한 것을 없앤다 — 補可去弱의 예가 四君子湯이다. 宣可去壅은 二陳湯, 通可去滯는 十棗湯, 泄可去閉는 大承氣湯이다. 四君子湯은 달고 순한 약으로 오래된 허약을 천천히 다스리는 緩方의 대표이기도 하다. 나라에서 펴낸 첫 기성 약전, 『太平惠民和劑局方』에 四物湯, 逍遙散, 紫雪丹, 至寶丹과 함께 실렸다. 나라의 첫 방서는 『太平聖惠方』이다.","box":[[43,216,778,764],[144,706,548,389]],"src":["BJ-10J-02","BJ-7B-03-01","BJ-SA-03"],"tts":"왼쪽에 매화, 난초, 국화, 대나무 네 폭 병풍, 네 군자, 사군자다. 앞 소반에 네 가지가 놓였다. 사람 모양 뿌리 인삼, 흰 덩이뿌리 백출, 흰 버섯 공 복령, 감초 막대 감초. 이 넷이 사군자탕, 기를 채우는 보기의 기본방이다. 십제에서 보는 약한 것을 없앤다, 보가거약의 예가 사군자탕이다. 선가거옹은 이진탕, 통가거체는 십조탕, 설가거폐는 대승기탕이다. 사군자탕은 달고 순한 약으로 오래된 허약을 천천히 다스리는 완방의 대표이기도 하다. 나라에서 펴낸 첫 기성 약전, 태평혜민화제국방에 사물탕, 소요산, 자설단, 지보단과 함께 실렸다. 나라의 첫 방서는 태평성혜방이다."},{"n":2,"obj":"검은 칠 쟁반 네 칸 — 새까만 덩이(쪄서 말린 뿌리) · 갈래진 갈색 뿌리 · 흰 뿌리 · 울퉁불퉁한 갈색 덩이줄기","fact":"四物湯 — 熟地黃·當歸·白芍·川芎 · 補血 기본방 · 약물 수로 지은 이름","hook":"네 칸 쟁반 = 네 가지 물건 四物","say":"가운데 앞의 검은 칠 쟁반은 네 칸이다. 새까맣게 찐 뿌리 熟地黃, 갈래진 갈색 뿌리 當歸, 흰 뿌리 白芍, 울퉁불퉁한 덩이줄기 川芎. 네 가지 물건, 四物湯 — 피를 채우는 補血의 기본방이다. 약 가짓수로 이름을 지은 처방이다. 五苓散, 六君子湯, 六味地黃元도 그렇다.","box":[670,822,368,238],"src":["BJ-MM-01-03"],"tts":"가운데 앞의 검은 칠 쟁반은 네 칸이다. 새까맣게 찐 뿌리 숙지황, 갈래진 갈색 뿌리 당귀, 흰 뿌리 백작, 울퉁불퉁한 덩이줄기 천궁. 네 가지 물건, 사물탕, 피를 채우는 보혈의 기본방이다. 약 가짓수로 이름을 지은 처방이다. 오령산, 육군자탕, 육미지황원도 그렇다."},{"n":3,"obj":"가운데 열린 보물 상자 — 빛나는 보석 여덟","fact":"八珍湯 = 四君子湯 + 四物湯 → 氣血雙補","hook":"보석 여덟 = 병풍 앞 넷 + 쟁반 넷","say":"그 뒤 보물 상자에 보석 여덟이 빛난다. 여덟 가지 보배, 八珍湯. 병풍 앞 넷과 쟁반 넷을 합친 것 — 四君子湯 더하기 四物湯이다. 氣와 血을 함께 채운다 — 氣血雙補.","box":[872,512,238,274],"src":[],"tts":"그 뒤 보물 상자에 보석 여덟이 빛난다. 여덟 가지 보배, 팔진탕. 병풍 앞 넷과 쟁반 넷을 합친 것, 사군자탕 더하기 사물탕이다. 기와 혈을 함께 채운다, 기혈쌍보."},{"n":4,"obj":"오른쪽 선반의 흰 접시 — 검은 환약 여섯 알 · 곁의 시원한 파란 물 주전자","fact":"六味地黃丸 — 補陰(滋補腎陰) · 丸劑 = 천천히 흡수 → 慢性病","hook":"환약 여섯 + 물 주전자 = 六味, 陰을 적심","say":"오른쪽 선반의 흰 접시에 검은 환약 여섯 알, 곁에 시원한 물 주전자가 있다. 여섯 맛, 六味地黃丸. 腎陰을 적셔 채우는 補陰의 기본방이다. 알약 丸劑는 천천히 흡수되어 오래가는 병, 慢性病에 쓴다 — 六味地黃丸과 腎氣丸이 그 예다. 가루약 散劑는 서서히 스며 흩어지며 위장에 작용한다 — 五苓散, 平胃散이다.","box":[1139,490,245,151],"src":["BJ-JH-02"],"tts":"오른쪽 선반의 흰 접시에 검은 환약 여섯 알, 곁에 시원한 물 주전자가 있다. 여섯 맛, 육미지황환. 신음을 적셔 채우는 보음의 기본방이다. 알약 환제는 천천히 흡수되어 오래가는 병, 만성병에 쓴다, 육미지황환과 신기환이 그 예다. 가루약 산제는 서서히 스며 흩어지며 위장에 작용한다, 오령산, 평위산이다."},{"n":5,"obj":"금테 두른 작은 궤짝의 같은 검은 환약 · 곁의 계피와 검은 덩이뿌리 · 선반 밑 작은 화로","fact":"腎氣丸 = 六味 + 桂·附 → 補陽 · 偶方 · 출전 이름(金匱)","hook":"금테 궤짝 = 金匱 · 계피 + 검은 뿌리 + 화로 = 陽을 덥힘","say":"그 옆 금테 두른 궤짝에도 같은 검은 환약이 들었다. 곁에 계피와 검은 덩이뿌리가 놓였고, 선반 밑에서 작은 화로가 데운다. 六味에 桂枝와 附子를 더해 腎陽을 덥혀 채운다 — 腎氣丸, 補陽의 기본방이다. 금테 궤짝은 金匱 — 『金匱要略』에서 나온 金匱腎氣丸이다. 錢氏白朮散, 陶氏平胃散처럼 출전이나 만든 사람으로 이름을 지었다. 원인이 복잡해 약을 짝수로 쓰는 偶方의 예이기도 하다.","box":[[1369,440,195,144],[1348,588,231,63],[1398,667,130,114]],"src":["BJ-7B-04-02","BJ-MM-02-03"],"tts":"그 옆 금테 두른 궤짝에도 같은 검은 환약이 들었다. 곁에 계피와 검은 덩이뿌리가 놓였고, 선반 밑에서 작은 화로가 데운다. 육미에 계지와 부자를 더해 신양을 덥혀 채운다, 신기환, 보양의 기본방이다. 금테 궤짝은 금궤, 금궤요략에서 나온 금궤신기환이다. 전씨백출산, 도씨평위산처럼 출전이나 만든 사람으로 이름을 지었다. 원인이 복잡해 약을 짝수로 쓰는 우방의 예이기도 하다."},{"n":6,"obj":"오른쪽 열린 문 앞 — 문지방에 걸쳐 반은 방 안 · 반은 툇마루에 놓인, 짚으로 묶은 섶 단","fact":"和法 — 小柴胡湯: 半表半裏 少陽病을 和解(和解少陽)","hook":"안도 밖도 아닌 문턱의 섶 단 = 半表半裏 小柴胡湯","say":"오른쪽 끝, 문이 열려 툇마루가 보인다. 짚으로 묶은 섶 단이 문지방에 걸쳐, 반은 방 안에 반은 툇마루에 놓였다. 안도 아니고 밖도 아닌 자리 — 겉과 속의 사이, 半表半裏다. 섶 시(柴), 작은 섶 단이 小柴胡湯. 少陽病은 땀을 내도, 토하게 해도, 설사시켜도 안 되니 어느 쪽으로도 몰지 않고 화해시킨다 — 和法, 和解少陽. 和法은 겉과 속, 寒과 熱, 虛와 實이 얽힌 병을 조화시키는 법이다. 肝脾를 조화시키고 腸胃를 조화시키는 것도 和法이고, 대표방이 小柴胡湯이다.","box":[[1535,764,418,209],[1722,72,324,966]],"src":["BZ-BEOP-02","BZ-BEOP-05","SW-SHR-04-02","SW-M6-07-02"],"tts":"오른쪽 끝, 문이 열려 툇마루가 보인다. 짚으로 묶은 섶 단이 문지방에 걸쳐, 반은 방 안에 반은 툇마루에 놓였다. 안도 아니고 밖도 아닌 자리, 겉과 속의 사이, 반표반리다. 섶 시, 작은 섶 단이 소시호탕. 소양병은 땀을 내도, 토하게 해도, 설사시켜도 안 되니 어느 쪽으로도 몰지 않고 화해시킨다, 화법, 화해소양. 화법은 겉과 속, 한과 열, 허와 실이 얽힌 병을 조화시키는 법이다. 간비를 조화시키고 장위를 조화시키는 것도 화법이고, 대표방이 소시호탕이다."},{"n":7,"kind":"review","obj":"사랑방 한 바퀴 — 병풍과 소반 넷 · 쟁반 넷 · 보석 여덟 · 환약 여섯과 금테 궤짝 · 문턱의 섶 단","fact":"四君子 補氣 + 四物 補血 = 八珍 / 六味 補陰 · 腎氣 補陽 / 小柴胡 和解","hook":"넷 + 넷 = 여덟 · 물 주전자 ↔ 화로 · 문턱","say":"다시 본다. 네 군자 병풍과 소반 넷 — 四君子湯, 補氣. 네 칸 쟁반 — 四物湯, 補血. 둘을 합친 보석 여덟 — 八珍湯, 氣血雙補. 물 주전자 곁 환약 여섯 — 六味地黃丸, 補陰. 계피, 附子, 화로를 더한 금테 궤짝 — 金匱腎氣丸, 補陽. 문턱의 섶 단 — 小柴胡湯, 和解少陽.","box":[[43,216,778,764],[670,822,368,238],[872,512,238,274],[1139,490,245,151],[1369,440,195,144],[1535,764,418,209]],"src":[],"tts":"다시 본다. 네 군자 병풍과 소반 넷, 사군자탕, 보기. 네 칸 쟁반, 사물탕, 보혈. 둘을 합친 보석 여덟, 팔진탕, 기혈쌍보. 물 주전자 곁 환약 여섯, 육미지황환, 보음. 계피, 부자, 화로를 더한 금테 궤짝, 금궤신기환, 보양. 문턱의 섶 단, 소시호탕, 화해소양."}],"has_image":true},{"id":"hp-08","title":"六淫 ① 風 — 百病之長","place":"봄날 풍차 언덕","image":"images/lessons/hp-08.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"봄날 풍차 언덕 — 왼쪽에서 오른쪽으로 부는 센 바람","fact":"六淫 ① 風 — 六淫 중 가장 중요한 外邪","hook":"풍차 언덕 = 바람 風","say":"봄날 풍차 언덕에 센 바람이 왼쪽에서 오른쪽으로 분다. 바람이다 — 風. 밖에서 들어와 병을 일으키는 여섯 기운, 六淫의 첫째이자 가장 중요한 것이다. 병의 원인 셋, 三因 가운데 바깥 원인, 外因이 六淫이다.","box":null,"src":[],"tts":"봄날 풍차 언덕에 센 바람이 왼쪽에서 오른쪽으로 분다. 바람이다, 풍. 밖에서 들어와 병을 일으키는 여섯 기운, 육음의 첫째이자 가장 중요한 것이다. 병의 원인 셋, 삼인 가운데 바깥 원인, 외인이 육음이다."},{"n":1,"obj":"언덕 곳곳의 분홍 벚꽃","fact":"風 = 春의 主氣(木) · 時令病: 春風·夏暑·長夏濕·秋燥·冬寒","hook":"벚꽃 핀 봄 언덕 = 風은 봄의 主氣","say":"언덕 곳곳에 벚꽃이 활짝 피었다 — 봄이다. 風은 봄의 主氣, 오행으로 木이다. 六淫은 계절을 따른다. 봄은 風, 여름은 暑, 늦여름 長夏는 濕, 가을은 燥, 겨울은 寒 — 그 철에 잘 드는 병, 時令病이다.","box":[[620,404,1026,320],[26,747,265,251]],"src":["BIN-6IL-01"],"tts":"언덕 곳곳에 벚꽃이 활짝 피었다, 봄이다. 풍은 봄의 주기, 오행으로 목이다. 육음은 계절을 따른다. 봄은 풍, 여름은 서, 늦여름 장하는 습, 가을은 조, 겨울은 한, 그 철에 잘 드는 병, 시령병이다."},{"n":2,"obj":"왼쪽 지팡이 노인 — 어깨 둘 · 무릎 둘의 붉은 통증 별 · 별을 잇는 점선이 언덕 위로 이어져 아픈 자리가 옮겨 다님","fact":"善行 — 病位가 游走해 일정한 곳이 없음(風痺 = 行痺)","hook":"관절을 옮겨 다니는 통증 별 = 善行 · 行痺","say":"왼쪽 지팡이 노인의 어깨와 무릎에 붉은 통증 별이 번쩍이고, 점선이 별을 이어 언덕 위로 달아난다. 아픈 자리가 한곳에 있지 않고 옮겨 다닌다. 잘 다닐 선행(善行) — 風은 잘 돌아다녀 병 자리가 일정하지 않다, 游走. 바람으로 오는 저림 風痺가 옮겨 다니는 行痺다. 『素問』 風論에 風者善行而數變이라 했다. 風邪의 기본 성격은 셋 — 六淫 중 가장 중요하고, 善行而數變하며, 百病之長이다.","box":[[310,641,327,406],[418,656,450,356]],"src":["BIN-PUNG-03-01","BIN-PUNG-01"],"tts":"왼쪽 지팡이 노인의 어깨와 무릎에 붉은 통증 별이 번쩍이고, 점선이 별을 이어 언덕 위로 달아난다. 아픈 자리가 한곳에 있지 않고 옮겨 다닌다. 잘 다닐 선행, 풍은 잘 돌아다녀 병 자리가 일정하지 않다, 유주. 바람으로 오는 저림 풍비가 옮겨 다니는 행비다. 소문 풍론에 풍자선행이삭변이라 했다. 풍사의 기본 성격은 셋, 육음 중 가장 중요하고, 선행이삭변하며, 백병지장이다."},{"n":3,"obj":"풍차 지붕 위 — 미친 듯이 빙빙 도는 수탉 바람개비","fact":"數變 — 병증 변화가 빠르고 다양함(風無常方)","hook":"쉴 새 없이 도는 바람개비 = 數變","say":"풍차 지붕 위 수탉 바람개비가 미친 듯이 빙빙 돈다. 방향이 쉴 새 없이 바뀐다. 數變 — 병의 모습이 빠르게, 여러 가지로 바뀐다. 바람에는 정해진 방향이 없다 — 風無常方. 잘 옮겨 다니고 빨리 변하니, 병 자리가 옮겨 다니고 병이 급하게 시작된다.","box":[1006,84,135,121],"src":["BIN-PUNG-03-02","BIN-PUNG-01-M02"],"tts":"풍차 지붕 위 수탉 바람개비가 미친 듯이 빙빙 돈다. 방향이 쉴 새 없이 바뀐다. 삭변, 병의 모습이 빠르게, 여러 가지로 바뀐다. 바람에는 정해진 방향이 없다, 풍무상방. 잘 옮겨 다니고 빨리 변하니, 병 자리가 옮겨 다니고 병이 급하게 시작된다."},{"n":4,"obj":"오른쪽 젊은이 — 모자가 날아가고 붉은 스카프가 펄럭이며 옷깃이 열림 · 열로 붉은 얼굴에 땀 · 손으로 뒤통수를 감싸고 떪 / 크게 휜 나무 꼭대기","fact":"輕揚開泄·易襲陽位 — 위·겉을 먼저 침: 發熱·汗出·惡風","hook":"날아간 모자 · 열린 옷깃 · 감싼 뒤통수 = 위와 겉을 먼저","say":"오른쪽 젊은이의 모자가 날아간다. 風은 가볍게 떠올라 위로, 바깥으로 향한다 — 輕揚. 스카프가 펄럭이고 옷깃이 열렸다. 땀구멍, 腠理를 열어 젖힌다 — 開泄. 그래서 열이 나는 發熱, 땀이 나는 汗出, 바람을 싫어하는 惡風이 온다. 그는 손으로 뒤통수를 감싸고 떤다. 몸의 위쪽인 머리와 목, 등, 足太陽經, 겉의 피부를 먼저 친다 — 陽의 자리를 잘 친다, 易襲陽位. 낮은 풀보다 나무 꼭대기가 크게 휘듯, 바람에 상한 사람은 위가 먼저 받는다 — 傷於風者 上先受之. 風은 陽邪다.","box":[[1554,631,265,474],[1805,530,123,121],[620,404,1026,320]],"src":["BIN-PUNG-02","BIG-004"],"tts":"오른쪽 젊은이의 모자가 날아간다. 풍은 가볍게 떠올라 위로, 바깥으로 향한다, 경양. 스카프가 펄럭이고 옷깃이 열렸다. 땀구멍, 주리를 열어 젖힌다, 개설. 그래서 열이 나는 발열, 땀이 나는 한출, 바람을 싫어하는 오풍이 온다. 그는 손으로 뒤통수를 감싸고 떤다. 몸의 위쪽인 머리와 목, 등, 족태양경, 겉의 피부를 먼저 친다, 양의 자리를 잘 친다, 이습양위. 낮은 풀보다 나무 꼭대기가 크게 휘듯, 바람에 상한 사람은 위가 먼저 받는다, 상어풍자 상선수지. 풍은 양사다."},{"n":5,"obj":"왼쪽 하늘 — 볼을 부풀려 바람을 부는 두목 얼굴의 파란 구름 · 등에 올라탄 얼음 조각 · 물방울 · 마른 잎 · 불꽃","fact":"百病之長 — 寒·濕·燥·熱이 風에 붙어 들어옴(風寒·風熱)","hook":"두목 구름 등에 탄 얼음 · 물방울 · 마른 잎 · 불꽃 = 百病之長","say":"왼쪽 하늘에 두목 얼굴의 파란 구름이 볼을 부풀려 바람을 분다. 그 등에 졸개들이 올라탔다 — 얼음 조각, 물방울, 마른 잎, 불꽃. 寒, 濕, 燥, 熱이 風에 붙어 함께 들어온다 — 風寒, 風熱, 風濕. 風은 온갖 병의 우두머리, 百病之長이다. 『素問』 風論 — 風者百病之長也, 至其變化 乃爲他病也. 다른 사기를 이끌고 피부와 살결로 먼저 들어온다.","box":[58,36,605,440],"src":["BIN-PUNG-01-M03","BIN-PUNG-05","BIN-PUNG-01-M01"],"tts":"왼쪽 하늘에 두목 얼굴의 파란 구름이 볼을 부풀려 바람을 분다. 그 등에 졸개들이 올라탔다, 얼음 조각, 물방울, 마른 잎, 불꽃. 한, 습, 조, 열이 풍에 붙어 함께 들어온다, 풍한, 풍열, 풍습. 풍은 온갖 병의 우두머리, 백병지장이다. 소문 풍론, 풍자백병지장야, 지기변화 내위타병야. 다른 사기를 이끌고 피부와 살결로 먼저 들어온다."},{"n":6,"kind":"review","obj":"풍차 언덕 한 바퀴 — 벚꽃 · 통증 별 노인 · 수탉 바람개비 · 모자 날아간 젊은이 · 두목 구름","fact":"春 主氣 · 善行數變 · 輕揚開泄·易襲陽位 · 百病之長","hook":"벚꽃 · 옮겨 다니는 별 · 도는 바람개비 · 날아간 모자 · 두목 구름","say":"다시 본다. 벚꽃 핀 봄 — 風은 봄의 主氣. 옮겨 다니는 통증 별 — 善行, 行痺. 빙빙 도는 바람개비 — 數變. 날아간 모자와 감싼 뒤통수 — 輕揚開泄, 易襲陽位, 傷於風者 上先受之. 졸개를 태운 두목 구름 — 百病之長.","box":[[620,404,1026,320],[310,641,327,406],[1006,84,135,121],[1554,631,265,474],[58,36,605,440]],"src":[],"tts":"다시 본다. 벚꽃 핀 봄, 풍은 봄의 주기. 옮겨 다니는 통증 별, 선행, 행비. 빙빙 도는 바람개비, 삭변. 날아간 모자와 감싼 뒤통수, 경양개설, 이습양위, 상어풍자 상선수지. 졸개를 태운 두목 구름, 백병지장."}],"has_image":true},{"id":"hp-09","title":"六淫 ② 寒·濕 — 陰邪 둘(陽을 상한다)","place":"얼음과 진창의 겨울 늪","image":"images/lessons/hp-09.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"흐린 겨울 하늘 아래 늪 — 왼쪽 절반은 얼음 · 오른쪽 절반은 안개 낀 진창","fact":"六淫 ② 寒·濕 — 둘 다 陰邪, 陽氣를 상함","hook":"얼음 = 寒 · 진창 = 濕 · 해 없는 하늘 = 陰邪","say":"해 없는 흐린 겨울 하늘 아래 늪이다. 왼쪽 절반은 꽁꽁 얼었고, 오른쪽 절반은 안개 낀 진창이다. 얼음은 寒, 진창은 濕. 둘 다 陰의 사기, 陰邪라 한 늪에 있다. 둘 다 陽氣를 상한다.","box":null,"src":[],"tts":"해 없는 흐린 겨울 하늘 아래 늪이다. 왼쪽 절반은 꽁꽁 얼었고, 오른쪽 절반은 안개 낀 진창이다. 얼음은 한, 진창은 습. 둘 다 음의 사기, 음사라 한 늪에 있다. 둘 다 양기를 상한다."},{"n":1,"obj":"왼쪽 끝 — 눈더미에 덮여 불꽃 없이 붉은 불씨만 남은 모닥불 · 담요를 뒤집어쓰고 이를 딱딱 떠는 남자","fact":"寒 = 陰邪 → 傷陽(陰勝則陽病) · 表를 치면 惡寒(太陽傷寒)","hook":"얼음에 꺼진 모닥불 = 陽이 상함 · 담요 쓰고 떠는 남자 = 惡寒","say":"왼쪽 끝 모닥불은 눈더미에 덮여 불꽃이 꺼지고 붉은 불씨만 남았다. 陽의 불이 꺼져 간다. 寒은 陰邪라 陽氣를 상한다 — 陰勝則陽病. 陽이 상하면 陰寒이 치우쳐 성한 寒實證이 된다. 곁의 남자는 담요를 뒤집어쓰고 이를 딱딱 떤다. 찬 기운이 겉을 치면 오한이 난다 — 太陽傷寒의 表實證이다. 寒邪의 성질은 陰邪로서 易傷陽氣, 凝滯, 收引, 그리고 통증이 많다는 것이다.","box":[[36,404,226,183],[264,199,251,337]],"src":["BIN-HAN-02","BIG-005"],"tts":"왼쪽 끝 모닥불은 눈더미에 덮여 불꽃이 꺼지고 붉은 불씨만 남았다. 양의 불이 꺼져 간다. 한은 음사라 양기를 상한다, 음승즉양병. 양이 상하면 음한이 치우쳐 성한 한실증이 된다. 곁의 남자는 담요를 뒤집어쓰고 이를 딱딱 떤다. 찬 기운이 겉을 치면 오한이 난다, 태양상한의 표실증이다. 한사의 성질은 음사로서 이상양기, 응체, 수인, 그리고 통증이 많다는 것이다."},{"n":2,"obj":"통나무들이 갇힌 커다란 얼음 덩어리 · 둑에서 무릎의 붉은 통증 별을 움켜쥔 남자","fact":"凝滯 — 氣血이 엉겨 막힘 → 不通則痛(痛者 寒氣多也)","hook":"통나무가 갇힌 얼음 덩어리 = 凝滯 · 무릎 통증 별 = 不通則痛","say":"통나무들이 커다란 얼음 덩어리 속에 갇혀 꼼짝 못 한다. 아무것도 움직이지 못한다. 엉길 응, 막힐 체 — 凝滯. 氣血이 차갑게 엉겨 막히면 통하지 않아 아프다 — 不通則痛. 둑의 남자가 무릎의 붉은 통증 별을 움켜쥔다. 『素問』 擧痛論 — 痛者 寒氣多也, 有寒故痛也. 아픈 것은 찬 기운이 많아서다. 寒氣가 이긴 저림은 아픔이 심한 痛痺다.","box":[[148,624,539,402],[703,199,236,381]],"src":["BIN-HAN-03"],"tts":"통나무들이 커다란 얼음 덩어리 속에 갇혀 꼼짝 못 한다. 아무것도 움직이지 못한다. 엉길 응, 막힐 체, 응체. 기혈이 차갑게 엉겨 막히면 통하지 않아 아프다, 불통즉통. 둑의 남자가 무릎의 붉은 통증 별을 움켜쥔다. 소문 거통론, 통자 한기다야, 유한고통야. 아픈 것은 찬 기운이 많아서다. 한기가 이긴 저림은 아픔이 심한 통비다."},{"n":3,"obj":"얼음 위에 새우처럼 몸을 웅크리고 한 손을 갈퀴처럼 오그린 남자","fact":"收引 — 오그라들고 당김(筋脈 拘急 · 腠理 닫힘)","hook":"새우처럼 웅크린 몸 · 갈퀴 손 = 收引","say":"얼음 위에 남자가 새우처럼 몸을 웅크렸다. 한 손은 갈퀴처럼 오그라들었다. 거둘 수, 당길 인 — 收引. 찬 기운은 오그라들게 하고 당긴다. 힘줄이 당겨 굽히고 펴기 어렵고, 땀구멍이 닫힌다.","box":[646,675,366,373],"src":[],"tts":"얼음 위에 남자가 새우처럼 몸을 웅크렸다. 한 손은 갈퀴처럼 오그라들었다. 거둘 수, 당길 인, 수인. 찬 기운은 오그라들게 하고 당긴다. 힘줄이 당겨 굽히고 펴기 어렵고, 땀구멍이 닫힌다."},{"n":4,"obj":"왼쪽 절반의 눈 · 얼음 · 고드름","fact":"寒 = 冬의 主氣(水) · 濕 = 長夏의 主氣","hook":"눈과 고드름 = 겨울 = 寒","say":"눈과 얼음, 고드름 — 겨울이다. 寒은 겨울의 主氣, 오행으로 水다. 濕은 늦여름, 長夏의 主氣다. 계절마다 主氣가 있어 그 철에 잘 드는 병, 時令病이 있다.","box":[0,317,1095,826],"src":["BIN-6IL-01"],"tts":"눈과 얼음, 고드름, 겨울이다. 한은 겨울의 주기, 오행으로 수다. 습은 늦여름, 장하의 주기다. 계절마다 주기가 있어 그 철에 잘 드는 병, 시령병이 있다."},{"n":5,"obj":"오른쪽 진창의 남자 — 흠뻑 젖은 수건을 두건처럼 머리에 뒤집어씀 · 몸에 매달린 무거운 젖은 모래주머니","fact":"濕 重濁 — 頭重如裹·四肢沈重(因于濕 首如裹) · 著痺","hook":"젖은 수건 뒤집어쓴 머리 = 首如裹 · 모래주머니 = 몸이 무거움","say":"오른쪽 진창을 남자가 힘겹게 걷는다. 흠뻑 젖은 수건을 머리에 뒤집어썼다 — 머리가 싸맨 듯 무거운 頭重如裹다. 『素問』 生氣通天論 — 因于濕 首如裹. 몸에는 젖은 모래주머니가 매달려 축 처진다 — 온몸과 팔다리가 무거운 周身困重, 四肢沈重. 무거울 중, 흐릴 탁 — 重濁. 濕氣가 이긴 저림은 무겁게 붙어 있는 著痺다.","box":[[1402,293,172,244],[1280,422,287,251]],"src":["BIN-SEUP-02"],"tts":"오른쪽 진창을 남자가 힘겹게 걷는다. 흠뻑 젖은 수건을 머리에 뒤집어썼다, 머리가 싸맨 듯 무거운 두중여과다. 소문 생기통천론, 인우습 수여과. 몸에는 젖은 모래주머니가 매달려 축 처진다, 온몸과 팔다리가 무거운 주신곤중, 사지침중. 무거울 중, 흐릴 탁, 중탁. 습기가 이긴 저림은 무겁게 붙어 있는 착비다."},{"n":6,"obj":"진창에서 들어 올리는 장화 — 끈적한 진흙이 길게 늘어붙음","fact":"黏滯 — 끈적하게 들러붙음: 시원치 않은 증상 · 오래가고 되풀이","hook":"장화에 길게 늘어붙는 진흙 = 黏滯","say":"발을 들어 올리자 장화에 끈적한 진흙이 길게 늘어붙는다. 차질 점, 막힐 체 — 黏滯. 濕은 끈적하게 들러붙는다. 대소변이 시원하게 나가지 않고, 병이 오래 끌며 자꾸 되풀이된다.","box":[1496,797,179,215],"src":[],"tts":"발을 들어 올리자 장화에 끈적한 진흙이 길게 늘어붙는다. 차질 점, 막힐 체, 점체. 습은 끈적하게 들러붙는다. 대소변이 시원하게 나가지 않고, 병이 오래 끌며 자꾸 되풀이된다."},{"n":7,"obj":"남자의 다리 — 흙탕물에 잠긴 장화 위로 분홍빛으로 퉁퉁 부은 정강이","fact":"趨下·易襲陰位 — 傷於濕者 下先受之: 다리 水腫·帶下·泄利","hook":"흙탕물 속 다리의 부종 = 濕은 아래를 먼저","say":"흙탕물에 잠긴 장화 위로 그의 정강이가 분홍빛으로 퉁퉁 부었다. 濕은 물처럼 아래로 흐른다 — 趨下. 몸의 아래, 陰의 자리를 잘 친다 — 易襲陰位. 『素問』 太陰陽明論 — 傷於濕者 下先受之. 風이 위를 먼저 치듯, 濕은 아래를 먼저 친다. 다리가 붓는 水腫, 소변이 탁한 淋濁, 帶下, 설사가 온다.","box":[[1304,800,137,151],[1496,797,179,215]],"src":["BIN-SEUP-03"],"tts":"흙탕물에 잠긴 장화 위로 그의 정강이가 분홍빛으로 퉁퉁 부었다. 습은 물처럼 아래로 흐른다, 추하. 몸의 아래, 음의 자리를 잘 친다, 이습음위. 소문 태음양명론, 상어습자 하선수지. 풍이 위를 먼저 치듯, 습은 아래를 먼저 친다. 다리가 붓는 수종, 소변이 탁한 임탁, 대하, 설사가 온다."},{"n":8,"obj":"오른쪽 위 오두막 — 무거운 안개구름이 굴뚝을 내리눌러 연기가 지붕 둘레로 도로 내려앉음 · 창 안의 불은 작게 사그라든 붉은 불","fact":"阻遏氣機·損傷陽氣 — 氣機를 막고 陽을 상함(濕勝則濡泄)","hook":"내리눌린 굴뚝 연기 = 氣機가 막힘 · 사그라진 불씨 = 陽이 상함","say":"오른쪽 위 오두막의 굴뚝을 무거운 안개구름이 내리누른다. 연기는 오르지 못하고 지붕 둘레로 도로 내려앉는다. 氣가 오르내리는 길, 氣機가 막혔다 — 阻遏氣機. 창 안의 불은 작게 사그라들었다 — 陽氣를 상한다, 損傷陽氣. 濕도 陰邪다. 『素問』 六元正紀大論 — 濕勝則濡泄, 甚則水閉胕腫. 濕이 이기면 묽은 설사가 나고, 심하면 물이 막혀 붓는다.","box":[1636,123,411,378],"src":["BIN-SEUP-01"],"tts":"오른쪽 위 오두막의 굴뚝을 무거운 안개구름이 내리누른다. 연기는 오르지 못하고 지붕 둘레로 도로 내려앉는다. 기가 오르내리는 길, 기기가 막혔다, 조알기기. 창 안의 불은 작게 사그라들었다, 양기를 상한다, 손상양기. 습도 음사다. 소문 육원정기대론, 습승즉유설, 심즉수폐부종. 습이 이기면 묽은 설사가 나고, 심하면 물이 막혀 붓는다."},{"n":9,"kind":"review","obj":"늪 한 바퀴 — 꺼진 모닥불과 담요 남자 · 얼음 덩어리 · 웅크린 남자 / 젖은 수건 · 늘어붙는 진흙 · 부은 다리 · 눌린 굴뚝","fact":"寒: 傷陽·凝滯·收引·痛 / 濕: 重濁·黏滯·趨下·阻遏氣機","hook":"꺼진 불 · 갇힌 통나무 · 새우 몸 / 젖은 수건 · 진흙 · 부은 다리 · 눌린 연기","say":"다시 본다. 얼음 쪽 — 꺼져 가는 모닥불과 담요 남자는 寒이 陽을 상한 것, 惡寒. 통나무 갇힌 얼음 덩어리와 무릎 통증 — 凝滯, 不通則痛. 새우처럼 웅크린 몸 — 收引. 진창 쪽 — 젖은 수건 뒤집어쓴 머리와 모래주머니 — 重濁, 首如裹. 늘어붙는 진흙 — 黏滯. 흙탕물 속 부은 다리 — 趨下, 下先受之. 눌린 굴뚝 연기와 사그라든 불 — 阻遏氣機, 損傷陽氣.","box":[[36,404,226,183],[148,624,539,402],[646,675,366,373],[1265,285,409,726],[1636,123,411,378]],"src":[],"tts":"다시 본다. 얼음 쪽, 꺼져 가는 모닥불과 담요 남자는 한이 양을 상한 것, 오한. 통나무 갇힌 얼음 덩어리와 무릎 통증, 응체, 불통즉통. 새우처럼 웅크린 몸, 수인. 진창 쪽, 젖은 수건 뒤집어쓴 머리와 모래주머니, 중탁, 수여과. 늘어붙는 진흙, 점체. 흙탕물 속 부은 다리, 추하, 하선수지. 눌린 굴뚝 연기와 사그라든 불, 조알기기, 손상양기."}],"has_image":true},{"id":"hp-10","title":"六淫 ③ 暑·火·燥 — 진액을 태우고 말리는 셋","place":"찜질방 — 찜통 · 불가마 · 건식 사우나","image":"images/lessons/hp-10.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"찜질방 단면 — 왼쪽 김 자욱한 찜통 · 가운데 불가마 · 오른쪽 건식 사우나","fact":"六淫 ③ 暑·火·燥 — 셋 다 津液을 태우고 말림","hook":"찜통 = 暑 · 불가마 = 火 · 건식 사우나 = 燥","say":"찜질방을 옆에서 잘라 본다. 왼쪽은 김이 자욱한 찜통, 가운데는 불가마, 오른쪽은 건식 사우나다. 찜통은 더위 暑, 불가마는 불 火, 건식 사우나는 마름 燥. 셋 다 몸의 진액을 태우고 말린다.","box":null,"src":[],"tts":"찜질방을 옆에서 잘라 본다. 왼쪽은 김이 자욱한 찜통, 가운데는 불가마, 오른쪽은 건식 사우나다. 찜통은 더위 서, 불가마는 불 화, 건식 사우나는 마름 조. 셋 다 몸의 진액을 태우고 말린다."},{"n":1,"obj":"찜통의 남자 — 벌건 얼굴로 큰 물병을 벌컥벌컥 들이켬 · 곁의 수박 쟁반","fact":"暑 = 陽邪·炎熱(高熱·煩渴·面赤) · 夏至 뒤에만","hook":"벌건 얼굴 · 물병 · 수박 = 여름 더위 暑","say":"왼쪽 찜통의 남자는 얼굴이 벌겋고, 큰 물병을 벌컥벌컥 들이켠다. 곁에 수박 쟁반 — 여름이다. 暑는 여름의 뜨거운 火熱 기운, 陽邪이고 성질이 뜨겁다 — 炎熱. 높은 열, 번조와 갈증, 붉은 얼굴이 온다. 暑는 여름에만 있다. 『素問』 熱論 — 先夏至日者爲病溫, 後夏至日者爲病暑. 夏至 전에 앓으면 溫病, 夏至 뒤 立秋 전에 앓으면 暑病이다. 暑邪의 특성은 셋 — 陽邪로 炎熱하고, 升散해 진액과 氣를 상하고, 濕을 낀다.","box":[[213,365,366,618],[40,747,236,121]],"src":["BIN-SEO-02","BIN-SEO-02-M01","BIN-SEO-01"],"tts":"왼쪽 찜통의 남자는 얼굴이 벌겋고, 큰 물병을 벌컥벌컥 들이켠다. 곁에 수박 쟁반, 여름이다. 서는 여름의 뜨거운 화열 기운, 양사이고 성질이 뜨겁다, 염열. 높은 열, 번조와 갈증, 붉은 얼굴이 온다. 서는 여름에만 있다. 소문 열론, 선하지일자위병온, 후하지일자위병서. 하지 전에 앓으면 온병, 하지 뒤 입추 전에 앓으면 서병이다. 서사의 특성은 셋, 양사로 염열하고, 승산해 진액과 기를 상하고, 습을 낀다."},{"n":2,"obj":"같은 남자 — 땀이 줄줄 흐르고 어깨와 팔에서 김이 위로 피어오름 · 눈을 감고 벽에 기대앉음","fact":"升散 → 傷津耗氣(壯火食氣 · 땀 따라 氣가 빠짐) · 火·燥·暑 모두 傷津","hook":"위로 피어오르는 김과 쏟아지는 땀 · 늘어진 몸 = 升散 · 傷津耗氣","say":"그의 몸에서 김이 위로 피어오르고 땀이 줄줄 흐른다. 暑는 위로 오르고 흩는다 — 升散. 땀구멍을 열어 땀을 쏟게 하니 진액이 상하고, 땀을 따라 氣도 빠져나간다 — 傷津耗氣. 그래서 그는 눈을 감고 벽에 기대앉았다 — 숨이 짧고 힘이 없다. 센 불은 氣를 먹는다 — 壯火食氣. 火도 같은 이치로 氣를 사르고 진액을 상한다. 火, 燥, 暑 모두 진액을 쉽게 상하지만, 暑만 여름에 묶이고 火는 계절이 없다.","box":[213,365,366,618],"src":["BIN-SEO-02-M02","BIG-007","BIN-HWA-02-M02"],"tts":"그의 몸에서 김이 위로 피어오르고 땀이 줄줄 흐른다. 서는 위로 오르고 흩는다, 승산. 땀구멍을 열어 땀을 쏟게 하니 진액이 상하고, 땀을 따라 기도 빠져나간다, 상진모기. 그래서 그는 눈을 감고 벽에 기대앉았다, 숨이 짧고 힘이 없다. 센 불은 기를 먹는다, 장화식기. 화도 같은 이치로 기를 사르고 진액을 상한다. 화, 조, 서 모두 진액을 쉽게 상하지만, 서만 여름에 묶이고 화는 계절이 없다."},{"n":3,"obj":"찜통 안을 가득 채운 짙은 김 · 물방울 흐르는 벽 · 바닥 물웅덩이","fact":"暑 挾濕 — 여름은 습이 많아 대개 暑濕 · 脾를 곤하게 함","hook":"짙은 김과 물웅덩이 = 暑는 濕을 낀다","say":"찜통 안은 짙은 김으로 가득하고, 벽에는 물방울이 흐르고 바닥에 물이 고였다. 여름은 습하다. 暑는 대개 濕을 끼고 온다 — 挾濕, 暑濕. 몸이 무겁고, 濕이 脾를 곤하게 해 입맛이 없고 속이 더부룩하다.","box":[0,0,651,1143],"src":["BIN-SEO-02-M03"],"tts":"찜통 안은 짙은 김으로 가득하고, 벽에는 물방울이 흐르고 바닥에 물이 고였다. 여름은 습하다. 서는 대개 습을 끼고 온다, 협습, 서습. 몸이 무겁고, 습이 비를 곤하게 해 입맛이 없고 속이 더부룩하다."},{"n":4,"obj":"가운데 불가마의 선 남자 — 정수리에서 불길이 위로 치솟음 · 벌겋게 충혈된 눈","fact":"火 = 陽邪·炎上 — 머리·얼굴을 침(陽勝則熱 · 諸躁狂越皆屬于火)","hook":"정수리에서 치솟는 불길 = 火性炎上","say":"가운데 불가마의 남자는 정수리에서 불길이 위로 치솟고, 눈이 벌겋게 충혈됐다. 火는 陽邪이고 위로 타오른다 — 炎上. 머리와 얼굴을 친다 — 눈이 붉고, 입과 혀가 헐고, 잇몸이 붓는다. 陽이 이기면 열이 난다 — 陽勝則熱. 날뛰고 미쳐 날뛰는 것은 다 火에 속한다 — 諸躁狂越皆屬于火. 熱, 溫, 火는 모두 陽이 성해 생기고 그 순서로 심해진다. 六淫의 火는 실은 밖에서 온 熱이고, 暑와는 계절로 가른다. 火의 성질은 넷 — 炎上, 耗氣傷津, 生風動血, 그리고 종기를 잘 만든다.","box":[[819,98,164,265],[768,98,308,899]],"src":["BIN-HWA-02","BIN-HWA-02-M01","BIN-HWA-01"],"tts":"가운데 불가마의 남자는 정수리에서 불길이 위로 치솟고, 눈이 벌겋게 충혈됐다. 화는 양사이고 위로 타오른다, 염상. 머리와 얼굴을 친다, 눈이 붉고, 입과 혀가 헐고, 잇몸이 붓는다. 양이 이기면 열이 난다, 양승즉열. 날뛰고 미쳐 날뛰는 것은 다 화에 속한다, 제조광월개속우화. 열, 온, 화는 모두 양이 성해 생기고 그 순서로 심해진다. 육음의 화는 실은 밖에서 온 열이고, 서와는 계절로 가른다. 화의 성질은 넷, 염상, 모기상진, 생풍동혈, 그리고 종기를 잘 만든다."},{"n":5,"obj":"같은 남자 — 코피 · 경련으로 지그재그로 떨리는 팔","fact":"生風動血 — 熱極生風(경련) · 迫血妄行(출혈)","hook":"경련하는 팔 = 生風 · 코피 = 動血","say":"그의 코에서 피가 흐르고, 팔이 경련으로 부들부들 떨린다. 열이 끝까지 오르면 風이 생긴다 — 熱極生風. 정신이 흐리고 경련하는 것은 다 火에 속한다 — 諸熱瞀瘈皆屬于火. 열은 피를 내몰아 제 길을 벗어나게 한다 — 迫血妄行, 코피와 출혈이다. 열이 진액을 졸이고, 맥락을 태우고, 陰을 상하고, 피의 흐름을 빠르게 하기 때문이다. 火는 몸의 陽位를 잘 치고, 위로 타오르며, 피를 함부로 내몬다. 견주어 둘 것 — 風, 寒, 濕 세 기운이 섞여 오면 저림, 痺가 된다. 風이 이기면 行痺, 寒이 이기면 痛痺, 濕이 이기면 着痺다.","box":[768,98,308,899],"src":["BIN-HWA-02-M03","BIG-013","BIG-008"],"tts":"그의 코에서 피가 흐르고, 팔이 경련으로 부들부들 떨린다. 열이 끝까지 오르면 풍이 생긴다, 열극생풍. 정신이 흐리고 경련하는 것은 다 화에 속한다, 제열무계개속우화. 열은 피를 내몰아 제 길을 벗어나게 한다, 박혈망행, 코피와 출혈이다. 열이 진액을 졸이고, 맥락을 태우고, 음을 상하고, 피의 흐름을 빠르게 하기 때문이다. 화는 몸의 양위를 잘 치고, 위로 타오르며, 피를 함부로 내몬다. 견주어 둘 것, 풍, 한, 습 세 기운이 섞여 오면 저림, 비가 된다. 풍이 이기면 행비, 한이 이기면 통비, 습이 이기면 착비다."},{"n":6,"obj":"불가마 의자의 남자 — 위팔에 노란 고름이 잡힌 붉게 부은 종기를 가리킴","fact":"易致腫瘍 — 熱勝則肉腐, 肉腐則爲膿(癰)","hook":"고름 잡힌 붉은 종기 = 火가 살을 썩힘","say":"의자에 앉은 남자가 위팔을 가리킨다. 붉게 부은 종기에 노란 고름이 잡혔다. 火熱이 피와 살을 썩힌다. 『靈樞』 癰疽 — 大熱不止, 熱勝則肉腐, 肉腐則爲膿, 故名曰癰. 아프고 가렵고 헐어 터지는 것은 다 心, 곧 火에 속한다 — 諸痛痒瘡皆屬于心.","box":[[1107,393,258,604],[1242,584,81,76]],"src":["BIN-HWA-02-M04","BIN-HWA-03"],"tts":"의자에 앉은 남자가 위팔을 가리킨다. 붉게 부은 종기에 노란 고름이 잡혔다. 화열이 피와 살을 썩힌다. 영추 옹저, 대열부지, 열승즉육부, 육부즉위농, 고명왈옹. 아프고 가렵고 헐어 터지는 것은 다 심, 곧 화에 속한다, 제통양창개속우심."},{"n":7,"obj":"오른쪽 건식 사우나 — 쩍쩍 갈라진 바닥 · 말라 죽은 화분 · 얼굴과 팔다리 살갗이 쩍쩍 갈라진 남자","fact":"燥 — 乾澀 · 易傷津液(燥盛則乾)","hook":"갈라진 바닥 · 말라 죽은 화분 · 갈라진 살갗 = 乾澀","say":"오른쪽 건식 사우나는 바닥이 쩍쩍 갈라졌고, 화분은 말라 죽었다. 남자의 얼굴과 팔다리 살갗도 쩍쩍 갈라졌다. 燥는 마르고 껄끄럽다 — 乾澀. 진액을 쉽게 상한다 — 燥盛則乾. 입과 코, 목, 피부, 머리카락이 마르고, 대변이 굳는다.","box":[[1410,865,637,278],[1424,610,135,308],[1597,415,280,582]],"src":["BIN-JO-02"],"tts":"오른쪽 건식 사우나는 바닥이 쩍쩍 갈라졌고, 화분은 말라 죽었다. 남자의 얼굴과 팔다리 살갗도 쩍쩍 갈라졌다. 조는 마르고 껄끄럽다, 건삽. 진액을 쉽게 상한다, 조성즉건. 입과 코, 목, 피부, 머리카락이 마르고, 대변이 굳는다."},{"n":8,"obj":"같은 남자 — 가슴에 손을 얹고 마른기침","fact":"燥 易傷肺 — 肺는 嬌臟·喜潤惡燥, 皮毛와 통하고 가장 높음","hook":"가슴에 손 얹은 마른기침 = 燥가 肺를 상함","say":"그는 가슴에 손을 얹고 마른기침을 한다. 燥는 肺를 잘 상한다. 肺는 여린 장기, 嬌臟이라 촉촉함을 좋아하고 마른 것을 싫어한다 — 喜潤惡燥. 숨으로 바깥 공기와 바로 통하고 — 肺氣通于天, 밖으로 피부와 털에 닿으며, 장부 가운데 가장 높이 있다. 그래서 마른기침, 적고 끈적한 가래가 온다. 원문으로 견주면 — 燥는 其性乾澀 易傷津液 易傷肺, 火는 其性炎上 易耗傷津液 易動血 熱極易生風.","box":[1597,415,280,582],"src":["BIG-006"],"tts":"그는 가슴에 손을 얹고 마른기침을 한다. 조는 폐를 잘 상한다. 폐는 여린 장기, 교장이라 촉촉함을 좋아하고 마른 것을 싫어한다, 희윤오조. 숨으로 바깥 공기와 바로 통하고, 폐기통우천, 밖으로 피부와 털에 닿으며, 장부 가운데 가장 높이 있다. 그래서 마른기침, 적고 끈적한 가래가 온다. 원문으로 견주면, 조는 기성건삽 이상진액 이상폐, 화는 기성염상 이모상진액 이동혈 열극이생풍."},{"n":9,"obj":"뒷벽의 두 창 — 왼쪽은 따뜻한 해 아래 붉은 단풍 · 오른쪽은 서리 앉은 앙상한 가지","fact":"燥 = 秋의 主氣(金) — 初秋 溫燥(燥+熱) · 晩秋 凉燥(燥+寒)","hook":"해와 단풍 = 溫燥 · 서리 가지 = 凉燥","say":"뒷벽에 창이 둘이다. 왼쪽 창은 따뜻한 해 아래 붉은 단풍 — 초가을, 여름 열기가 남아 燥에 熱이 붙은 溫燥. 오른쪽 창은 서리 앉은 앙상한 가지 — 늦가을, 겨울 찬 기운이 다가와 燥에 寒이 붙은 凉燥. 燥는 가을의 主氣, 오행으로 金이다. 봄 風, 여름 暑, 長夏 濕, 가을 燥, 겨울 寒 — 時令病이다.","box":[[1460,199,193,186],[1662,199,193,186]],"src":["BIN-JO-01","BIN-6IL-01"],"tts":"뒷벽에 창이 둘이다. 왼쪽 창은 따뜻한 해 아래 붉은 단풍, 초가을, 여름 열기가 남아 조에 열이 붙은 온조. 오른쪽 창은 서리 앉은 앙상한 가지, 늦가을, 겨울 찬 기운이 다가와 조에 한이 붙은 양조. 조는 가을의 주기, 오행으로 금이다. 봄 풍, 여름 서, 장하 습, 가을 조, 겨울 한, 시령병이다."},{"n":10,"kind":"review","obj":"찜질방 한 바퀴 — 물병 든 땀범벅 남자와 김 · 불길 머리와 코피 · 종기 · 갈라진 살갗과 마른기침 · 두 창","fact":"暑 炎熱·升散·挾濕 / 火 炎上·生風動血·腫瘍 / 燥 乾澀·傷肺","hook":"물병 · 김 / 불길 머리 · 코피 · 종기 / 갈라진 바닥 · 기침 · 단풍과 서리","say":"다시 본다. 찜통 — 벌건 얼굴과 물병은 暑의 炎熱, 피어오르는 김과 땀은 升散 傷津耗氣, 자욱한 김과 물웅덩이는 挾濕. 불가마 — 정수리 불길은 炎上, 경련과 코피는 生風動血, 고름 종기는 腫瘍. 건식 사우나 — 갈라진 바닥과 살갗은 乾澀, 마른기침은 肺를 상함, 단풍 창과 서리 창은 溫燥와 凉燥. 셋 다 진액을 상한다.","box":[[213,365,366,618],[768,98,308,899],[1107,393,258,604],[1597,415,280,582]],"src":[],"tts":"다시 본다. 찜통, 벌건 얼굴과 물병은 서의 염열, 피어오르는 김과 땀은 승산 상진모기, 자욱한 김과 물웅덩이는 협습. 불가마, 정수리 불길은 염상, 경련과 코피는 생풍동혈, 고름 종기는 종양. 건식 사우나, 갈라진 바닥과 살갗은 건삽, 마른기침은 폐를 상함, 단풍 창과 서리 창은 온조와 양조. 셋 다 진액을 상한다."}],"has_image":true},{"id":"hp-11","title":"七情 — 감정이 기를 움직이는 여섯 방향(擧痛論)","place":"희로애락 소극장 무대","image":"images/lessons/hp-11.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"희로애락 소극장 무대 — 하늘색 풍선을 하나씩 든 흰 옷 배우 여섯 · 무대 승강대와 바닥 뚜껑 문","fact":"七情 — 감정이 氣를 움직이는 방향(『素問』 擧痛論)","hook":"풍선 = 氣 · 무대의 위아래 = 氣의 방향","say":"작은 극장 무대에 흰 옷 배우 여섯이 하늘색 풍선을 하나씩 들었다. 풍선은 氣다. 감정이 지나치면 氣가 움직인다 — 일곱 감정 七情, 병의 안쪽 원인인 內因이다. 『素問』 擧痛論은 그 움직임을 여섯으로 말한다. 무대의 위아래가 곧 氣의 방향이다.","box":null,"src":[],"tts":"작은 극장 무대에 흰 옷 배우 여섯이 하늘색 풍선을 하나씩 들었다. 풍선은 기다. 감정이 지나치면 기가 움직인다, 일곱 감정 칠정, 병의 안쪽 원인인 내인이다. 소문 거통론은 그 움직임을 여섯으로 말한다. 무대의 위아래가 곧 기의 방향이다."},{"n":1,"obj":"맨 왼쪽 — 얼굴이 시뻘겋고 귀에서 김을 뿜는 성난 배우 · 그를 들어 올리는 무대 승강대 · 속도선 달고 곧장 위로 치솟는 풍선","fact":"怒則氣上 — 氣逆·面紅目赤·嘔血, 심하면 薄厥(血菀于上)","hook":"승강대로 치솟는 성난 배우 = 怒則氣上","say":"맨 왼쪽 배우는 성이 나 얼굴이 시뻘겋고 귀에서 김을 뿜는다. 무대 승강대가 그를 들어 올리고, 풍선은 곧장 위로 치솟는다. 성내면 氣가 치솟는다 — 怒則氣上. 肝氣가 거꾸로 오르면 피가 따라 오른다. 얼굴과 눈이 붉고, 피를 토하고, 심하면 쓰러져 정신을 잃는다. 『素問』 生氣通天論 — 大怒則形氣絶 而血菀于上 使人薄厥. 크게 성내면 피가 위로 몰려 갑자기 쓰러지는 薄厥이 된다. 擧痛論의 여섯은 怒則氣上, 喜則氣緩, 悲則氣消, 恐則氣下, 驚則氣亂, 思則氣結이고, 일하면 氣가 닳는 勞則氣耗를 더한다.","box":[156,32,330,994],"src":["BIN-CHIL-03","BIN-CHIL-04","JGG-014"],"tts":"맨 왼쪽 배우는 성이 나 얼굴이 시뻘겋고 귀에서 김을 뿜는다. 무대 승강대가 그를 들어 올리고, 풍선은 곧장 위로 치솟는다. 성내면 기가 치솟는다, 노즉기상. 간기가 거꾸로 오르면 피가 따라 오른다. 얼굴과 눈이 붉고, 피를 토하고, 심하면 쓰러져 정신을 잃는다. 소문 생기통천론, 대로즉형기절 이혈울우상 사인박궐. 크게 성내면 피가 위로 몰려 갑자기 쓰러지는 박궐이 된다. 거통론의 여섯은 노즉기상, 희즉기완, 비즉기소, 공즉기하, 경즉기란, 사즉기결이고, 일하면 기가 닳는 노즉기모를 더한다."},{"n":2,"obj":"둘째 — 배를 잡고 웃는 배우 · 길게 늘어진 느슨한 끈 끝에 둥실 뜬 풍선","fact":"喜則氣緩 — 氣가 느슨해짐(心氣 이완 · 정신 산만)","hook":"느슨하게 늘어진 풍선 끈 = 喜則氣緩","say":"둘째 배우는 배를 잡고 웃는다. 풍선 끈이 길게 늘어져 느슨하다. 기뻐하면 氣가 느슨해진다 — 喜則氣緩. 알맞게 기쁘면 마음이 편해지지만, 지나치면 心氣가 풀어져 정신이 흩어지고 집중하지 못한다.","box":[523,156,287,863],"src":[],"tts":"둘째 배우는 배를 잡고 웃는다. 풍선 끈이 길게 늘어져 느슨하다. 기뻐하면 기가 느슨해진다, 희즉기완. 알맞게 기쁘면 마음이 편해지지만, 지나치면 심기가 풀어져 정신이 흩어지고 집중하지 못한다."},{"n":3,"obj":"셋째 — 눈물 흘리는 여배우 · 바람이 빠져 작게 쭈글쭈글해진 풍선","fact":"悲則氣消 — 氣가 사그라짐(肺氣 소모)","hook":"바람 빠지는 풍선 = 悲則氣消","say":"셋째 배우는 눈물을 흘린다. 풍선은 바람이 새어 작게 쭈글쭈글해졌다. 슬퍼하면 氣가 사그라진다 — 悲則氣消. 슬픔은 肺氣를 닳게 해 숨이 짧고 기운이 없다.","box":[826,293,272,726],"src":[],"tts":"셋째 배우는 눈물을 흘린다. 풍선은 바람이 새어 작게 쭈글쭈글해졌다. 슬퍼하면 기가 사그라진다, 비즉기소. 슬픔은 폐기를 닳게 해 숨이 짧고 기운이 없다."},{"n":4,"obj":"넷째 — 겁에 질려 무대 바닥 뚜껑 문 구멍에 가슴까지 빠진 배우 · 풍선도 구멍 가장자리까지 끌려 내려옴","fact":"恐則氣下 — 恐則精却 … 還則下焦脹, 故氣不行矣","hook":"뚜껑 문 아래로 가라앉음 = 恐則氣下","say":"넷째 배우는 겁에 질려 무대 바닥의 뚜껑 문 구멍으로 가라앉는다. 풍선마저 구멍 가장자리까지 끌려 내려왔다. 두려우면 氣가 내려간다 — 恐則氣下. 擧痛論 — 恐則精却, 却則上焦閉, 閉則氣還, 還則下焦脹, 故氣不行矣. 두려우면 精이 물러나 위가 막히고, 氣가 아래로 돌아가 아래가 부푼다. 대소변을 지리기도 한다.","box":[1064,321,337,698],"src":["BIG-003"],"tts":"넷째 배우는 겁에 질려 무대 바닥의 뚜껑 문 구멍으로 가라앉는다. 풍선마저 구멍 가장자리까지 끌려 내려왔다. 두려우면 기가 내려간다, 공즉기하. 거통론, 공즉정각, 각즉상초폐, 폐즉기환, 환즉하초창, 고기불행의. 두려우면 정이 물러나 위가 막히고, 기가 아래로 돌아가 아래가 부푼다. 대소변을 지리기도 한다."},{"n":5,"obj":"다섯째 — 머리카락이 곤두선 채 펄쩍 뛰는 배우 · 엉킨 끈 · 갈지자로 날뛰는 풍선","fact":"驚則氣亂 — 心無所倚, 神無所歸, 慮無所定","hook":"엉킨 끈 · 갈지자 풍선 = 驚則氣亂","say":"다섯째 배우는 머리카락이 곤두선 채 펄쩍 뛴다. 풍선 끈은 엉키고 풍선은 갈지자로 날뛴다. 놀라면 氣가 어지러워진다 — 驚則氣亂. 擧痛論 — 心無所倚, 神無所歸, 慮無所定. 마음이 기댈 곳이 없고, 神이 돌아갈 곳이 없고, 생각이 자리를 잡지 못한다. 가슴이 두근거리고 어쩔 줄 모른다.","box":[1381,134,308,863],"src":["SU2-BIN-02"],"tts":"다섯째 배우는 머리카락이 곤두선 채 펄쩍 뛴다. 풍선 끈은 엉키고 풍선은 갈지자로 날뛴다. 놀라면 기가 어지러워진다, 경즉기란. 거통론, 심무소의, 신무소귀, 여무소정. 마음이 기댈 곳이 없고, 신이 돌아갈 곳이 없고, 생각이 자리를 잡지 못한다. 가슴이 두근거리고 어쩔 줄 모른다."},{"n":6,"obj":"맨 오른쪽 — 의자에 앉아 턱을 괴고 근심하는 배우 · 풍선 끈에 크게 맺힌 매듭","fact":"思則氣結 — 氣가 맺힘(脾氣 鬱結 → 食慾不振·腹脹)","hook":"끈의 큰 매듭 = 思則氣結","say":"맨 오른쪽 배우는 의자에 앉아 턱을 괴고 근심한다. 풍선 끈에 큰 매듭이 꽁꽁 맺혔다. 골똘히 생각하면 氣가 맺힌다 — 思則氣結. 생각이 지나치면 脾氣가 맺혀 입맛이 없고 배가 더부룩하다. 七情의 氣 변화를 다시 묶으면 — 怒는 위로, 喜는 느슨히, 思는 맺히고, 悲는 사그라지고, 恐은 아래로.","box":[[1719,221,222,806],[1806,401,107,135]],"src":["JS-CORE-10"],"tts":"맨 오른쪽 배우는 의자에 앉아 턱을 괴고 근심한다. 풍선 끈에 큰 매듭이 꽁꽁 맺혔다. 골똘히 생각하면 기가 맺힌다, 사즉기결. 생각이 지나치면 비기가 맺혀 입맛이 없고 배가 더부룩하다. 칠정의 기 변화를 다시 묶으면, 노는 위로, 희는 느슨히, 사는 맺히고, 비는 사그라지고, 공은 아래로."},{"n":7,"kind":"review","obj":"무대 한 바퀴 — 치솟는 풍선 · 느슨한 끈 · 쪼그라드는 풍선 · 뚜껑 문 · 엉킨 끈 · 매듭","fact":"怒上 · 喜緩 · 悲消 · 恐下 · 驚亂 · 思結 (+勞耗)","hook":"위 · 느슨 · 쪼그라듦 · 아래 · 엉킴 · 매듭","say":"다시 본다. 승강대로 치솟는 성난 배우 — 怒則氣上. 느슨한 끈의 웃는 배우 — 喜則氣緩. 쪼그라드는 풍선의 우는 배우 — 悲則氣消. 뚜껑 문으로 가라앉는 배우 — 恐則氣下. 엉킨 끈의 놀란 배우 — 驚則氣亂. 매듭진 끈의 근심하는 배우 — 思則氣結. 그리고 勞則氣耗.","box":[[156,32,330,994],[523,156,287,863],[826,293,272,726],[1064,321,337,698],[1381,134,308,863],[1719,221,222,806]],"src":[],"tts":"다시 본다. 승강대로 치솟는 성난 배우, 노즉기상. 느슨한 끈의 웃는 배우, 희즉기완. 쪼그라드는 풍선의 우는 배우, 비즉기소. 뚜껑 문으로 가라앉는 배우, 공즉기하. 엉킨 끈의 놀란 배우, 경즉기란. 매듭진 끈의 근심하는 배우, 사즉기결. 그리고 노즉기모."}],"has_image":true},{"id":"hp-12","title":"痰飮·瘀血 — 병이 만든 병인(병리산물)","place":"밤의 막힌 하수 처리장","image":"images/lessons/hp-12.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"밤의 막힌 하수 처리장 — 왼쪽은 잿빛 찌꺼기 · 오른쪽은 검붉은 보랏빛 피","fact":"病理産物 — 痰飮·瘀血: 병이 만든 찌꺼기가 다시 병인이 됨","hook":"막힌 하수 처리장 = 병의 찌꺼기가 다시 길을 막음","say":"밤의 낡은 하수 처리장이다. 곳곳이 막혔다. 왼쪽에는 잿빛 찌꺼기, 오른쪽에는 검붉은 보랏빛 피가 고였다. 병이 만든 찌꺼기, 病理産物이 다시 길을 막아 새 병을 만든다. 왼쪽은 痰飮, 오른쪽은 瘀血이다.","box":null,"src":[],"tts":"밤의 낡은 하수 처리장이다. 곳곳이 막혔다. 왼쪽에는 잿빛 찌꺼기, 오른쪽에는 검붉은 보랏빛 피가 고였다. 병이 만든 찌꺼기, 병리산물이 다시 길을 막아 새 병을 만든다. 왼쪽은 담음, 오른쪽은 어혈이다."},{"n":1,"obj":"왼쪽 위 두 탱크 — 걸쭉하고 탁하게 부글거리는 잿빛 찌꺼기 · 맑고 묽게 찰랑이는 물 / 아래 관이 양동이로 토해 내는 찌꺼기 덩이 · 유리관 속에 갇혀 나오지 않는 작은 덩이들","fact":"痰飮 — 津液 정체의 병리산물: 稠濁=痰 · 淸稀=飮 · 有形/無形痰","hook":"걸쭉한 탱크 = 痰 · 맑은 탱크 = 飮 · 토한 덩이 = 有形 · 갇힌 덩이 = 無形","say":"왼쪽 위 탱크 둘. 하나는 걸쭉하고 탁한 잿빛 찌꺼기가 부글거린다 — 진하고 탁한 것이 痰, 稠濁. 하나는 맑고 묽은 물이 찰랑인다 — 맑고 묽은 것이 飮, 淸稀. 몸의 물, 津液이 돌지 못하고 고여 생긴 병리산물이다. 아래 관은 찌꺼기 덩이를 양동이로 토해 낸다 — 뱉어 볼 수 있는 有形痰. 곁의 유리관 속에는 작은 덩이들이 갇혀 나오지 않는다 — 몸속 조직에 숨어 뱉어지지 않는 無形痰, 목의 멍울 瘰癧이나 痰核이다. 물을 다스리는 肺, 脾, 腎, 三焦의 氣化가 어긋나면 痰飮이 생긴다. 『金匱要略』의 네 飮은 痰飮, 懸飮, 溢飮, 支飮이다.","box":[[0,156,406,308],[360,156,435,323],[0,545,450,553],[350,523,453,114]],"src":["BIN-DAM-01-01","BIN-DAM-01-02","BIN-DAM-02"],"tts":"왼쪽 위 탱크 둘. 하나는 걸쭉하고 탁한 잿빛 찌꺼기가 부글거린다, 진하고 탁한 것이 담, 조탁. 하나는 맑고 묽은 물이 찰랑인다, 맑고 묽은 것이 음, 청희. 몸의 물, 진액이 돌지 못하고 고여 생긴 병리산물이다. 아래 관은 찌꺼기 덩이를 양동이로 토해 낸다, 뱉어 볼 수 있는 유형담. 곁의 유리관 속에는 작은 덩이들이 갇혀 나오지 않는다, 몸속 조직에 숨어 뱉어지지 않는 무형담, 목의 멍울 나력이나 담핵이다. 물을 다스리는 폐, 비, 신, 삼초의 기화가 어긋나면 담음이 생긴다. 금궤요략의 네 음은 담음, 현음, 일음, 지음이다."},{"n":2,"obj":"목을 움켜쥔 작업자 — 확대 원 속 목에 걸린 둥근 보라 매실 / 가운데 위 잿빛 찌꺼기로 뒤덮인 제어실 창 · 그 안의 어지러운 운전원","fact":"痰의 致病 — 阻滯氣機(梅核氣) · 蒙蔽心神 · 病證多端","hook":"목에 걸린 매실 = 梅核氣 · 찌꺼기 덮인 제어실 = 蒙蔽心神","say":"작업자가 목을 움켜쥐었다. 확대 원 속, 목구멍에 둥근 매실이 걸렸다. 삼켜도 내려가지 않고 뱉어도 나오지 않는다 — 梅核氣. 痰과 氣가 목에 맺혀 氣의 길을 막았다 — 阻滯氣機. 痰은 氣를 따라 오르내리며 어디든 간다. 가운데 위 제어실 창은 잿빛 찌꺼기로 뒤덮였고, 안의 운전원은 어지러워 눈이 핑핑 돈다. 痰이 마음을 가린다 — 蒙蔽心神. 그래서 痰이 만드는 병은 끝없이 여러 가지다 — 病證多端. 朱丹溪는 온갖 병이 다 痰이 부리는 탈이라 했다 — 百病皆因痰作祟. 王淸任은 『醫林改錯』에서 瘀血을 자세히 밝혔다. 몸속 병리산물이 병의 원인이 된다고 논한 두 사람이다.","box":[[689,552,323,591],[451,667,229,280],[811,170,481,287]],"src":["BIN-DAM-03","BIN-SA-06"],"tts":"작업자가 목을 움켜쥐었다. 확대 원 속, 목구멍에 둥근 매실이 걸렸다. 삼켜도 내려가지 않고 뱉어도 나오지 않는다, 매핵기. 담과 기가 목에 맺혀 기의 길을 막았다, 조체기기. 담은 기를 따라 오르내리며 어디든 간다. 가운데 위 제어실 창은 잿빛 찌꺼기로 뒤덮였고, 안의 운전원은 어지러워 눈이 핑핑 돈다. 담이 마음을 가린다, 몽폐심신. 그래서 담이 만드는 병은 끝없이 여러 가지다, 병증다단. 주단계는 온갖 병이 다 담이 부리는 탈이라 했다, 백병개인담작수. 왕청임은 의림개착에서 어혈을 자세히 밝혔다. 몸속 병리산물이 병의 원인이 된다고 논한 두 사람이다."},{"n":3,"obj":"오른쪽 — 관에서 쏟아져 바닥에 넓게 고인 검붉은 보랏빛 피 웅덩이 · 금 간 관에서 새어 고인 피","fact":"瘀血 — 경맥에 막힌 피 + 경맥을 벗어난 피(離經之血)","hook":"고인 검보라 피 웅덩이 = 瘀血 · 관에서 샌 피 = 離經之血","say":"오른쪽 바닥에는 검붉은 보랏빛 피가 넓게 고였다. 瘀血 — 제대로 흐르지 못하고 막혀 쌓인 피다. 금 간 관에서는 피가 새어 바닥에 고였다. 경맥을 벗어나 쌓인 피도 瘀血이다. 唐容川 『血證論』 — 旣是離經之血, 雖淸血鮮血, 亦是瘀血. 경맥을 벗어난 피라면 맑고 선명해도 瘀血이니, 치료는 먼저 瘀血을 없애는 것이다 — 總以祛瘀爲要. 瘀血은 두 길로 생긴다. 氣虛, 氣滯, 血寒, 血熱로 피가 잘 돌지 못해 엉기거나, 다치거나 피가 난 뒤 경맥 밖에 남은 피다. 먹은 것이 체한 것은 瘀血의 직접 원인이 아니다.","box":[[1028,920,575,223],[1028,689,589,308]],"src":["BIN-EO-01","BIN-EO-02","BIN-EO-03","BIG-011"],"tts":"오른쪽 바닥에는 검붉은 보랏빛 피가 넓게 고였다. 어혈, 제대로 흐르지 못하고 막혀 쌓인 피다. 금 간 관에서는 피가 새어 바닥에 고였다. 경맥을 벗어나 쌓인 피도 어혈이다. 당용천 혈증론, 기시리경지혈, 수청혈선혈, 역시어혈. 경맥을 벗어난 피라면 맑고 선명해도 어혈이니, 치료는 먼저 어혈을 없애는 것이다, 총이거어위요. 어혈은 두 길로 생긴다. 기허, 기체, 혈한, 혈열로 피가 잘 돌지 못해 엉기거나, 다치거나 피가 난 뒤 경맥 밖에 남은 피다. 먹은 것이 체한 것은 어혈의 직접 원인이 아니다."},{"n":4,"obj":"관 속에 불룩하게 박혀 길을 막은 단단한 보라색 덩이 · 배 옆 한곳에 못 같은 침이 박혀 찡그리는 작업자 · 오른쪽에서 뻗어 와 그 자리를 누르려는 손 · 창밖 초승달","fact":"瘀血 — 刺痛·痛處固定·拒按·夜甚 · 腫塊 固定不移","hook":"관 속 보라 덩이 = 腫塊 · 한곳의 침 = 刺痛 · 누르려는 손에 비명 = 拒按 · 초승달 = 夜甚","say":"관 속에 단단한 보라색 덩이가 불룩하게 박혀 길을 막았다 — 한자리에 박혀 움직이지 않는 덩어리, 腫塊다. 피부에 오면 푸르게 붓고, 배 속이면 癥積이다. 오른쪽 작업자는 배 옆 한곳에 못 같은 침이 박힌 듯 찡그린다. 찌르는 듯한 刺痛이고, 아픈 자리가 늘 그곳이다 — 痛處固定. 오른쪽에서 손이 뻗어 와 그 자리를 누르려 하자 그는 비명을 지르며 몸을 비튼다 — 누르면 더 아파 싫어하는 拒按. 창밖에 초승달 — 밤이면 더 아프다, 夜甚.","box":[[1028,487,604,157],[1554,552,493,591],[1794,858,130,86],[833,0,107,104]],"src":["BIN-EO-04-01","BIN-EO-04-02"],"tts":"관 속에 단단한 보라색 덩이가 불룩하게 박혀 길을 막았다, 한자리에 박혀 움직이지 않는 덩어리, 종괴다. 피부에 오면 푸르게 붓고, 배 속이면 징적이다. 오른쪽 작업자는 배 옆 한곳에 못 같은 침이 박힌 듯 찡그린다. 찌르는 듯한 자통이고, 아픈 자리가 늘 그곳이다, 통처고정. 오른쪽에서 손이 뻗어 와 그 자리를 누르려 하자 그는 비명을 지르며 몸을 비튼다, 누르면 더 아파 싫어하는 거안. 창밖에 초승달, 밤이면 더 아프다, 야심."},{"n":5,"obj":"오른쪽 위 관 끝 — 걸쭉하게 줄줄이 뚝뚝 떨어지는 검붉은 보랏빛 피","fact":"瘀血 出血 — 色紫暗·有塊(淡稀는 血虛)","hook":"덩어리져 떨어지는 검보랏빛 피 = 瘀血의 출혈","say":"오른쪽 위 관 끝에서 검붉은 보랏빛 피가 걸쭉한 덩어리로 뚝뚝 떨어진다. 瘀血로 나는 피는 색이 검붉고 어둡고 덩어리가 진다 — 色紫暗 有塊. 묽고 옅은 피는 瘀血이 아니라 血虛다. 瘀血이 병을 만드는 모습은 셋이다. 찌르듯 한곳이 밤에 더 아프고, 덩어리가 박혀 움직이지 않고, 검붉은 덩어리 피가 난다.","box":[1828,271,219,424],"src":["BIN-EO-04-03","BIG-010"],"tts":"오른쪽 위 관 끝에서 검붉은 보랏빛 피가 걸쭉한 덩어리로 뚝뚝 떨어진다. 어혈로 나는 피는 색이 검붉고 어둡고 덩어리가 진다, 색자암 유괴. 묽고 옅은 피는 어혈이 아니라 혈허다. 어혈이 병을 만드는 모습은 셋이다. 찌르듯 한곳이 밤에 더 아프고, 덩어리가 박혀 움직이지 않고, 검붉은 덩어리 피가 난다."},{"n":6,"obj":"찡그린 작업자의 푸르죽죽한 보랏빛 입술 · 코 · 손","fact":"瘀血 望診 — 脣甲靑紫·舌紫暗 瘀點·肌膚甲錯 / 脈 細澁","hook":"보랏빛 입술과 손톱 = 脣甲靑紫","say":"작업자의 입술과 손이 푸르죽죽한 보랏빛이다 — 脣甲靑紫. 瘀血은 겉으로 드러난다. 얼굴빛이 검고 어둡고, 살갗이 비늘처럼 거칠고 — 肌膚甲錯, 혀가 검보랏빛에 어혈 반점이 있고, 혀 밑 정맥이 굵게 구불거린다. 맥은 대개 가늘고 껄끄러운 細澁, 또는 沈弦이고, 심장의 瘀血이면 結代다.","box":[1554,552,493,591],"src":["BIN-EO-05"],"tts":"작업자의 입술과 손이 푸르죽죽한 보랏빛이다, 순갑청자. 어혈은 겉으로 드러난다. 얼굴빛이 검고 어둡고, 살갗이 비늘처럼 거칠고, 기부갑착, 혀가 검보랏빛에 어혈 반점이 있고, 혀 밑 정맥이 굵게 구불거린다. 맥은 대개 가늘고 껄끄러운 세삽, 또는 침현이고, 심장의 어혈이면 결대다."},{"n":7,"kind":"review","obj":"하수 처리장 한 바퀴 — 걸쭉한 탱크 · 맑은 탱크 · 목의 매실 · 찌꺼기 덮인 제어실 / 피 웅덩이 · 관 속 덩이 · 침 · 덩어리 피","fact":"痰飮: 稠濁·淸稀 · 梅核氣·蒙蔽心神 / 瘀血: 刺痛·腫塊·紫暗出血","hook":"걸쭉 · 맑음 · 매실 · 덮인 창 / 웅덩이 · 덩이 · 침 · 덩어리 피","say":"다시 본다. 걸쭉한 탱크는 痰, 맑은 탱크는 飮. 토한 덩이는 有形痰, 벽 속 덩이는 無形痰. 목의 매실 — 梅核氣. 찌꺼기 덮인 제어실 — 蒙蔽心神, 百病皆因痰作祟. 오른쪽 — 고인 피와 샌 피는 瘀血, 離經之血도 瘀血. 관 속 덩이 — 腫塊. 한곳의 침과 누르려는 손과 초승달 — 刺痛, 拒按, 夜甚. 덩어리 피 — 紫暗 有塊. 보랏빛 입술 — 脣甲靑紫.","box":[[0,156,406,308],[689,552,323,591],[811,170,481,287],[1028,920,575,223],[1554,552,493,591]],"src":[],"tts":"다시 본다. 걸쭉한 탱크는 담, 맑은 탱크는 음. 토한 덩이는 유형담, 벽 속 덩이는 무형담. 목의 매실, 매핵기. 찌꺼기 덮인 제어실, 몽폐심신, 백병개인담작수. 오른쪽, 고인 피와 샌 피는 어혈, 이경지혈도 어혈. 관 속 덩이, 종괴. 한곳의 침과 누르려는 손과 초승달, 자통, 거안, 야심. 덩어리 피, 자암 유괴. 보랏빛 입술, 순갑청자."}],"has_image":true},{"id":"hp-13","title":"飮食·勞逸 — 지나쳐도 모자라도 병","place":"고속도로 휴게소","image":"images/lessons/hp-13.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"고속도로 휴게소 — 왼쪽 뷔페 · 가운데 짐꾼 · 오른쪽 쉼터 · 뒤쪽 창가","fact":"飮食·勞逸 — 지나쳐도 모자라도 병","hook":"휴게소 = 먹고 마시고, 일하고 쉬는 곳","say":"고속도로 휴게소다. 왼쪽은 뷔페, 가운데는 짐 나르는 길, 오른쪽은 쉼터, 뒤쪽은 창가다. 먹고 마시는 것, 飮食. 일하고 쉬는 것, 勞逸. 둘 다 지나쳐도 모자라도 병이 된다. 안도 밖도 아닌 원인, 不內外因이다.","box":null,"src":[],"tts":"고속도로 휴게소다. 왼쪽은 뷔페, 가운데는 짐 나르는 길, 오른쪽은 쉼터, 뒤쪽은 창가다. 먹고 마시는 것, 음식. 일하고 쉬는 것, 노일. 둘 다 지나쳐도 모자라도 병이 된다. 안도 밖도 아닌 원인, 불내외인이다."},{"n":1,"obj":"뷔페 앞 뚱뚱한 남자 — 넘치는 접시를 퍼먹고 배가 터질 듯 허리띠 버클이 풀림","fact":"過飽 — 飮食不節(饑飽失常)의 한쪽: 脾胃 손상 · 食積","hook":"넘치는 접시 · 풀린 버클 = 過飽","say":"뷔페 앞 뚱뚱한 남자가 넘치는 접시를 퍼먹는다. 배가 터질 듯해 허리띠 버클이 풀렸다. 너무 많이 먹는 過飽다. 먹는 것을 절제하지 못해 굶주림과 배부름이 고르지 않은 것 — 饑飽失常의 한쪽이다. 脾胃가 다 삭이지 못해 음식이 쌓이고, 배가 더부룩하고 신물이 오르며 설사한다.","box":[69,502,431,582],"src":["BIN-EUM-01-01"],"tts":"뷔페 앞 뚱뚱한 남자가 넘치는 접시를 퍼먹는다. 배가 터질 듯해 허리띠 버클이 풀렸다. 너무 많이 먹는 과포다. 먹는 것을 절제하지 못해 굶주림과 배부름이 고르지 않은 것, 기포실상의 한쪽이다. 비위가 다 삭이지 못해 음식이 쌓이고, 배가 더부룩하고 신물이 오르며 설사한다."},{"n":2,"obj":"곁의 깡마른 남자 — 밥알 몇 톨뿐인 빈 접시 · 창백하고 어지러움","fact":"過飢 → 氣血生化不足(창백 · 어지러움 · 쇠약)","hook":"텅 빈 접시 · 핑 도는 눈 = 過飢","say":"곁의 깡마른 남자는 밥알 몇 톨뿐인 빈 접시를 들고 어지러워 눈이 핑 돈다. 너무 못 먹는 過飢다. 饑飽失常의 다른 쪽이다. 먹은 것이 없으니 氣와 血을 만들 재료가 모자란다 — 氣血生化不足. 얼굴이 창백하고 어지럽고 몸이 마른다.","box":[523,509,208,568],"src":[],"tts":"곁의 깡마른 남자는 밥알 몇 톨뿐인 빈 접시를 들고 어지러워 눈이 핑 돈다. 너무 못 먹는 과기다. 기포실상의 다른 쪽이다. 먹은 것이 없으니 기와 혈을 만들 재료가 모자란다, 기혈생화부족. 얼굴이 창백하고 어지럽고 몸이 마른다."},{"n":3,"obj":"가운데 짐꾼 — 산더미 같은 상자를 지고 입김을 훅훅 내뿜으며 헐떡이고 땀이 튀며 무릎이 후들거림","fact":"過勞 — 勞則氣耗: 喘息汗出, 外內皆越 / 房勞 → 腎精 소모","hook":"헐떡이며 땀 튀는 짐꾼 = 勞則氣耗","say":"가운데 짐꾼이 산더미 같은 상자를 지고 입김을 훅훅 내뿜으며 헐떡인다. 땀이 튀고 무릎이 후들거린다. 일을 지나치게 하면 氣가 닳는다 — 勞則氣耗. 『素問』 擧痛論 — 勞則喘息汗出, 外內皆越, 故氣耗矣. 숨이 차고 땀이 나며 안팎으로 氣가 새어 나간다. 성생활이 지나친 房勞過度는 腎精을 닳게 해, 허리와 무릎이 시큰거리고, 어지럽고, 귀가 울고, 精이 새고, 발기가 잘 안 된다.","box":[797,278,373,798],"src":["BIN-EUM-04"],"tts":"가운데 짐꾼이 산더미 같은 상자를 지고 입김을 훅훅 내뿜으며 헐떡인다. 땀이 튀고 무릎이 후들거린다. 일을 지나치게 하면 기가 닳는다, 노즉기모. 소문 거통론, 노즉천식한출, 외내개월, 고기모의. 숨이 차고 땀이 나며 안팎으로 기가 새어 나간다. 성생활이 지나친 방로과도는 신정을 닳게 해, 허리와 무릎이 시큰거리고, 어지럽고, 귀가 울고, 정이 새고, 발기가 잘 안 된다."},{"n":4,"obj":"뒤쪽 창가 — 책 탑에 둘러싸여 눈이 벌게진 독서가 · 점점 닳은 짚신 셋을 늘어놓은 등산객 · 다리 둘레 바닥에 거미줄이 친 채 서 있는 주차 안내원","fact":"五勞所傷 — 久視傷血 · 久行傷筋 · 久立傷骨(宣明五氣)","hook":"책 탑 = 久視 · 닳은 짚신 셋 = 久行 · 다리 둘레 거미줄 = 久立","say":"뒤쪽 창가를 본다. 책 탑에 둘러싸인 독서가는 눈이 벌겋다 — 오래 보면 血을 상한다, 久視傷血. 등산객 곁에 점점 닳은 짚신 셋 — 오래 걸으면 힘줄을 상한다, 久行傷筋. 주차 안내원은 다리 둘레에 거미줄이 칠 만큼 오래 서 있다 — 오래 서면 뼈를 상한다, 久立傷骨. 『素問』 宣明五氣의 五勞所傷이다. 책 탑, 닳은 짚신, 거미줄은 장부 과에서 본 久의 표시와 같다.","box":[[1193,321,272,258],[1496,321,294,301],[1806,235,186,337]],"src":["BIN-EUM-03"],"tts":"뒤쪽 창가를 본다. 책 탑에 둘러싸인 독서가는 눈이 벌겋다, 오래 보면 혈을 상한다, 구시상혈. 등산객 곁에 점점 닳은 짚신 셋, 오래 걸으면 힘줄을 상한다, 구행상근. 주차 안내원은 다리 둘레에 거미줄이 칠 만큼 오래 서 있다, 오래 서면 뼈를 상한다, 구립상골. 소문 선명오기의 오로소상이다. 책 탑, 닳은 짚신, 거미줄은 장부 과에서 본 구의 표시와 같다."},{"n":5,"obj":"오른쪽 쉼터 — 거미줄 덮인 낮잠 침대에서 자는 남자와 침대에 묶인 바람 빠진 풍선 · 안마의자에 푹 꺼져 살이 물렁해진 남자","fact":"過逸 — 久臥傷氣 · 久坐傷肉: 지나친 편안함도 병","hook":"바람 빠진 풍선 = 久臥傷氣 · 물렁한 살 = 久坐傷肉","say":"오른쪽 쉼터. 거미줄 덮인 침대에서 남자가 잔다. 침대에 묶인 풍선은 바람이 빠졌다 — 풍선은 氣다. 오래 누우면 氣를 상한다, 久臥傷氣. 안마의자에 푹 꺼진 남자는 살이 물렁하다 — 오래 앉으면 살을 상한다, 久坐傷肉. 지나치게 편한 것, 過逸도 병의 원인이다. 氣血이 돌지 않아 기운이 없고, 살이 무르고, 脾胃가 약해진다.","box":[[1229,588,553,431],[1575,653,445,467]],"src":[],"tts":"오른쪽 쉼터. 거미줄 덮인 침대에서 남자가 잔다. 침대에 묶인 풍선은 바람이 빠졌다, 풍선은 기다. 오래 누우면 기를 상한다, 구와상기. 안마의자에 푹 꺼진 남자는 살이 물렁하다, 오래 앉으면 살을 상한다, 구좌상육. 지나치게 편한 것, 과일도 병의 원인이다. 기혈이 돌지 않아 기운이 없고, 살이 무르고, 비위가 약해진다."},{"n":6,"kind":"review","obj":"휴게소 한 바퀴 — 넘치는 접시 · 빈 접시 · 짐꾼 · 책 탑 · 짚신 · 안내원 · 침대와 풍선 · 안마의자","fact":"過飽·過飢 / 過勞 勞則氣耗 / 久視血·久行筋·久立骨·久臥氣·久坐肉","hook":"넘침 · 텅 빔 · 헐떡임 · 책 · 짚신 · 거미줄 · 풍선 · 물렁살","say":"다시 본다. 넘치는 접시는 過飽, 빈 접시는 過飢 — 饑飽失常. 헐떡이는 짐꾼 — 勞則氣耗. 다섯 가지 오래 함 — 책 탑은 久視傷血, 닳은 짚신은 久行傷筋, 거미줄 친 안내원은 久立傷骨, 바람 빠진 풍선의 침대는 久臥傷氣, 물렁한 안마의자 남자는 久坐傷肉.","box":[[69,502,431,582],[523,509,208,568],[797,278,373,798],[1193,321,272,258],[1229,588,553,431],[1575,653,445,467]],"src":[],"tts":"다시 본다. 넘치는 접시는 과포, 빈 접시는 과기, 기포실상. 헐떡이는 짐꾼, 노즉기모. 다섯 가지 오래 함, 책 탑은 구시상혈, 닳은 짚신은 구행상근, 거미줄 친 안내원은 구립상골, 바람 빠진 풍선의 침대는 구와상기, 물렁한 안마의자 남자는 구좌상육."}],"has_image":true},{"id":"hp-14","title":"邪正盛衰 ① 虛實 — 邪氣盛則實 · 精氣奪則虛","place":"두 성의 공방전","image":"images/lessons/hp-14.webp","w":2048,"h":1144,"stations":[{"n":0,"kind":"frame","obj":"두 성 — 왼쪽은 햇빛 속 격렬한 공방전 · 오른쪽은 짙푸른 하늘 아래 무너지는 성","fact":"邪正盛衰 — 虛實은 邪(침입자)와 正(수비대)의 힘겨루기","hook":"붉은 침입자 = 邪 · 푸른 수비대 = 正","say":"나란히 선 두 성이다. 붉은 갑옷 침입자는 병을 일으키는 邪氣, 푸른 갑옷 수비대는 몸을 지키는 正氣다. 둘의 힘겨루기, 邪正盛衰가 虛와 實을 정한다. 왼쪽은 햇빛 속에서 격렬하게 싸우고, 오른쪽은 짙푸른 쪽에서 무너진다.","box":null,"src":[],"tts":"나란히 선 두 성이다. 붉은 갑옷 침입자는 병을 일으키는 사기, 푸른 갑옷 수비대는 몸을 지키는 정기다. 둘의 힘겨루기, 사정성쇠가 허와 실을 정한다. 왼쪽은 햇빛 속에서 격렬하게 싸우고, 오른쪽은 짙푸른 쪽에서 무너진다."},{"n":1,"obj":"왼쪽 성 — 붉은 침입자 떼가 통나무로 성문을 들이받음 · 두꺼운 성벽 위 푸른 수비대가 벌건 얼굴로 고함치고 거칠게 숨을 몰아쉬며 맞서 싸움","fact":"邪氣盛則實 — 邪氣亢盛·正氣未衰 → 격렬한 邪正투쟁","hook":"센 침입자 + 센 수비대의 격전 = 實","say":"왼쪽 성에서는 붉은 침입자 떼가 통나무로 성문을 들이받고, 두꺼운 성벽 위 수비대가 벌건 얼굴로 고함치며 거칠게 숨을 몰아쉬며 맞선다. 『素問』 通評虛實論 — 邪氣盛則實. 邪氣가 성하고 正氣도 아직 쇠하지 않아 격렬하게 싸우는 것이 實이다. 바깥 六淫의 초기와 중기, 또는 食積, 痰, 水濕, 瘀血이 막혀서 온다. 높은 열 壯熱, 날뛰고 번조함, 배를 누르면 싫어하는 拒按, 대소변 불통, 힘 있는 脈實有力. 수비대처럼 목소리가 크고 우렁차고 — 語聲洪亮, 숨이 거칠고 무겁다 — 呼吸粗重. 虛하면 목소리가 낮고 작고 숨이 약하고 짧다. 八綱에서 正과 邪를 나타내는 짝이 虛實이다 — 虛는 正氣가 쇠한 것, 實은 邪氣가 성한 것. 덧붙여 火熱이 안에서 생기는 길은 넷 — 陽盛有餘, 陰虛陽亢, 氣滯血瘀가 뭉쳐 熱과 火가 됨, 五志過極化火. 바깥 邪가 속으로 들어 火가 된 것은 外因이다.","box":[[144,134,868,755],[0,610,493,533]],"src":["BGI-SA-01","BIG-012","BGI-SA-02","BZ-BY-05-03","BZ-BY-05-04","BZ-BY-02-04"],"tts":"왼쪽 성에서는 붉은 침입자 떼가 통나무로 성문을 들이받고, 두꺼운 성벽 위 수비대가 벌건 얼굴로 고함치며 거칠게 숨을 몰아쉬며 맞선다. 소문 통평허실론, 사기성즉실. 사기가 성하고 정기도 아직 쇠하지 않아 격렬하게 싸우는 것이 실이다. 바깥 육음의 초기와 중기, 또는 식적, 담, 수습, 어혈이 막혀서 온다. 높은 열 장열, 날뛰고 번조함, 배를 누르면 싫어하는 거안, 대소변 불통, 힘 있는 맥실유력. 수비대처럼 목소리가 크고 우렁차고, 어성홍량, 숨이 거칠고 무겁다, 호흡조중. 허하면 목소리가 낮고 작고 숨이 약하고 짧다. 팔강에서 정과 사를 나타내는 짝이 허실이다, 허는 정기가 쇠한 것, 실은 사기가 성한 것. 덧붙여 화열이 안에서 생기는 길은 넷, 양성유여, 음허양항, 기체혈어가 뭉쳐 열과 화가 됨, 오지과극화화. 바깥 사가 속으로 들어 화가 된 것은 외인이다."},{"n":2,"obj":"왼쪽 성벽 수문이 열려 거센 물줄기가 붉은 침입자 무더기를 언덕 아래로 쓸어냄","fact":"實者瀉之 — 正治(逆治): 寒者熱之·熱者寒之·虛則補之·實則瀉之","hook":"수문을 열어 침입자를 쓸어냄 = 實者瀉之","say":"성벽 옆 수문이 활짝 열려, 거센 물줄기가 붉은 침입자 무더기를 언덕 아래로 쓸어낸다. 實하면 덜어 낸다 — 實者瀉之. 증의 성질과 반대로 치는 것이 正治, 逆治다 — 찬 것은 덥히고(寒者熱之), 뜨거운 것은 식히고(熱者寒之), 虛하면 채우고, 實하면 덜어 낸다. 진짜 實寒, 實熱에 쓴다.","box":[718,502,597,582],"src":["BZ-CHIK-03"],"tts":"성벽 옆 수문이 활짝 열려, 거센 물줄기가 붉은 침입자 무더기를 언덕 아래로 쓸어낸다. 실하면 덜어 낸다, 실자사지. 증의 성질과 반대로 치는 것이 정치, 역치다, 찬 것은 덥히고 한자열지, 뜨거운 것은 식히고 열자한지, 허하면 채우고, 실하면 덜어 낸다. 진짜 실한, 실열에 쓴다."},{"n":3,"obj":"오른쪽 성 — 금 가고 무너지는 성벽 · 홀로 앉은 지친 늙은 수비병(눈 반쯤 감음 · 창을 세워 쥐고 기대기만 함 · 가는 입김) · 싸움 없이 부서진 문으로 걸어 들어오는 작은 침입자 둘","fact":"精氣奪則虛 — 正氣 부족, 격렬한 항쟁 없음: 神疲乏力·自汗·盜汗","hook":"홀로 졸린 늙은 수비병 · 싸움 없이 들어오는 침입자 = 虛","say":"오른쪽 성은 성벽이 금 가고 무너진다. 늙은 수비병 하나가 지쳐 앉아 눈을 반쯤 감았다. 창을 세워 쥐고 기대기만 할 뿐 휘두르지 못한다. 입김은 가늘다. 작은 침입자 둘이 싸움 없이 부서진 문으로 걸어 들어온다. 精氣奪則虛 — 正氣가 빼앗겨 모자라니, 격렬한 싸움도 없이 무너진다. 타고난 허약, 오랜 병, 땀과 구토와 설사가 지나침, 큰 출혈로 正氣가 닳아 온다. 정신이 피로하고 힘이 없는 神疲乏力, 自汗, 盜汗, 대소변을 지림, 脈微弱無力. 實이 들떠 번조한 亢奮煩躁라면 虛는 맥이 빠져 시든 神疲萎靡다.","box":[[1035,148,741,762],[1273,285,172,251],[1489,747,186,200]],"src":["BGI-SA-03","BZ-BY-05-01"],"tts":"오른쪽 성은 성벽이 금 가고 무너진다. 늙은 수비병 하나가 지쳐 앉아 눈을 반쯤 감았다. 창을 세워 쥐고 기대기만 할 뿐 휘두르지 못한다. 입김은 가늘다. 작은 침입자 둘이 싸움 없이 부서진 문으로 걸어 들어온다. 정기탈즉허, 정기가 빼앗겨 모자라니, 격렬한 싸움도 없이 무너진다. 타고난 허약, 오랜 병, 땀과 구토와 설사가 지나침, 큰 출혈로 정기가 닳아 온다. 정신이 피로하고 힘이 없는 신피핍력, 자한, 도한, 대소변을 지림, 맥미약무력. 실이 들떠 번조한 항분번조라면 허는 맥이 빠져 시든 신피위미다."},{"n":4,"obj":"오른쪽 성 뒤로 들어오는 곡식 자루 실은 보급 수레와 새 수비병 행렬","fact":"虛者補之 — 모자란 正氣를 채움","hook":"곡식 자루 수레와 새 병사 = 虛者補之","say":"오른쪽 성 뒤로 곡식 자루를 실은 보급 수레가 들어오고, 새 수비병들이 줄지어 들어간다. 虛하면 채운다 — 虛者補之. 모자란 正氣를 보태 성을 다시 지킨다.","box":[[1741,437,186,172],[1741,523,306,620]],"src":[],"tts":"오른쪽 성 뒤로 곡식 자루를 실은 보급 수레가 들어오고, 새 수비병들이 줄지어 들어간다. 허하면 채운다, 허자보지. 모자란 정기를 보태 성을 다시 지킨다."},{"n":5,"obj":"햇빛 번진 왼쪽 하늘의 누런 성 · 짙푸른 하늘 아래 푸른빛 오른쪽 성","fact":"八綱 — 陰
