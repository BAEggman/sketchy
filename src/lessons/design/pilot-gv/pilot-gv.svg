<text x="1420" y="140" font-size="24" fill="#5a4030">長强(GV1) → 齦交(GV28) · 28혈</text>
<text x="1420" y="174" font-size="24" fill="#5a4030">陽脈之海(諸陽之海) · 督總一身之陽經</text>
<text x="1420" y="226" font-size="20" fill="#5a4030">실선 = 겉 길(아래 → 위 → 앞 → 입) · 점선 = 속 갈래</text>
<text x="1420" y="254" font-size="20" fill="#5a4030">큰 점 = 시험에 자주 묻는 혈 · 초록 번호 = 이야기 구간</text>
<text x="1420" y="560" font-size="24" fill="#2d7159" font-weight="700">① 長强 → 懸樞 (꼬리 · 허리)</text>
<text x="1420" y="600" font-size="24" fill="#2d7159" font-weight="700">② 脊中 → 大椎 (등 · 목 아래)</text>
<text x="1420" y="640" font-size="24" fill="#2d7159" font-weight="700">③ 瘂門 → 百會 (뒷머리 · 정수리)</text>
<text x="1420" y="680" font-size="24" fill="#2d7159" font-weight="700">④ 前頂 → 齦交 (앞머리 · 얼굴)</text>
<text x="1420" y="760" font-size="20" fill="#7a2a20">起 胞中 → 會陰 下出 → 背面 正中線 上行</text>
<text x="1420" y="790" font-size="20" fill="#7a2a20">腦에 屬 · 腎에 絡 · 心을 貫 · 肝經과 巔에서 만남</text>
<text x="1420" y="820" font-size="20" fill="#7a2a20">病症 脊强而折厥 · 督脈之絡 = 長强</text>
<text x="60" y="1124" font-size="17" fill="#8a7462">혈 위치는 WHO 표준(2008) 기준의 모식도 · 교재 經穴圖(원문 p.88)와 칸 대조는 확인 필요</text>
</svg>